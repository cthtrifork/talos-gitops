# BuildKit on the private runners: pulls go through the zot caches, the origin is the fallback (as in podman-registries).
# Mirrors take host and path. The CA bundle is the one injected into the runner pod; buildx copies it into the builder.
[registry."mirror.gcr.io"]
  mirrors = ["zot.registry-system.svc.cluster.local:5000/docker-hub-cache"]

[registry."docker.io"]
  mirrors = ["zot.registry-system.svc.cluster.local:5000/docker-hub-cache"]

[registry."ghcr.io"]
  mirrors = ["zot.registry-system.svc.cluster.local:5000/ghcr-cache"]

[registry."quay.io"]
  mirrors = ["zot.registry-system.svc.cluster.local:5000/quay-cache"]

[registry."gcr.io"]
  mirrors = ["zot.registry-system.svc.cluster.local:5000/gcr-cache"]

[registry."registry.k8s.io"]
  mirrors = ["zot.registry-system.svc.cluster.local:5000/k8s-cache"]

[registry."zot.registry-system.svc.cluster.local:5000"]
  ca = ["/etc/ssl/certs/ca-certificates.crt"]
