name: Trivy scan
description: Logs in to ghcr.io and scans an image with Trivy. A failed scan does not fail the step; see the outcome output.
inputs:
  image:
    description: Image reference
    required: true
  output:
    description: Path of the JSON report
    required: true
  version:
    description: Trivy version
    required: true
  skip-setup:
    description: Trivy and its database are already set up by an earlier scan in the job
    default: "false"
  severity:
    description: Severities to report (all if empty)
    default: ""
  trivyignores:
    default: ""
  ignore-policy:
    default: ""
  vex:
    description: OpenVEX document to apply, with the suppressed findings in the report
    default: ""
outputs:
  outcome:
    description: success or failure of the scan
    value: ${{ steps.scan.outcome }}
runs:
  using: composite
  steps:
    - name: Login to ghcr.io
      if: inputs.skip-setup != 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # The private runners pull through zot with the mirrors of podman-registries, so the report keeps the original reference
    - name: Pull through podman
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        podman pull --quiet "${IMAGE}"
        sock="${XDG_RUNTIME_DIR}/podman/podman.sock"
        if [[ ! -S "${sock}" ]]; then
          nohup podman system service --time=0 "unix://${sock}" > /dev/null 2>&1 &
          for _ in {1..20}; do [[ -S "${sock}" ]] && break; sleep 0.5; done
        fi
        echo "TRIVY_PODMAN_HOST=unix://${sock}" >> "${GITHUB_ENV}"
    # an empty TRIVY_VEX is ignored
    - name: Scan
      id: scan
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: ${{ inputs.version }}
        skip-setup-trivy: ${{ inputs.skip-setup == 'true' }}
        cache: ${{ inputs.skip-setup != 'true' }}
        scan-type: image
        image-ref: ${{ inputs.image }}
        format: json
        output: ${{ inputs.output }}
        scanners: vuln
        severity: ${{ inputs.severity }}
        trivyignores: ${{ inputs.trivyignores }}
        ignore-policy: ${{ inputs.ignore-policy }}
        ignore-unfixed: false
        hide-progress: true
      env:
        TRIVY_VEX: ${{ inputs.vex }}
        TRIVY_SHOW_SUPPRESSED: ${{ inputs.vex != '' }}
        TRIVY_IMAGE_SRC: ${{ runner.environment == 'self-hosted' && 'podman' || 'docker,containerd,podman,remote' }}
