name: Scan report
description: Uploads a Trivy JSON report and posts the Markdown comment on the PR (updated in place) and in the job summary.
inputs:
  comment:
    description: Path of the Markdown comment
    required: true
  report:
    description: JSON report to upload; its file name is the artifact name, so it must be unique in the run
    required: true
  header:
    description: Identifies the sticky comment
    required: true
runs:
  using: composite
  steps:
    - name: Upload full report
      id: upload
      if: hashFiles(inputs.report) != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ inputs.report }}
        archive: false
        retention-days: 14
    - name: Add report link
      if: steps.upload.outputs.artifact-url != ''
      shell: bash
      env:
        URL: ${{ steps.upload.outputs.artifact-url }}
        COMMENT: ${{ inputs.comment }}
      run: echo "[Trivy report (JSON)](${URL})" >> "${COMMENT}"
    - name: Job summary
      shell: bash
      env:
        COMMENT: ${{ inputs.comment }}
      run: cat "${COMMENT}" >> "${GITHUB_STEP_SUMMARY}"
    - name: Comment on the PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: ${{ inputs.header }}
        path: ${{ inputs.comment }}
