# Only the autolabeler is used (keep the types in step with workflows/pr-title.yaml); releases come from
# build-release-image.yaml.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) $AUTHORS'
change-title-escapes: '\<*_&'
no-changes-template: '- No user-facing changes'
template: |
  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG

# drop the `feat(scope):` prefix; the section says it
replacers:
  - target: change-title
    search: '/^[a-z]+(?:\([^)]*\))?!?: (.*)$/'
    replace: '\u$1'

# first matching category wins (exclusive); the highest semver-increment among merged PRs wins
categories:
  - type: pre-exclude
    when:
      label: skip-changelog
  - title: Breaking changes
    semver-increment: major
    exclusive: true
    when:
      - conventional:
          breaking: true
      - label: breaking-change
  - title: Security
    exclusive: true
    when:
      - conventional:
          type: security
      - label: security
  - title: New features
    semver-increment: minor
    exclusive: true
    when:
      - conventional:
          type: feat
      - label: feature
  - title: Bug fixes
    exclusive: true
    when:
      - conventional:
          type: fix
      - label: bug
  - title: Performance
    exclusive: true
    when:
      - conventional:
          type: perf
      - label: performance
  - title: Documentation
    exclusive: true
    when:
      - conventional:
          type: docs
      - label: documentation
  - title: Dependencies
    collapse-after: 5
    exclusive: true
    when:
      - conventional:
          type: deps
      - label: dependencies
  - title: CI, build and release
    exclusive: true
    when:
      - conventional:
          types: [ci, build]
      - labels: [ci, build]
  - title: Maintenance
    exclusive: true
    when:
      - conventional:
          types: [refactor, test, chore, revert]
      - labels: [maintenance, refactor]
  - title: Other changes

# sync-labels also removes `dependencies` and `security`, which Renovate sets, so its PRs are titled to match
# (`deps:`, `security:`; renovate.json5).
sync-labels: true

autolabeler:
  - labels: [feature]
    title: ['/^feat(\([^)]*\))?!?:/']
  - labels: [bug]
    title: ['/^fix(\([^)]*\))?!?:/']
  - labels: [security]
    title: ['/^security(\([^)]*\))?!?:/']
  - labels: [performance]
    title: ['/^perf(\([^)]*\))?!?:/']
  - labels: [refactor]
    title: ['/^refactor(\([^)]*\))?!?:/']
  - labels: [documentation]
    title: ['/^docs(\([^)]*\))?!?:/']
  - labels: [maintenance]
    title: ['/^(test|chore|revert)(\([^)]*\))?!?:/']
  - labels: [ci]
    title: ['/^ci(\([^)]*\))?!?:/']
  - labels: [build]
    title: ['/^build(\([^)]*\))?!?:/']
  - labels: [dependencies]
    title: ['/^deps(\([^)]*\))?!?:/']
  - labels: [breaking-change]
    title: ['/^[a-z]+(\([^)]*\))?!:/']
