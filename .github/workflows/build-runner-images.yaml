name: Build and release the runner images

# The GitHub Actions runner and the Claude runner each have their own release stream (see docs/releasing.md). Every build
# of main (a merge to the image's directory, the weekly rebuild that picks up new packages, a manual run) publishes
# <tool version>-YYYYMMDD.<run number> (semver: the wrapped tool's version, then the build as the prerelease; the actions/runner
# version for the runner, the Claude Code version for the Claude image) and a release named <prefix>-<that tag> (the
# prefix keeps it apart from the fileserver vX.Y.Z releases) with the commits that touched the image as notes.
# A pull request builds the images to check them and does not push.
on:
  push:
    branches:
      - main
    paths:
      - images/github-actions-runner/**
      - images/claude-runner/**
      - .github/workflows/build-runner-images.yaml
  pull_request:
    branches:
      - main
    paths:
      - images/github-actions-runner/**
      - images/claude-runner/**
      - .github/workflows/build-runner-images.yaml
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a push to main is never cancelled: its build is what publishes the image and the release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUNNER_VERSION: "2.338.2" # renovate: datasource=github-releases depName=actions/runner
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build and publish (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: github-actions-runner
            tag-prefix: runner
          - name: claude-runner
            tag-prefix: claude
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the previous release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The tags carry the version of what the image wraps: the actions/runner version of the base image (RUNNER_VERSION
      # above, passed to the build) and the Claude Code version, which Renovate bumps in its Dockerfile.
      - name: Tool version
        id: tool
        env:
          NAME: ${{ matrix.image.name }}
        run: |
          if [[ "$NAME" == claude-runner ]]; then
            version="$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' images/claude-runner/Dockerfile)"
          else
            version="$RUNNER_VERSION"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tool.outputs.value }}-{{date 'YYYYMMDD'}}.${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || ' (no push on pull requests)' }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/${{ matrix.image.name }}
          file: ./images/${{ matrix.image.name }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Summarize build
        if: ${{ always() }}
        env:
          TAG: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.image.name }}"
            echo "- Reference: \`${IMAGE}:${TAG}\`"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Notes are the commits that touched the image since the previous release of this image (squash merges, so the
      # subject is the PR title).
      - name: Publish the release
        if: ${{ github.ref == 'refs/heads/main' && env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.version }}
          NAME: ${{ matrix.image.name }}
          PREFIX: ${{ matrix.image.tag-prefix }}
        run: | #sh
          previous="$(gh release list --exclude-drafts --limit 50 --json tagName --jq "[.[] | select(.tagName | startswith(\"$PREFIX-\"))][0].tagName // empty")"
          : > changes.txt
          if [[ -n "$previous" ]]; then
            git log --format='- %s' "$previous..$GITHUB_SHA" -- "images/$NAME" > changes.txt
          fi
          [[ -s changes.txt ]] || echo "- No changes, rebuilt with the latest packages" > changes.txt
          # shellcheck disable=SC2016 # the backticks are markdown
          {
            printf '## Image\n\n- `%s:%s`\n\n## Changes\n\n' "$IMAGE" "$TAG"
            cat changes.txt
            printf '\n[Provenance attestation](%s/%s/attestations)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          } > notes.md
          # not the repository's latest release: that stays the vX.Y.Z one
          gh release create "$PREFIX-$TAG" --target "$GITHUB_SHA" --title "$PREFIX-$TAG" --notes-file notes.md --latest=false
