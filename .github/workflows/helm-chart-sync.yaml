name: Sync Helm Charts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 11,4 * * *"

env:
  CHART_SYNCER_VERSION: "v2.5.1" # renovate: datasource=github-releases depName=bitnami/charts-syncer
  SYNC_FROM_DATE: "2026-06-01"

jobs:
  mirror-helm-charts:
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        config-file:
          - load-fairwinds-charts.yaml
          - load-redpanda-charts.yaml
          - load-kubernetes-metrics-server.yaml
          - load-juicefs-charts.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install charts-syncer
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
        with:
          repo: bitnami/charts-syncer
          tag: ${{ env.CHART_SYNCER_VERSION }}
          cache: enable

      - name: Sync ${{ matrix.config-file }} with GHCR
        run: charts-syncer sync --dry-run=$DRY_RUN --config ./scripts/ci/helm/${{ matrix.config-file }} --from-date ${{ env.SYNC_FROM_DATE }} #--latest-version-only
        env:
          TARGET_REPO_AUTH_USERNAME: ${{ github.actor }}
          TARGET_REPO_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
