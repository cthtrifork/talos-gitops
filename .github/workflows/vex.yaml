name: VEX

# Everything about the VEX documents under vex/ and the vex-cache image (images/vex-cache) the trivy-operator scan jobs mount.
#  - lint: every document against the OpenVEX JSON schema, and vex/index.json against the documents.
#  - scan: pull requests (every document on a manual run): Trivy scans each image a changed document is about, with that document
#    as --vex. The report (with the suppressed findings) goes to the log, the job summary and one comment per image on the PR
#    (updated in place), and the job fails if a CVE of the document is not shown as suppressed.
#  - build-and-publish: builds the vex-cache image when vex/ or the image changed. Pull request: dry run. Push to main: published.
#    Manual run: always built and published.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: v0.76.2 # renovate: datasource=github-releases depName=aquasecurity/trivy
  CHECK_JSONSCHEMA_VERSION: "0.39.0" # renovate: datasource=pypi depName=check-jsonschema
  # the OpenVEX schema of the spec commit (v0.2.0), pinned by SHA
  OPENVEX_SCHEMA: https://raw.githubusercontent.com/openvex/spec/93139bd2c65390b504e47f82f11c50451289f93a/openvex_json_schema.json

permissions:
  contents: read

jobs:
  lint:
    name: Lint VEX documents
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate documents against the OpenVEX schema
        if: hashFiles('vex/pkg/**/*.openvex.json') != ''
        run: git ls-files -z 'vex/pkg/*.openvex.json' | xargs -0 pipx run "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}" --schemafile "${OPENVEX_SCHEMA}"
      - name: Check vex/index.json
        # the script stamps updated_at, which is ignored here
        run: scripts/vex-index.sh && git diff --exit-code -I '"updated_at"' -- vex/index.json

  changes:
    name: Find changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      images: ${{ steps.images.outputs.images }}
      count: ${{ steps.images.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get changed files
        id: any
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            vex/**
            images/vex-cache/**
            scripts/ci/vex-*
            scripts/vex-index.sh
            .github/workflows/vex.yaml
      - name: Decide whether to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ANY_CHANGED: ${{ steps.any.outputs.any_changed }}
        run: |
          [[ "${EVENT}" == workflow_dispatch || "${ANY_CHANGED}" == true ]] && echo "build=true" >> "${GITHUB_OUTPUT}" || echo "build=false" >> "${GITHUB_OUTPUT}"
      - name: Get changed documents
        id: changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            vex/pkg/oci/**/*.openvex.json
      - name: List the images of the documents
        id: images
        env:
          CHANGED: ${{ steps.changed.outputs.all_changed_files }}
          EVENT: ${{ github.event_name }}
        # a manual run lists every document; a pull request only the changed ones (none: nothing to scan); a push scans nothing
        run: |
          read -ra docs <<< "${CHANGED}"
          if [[ "${EVENT}" == push || ( "${EVENT}" == pull_request && ${#docs[@]} -eq 0 ) ]]; then images='[]'; else images=$(python3 -I scripts/ci/vex-images.py "${docs[@]}"); fi
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "count=$(jq length <<< "${images}")" >> "${GITHUB_OUTPUT}"

  trivy-db:
    name: Trivy database
    needs: changes
    if: needs.changes.outputs.count != '0'
    uses: ./.github/workflows/update-trivy-db.yaml

  scan:
    name: Scan ${{ matrix.image.ref }}
    needs: [lint, changes, trivy-db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.changes.outputs.images) }}
    env:
      # The databases come from the cache that the trivy-db job fills.
      TRIVY_SKIP_DB_UPDATE: true
      TRIVY_SKIP_JAVA_DB_UPDATE: true
    permissions:
      contents: read
      packages: read # pull ghcr.io/cthtrifork/* images
      pull-requests: write # the PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan with the document as VEX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ matrix.image.ref }}
          format: json
          output: scan.json
          scanners: vuln
          hide-progress: true
        env:
          TRIVY_VEX: ${{ matrix.image.doc }}
          TRIVY_SHOW_SUPPRESSED: true
      - name: Show the report
        env:
          REF: ${{ matrix.image.ref }}
          DOC: ${{ matrix.image.doc }}
        run: |
          trivy convert --format table --show-suppressed --output scan.txt scan.json
          cat scan.txt
          jq -r --arg ref "${REF}" --arg doc "${DOC}" --slurpfile d "${DOC}" -f scripts/ci/vex-comment.jq scan.json > comment.md
      - name: Upload full report
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: scan.json
          name: trivy-${{ strategy.job-index }}
          retention-days: 14
      - name: Add report link
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "[Trivy report (JSON)](${URL})" >> comment.md
          cat comment.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Comment on the PR
        # One comment per image, updated in place. Fork PRs get a read-only token; the job summary has the same text.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: vex ${{ matrix.image.ref }}
          path: comment.md
      - name: Check that every statement is applied
        env:
          DOC: ${{ matrix.image.doc }}
        run: >-
          jq -e -n -r --slurpfile d "${DOC}" --slurpfile s scan.json
          '($d[0].statements | map(.vulnerability.name)) - [$s[0].Results[]?.ExperimentalModifiedFindings[]? | .Finding.VulnerabilityID]
          | if length == 0 then "all statements applied" else error("not suppressed: " + join(", ")) end'

  build-and-publish:
    name: Build and publish (vex-cache)
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for signing with cosign
      packages: write # for pushing and signing the image
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      IMAGE: ghcr.io/${{ github.repository }}/vex-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build tag
        id: prep
        run: echo "BUILD_TAG=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # no layer cache: the download layer must run on every build
      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || ' (no push on pull requests)' }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/vex-cache/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_TAG }}
          no-cache: true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          sbom: false
          provenance: false # keep a plain image manifest: it is mounted as a volume, not run

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summarize build
        if: ${{ always() }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          BUILD_TAG: ${{ steps.prep.outputs.BUILD_TAG }}
        run: |
          {
            echo "### vex-cache"
            echo "- Reference: \`${IMAGE}:latest\`, \`${IMAGE}:${BUILD_TAG}\`"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

  complete:
    # Stable single check to require in branch protection: the other jobs are skipped when nothing relevant changed.
    name: VEX complete
    needs: [changes, lint, trivy-db, scan, build-and-publish]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          case " ${RESULTS} " in *" failure "* | *" cancelled "*) exit 1 ;; esac
