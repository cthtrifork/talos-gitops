name: Build and release the Claude runner image

# Caller of build-release-image.yaml.
on:
  push:
    branches:
      - main
    paths:
      - images/claude-runner/**
      - .github/workflows/build-claude-runner.yaml
      - .github/workflows/build-release-image.yaml
      - .github/actions/trivy-scan/**
      - .github/actions/install-trivy/**
  pull_request:
    branches:
      - main
    paths:
      - images/claude-runner/**
      - .github/workflows/build-claude-runner.yaml
      - .github/workflows/build-release-image.yaml
      - .github/actions/trivy-scan/**
      - .github/actions/install-trivy/**
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
      pull-requests: write # the scan comment on pull requests
    uses: ./.github/workflows/build-release-image.yaml
    with:
      name: claude-runner
      tag-prefix: claude
      version-arg: CLAUDE_CODE_VERSION
