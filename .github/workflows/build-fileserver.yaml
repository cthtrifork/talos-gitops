name: Build and release the fileserver image

# A merge to images/fileserver or a manual run publishes and releases the image; a pull request builds it to check it.
# It wraps no tool, so its version is 0.0.0 and the tag is 0.0.0-YYYYMMDD.<run number>. See docs/releasing.md and
# build-release-image.yaml.
on:
  push:
    branches:
      - main
    paths:
      - images/fileserver/**
      - .github/workflows/build-fileserver.yaml
      - .github/workflows/build-release-image.yaml
  pull_request:
    branches:
      - main
    paths:
      - images/fileserver/**
      - .github/workflows/build-fileserver.yaml
      - .github/workflows/build-release-image.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # only a pull request build is superseded. For pushes to main a newer push replaces a pending run, which is fine:
  # the build of the latest commit covers it, and the notes list every commit since the previous release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
    uses: ./.github/workflows/build-release-image.yaml
    with:
      name: fileserver
      tag-prefix: fileserver
