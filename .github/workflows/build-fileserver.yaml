name: Build and release the fileserver image

# Caller of build-release-image.yaml. Wraps no tool, so the version is 0.0.0.
on:
  push:
    branches:
      - main
    paths:
      - images/fileserver/**
      - .github/workflows/build-fileserver.yaml
      - .github/workflows/build-release-image.yaml
  pull_request:
    branches:
      - main
    paths:
      - images/fileserver/**
      - .github/workflows/build-fileserver.yaml
      - .github/workflows/build-release-image.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
      pull-requests: write # the scan comment on pull requests
    uses: ./.github/workflows/build-release-image.yaml
    with:
      name: fileserver
      tag-prefix: fileserver
