name: Update KubeVirt operators

# Regenerates the vendored operator manifests (versions.env, bumped by Renovate) on the PR branch and commits them.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - k8s/infra/kubevirt/**
      - scripts/ci/update-kubevirt-operators.sh
      - .github/workflows/update-kubevirt-operators.yaml

permissions: {}

concurrency:
  group: update-kubevirt-operators-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    # a fork's token is read-only
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the App token below does the writing
    steps:
      # the App token, not GITHUB_TOKEN, so the commit triggers the other workflows
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # push the regenerated manifests

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the PR merge commit is the default ref; push needs the branch
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Regenerate the operator manifests
        run: scripts/ci/update-kubevirt-operators.sh

      - name: Stage changes
        run: git add -A

      # via the GitHub API, so the commit is signed (Verified)
      - uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        id: commit
        with:
          message: "chore(kubevirt): regenerate operator manifests"
          skip-empty: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Push changes
        if: ${{ steps.commit.outputs.commit }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git push origin "HEAD:$BRANCH"
