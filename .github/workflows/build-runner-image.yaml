name: Build and release the runner image

# The GitHub Actions runner image has its own release stream (see docs/releasing.md). Every build of main (a merge to
# images/github-actions-runner, the weekly rebuild that picks up new packages and the Trivy DB, a manual run) publishes
# runner-YYYYMMDD-<run number> and a release of that name, with the commits that touched the image as notes.
# A pull request builds the image to check it and does not push.
on:
  push:
    branches:
      - main
    paths:
      - images/github-actions-runner/**
      - .github/workflows/build-runner-image.yaml
  pull_request:
    branches:
      - main
    paths:
      - images/github-actions-runner/**
      - .github/workflows/build-runner-image.yaml
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a push to main is never cancelled: its build is what publishes the image and the release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/github-actions-runner
  RUNNER_VERSION: "2.338.2" # renovate: datasource=github-releases depName=actions/runner
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=runner-{{date 'YYYYMMDD'}}-${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || ' (no push on pull requests)' }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/github-actions-runner
          file: ./images/github-actions-runner/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=github-actions-runner
          cache-to: type=gha,mode=max,scope=github-actions-runner
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Summarize build
        if: ${{ always() }}
        env:
          TAG: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          {
            echo "### github-actions-runner"
            echo "- Reference: \`${IMAGE}:${TAG}\`"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Notes are the commits that touched the image since the previous runner release (squash merges, so the subject is
  # the PR title).
  release:
    name: Release
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write # create the release and its tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the previous release
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}/github-actions-runner
        run: | #sh
          previous="$(gh release list --exclude-drafts --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("runner-"))][0].tagName // empty')"
          : > changes.txt
          if [[ -n "$previous" ]]; then
            git log --format='- %s' "$previous..$GITHUB_SHA" -- images/github-actions-runner > changes.txt
          fi
          [[ -s changes.txt ]] || echo "- No changes, rebuilt with the latest packages" > changes.txt
          # shellcheck disable=SC2016 # the backticks are markdown
          {
            printf '## Image\n\n- `%s:%s`\n\n## Changes\n\n' "$IMAGE" "$TAG"
            cat changes.txt
            printf '\n[Provenance attestation](%s/%s/attestations)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          } > notes.md
          # not the repository's latest release: that stays the vX.Y.Z one
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest=false
