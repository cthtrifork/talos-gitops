name: Build and release the GitHub Actions runner image

# Caller of build-release-image.yaml.
on:
  push:
    branches:
      - main
    paths:
      - images/github-actions-runner/**
      - .github/workflows/build-github-actions-runner.yaml
      - .github/workflows/build-release-image.yaml
  pull_request:
    branches:
      - main
    paths:
      - images/github-actions-runner/**
      - .github/workflows/build-github-actions-runner.yaml
      - .github/workflows/build-release-image.yaml
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # only PR builds are superseded; the latest push to main covers a pending one
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
      pull-requests: write # the scan comment on pull requests
    uses: ./.github/workflows/build-release-image.yaml
    with:
      name: github-actions-runner
      tag-prefix: runner
      version-arg: RUNNER_VERSION
      scan-hosted: true # 3 GB: zot's first sync stalls from the private runners
