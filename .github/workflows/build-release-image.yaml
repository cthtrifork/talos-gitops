name: Build and release an image

# Reusable; see docs/releasing.md. Tag: <tool version>-YYYYMMDD.<run number> (valid semver); the release is named
# <tag-prefix>-<tag> so the images' releases stay apart.
on:
  workflow_call:
    inputs:
      name:
        description: "Image directory under images/ and image name"
        required: true
        type: string
      tag-prefix:
        description: "Prefix of the release name, for example runner"
        required: true
        type: string
      version-arg:
        description: "Dockerfile ARG that holds the version of the tool the image wraps; empty for an image of our own, which gets 0.0.0"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.name }}

jobs:
  build:
    name: Build and publish (${{ inputs.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the previous release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tool version
        id: tool
        env:
          NAME: ${{ inputs.name }}
          VERSION_ARG: ${{ inputs.version-arg }}
        run: |
          if [[ -z "$VERSION_ARG" ]]; then
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n "s/^ARG ${VERSION_ARG}=\([^@ ]*\).*/\1/p" "images/${NAME}/Dockerfile" | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no x.y.z version in ARG ${VERSION_ARG} of images/${NAME}/Dockerfile (got '${version}')"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tool.outputs.value }}-{{date 'YYYYMMDD'}}.${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || ' (not pushed)' }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/${{ inputs.name }}
          file: ./images/${{ inputs.name }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the weekly run picks up new packages; a warm cache would reuse the old install layers
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Summarize build
        if: ${{ always() }}
        env:
          TAG: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          {
            echo "### ${{ inputs.name }}"
            echo "- Reference: \`${IMAGE}:${TAG}\`"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.version }}
          NAME: ${{ inputs.name }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: | #sh
          previous="$(git describe --tags --abbrev=0 --match "$PREFIX-*" "$GITHUB_SHA" 2>/dev/null || true)"
          : > changes.txt
          if [[ -z "$previous" ]]; then
            echo "- First release" > changes.txt
          else
            git log --format='- %s' "$previous..$GITHUB_SHA" -- "images/$NAME" > changes.txt
            [[ -s changes.txt ]] || echo "- No changes, rebuilt with the latest packages" > changes.txt
          fi
          # shellcheck disable=SC2016 # the backticks are markdown
          {
            printf '## Image\n\n- `%s:%s`\n\n## Changes\n\n' "$IMAGE" "$TAG"
            cat changes.txt
            printf '\n[Provenance attestation](%s/%s/attestations)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          } > notes.md
          # idempotent on re-run
          if gh release view "$PREFIX-$TAG" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$PREFIX-$TAG" --target "$GITHUB_SHA" --title "$PREFIX-$TAG" --notes-file notes.md --latest=false
