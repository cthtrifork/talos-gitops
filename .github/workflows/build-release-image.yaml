name: Build and release an image

# Reusable; see docs/releasing.md. Tag: <tool version>-YYYYMMDD.<run number> (valid semver); the release is named
# <tag-prefix>-<tag> so the images' releases stay apart.
on:
  workflow_call:
    inputs:
      name:
        description: "Image directory under images/ and image name"
        required: true
        type: string
      tag-prefix:
        description: "Prefix of the release name, for example runner"
        required: true
        type: string
      version-arg:
        description: "Dockerfile ARG that holds the version of the tool the image wraps; empty for an image of our own, which gets 0.0.0"
        required: false
        default: ""
        type: string
      build-contexts:
        description: "Extra named build contexts, one name=path per line (docker build --build-context)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # a pull request from this repository pushes its pr-<n> tag, so the scan job can pull it
  PUSH: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
  IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.name }}

jobs:
  build:
    name: Build and publish (${{ inputs.name }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-scan-talos-gitops' || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the image and its provenance attestation (OIDC)
      packages: write # push the image to ghcr.io
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the previous release
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # the BuildKit image through zot on the private runner (Docker Hub is not reachable)
          driver-opts: ${{ runner.environment == 'self-hosted' && 'image=zot.registry-system.svc.cluster.local:5000/docker-hub-cache/moby/buildkit:buildx-stable-1' || '' }}
          # base images through the zot caches
          buildkitd-config: ${{ runner.environment == 'self-hosted' && '.github/buildkitd-zot.toml' || '' }}

      - name: Tool version
        id: tool
        env:
          NAME: ${{ inputs.name }}
          VERSION_ARG: ${{ inputs.version-arg }}
        run: |
          if [[ -z "$VERSION_ARG" ]]; then
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n "s/^ARG ${VERSION_ARG}=\([^@ ]*\).*/\1/p" "images/${NAME}/Dockerfile" | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no x.y.z version in ARG ${VERSION_ARG} of images/${NAME}/Dockerfile (got '${version}')"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tool.outputs.value }}-{{date 'YYYYMMDD'}}.${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cache
        id: cache
        # zot on the private runner, as the homeserver-gui build does (buildcache/** is kept 72 hours); the GitHub cache for fork pull requests
        env:
          NAME: ${{ inputs.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${RUNNER_ENVIRONMENT}" != self-hosted ]]; then
            { echo "from=type=gha,scope=${NAME}"; echo "to=type=gha,mode=max,scope=${NAME}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          repo="zot.registry-system.svc.cluster.local:5000/buildcache/${NAME}"
          # a pull request reads main's cache and writes its own tag
          tag=main
          [[ -z "${PR}" ]] || tag="pr-${PR}"
          {
            echo "from<<EOF"
            echo "type=registry,ref=${repo}:main"
            [[ "${tag}" == main ]] || echo "type=registry,ref=${repo}:${tag}"
            echo "EOF"
            # a lost cache write (zot race) must not fail the build
            echo "to=type=registry,ref=${repo}:${tag},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
          } >> "$GITHUB_OUTPUT"

      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || (env.PUSH == 'true' && ' (pr tag only)' || ' (not pushed)') }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/${{ inputs.name }}
          file: ./images/${{ inputs.name }}/Dockerfile
          build-contexts: ${{ inputs.build-contexts }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the weekly run picks up new packages; a warm cache would reuse the old install layers
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Summarize build
        if: ${{ always() }}
        env:
          TAG: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          {
            echo "### ${{ inputs.name }}"
            echo "- Reference: \`${IMAGE}:${TAG}\`"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.version }}
          NAME: ${{ inputs.name }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: | #sh
          previous="$(git describe --tags --abbrev=0 --match "$PREFIX-*" "$GITHUB_SHA" 2>/dev/null || true)"
          : > changes.txt
          if [[ -z "$previous" ]]; then
            echo "- First release" > changes.txt
          else
            git log --format='- %s' "$previous..$GITHUB_SHA" -- "images/$NAME" > changes.txt
            [[ -s changes.txt ]] || echo "- No changes, rebuilt with the latest packages" > changes.txt
          fi
          # shellcheck disable=SC2016 # the backticks are markdown
          {
            printf '## Image\n\n- `%s:%s`\n\n## Changes\n\n' "$IMAGE" "$TAG"
            cat changes.txt
            printf '\n[Provenance attestation](%s/%s/attestations)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          } > notes.md
          # idempotent on re-run
          if gh release view "$PREFIX-$TAG" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$PREFIX-$TAG" --target "$GITHUB_SHA" --title "$PREFIX-$TAG" --notes-file notes.md --latest=false

  trivy-db:
    name: Trivy database
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/update-trivy-db.yaml

  # the Renovate bump PR gets this comparison too (images.yaml), but only after the merge
  scan:
    name: Scan ${{ inputs.name }}
    needs: [build, trivy-db]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-light-talos-gitops' || 'ubuntu-latest' }}
    timeout-minutes: 45 # zot's first sync of a large new image takes about 25 minutes
    env:
      TRIVY_SKIP_DB_UPDATE: true
      TRIVY_SKIP_JAVA_DB_UPDATE: true
      TRIVY_SKIP_VERSION_CHECK: true
      TRIVY_DISABLE_TELEMETRY: true
      # as in the trivy-operator scans
      TRIVY_IGNORE_STATUS: not_affected,will_not_fix
    permissions:
      contents: read
      packages: read # pull the images
      pull-requests: write # the PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir out
      - name: Scan new image
        id: new
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          output: out/new.json
          version: ${{ needs.trivy-db.outputs.version }}
          severity: CRITICAL,HIGH
          trivyignores: k8s/infra/trivy-system/trivy-operator/ignore/trivyignore.yaml
          ignore-policy: k8s/infra/trivy-system/trivy-operator/ignore/ignore-policy.rego
      - name: Resolve the released image
        id: released
        # zot serves a stale cached :latest whose manifests it can no longer read (the pull resets); the digest from ghcr.io is synced fresh
        run: |
          digest=$(crane digest "${IMAGE}:latest" 2>/dev/null || true)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}$([ -n "${digest}" ] && echo "@${digest}" || echo ":latest")" >> "$GITHUB_OUTPUT"
      - name: Scan the released image
        id: old
        # nothing to compare on the first release
        if: steps.released.outputs.digest != ''
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ steps.released.outputs.ref }}
          output: out/old.json
          version: ${{ needs.trivy-db.outputs.version }}
          skip-setup: true
          severity: CRITICAL,HIGH
          trivyignores: k8s/infra/trivy-system/trivy-operator/ignore/trivyignore.yaml
          ignore-policy: k8s/infra/trivy-system/trivy-operator/ignore/ignore-policy.rego
      - name: Image sizes
        id: size
        run: |
          echo "old=$(scripts/ci/image-size.sh "${IMAGE}:latest")" >> "$GITHUB_OUTPUT"
          echo "new=$(scripts/ci/image-size.sh "${IMAGE}@${DIGEST}")" >> "$GITHUB_OUTPUT"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          OLD: ${{ steps.released.outputs.ref }}
      - name: Write the comment
        env:
          NEW_REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          OLD_SIZE: ${{ steps.size.outputs.old }}
          NEW_SIZE: ${{ steps.size.outputs.new }}
          OLD_REF: ${{ env.IMAGE }}:latest
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # a failed scan has no report: an empty object stands in
          echo '{}' > empty.json
          new=out/new.json old=out/old.json
          [ -s "${new}" ] || new=empty.json
          [ -s "${old}" ] || old=empty.json
          jq -r --arg new_ref "${NEW_REF}" --arg old_ref "${OLD_REF}" --arg old_size "${OLD_SIZE}" --arg new_size "${NEW_SIZE}" --arg run_url "${RUN_URL}" --slurpfile o "${old}" -f scripts/ci/scan-comment.jq "${new}" > out/comment.md
          if [ -s out/new.json ]; then
            trivy convert --format template --template "@scripts/ci/vuln-list.tpl" out/new.json > list.md
            count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' out/new.json)
            if [ "${count}" -gt 0 ]; then
              { echo "<details><summary>All ${count} in the new image</summary>"; echo; head -n 27 list.md; echo
                [ "${count}" -le 25 ] || { echo "…and $((count - 25)) more in the full report."; echo; }
                echo "</details>"; echo; } >> out/comment.md
            fi
            mv out/new.json "out/${{ inputs.name }}.trivy.json"
          fi
      - name: Report
        uses: ./.github/actions/scan-report
        with:
          comment: out/comment.md
          report: out/*.trivy.json
          header: scan-images ${{ inputs.name }}
      - name: Fail if a scan failed
        # findings never fail the job; a scan that could not run does, so does a missing comparison (usually transient: re-run)
        if: steps.new.outputs.outcome == 'failure' || steps.old.outputs.outcome == 'failure'
        run: |
          echo "::error::A Trivy scan failed (see the scan steps above); re-run the job"
          exit 1
