name: e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - k8s/**
      - scripts/ci/e2e/**
      - patches/11-zot-mirrors.yaml
      - .github/workflows/e2e.yaml
  push:
    branches: [ main ]
    paths:
      - k8s/**
      - scripts/ci/e2e/**
      - patches/11-zot-mirrors.yaml
      - .github/workflows/e2e.yaml

permissions:
  contents: read

env:
  CILIUM_CLI_VERSION: v0.20.3 # renovate: datasource=github-releases depName=cilium/cilium-cli
  TALOS_VERSION: v1.13.0 # renovate: datasource=github-releases depName=siderolabs/talos
  CILIUM_VERSION: v1.20.5 # renovate: datasource=github-releases depName=cilium/cilium
  #INTERACTIVE: false

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true


jobs:
  e2e-test:
    # ARC runner in the cluster (k8s/apps/arc-runner/helm-release-talos-gitops-e2e.yaml); the repository is public, so no fork PRs
    runs-on: arc-e2e-talos-gitops
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@e270089eb56404fcf3822b96bad2f423e9f45862 # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@e270089eb56404fcf3822b96bad2f423e9f45862 # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@e270089eb56404fcf3822b96bad2f423e9f45862 # main
      - name: Build Flux Kustomization paths
        timeout-minutes: 3
        run: ./scripts/ci/build-flux-paths.sh k8s/clusters/homelab
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Setup Flux Operator CLI
        uses: controlplaneio-fluxcd/flux-operator/actions/setup@712a9026cd99efdd885d73ed31d0775a2dd2873a # v0.63.0
      - name: Create Talos cluster in Docker
        timeout-minutes: 8
        run: |
          # nodes pull through the cluster zot (RegistryMirrorConfig from the Talos patches), the origin is the fallback
          curl -fsSLo talosctl "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64"
          sudo install -m 0755 talosctl /usr/local/bin/talosctl
          rm talosctl
          # The nodes are containers in the pod's Docker: Cilium translates the zot-lb address and the service address only for
          # sockets in the pod's own network namespace, so both time out from a node. Relay through this pod instead:
          # the node maps the zot service name to the Docker gateway (scripts/ci/e2e/talos.yaml), the TLS certificate still matches.
          zot=zot.registry-system.svc.cluster.local:5000
          nohup socat "TCP-LISTEN:5000,fork,reuseaddr" "TCP:${zot}" > "${RUNNER_TEMP}/zot-relay.log" 2>&1 &
          curl -fsS --cacert /usr/local/share/ca-certificates/private-ca.crt "https://${zot}/v2/" && echo " zot reachable"
          # the e2e cluster must not fall back to the upstream registries: a missing zot cache then fails the run
          sed "s|192.168.1.240:5000|${zot}|g" patches/11-zot-mirrors.yaml |
            yq '(select(.kind == "RegistryMirrorConfig") | .skipFallback) = true' > "${RUNNER_TEMP}/zot-mirrors.yaml"
          talosctl cluster create docker --name homelab --workers 0 \
            --config-patch @scripts/ci/e2e/talos.yaml \
            --config-patch "@${RUNNER_TEMP}/zot-mirrors.yaml"
          talosctl kubeconfig --force --nodes 10.5.0.2
          kubectl get nodes
      - name: Install cilium CLI
        timeout-minutes: 2
        run: |
          CLI_ARCH=amd64
          if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
          curl -sLo cilium-linux-${CLI_ARCH}.tar.gz https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz
          sudo tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
          rm cilium-linux-${CLI_ARCH}.tar.gz
        env:
          CILIUM_CLI_VERSION: ${{env.CILIUM_CLI_VERSION}}

      - name: Install latest cilium
        run: |
         helm repo add cilium https://helm.cilium.io/

         helm install cilium cilium/cilium --version ${CILIUM_VERSION#v} \
          --namespace kube-system \
          --set hostPort.enabled=true \
          --set nodePort.enabled=true \
          --set ipam.mode=kubernetes \
          --set k8sServiceHost=localhost \
         --set k8sServicePort=7445 \
          --set encryption.enabled=true \
          --set encryption.type=wireguard \
          --set operator.replicas=1 \
          --set bpf.masquerade=true \
          --set policyAuditMode=true \
          --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}" \
          --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}" \
          --set cgroup.autoMount.enabled=false \
          --set cgroup.hostRoot=/sys/fs/cgroup
          #--set kubeProxyReplacement=true \
        env:
          CILIUM_VERSION: ${{env.CILIUM_VERSION}}

      - name: Wait for cilium to be ready
        timeout-minutes: 6
        run: |
          interactive="${INTERACTIVE:-true}"
          wait="${WAIT:-5m}"
          cilium status --wait --interactive="${interactive}" --wait-duration="${wait}" # will exit when ready

      - name: Install latest flux-operator
        timeout-minutes: 6
        run: |
          helm install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
          --namespace flux-system \
          --create-namespace \
          --wait

      - name: Deploy flux instance
        run: |
          sed "s|ref: \"refs/heads/main\"|ref: \"${SYNC_REF}\"|" k8s/clusters/homelab/flux-instance.yaml |
            tee "${RUNNER_TEMP}/flux-instance.yaml" | grep -F "ref: "
          kubectl apply -f "${RUNNER_TEMP}/flux-instance.yaml"
          kubectl annotate fluxinstance flux -n flux-system kustomize.toolkit.fluxcd.io/reconcile=disabled
        env:
          SYNC_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
      - name: Verify flux instance is ready
        timeout-minutes: 6
        run: |
          kubectl wait --for=condition=Ready fluxinstance flux -n flux-system --timeout=5m

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1
        with:
          token: ${{ github.token }}
          version: '2.9.5' # renovate: datasource=github-releases depName=fluxcd/flux2

      - name: Wait for successful reconciliation
        timeout-minutes: 8
        run: |
          wait="${WAIT:-5m}"
          flux reconcile source git flux-system --timeout="${wait}"
          flux reconcile kustomization flux-system --timeout="${wait}"
          kubectl wait --for=condition=Ready kustomization flux-system -n flux-system --timeout=5m
          revision="$(kubectl get gitrepository flux-system -n flux-system -o jsonpath='{.status.artifact.revision}')"
          echo "Flux synced ${revision}, expected ${EXPECTED_SHA}"
          case "${revision}" in *"${EXPECTED_SHA}") ;; *) exit 1 ;; esac
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Suspend workload Kustomizations
        run: |
          # gitops-infra-image-policies needs the Kyverno CRD, and the HelmReleases are suspended here
          for ks in app-controllers renovate gitops-infra-image-policies \
              $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=apps -o name | cut -d/ -f2); do
            flux suspend kustomization "${ks}"
          done
      - name: Reconcile bootstrap
        timeout-minutes: 6
        run: |
          flux reconcile kustomization gitops-infra-bootstrap --timeout=5m

      - name: Patch infra Kustomizations for the e2e cluster
        run: |
          for ks in gitops-infra-controllers gitops-infra-kubevirt gitops-infra-post gitops-infra-post-workloads; do
            kubectl patch kustomization "${ks}" -n flux-system --type merge --patch-file "scripts/ci/e2e/${ks}.yaml"
          done
          for ks in $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=infra -o name | cut -d/ -f2); do
            kubectl patch kustomization "${ks}" -n flux-system --type merge --patch-file scripts/ci/e2e/gitops-infra.yaml
          done
      - name: Reconcile infra
        timeout-minutes: 15
        run: |
          flux reconcile kustomization gitops-infra-controllers --timeout=8m
          for ks in $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=infra -o name | cut -d/ -f2); do
            flux reconcile kustomization "${ks}" --timeout=8m
          done
          flux reconcile kustomization gitops-infra-post --timeout=8m
          flux reconcile kustomization gitops-infra-post-workloads --timeout=8m

      - name: Dry-run apps against the API server
        timeout-minutes: 3
        run: |
          # the app-* Kustomizations; renovate needs CRDs from app-controllers, which is suspended here
          for app in adguard arc-runner claude-system fileserver harper-pad; do
            kustomize build "k8s/apps/${app}" --load-restrictor=LoadRestrictionsNone
            echo "---"
          done > "${RUNNER_TEMP}/apps.yaml"
          yq 'select(.kind == "Namespace")' "${RUNNER_TEMP}/apps.yaml" | kubectl apply -f -
          yq 'select(has("sops") | not)' "${RUNNER_TEMP}/apps.yaml" | kubectl apply --dry-run=server -f -

      - name: List deployed resources
        timeout-minutes: 2
        if: always()
        run: |
          flux tree ks flux-system
          flux get helmreleases -A || true

      - name: Debug failure
        timeout-minutes: 3
        if: failure()
        run: |
          talosctl --nodes 10.5.0.2 dmesg | tail -50 || true
          kubectl -n kube-system logs ds/cilium --all-containers --tail=30 || true
          kubectl -n kube-system logs deploy/cilium-operator --tail=30 || true
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          kubectl -n flux-system get all
          kubectl -n flux-system logs deploy/source-controller
          kubectl -n flux-system logs deploy/kustomize-controller
          kubectl -n flux-system logs deploy/helm-controller
          flux get all --all-namespaces
