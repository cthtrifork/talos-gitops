name: End-to-end test (kind)

on:
  workflow_dispatch:
  pull_request:
    # closed only cancels the in-flight run (concurrency group); the job is skipped
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ZOT: zot.registry-system.svc.cluster.local:5000

concurrency:
  # Merged pull_request.closed events use the base branch ref, so group PR events by number.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # the PR diff is cumulative: a later push touching nothing relevant still runs the earlier changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    outputs:
      relevant: ${{ github.event_name == 'workflow_dispatch' || steps.changed.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed e2e files
        id: changed
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            k8s/**
            scripts/kind.yaml
            scripts/ci/e2e/**
            mise.toml
            .github/workflows/e2e.yaml

  e2e-test:
    needs: changes
    # ARC runner in the cluster (k8s/apps/arc-runner); no fork PRs, the repository is public
    runs-on: arc-e2e-talos-gitops
    if: needs.changes.outputs.relevant == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Count the cache server requests
        id: cache_before
        timeout-minutes: 1
        run: |
          case "${ACTIONS_RESULTS_URL:-}" in
            http://gha-cache.gha-cache-system.svc.cluster.local:*) ;;
            *) echo "::error::ACTIONS_RESULTS_URL is '${ACTIONS_RESULTS_URL:-unset}', not the in-cluster cache server"; exit 1 ;;
          esac
          echo "count=$(curl -fsS --max-time 20 "${ACTIONS_RESULTS_URL}metrics" | awk '/^cache_(requests|uploads)_total/ {n += $NF} END {print n + 0}')" >> "${GITHUB_OUTPUT}"
      - name: Install tools
        timeout-minutes: 5
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "yq github:fluxcd/flux-schema kustomize helm aqua:controlplaneio-fluxcd/flux-operator aqua:cilium/cilium-cli kind"
      - name: Verify the in-cluster cache was used
        timeout-minutes: 1
        env:
          BEFORE: ${{ steps.cache_before.outputs.count }}
        run: |
          after="$(curl -fsS --max-time 20 "${ACTIONS_RESULTS_URL}metrics" | awk '/^cache_(requests|uploads)_total/ {n += $NF} END {print n + 0}')"
          echo "cache server requests and uploads: ${BEFORE} -> ${after}"
          [ "${after}" -gt "${BEFORE}" ] || { echo "::error::the mise cache did not go through the in-cluster cache server"; exit 1; }
      - name: Build Flux Kustomization paths
        timeout-minutes: 3
        run: ./scripts/ci/build-flux-paths.sh k8s/clusters/homelab
      - name: Pull the kind node image through zot
        timeout-minutes: 5
        run: |
          # a digest reference would not match the loaded image, so kind must use the tag only
          image="$(yq '.nodes[0].image' scripts/kind.yaml)"
          repo="${image#mirror.gcr.io/}"
          repo="${repo%%:*}"
          skopeo copy "docker://${ZOT}/docker-hub-cache/${repo}@${image#*@}" "docker-daemon:${image%@*}"
          POD_IP="$(hostname -i | awk '{print $1}')" envsubst "\${POD_IP}" < scripts/kind.yaml |
            yq ".nodes[0].image = \"${image%@*}\"" > "${RUNNER_TEMP}/kind.yaml"
      - name: Setup Kubernetes Kind
        timeout-minutes: 5
        env:
          # the node shares the network namespace of the runner pod, where Cilium reaches zot by its service name
          KIND_EXPERIMENTAL_DOCKER_NETWORK: host
        run: |
          # kind fails to export the kubeconfig on the host network (no published API server port) but the cluster is
          # complete, so --retain it and read the admin kubeconfig from the node
          kind create cluster --name homelab --config "${RUNNER_TEMP}/kind.yaml" --retain || true
          docker exec homelab-control-plane test -f /etc/kubernetes/admin.conf
          mkdir -p ~/.kube
          docker exec homelab-control-plane cat /etc/kubernetes/admin.conf > ~/.kube/config
          kubectl get nodes
      - name: Pull through the cluster zot only
        timeout-minutes: 2
        run: ./scripts/ci/e2e/zot-mirror.sh homelab-control-plane /etc/ssl/certs/ca-certificates.crt
      - name: Install cilium
        timeout-minutes: 3
        run: |
          version="$(yq 'select(.kind == "OCIRepository") | .spec.ref.tag' k8s/infra/cilium/helm-repository.yaml)"
          yq 'select(.kind == "HelmRelease") | .spec.values' k8s/infra/cilium/helm-release.yaml |
            sed -E 's/\$\{[A-Za-z_]+:=([^}]*)\}/\1/g' > "${RUNNER_TEMP}/cilium-values.yaml"
          POD_IP="$(hostname -i | awk '{print $1}')" envsubst "\${POD_IP}" < scripts/ci/e2e/cilium-values.yaml > "${RUNNER_TEMP}/cilium-e2e-values.yaml"
          helm install cilium "oci://${ZOT}/quay-cache/cilium/charts/cilium" --version "${version}" \
            --namespace kube-system \
            --values "${RUNNER_TEMP}/cilium-values.yaml" \
            --values "${RUNNER_TEMP}/cilium-e2e-values.yaml"

      - name: Wait for cilium to be ready
        timeout-minutes: 6
        run: |
          interactive="${INTERACTIVE:-true}"
          wait="${WAIT:-5m}"
          cilium status --wait --interactive="${interactive}" --wait-duration="${wait}" # will exit when ready

      - name: Resolve the cluster zot inside kind
        timeout-minutes: 3
        run: |
          # kind's CoreDNS answers cluster.local itself and has no zot Service (the zot release is suspended), so give
          # the OCIRepositories the address the runner pod resolves for the real zot
          zot_host="${ZOT%%:*}"
          zot_ip="$(getent hosts "${zot_host}" | awk '{print $1; exit}')"
          [ -n "${zot_ip}" ] || { echo "::error::${zot_host} does not resolve on the runner"; exit 1; }
          kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' |
            ZOT_IP="${zot_ip}" ZOT_HOST="${zot_host}" awk '
              /^[[:space:]]*kubernetes / && !done {
                print "    hosts {"; print "        " ENVIRON["ZOT_IP"] " " ENVIRON["ZOT_HOST"]; print "        fallthrough"; print "    }"; done = 1
              }
              { print }' > "${RUNNER_TEMP}/Corefile"
          grep -q "${zot_host}" "${RUNNER_TEMP}/Corefile" || { echo "::error::no kubernetes block in the CoreDNS Corefile"; exit 1; }
          kubectl -n kube-system create configmap coredns --from-file=Corefile="${RUNNER_TEMP}/Corefile" \
            --dry-run=client -o yaml | kubectl -n kube-system replace -f -
          kubectl -n kube-system rollout restart deployment/coredns
          kubectl -n kube-system rollout status deployment/coredns --timeout=2m

      - name: Install latest flux-operator
        timeout-minutes: 3
        run: |
          version="$(yq 'select(.kind == "OCIRepository") | .spec.ref.tag' k8s/infra/bootstrap/flux-system/helm-repository.yaml)"
          helm install flux-operator "oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator" --version "${version}" \
            --namespace flux-system \
            --create-namespace \
            --wait --timeout 2m

      - name: Trust the private CA in flux-system
        timeout-minutes: 1
        run: |
          # on the real cluster trust-manager creates this ConfigMap; the FluxInstance mounts it into source-controller
          kubectl -n flux-system create configmap portableinfo-ca-bundle \
            --from-file=ca-bundle.crt=/etc/ssl/certs/ca-certificates.crt

      - name: Deploy flux instance
        timeout-minutes: 2
        run: |
          sed "s|ref: \"refs/heads/main\"|ref: \"${SYNC_REF}\"|" k8s/clusters/homelab/flux-instance.yaml |
            tee "${RUNNER_TEMP}/flux-instance.yaml" | grep -F "ref: "
          kubectl apply -f "${RUNNER_TEMP}/flux-instance.yaml"
          kubectl annotate fluxinstance flux -n flux-system kustomize.toolkit.fluxcd.io/reconcile=disabled
        env:
          SYNC_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
      - name: Verify flux instance is ready
        timeout-minutes: 6
        run: |
          kubectl wait --for=condition=Ready fluxinstance flux -n flux-system --timeout=5m

      - name: Setup Flux CLI
        timeout-minutes: 2
        uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1
        with:
          token: ${{ github.token }}
          version: '2.9.5' # renovate: datasource=github-releases depName=fluxcd/flux2

      - name: Wait for successful reconciliation
        timeout-minutes: 8
        run: |
          wait="${WAIT:-5m}"
          flux reconcile source git flux-system --timeout="${wait}"
          flux reconcile kustomization flux-system --timeout="${wait}"
          kubectl wait --for=condition=Ready kustomization flux-system -n flux-system --timeout=5m
          kubectl get gitrepository flux-system -n flux-system -o jsonpath='Flux synced {.status.artifact.revision}{"\n"}'

      - name: Suspend workload Kustomizations
        timeout-minutes: 2
        run: |
          # gitops-infra-image-policies and gitops-infra-kyverno-policies need the Kyverno CRDs
          for ks in app-controllers renovate gitops-infra-image-policies gitops-infra-kyverno-policies \
              $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=apps -o name | cut -d/ -f2); do
            flux suspend kustomization "${ks}"
          done
      - name: Reconcile bootstrap
        timeout-minutes: 6
        run: |
          flux reconcile kustomization gitops-infra-bootstrap --timeout=5m

      - name: Patch infra Kustomizations for kind
        timeout-minutes: 2
        run: |
          for ks in gitops-infra-controllers gitops-infra-kubevirt gitops-infra-post gitops-infra-post-workloads; do
            kubectl patch kustomization "${ks}" -n flux-system --type merge --patch-file "scripts/ci/e2e/${ks}.yaml"
          done
          for ks in $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=infra -o name | cut -d/ -f2); do
            kubectl patch kustomization "${ks}" -n flux-system --type merge --patch-file scripts/ci/e2e/gitops-infra.yaml
          done
      - name: Reconcile infra
        timeout-minutes: 15
        run: |
          flux reconcile kustomization gitops-infra-controllers --timeout=8m
          for ks in $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=infra -o name | cut -d/ -f2); do
            flux reconcile kustomization "${ks}" --timeout=8m
          done
          flux reconcile kustomization gitops-infra-post --timeout=8m
          flux reconcile kustomization gitops-infra-post-workloads --timeout=8m

      - name: Dry-run apps against the API server
        timeout-minutes: 3
        run: |
          # renovate needs CRDs from app-controllers, which is suspended
          for app in adguard arc-runner claude-system fileserver gha-cache harper-pad; do
            kustomize build "k8s/apps/${app}" --load-restrictor=LoadRestrictionsNone
            echo "---"
          done > "${RUNNER_TEMP}/apps.yaml"
          yq 'select(.kind == "Namespace")' "${RUNNER_TEMP}/apps.yaml" | kubectl apply -f -
          yq 'select(has("sops") | not)' "${RUNNER_TEMP}/apps.yaml" | kubectl apply --dry-run=server -f -

      - name: List deployed resources
        timeout-minutes: 2
        if: always()
        run: |
          flux tree ks flux-system
          flux get helmreleases -A || true

      - name: Debug failure
        timeout-minutes: 3
        if: failure()
        run: |
          docker ps -a || true
          kubectl -n kube-system logs ds/cilium --all-containers --tail=30 || true
          kubectl -n flux-system logs deploy/flux-operator --tail=40 --previous || true
          kubectl get events -A --types=Warning --sort-by=.lastTimestamp | tail -50
          flux get all --all-namespaces
