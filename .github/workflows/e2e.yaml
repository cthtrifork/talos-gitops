name: e2e

on:
  workflow_dispatch:
  pull_request:
    # closed only cancels the in-flight run through the concurrency group; the job is skipped for it
    types: [opened, synchronize, reopened, closed]
    paths:
      - k8s/**
      - scripts/kind.yaml
      - scripts/ci/e2e/**
      - mise.toml
      - .github/workflows/e2e.yaml
  push:
    branches: [ main ]
    paths:
      - k8s/**
      - scripts/kind.yaml
      - scripts/ci/e2e/**
      - mise.toml
      - .github/workflows/e2e.yaml

permissions:
  contents: read

env:
  ZOT: zot.registry-system.svc.cluster.local:5000

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true


jobs:
  e2e-test:
    # ARC runner in the cluster (k8s/apps/arc-runner/helm-release-talos-gitops-e2e.yaml); the repository is public, so no fork PRs
    runs-on: arc-e2e-talos-gitops
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the cache endpoints
        if: env.ACTIONS_RUNNER_DEBUG == '1'
        timeout-minutes: 1
        run: |
          # ACTIONS_RESULTS_URL must be the in-cluster cache server (http://gha-cache...), not GitHub's results-receiver
          echo "v2 flag: ${ACTIONS_CACHE_SERVICE_V2:-unset}"
          echo "results: ${ACTIONS_RESULTS_URL:-unset} (the pod's value; only JavaScript actions get the runner's own)"
          echo "cache:   ${ACTIONS_CACHE_URL:-unset}"
      - name: Install tools
        timeout-minutes: 5
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "yq kubeconform kustomize helm aqua:controlplaneio-fluxcd/flux-operator aqua:cilium/cilium-cli kind"
      - name: Build Flux Kustomization paths
        timeout-minutes: 3
        run: ./scripts/ci/build-flux-paths.sh k8s/clusters/homelab
      - name: Pull the kind node image through zot
        timeout-minutes: 5
        run: |
          image="$(yq '.nodes[0].image' scripts/kind.yaml)"
          new_image="${ZOT}/docker-hub-cache/${repo}@${image}"
           
          docker pull "docker://${new_image}"
          # the rendered kind config refers to the loaded image
          POD_IP="$(hostname -i | awk '{print $1}')" envsubst "\${POD_IP}" < scripts/kind.yaml |
            yq ".nodes[0].image = \"${new_image}\"" > "${RUNNER_TEMP}/kind.yaml"
           cat "${RUNNER_TEMP}/kind.yaml"
      - name: Setup Kubernetes Kind
        timeout-minutes: 5
        env:
          # the node shares the network namespace of the runner pod, where Cilium reaches zot by its service name
          KIND_EXPERIMENTAL_DOCKER_NETWORK: host
        run: |
          kind create cluster --name homelab --config "${RUNNER_TEMP}/kind.yaml" --retain || true
          #mkdir -p ~/.kube
          #docker exec homelab-control-plane cat /etc/kubernetes/admin.conf > ~/.kube/config
          kubectl get nodes
      - name: Pull through the cluster zot only
        timeout-minutes: 2
        run: ./scripts/ci/e2e/zot-mirror.sh homelab-control-plane /usr/local/share/ca-certificates/private-ca.crt
      - name: Install cilium
        timeout-minutes: 3
        run: |
          # the chart, its version and its values are those of the real cluster (pulled through the zot quay cache), with the changes of cilium-values.yaml
          version="$(yq 'select(.kind == "OCIRepository") | .spec.ref.tag' k8s/infra/cilium/helm-repository.yaml)"
          # Flux's ${VAR:=default} placeholders become their defaults
          yq 'select(.kind == "HelmRelease") | .spec.values' k8s/infra/cilium/helm-release.yaml |
            sed -E 's/\$\{[A-Za-z_]+:=([^}]*)\}/\1/g' > "${RUNNER_TEMP}/cilium-values.yaml"
          POD_IP="$(hostname -i | awk '{print $1}')" envsubst "\${POD_IP}" < scripts/ci/e2e/cilium-values.yaml > "${RUNNER_TEMP}/cilium-e2e-values.yaml"
          helm install cilium "oci://${ZOT}/quay-cache/cilium/charts/cilium" --version "${version}" \
            --namespace kube-system \
            --values "${RUNNER_TEMP}/cilium-values.yaml" \
            --values "${RUNNER_TEMP}/cilium-e2e-values.yaml"

      - name: Wait for cilium to be ready
        timeout-minutes: 6
        run: |
          interactive="${INTERACTIVE:-true}"
          wait="${WAIT:-5m}"
          cilium status --wait --interactive="${interactive}" --wait-duration="${wait}" # will exit when ready

      - name: Install latest flux-operator
        timeout-minutes: 3
        run: |
          version="$(yq 'select(.kind == "OCIRepository") | .spec.ref.tag' k8s/infra/cilium/helm-repository.yaml)"
          helm install flux-operator "oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator" --version "${version}" \
            --namespace flux-system \
            --create-namespace \
            --wait --timeout 2m

      - name: Deploy flux instance
        timeout-minutes: 2
        run: |
          sed "s|ref: \"refs/heads/main\"|ref: \"${SYNC_REF}\"|" k8s/clusters/homelab/flux-instance.yaml |
            tee "${RUNNER_TEMP}/flux-instance.yaml" | grep -F "ref: "
          kubectl apply -f "${RUNNER_TEMP}/flux-instance.yaml"
          kubectl annotate fluxinstance flux -n flux-system kustomize.toolkit.fluxcd.io/reconcile=disabled
        env:
          SYNC_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
      - name: Verify flux instance is ready
        timeout-minutes: 6
        run: |
          kubectl wait --for=condition=Ready fluxinstance flux -n flux-system --timeout=5m

      - name: Setup Flux CLI
        timeout-minutes: 2
        uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1
        with:
          token: ${{ github.token }}
          version: '2.9.5' # renovate: datasource=github-releases depName=fluxcd/flux2

      - name: Wait for successful reconciliation
        timeout-minutes: 8
        run: |
          wait="${WAIT:-5m}"
          flux reconcile source git flux-system --timeout="${wait}"
          flux reconcile kustomization flux-system --timeout="${wait}"
          kubectl wait --for=condition=Ready kustomization flux-system -n flux-system --timeout=5m
          kubectl get gitrepository flux-system -n flux-system -o jsonpath='Flux synced {.status.artifact.revision}{"\n"}'

      - name: Suspend workload Kustomizations
        timeout-minutes: 2
        run: |
          # gitops-infra-image-policies needs the Kyverno CRD, and the HelmReleases are suspended here
          for ks in app-controllers renovate gitops-infra-image-policies \
              $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=apps -o name | cut -d/ -f2); do
            flux suspend kustomization "${ks}"
          done
      - name: Reconcile bootstrap
        timeout-minutes: 6
        run: |
          flux reconcile kustomization gitops-infra-bootstrap --timeout=5m

      - name: Patch infra Kustomizations for kind
        timeout-minutes: 2
        run: |
          for ks in gitops-infra-controllers gitops-infra-kubevirt gitops-infra-post gitops-infra-post-workloads; do
            kubectl patch kustomization "${ks}" -n flux-system --type merge --patch-file "scripts/ci/e2e/${ks}.yaml"
          done
          for ks in $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=infra -o name | cut -d/ -f2); do
            kubectl patch kustomization "${ks}" -n flux-system --type merge --patch-file scripts/ci/e2e/gitops-infra.yaml
          done
      - name: Reconcile infra
        timeout-minutes: 15
        run: |
          flux reconcile kustomization gitops-infra-controllers --timeout=8m
          for ks in $(kubectl get kustomization -n flux-system -l gitops.homelab/tier=infra -o name | cut -d/ -f2); do
            flux reconcile kustomization "${ks}" --timeout=8m
          done
          flux reconcile kustomization gitops-infra-post --timeout=8m
          flux reconcile kustomization gitops-infra-post-workloads --timeout=8m

      - name: Dry-run apps against the API server
        timeout-minutes: 3
        run: |
          # the app-* Kustomizations; renovate needs CRDs from app-controllers, which is suspended here
          for app in adguard arc-runner claude-system fileserver gha-cache harper-pad; do
            kustomize build "k8s/apps/${app}" --load-restrictor=LoadRestrictionsNone
            echo "---"
          done > "${RUNNER_TEMP}/apps.yaml"
          yq 'select(.kind == "Namespace")' "${RUNNER_TEMP}/apps.yaml" | kubectl apply -f -
          yq 'select(has("sops") | not)' "${RUNNER_TEMP}/apps.yaml" | kubectl apply --dry-run=server -f -

      - name: Show the cache server requests
        timeout-minutes: 1
        if: always() && env.ACTIONS_RUNNER_DEBUG == '1'
        run: |
          # non-zero counters mean actions/cache (mise-action) went through the in-cluster server, zero that it fell back to GitHub
          curl -fsS --max-time 20 "${ACTIONS_RESULTS_URL}metrics" | grep -E '^cache_(requests|uploads)_total' || true
      - name: List deployed resources
        timeout-minutes: 2
        if: always()
        run: |
          flux tree ks flux-system
          flux get helmreleases -A || true

      - name: Debug failure
        timeout-minutes: 3
        if: failure()
        run: |
          docker ps -a || true
          kubectl -n kube-system logs ds/cilium --all-containers --tail=30 || true
          kubectl -n flux-system logs deploy/flux-operator --tail=40 --previous || true
          #kubectl get pods -A
          kubectl get events -A --types=Warning --sort-by=.lastTimestamp | tail -50
          #kubectl -n flux-system get all
          #kubectl -n flux-system logs deploy/source-controller
          #kubectl -n flux-system logs deploy/kustomize-controller
          #kubectl -n flux-system logs deploy/helm-controller
          flux get all --all-namespaces
