name: Validate manifests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["*"]
    tags-ignore: ["*"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      renovate: ${{ github.event_name == 'workflow_dispatch' || steps.renovate.outputs.any_changed == 'true' }}
      lint: ${{ github.event_name == 'workflow_dispatch' || steps.lint.outputs.any_changed == 'true' }}
      k8s: ${{ github.event_name == 'workflow_dispatch' || steps.k8s.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Renovate config files
        id: renovate
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            renovate.json5
            .github/workflows/validate.yaml
      - name: Files the lint checks read
        id: lint
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            k8s/**
            scripts/**
            images/**
            bootstrap.yaml
            .github/**
            .yamllint.yaml
            mise.toml
      - name: Manifest files
        id: k8s
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            k8s/**
            scripts/validate.sh
            scripts/ci/build-flux-paths.sh
            .fluxschema.yml
            mise.toml
            .github/workflows/validate.yaml

  renovate:
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    env:
      RENOVATE_VERSION: "44.262.2" # renovate: datasource=npm depName=renovate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate renovate config
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate.json5

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "yq pipx:yamllint actionlint"
      - name: yamllint
        run: yamllint --strict -c .yamllint.yaml k8s scripts bootstrap.yaml images .github/dependabot.yml
      - name: Manifest filenames
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_check_manifest_filenames.py'
          python3 scripts/ci/check_manifest_filenames.py
      - name: No YAML anchors
        run: python3 scripts/ci/check-no-yaml-anchors.py
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/ci/*.sh
      - name: actionlint
        run: actionlint -color -ignore 'SC2086' -ignore 'SC2129' -ignore 'constant expression "false"'
      - name: Secrets are SOPS-encrypted
        run: ./scripts/ci/check-secrets-encrypted.sh k8s

  manifests:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "github:fluxcd/flux-schema"
      - name: Validate manifests
        run: ./scripts/validate.sh

  kustomize:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "yq github:fluxcd/flux-schema"
      - name: Build Flux Kustomization paths
        run: ./scripts/ci/build-flux-paths.sh k8s/clusters/homelab

  polaris:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    # audits the PR's manifests with the dashboard's version and config; the in-cluster one only sees them after merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "yq kustomize"
      - name: Install Polaris
        run: |
          # releases are tagged 10.1.8 or v10.2.6
          version="$(yq e '.spec.values.image.tag' k8s/infra/policy-system/polaris/helm-release.yaml | cut -d@ -f1)"
          for tag in "$version" "v$version"; do
            base="https://github.com/FairwindsOps/polaris/releases/download/${tag}"
            curl -fsSL -o polaris.tar.gz "${base}/polaris_linux_amd64.tar.gz" && curl -fsSL -o checksums.txt "${base}/checksums.txt" && break
          done
          grep ' polaris_linux_amd64.tar.gz$' checksums.txt | sed 's/ polaris_linux_amd64.tar.gz$/ polaris.tar.gz/' | sha256sum -c -
          tar -xzf polaris.tar.gz polaris
          sudo install polaris /usr/local/bin/polaris
          polaris version
      - name: Polaris audit
        # the score is 100, so any new finding fails; fix it or exempt it in polaris/helm-release.yaml
        run: |
          yq e '.spec.values.config' k8s/infra/policy-system/polaris/helm-release.yaml > polaris-config.yaml
          polaris audit --config polaris-config.yaml --merge-config --audit-path k8s/ \
            --format json --output-file polaris-report.json --set-exit-code-below-score 100
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-report
          path: polaris-report.json
