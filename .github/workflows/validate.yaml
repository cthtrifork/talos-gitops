name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ '*' ]
    tags-ignore: [ '*' ]

permissions:
    contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      RENOVATE_VERSION: "44.239.1" # renovate: datasource=npm depName=renovate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate renovate config
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate.json5
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: yamllint
        run: |
          pip install --quiet "yamllint==${YAMLLINT_VERSION}"
          yamllint --strict -c .yamllint.yaml k8s scripts bootstrap.yaml images .github/dependabot.yml
        env:
          YAMLLINT_VERSION: "1.38.0" # renovate: datasource=pypi depName=yamllint
      - name: Manifest filenames
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_check_manifest_filenames.py'
          python3 scripts/ci/check_manifest_filenames.py
      - name: No YAML anchors
        run: python3 scripts/ci/check-no-yaml-anchors.py
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/ci/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color -ignore 'SC2086' -ignore 'SC2129' -ignore 'constant expression "false"'
        env:
          ACTIONLINT_VERSION: "1.7.12" # renovate: datasource=github-releases depName=rhysd/actionlint
      - name: Secrets are SOPS-encrypted
        run: ./scripts/ci/check-secrets-encrypted.sh k8s
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      # The directory is relative to the repository root; a bare "apps" matched nothing and validated nothing.
      - name: Validate manifests -- /apps
        run: ./scripts/validate.sh --dir k8s/apps
      - name: Validate manifests -- /infra
        run: ./scripts/validate.sh --dir k8s/infra
      - name: Validate manifests -- /clusters
        run: ./scripts/validate.sh --dir k8s/clusters
      - name: Validate manifests -- /virtualmachines
        run: ./scripts/validate.sh --dir k8s/virtualmachines
  kustomize:
    # Builds each path a Flux Kustomization syncs, the way kustomize-controller does.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: Build Flux Kustomization paths
        run: ./scripts/ci/build-flux-paths.sh k8s/clusters/homelab
  polaris:
    # The in-cluster Polaris dashboard only sees a change after it is merged and applied; this audits the manifests in the PR
    # with the same version and config (k8s/infra/policy-system/polaris/helm-release.yaml).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@c7d60ac24635468bd552e810363732f2cabd1e11 # main
      - name: Install Polaris
        run: |
          # the version Renovate keeps current for the dashboard image; releases are tagged 10.1.8 or v10.2.6
          version="$(yq e '.spec.values.image.tag' k8s/infra/policy-system/polaris/helm-release.yaml | cut -d@ -f1)"
          for tag in "$version" "v$version"; do
            base="https://github.com/FairwindsOps/polaris/releases/download/${tag}"
            curl -fsSL -o polaris.tar.gz "${base}/polaris_linux_amd64.tar.gz" && curl -fsSL -o checksums.txt "${base}/checksums.txt" && break
          done
          grep ' polaris_linux_amd64.tar.gz$' checksums.txt | sed 's/ polaris_linux_amd64.tar.gz$/ polaris.tar.gz/' | sha256sum -c -
          tar -xzf polaris.tar.gz polaris
          sudo install polaris /usr/local/bin/polaris
          polaris version
      - name: Polaris audit
        # The dashboard's config (same checks and exemptions), applied to every manifest in k8s/. The score is 100, so any new
        # finding fails; fix it or add an exemption with a comment in polaris/helm-release.yaml.
        run: |
          yq e '.spec.values.config' k8s/infra/policy-system/polaris/helm-release.yaml > polaris-config.yaml
          polaris audit --config polaris-config.yaml --merge-config --audit-path k8s/ \
            --format json --output-file polaris-report.json --set-exit-code-below-score 100
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-report
          path: polaris-report.json
