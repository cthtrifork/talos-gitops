name: Run Renovate

# Self-hosted Renovate as a GitHub App, so its PRs trigger CI. Config: renovate.json5, renovate-config.js.
on:
  pull_request:
    paths:
      - renovate.json5
      - .github/workflows/renovate-config.js
      - .github/workflows/renovate.yaml
  schedule:
    - cron: "47 3 * * *" # fallback: the in-cluster Renovate runs at :07 and :37
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level (use debug to see why a run aborts)
        type: choice
        options: [info, debug]
        default: info

permissions: {}

concurrency:
  group: renovate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: dry run
    # a fork's token cannot read this repository's Renovate state
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Renovate uses the App token below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # same App as the real run, but read-only; also checks its credentials and installation
      - name: Get a GitHub App token (read-only)
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
          permission-checks: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Renovate (dry run)
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          configurationFile: .github/workflows/renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: '44' # updated by Renovate's github-actions manager
        env:
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: full
          RENOVATE_PAT_TOKEN: ${{ secrets.PAT_RENOVATEBOT }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # the PR's branch, not main, so the PR's own changes are checked
          RENOVATE_BASE_BRANCHES: ${{ github.head_ref }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_USERNAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          # /tmp is mounted into the Renovate container by the action
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPORT_PATH: /tmp/renovate-report.json

      - name: Summarise the dry run
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          report=/tmp/renovate-report.json
          if [ ! -f "$report" ]; then
            echo "No Renovate report was written; see the Renovate step's log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Renovate dry run"
            echo
            echo "Branches and PRs Renovate would create on this PR's branch. Nothing was written."
            echo
            echo "| Branch | PR title | Status | Automerge | Updates |"
            echo "|---|---|---|---|---|"
            jq -r '.repositories[]?.branches[]? | "| `\(.branchName)` | \(.prTitle // "") | \(.result // "") | \(if ([.upgrades[]?.automerge] | any) then "yes" else "no" end) | \([.upgrades[]? | "\(.depName) \(.currentVersion // .currentValue // "") → \(.newVersion // .newValue // "")"] | unique | join("<br>")) |"' "$report"
            echo
            echo "Problems reported:"
            jq -r '.repositories[]?.problems[]? | "- \(.message // .)"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

  renovate:
    name: renovate
    # a manual run from another branch would read that branch's config but update the default branch
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Renovate uses the App token below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Renovate cache dir
        run: |
          mkdir -p /tmp/renovate/cache/renovate/repository
          sudo chown -R 12021:0 /tmp/renovate
          sudo chmod -R g+w /tmp/renovate

      - name: Restore Renovate cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-cache-${{ github.run_id }}
          restore-keys: |
            renovate-cache-

      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the update branches
          permission-pull-requests: write
          permission-issues: write # the dependency dashboard
          permission-workflows: write # update files under .github/workflows
          permission-checks: read # CI results, for automerge
          permission-statuses: write # also Renovate's own renovate/stability-days status
          permission-vulnerability-alerts: read

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          configurationFile: .github/workflows/renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: '44' # updated by Renovate's github-actions manager
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PAT_TOKEN: ${{ secrets.PAT_RENOVATEBOT }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REPOSITORY_CACHE: 'enabled'
          RENOVATE_X_GITHUB_HOST_RULES: 'true'
          RENOVATE_ONBOARDING: 'false'
          # an installation token cannot look up its own identity
          RENOVATE_USERNAME: ${{ steps.app-token.outputs.app-slug }}[bot]
