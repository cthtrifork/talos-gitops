name: Render manifests

on:
  workflow_dispatch:
    inputs:
      render_all:
        description: "Render all components instead of only the changed ones"
        type: boolean
        default: true
  pull_request:
    paths:
      - "k8s/**"
      - "scripts/ci/render-manifests.sh"
      - "Makefile"

concurrency:
  group: render-manifests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  render-manifests:
    # a fork's token is read-only
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      # Renovate PRs and manual runs get the render commit; any other PR must already contain its rendered manifests
      COMMIT_RENDER: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login == 'renovatebot-private[bot]' }}
    permissions:
      contents: write
      packages: read

    steps:
      # the App token, not GITHUB_TOKEN, so the render commit triggers the e2e and validate workflows
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # push the render commit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the PR merge commit is the default ref; push needs the branch
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Get changed files
        id: changed
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            k8s/**
            scripts/ci/render-manifests.sh
            Makefile
          separator: "\n"

      # everything is rendered when not a PR, requested manually, or the render tooling changed
      - name: Select components to render
        id: select
        env:
          EVENT: ${{ github.event_name }}
          RENDER_ALL: ${{ inputs.render_all }}
          CHANGED: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" && "$RENDER_ALL" != "false" ]] \
            || grep -qxE 'Makefile|scripts/ci/render-manifests.sh' <<<"$CHANGED"; then
            echo "Rendering all components"
            echo "dirs=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          dirs=()
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            d=$(dirname "$f")
            while [[ "$d" != "." && "$d" != "/" ]]; do
              if [[ -f "$d/helm-release.yaml" && -f "$d/helm-repository.yaml" ]]; then
                dirs+=("./$d")
                break
              fi
              d=$(dirname "$d")
            done
          done <<<"$CHANGED"
          selected=$(printf '%s\n' "${dirs[@]}" | sort -u | tr '\n' ' ')
          echo "Components to render: ${selected:-none}"
          echo "dirs=$selected" >>"$GITHUB_OUTPUT"
          echo "none=$([[ -z "${selected// }" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install tools
        if: ${{ steps.select.outputs.none != 'true' }}
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "yq helm kustomize flux2"

      - name: Render manifests
        if: ${{ steps.select.outputs.none != 'true' }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: timeout
          command: make render-manifests RENDER_DIRS="${{ steps.select.outputs.dirs }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fail on out-of-date rendered manifests
        if: ${{ env.COMMIT_RENDER != 'true' }}
        env:
          DIRS: ${{ steps.select.outputs.dirs }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git --no-pager diff --stat
            echo "::error::Rendered manifests are out of date. Run 'make render-manifests RENDER_DIRS=\"${DIRS}\"' and commit the result."
            exit 1
          fi

      - name: Stage rendered changes
        if: ${{ env.COMMIT_RENDER == 'true' }}
        run: git add -A

      # via the GitHub API, so the commit is signed (Verified) and authored by the Renovate app
      - uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        if: ${{ env.COMMIT_RENDER == 'true' }}
        id: commit
        with:
          message: "chore: render manifests"
          skip-empty: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Push changes
        if: ${{ steps.commit.outputs.commit }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git push origin "HEAD:$BRANCH"
