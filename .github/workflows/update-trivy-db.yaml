name: Update Trivy database cache

# Fills the cache that trivy-action restores (cache-trivy-<date>); images.yaml calls it so a PR never scans without a
# database. Pins the Trivy version for its callers.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: The Trivy version to scan with
        value: ${{ jobs.update.outputs.version }}

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.76.2 # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_SKIP_VERSION_CHECK: true
  TRIVY_DISABLE_TELEMETRY: true

jobs:
  update:
    name: Update Trivy database
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      version: ${{ env.TRIVY_VERSION }}
    env:
      # through the cluster zot on the private runner; empty keeps the defaults
      TRIVY_DB_REPOSITORY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PRIVATE_RUNNER && 'zot.registry-system.svc.cluster.local:5000/ghcr-cache/aquasecurity/trivy-db' || '' }}
      TRIVY_JAVA_DB_REPOSITORY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PRIVATE_RUNNER && 'zot.registry-system.svc.cluster.local:5000/ghcr-cache/aquasecurity/trivy-java-db' || '' }}
    steps:
      - name: Date
        id: date
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      - name: Cache databases
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
      - name: Setup Trivy
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Download databases
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          trivy image --cache-dir .cache/trivy --download-db-only
          trivy image --cache-dir .cache/trivy --download-java-db-only
