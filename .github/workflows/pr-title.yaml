name: PR title

# Conventional Commits on PR titles (squash merges use the title as the subject listed in the image release notes);
# the autolabeler in .github/release-drafter.yml labels the PR from it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Check PR title (Conventional Commits)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # keep in step with .github/release-drafter.yml
          types: |
            feat
            fix
            security
            perf
            refactor
            docs
            test
            chore
            revert
            ci
            build
            deps

  label:
    name: Label PR from title
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # the autolabeler reads .github/release-drafter.yml
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
