<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fileserver</title>
<link rel="icon" href="data:,">
<meta name="description" content="Admin page of the homelab fileserver: disk space, uploads, files and the upload token.">
<style>
  /* public = blue, private = orange, free = pale blue; dark mode has its own steps */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6b6a65;
    --line: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
    --public: #2a78d6; --private: #eb6834;
    --meter-fill: #2a78d6; --meter-track: #cde2fb;
    --warn: #fab219; --crit: #d03b3b; --good-text: #006300; --crit-text: #a82424; --warn-text: #7a5400;
    --accent: #1c5cab; --danger: #c0392b; --primary: #1c5cab; --danger-solid: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a09f98;
      --line: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --wash: rgba(255,255,255,.07);
      --public: #3987e5; --private: #d95926;
      --meter-fill: #3987e5; --meter-track: #0d366b;
      --good-text: #0ca30c; --crit-text: #f08080; --warn-text: #fab219;
      --accent: #6da7ec; --danger: #e66767; --primary: #2a78d6; --danger-solid: #d03b3b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 1.35rem; margin: 0; } h2 { font-size: 1rem; margin: 0; }
  .sub { color: var(--ink-2); margin: .15rem 0 1.25rem; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 1rem 1.1rem; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .9rem; margin-bottom: 1.1rem; }
  .label { color: var(--ink-2); font-size: .85rem; }
  .value { font-size: 1.7rem; font-weight: 600; margin: .1rem 0 .1rem; }
  .value small { font-size: .9rem; font-weight: 400; color: var(--ink-2); }
  .note { color: var(--ink-2); font-size: .85rem; margin-top: .5rem; display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .st-ok { color: var(--good-text); } .st-warn { color: var(--warn-text); } .st-crit { color: var(--crit-text); }
  .st { font-weight: 600; }
  /* meter and segmented bar */
  .track { height: 10px; border-radius: 999px; background: var(--meter-track); overflow: hidden; margin-top: .6rem; }
  .fill { height: 100%; border-radius: 999px; background: var(--meter-fill); transition: width .3s; }
  .fill.warn { background: var(--warn); } .fill.crit { background: var(--crit); }
  .wide { grid-column: span 2; }
  .kpis > .card { min-height: 13rem; }
  @media (max-width: 40rem) { .wide { grid-column: auto; } }
  .seg { display: flex; gap: 2px; height: 28px; margin-top: .8rem; }
  .seg > span { min-width: 0; border-radius: 4px; display: flex; align-items: center; padding-left: .5rem; color: #0b0b0b; font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .seg > span:focus-visible { outline-offset: 1px; }
  .seg > .pub { background: var(--public); } .seg > .priv { background: var(--private); }
  .seg > .oth { background: var(--muted); } .seg > .free { background: var(--meter-track); color: var(--ink-2); }
  .seg > .free.warn { background: var(--warn); color: #0b0b0b; } .seg > .free.crit { background: var(--crit); color: #fff; }
  .legend { display: flex; gap: 1.1rem; margin-top: .55rem; flex-wrap: wrap; font-size: .88rem; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .4rem; vertical-align: -1px; }
  .sw.pub { background: var(--public); } .sw.priv { background: var(--private); } .sw.oth { background: var(--muted); } .sw.free { background: var(--meter-track); border: 1px solid var(--axis); }
  /* token */
  .tok { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .35rem; }
  code { font: .88rem ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--wash); padding: .25rem .45rem; border-radius: 6px; overflow-wrap: anywhere; }
  /* controls */
  select, input[type=search] { font: inherit; color: inherit; }
  /* secondary is the default, primary the one main action, ghost a quiet row action */
  button, a.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; font: inherit; font-weight: 500; color: var(--ink);
    background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: .35rem .85rem; min-height: 36px; cursor: pointer;
    text-decoration: none; transition: background .12s, border-color .12s, color .12s; }
  button:hover:not(:disabled), a.btn:hover { background: var(--wash); border-color: var(--ink-2); }
  button:active:not(:disabled), a.btn:active { background: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button[aria-busy=true] { cursor: progress; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--primary); filter: brightness(1.12); }
  button.primary:active:not(:disabled) { filter: brightness(.92); }
  button.danger-solid { background: var(--danger-solid); border-color: var(--danger-solid); color: #fff; }
  button.danger-solid:hover:not(:disabled) { background: var(--danger-solid); filter: brightness(1.12); }
  button.ghost, a.btn.ghost { border-color: transparent; background: transparent; }
  button.ghost:hover:not(:disabled), a.btn.ghost:hover { background: var(--wash); border-color: transparent; }
  button.ghost.danger { color: var(--danger); }
  button.ghost.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 14%, transparent); }
  button.icon, a.btn.icon { width: 36px; padding: 0; }
  button.ok { color: var(--ok-text); border-color: currentColor; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .acts { display: flex; gap: .15rem; justify-content: flex-end; }
  .act .lbl { display: none; }
  .act button.armed { width: auto; padding: .35rem .8rem; } .act button.armed .lbl { display: inline; }
  @media (pointer: coarse) { button, a.btn, select, input[type=search] { min-height: 44px; } button.icon, a.btn.icon { width: 44px; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* upload */
  .drop { border: 2px dashed var(--axis); border-radius: 12px; padding: 1.1rem; display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1.1rem; transition: background .15s, border-color .15s; }
  .drop.over { background: var(--wash); border-color: var(--accent); }
  .drop p { margin: 0; } .drop .hint { color: var(--ink-2); font-size: .85rem; }
  .seggroup { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
  .seggroup label { padding: .3rem .75rem; cursor: pointer; display: flex; gap: .4rem; align-items: center; }
  .seggroup input { position: absolute; opacity: 0; }
  .seggroup label:has(input:checked) { background: var(--wash); font-weight: 600; }
  .seggroup label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .prog { display: none; margin-bottom: 1.1rem; }
  .prog.on { display: block; }
  .prog .track { margin-top: .4rem; }
  .prog .fill { background: var(--meter-fill); transition: none; }
  /* list */
  .bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .7rem; }
  input[type=search] { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: .3rem .65rem; min-height: 32px; min-width: 14rem; }
  .chips { display: inline-flex; gap: .3rem; }
  .chips button[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 600; color: var(--ink-2); font-size: .85rem; white-space: nowrap; }
  th button { background: none; border: 0; padding: 0; min-height: 0; font-weight: 600; color: inherit; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.name { overflow-wrap: anywhere; } td.name a { color: var(--accent); }
  td.act { text-align: right; white-space: nowrap; }
  .pill { display: inline-flex; gap: .4rem; align-items: center; font-size: .88rem; }
  .pill i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .pill.pub i { background: var(--public); } .pill.priv i { background: var(--private); }
  .empty { text-align: center; color: var(--ink-2); padding: 2rem 1rem; }
  #toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: .4rem; align-items: center; pointer-events: none; }
  #toast div { background: var(--ink); color: var(--surface); padding: .5rem .9rem; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #toast div.err { background: var(--crit); color: #fff; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface); padding: .35rem .6rem; border-radius: 6px; font-size: .82rem; display: none; }
  #tip b { font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  th[aria-sort="ascending"] button::after { content: ' \25B2'; font-size: .7em; }
  th[aria-sort="descending"] button::after { content: ' \25BC'; font-size: .7em; }
  .sortsel { margin-left: auto; display: flex; gap: .4rem; align-items: center; font-size: .88rem; color: var(--ink-2); }
  select { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: .3rem .5rem; min-height: 32px; }
  @media (max-width: 40rem) {
    main { padding: 1rem .75rem 3rem; }
    .kpis > #k-disk { min-height: 14.5rem; } .kpis > #k-token { min-height: 11.5rem; }
    .card { padding: .85rem .9rem; }
    button, a.btn, select, input[type=search] { min-height: 44px; }
    button.icon, a.btn.icon { width: 44px; }
    input[type=search] { min-width: 0; flex: 1 1 100%; }
    .sortsel { margin-left: 0; flex: 1 1 100%; } .sortsel select { flex: 1; }
    thead { display: none; }
    table, tbody { display: block; }
    tr { display: flex; flex-wrap: wrap; align-items: center; gap: .15rem .9rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
    td { border: 0; padding: 0; }
    td.name { flex: 1 1 100%; font-weight: 600; }
    td.num { text-align: left; } td.hide { color: var(--ink-2); font-size: .88rem; }
    td.act { flex: 1 1 100%; margin-top: .35rem; white-space: normal; text-align: left; }
    .acts { flex-wrap: wrap; justify-content: flex-start; gap: .4rem; }
    .acts button.icon.has-label, .acts a.btn.icon.has-label { padding: .35rem .55rem; }
    .act .lbl { display: inline; } button.icon.has-label, a.btn.icon.has-label { width: auto; padding: .35rem .8rem; }
    .drop { padding: .9rem; } .seggroup { width: 100%; } .seggroup label { flex: 1; justify-content: center; }
    .tok button { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.7C3.9 8.6 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>
<div id="app"></div>
<script type="module">
// htm + Preact (templates), served by the fileserver itself from web/htm-preact.js so the page's CSP stays script-src 'self'.
import { html, render, useState, useEffect, useRef, useLayoutEffect } from "./htm-preact.js";

const REQUEST_HEADERS = { "X-Requested-With": "fileserver" };
const FILTERS = [["all", "All"], ["public", "Public"], ["private", "Private"]];
const SORTS = [
  ["modified:-1", "Newest first"], ["modified:1", "Oldest first"], ["size:-1", "Largest first"], ["size:1", "Smallest first"],
  ["name:1", "Name A to Z"], ["name:-1", "Name Z to A"], ["visibility:1", "Visibility"],
];
const COLUMNS = [["name", "Name"], ["visibility", "Visibility"], ["size", "Size", "num"], ["modified", "Modified", "hide"]];

// ---- Formatting helpers ----

const fmtBytes = (n) => n >= 2 ** 30 ? (n / 2 ** 30).toFixed(n >= 10 * 2 ** 30 ? 1 : 2) + " GiB" : n >= 2 ** 20 ? (n / 2 ** 20).toFixed(1) + " MiB" : n >= 1024 ? (n / 1024).toFixed(0) + " KiB" : n + " B";
function ago(d) {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 90) return "just now";
  const m = s / 60;
  if (m < 90) return Math.round(m) + " min ago";
  const h = m / 60;
  if (h < 36) return Math.round(h) + " h ago";
  return Math.round(h / 24) + " days ago";
}
const mask = (t) => (t ? t.slice(0, 3) + "•".repeat(12) + t.slice(-4) : "none");
const downloadUrl = (f) => `download/${f.visibility}/${encodeURIComponent(f.name)}`;

async function call(url, opts) {
  const r = await fetch(url, { ...opts, headers: { ...REQUEST_HEADERS, ...opts?.headers } });
  if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
  return r;
}

// ---- Toasts and the bar tooltip: each keeps its own state, so showing one does not re-render the page ----

const toastBus = { add: () => {} };
const toast = (text, err) => toastBus.add(text, err);

const ToastHost = () => {
  const [toasts, setToasts] = useState([]);
  const next = useRef(0);
  toastBus.add = (text, err) => {
    const id = next.current++;
    setToasts((t) => [...t, { id, text, err }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), err ? 6000 : 2500);
  };
  return html`<div id="toast" role="status" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} ...${t.err ? { class: "err" } : {}}>${t.text}</div>`)}</div>`;
};

const tipBus = { set: () => {} };
// A bar segment shows its tooltip under the segment, at the pointer (or the segment's middle for keyboard focus).
const tipEvents = (lines) => {
  const show = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    tipBus.set({ left: e.clientX || r.left + r.width / 2, top: r.bottom + 8, lines });
  };
  return { onPointerMove: show, onFocus: show, onPointerLeave: () => tipBus.set(null), onBlur: () => tipBus.set(null) };
};
const Tooltip = () => {
  const [tip, setTip] = useState(null);
  tipBus.set = setTip;
  return html`<div id="tip" role="tooltip" style=${{ display: tip ? "block" : "none", left: tip ? tip.left + "px" : undefined, top: tip ? tip.top + "px" : undefined }}>
    ${tip && html`<b>${tip.lines[0]}</b><br />${tip.lines[1]}`}
  </div>`;
};

// ---- Buttons ----

const Icon = ({ id }) => html`<svg class="i" aria-hidden="true"><use href=${"#i-" + id} /></svg>`;

// A button that confirms itself for 1.5 s: its icon becomes a check mark and its label the confirmation.
function useFlash() {
  const [text, setText] = useState(null);
  const timer = useRef(0);
  useEffect(() => () => clearTimeout(timer.current), []);
  return [text, (t) => { setText(t); clearTimeout(timer.current); timer.current = setTimeout(() => setText(null), 1500); }];
}
// The clipboard API needs https; the textarea fallback covers plain http.
function copy(text, done) {
  const fallback = () => {
    const t = Object.assign(document.createElement("textarea"), { value: text });
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;opacity:0";
    document.body.append(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  };
  const ok = () => done("Copied");
  const bad = () => toast("Copy failed", true);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, () => (fallback() ? ok() : bad()));
  else fallback() ? ok() : bad();
}

const TokenButton = ({ icon, label, onClick, children, ...rest }) => {
  const [flash, setFlash] = useFlash();
  return html`<button type="button" ...${rest} class=${flash ? "ok" : undefined} onClick=${(e) => onClick(setFlash, e)}>
    <${Icon} id=${flash ? "check" : icon} /><span class="t">${flash || label}</span>
  </button>`;
};

// A row action: an icon button whose text shows on phones. `action(flash)` may confirm itself through `flash`.
const RowButton = ({ icon, label, cls, action, ariaLabel }) => {
  const [flash, setFlash] = useFlash();
  const [busy, setBusy] = useState(false);
  const click = async () => {
    setBusy(true);
    try { await action(setFlash); } finally { setBusy(false); }
  };
  return html`<button type="button" class=${`icon has-label ${cls}${flash ? " ok" : ""}`} title=${label} aria-label=${ariaLabel || label} disabled=${busy}
    ...${busy ? { "aria-busy": "true" } : {}} onClick=${click}><${Icon} id=${flash ? "check" : icon} /><span class="lbl">${flash || label}</span></button>`;
};

// Delete takes two clicks: the first arms the button; it disarms after 4 s, on Esc or on blur.
const DeleteButton = ({ file, onDelete }) => {
  const [armed, setArmed] = useState(false);
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (!armed) return;
    const timer = setTimeout(() => setArmed(false), 4000);
    const onKey = (e) => { if (e.key === "Escape") setArmed(false); };
    document.addEventListener("keydown", onKey);
    return () => { clearTimeout(timer); document.removeEventListener("keydown", onKey); };
  }, [armed]);
  const click = async () => {
    if (!armed) return setArmed(true);
    setArmed(false);
    setBusy(true);
    try { await onDelete(); } finally { setBusy(false); }
  };
  return html`<button type="button" class=${`icon has-label ${armed ? "danger danger-solid armed" : "ghost danger"}`} title="Delete" data-name=${file.name}
    aria-label=${armed ? `Confirm: delete ${file.name}` : "Delete " + file.name} disabled=${busy} ...${busy ? { "aria-busy": "true" } : {}}
    ...${armed ? { "data-armed": "1" } : {}} onClick=${click} onBlur=${() => setArmed(false)}>
    <${Icon} id="trash" /><span class="lbl">${armed ? "Confirm delete" : "Delete"}</span>
  </button>`;
};

// ---- Disk space and the upload token ----

// The segments print their size inside only when it fits: the width of a segment follows from the bar's width.
function useWidth(ref) {
  const [width, setWidth] = useState(0);
  useLayoutEffect(() => {
    const el = ref.current;
    setWidth(el.clientWidth);
    const ro = new ResizeObserver(() => setWidth(el.clientWidth));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return width;
}
// The text width of each label in a segment's own style, measured on hidden `.seg > span` elements.
function textWidths(labels) {
  const box = document.createElement("div");
  box.className = "seg";
  box.style.cssText = "position:absolute;visibility:hidden;left:-9999px;width:max-content";
  const spans = labels.map((t) => box.appendChild(Object.assign(document.createElement("span"), { textContent: t })));
  document.body.append(box);
  const widths = spans.map((sp) => {
    const range = document.createRange();
    range.selectNodeContents(sp);
    return range.getBoundingClientRect().width;
  });
  box.remove();
  return widths;
}

const DiskCard = ({ files, info, loaded }) => {
  const { capacityBytes: cap = 0, freeBytes: free = 0 } = info;
  const used = Math.max(0, cap - free);
  const pct = cap ? (used / cap) * 100 : 0;
  const by = (v) => files.filter((f) => f.visibility === v);
  const sum = (v) => by(v).reduce((a, f) => a + f.size, 0);
  const pub = sum("public");
  const priv = sum("private");
  const other = Math.max(0, used - pub - priv);
  const sev = pct >= 92 ? "crit" : pct >= 80 ? "warn" : "";
  const freeShare = cap ? (free / cap) * 100 : 0;
  const freePct = freeShare > 0 && freeShare < 1 ? "<1%" : Math.round(freeShare) + "%";
  const parts = [
    ["pub", "Public", pub, `${by("public").length} files`],
    ["priv", "Private", priv, `${by("private").length} files`],
    ["oth", "Other use", other, "filesystem overhead and other data on the volume"],
    ["free " + sev, "Free", free, freePct + " of the volume"],
  ];
  const shown = parts.filter((p) => p[2]);
  const bar = useRef(null);
  const width = useWidth(bar);
  const room = width - 2 * Math.max(0, shown.length - 1);
  const total = sum2(shown);
  const labels = shown.map(([, name, bytes]) => (name === "Free" ? `${fmtBytes(bytes)} · ${freePct}` : fmtBytes(bytes)));
  const widths = loaded ? textWidths(labels) : [];
  const status = sev === "crit" ? ["crit", "⚠", "Almost full. Uploads will be refused."] : sev === "warn" ? ["warn", "⚠", "Getting full."] : ["ok", "✓", "Plenty of room."];
  return html`<div class="card wide" id="k-disk">
    <div class="label">Disk space</div>
    <div class="value" id="dk-val">${loaded ? html`${fmtBytes(free) + " "}<small>remaining of ${fmtBytes(cap)}</small>` : " "}</div>
    <div class="seg" id="dk-seg" role="group" aria-label="Disk usage by public files, private files, other use and free space" ref=${bar}>
      ${loaded && shown.map(([cls, name, bytes, what], i) => {
        const label = labels[i];
        return html`<span key=${name} class=${cls.trim()} tabindex="0" role="img" style=${{ flex: String(bytes) }} aria-label=${`${name}: ${fmtBytes(bytes)}, ${what}`}
          ...${tipEvents([name, `${fmtBytes(bytes)} · ${what}`])}>${total && widths[i] + 16 <= (room * bytes) / total ? label : ""}</span>`;
      })}
    </div>
    <div class="legend" id="dk-legend">${loaded && parts.filter(([cls, , bytes]) => !(cls === "oth" && !bytes)).map(([cls, name, bytes]) =>
      html`<span key=${name}><i class=${"sw " + cls.split(" ")[0]}></i>${name === "Free" ? `${name} ${freePct}` : `${name} ${fmtBytes(bytes)}`}</span>`)}</div>
    <div class="note" id="dk-note">${loaded && html`<span class=${"st st-" + status[0]}>${status[1] + " " + status[2]}</span>${`${files.length} files · ${Math.round(pct)}% used`}`}</div>
  </div>`;
};
const sum2 = (parts) => parts.reduce((a, p) => a + p[2], 0);

const TokenCard = ({ token, info, loaded }) => {
  const [revealed, setRevealed] = useState(false);
  const t = token;
  const overdue = t.current && (Date.now() - new Date(t.rotatedAt)) / 864e5 > 35; // rotated monthly
  return html`<div class="card" id="k-token">
    <div class="label">Upload token <span class="sr">(internal upload API only)</span></div>
    <div class="tok"><code id="tok-val">${revealed ? t.current || "none" : loaded ? mask(t.current) : "hidden"}</code></div>
    <div class="tok">
      <button id="tok-show" type="button" aria-pressed=${String(revealed)} onClick=${() => setRevealed(!revealed)}>
        <${Icon} id=${revealed ? "eye-off" : "eye"} /><span class="t">${revealed ? "Hide" : "Show"}</span>
      </button>
      <${TokenButton} id="tok-copy" icon="copy" label="Copy" onClick=${(flash) => copy(t.current || "", flash)} />
      <${TokenButton} id="tok-curl" icon="terminal" label="Copy curl" title="Copy a ready-to-run curl command" ...${t.current && !info.uploadUrl ? { style: { display: "none" } } : {}}
        onClick=${(flash) => copy(`curl --fail -T FILE -H "Authorization: Bearer ${t.current}" "${info.uploadUrl}/v1/files/NAME?visibility=private"`, flash)} />
    </div>
    <div class="note" id="tok-note">${!loaded ? null : !t.current
      ? html`<span class="st st-warn">⚠ No token yet. The rotation job has not run.</span>`
      : html`<span class=${"st " + (overdue ? "st-crit" : "st-ok")}>${overdue ? "⚠ Rotation overdue" : "✓ Rotating normally"}</span>${`Rotated ${ago(t.rotatedAt)}`}`}</div>
  </div>`;
};

// ---- Upload: one file at a time, with progress, speed and cancel ----

function useUploads(onDone) {
  const [progress, setProgress] = useState(null); // null while idle
  const [over, setOver] = useState(false);
  const [vis, setVis] = useState("private");
  const queue = useRef([]);
  const xhr = useRef(null);
  const visRef = useRef(vis);
  visRef.current = vis;
  const next = () => {
    const f = queue.current.shift();
    if (!f) { setProgress(null); return onDone(); }
    const visibility = visRef.current;
    setProgress({ text: `Uploading ${f.name} (${visibility})`, sub: "", pct: 0 });
    const fd = new FormData();
    fd.append("file", f);
    const x = (xhr.current = new XMLHttpRequest());
    const t0 = Date.now();
    x.open("POST", "api/files?visibility=" + visibility);
    x.setRequestHeader("X-Requested-With", "fileserver");
    x.upload.onprogress = (p) => {
      const pct = p.lengthComputable ? (p.loaded / p.total) * 100 : 0;
      const rate = p.loaded / Math.max(0.5, (Date.now() - t0) / 1000);
      const queued = queue.current.length;
      setProgress({ text: `Uploading ${f.name} (${visibility})`, pct, sub: `${Math.round(pct)}% · ${fmtBytes(p.loaded)} of ${fmtBytes(p.total)} · ${fmtBytes(rate)}/s` + (queued ? ` · ${queued} more queued` : "") });
    };
    x.onload = () => {
      if (x.status === 201) toast("Uploaded " + f.name);
      else toast(`${f.name}: ${x.responseText.trim() || x.statusText}`, true);
      next();
    };
    x.onerror = () => { toast(`${f.name}: upload failed`, true); queue.current = []; next(); };
    x.onabort = () => { toast("Upload cancelled"); queue.current = []; next(); };
    x.send(fd);
  };
  const enqueue = (files) => {
    const idle = !queue.current.length && !progress;
    queue.current.push(...files);
    if (idle) next();
  };
  return { progress, over, setOver, vis, setVis, enqueue, cancel: () => xhr.current?.abort() };
}

const UploadArea = ({ info, up, loaded }) => {
  const picker = useRef(null);
  const dragging = (on) => (e) => { e.preventDefault(); up.setOver(on); };
  return html`<div class=${up.over ? "drop over" : "drop"} id="drop" onDragEnter=${dragging(true)} onDragOver=${dragging(true)} onDragLeave=${dragging(false)}
    onDrop=${(e) => { dragging(false)(e); up.enqueue([...e.dataTransfer.files]); }}>
      <div>
        <p><strong>Drop files here</strong> or <button type="button" id="pick" class="primary" onClick=${() => picker.current.click()}><${Icon} id="upload" />Choose files</button></p>
        <p class="hint" id="limit">${!loaded ? "One file per request, streamed to disk." : `Up to ${fmtBytes(info.maxFileBytes || 0)} per file. Same name replaces the file.`}</p>
      </div>
      <fieldset class="seggroup" style="border:0;padding:0;margin:0" aria-label="Visibility of new uploads">
        <div class="seggroup">
          <label><input type="radio" name="vis" value="private" checked=${up.vis === "private"} onChange=${() => up.setVis("private")} /> <${Icon} id="lock" /> Private</label>
          <label><input type="radio" name="vis" value="public" checked=${up.vis === "public"} onChange=${() => up.setVis("public")} /> <${Icon} id="globe" /> Public</label>
        </div>
      </fieldset>
      <input type="file" id="file" multiple hidden ref=${picker} onChange=${(e) => { up.enqueue([...e.target.files]); e.target.value = ""; }} />
    </div>
    <div class=${up.progress ? "card prog on" : "card prog"} id="prog" aria-live="polite">
      <div style="display:flex;justify-content:space-between;gap:1rem;align-items:center">
        <div><div id="prog-text">${up.progress?.text}</div><div class="note" id="prog-sub" style="margin:0">${up.progress?.sub}</div></div>
        <button type="button" id="prog-cancel" onClick=${up.cancel}><${Icon} id="x" />Cancel</button>
      </div>
      <div class="track" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" id="prog-track" ...${up.progress?.pct ? { "aria-valuenow": Math.round(up.progress.pct) } : {}}>
        <div class="fill" id="prog-fill" style=${{ width: up.progress?.pct ? up.progress.pct.toFixed(1) + "%" : "0" }}></div>
      </div>
    </div>`;
};

// ---- The file list ----

const FileRow = ({ f, info, run }) => {
  const to = f.visibility === "public" ? "private" : "public";
  const cls = f.visibility === "public" ? "pub" : "priv";
  return html`<tr>
    <td class="name"><a href=${downloadUrl(f)}>${f.name}</a></td>
    <td><span class=${"pill " + cls}><i></i>${f.visibility === "public" ? "Public" : "Private"}</span></td>
    <td class="num">${fmtBytes(f.size)}</td>
    <td class="hide" title=${new Date(f.modified).toLocaleString()}>${ago(f.modified)}</td>
    <td class="act"><div class="acts">
      <a class="btn icon has-label ghost" title="Download" href=${downloadUrl(f)} aria-label=${"Download " + f.name} download=${f.name}><${Icon} id="download" /><span class="lbl">Download</span></a>
      ${f.visibility === "public" && info.publicUrl && html`<${RowButton} icon="link" label="Copy link" cls="ghost" action=${(flash) => copy(`${info.publicUrl}/${encodeURIComponent(f.name)}`, flash)} />`}
      <${RowButton} icon=${to === "public" ? "globe" : "lock"} label=${"Make " + to} cls="ghost"
        action=${() => run(() => call(`api/files/${encodeURIComponent(f.name)}/visibility?to=${to}`, { method: "POST" }), `${f.name} is now ${to}`)} />
      <${DeleteButton} file=${f} onDelete=${() => run(() => call("api/files/" + encodeURIComponent(f.name), { method: "DELETE" }), "Deleted " + f.name)} />
    </div></td>
  </tr>`;
};

const FileList = ({ files, info, run, loaded }) => {
  const [view, setView] = useState({ filter: "all", q: "", sort: "modified", dir: -1 });
  const set = (patch) => setView((v) => ({ ...v, ...patch }));
  const q = view.q.toLowerCase();
  const list = files
    .filter((f) => (view.filter === "all" || f.visibility === view.filter) && f.name.toLowerCase().includes(q))
    .sort((a, b) => {
      const k = view.sort;
      const x = a[k];
      const y = b[k];
      const c = typeof x === "string" && k !== "modified" ? x.localeCompare(y, undefined, { sensitivity: "base" }) : x > y ? 1 : x < y ? -1 : 0;
      return (c || a.name.localeCompare(b.name)) * (c ? view.dir : 1);
    });
  const sortKey = view.sort + ":" + view.dir;
  const sorts = SORTS.some(([v]) => v === sortKey) ? SORTS : [...SORTS, [sortKey, "Custom"]];
  // newest and largest first when a column is picked for the first time
  const pick = (k) => set({ dir: view.sort === k ? -view.dir : k === "modified" || k === "size" ? -1 : 1, sort: k });
  return html`<section class="card" aria-label="Files">
    <div class="bar">
      <input type="search" id="q" placeholder="Filter by name" aria-label="Filter by name" value=${view.q} onInput=${(e) => set({ q: e.target.value })} />
      <div class="chips" role="group" aria-label="Visibility filter">
        ${FILTERS.map(([v, text]) => html`<button type="button" data-f=${v} aria-pressed=${String(view.filter === v)} onClick=${() => set({ filter: v })}>${text}</button>`)}
      </div>
      <label class="sortsel">Sort
        <select id="sort" aria-label="Sort files" value=${sortKey} onChange=${(e) => { const [k, d] = e.target.value.split(":"); set({ sort: k, dir: Number(d) }); }}>
          ${sorts.map(([v, text]) => html`<option value=${v} selected=${v === sortKey}>${text}</option>`)}
        </select>
      </label>
    </div>
    <table>
      <thead><tr>
        ${COLUMNS.map(([k, text, cls]) => html`<th class=${cls} ...${view.sort === k ? { "aria-sort": view.dir > 0 ? "ascending" : "descending" } : {}}><button type="button" data-s=${k} onClick=${() => pick(k)}>${text}</button></th>`)}
        <th><span class="sr">Actions</span></th>
      </tr></thead>
      <tbody id="rows">${list.map((f) => html`<${FileRow} key=${f.name} f=${f} info=${info} run=${run} />`)}</tbody>
    </table>
    <div class="empty" id="empty" hidden=${!loaded || list.length > 0}>${loaded && (files.length ? "No file matches the filter." : "No files yet. Drop one above to start.")}</div>
  </section>`;
};

// ---- The page ----

const App = () => {
  const [data, setData] = useState({ files: [], info: {}, token: {}, loaded: false });
  const refresh = async () => {
    const [files, info, token] = await Promise.all([call("api/files").then((r) => r.json()), call("api/info").then((r) => r.json()), call("api/token").then((r) => r.json())]);
    setData({ files, info, token, loaded: true });
  };
  // Runs a change, tells the user, and reloads the lists; a failure is shown and rethrown nowhere.
  const run = async (fn, ok) => {
    try { await fn(); if (ok) toast(ok); await refresh(); } catch (e) { toast(e.message, true); }
  };
  useEffect(() => { refresh().catch((e) => toast(e.message, true)); }, []);
  const up = useUploads(() => refresh().catch((e) => toast(e.message, true)));
  const { files, info, token, loaded } = data;
  return html`<main>
    <h1>Fileserver</h1>
    <p class="sub">Public files are downloadable from the internet. Private files are only here.</p>
    <section class="kpis" aria-label="Overview">
      <${DiskCard} files=${files} info=${info} loaded=${loaded} />
      <${TokenCard} token=${token} info=${info} loaded=${loaded} />
    </section>
    <${UploadArea} info=${info} up=${up} loaded=${loaded} />
    <${FileList} files=${files} info=${info} run=${run} loaded=${loaded} />
  </main>
  <${ToastHost} />
  <${Tooltip} />`;
};

render(html`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
