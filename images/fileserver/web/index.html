<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fileserver</title>
<link rel="icon" href="data:,">
<meta name="description" content="Admin page of the homelab fileserver: disk space, uploads, files and the upload token.">
<style>
  /* Colour roles follow the reference palette: public = categorical slot 1 (blue), private = slot 2 (orange),
     storage meter = sequential blue with the status colours for severity. Dark values are their own steps. */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6b6a65;
    --line: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
    --public: #2a78d6; --private: #eb6834;
    --meter-fill: #2a78d6; --meter-track: #cde2fb;
    --warn: #fab219; --crit: #d03b3b; --good-text: #006300; --crit-text: #a82424; --warn-text: #7a5400;
    --accent: #1c5cab; --danger: #c0392b; --primary: #1c5cab; --danger-solid: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a09f98;
      --line: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --wash: rgba(255,255,255,.07);
      --public: #3987e5; --private: #d95926;
      --meter-fill: #3987e5; --meter-track: #0d366b;
      --good-text: #0ca30c; --crit-text: #f08080; --warn-text: #fab219;
      --accent: #6da7ec; --danger: #e66767; --primary: #2a78d6; --danger-solid: #d03b3b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 1.35rem; margin: 0; } h2 { font-size: 1rem; margin: 0; }
  .sub { color: var(--ink-2); margin: .15rem 0 1.25rem; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 1rem 1.1rem; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .9rem; margin-bottom: 1.1rem; }
  .label { color: var(--ink-2); font-size: .85rem; }
  .value { font-size: 1.7rem; font-weight: 600; margin: .1rem 0 .1rem; }
  .value small { font-size: .9rem; font-weight: 400; color: var(--ink-2); }
  .note { color: var(--ink-2); font-size: .85rem; margin-top: .5rem; display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .st-ok { color: var(--good-text); } .st-warn { color: var(--warn-text); } .st-crit { color: var(--crit-text); }
  .st { font-weight: 600; }
  /* meter and segmented bar */
  .track { height: 10px; border-radius: 999px; background: var(--meter-track); overflow: hidden; margin-top: .6rem; }
  .fill { height: 100%; border-radius: 999px; background: var(--meter-fill); transition: width .3s; }
  .fill.warn { background: var(--warn); } .fill.crit { background: var(--crit); }
  .wide { grid-column: span 2; }
  .kpis > .card { min-height: 13rem; }
  @media (max-width: 40rem) { .wide { grid-column: auto; } }
  .seg { display: flex; gap: 2px; height: 28px; margin-top: .8rem; }
  .seg > span { min-width: 0; border-radius: 4px; display: flex; align-items: center; padding-left: .5rem; color: #0b0b0b; font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .seg > span:focus-visible { outline-offset: 1px; }
  .seg > .pub { background: var(--public); } .seg > .priv { background: var(--private); }
  .seg > .oth { background: var(--muted); } .seg > .free { background: var(--meter-track); color: var(--ink-2); }
  .seg > .free.warn { background: var(--warn); color: #0b0b0b; } .seg > .free.crit { background: var(--crit); color: #fff; }
  .legend { display: flex; gap: 1.1rem; margin-top: .55rem; flex-wrap: wrap; font-size: .88rem; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .4rem; vertical-align: -1px; }
  .sw.pub { background: var(--public); } .sw.priv { background: var(--private); } .sw.oth { background: var(--muted); } .sw.free { background: var(--meter-track); border: 1px solid var(--axis); }
  /* token */
  .tok { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .35rem; }
  code { font: .88rem ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--wash); padding: .25rem .45rem; border-radius: 6px; overflow-wrap: anywhere; }
  /* controls */
  select, input[type=search] { font: inherit; color: inherit; }
  /* One button system. Secondary is the default; primary is the one main action of a block; ghost is a quiet row action;
     danger is red text and turns solid when armed (the first click of a delete). Icons are 16px strokes in currentColor. */
  button, a.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; font: inherit; font-weight: 500; color: var(--ink);
    background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: .35rem .85rem; min-height: 36px; cursor: pointer;
    text-decoration: none; transition: background .12s, border-color .12s, color .12s; }
  button:hover:not(:disabled), a.btn:hover { background: var(--wash); border-color: var(--ink-2); }
  button:active:not(:disabled), a.btn:active { background: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button[aria-busy=true] { cursor: progress; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--primary); filter: brightness(1.12); }
  button.primary:active:not(:disabled) { filter: brightness(.92); }
  button.danger-solid { background: var(--danger-solid); border-color: var(--danger-solid); color: #fff; }
  button.danger-solid:hover:not(:disabled) { background: var(--danger-solid); filter: brightness(1.12); }
  button.ghost, a.btn.ghost { border-color: transparent; background: transparent; }
  button.ghost:hover:not(:disabled), a.btn.ghost:hover { background: var(--wash); border-color: transparent; }
  button.ghost.danger { color: var(--danger); }
  button.ghost.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 14%, transparent); }
  button.icon, a.btn.icon { width: 36px; padding: 0; }
  button.ok { color: var(--ok-text); border-color: currentColor; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .acts { display: flex; gap: .15rem; justify-content: flex-end; }
  .act .lbl { display: none; }
  .act button.armed { width: auto; padding: .35rem .8rem; } .act button.armed .lbl { display: inline; }
  @media (pointer: coarse) { button, a.btn, select, input[type=search] { min-height: 44px; } button.icon, a.btn.icon { width: 44px; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* upload */
  .drop { border: 2px dashed var(--axis); border-radius: 12px; padding: 1.1rem; display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1.1rem; transition: background .15s, border-color .15s; }
  .drop.over { background: var(--wash); border-color: var(--accent); }
  .drop p { margin: 0; } .drop .hint { color: var(--ink-2); font-size: .85rem; }
  .seggroup { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
  .seggroup label { padding: .3rem .75rem; cursor: pointer; display: flex; gap: .4rem; align-items: center; }
  .seggroup input { position: absolute; opacity: 0; }
  .seggroup label:has(input:checked) { background: var(--wash); font-weight: 600; }
  .seggroup label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .prog { display: none; margin-bottom: 1.1rem; }
  .prog.on { display: block; }
  .prog .track { margin-top: .4rem; }
  .prog .fill { background: var(--meter-fill); transition: none; }
  /* list */
  .bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .7rem; }
  input[type=search] { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: .3rem .65rem; min-height: 32px; min-width: 14rem; }
  .chips { display: inline-flex; gap: .3rem; }
  .chips button[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 600; color: var(--ink-2); font-size: .85rem; white-space: nowrap; }
  th button { background: none; border: 0; padding: 0; min-height: 0; font-weight: 600; color: inherit; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.name { overflow-wrap: anywhere; } td.name a { color: var(--accent); }
  td.act { text-align: right; white-space: nowrap; }
  .pill { display: inline-flex; gap: .4rem; align-items: center; font-size: .88rem; }
  .pill i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .pill.pub i { background: var(--public); } .pill.priv i { background: var(--private); }
  .empty { text-align: center; color: var(--ink-2); padding: 2rem 1rem; }
  #toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: .4rem; align-items: center; pointer-events: none; }
  #toast div { background: var(--ink); color: var(--surface); padding: .5rem .9rem; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #toast div.err { background: var(--crit); color: #fff; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface); padding: .35rem .6rem; border-radius: 6px; font-size: .82rem; display: none; }
  #tip b { font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  th[aria-sort="ascending"] button::after { content: ' \25B2'; font-size: .7em; }
  th[aria-sort="descending"] button::after { content: ' \25BC'; font-size: .7em; }
  .sortsel { margin-left: auto; display: flex; gap: .4rem; align-items: center; font-size: .88rem; color: var(--ink-2); }
  select { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: .3rem .5rem; min-height: 32px; }
  @media (max-width: 40rem) {
    main { padding: 1rem .75rem 3rem; }
    .kpis > #k-disk { min-height: 14.5rem; } .kpis > #k-token { min-height: 11.5rem; }
    .card { padding: .85rem .9rem; }
    button, a.btn, select, input[type=search] { min-height: 44px; }
    button.icon, a.btn.icon { width: 44px; }
    input[type=search] { min-width: 0; flex: 1 1 100%; }
    .sortsel { margin-left: 0; flex: 1 1 100%; } .sortsel select { flex: 1; }
    thead { display: none; }
    table, tbody { display: block; }
    tr { display: flex; flex-wrap: wrap; align-items: center; gap: .15rem .9rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
    td { border: 0; padding: 0; }
    td.name { flex: 1 1 100%; font-weight: 600; }
    td.num { text-align: left; } td.hide { color: var(--ink-2); font-size: .88rem; }
    td.act { flex: 1 1 100%; margin-top: .35rem; white-space: normal; text-align: left; }
    .acts { flex-wrap: wrap; justify-content: flex-start; gap: .4rem; }
    .acts button.icon.has-label, .acts a.btn.icon.has-label { padding: .35rem .55rem; }
    .act .lbl { display: inline; } button.icon.has-label, a.btn.icon.has-label { width: auto; padding: .35rem .8rem; }
    .drop { padding: .9rem; } .seggroup { width: 100%; } .seggroup label { flex: 1; justify-content: center; }
    .tok button { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.7C3.9 8.6 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>
<main>
  <h1>Fileserver</h1>
  <p class="sub">Public files are downloadable from the internet. Private files are only here.</p>

  <section class="kpis" aria-label="Overview">
    <div class="card wide" id="k-disk">
      <div class="label">Disk space</div>
      <div class="value" id="dk-val">&nbsp;</div>
      <div class="seg" id="dk-seg" role="group" aria-label="Disk usage by public files, private files, other use and free space"></div>
      <div class="legend" id="dk-legend"></div>
      <div class="note" id="dk-note"></div>
    </div>
    <div class="card" id="k-token">
      <div class="label">Upload token <span class="sr">(internal upload API only)</span></div>
      <div class="tok"><code id="tok-val">hidden</code></div>
      <div class="tok">
        <button id="tok-show" type="button" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-eye"/></svg><span class="t">Show</span></button>
        <button id="tok-copy" type="button"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg><span class="t">Copy</span></button>
        <button id="tok-curl" type="button" title="Copy a ready-to-run curl command"><svg class="i" aria-hidden="true"><use href="#i-terminal"/></svg><span class="t">Copy curl</span></button>
      </div>
      <div class="note" id="tok-note"></div>
    </div>
  </section>

  <div class="drop" id="drop">
    <div>
      <p><strong>Drop files here</strong> or <button type="button" id="pick" class="primary"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg>Choose files</button></p>
      <p class="hint" id="limit">One file per request, streamed to disk.</p>
    </div>
    <fieldset class="seggroup" style="border:0;padding:0;margin:0" aria-label="Visibility of new uploads">
      <div class="seggroup">
        <label><input type="radio" name="vis" value="private" checked> <svg class="i" aria-hidden="true"><use href="#i-lock"/></svg> Private</label>
        <label><input type="radio" name="vis" value="public"> <svg class="i" aria-hidden="true"><use href="#i-globe"/></svg> Public</label>
      </div>
    </fieldset>
    <input type="file" id="file" multiple hidden>
  </div>
  <div class="card prog" id="prog" aria-live="polite">
    <div style="display:flex;justify-content:space-between;gap:1rem;align-items:center">
      <div><div id="prog-text"></div><div class="note" id="prog-sub" style="margin:0"></div></div>
      <button type="button" id="prog-cancel"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg>Cancel</button>
    </div>
    <div class="track" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" id="prog-track"><div class="fill" id="prog-fill" style="width:0"></div></div>
  </div>

  <section class="card" aria-label="Files">
    <div class="bar">
      <input type="search" id="q" placeholder="Filter by name" aria-label="Filter by name">
      <div class="chips" role="group" aria-label="Visibility filter">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="public" aria-pressed="false">Public</button>
        <button type="button" data-f="private" aria-pressed="false">Private</button>
      </div>
      <label class="sortsel">Sort
        <select id="sort" aria-label="Sort files">
          <option value="modified:-1">Newest first</option>
          <option value="modified:1">Oldest first</option>
          <option value="size:-1">Largest first</option>
          <option value="size:1">Smallest first</option>
          <option value="name:1">Name A to Z</option>
          <option value="name:-1">Name Z to A</option>
          <option value="visibility:1">Visibility</option>
        </select>
      </label>
    </div>
    <table>
      <thead><tr>
        <th><button type="button" data-s="name">Name</button></th>
        <th><button type="button" data-s="visibility">Visibility</button></th>
        <th class="num"><button type="button" data-s="size">Size</button></th>
        <th class="hide"><button type="button" data-s="modified">Modified</button></th>
        <th><span class="sr">Actions</span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const H = { 'X-Requested-With': 'fileserver' };
const state = { files: [], info: {}, token: {}, filter: 'all', q: '', sort: 'modified', dir: -1 };

const fmtBytes = n => n >= 2 ** 30 ? (n / 2 ** 30).toFixed(n >= 10 * 2 ** 30 ? 1 : 2) + ' GiB' : n >= 2 ** 20 ? (n / 2 ** 20).toFixed(1) + ' MiB' : n >= 1024 ? (n / 1024).toFixed(0) + ' KiB' : n + ' B';
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 90) return 'just now'; const m = s / 60; if (m < 90) return Math.round(m) + ' min ago'; const h = m / 60; if (h < 36) return Math.round(h) + ' h ago'; return Math.round(h / 24) + ' days ago'; };
const el = (tag, props, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };

const SVGNS = 'http://www.w3.org/2000/svg';
function icon(id) {
  const s = document.createElementNS(SVGNS, 'svg'), u = document.createElementNS(SVGNS, 'use');
  s.setAttribute('class', 'i'); s.setAttribute('aria-hidden', 'true'); u.setAttribute('href', '#i-' + id); s.append(u); return s;
}
// A row action: an icon button (label in title and aria-label; the text shows on phones).
function ibtn(id, label, cls, onclick) {
  const b = el('button', { type: 'button', className: 'icon has-label ' + cls, title: label, onclick });
  b.setAttribute('aria-label', label); b.append(icon(id), el('span', { className: 'lbl', textContent: label })); return b;
}
// Brief confirmation on the button itself: its icon becomes a check and its text says what happened.
function flash(btn, text) {
  const t = btn.querySelector('.t, .lbl'), u = btn.querySelector('use'), old = t && t.textContent, oldIcon = u && u.getAttribute('href');
  btn.classList.add('ok'); if (u) u.setAttribute('href', '#i-check'); if (t) t.textContent = text;
  setTimeout(() => { btn.classList.remove('ok'); if (u) u.setAttribute('href', oldIcon); if (t) t.textContent = old; }, 1500);
}
// The async clipboard API needs https (the Omni exposer is); the textarea fallback covers plain http and older browsers.
function copy(text, btn, done) {
  const fallback = () => {
    const t = el('textarea', { value: text }); t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0';
    document.body.append(t); t.select();
    const ok = document.execCommand('copy'); t.remove(); return ok;
  };
  const ok = () => flash(btn, done), bad = () => toast('Copy failed', true);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, () => (fallback() ? ok() : bad()));
  else fallback() ? ok() : bad();
}

function toast(text, err) {
  const t = el('div', { className: err ? 'err' : '', textContent: text });
  $('toast').append(t); setTimeout(() => t.remove(), err ? 6000 : 2500);
}
async function call(url, opts) {
  const r = await fetch(url, { ...opts, headers: { ...H, ...(opts && opts.headers) } });
  if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
  return r;
}

/* tooltips for the bars: one element, filled with textContent */
const tip = $('tip');
function tipOn(node, lines) {
  const show = e => { tip.replaceChildren(el('b', { textContent: lines[0] }), document.createElement('br'), document.createTextNode(lines[1])); tip.style.display = 'block';
    const r = node.getBoundingClientRect(); tip.style.left = (e.clientX || r.left + r.width / 2) + 'px'; tip.style.top = (r.bottom + 8) + 'px'; };
  node.addEventListener('pointermove', show); node.addEventListener('focus', show);
  node.addEventListener('pointerleave', () => tip.style.display = 'none'); node.addEventListener('blur', () => tip.style.display = 'none');
}

function fitLabels() {
  for (const sp of $('dk-seg').children) {
    sp.textContent = sp.dataset.label;
    const rg = document.createRange(); rg.selectNodeContents(sp);
    if (rg.getBoundingClientRect().width + 16 > sp.clientWidth) sp.textContent = '';
  }
}
new ResizeObserver(fitLabels).observe($('dk-seg'));

function renderStats() {
  const { capacityBytes: cap = 0, freeBytes: free = 0 } = state.info;
  const used = Math.max(0, cap - free), pct = cap ? used / cap * 100 : 0;
  const by = v => state.files.filter(f => f.visibility === v);
  const sum = v => by(v).reduce((a, f) => a + f.size, 0);
  const pub = sum('public'), priv = sum('private'), other = Math.max(0, used - pub - priv);
  const sev = pct >= 92 ? 'crit' : pct >= 80 ? 'warn' : '';
  const freeShare = cap ? free / cap * 100 : 0;
  const freePct = freeShare > 0 && freeShare < 1 ? '<1%' : Math.round(freeShare) + '%';

  $('dk-val').replaceChildren(document.createTextNode(fmtBytes(free) + ' '), el('small', { textContent: 'remaining of ' + fmtBytes(cap) }));
  const seg = $('dk-seg'); seg.replaceChildren();
  const parts = [
    ['pub', 'Public', pub, `${by('public').length} files`],
    ['priv', 'Private', priv, `${by('private').length} files`],
    ['oth', 'Other use', other, 'filesystem overhead and other data on the volume'],
    ['free ' + sev, 'Free', free, freePct + ' of the volume'],
  ];
  for (const [cls, name, bytes, what] of parts) {
    if (!bytes) continue;
    const sp = el('span', { className: cls.trim(), tabIndex: 0 }); sp.setAttribute('role', 'img'); sp.style.flex = String(bytes);
    sp.setAttribute('aria-label', `${name}: ${fmtBytes(bytes)}, ${what}`);
    tipOn(sp, [name, `${fmtBytes(bytes)} \u00B7 ${what}`]);
    seg.append(sp);
    // the amount is printed inside the block only when it fits (fitLabels), otherwise the tooltip and legend carry it
    sp.dataset.label = name === 'Free' ? `${fmtBytes(bytes)} \u00B7 ${freePct}` : fmtBytes(bytes);
  }
  fitLabels();
  const lg = $('dk-legend'); lg.replaceChildren();
  for (const [cls, name, bytes, what] of parts) {
    if (cls === 'oth' && !bytes) continue;
    lg.append(el('span', {}, el('i', { className: 'sw ' + cls.split(' ')[0] }), document.createTextNode(name === 'Free' ? `${name} ${freePct}` : `${name} ${fmtBytes(bytes)}`)));
  }
  const status = sev === 'crit' ? ['crit', '\u26A0', 'Almost full. Uploads will be refused.'] : sev === 'warn' ? ['warn', '\u26A0', 'Getting full.'] : ['ok', '\u2713', 'Plenty of room.'];
  const note = $('dk-note'); note.replaceChildren(
    el('span', { className: 'st st-' + status[0], textContent: status[1] + ' ' + status[2] }),
    document.createTextNode(`${state.files.length} files \u00B7 ${Math.round(pct)}% used`));

  // token
  const t = state.token, note2 = $('tok-note'); note2.replaceChildren();
  if (!t.current) { note2.append(el('span', { className: 'st st-warn', textContent: '⚠ No token yet. The rotation job has not run.' })); return; }
  const days = (Date.now() - new Date(t.rotatedAt)) / 864e5, every = (state.info.rotateAfterHours || 720) / 24;
  const overdue = days > every + 1;
  note2.append(el('span', { className: 'st ' + (overdue ? 'st-crit' : 'st-ok'), textContent: overdue ? '⚠ Rotation overdue' : '✓ Rotating normally' }),
    document.createTextNode(`Rotated ${ago(t.rotatedAt)}` + (overdue ? '' : ` · next in about ${Math.max(0, Math.round(every - days))} days`)));
  if (t.previousValidUntil) note2.append(document.createTextNode('The previous token also works until ' + new Date(t.previousValidUntil).toLocaleString() + '.'));
}

function renderRows() {
  const rows = $('rows'); rows.replaceChildren();
  const q = state.q.toLowerCase();
  const list = state.files.filter(f => (state.filter === 'all' || f.visibility === state.filter) && f.name.toLowerCase().includes(q))
    .sort((a, b) => {
      const k = state.sort, x = a[k], y = b[k];
      const c = typeof x === 'string' && k !== 'modified' ? x.localeCompare(y, undefined, { sensitivity: 'base' }) : (x > y ? 1 : x < y ? -1 : 0);
      return (c || a.name.localeCompare(b.name)) * (c ? state.dir : 1);
    });
  const sel = $('sort'); const key = state.sort + ':' + state.dir;
  if (![...sel.options].some(o => o.value === key)) sel.add(new Option('Custom', key));
  sel.value = key;
  document.querySelectorAll('th[aria-sort]').forEach(th => th.removeAttribute('aria-sort'));
  const th = document.querySelector(`th button[data-s="${state.sort}"]`).parentElement; th.setAttribute('aria-sort', state.dir > 0 ? 'ascending' : 'descending');
  const empty = $('empty'); empty.hidden = list.length > 0;
  empty.textContent = state.files.length ? 'No file matches the filter.' : 'No files yet. Drop one above to start.';
  for (const f of list) {
    const tr = rows.insertRow();
    const a = el('a', { href: `download/${f.visibility}/${encodeURIComponent(f.name)}`, textContent: f.name });
    tr.insertCell().className = 'name'; tr.cells[0].append(a);
    const cls = f.visibility === 'public' ? 'pub' : 'priv';
    tr.insertCell().append(el('span', { className: 'pill ' + cls }, el('i'), document.createTextNode(f.visibility === 'public' ? 'Public' : 'Private')));
    const sz = tr.insertCell(); sz.className = 'num'; sz.textContent = fmtBytes(f.size);
    const md = tr.insertCell(); md.className = 'hide'; md.textContent = ago(f.modified); md.title = new Date(f.modified).toLocaleString();
    const act = tr.insertCell(); act.className = 'act';
    const box = el('div', { className: 'acts' }); act.append(box);
    const dl = el('a', { className: 'btn icon has-label ghost', title: 'Download', href: `download/${f.visibility}/${encodeURIComponent(f.name)}` });
    dl.setAttribute('aria-label', 'Download ' + f.name); dl.setAttribute('download', f.name); dl.append(icon('download'), el('span', { className: 'lbl', textContent: 'Download' }));
    box.append(dl);
    if (f.visibility === 'public' && state.info.publicUrl) box.append(ibtn('link', 'Copy link', 'ghost', e => copy(`${state.info.publicUrl}/${encodeURIComponent(f.name)}`, e.currentTarget, 'Copied')));
    const to = f.visibility === 'public' ? 'private' : 'public';
    box.append(ibtn(to === 'public' ? 'globe' : 'lock', 'Make ' + to, 'ghost', e => run(() => call(`api/files/${encodeURIComponent(f.name)}/visibility?to=${to}`, { method: 'POST' }), `${f.name} is now ${to}`, e.currentTarget)),
      deleteBtn(f));
  }
}

async function refresh() {
  const [files, info, token] = await Promise.all([call('api/files').then(r => r.json()), call('api/info').then(r => r.json()), call('api/token').then(r => r.json())]);
  Object.assign(state, { files, info, token });
  $('limit').textContent = `Up to ${fmtBytes(info.maxFileBytes || 0)} per file. Same name replaces the file.`;
  renderStats(); renderRows();
}
async function run(fn, ok, btn) {
  if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
  try { await fn(); if (ok) toast(ok); await refresh(); }
  catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); } }
}

/* delete: two clicks. The first arms the button (red, "Confirm delete"), the second deletes. It disarms after 4 s, on Esc, or when
   focus leaves it. */
const armed = new Set();
function disarm(b) {
  if (!b.dataset.armed) return;
  clearTimeout(b._t); delete b.dataset.armed; armed.delete(b);
  b.classList.remove('danger-solid', 'armed'); b.classList.add('ghost');
  b.querySelector('.lbl').textContent = 'Delete'; b.setAttribute('aria-label', b.dataset.name ? 'Delete ' + b.dataset.name : 'Delete');
}
function deleteBtn(f) {
  const b = ibtn('trash', 'Delete', 'ghost danger', () => {
    if (b.dataset.armed) { disarm(b); run(() => call('api/files/' + encodeURIComponent(f.name), { method: 'DELETE' }), 'Deleted ' + f.name, b); return; }
    b.dataset.armed = '1'; armed.add(b);
    b.classList.remove('ghost'); b.classList.add('danger-solid', 'armed');
    b.querySelector('.lbl').textContent = 'Confirm delete'; b.setAttribute('aria-label', `Confirm: delete ${f.name}`);
    b._t = setTimeout(() => disarm(b), 4000);
  });
  b.dataset.name = f.name; b.addEventListener('blur', () => disarm(b)); b.setAttribute('aria-label', 'Delete ' + f.name);
  return b;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') armed.forEach(disarm); });

/* token */
let revealed = false;
const mask = t => t ? t.slice(0, 3) + '•'.repeat(12) + t.slice(-4) : 'none';
function showToken() {
  $('tok-val').textContent = revealed ? (state.token.current || 'none') : mask(state.token.current);
  const b = $('tok-show'); b.querySelector('.t').textContent = revealed ? 'Hide' : 'Show';
  b.querySelector('use').setAttribute('href', revealed ? '#i-eye-off' : '#i-eye'); b.setAttribute('aria-pressed', revealed);
}
$('tok-show').onclick = () => { revealed = !revealed; showToken(); };
$('tok-copy').onclick = e => copy(state.token.current || '', e.currentTarget, 'Copied');
$('tok-curl').onclick = e => copy(`curl --fail -T FILE -H "Authorization: Bearer ${state.token.current}" "http://fileserver-upload.fileserver.svc:8082/v1/files/NAME?visibility=private"`, e.currentTarget, 'Copied');

/* upload: one file at a time, with progress, speed and cancel */
let xhr = null, queue = [];
function uploadNext() {
  const f = queue.shift();
  if (!f) { $('prog').classList.remove('on'); return refresh(); }
  const vis = document.querySelector('input[name=vis]:checked').value, total = queue.length + 1;
  $('prog').classList.add('on'); $('prog-text').textContent = `Uploading ${f.name} (${vis})`;
  const fd = new FormData(); fd.append('file', f);
  xhr = new XMLHttpRequest(); const t0 = Date.now();
  xhr.open('POST', 'api/files?visibility=' + vis); xhr.setRequestHeader('X-Requested-With', 'fileserver');
  xhr.upload.onprogress = p => {
    const pc = p.lengthComputable ? p.loaded / p.total * 100 : 0, rate = p.loaded / Math.max(.5, (Date.now() - t0) / 1000);
    $('prog-fill').style.width = pc.toFixed(1) + '%'; $('prog-track').setAttribute('aria-valuenow', Math.round(pc));
    $('prog-sub').textContent = `${Math.round(pc)}% · ${fmtBytes(p.loaded)} of ${fmtBytes(p.total)} · ${fmtBytes(rate)}/s` + (queue.length ? ` · ${queue.length} more queued` : '');
  };
  xhr.onload = () => { if (xhr.status === 201) toast('Uploaded ' + f.name); else toast(`${f.name}: ${xhr.responseText.trim() || xhr.statusText}`, true); $('prog-fill').style.width = '0'; uploadNext(); };
  xhr.onerror = () => { toast(`${f.name}: upload failed`, true); queue = []; uploadNext(); };
  xhr.onabort = () => { toast('Upload cancelled'); queue = []; uploadNext(); };
  xhr.send(fd);
}
function enqueue(files) { const idle = !queue.length && !$('prog').classList.contains('on'); queue.push(...files); if (idle) uploadNext(); }
$('prog-cancel').onclick = () => xhr && xhr.abort();
$('pick').onclick = () => $('file').click();
$('file').onchange = e => { enqueue([...e.target.files]); e.target.value = ''; };
const drop = $('drop');
['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => enqueue([...e.dataTransfer.files]));

/* list controls */
$('q').oninput = e => { state.q = e.target.value; renderRows(); };
document.querySelectorAll('.chips button').forEach(b => b.onclick = () => { state.filter = b.dataset.f; document.querySelectorAll('.chips button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderRows(); });
document.querySelectorAll('th button').forEach(b => b.onclick = () => {
  const k = b.dataset.s, first = k === 'modified' || k === 'size' ? -1 : 1; // newest and largest first
  state.dir = state.sort === k ? -state.dir : first; state.sort = k; renderRows();
});
$('sort').onchange = e => { const [k, d] = e.target.value.split(':'); state.sort = k; state.dir = Number(d); renderRows(); };

refresh().then(showToken).catch(e => toast(e.message, true));
</script>
</body>
</html>
