---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zz-bad-hr
  namespace: zz
spec:
  interval: 1h
  chart:
    spec:
      chart: x
      sourceRef:
        kind: HelmRepository
        name: x
  upgrade:
    remediation:
      retries: 0
---
apiVersion: v1
kind: Namespace
metadata:
  name: zz-bad-ns
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zz-bad-cnp
  namespace: zz
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - world
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: zz-bad-ccnp
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - all
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zz-bad-deploy
  namespace: zz
spec:
  selector:
    matchLabels:
      app: zz
  template:
    metadata:
      labels:
        app: zz
        trust.portableinfo.cloud/public: "true"
    spec:
      containers:
        - name: c
          image: nginx:1.27
