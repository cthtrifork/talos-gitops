# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Agent Substrate: the control plane, its database and its snapshot store. The WorkerPool and SandboxConfig are in app-ate-system-pools,
# which waits for the CRDs this installs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ate-system
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-post
    - name: app-controllers
    - name: gitops-infra-secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/ate-system
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The SandboxConfig and the WorkerPool are custom resources of the CRDs in app-ate-system, so they get their own Kustomization: in one,
# the first dry run fails until the CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ate-system-pools
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  dependsOn:
    - name: app-ate-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/ate-system-pools
