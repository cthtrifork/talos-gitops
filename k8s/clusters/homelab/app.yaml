# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Migration step 1 of 2 (see app-<component>): the objects now belong to the per-component Kustomizations, which
# re-label them as they apply. prune: false makes sure this one can never delete an object while it changes owner (a PVC
# or namespace would take its data with it). Step 2 deletes this Kustomization, which then leaves the objects alone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  prune: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: gitops-infra-post
    - name: app-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps
  postBuild:
    substitute:
      var_substitution_enabled: "true"
