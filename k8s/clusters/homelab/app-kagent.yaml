# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# kagent, on the Substrate install: its database, the two charts and the worker pool. Needs Substrate (its API server, the credential grant for the kagent atespace) and the
# secret store (the database passwords).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-kagent
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  timeout: 10m
  dependsOn:
    - name: app-ate-system
    - name: gitops-infra-secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/kagent
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The Anthropic key, as a SOPS file you add (k8s/apps/kagent/README.md). The directory has no kustomization.yaml, so Flux generates one and the repo's CI skips it; until the file is
# committed this fails on a missing path. After the namespace, which app-kagent creates.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-kagent-secrets
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: app-kagent
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/kagent-secrets
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The agents are custom resources of the kagent chart, so they get their own Kustomization: in app-kagent the first dry run would fail until the CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-kagent-agents
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  dependsOn:
    - name: app-kagent
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/kagent-agents
