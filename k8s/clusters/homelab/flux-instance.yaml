# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/fluxcd.controlplane.io/fluxinstance_v1.json
---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.9.5" # renovate: datasource=github-releases depName=fluxcd/flux2
    registry: "ghcr.io/fluxcd"
  # No spec.storage: the artifacts of source-controller live in an emptyDir and are refetched after a restart (the OCI sources
  # come through zot), so the controller is not tied to the node of a local volume
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: false # replaced by k8s/infra/flux-system/ciliumnetworkpolicy.yaml
    domain: "cluster.local"
    size: small
  kustomize:
    patches:
      # opt the namespace in to the ops tier of the Elevate page (the operator creates it, Git cannot label it otherwise)
      - target:
          kind: Namespace
          name: flux-system
        patch: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: flux-system
            labels:
              claude-elevate/ops: "true"
              claude-elevate/flux: "true" # reconcile a Kustomization now (annotation only, see the claude-flux role and its admission policy)
      # median working set 95-110Mi against the 64Mi default request
      - target:
          kind: Deployment
          name: "(source|kustomize|helm)-controller"
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: not-used
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        memory: 128Mi
      # OCIRepositories pull through zot, whose certificate is issued by the private CA. trust-manager keeps the ConfigMap in step
      # with that CA. Go reads SSL_CERT_DIR next to its system roots, and the volume is optional so source-controller still
      # starts before trust-manager (installed from an OCIRepository itself) has created the ConfigMap. This is the one workload that
      # keeps its own mount instead of the Kyverno injection (flux-system is excluded from the policy, docs/security.md).
      - target:
          kind: Deployment
          name: source-controller
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: not-used
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    env:
                      - name: SSL_CERT_DIR
                        value: /etc/private-ca
                    volumeMounts:
                      - name: private-ca
                        mountPath: /etc/private-ca
                        readOnly: true
                volumes:
                  - name: private-ca
                    configMap:
                      name: portableinfo-ca-bundle
                      optional: true
  sync:
    kind: GitRepository
    url: "https://github.com/cthtrifork/talos-gitops"
    ref: "refs/heads/main"
    path: "k8s/clusters/homelab"
    interval: 1h # fallback poll; the webhook receiver (k8s/infra/flux-system) triggers a fetch on push
