# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-secret-store
  namespace: flux-system
  labels:
    gitops.homelab/tier: infra
spec:
  interval: 30m
  retryInterval: 2m
  # prune stays off: removing a file here must not delete a generated Secret that is in use
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-bootstrap
    - name: gitops-infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/infra/secret-store
