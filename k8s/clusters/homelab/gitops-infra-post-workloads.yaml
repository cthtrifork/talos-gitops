# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Kept out of gitops-infra-post (which apps wait for) so a failure here, e.g. in dependency-track-system, does not hold back the apps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-post-workloads
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-post
    - name: gitops-infra-flux-system
    - name: gitops-infra-dependency-track-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/infra/post-workloads
  postBuild:
    substitute:
      var_substitution_enabled: "true"
