# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# The Valkey operator and its CRDs, watching renovate-system. The valkey-resources HelmRelease in app-controllers depends on its HelmRelease.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-valkey-operator-system
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-post
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/valkey-operator-system
  postBuild:
    substitute:
      var_substitution_enabled: "true"
