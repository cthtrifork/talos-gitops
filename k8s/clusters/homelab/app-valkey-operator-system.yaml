# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Retired: the Valkey operator moved to k8s/infra/controllers/valkey-operator-system/ (gitops-infra-controllers). Kept one merge
# with prune off and suspended, so that removing it does not delete the operator the new owner adopted. Delete this file afterwards.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-valkey-operator-system
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: false
  suspend: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-post
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/valkey-operator-system
  postBuild:
    substitute:
      var_substitution_enabled: "true"
