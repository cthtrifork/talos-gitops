# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# No gitops.homelab/tier label: the e2e suspends every HelmRelease, so this is suspended by name there.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-image-policies
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-kyverno
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/infra/image-policies
