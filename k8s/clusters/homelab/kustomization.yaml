---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-instance.yaml
  - gitops-infra-bootstrap.yaml
  - gitops-infra-controllers.yaml
  - gitops-infra-cilium.yaml
  - gitops-infra-openebs-system.yaml
  - gitops-infra-flux-system.yaml
  - gitops-infra-metrics-server.yaml
  - gitops-infra-coredns.yaml
  - gitops-infra-kube-prometheus-stack.yaml
  - gitops-infra-policy-system.yaml
  - gitops-infra-kyverno.yaml
  - gitops-infra-image-policies.yaml
  - gitops-infra-registry-system.yaml
  - gitops-infra-secret-store.yaml
  - gitops-infra-dependency-track-system.yaml
  - gitops-infra-trivy-system.yaml
  - gitops-infra-reloader-system.yaml
  #- gitops-infra-external-dns.yaml
  - gitops-infra-kubevirt.yaml
  - gitops-infra-post.yaml
  - gitops-infra-post-workloads.yaml
  - app-controllers.yaml
  - app-adguard.yaml
  - app-arc-runner.yaml
  - app-claude-system.yaml
  - app-fileserver.yaml
  - app-gha-cache.yaml
  - app-harper-pad.yaml
  - renovate.yaml
  - virtualmachines.yaml
patches:
  # Where the Kustomizations below find the charts of their OCIRepositories: through zot (the cache names are those of
  # patches/11-zot-mirrors.yaml). Without these variables the url defaults to the upstream registry, which is what CI renders.
  # A Kustomization that gets a new OCIRepository needs its name here and postBuild substitution switched on.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: "^(app-controllers|app-arc-runner|app-gha-cache|renovate|gitops-infra-(controllers|dependency-track-system|kube-prometheus-stack|kyverno|metrics-server|policy-system|reloader-system|trivy-system))$"
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        postBuild:
          substitute:
            ZOT_MIRROR_GHCR: zot.registry-system.svc.cluster.local:5000/ghcr-cache
            ZOT_MIRROR_QUAY: zot.registry-system.svc.cluster.local:5000/quay-cache
  - target:
      kind: FluxInstance
      name: flux
    patch: | #yaml
      # Only add storage setting after flux takes ownership of itself, since the CSI driver in not available until then. This is a workaround to avoid the chicken and egg problem of flux needing storage to run, but storage not being available until flux runs.
      - op: add
        path: /spec/storage
        value:
          class: "lvm-bulk"
          size: "10Gi"
