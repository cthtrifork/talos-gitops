# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-gha-cache
  namespace: flux-system
  labels:
    gitops.homelab/tier: apps
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  force: true # temporary (docs/storage-plan.md, phase 3): recreates the PVCs whose storage class changed; remove after the flip
  dependsOn:
    - name: gitops-infra-post
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/gha-cache
