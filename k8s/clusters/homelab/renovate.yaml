# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Own Kustomization, not part of app: the RenovateJob needs CRDs from the operator HelmRelease in app-controllers, so
# its first dry run can fail until they exist (retries every 2 minutes). Contained here, it does not hold back other apps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: app-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/apps/renovate
  postBuild:
    substitute:
      var_substitution_enabled: "true"
