# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-kubevirt
  namespace: flux-system
  labels:
    gitops.homelab/tier: infra
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-bootstrap
    - name: gitops-infra-controllers
    - name: gitops-infra-image-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/infra/kubevirt
  postBuild:
    substitute:
      var_substitution_enabled: "true"
