# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Policies that need ConfigMaps from gitops-infra-post (the trust-manager Bundles) as well as the Kyverno CRDs. Without a
# gitops.homelab/tier label: the e2e has no Kyverno, so it suspends this by name.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-kyverno-policies
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  timeout: 10m
  dependsOn:
    - name: gitops-infra-kyverno
    - name: gitops-infra-post
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/infra/post/kyverno-policies
  postBuild:
    substitute:
      var_substitution_enabled: "true"
