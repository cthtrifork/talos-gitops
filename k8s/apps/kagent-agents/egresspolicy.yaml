# The hosts the claude-rc pod may reach (k8s/apps/claude-system/networkpolicy.yaml, claude-egress-allowlist, TCP 443), as the egress policy of the kagent agents. The list is copied
# from there, and scripts/ci/check-claude-egress-allowlist.sh fails CI when the two differ: edit the Cilium policy first, then this file, in the same pull request. A wildcard matches exactly
# one label, as it does in Cilium. api.anthropic.com is also granted by kagent itself for the model call; the rest is what the Claude Code CLI and its tools (git, registries, docs) reach.
#
# GitHub: the gateway injects claude-rc's token (the Secret github-token, from k8s/apps/kagent/externalsecrets.yaml), so the actor never holds it. A credential needs an exact origin, so
# api.github.com is listed besides the *.github.com wildcard it is covered by (the check script allows exactly that). The client has to send the header the gateway replaces:
# git on github.com (a placeholder set in the harness image's gitconfig) and gh on api.github.com (GH_TOKEN, a placeholder, in the Harness env).
# **This is the GitHub App's full grant on its repositories, write access included**: the gateway keeps the token out of the actor, but anything the agent can be talked into doing with it
# (a push, a pull request) it can do.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/api.kagent.dev/egresspolicy_v1alpha3.json
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: claude-runner-allowlist
  namespace: kagent
spec:
  destinations:
    - origin: "https://*.actions.githubusercontent.com"
    - origin: "https://*.blob.core.windows.net"
    - origin: "https://*.cilium.io"
    - origin: "https://*.claudeusercontent.com"
    - origin: "https://*.github.com"
    - origin: "https://*.github.io"
    - origin: "https://*.githubusercontent.com"
    - origin: "https://*.portableinfo.cloud"
    - origin: "https://*.quay.io"
    - origin: "https://anthropic.com"
    - origin: "https://api.anthropic.com"
    - origin: "https://auth.docker.io"
    - origin: "https://cilium.io"
    - origin: "https://claude.ai"
    - origin: "https://claude.com"
    - origin: "https://code.claude.com"
    - origin: "https://context7.com"
    - origin: "https://developers.cloudflare.com"
    - origin: "https://downloads.claude.ai"
    - origin: "https://gcr.io"
    - origin: "https://ghcr.io"
    - origin: "https://github.com"
      authentication:
        header: Authorization
        prefix: "Basic "
        secretKeyRef:
          name: github-token
          key: basic
    - origin: "https://api.github.com"
      authentication:
        header: Authorization
        prefix: "Bearer "
        secretKeyRef:
          name: github-token
          key: token
    - origin: "https://githubassets.com"
    - origin: "https://githubcopilot.com"
    - origin: "https://index.docker.io"
    - origin: "https://mcp.cloudflare.com"
    - origin: "https://mirror.gcr.io"
    - origin: "https://platform.claude.com"
    - origin: "https://portableinfo.eu-central-1.omni.siderolabs.io"
    - origin: "https://production.cloudflare.docker.com"
    - origin: "https://quay.io"
    - origin: "https://registry-1.docker.io"
    - origin: "https://registry.npmjs.org"
    - origin: "https://speed.cloudflare.com"
    - origin: "https://storage.googleapis.com"
