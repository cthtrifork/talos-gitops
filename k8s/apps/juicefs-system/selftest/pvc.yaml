# Throwaway test of the juicefs StorageClass: remove this directory once it has passed.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: juicefs-selftest
  namespace: juicefs-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs
  resources:
    requests:
      storage: 1Gi
