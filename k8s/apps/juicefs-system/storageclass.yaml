# ReadWriteMany volumes: each PVC is a subdirectory of the one JuiceFS filesystem (credentials in the juicefs-volume secret)
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/storage.k8s.io/storageclass_v1.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs
provisioner: csi.juicefs.com
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-volume
  csi.storage.k8s.io/provisioner-secret-namespace: juicefs-system
  csi.storage.k8s.io/node-publish-secret-name: juicefs-volume
  csi.storage.k8s.io/node-publish-secret-namespace: juicefs-system
reclaimPolicy: Delete
volumeBindingMode: Immediate
