# The S3 key for the JuiceFS bucket (juicefs-s3-key) and Garage's RPC secret and admin token (juicefs-garage-secrets).
# The values are generated once in the cluster store (k8s/infra/secret-store/) and copied here; no key is in Git.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: juicefs-s3-key
  namespace: juicefs-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: juicefs-s3-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: juicefs-s3-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: juicefs-garage-secrets
  namespace: juicefs-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: juicefs-garage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: juicefs-garage-secrets
