# The S3 key for the JuiceFS bucket (juicefs-s3-key), Garage's RPC secret and admin token (juicefs-garage-secrets), and the
# volume credentials the CSI driver reads (juicefs-volume). The values are generated once in the cluster store
# (k8s/infra/secret-store/) and copied here; no key is in Git. PostgreSQL has no password: it takes a client certificate.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: juicefs-s3-key
  namespace: juicefs-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: juicefs-s3-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: juicefs-s3-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: juicefs-garage-secrets
  namespace: juicefs-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: juicefs-garage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: juicefs-garage-secrets
---
# The volume credentials of the StorageClass. The metadata engine is PostgreSQL over mTLS: configs mounts the client
# certificate Secret into every mount pod. S3 has no mTLS (Garage signs requests with the key), and the region must be garage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: juicefs-volume
  namespace: juicefs-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: juicefs-volume
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        name: juicefs
        metaurl: "postgres://juicefs@juicefs-meta-rw.juicefs-system.svc:5432/juicefs?sslmode=verify-full&sslcert=/etc/juicefs-pg/tls.crt&sslkey=/etc/juicefs-pg/tls.key&sslrootcert=/etc/juicefs-pg/ca.crt"
        storage: s3
        bucket: "http://garage.juicefs-system.svc:3900/juicefs"
        access-key: "{{ .accessKeyId }}"
        secret-key: "{{ .secretAccessKey }}"
        envs: '{"AWS_REGION":"garage"}'
        configs: "{juicefs-meta-client: /etc/juicefs-pg}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: juicefs-s3-key
        property: access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: juicefs-s3-key
        property: secret-access-key
