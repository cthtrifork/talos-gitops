# The Garage volumes, named as the StatefulSet would create them (<template>-garage-<n>). The StatefulSet only creates a claim
# that is missing and never resizes one, and its volumeClaimTemplates are immutable: so the sizes live here. To grow a
# volume, edit the size below (the storage class expands it online) and raise layout.capacity in helm-release.yaml.
# prune disabled: removing a claim from Git must not delete the data.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-garage-0
  namespace: juicefs-system
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: garage
    app.kubernetes.io/component: garage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: lvm-bulk
  resources:
    requests:
      storage: 30Gi
