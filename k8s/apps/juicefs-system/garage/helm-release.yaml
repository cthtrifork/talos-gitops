---
# Three Garage nodes (replication_factor 3) holding the JuiceFS data blocks: one node can be lost without losing data or writes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: juicefs-system
spec:
  interval: 30m
  releaseName: garage
  # three ordered pods with their volumes, then the configure hook (which sleeps 120s)
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: garage
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # https://github.com/datahub-local/garage-helm/blob/main/charts/garage/values.yaml
  values:
    deployment:
      replicaCount: 3
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    # no vg-bulk on this node, so the data PVC could never be provisioned
                    - talos-tba-msi
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Not /health: it 503s until the garage-configure post-install hook assigns the layout, and that hook waits for the
    # StatefulSet to be ready, so on an empty volume it deadlocks. Probe the admin port instead.
    livenessProbe:
      tcpSocket:
        port: 3903
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      tcpSocket:
        port: 3903
      initialDelaySeconds: 10
      periodSeconds: 15

    commonLabels:
      prometheus-scrape: "true"
    monitoring:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
    # PodSecurity restricted: the chart's defaults lack these two fields
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
    image:
      repository: mirror.gcr.io/dxflrs/garage
      # renovate: datasource=docker depName=dxflrs/garage versioning=docker
      tag: v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
    garage:
      replicationFactor: "3"
      s3:
        api:
          region: garage
      # rpcSecret and adminToken, from External Secrets
      secret:
        create: false
        name: juicefs-garage-secrets
    # Initial sizes only: volumeClaimTemplates are immutable, so never change these. The real sizes are in pvc.yaml.
    persistence:
      enabled: true
      meta:
        storageClass: lvm-fast
        size: 1Gi
      data:
        storageClass: lvm-bulk
        size: 10Gi
    clusterConfig:
      enabled: true
      layout:
        enabled: true
        zone: dc1
        capacity: 10Gi
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
      buckets:
        - name: juicefs
      keys:
        juicefs:
          secretName: juicefs-s3-key
          keyId: access-key-id
          secretKey: secret-access-key
          buckets:
            - juicefs
      # static musl busybox, copied into the Garage image (no libc)
      toolsImage:
        repository: mirror.gcr.io/library/busybox
        tag: 1.38-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
      configureImage:
        repository: mirror.gcr.io/library/busybox
        tag: 1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
