---
# Source: valkey-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-operator
  namespace: valkey-operator-system
  labels:
    helm.sh/chart: valkey-operator-0.9.0
    app.kubernetes.io/name: valkey-operator
    app.kubernetes.io/instance: valkey-operator
    app.kubernetes.io/version: "v0.9.0"
    app.kubernetes.io/managed-by: Helm
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-operator
      app.kubernetes.io/instance: valkey-operator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: valkey-operator
        app.kubernetes.io/instance: valkey-operator
        control-plane: controller-manager
        prometheus-scrape: "true"
    spec:
      serviceAccountName: valkey-operator
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/valkey-io/valkey-operator:v0.9.0@sha256:e57008d92684c35ed0001b4e979593f5ab951f9560222e753375bd427750081c
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --metrics-secure=false
            - --watch-namespace=renovate-system
            - --default-valkey-image=valkey/valkey:9.0.0
            - --default-exporter-image=oliver006/redis_exporter:v1.88.0
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
