---
# Cache and SQLite database of the cache server, on JuiceFS: its pod can start on any node. Peak use was 5.7 GiB; the cap is in helm-release.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gha-cache-data-jfs
  namespace: gha-cache-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs
  resources:
    requests:
      storage: 16Gi
