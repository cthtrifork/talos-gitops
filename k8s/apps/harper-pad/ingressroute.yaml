---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harper-pad-sync
  namespace: harper-pad
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      # /readyz is excluded as a second line of defence; the probes are on :9102, which is not routed.
      match: Host(`harper-sync.portableinfo.cloud`) && !Path(`/readyz`)
      middlewares:
        - name: sync-headers
        - name: sync-ratelimit
        - name: sync-bodylimit
      services:
        - name: harper-pad-sync
          port: http
