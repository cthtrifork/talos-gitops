# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
# One instance, no backups: every device holds a full copy and Sync all repopulates an empty server.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harper-pad-db
  namespace: harper-pad
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  instances: 1
  # A single instance has nothing to fail over to; the default PDB would only block drains and Talos upgrades.
  enablePDB: false
  enableSuperuserAccess: false
  storage:
    size: 5Gi
    storageClass: lvm-fast
  resources:
    requests:
      cpu: 30m
      memory: 128Mi
    limits:
      memory: 256Mi
  bootstrap:
    initdb:
      database: harper
      # harper_admin owns the database and runs the migrations; harper_sync (public API) is login-only and gets
      # row-level rights from the migrations. initdb runs only at first creation.
      owner: harper_admin
      encoding: UTF8
  managed:
    roles:
      # No password: client certificate only (pg_hba below).
      - name: harper_admin
        ensure: present
        login: true
        comment: harper-pad-admin, the database owner; it applies the migrations
      - name: harper_sync
        ensure: present
        login: true
        comment: harper-pad-sync, the public API; rows only, no DDL and no ownership (the migrations grant what it needs)
  certificates:
    serverTLSSecret: harper-pad-db-server
    serverCASecret: harper-pad-db-ca
    clientCASecret: harper-pad-db-ca
    replicationTLSSecret: harper-pad-db-replication
  postgresql:
    pg_hba:
      # Before CNPG's default "host all all all scram-sha-256" rule; cert auth matches CN against the role name.
      - hostssl harper harper_sync all cert
      - hostssl harper harper_admin all cert
  inheritedMetadata:
    labels:
      prometheus-scrape: "true"
  monitoring:
    enablePodMonitor: true
