# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# harper-pad-admin: NO Service. The app listens on loopback only; a cloudflared sidecar maps the admin hostname
# (behind Cloudflare Access) to it.
#
# No app probes (Polaris exemption): kubelet cannot probe loopback and the image has no shell.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harper-pad-admin
  namespace: harper-pad
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: harper-pad-admin
  template:
    metadata:
      labels:
        app: harper-pad-admin
    spec:
      serviceAccountName: harper-pad-admin
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar: up before the app, outlives it.
        - name: cloudflared
          image: mirror.gcr.io/cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
          restartPolicy: Always
          args:
            - "tunnel"
            - "--no-autoupdate"
            - "--metrics"
            - "127.0.0.1:2000"
            - "run"
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harper-pad-admin-tunnel
                  key: token
          # kubelet cannot reach the loopback metrics port, so exec
          livenessProbe:
            exec:
              command:
                - "cloudflared"
                - "tunnel"
                - "--metrics"
                - "127.0.0.1:2000"
                - "ready"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - "cloudflared"
                - "tunnel"
                - "--metrics"
                - "127.0.0.1:2000"
                - "ready"
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: admin

          image: ghcr.io/cthtrifork/harper-pad-admin:v4.4.0@sha256:5cd998d5795bd5a01837459d619872317cbaad039c6dc7bfb947ae1c2e11714f
          env:
            - name: LISTEN_ADDR
              value: 127.0.0.1:9001
            - name: PGHOST
              value: harper-pad-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: harper
            - name: PGUSER
              value: harper_admin
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /db-client/ca.crt
            - name: PGSSLCERT
              value: /db-client/tls.crt
            - name: PGSSLKEY
              value: /db-client/tls.key
            - name: SYNC_PUBLIC_URL
              value: https://harper-sync.portableinfo.cloud/
          volumeMounts:
            - name: db-client
              mountPath: /db-client
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: db-client
          secret:
            secretName: harper-pad-db-client-admin
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
