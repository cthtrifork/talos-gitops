# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/podmonitor_v1.json
# The release label is what the kube-prometheus-stack Prometheus selects PodMonitors by. The admin pod has no metrics port.
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: harper-pad-sync
  namespace: harper-pad
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: harper-pad-sync
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
