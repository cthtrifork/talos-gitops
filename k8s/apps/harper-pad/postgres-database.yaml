# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/database_v1.json
# Declared so the owner follows this file on an existing cluster (`initdb` only runs at first creation).
# Tables created under another owner keep it: see "Database owner" in README.md.
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: harper-pad-db-harper
  namespace: harper-pad
spec:
  cluster:
    name: harper-pad-db
  name: harper
  owner: harper_admin
  # Deleting this object must never drop the database.
  databaseReclaimPolicy: retain
