# Cloudflare terminates TLS and forwards through the tunnel to Traefik's plain-HTTP "web" entrypoint. The app takes
# its scheme from PUBLIC_URL, not from headers.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sync-headers
  namespace: harper-pad
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    customResponseHeaders:
      Cache-Control: no-store
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sync-bodylimit
  namespace: harper-pad
spec:
  buffering:
    maxRequestBodyBytes: 3145728 # 3 MiB; the service takes at most 2 MiB of draft text plus 4 KiB around it and refuses more itself
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sync-ratelimit
  namespace: harper-pad
spec:
  # Generous on purpose: many drafts or several devices behind one NAT must not hit it; it only stops a runaway client.
  rateLimit:
    average: 50
    burst: 200
    period: 1s
    sourceCriterion:
      # every request arrives from the tunnel; this is the real client address
      requestHeaderName: Cf-Connecting-Ip
