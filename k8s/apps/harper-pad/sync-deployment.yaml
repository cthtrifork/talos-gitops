# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# harper-pad-sync: the API on :9000, reachable only from Traefik. TLS and DNS are Cloudflare's, via a tunnel in the
# Traefik pod.
#
# Probes are on :9102 next to /metrics, not the public port, so the internet cannot see the database state.
# /readyz does a database round trip (2 s limit), hence timeoutSeconds 3.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harper-pad-sync
  namespace: harper-pad
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # the DPoP replay cache is per pod: never two at once
  selector:
    matchLabels:
      app: harper-pad-sync
  template:
    metadata:
      labels:
        app: harper-pad-sync
        prometheus-scrape: "true"
    spec:
      serviceAccountName: harper-pad-sync
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: ghcr.io/cthtrifork/harper-pad-sync:v4.4.0@sha256:83a6e262968de0d61168f61d63a2749d7c9b540d1da3befc44217f3cb99cfb13
          env:
            # Must be https: or the service refuses to start.
            - name: PUBLIC_URL
              value: https://harper-sync.portableinfo.cloud
            # Empty allows none. PR previews do not sync.
            - name: CORS_ALLOWED_ORIGINS
              value: https://harper.portableinfo.cloud,wails://localhost,http://wails.localhost
            - name: LISTEN_ADDR
              value: ":9000"
            # libpq settings; client certificate only, no password.
            - name: PGHOST
              value: harper-pad-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: harper
            - name: PGUSER
              value: harper_sync
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /db-client/ca.crt
            - name: PGSSLCERT
              value: /db-client/tls.crt
            - name: PGSSLKEY
              value: /db-client/tls.key
          ports:
            - name: app
              containerPort: 9000
            - name: metrics
              containerPort: 9102
          volumeMounts:
            - name: db-client
              mountPath: /db-client # a directory mount, not subPath, so renewals reach the pod
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: db-client
          secret:
            secretName: harper-pad-db-client-sync
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
