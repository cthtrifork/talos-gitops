# Writes a new upload token into the Secrets every month; Reloader restarts the fileserver. Run it once after the first deploy:
#   kubectl -n fileserver-system create job --from=cronjob/fileserver-rotate rotate-first
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fileserver-rotate
  namespace: fileserver-system
spec:
  schedule: "17 3 1 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: fileserver-rotate
        spec:
          restartPolicy: Never
          serviceAccountName: fileserver-rotate
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # curl_user in the curl image
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              # renovate: datasource=docker depName=mirror.gcr.io/curlimages/curl versioning=docker
              image: mirror.gcr.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              command:
                - sh
                - -ec
                - |
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  TOKEN=fs_$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
                  for ns in $NAMESPACES; do
                    curl -sS --fail --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" \
                      -X PATCH -H 'Content-Type: application/merge-patch+json' \
                      -d "{\"stringData\":{\"current\":\"$TOKEN\",\"rotated-at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" \
                      -o /dev/null https://kubernetes.default.svc/api/v1/namespaces/$ns/secrets/fileserver-upload-token
                  done
              env:
                - name: NAMESPACES
                  value: fileserver-system arc-runners-system
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
