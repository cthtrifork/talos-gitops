# Rotates the upload token daily (rotate-token.sh). Run it once after the first deploy:
#   kubectl -n fileserver-system create job --from=cronjob/fileserver-rotate rotate-first
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fileserver-rotate
  namespace: fileserver-system
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: fileserver-rotate
        spec:
          restartPolicy: Never
          serviceAccountName: fileserver-rotate
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # curl_user in the curl image
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              # renovate: datasource=docker depName=mirror.gcr.io/curlimages/curl versioning=docker
              image: mirror.gcr.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              command:
                - "sh"
                - "/scripts/rotate-token.sh"
              env:
                # the first decides when to rotate
                - name: NAMESPACES
                  value: fileserver-system arc-runners-system
                - name: SECRET_NAME
                  value: fileserver-upload-token
                - name: ROTATE_AFTER_DAYS
                  value: "30"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: fileserver-rotate-script
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
