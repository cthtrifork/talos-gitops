# Creates and rotates the upload token. A busybox shell script and curl against the Kubernetes API: the app itself never
# touches Secrets. Runs daily and rotates when the token is older than ROTATE_AFTER_DAYS, so the token changes every 30
# days; a missing or edited copy is repaired the same day. The script is rotate-token.sh (see the header there), tested by
# scripts/ci/test-rotate-token.py.
#
# The first token: pods start without the Secret (it is optional), uploads are refused until it exists. After the first
# deploy run the job once instead of waiting for 03:17:
#   kubectl -n fileserver create job --from=cronjob/fileserver-rotate rotate-first
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fileserver-rotate
  namespace: fileserver
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: fileserver-rotate
        spec:
          restartPolicy: Never
          serviceAccountName: fileserver-rotate
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # curl_user in the curl image
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              # renovate: datasource=docker depName=mirror.gcr.io/curlimages/curl versioning=docker
              image: mirror.gcr.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              command:
                - "sh"
                - "/scripts/rotate-token.sh"
              env:
                # The first namespace decides when to rotate; every one gets the same Secret.
                - name: NAMESPACES
                  value: fileserver arc-runners-system
                - name: SECRET_NAME
                  value: fileserver-upload-token
                - name: ROTATE_AFTER_DAYS
                  value: "30"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: fileserver-rotate-script
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
