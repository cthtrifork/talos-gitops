# Default deny. Prometheus is allowed by the policy in kube-prometheus-stack, the kubelet probes arrive from the host.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fileserver-default-deny
  namespace: fileserver-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fileserver-allow-dns
  namespace: fileserver-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
---
# 8080 Traefik, 8081 the Omni exposer (host or remote-node), 8082 the runners
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fileserver
  namespace: fileserver-system
spec:
  endpointSelector:
    matchLabels:
      app: fileserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arc-runners-system
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
  egress:
    # r2-sync: <account-id>.r2.cloudflarestorage.com. The DNS rule lets Cilium learn the addresses.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.r2.cloudflarestorage.com"
    - toFQDNs:
        - matchPattern: "*.r2.cloudflarestorage.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
