# The app reads the token from a mounted Secret and never talks to the Kubernetes API: no API token in the pod.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fileserver
  namespace: fileserver
automountServiceAccountToken: false
---
# The rotation CronJob. It is the only thing that writes the token Secret (see rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fileserver-rotate
  namespace: fileserver
