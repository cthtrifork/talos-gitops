# fileserver: one pod, three containers from one image, one volume. Each container mounts only what it needs: the public
# one sees public/ read-only, so a bug there cannot leak a private file or the token. See images/fileserver/README.md.
#
# IMAGE: ghcr.io/cthtrifork/talos-gitops/fileserver, built and signed by build-image.yaml on a release tag. Pinned to the tag
# and its digest; Renovate keeps both up to date. The package is public, so the pod needs no pull secret.
#
# Memory: the upload path streams, so the heap stays small. Written files sit in the page cache, which counts against the
# limit, and the app fsyncs every 64 MiB to bound it. GOMEMLIMIT is about 80% of the limit because Go does not read the
# cgroup limit itself. These numbers are estimates, not measurements: watch container_memory_working_set_bytes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileserver
  namespace: fileserver
spec:
  replicas: 1
  strategy:
    type: Recreate # one ReadWriteOnce volume: never two pods at once
  selector:
    matchLabels:
      app: fileserver
  template:
    metadata:
      labels:
        app: fileserver
        prometheus-scrape: "true"
    spec:
      serviceAccountName: fileserver
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: public
          image: &image ghcr.io/cthtrifork/talos-gitops/fileserver:v0.12.0@sha256:c7cdcecf619866d5c30c8ff86d8700cefd2c01a0e99d534fec221f65ced2f7f1
          args:
            - "--mode=public"
          env:
            - name: PUBLIC_DIR
              value: /data/public
            - name: LISTEN_ADDR
              value: ":8080"
            - name: HEALTH_ADDR
              value: ":9102"
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: public
              containerPort: 8080
            - name: m-public
              containerPort: 9102
          livenessProbe:
            httpGet:
              path: /healthz
              port: m-public
          readinessProbe:
            httpGet:
              path: /healthz
              port: m-public
          securityContext: &sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data/public
              subPath: public
              readOnly: true

        - name: admin
          image: *image
          args:
            - "--mode=admin"
          env:
            - name: DATA_DIR
              value: /data
            - name: TOKEN_DIR
              value: /var/run/fileserver-token
            - name: LISTEN_ADDR
              value: ":8081"
            - name: HEALTH_ADDR
              value: ":9103"
            - name: PUBLIC_URL
              value: https://files.portableinfo.cloud
            - name: MAX_FILE_BYTES
              value: "8589934592" # 8 GiB
            - name: ROTATE_AFTER
              value: 720h # only for the "next rotation" text; the CronJob decides
            - name: GOMEMLIMIT
              value: 300MiB
          ports:
            - name: admin
              containerPort: 8081
            - name: m-admin
              containerPort: 9103
          livenessProbe:
            httpGet:
              path: /healthz
              port: m-admin
          readinessProbe:
            httpGet:
              path: /healthz
              port: m-admin
          securityContext: *sc
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token
              mountPath: /var/run/fileserver-token
              readOnly: true

        - name: upload
          image: *image
          args:
            - "--mode=upload"
          env:
            - name: DATA_DIR
              value: /data
            - name: TOKEN_DIR
              value: /var/run/fileserver-token
            - name: LISTEN_ADDR
              value: ":8082"
            - name: HEALTH_ADDR
              value: ":9104"
            - name: MAX_FILE_BYTES
              value: "8589934592" # 8 GiB
            - name: GOMEMLIMIT
              value: 300MiB
          ports:
            - name: upload
              containerPort: 8082
            - name: m-upload
              containerPort: 9104
          livenessProbe:
            httpGet:
              path: /healthz
              port: m-upload
          readinessProbe:
            httpGet:
              path: /healthz
              port: m-upload
          securityContext: *sc
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token
              mountPath: /var/run/fileserver-token
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fileserver-data
        # Written by the rotation CronJob. optional: the pod starts before the first rotation, uploads are refused until
        # then. The kubelet refreshes the mounted files within about a minute of a rotation and the app re-reads them on every
        # request, so no restart is needed.
        - name: token
          secret:
            secretName: fileserver-upload-token
            optional: true
            defaultMode: 0440
