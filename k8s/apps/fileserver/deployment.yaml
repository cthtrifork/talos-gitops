# Downloads are served by Cloudflare R2 (r2-sync copies public/ there), not by this pod.
# GOMEMLIMIT is ~80% of the memory limit (Go does not read the cgroup limit). The memory numbers are estimates.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileserver
  namespace: fileserver-system
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # one ReadWriteOnce volume: never two pods at once
  selector:
    matchLabels:
      app: fileserver
      app.kubernetes.io/name: fileserver
  template:
    metadata:
      labels:
        app: fileserver
        app.kubernetes.io/name: fileserver
        prometheus-scrape: "true"
    spec:
      serviceAccountName: fileserver
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/fileserver versioning=semver
          image: ghcr.io/cthtrifork/talos-gitops/fileserver:0.0.0-20261118.10@sha256:790de1c26d9b00ed51f37eb4769a87c9160c2eac4281a1a726a377ad61c714d1
          args:
            - "--mode=admin"
          env:
            - name: DATA_DIR
              value: /data
            - name: LISTEN_ADDR
              value: ":8081"
            - name: HEALTH_ADDR
              value: ":9103"
            - name: PUBLIC_URL
              value: https://shared-files.portableinfo.cloud
            - name: UPLOAD_URL
              value: http://fileserver-upload.fileserver-system.svc:8082
            - name: MAX_FILE_BYTES
              value: "8589934592" # 8 GiB
            - name: GOMEMLIMIT
              value: 300MiB
          ports:
            - name: admin
              containerPort: 8081
            - name: m-admin
              containerPort: 9103
          livenessProbe:
            httpGet:
              path: /healthz
              port: m-admin
          readinessProbe:
            httpGet:
              path: /healthz
              port: m-admin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token
              mountPath: /var/run/fileserver-token
              readOnly: true

        - name: upload
          # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/fileserver versioning=semver
          image: ghcr.io/cthtrifork/talos-gitops/fileserver:0.0.0-20261118.10@sha256:790de1c26d9b00ed51f37eb4769a87c9160c2eac4281a1a726a377ad61c714d1
          args:
            - "--mode=upload"
          env:
            - name: DATA_DIR
              value: /data
            - name: LISTEN_ADDR
              value: ":8082"
            - name: HEALTH_ADDR
              value: ":9104"
            - name: MAX_FILE_BYTES
              value: "8589934592" # 8 GiB
            - name: GOMEMLIMIT
              value: 300MiB
          ports:
            - name: upload
              containerPort: 8082
            - name: m-upload
              containerPort: 9104
          livenessProbe:
            httpGet:
              path: /healthz
              port: m-upload
          readinessProbe:
            httpGet:
              path: /healthz
              port: m-upload
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token
              mountPath: /var/run/fileserver-token
              readOnly: true

        # Copies public/ to the R2 bucket every minute so that Cloudflare serves the downloads, not this pod. Idle until the
        # Secret fileserver-r2 (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET) exists. The pod is the source of truth:
        # files gone from public/ are deleted from the bucket, but --max-delete 50 stops a bad mount from emptying it.
        - name: r2-sync
          # renovate: datasource=docker depName=docker.io/rclone/rclone versioning=docker
          image: mirror.gcr.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          command:
            - sh
            - -ec
            - |
              until [ -n "$R2_BUCKET" ]; do date +%s > /state/alive; echo "no fileserver-r2 Secret yet"; sleep 60; done
              export RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare
              export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
              export RCLONE_CONFIG_R2_ENDPOINT="$R2_ENDPOINT" RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
              while true; do
                date +%s > /state/alive
                rclone sync /data/public "R2:$R2_BUCKET" --max-delete 50 --transfers 2 --checksum --stats-one-line -v || echo "sync failed"
                sleep 60
              done
          envFrom:
            - secretRef:
                name: fileserver-r2
                optional: true
          # The loop writes the time of each round to /state/alive. A sync stuck for 30 minutes restarts the container; readiness only
          # checks that the loop started, so a slow sync never takes the pod out of the Services.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ $(( $(date +%s) - $(cat /state/alive) )) -lt 1800 ]'
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command:
                - test
                - -s
                - /state/alive
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data/public
              subPath: public
              readOnly: true
            - name: state
              mountPath: /state

      volumes:
        - name: state
          emptyDir:
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: fileserver-data
        # TOKEN_DIR is not set: /var/run/fileserver-token is the default, and the name trips Polaris' sensitiveContainerEnvVar.
        # optional: uploads are refused until the first sync. Reloader restarts the pod when the Secret changes.
        - name: token
          secret:
            secretName: fileserver-upload-token
            optional: true
            defaultMode: 0440
