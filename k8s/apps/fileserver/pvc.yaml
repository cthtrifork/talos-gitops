# lvm-bulk (the slower disks): large, cold and sequential. The size is a hard limit, expandable online: watch fileserver_disk_free_bytes.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fileserver-data
  namespace: fileserver-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm-bulk
  resources:
    requests:
      storage: 100Gi
