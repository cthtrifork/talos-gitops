# Three Services, one per port, so a NetworkPolicy and a reader see which door is which.
---
apiVersion: v1
kind: Service
metadata:
  name: fileserver-public
  namespace: fileserver
spec:
  type: ClusterIP
  selector:
    app: fileserver
  ports:
    - name: http
      port: 8080
      targetPort: public
---
# Admin page, reached through the Omni service exposer (Omni is the login). Nothing else routes here.
apiVersion: v1
kind: Service
metadata:
  name: fileserver-admin
  namespace: fileserver
  annotations:
    omni-kube-service-exposer.sidero.dev/label: Fileserver
    omni-kube-service-exposer.sidero.dev/port: "50093"
    omni-kube-service-exposer.sidero.dev/prefix: files
spec:
  type: ClusterIP
  selector:
    app: fileserver
  ports:
    - name: http
      port: 80
      targetPort: admin
---
# Upload API for the runners: cluster-internal, opened by the NetworkPolicy to arc-runners-system only.
# http://fileserver-upload.fileserver.svc:8082
apiVersion: v1
kind: Service
metadata:
  name: fileserver-upload
  namespace: fileserver
spec:
  type: ClusterIP
  selector:
    app: fileserver
  ports:
    - name: http
      port: 8082
      targetPort: upload
