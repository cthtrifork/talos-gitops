---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - token-secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - cronjob.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - prometheusrule.yaml
# a new ConfigMap name on every change, so the next run uses the new script
configMapGenerator:
  - name: fileserver-rotate-script
    namespace: fileserver-system
    files:
      - rotate-token.sh
