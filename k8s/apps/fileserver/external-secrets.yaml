# The upload token (current, rotated-at) is generated and rotated every 30 days in the cluster store
# (k8s/infra/secret-store/) and copied into both namespaces within the hour; Reloader restarts the fileserver on a change.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fileserver-upload-token
  namespace: fileserver-system
  labels:
    app.kubernetes.io/part-of: fileserver
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: fileserver-upload-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: fileserver-upload-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fileserver-upload-token
  namespace: arc-runners-system
  labels:
    app.kubernetes.io/part-of: fileserver
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: fileserver-upload-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: fileserver-upload-token
