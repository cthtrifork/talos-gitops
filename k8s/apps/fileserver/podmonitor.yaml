# The three containers each serve /metrics on their own health port (m-public 9102, m-admin 9103, m-upload 9104).
# The release label is what the kube-prometheus-stack Prometheus selects PodMonitors by.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fileserver
  namespace: fileserver
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: fileserver
  podMetricsEndpoints:
    - port: m-public
      path: /metrics
    - port: m-admin
      path: /metrics
    - port: m-upload
      path: /metrics
