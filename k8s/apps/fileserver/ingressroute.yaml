# Public downloads. Cloudflare terminates TLS and forwards through the tunnel in the Traefik pod to the plain-HTTP "web"
# entrypoint. Only the public port of the pod is routed: the admin page and the upload API have no route here. Add the
# hostname in Cloudflare Zero Trust > Networks > Tunnels > the Traefik tunnel > Public hostname:
# files.portableinfo.cloud -> HTTP localhost:8000.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: files-ratelimit
  namespace: fileserver
spec:
  rateLimit:
    average: 10
    burst: 20
    period: 1s
    sourceCriterion:
      # the real client address as set by Cloudflare; every request arrives from the tunnel
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: files-inflight
  namespace: fileserver
spec:
  inFlightReq:
    amount: 4 # parallel downloads per client: the files are large and the node disk is one
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: files-headers
  namespace: fileserver
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fileserver-public
  namespace: fileserver
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`files.portableinfo.cloud`)
      middlewares:
        - name: files-ratelimit
        - name: files-inflight
        - name: files-headers
      services:
        - name: fileserver-public
          port: http
