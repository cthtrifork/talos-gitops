# Empty on purpose: Git creates the Secrets so the rotation job only needs get and patch, never create.
# IfNotPresent: Flux never overwrites the token the job writes. prune disabled: removing this file must not delete a live token.
---
apiVersion: v1
kind: Secret
metadata:
  name: fileserver-upload-token
  namespace: fileserver-system
  labels:
    app.kubernetes.io/part-of: fileserver
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: fileserver-upload-token
  namespace: arc-runners-system
  labels:
    app.kubernetes.io/part-of: fileserver
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
