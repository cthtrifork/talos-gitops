# The upload token Secrets, created empty by Git so the rotation CronJob needs no permission to create Secrets: it only gets
# and patches these two names (rbac.yaml) and writes current, previous and rotated-at (rotate-token.sh). One copy per reader:
# the fileserver pod mounts the first, the ARC runners read the second as FILESERVER_TOKEN.
#
# IfNotPresent: Flux creates a missing Secret and never updates an existing one, so it cannot overwrite a token or fight the
# job over its data or metadata. prune disabled: removing a file from Git must not delete a live token. A Secret that was
# deleted by hand comes back empty at the next reconcile (30 minutes) and the next job run rotates it. There is no data
# here, so nothing needs SOPS (scripts/ci/check-secrets-encrypted.sh only flags Secrets with data).
---
apiVersion: v1
kind: Secret
metadata:
  name: fileserver-upload-token
  namespace: fileserver
  labels:
    app.kubernetes.io/part-of: fileserver
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: fileserver-upload-token
  namespace: arc-runners-system
  labels:
    app.kubernetes.io/part-of: fileserver
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
