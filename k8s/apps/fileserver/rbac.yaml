# What the rotation CronJob may do: read and patch the one Secret `fileserver-upload-token`, in the fileserver namespace
# (read by the admin and upload containers) and in the runner namespace (read by the ARC runners). Git creates those Secrets
# (token-secret.yaml), so the job has no `create` and cannot make a Secret of its own; it can touch no other Secret.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fileserver-rotate
  namespace: fileserver
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "fileserver-upload-token"
    verbs:
      - "get"
      - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fileserver-rotate
  namespace: fileserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fileserver-rotate
subjects:
  - kind: ServiceAccount
    name: fileserver-rotate
    namespace: fileserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fileserver-rotate
  namespace: arc-runners-system
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "fileserver-upload-token"
    verbs:
      - "get"
      - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fileserver-rotate
  namespace: arc-runners-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fileserver-rotate
subjects:
  - kind: ServiceAccount
    name: fileserver-rotate
    namespace: fileserver
