---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-controller
  namespace: arc-controller-system
spec:
  interval: 30m
  releaseName: gha-runner-scale-set-controller
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
  install:
    remediation:
      retries: 3
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set-controller/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/actions/gha-runner-scale-set-controller versioning=docker
      tag: 0.15.1@sha256:4b51a20db717b194e2f3fa96cfe2ddcb21602811f79053c75fd1a383517b9f90
    # talks to github.com; see "Trust bundle injection" in docs/security.md
    podAnnotations:
      # auto only sees volumes in the pod spec, not the bundle that Kyverno injects
      configmap.reloader.stakater.com/reload: portableinfo-ca-bundle
      trust.portableinfo.cloud/public: "true"
    serviceAccount:
      create: true
    watchSingleNamespace: arc-runners-system
    flags:
      updateStrategy: "eventual"
      # adds /healthz liveness and readiness probes to the controller
      healthProbeBindAddress: ":8081"
    # The listener pods' only HTTP server is their metrics exporter, so it is on for their probes (the scale sets' listenerTemplate).
    # "0" keeps the controller's own metrics off.
    metrics:
      controllerManagerAddr: "0"
      listenerAddr: ":8080"
      listenerEndpoint: "/metrics"
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    podSecurityContext:
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
