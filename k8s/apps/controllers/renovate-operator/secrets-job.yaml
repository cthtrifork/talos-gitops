# Creates the Secrets garage-s3-key (the S3 key shared by Garage and the operator) and garage-secrets (Garage's RPC secret
# and admin token) once, if they do not exist, so no key is in Git. It never rotates or overwrites a Secret; delete one
# by hand to start over (a new garage-s3-key is imported by Garage's configure job on its next run).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-secrets
  namespace: renovate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-secrets
  namespace: renovate-system
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "garage-s3-key"
      - "garage-secrets"
    verbs:
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-secrets
  namespace: renovate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: renovate-secrets
subjects:
  - kind: ServiceAccount
    name: renovate-secrets
    namespace: renovate-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: renovate-secrets
  namespace: renovate-system
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled # a new image digest changes the immutable pod template: Flux recreates the Job
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: renovate-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create
          image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
          command:
            - sh
            - -ec
            - |
              hex() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              if kubectl get secret garage-s3-key >/dev/null 2>&1; then
                echo "garage-s3-key exists, leaving it alone"
              else
                # Garage wants a key id of GK plus 24 hex characters and a secret key of 64 hex characters
                kubectl create secret generic garage-s3-key \
                  --from-literal=access-key-id="GK$(hex 12)" \
                  --from-literal=secret-access-key="$(hex 32)"
              fi
              if kubectl get secret garage-secrets >/dev/null 2>&1; then
                echo "garage-secrets exists, leaving it alone"
              else
                kubectl create secret generic garage-secrets \
                  --from-literal=rpcSecret="$(hex 32)" \
                  --from-literal=adminToken="$(hex 32)"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
