---
# Source: renovate-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renovate-operator
  namespace: renovate-system
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: renovate-operator
  template:
    metadata:
      labels:
        app: renovate-operator
        prometheus-scrape: "true"
    spec:
      serviceAccountName: renovate-operator
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: renovate-operator
          image: ghcr.io/mogenius/renovate-operator:6.10.0
          imagePullPolicy: IfNotPresent
          args:
            - "--zap-log-level=info"
            - "--zap-encoder=json"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JOB_TIMEOUT_SECONDS
              value: "1500"
            - name: JOB_BACKOFF_LIMIT
              value: "1"
            - name: DELETE_SUCCESSFUL_JOBS
              value: "true"
            - name: JOB_TTL_SECONDS_AFTER_FINISHED
              value: "3600"
            - name: IMAGE_PULL_SECRETS
              value: "[]"
            - name: SERVER_PORT
              value: "8081"
            - name: HEALTH_PROBE_PORT
              value: "8083"
            - name: LEADER_ELECTION_ID
              value: "renovate-operator-leader"
            - name: VALKEY_HOST
              value: "renovate-operator-valkey"
            - name: VALKEY_PORT
              value: "6379"
            - name: SESSION_STORE
              value: "cookie"
            - name: SESSION_DURATION
              value: "24h"
            - name: VALKEY_FORWARD_CACHE_TO_JOBS
              value: "true"
            - name: POLICY_ENABLED
              value: "false"
            - name: POLICY_ALLOWED_HOSTS
              value: "api.github.com,github.com,gitlab.com,api.bitbucket.org,bitbucket.org,gitea.com,codeberg.org"
            - name: POLICY_REQUIRE_SECRET_REF_OPT_IN
              value: "true"
            - name: POLICY_ALLOWED_SERVICE_ACCOUNTS
              value: ""
            - name: POLICY_ALLOW_ROOT_USER
              value: "false"
            - name: POLICY_ALLOWED_IMAGES
              value: "renovate/renovate,docker.io/renovate/renovate,ghcr.io/renovatebot/renovate"
            - name: AUTHORIZATION_ENABLED
              value: "true"
            - name: AUTHORIZATION_SUSPEND_FROM_UI
              value: "false"
            - name: AUTHORIZATION_DEFAULT_ANONYMOUS_READ
              value: "false"
            - name: AUTHORIZATION_DEFAULT_ANONYMOUS_READ_LOGS
              value: "false"
            - name: GLOBAL_PARALLELISM_LIMIT
              value: "2"
            - name: POD_LABEL_TEMPLATES
              value: "{\"renovate-job\":\"true\"}"
            - name: LOG_STORE_MODE
              value: "valkey"
            - name: S3_BUCKET
              value: "renovate"
            - name: S3_REGION
              value: "garage"
            - name: S3_ENDPOINT
              value: "http://garage.renovate-system.svc.cluster.local:3900"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_LOG_PREFIX
              value: "renovate-logs"
            - name: S3_LOG_OBJECT_TAGS
              value: "{}"
            - name: S3_CACHE_PREFIX
              value: "renovate-cache"
            - name: S3_FORWARD_CACHE_TO_JOBS
              value: "true"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: "garage-s3-key"
                  key: "access-key-id"
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: "garage-s3-key"
                  key: "secret-access-key"
            - name: S3_CREDENTIALS_SECRET_NAME
              value: "garage-s3-key"
            - name: S3_ACCESS_KEY_ID_SECRET_KEY
              value: "access-key-id"
            - name: S3_SECRET_ACCESS_KEY_SECRET_KEY
              value: "secret-access-key"
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8083
              name: probes
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            timeoutSeconds: 5
