---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-system
spec:
  interval: 30m
  releaseName: renovate-operator
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  install:
    createNamespace: true
  # https://github.com/mogenius/renovate-operator/blob/main/charts/renovate-operator/values.yaml
  values:
    fullnameOverride: renovate-operator
    # The CRDs are part of the release (not a kubectl hook Job, which would need egress)
    crd:
      mode: template
    deployment:
      podLabels:
        prometheus-scrape: "true"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    # The shared cache for the job pods (forwarded to Renovate as its redisUrl). A lost cache only costs a cold run,
    # so no volume and no password: the namespace policy lets only the operator and the job pods reach it.
    valkey:
      enabled: true
      auth:
        enabled: false
      dataStorage:
        enabled: false
      podLabels:
        prometheus-scrape: "true"
      # redis_exporter sidecar (keyspace hits and misses, memory), scraped on 9121
      metrics:
        enabled: true
        exporter:
          image:
            # renovate: datasource=docker depName=ghcr.io/oliver006/redis_exporter
            tag: v1.79.0@sha256:67e175f144212fe5796b3134dae1f3db33782b57dc53f7c6f5d938f8f70d9754
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
    # Renovate's repository cache in Garage (forwarded to the job pods as RENOVATE_S3_URL)
    s3:
      bucket: renovate
      endpoint: http://garage.renovate-system.svc.cluster.local:3900
      region: garage
      forcePathStyle: true
      cachePrefix: renovate-cache
      existingSecret: garage-s3-key
    config:
      defaultJobActiveDeadlineSeconds: 1500
      globalParallelismLimit: 2
      deleteSuccessfulJobs: true
      jobTTLSecondsAfterFinished: 3600
      forwardCacheToJobs: true
      forwardS3CacheToJobs: true
      # lets the namespace policy select the Renovate job pods
      podLabelTemplates:
        renovate-job: "true"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
