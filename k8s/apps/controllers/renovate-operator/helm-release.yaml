---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-system
spec:
  interval: 30m
  releaseName: renovate-operator
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  dependsOn:
    - name: valkey-resources
  install:
    remediation:
      retries: 3
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # https://github.com/mogenius/renovate-operator/blob/main/charts/renovate-operator/values.yaml
  values:
    fullnameOverride: renovate-operator
    image:
      # renovate: datasource=docker depName=ghcr.io/mogenius/renovate-operator versioning=docker
      tag: 7.0.0@sha256:27e71ee7f6891d00893859df8898e1e97dec7b804f55a4c1800a153b453cee9d
    # The CRDs are part of the release (not a kubectl hook Job, which would need egress)
    crd:
      mode: template
    deployment:
      annotations:
        secret.reloader.stakater.com/reload: renovate-valkey-credentials
      podLabels:
        prometheus-scrape: "true"
      podAnnotations:
        configmap.reloader.stakater.com/reload: portableinfo-ca-bundle # the bundle is injected by Kyverno, invisible to auto
        trust.portableinfo.cloud/public: "true" # api.github.com
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    externalKeyValueStore:
      host: valkey-renovate.renovate-system.svc.cluster.local
      cluster: true
      useTls: true
      username: renovate
      existingSecret:
        name: renovate-valkey-credentials
        passwordKey: password
    # Repository cache in Garage
    s3:
      bucket: renovate
      endpoint: http://garage.renovate-system.svc.cluster.local:3900
      region: garage
      forcePathStyle: true
      cachePrefix: renovate-cache
      existingSecret: garage-s3-key
    config:
      defaultJobActiveDeadlineSeconds: 1500
      globalParallelismLimit: 2
      deleteSuccessfulJobs: true
      jobTTLSecondsAfterFinished: 3600
      # Renovate's cluster cache client currently applies TLS only to discovery.
      forwardCacheToJobs: false
      forwardS3CacheToJobs: true
      # Last run's log per project for the UI.
      logStorage:
        mode: valkey
      podLabelTemplates:
        renovate-job: "true"
        # RenovateJob has no pod annotations; the Kyverno policy reads this as a label too. The jobs reach GitHub and
        # the package registries, so they need the public CAs.
        trust.portableinfo.cloud/public: "true"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
