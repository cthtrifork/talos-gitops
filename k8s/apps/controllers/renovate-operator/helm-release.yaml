---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-system
spec:
  interval: 30m
  releaseName: renovate-operator
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  install:
    remediation:
      retries: 3
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # https://github.com/mogenius/renovate-operator/blob/main/charts/renovate-operator/values.yaml
  values:
    fullnameOverride: renovate-operator
    image:
      # renovate: datasource=docker depName=ghcr.io/mogenius/renovate-operator versioning=docker
      tag: 6.10.0@sha256:a7f7e7448a5f5c8ea91f56566b940754fe1fe46447c75d375eacf4ced12e6655
    # The CRDs are part of the release (not a kubectl hook Job, which would need egress)
    crd:
      mode: template
    deployment:
      podLabels:
        prometheus-scrape: "true"
      podAnnotations:
        trust.portableinfo.cloud/public: "true" # api.github.com
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    # A lost cache only costs a cold run, so no volume and no password (the namespace policy limits access).
    valkey:
      enabled: true
      image:
        registry: mirror.gcr.io
        # renovate: datasource=docker depName=mirror.gcr.io/valkey/valkey versioning=docker
        tag: 9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
      auth:
        enabled: false
      dataStorage:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 512Mi
      readinessProbe:
        enabled: true
    # Repository cache in Garage
    s3:
      bucket: renovate
      endpoint: http://garage.renovate-system.svc.cluster.local:3900
      region: garage
      forcePathStyle: true
      cachePrefix: renovate-cache
      existingSecret: garage-s3-key
    config:
      defaultJobActiveDeadlineSeconds: 1500
      globalParallelismLimit: 2
      deleteSuccessfulJobs: true
      jobTTLSecondsAfterFinished: 3600
      forwardCacheToJobs: true
      forwardS3CacheToJobs: true
      # Last run's log per project for the UI; lost when Valkey restarts
      logStorage:
        mode: valkey
      podLabelTemplates:
        renovate-job: "true"
        # RenovateJob has no pod annotations; the Kyverno policy reads this as a label too. The jobs reach GitHub and
        # the package registries, so they need the public CAs.
        trust.portableinfo.cloud/public: "true"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
