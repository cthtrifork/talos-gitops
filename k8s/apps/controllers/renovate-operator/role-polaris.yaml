# Polaris resolves a RoleBinding against the Roles of its namespace and reports rolebindingClusterAdminRole when it finds none.
# The elevate page binds ClusterRoles here (claude-elevate-*), so this Role only has to exist: it has no subjects and grants nothing.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-placeholder
  namespace: renovate-system
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - polaris-placeholder
    verbs:
      - get
