# Default deny, then per-component allows. Internet egress is an allowlist by DNS name; a job that fails to connect:
# find the host in the drop metrics (skill cilium-drops) and add it to the job list below.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: renovate-system-default-deny
  namespace: renovate-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: renovate-system-allow-dns
  namespace: renovate-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# The operator
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: renovate-operator
  namespace: renovate-system
spec:
  endpointSelector:
    matchLabels:
      app: renovate-operator
  ingress:
    # UI; the Omni service exposer runs on the host network
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# The Renovate job pods (label set by podLabelTemplates in the operator values)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: renovate-jobs
  namespace: renovate-system
spec:
  endpointSelector:
    matchLabels:
      renovate-job: "true"
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: github-cloud.s3.amazonaws.com
        - matchName: ghcr.io
        - matchPattern: "*.githubusercontent.com"
        - matchName: quay.io
        - matchPattern: "*.quay.io"
        - matchName: mirror.gcr.io
        - matchName: gcr.io
        - matchName: mcr.microsoft.com
        - matchName: cgr.dev
        - matchName: registry.access.redhat.com
        # cthtrifork/kglance builds in registry.fedoraproject.org/fedora
        - matchName: registry.fedoraproject.org
        - matchName: registry.k8s.io
        - matchName: cdn.registry.k8s.io
        # registry.k8s.io redirects images to Artifact Registry
        - matchPattern: "*.pkg.dev"
        - matchName: index.docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: production.cloudfront.docker.com
        - matchName: hub.docker.com
        - matchName: helm.cilium.io
        - matchName: kubernetes-sigs.github.io
        - matchName: charts.fairwinds.com
        - matchName: charts.redpanda.com
        # Package registries
        - matchName: registry.npmjs.org
        - matchName: proxy.golang.org
        - matchName: sum.golang.org
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: nodejs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Valkey (redisUrl) and Garage (repository cache over S3)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
# Valkey: only the operator and the job pods
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey
  namespace: renovate-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: renovate-operator
        - matchLabels:
            renovate-job: "true"
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# Garage: S3 only from job pods; RPC (3901) and admin (3903) only between Garage pods, including the configure Job.
# Peers are found through the API server.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage
  namespace: renovate-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  ingress:
    - fromEndpoints:
        - matchLabels:
            renovate-job: "true"
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
            - port: "3901"
              protocol: TCP
            - port: "3903"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
            - port: "3901"
              protocol: TCP
            - port: "3903"
              protocol: TCP
