# The S3 key shared by Garage and the operator (garage-s3-key) and Garage's RPC secret and admin token (garage-secrets).
# The values are generated once in the cluster store (k8s/infra/secret-store/) and copied here; no key is in Git.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-key
  namespace: renovate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-s3-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: garage-s3-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: renovate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: garage-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-valkey-credentials
  namespace: renovate-system
spec:
  refreshPolicy: CreatedOnce
  target:
    name: renovate-valkey-credentials
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: renovate-valkey-password
