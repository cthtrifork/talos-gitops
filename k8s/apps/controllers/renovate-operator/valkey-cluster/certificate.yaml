---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: renovate-valkey
  namespace: renovate-system
spec:
  secretName: renovate-valkey-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: certificate-cluster-issuer
  dnsNames:
    - valkey-renovate.renovate-system.svc.cluster.local
    - "*.valkey-renovate.renovate-system.svc.cluster.local"
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  privateKey:
    rotationPolicy: Always
