---
# Source: valkey-resources/templates/valkeycluster.yaml
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: renovate
  namespace: renovate-system
  labels:
    helm.sh/chart: valkey-resources-0.6.0
    app.kubernetes.io/name: valkey-resources
    app.kubernetes.io/instance: valkey-resources
    app.kubernetes.io/version: "v0.9.0"
    app.kubernetes.io/managed-by: Helm
spec:
  acl:
    users:
      - name: default
        password:
          type: Any
        permissions: ~* &* +@all
  exporter:
    enabled: false
  image: mirror.gcr.io/valkey/valkey:9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
  replicasPerShard: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  scheduling:
    node:
      spread:
        primaries:
          mode: Required
        shard:
          mode: Required
  shards: 3
