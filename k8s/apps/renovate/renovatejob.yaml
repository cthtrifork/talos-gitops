# Renovate for the cthtrifork repos in discoveryFilters (see ../controllers/renovate-operator/README.md). No credentials
# in the config: the token comes from the GitHub App.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
  namespace: renovate-system
spec:
  suspend: false
  schedule: "7,37 * * * *"
  # The default image is 427 MiB, -full 2.6 GB: tools (go for gomodTidy) are installed at run time into /opt/containerbase
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate versioning=docker
  image: ghcr.io/renovatebot/renovate:44.261.3@sha256:a94fbfa1977a07f98a6291b20ad630d076325526a64e730ebc1c61e4f648cff5
  parallelism: 2
  extraEnv:
    # The operator reads PR activity from Renovate's debug log
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_LOG_LEVEL
      value: debug
    # read-only root filesystem: tool caches (npm, go, pip) go to the scratch volume
    - name: HOME
      value: /tmp
  provider:
    name: github
  skipForks: true
  # The repositories are listed one by one, never cthtrifork/*
  discoveryFilters:
    - cthtrifork/talos-gitops
    - cthtrifork/github-runner-bootc
    - cthtrifork/harper-pad
    - cthtrifork/homeserver-bootc
    - cthtrifork/kglance
    - cthtrifork/trivy-dashboard-wail3
  githubAppReference:
    secretName: github-app-credentials
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  renovateConfig:
    fileName: config.js
    inline: |
      module.exports = {
        onboarding: false,
        requireConfig: 'required',
        cachePrivatePackages: true,
        // The union of the global options of the repositories above (their renovate.json5 is repo config here; the Actions
        // fallback loads the same global options from .github/workflows/renovate-config.js)
        allowedCommands: [
          '^scripts/update-htmx\\.sh [0-9]+\\.[0-9]+\\.[0-9]+$',
          '^scripts/podman-checksums\\.sh$',
        ],
      };
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  scratchVolume:
    sizeLimit: 2Gi
  # Writable /opt/containerbase on the read-only root filesystem: the image entrypoint sets it up, tools install on first use
  extraVolumes:
    - name: containerbase
      emptyDir:
        sizeLimit: 3Gi
  extraVolumeMounts:
    - name: containerbase
      mountPath: /opt/containerbase
  # Read-only root filesystem (only /tmp, the scratch volume, is writable). The container context is spelled out in full:
  # it may replace the operator's defaults, and the namespace enforces PodSecurity restricted.
  securityContext:
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 12021
      runAsGroup: 12021
      seccompProfile:
        type: RuntimeDefault
