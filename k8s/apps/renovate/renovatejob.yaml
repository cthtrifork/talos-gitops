# Renovate for the cthtrifork repositories, run by the operator in renovate-system. Live for the repositories in
# discoveryFilters; see
# ../controllers/renovate-operator/README.md for how to turn it on. The global config below is Renovate's global
# (self-hosted) config: no credentials in it, the token comes from the GitHub App.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
  namespace: renovate-system
spec:
  suspend: false
  schedule: "7,37 * * * *"
  # The full image (not -slim): harper-pad and kglance need go for gomodTidy
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate versioning=docker
  image: ghcr.io/renovatebot/renovate:44.242.0-full@sha256:9e5914a5ff8c579aa293421d37dc29f508cceefb273620c14f4b3ff5686b3a3d
  parallelism: 2
  extraEnv:
    # the root filesystem is read-only below: tools that write under their home (npm, go, pip caches) use the scratch volume
    - name: HOME
      value: /tmp
  provider:
    name: github
  skipForks: true
  # The repositories are listed one by one, never cthtrifork/*
  discoveryFilters:
    - cthtrifork/talos-gitops
    - cthtrifork/github-runner-bootc
    - cthtrifork/harper-pad
    - cthtrifork/homeserver-bootc
    - cthtrifork/kglance
    - cthtrifork/trivy-dashboard-wail3
  githubAppReference:
    secretName: github-app-credentials
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  renovateConfig:
    fileName: config.js
    inline: |
      module.exports = {
        onboarding: false,
        requireConfig: 'required',
        cachePrivatePackages: true,
        // The union of the global options of the repositories above (their renovate.json5 is repo config here; the Actions
        // fallback loads the same global options from .github/workflows/renovate-config.js)
        allowedCommands: [
          '^scripts/update-htmx\\.sh [0-9]+\\.[0-9]+\\.[0-9]+$',
          '^scripts/podman-checksums\\.sh$',
        ],
      };
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  scratchVolume:
    sizeLimit: 2Gi
  # Read-only root filesystem (only /tmp, the scratch volume, is writable). The container context is spelled out in full:
  # it may replace the operator's defaults, and the namespace enforces PodSecurity restricted.
  securityContext:
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 12021
      runAsGroup: 12021
      seccompProfile:
        type: RuntimeDefault
