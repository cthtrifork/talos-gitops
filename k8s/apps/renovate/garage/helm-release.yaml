---
# One Garage node holding Renovate's repository cache. No replicas and no redundancy: losing the data only costs a cold
# run. The S3 API and the admin API stay inside the cluster (no Ingress, no web UI).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: renovate-system
spec:
  interval: 30m
  releaseName: garage
  chartRef:
    kind: OCIRepository
    name: garage
  # https://github.com/datahub-local/garage-helm/blob/main/charts/garage/values.yaml
  values:
    deployment:
      replicaCount: 1
    # The namespace enforces PodSecurity restricted; the chart's defaults lack these two fields
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
    image:
      repository: mirror.gcr.io/dxflrs/garage
      # renovate: datasource=docker depName=dxflrs/garage
      tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    garage:
      replicationFactor: "1"
      s3:
        api:
          region: garage
      # rpcSecret and adminToken, created by the renovate-secrets Job in renovate-operator/
      secret:
        create: false
        name: garage-secrets
    persistence:
      enabled: true
      meta:
        storageClass: local-path
        size: 1Gi
      data:
        storageClass: local-path
        size: 10Gi
    clusterConfig:
      enabled: true
      layout:
        enabled: true
        zone: dc1
        capacity: 10Gi
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
      buckets:
        - name: renovate
      keys:
        renovate:
          # the Secret is created by the renovate-secrets Job and also read by the operator (s3.existingSecret)
          secretName: garage-s3-key
          keyId: access-key-id
          secretKey: secret-access-key
          buckets:
            - renovate
      # a statically linked busybox (musl): it is copied into and run from the Garage image, which has no libc
      toolsImage:
        repository: mirror.gcr.io/library/busybox
        tag: 1.38-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
      configureImage:
        repository: mirror.gcr.io/library/busybox
        tag: 1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
