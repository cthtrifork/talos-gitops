# Default deny both ways for the Substrate worker pods, where the actors run, then exactly what Substrate does with them. A worker is a server: atelet and the router call
# it, and the only thing it calls is the egress gateway (and DNS to find it). It does not need the Kubernetes API, the Substrate API server, Garage or the internet, and an actor
# cannot reach any of them from its sandbox. The ports are from the sources of the worker (workerpool_apply.go: 443 gRPC, 8443 tunnel, 8080 probes, which the kubelet
# reaches from the node). Not verified on this cluster: if an actor fails to start or to reach an allowed host, look for drops from the worker pods (skill cilium-drops).
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ate-workers-lockdown
  namespace: ate-workers
spec:
  endpointSelector:
    {}
  ingress:
    # atelet supervises the worker over gRPC (the "https" port)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atelet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # the router opens its tunnel to atunnel ("connect"; 443 with the Envoy router) to reach an actor
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "443"
              protocol: TCP
  egress:
    # DNS through kube-dns: atunnel resolves the egress gateway's service name
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # the actors' outbound traffic: atunnel tunnels it to the egress gateway (the pod port behind its "https" service port), which applies the actor's egress policy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
