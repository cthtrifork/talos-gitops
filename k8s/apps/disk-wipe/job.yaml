# One-shot wipes of the disks and partitions that are no longer used (see README.md and wipe.sh), one Job per node. A Job's template is immutable:
# to run a wipe again (a mounted target that was skipped), rename the Job (-1 to -2).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: disk-wipe-talos-tba-msi-2
  namespace: disk-wipe-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: talos-tba-msi
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: wipe
          # renovate: datasource=docker depName=quay.io/openebs/linux-utils versioning=docker
          image: quay.io/openebs/linux-utils:4.6.0@sha256:a3043d266b1c06fb42377ced0c3fc190c66e1e83ae1efda7670ed73feb4ede14
          command:
            - /bin/sh
            - /scripts/wipe.sh
          env:
            - name: DRY_RUN
              value: "false"
            - name: TARGETS
              value: |
                part|19953beb-3c63-4648-8dfe-9e31a203f842|200000000000|talos-tba-msi nvme0n1p1, the old 200 GB local-path volume (replaced by vg-fast)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: disk-wipe-script
            defaultMode: 0555
---
