# Default deny both ways for kagent's own pods, then DNS, the Kubernetes API and what each component needs. The worker pods of the WorkerPool (label ate.dev/worker-pool)
# are left out of the deny, as the ones in ate-workers are: their traffic is what Substrate's gateways mediate, and what they need beyond that is not known yet. Narrow them
# once Hubble shows it (skill cilium-drops). The model call and the tools leave an actor through atenet-egress, not from these pods.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-default-deny
  namespace: kagent
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: DoesNotExist
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-allow-dns-apiserver
  namespace: kagent
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: DoesNotExist
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# The controller: the UI calls it, and the actors call it back through the egress gateway (their task store and tools). It calls the database, the Substrate API
# server (mTLS gRPC) and the Substrate router (HTTPS, to reach an actor).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-controller
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: ui
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: kagent-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: ate-api-server
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-ui
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: ui
  ingress:
    # The Omni service exposer runs on the host network
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
---
# The database takes connections from the controller only, and status calls from the CloudNativePG operator
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-db
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: kagent-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
