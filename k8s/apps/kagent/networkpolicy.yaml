# Default deny both ways for kagent's own pods, then DNS, the Kubernetes API and what each component needs. The worker pods of the WorkerPool (label ate.dev/worker-pool)
# have their own policy at the end of this file, the same as the workers in ate-workers (ate-system-pools): they only answer atelet and the router and call the egress gateway.
# The model call and the tools leave an actor through atenet-egress, not from these pods.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-default-deny
  namespace: kagent
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: DoesNotExist
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-allow-dns-apiserver
  namespace: kagent
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: DoesNotExist
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# The controller: the UI calls it, and the actors call it back through the egress gateway (their task store and tools). It calls the database, the Substrate API
# server (mTLS gRPC) and the Substrate router (HTTPS, to reach an actor).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-controller
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: ui
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: kagent-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: ate-api-server
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # metrics: OTLP to Prometheus (config.telemetry in kagent/helm-release.yaml)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-ui
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: ui
  ingress:
    # The Omni service exposer runs on the host network
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
---
# The database takes connections from the controller only, and status calls from the CloudNativePG operator
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-db
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: kagent-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-workers
  namespace: kagent
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: Exists
  ingress:
    # atelet supervises the worker over gRPC (the "https" port)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atelet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # the router opens its tunnel to atunnel ("connect"; 443 with the Envoy router) to reach an actor
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "443"
              protocol: TCP
  egress:
    # DNS through kube-dns: atunnel resolves the egress gateway's service name
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # the actors' outbound traffic: atunnel tunnels it to the egress gateway (the pod port behind its "https" service port), which applies the actor's egress policy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
