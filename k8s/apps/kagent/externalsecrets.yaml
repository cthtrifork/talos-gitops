# The database passwords are generated in the cluster store (k8s/infra/secret-store/, kagent-postgres-*) and shaped here: as logins for CloudNativePG, and as the
# connection strings kagent's chart reads (database.postgres.*ConnectionStringSecretRef, at their default names and keys). sslmode=require encrypts the connection without
# verifying the server certificate. The Anthropic key is not here: it is a SOPS file you add (README.md). The GitHub token at the end is claude-rc's, injected by the gateway.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-db-owner
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: kagent-db-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kagent_owner_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: kagent-postgres-owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-db-readwrite
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: kagent-db-readwrite
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kagent_readwrite_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: kagent-postgres-readwrite
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-owner
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: kagent-postgres-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        ownerConnectionString: "postgresql://kagent_owner_user:{{ .password }}@kagent-db-rw.kagent.svc:5432/kagent?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: kagent-postgres-owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-readwrite
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: kagent-postgres-readwrite
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        readWriteConnectionString: "postgresql://kagent_readwrite_user:{{ .password }}@kagent-db-rw.kagent.svc:5432/kagent?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: kagent-postgres-readwrite
        property: password
---
# claude-rc's GitHub installation token (copied into the store by k8s/apps/claude-system/pushsecret.yaml), in the two forms the Substrate egress gateway injects into a request: `basic` is
# base64 of x-access-token:<token>, for git over HTTPS on github.com (Authorization: Basic), and `token` is the token itself, for the API on api.github.com (Authorization: Bearer). Only the
# credential provider reads this Secret, through the grant for the kagent atespace; the actor never holds either value. See ../kagent-agents/egresspolicy.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: kagent
spec:
  # the token expires after 60 minutes: keep this, the PushSecret and the credential provider's cache well below
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: github-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        token: "{{ .token }}"
        basic: '{{ printf "x-access-token:%s" .token | b64enc }}'
  data:
    - secretKey: token
      remoteRef:
        key: claude-github-token
        property: token
