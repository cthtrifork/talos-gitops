---
# Source: kagent/templates/rbac/management-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kagent-management-role
  namespace: kagent
  labels:
    helm.sh/chart: kagent-1.0.1
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kagent
rules:
  # Management API writes; dependency reads are granted by the reconciliation Role.
  - apiGroups:
      - api.kagent.dev
    resources:
      - harnesses
      - agents
      - egresspolicies
      - sandboxtemplates
      - agenttemplates
      - modelconfigs
      - modelproviderconfigs
      - remotemcpservers
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - create
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - delete
