---
# Source: kagent/templates/rbac/reconciliation-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kagent-reconciliation-role
  namespace: kagent
  labels:
    helm.sh/chart: kagent-1.0.1
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kagent
rules:
  # Shared reads for reconciliation and management API requests.
  - apiGroups:
      - api.kagent.dev
    resources:
      - harnesses
      - agents
      - egresspolicies
      - sandboxtemplates
      - agenttemplates
      - modelconfigs
      - modelproviderconfigs
      - remotemcpservers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - api.kagent.dev
    resources:
      - harnesses/finalizers
      - agents/finalizers
      - sandboxtemplates/finalizers
      - modelconfigs/finalizers
      - modelproviderconfigs/finalizers
      - remotemcpservers/finalizers
    verbs:
      - update
  - apiGroups:
      - api.kagent.dev
    resources:
      - agents/status
      - modelconfigs/status
      - modelproviderconfigs/status
      - remotemcpservers/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - api.kagent.dev
    resources:
      - sandboxtemplates/status
    verbs:
      - update
      - patch
  # SandboxTemplate finalizers are persisted through the main resource endpoint.
  - apiGroups:
      - api.kagent.dev
    resources:
      - sandboxtemplates
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ate.dev
    resources:
      - workerpools
    verbs:
      - get
      - list
      - watch
