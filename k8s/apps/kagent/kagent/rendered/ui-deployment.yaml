---
# Source: kagent/templates/ui-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-ui
  namespace: kagent
  labels:
    helm.sh/chart: kagent-1.0.1
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/component: ui
  template:
    metadata:
      annotations:
        checksum/configmap: 336a358fecfad6c459eeb406c4b412d21f7c85f05eb330321412218056320d49
        checksum/ui-config: 87cdf0a164db0d8ba560c53b4b796b071233c95b927b71ef06044b0bcdf994a7
      labels:
        app.kubernetes.io/component: ui
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kagent-ui
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
        - name: ui-config
          configMap:
            name: kagent-ui-config
      containers:
        - name: ui
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: "ghcr.io/kagent-dev/kagent/ui:1.0.1"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kagent-ui
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ui-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
            initialDelaySeconds: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
