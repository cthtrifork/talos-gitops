---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-talos-11a-esj
  namespace: net-test-system
spec:
  selector:
    app: iperf-server
    node: talos-11a-esj
  ports:
    - name: tcp
      port: 5201
      targetPort: iperf
      protocol: TCP
    - name: udp
      port: 5201
      targetPort: 5201
      protocol: UDP
