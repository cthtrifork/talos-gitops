# One client Job per node, each testing the servers of all three nodes (itself included, as the same-node baseline). The Jobs start 5 minutes apart
# so two clients never share a server. Read them with: kubectl -n net-test-system logs job/iperf-client-<node>-r2
---
apiVersion: batch/v1
kind: Job
metadata:
  name: iperf-client-talos-11a-esj-r2
  namespace: net-test-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: iperf-client
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: talos-11a-esj
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iperf3
          image: mirror.gcr.io/mlabbe/iperf3:3.19.1-r1@sha256:2bd525abbc4f5303ea65e587df669907f6eef670c2d93a56b283a71f2e56f2eb # renovate: datasource=docker depName=docker.io/mlabbe/iperf3 versioning=docker
          command:
            - /bin/sh
            - -c
            - |
              sleep 0
              echo "client node: $NODE_NAME, congestion control: $(cat /proc/sys/net/ipv4/tcp_congestion_control), allowed: $(cat /proc/sys/net/ipv4/tcp_allowed_congestion_control)"
              for target in talos-11a-esj talos-2ny-8tx talos-tba-msi; do
                S=iperf-server-$target.net-test-system.svc.cluster.local
                echo "##### $NODE_NAME -> $target"
                # wait for the server (it may still be starting)
                until timeout 10 iperf3 -c "$S" -t 1 >/dev/null 2>&1; do sleep 5; done
                # the default test every second, so a stall shows as intervals at 0 bits/sec
                for d in "" "-R"; do echo "=== iperf3 -c -t 10 -i 1 $d"; timeout 30 iperf3 -c "$S" -t 10 -i 1 $d 2>&1 | tail -16; done
                # the congestion control and a small segment size (a path MTU blackhole stalls only with the large default size)
                for args in "-C cubic" "-C cubic -R" "-C bbr" "-C bbr -R" "-M 1200" "-M 1200 -R"; do
                  echo "=== iperf3 -c -t 8 $args"
                  timeout 30 iperf3 -c "$S" -t 8 $args 2>&1 | grep -E "sender|receiver|error|unable|refused|Connection" | tail -3
                done
              done
              echo done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
