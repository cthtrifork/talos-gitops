# iperf3 servers on the host network of every node (port 5201 of the node), for the node to node test (see ../README.md). Temporary.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf-host-server-talos-11a-esj
  namespace: net-test-host-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iperf-host-server
      node: talos-11a-esj
  template:
    metadata:
      labels:
        app: iperf-host-server
        node: talos-11a-esj
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-11a-esj
      automountServiceAccountToken: false
      hostNetwork: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iperf3
          image: mirror.gcr.io/mlabbe/iperf3:3.19.1-r1@sha256:2bd525abbc4f5303ea65e587df669907f6eef670c2d93a56b283a71f2e56f2eb # renovate: datasource=docker depName=docker.io/mlabbe/iperf3 versioning=docker
          args:
            - -s
          ports:
            - name: iperf
              containerPort: 5201
              hostPort: 5201
          readinessProbe:
            tcpSocket:
              port: iperf
          livenessProbe:
            tcpSocket:
              port: iperf
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
