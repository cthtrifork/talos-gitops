---
# Source: substrate-atelet/templates/atelet.yaml
# Admit critical atelet pods on clusters that restrict system priority classes.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: atelet-critical-pods
  namespace: ate-system
spec:
  hard:
    pods: 1G
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: ["system-node-critical", "system-cluster-critical"]
---
# Source: substrate-atelet/templates/atelet.yaml
# atelet
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atelet
  namespace: ate-system
---
# Source: substrate-atelet/templates/atelet.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atelet-role
  namespace: ate-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["ate.dev"]
    resources: ["csidriverconfigs"]
    verbs: ["get", "watch", "list"]
  # Sync failures are reported as Warning Events on the worker pod.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # ClusterTrustBundles referenced by SystemInfo trustBundle data sources are
  # resolved on the node: atelet reads them through an informer and projects
  # the sanitized PEM into actors (see cmd/atelet/trustbundle.go).
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    verbs: ["get", "watch", "list"]
  # WorkerPools and SandboxConfigs resolve and prewarm each local worker's runtimes.
  - apiGroups: ["ate.dev"]
    resources: ["sandboxconfigs", "workerpools"]
    verbs: ["get", "list", "watch"]
---
# Source: substrate-atelet/templates/atelet.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atelet-binding
  namespace: ate-system
subjects:
  - kind: ServiceAccount
    name: atelet
    namespace: ate-system
roleRef:
  kind: ClusterRole
  name: atelet-role
  apiGroup: rbac.authorization.k8s.io
---
# Source: substrate-atelet/templates/atelet.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atelet-endpointslices
  namespace: ate-system
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
# Source: substrate-atelet/templates/atelet.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atelet-endpointslices
  namespace: ate-system
subjects:
  - kind: ServiceAccount
    name: atelet
    namespace: ate-system
roleRef:
  kind: Role
  name: atelet-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
# Source: substrate-atelet/templates/atelet.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet
  namespace: ate-system
  labels:
    app: atelet
spec:
  selector:
    matchLabels:
      app: atelet
  template:
    metadata:
      labels:
        app: atelet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: atelet
      priorityClassName: system-cluster-critical
      # Run on nodes reserved for any WorkerPool sandbox class.
      tolerations:
        - key: ate.dev/sandboxClass
          operator: Exists
          effect: NoSchedule
        # GKE reserves ComputeClass nodes with this taint.
        - key: cloud.google.com/compute-class
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: objectstore-plugin
          image: ghcr.io/kagent-dev/substrate/objectstore-plugin:v1.0.1
          restartPolicy: Always
          args:
            - node
            - --socket=/run/objectstore-plugin/node.sock
            - --root=/var/lib/ate
            - --asset-staging-dir=/var/lib/objectstore-plugin/asset-staging
            - --asset-staging-capacity=8Gi
            - '--exchange-address=api.ate-system.svc:8445'
            - '--exchange-server-name=api.ate-system.svc'
          startupProbe:
            exec:
              command:
                - /ko-app/objectstore-plugin
                - healthcheck
                - --socket=/run/objectstore-plugin/node.sock
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATE_STORAGE_BACKEND
              value: "s3"
            - name: AWS_REGION
              value: "garage"
            - name: AWS_ENDPOINT_URL
              value: "http://garage.ate-system.svc:3900"
            - name: AWS_S3_USE_PATH_STYLE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "http://prometheus-operated.kube-prometheus-stack-system.svc:9090/api/v1/otlp/v1/metrics"
            - name: OTEL_LOGS_EXPORTER
              value: none
          volumeMounts:
            - name: ate-base
              mountPath: /var/lib/ate
              mountPropagation: HostToContainer
            - name: objectstore-plugin
              mountPath: /run/objectstore-plugin
            - name: asset-staging
              mountPath: /var/lib/objectstore-plugin/asset-staging
            - name: servicedns-ca
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
      containers:
        - name: atelet
          image: ghcr.io/kagent-dev/substrate/atelet:v1.0.1
          args:
            - "--preview=PerTemplateSnapshotLocation,GoldenEgressPolicy"
            - --objectstore-plugin-socket=/run/objectstore-plugin/node.sock
            - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
            - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
            - '--herder-allowed-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/ate-api-server'
            - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "http://prometheus-operated.kube-prometheus-stack-system.svc:9090/api/v1/otlp/v1/metrics"
            - name: OTEL_LOGS_EXPORTER
              value: none
          ports:
            - name: grpc
              containerPort: 21998
            - name: prometheus
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 9091
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: objectstore-plugin
              mountPath: /run/objectstore-plugin
            - name: ate-base
              mountPath: /var/lib/ate
              mountPropagation: HostToContainer
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
            - name: servicedns-ca
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
      volumes:
        - name: objectstore-plugin
          emptyDir: {}
        # --asset-staging-capacity bounds this volume.
        - name: asset-staging
          emptyDir: {}
        - name: ate-base
          hostPath:
            path: /var/lib/ate
            type: DirectoryOrCreate
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: DirectoryOrCreate
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
