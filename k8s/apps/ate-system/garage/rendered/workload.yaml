apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: garage
    app.kubernetes.io/instance: garage
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: garage
    app.kubernetes.io/version: v2.5.0
    prometheus-scrape: "true"
  name: garage
  namespace: ate-system
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: garage
      app.kubernetes.io/instance: garage
      app.kubernetes.io/name: garage
  serviceName: garage-headless
  template:
    metadata:
      annotations:
        checksum/config: cfd413b78d07168c361a9d84f938d68aace8a7a327627ed749826b366188e5c4
      labels:
        app.kubernetes.io/component: garage
        app.kubernetes.io/instance: garage
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: garage
        app.kubernetes.io/version: v2.5.0
        prometheus-scrape: "true"
    spec:
      containers:
      - env:
        - name: GARAGE_RPC_SECRET
          valueFrom:
            secretKeyRef:
              key: rpcSecret
              name: garage-secrets
        - name: GARAGE_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: adminToken
              name: garage-secrets
        image: mirror.gcr.io/dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: 3903
          initialDelaySeconds: 30
          periodSeconds: 30
        name: garage
        ports:
        - containerPort: 3900
          name: s3-api
        - containerPort: 3901
          name: rpc
        - containerPort: 3902
          name: s3-web
        - containerPort: 3903
          name: admin
        readinessProbe:
          httpGet:
            path: /health
            port: 3903
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /mnt/meta
          name: meta
        - mountPath: /mnt/data
          name: data
        - mountPath: /etc/garage.toml
          name: configmap
          subPath: garage.toml
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: garage
      volumes:
      - configMap:
          name: garage-config
        name: configmap
  volumeClaimTemplates:
  - metadata:
      name: meta
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: local-path
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: local-path
