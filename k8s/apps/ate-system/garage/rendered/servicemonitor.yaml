apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: garage
    app.kubernetes.io/instance: garage
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: garage
    app.kubernetes.io/version: v2.5.0
    prometheus-scrape: "true"
    release: kube-prometheus-stack
  name: garage
  namespace: ate-system
spec:
  endpoints:
  - honorLabels: true
    interval: 15s
    path: /metrics
    port: metrics
    scheme: http
    scrapeTimeout: 10s
  jobLabel: garage
  namespaceSelector:
    matchNames:
    - ate-system
  selector:
    matchLabels:
      app.kubernetes.io/component: garage
      app.kubernetes.io/instance: garage
      app.kubernetes.io/name: garage
