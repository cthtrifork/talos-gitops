# The one ConfigMap the substrate chart mounts but does not create: ate-api-server mounts ate-api-authentication. The chart renders its own config and
# environment ConfigMaps.
---
# The JWT issuers ate-api-server trusts for its clients (kubectl-ate, the demos). Kubernetes' own issuer: the controller, atelet and the routers
# authenticate with pod certificates instead and do not need it. Discovery goes to the issuer URL; if the cluster's issuer is not reachable from the
# pod, this only affects clients that present a Kubernetes service account token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-authentication
  namespace: ate-system
data:
  authentication.yaml: |
    jwtProviders:
    - name: kubernetes
      issuer: https://[fdae:41e4:649b:9303::1]:10000
      audiences:
      - api.ate-system.svc
