# The Agent Substrate control plane and data plane: ate-api-server, ate-controller, ate-idp-server, the credential provider, and the router and egress gateway
# (agentgateway). The charts are kagent's build of Substrate (github.com/kagent-dev/substrate), which is what kagent 1.0 is tested with; see ../README.md.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ate-system
spec:
  interval: 30m
  releaseName: substrate
  timeout: 10m
  dependsOn:
    - name: substrate-atelet
  chartRef:
    kind: OCIRepository
    name: substrate
  values:
    preview:
      - PerTemplateSnapshotLocation
      - GoldenEgressPolicy
    # The database is CloudNativePG (../postgres-cluster.yaml); the DSNs are in the Secrets the chart names by default (../externalsecrets.yaml), and its
    # default roles and schema are what the database is set up with. Snapshots are in Garage, not the chart's bundled RustFS; atelet has its own release.
    rustfs:
      enabled: false
    atelet:
      enabled: false
    ateApi:
      # The cluster-wide default snapshot location; kagent sets one per Harness. gs:// is the scheme Substrate's own S3 setup uses.
      snapshotLocation: gs://ate-snapshots/
      authorization:
        # ate-api-server exits without a bootstrap owner. The first is kagent's controller (its pod certificate identity; it must create atespaces), the
        # second the shared service account `kubectl ate` acts as without --token-file: anyone who can create a token for it in ate-system, in practice a
        # cluster admin, is a global owner. Replace it with your own principals once access policies exist.
        bootstrapOwners:
          - spiffe://cluster.local/ns/kagent/sa/kagent-controller
          - system:serviceaccount:ate-system:ate-client
    atenetRouter:
      # Who may call actors through the router: kagent's controller, and `kubectl ate proxy` (its client certificate identity)
      ingressAllowedSPIFFEIDs:
        - spiffe://cluster.local/ns/kagent/sa/kagent-controller
        - spiffe://cluster.local/ns/ate-system/sa/atenet-client
    credentialProvider:
      # An atespace may only have the credentials of the namespaces named here; an empty list denies all. kagent keeps its model keys in `kagent`.
      namespacePolicies:
        - atespace: kagent
          allowedNamespaces:
            - kagent
    # The object-store plugin in ate-api-server reads Garage the same way atelet's does
    objectStorePlugin:
      control:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      extraEnv:
        - name: AWS_REGION
          value: garage
        - name: AWS_ENDPOINT_URL
          value: http://garage.ate-system.svc:3900
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: garage-aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: garage-aws-credentials
              key: AWS_SECRET_ACCESS_KEY
    # Requests and limits the chart leaves empty (Polaris wants them on every container). Not measured on this cluster: the chart's own defaults come from a short load
    # test on kind, and these are in the same range; raise them if a pod is OOMKilled.
    ateIdpServer:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    # Telemetry export is off: no endpoint is set, and this cluster has no OTLP collector for the control plane
  # What the chart leaves out and Polaris asks for, as patches on the rendered objects (see k8s/infra/policy-system/polaris/helm-release.yaml for what is still exempt).
  postRenderers:
    # The router and egress gateway (agentgateway) have no securityContext and no liveness probe. Both listen above 1024 (8080, 8443), so dropping every capability and
    # privilege escalation costs them nothing; the liveness probe is the readiness endpoint they already serve. Not set, because the image's user and what it writes are
    # not known: runAsNonRoot and readOnlyRootFilesystem.
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: atenet-router
            patch: |
              - op: test
                path: /spec/template/spec/containers/0/name
                value: agentgateway
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /healthz/ready
                    port: readiness
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 6
          - target:
              kind: Deployment
              name: atenet-egress
            patch: |
              - op: test
                path: /spec/template/spec/containers/0/name
                value: agentgateway
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /healthz/ready
                    port: readiness
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 6
    # The credential provider serves /healthz next to the /readyz the chart already probes
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: k8s-credential-provider
            patch: |
              - op: test
                path: /spec/template/spec/containers/0/name
                value: k8s-credential-provider
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /healthz
                    port: health
                  initialDelaySeconds: 10
                  periodSeconds: 10
