apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ate-api-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-api-server
  namespace: ate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-api-server-role
  namespace: ate-system
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
- apiGroups:
  - ate.dev
  resources:
  - workerpools
  - csidriverconfigs
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-api-server-binding
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-api-server-role
subjects:
- kind: ServiceAccount
  name: ate-api-server
  namespace: ate-system
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ate-system
spec:
  clusterIP: None
  ports:
  - name: grpc
    port: 443
    protocol: TCP
    targetPort: 443
  - name: exchange
    port: 8445
    protocol: TCP
    targetPort: exchange
  selector:
    app: ate-api-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ate-api-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/api-config: 06271baf49532c879aa3c58b48671884bcc858f09197412d682750496c33e1e1
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: ate-api-server
    spec:
      containers:
      - args:
        - --preview=PerTemplateSnapshotLocation,GoldenEgressPolicy
        - --objectstore-plugin-socket=/run/objectstore-plugin/control.sock
        - --snapshot-location=@env
        - --grpc-listen-addr=0.0.0.0:443
        - --grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --config-file=/run/apiconfig.ate.dev/apiconfig.textproto
        - --authz-bootstrap-owners=spiffe://cluster.local/ns/kagent/sa/kagent-controller,system:serviceaccount:ate-system:ate-client
        - --authentication-config=/etc/ateapi/authentication/authentication.yaml
        - --postgres-read-write-connection-string=@env
        - --postgres-owner-connection-string=@env
        - --postgres-read-write-role=substrate_readwrite
        - --postgres-owner-role=substrate_owner
        - --postgres-schema=@env
        - --actor-jwt-issuer=@env
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
        - --default-egress-gateway-address=atenet-egress.ate-system.svc:443
        - --atelet-service-account=atelet
        - --controller-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/ate-controller
        - --api-server-sidecar-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/ate-api-server
        - --egress-gateway-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/atenet-egress
        - --ingress-router-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/atenet-router
        - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --drain-delay=13s
        - --drain-timeout=15s
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        - name: ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              key: readWriteConnectionString
              name: substrate-postgres-readwrite
        - name: ATE_API_POSTGRES_OWNER_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              key: ownerConnectionString
              name: substrate-postgres-owner
        envFrom:
        - configMapRef:
            name: ate-api-server-envvars
            optional: true
        image: ghcr.io/kagent-dev/substrate/ateapi:v1.0.1
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: ate-api-server
        ports:
        - containerPort: 443
        - containerPort: 9090
          name: prometheus
        - containerPort: 9091
          name: health
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        volumeMounts:
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
        - mountPath: /run/actor-id-jwt-pool
          name: actor-id-jwt-pool
        - mountPath: /run/actor-id-ca-pool
          name: actor-id-ca-pool
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
        - mountPath: /run/apiconfig.ate.dev
          name: api-config
          readOnly: true
        - mountPath: /etc/ateapi/authentication
          name: authentication-config
          readOnly: true
      initContainers:
      - args:
        - control
        - --socket=/run/objectstore-plugin/control.sock
        - --exchange-listen=:8445
        - --actor-jwt-issuer=$(ATE_API_ACTOR_JWT_ISSUER)
        - --transfer-service-account=$(ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT)
        - --ateapi-server-name=api.ate-system.svc
        env:
        - name: ATE_API_ACTOR_JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              key: ATE_API_ACTOR_JWT_ISSUER
              name: ate-api-server-envvars
        - name: ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT
          valueFrom:
            configMapKeyRef:
              key: ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT
              name: ate-api-server-envvars
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ATE_STORAGE_BACKEND
          value: s3
        - name: AWS_REGION
          value: garage
        - name: AWS_ENDPOINT_URL
          value: http://garage.ate-system.svc:3900
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AWS_ACCESS_KEY_ID
              name: garage-aws-credentials
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: AWS_SECRET_ACCESS_KEY
              name: garage-aws-credentials
        image: ghcr.io/kagent-dev/substrate/objectstore-plugin:v1.0.1
        name: objectstore-plugin
        ports:
        - containerPort: 8445
          name: exchange
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        startupProbe:
          exec:
            command:
            - /ko-app/objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/control.sock
          failureThreshold: 30
          periodSeconds: 2
        volumeMounts:
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
      serviceAccountName: ate-api-server
      terminationGracePeriodSeconds: 40
      volumes:
      - emptyDir: {}
        name: objectstore-plugin
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-jwt-pool
      - name: actor-id-ca-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-ca-pool
      - configMap:
          name: ate-api-config
        name: api-config
      - configMap:
          name: ate-api-authentication
        name: authentication-config
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
