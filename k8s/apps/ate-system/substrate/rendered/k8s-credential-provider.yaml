---
# Source: substrate/templates/k8s-credential-provider.yaml
# Only the egress gateway may reach the provider's gRPC port; every other
# connection to the provider pods is dropped. The provider also pins the
# client certificate to the gateway's identity (see the Deployment), so this
# keeps other pods from reaching it at all. Takes effect only on a cluster
# whose network plugin enforces NetworkPolicy, such as GKE Dataplane V2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: atenet-egress
      ports:
        - protocol: TCP
          port: 50051
---
# Source: substrate/templates/k8s-credential-provider.yaml
# The credential provider: a gRPC service that resolves ate-secret:// URIs
# of the k8s.io class to Kubernetes Secret values. It is the ONLY
# component in the egress credential-injection path with Kubernetes access; the
# egress gateway and the injector never read Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-credential-provider
  namespace: ate-system
---
# Source: substrate/templates/k8s-credential-provider.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: ate-system
data:
  namespace-policy.yaml: |
    policies: [{"allowedNamespaces":["kagent"],"atespace":"kagent"}]
---
# Source: substrate/templates/k8s-credential-provider.yaml
# The provider checks the actor's atespace-to-namespace grant before reading.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-credential-provider-secret-reader
  namespace: ate-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
# Source: substrate/templates/k8s-credential-provider.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-credential-provider-secret-reader
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-credential-provider-secret-reader
subjects:
  - kind: ServiceAccount
    name: k8s-credential-provider
    namespace: ate-system
---
# Source: substrate/templates/k8s-credential-provider.yaml
apiVersion: v1
kind: Service
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: k8s-credential-provider
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
# Source: substrate/templates/k8s-credential-provider.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-credential-provider
  namespace: ate-system
  labels:
    app: k8s-credential-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-credential-provider
  template:
    metadata:
      annotations:
        checksum/namespace-policy: 29bfb891ece70248dca0c03ac449c7d32a205bb2df948e92c240082c8b776589
      labels:
        app: k8s-credential-provider
    spec:
      serviceAccountName: k8s-credential-provider
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: k8s-credential-provider
          image: ghcr.io/kagent-dev/substrate/kubernetes-secrets:v1.0.1
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          imagePullPolicy: IfNotPresent
          args:
            - "--listen-address=:50051"
            - "--metrics-address=:9090"
            - "--health-address=:9091"
            # The /statusz page binds 127.0.0.1 for port-forward access.
            - "--status-address=127.0.0.1:4040"
            # Use this Service's DNS certificate; only the egress injector may call.
            - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
            - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
            # Enforce the atespace→namespace authorization policy (default-deny).
            - "--namespace-policy-file=/etc/k8s-credential-provider/namespace-policy.yaml"
            - "--injector-identity=spiffe://cluster.local/ns/ate-system/sa/atenet-egress"
            - "--log-level=info"
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
            - name: health
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: namespace-policy
              mountPath: /etc/k8s-credential-provider
              readOnly: true
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
      volumes:
        - name: namespace-policy
          configMap:
            name: k8s-credential-provider-namespace-policy
        - name: servicedns
          projected:
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
