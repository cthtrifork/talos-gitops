apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - port: 50051
      protocol: TCP
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
  - Ingress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-credential-provider
  namespace: ate-system
---
apiVersion: v1
data:
  namespace-policy.yaml: |
    policies: [{"allowedNamespaces":["kagent"],"atespace":"kagent"}]
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: ate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-credential-provider-secret-reader
  namespace: ate-system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-credential-provider-secret-reader
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-credential-provider-secret-reader
subjects:
- kind: ServiceAccount
  name: k8s-credential-provider
  namespace: ate-system
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  ports:
  - name: grpc
    port: 50051
    protocol: TCP
    targetPort: grpc
  selector:
    app: k8s-credential-provider
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: k8s-credential-provider
  name: k8s-credential-provider
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-credential-provider
  template:
    metadata:
      annotations:
        checksum/namespace-policy: 29bfb891ece70248dca0c03ac449c7d32a205bb2df948e92c240082c8b776589
      labels:
        app: k8s-credential-provider
    spec:
      containers:
      - args:
        - --listen-address=:50051
        - --metrics-address=:9090
        - --health-address=:9091
        - --status-address=127.0.0.1:4040
        - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --namespace-policy-file=/etc/k8s-credential-provider/namespace-policy.yaml
        - --injector-identity=spiffe://cluster.local/ns/ate-system/sa/atenet-egress
        - --log-level=info
        image: ghcr.io/kagent-dev/substrate/kubernetes-secrets:v1.0.1
        imagePullPolicy: IfNotPresent
        name: k8s-credential-provider
        ports:
        - containerPort: 50051
          name: grpc
        - containerPort: 9090
          name: metrics
        - containerPort: 9091
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/k8s-credential-provider
          name: namespace-policy
          readOnly: true
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: k8s-credential-provider
      volumes:
      - configMap:
          name: k8s-credential-provider-namespace-policy
        name: namespace-policy
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
