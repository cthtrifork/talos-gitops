apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ate-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ate-controller
          - atelet
          - atenet-egress
          - atenet-router
    - namespaceSelector:
        matchLabels:
          ate.dev/api-access: "true"
      podSelector:
        matchExpressions:
        - key: ate.dev/worker-pool
          operator: DoesNotExist
    ports:
    - port: 443
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: atelet
    ports:
    - port: exchange
      protocol: TCP
  podSelector:
    matchLabels:
      app: ate-api-server
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ate-api-server
    ports:
    - port: postgres
      protocol: TCP
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atelet
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ate-api-server
    ports:
    - port: grpc
      protocol: TCP
  podSelector:
    matchLabels:
      app: atelet
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  ingress:
  - ports:
    - port: http
      protocol: TCP
    - port: https
      protocol: TCP
    - port: connect
      protocol: TCP
    - port: connect-tls
      protocol: TCP
  podSelector:
    matchLabels:
      app: atenet-router
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atenet-egress
  namespace: ate-system
spec:
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchExpressions:
        - key: ate.dev/worker-pool
          operator: Exists
    ports:
    - port: https
      protocol: TCP
  podSelector:
    matchLabels:
      app: atenet-egress
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-system-observability
  namespace: ate-system
spec:
  ingress:
  - ports:
    - port: metrics
      protocol: TCP
    - port: prometheus
      protocol: TCP
    - port: gw-metrics
      protocol: TCP
    - port: health
      protocol: TCP
    - port: healthz
      protocol: TCP
    - port: stats
      protocol: TCP
    - port: readiness
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: app
      operator: NotIn
      values:
      - k8s-credential-provider
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-idp-server
  namespace: ate-system
spec:
  ingress:
  - ports:
    - port: https
      protocol: TCP
  podSelector:
    matchLabels:
      app: ate-idp-server
  policyTypes:
  - Ingress
