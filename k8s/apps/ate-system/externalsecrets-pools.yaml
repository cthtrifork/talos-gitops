# The pool Secrets Agent Substrate reads, built from the cert-manager Secrets of certificate.yaml. A pool is JSON that holds the DER of the key
# (PKCS#8) and of the root certificate, base64 encoded, which is what the body of a PEM file already is: the template strips the PEM armor and
# the line breaks (internal/localca Marshal, internal/localjwtauthority Marshal). Substrate's own installer writes the same bytes.
# The ids are fixed: "1" is the id the installer uses for a CA, and nothing requires a JWT authority id to be the key's thumbprint.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ate-secret-source
  target:
    name: actor-id-ca-pool
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
        pool: |-
          {"CAs":[{"ID":"1","SigningKeyPKCS8":"{{ .key | regexReplaceAll `-----[A-Z ]+-----|\s` "" }}","RootCertificateDER":"{{ .crt | regexReplaceAll `-----[A-Z ]+-----|\s` "" }}"}],"ActiveForSigning":"1"}
  data:
    - secretKey: crt
      remoteRef:
        key: actor-id-ca-source
        property: tls.crt
    - secretKey: key
      remoteRef:
        key: actor-id-ca-source
        property: tls.key
---
