apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-jwt-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ate-secret-source
  target:
    name: actor-id-jwt-pool
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        pool: |-
          {"Authorities":[{"ID":"1","Algorithm":"ES256","SigningKeyPKCS8":"{{ .key | regexReplaceAll `-----[A-Z ]+-----|\s` "" }}"}],"ActiveForSigning":"1"}
  data:
    - secretKey: crt
      remoteRef:
        key: actor-id-jwt-source
        property: tls.crt
    - secretKey: key
      remoteRef:
        key: actor-id-jwt-source
        property: tls.key
---
# What ate-api-server hands to relying parties as the trust anchor of the actors' identities: the root certificate of actor-id-ca-pool
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-certs
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ate-secret-source
  target:
    name: actor-id-ca-certs
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ca.crt: "{{ .crt }}"
  data:
    - secretKey: crt
      remoteRef:
        key: actor-id-ca-source
        property: tls.crt
