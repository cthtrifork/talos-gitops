---
# Source: substrate-podcert/templates/pod-certificate-controller.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podcertificate-controller
  namespace: ate-system
  labels:
    app: podcertificate-controller
---
# Source: substrate-podcert/templates/pod-certificate-controller.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podcert-ate-dev-signer
  namespace: ate-system
rules:
  # The service signer needs to be able to read services and pods.
  - apiGroups:
      - ""
    resources:
      - services
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - certificates.k8s.io
    resources:
      - podcertificaterequests
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - certificates.k8s.io
    resources:
      - clustertrustbundles
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - delete
  - apiGroups:
      - certificates.k8s.io
    resources:
      - podcertificaterequests/status
    verbs:
      - update
  - apiGroups:
      - certificates.k8s.io
    resources:
      - signers
    resourceNames:
      - servicedns.podcert.ate.dev/*
      - podidentity.podcert.ate.dev/*
      - postgres.podcert.ate.dev/*
    verbs:
      - sign
      - attest
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
---
# Source: substrate-podcert/templates/pod-certificate-controller.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podcert-ate-dev-signer
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podcert-ate-dev-signer
subjects:
  - kind: ServiceAccount
    namespace: ate-system
    name: podcertificate-controller
---
# Source: substrate-podcert/templates/pod-certificate-controller.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ate-system
  name: coordinator
rules:
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - "leases"
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - delete
---
# Source: substrate-podcert/templates/pod-certificate-controller.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podcertificate-controller-is-a-coordinator
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator
subjects:
  - kind: ServiceAccount
    namespace: ate-system
    name: podcertificate-controller
---
# Source: substrate-podcert/templates/pod-certificate-controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcertificate-controller
  namespace: ate-system
  labels:
    app: podcertificate-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podcertificate-controller
  template:
    metadata:
      labels:
        app: podcertificate-controller
    spec:
      containers:
        - name: controller
          image: ghcr.io/kagent-dev/substrate/podcertcontroller:v1.0.1
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          args:
            - --in-cluster=true
            - --sharding-pod-namespace=$(POD_NAMESPACE)
            - --sharding-pod-name=$(POD_NAME)
            - --sharding-pod-uid=$(POD_UID)
            - --sharding-application-name=podcertificate-controller
            - --service-dns-ca-pool=/run/ca-state/service-dns-pool.json
            - --pod-identity-ca-pool=/run/ca-state/pod-identity-pool.json
            - --postgres-ca-pool=/run/ca-state/postgres-pool.json
            - "--postgres-client-namespace=ate-system"
            - "--postgres-client-service-account=ate-api-server"
            - --workers-per-signer=$(WORKERS_PER_SIGNER)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: WORKERS_PER_SIGNER
              value: "1"
          volumeMounts:
            - name: "ca-state"
              mountPath: "/run/ca-state"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: "ca-state"
          projected:
            sources:
              - secret:
                  name: "service-dns-ca-pool"
                  items:
                    - key: "pool"
                      path: "service-dns-pool.json"
              - secret:
                  name: "pod-identity-ca-pool"
                  items:
                    - key: "pool"
                      path: "pod-identity-pool.json"
              - secret:
                  name: "postgres-ca-pool"
                  items:
                    - key: "pool"
                      path: "postgres-pool.json"
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: podcertificate-controller
      terminationGracePeriodSeconds: 30
