# Namespaced stores over the Kubernetes API, so an ExternalSecret can read the cert-manager Secrets next to it. The cluster store only reads secret-store.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ate-secret-source
  namespace: ate-system
spec:
  provider:
    kubernetes:
      remoteNamespace: ate-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ate-secret-source
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ate-secret-source
  namespace: podcertificate-controller-system
spec:
  provider:
    kubernetes:
      remoteNamespace: podcertificate-controller-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ate-secret-source
