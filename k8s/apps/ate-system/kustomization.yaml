# Agent Substrate (https://github.com/agent-substrate/substrate), the control plane. rendered/ is the v1.0.0 install manifests with the
# ko:// images replaced by the released ones; everything specific to this cluster is here and in the patches below. See README.md.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rendered/crds/ate.dev_csidriverconfigs.yaml
  - rendered/crds/ate.dev_sandboxconfigs.yaml
  - rendered/crds/ate.dev_workerpools.yaml
  - rendered/crds/role.yaml
  - rendered/sandboxconfig-validation.yaml
  - garage
  - postgres-cluster.yaml
  - externalsecrets.yaml
  - issuer.yaml
  - certificate.yaml
  - rbac.yaml
  - secretstore.yaml
  - externalsecrets-pools.yaml
  - configmap.yaml
  - rendered/pod-certificate-controller.yaml
  - rendered/ate-api-server.yaml
  - rendered/ate-controller.yaml
  - rendered/ate-idp-server.yaml
  - rendered/atelet.yaml
  - rendered/atenet-router.yaml
  - rendered/atenet-egress.yaml
  - rendered/k8s-credential-provider.yaml
  - rendered/namespace-policy.yaml
  - rendered/ate-system-networkpolicies.yaml
  - networkpolicy.yaml
  - ingress-networkpolicy.yaml

patches:
  - target:
      kind: Namespace
      name: ate-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ate-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
  # Snapshots go to Garage (S3), in both places that run the object-store plugin: ate-api-server (the control side) and atelet (the node side).
  # The plugin's S3 backend takes the endpoint, region and credentials from the AWS SDK's environment variables.
  - target:
      kind: Deployment
      name: ate-api-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          spec:
            initContainers:
              - name: objectstore-plugin
                env:
                  - name: ATE_STORAGE_BACKEND
                    value: s3
                  - name: AWS_REGION
                    value: garage
                  - name: AWS_ENDPOINT_URL
                    value: http://garage.ate-system.svc:3900
                  - name: AWS_S3_USE_PATH_STYLE
                    value: "true"
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: garage-s3-key
                        key: access-key-id
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: garage-s3-key
                        key: secret-access-key
            # The CloudNativePG server CA, in the file name ate-api-server looks for (the DSNs in externalsecrets.yaml point at it).
            volumes:
              - name: postgres-server-ca
                secret:
                  secretName: substrate-db-ca
                  optional: false
                  items:
                    - key: ca.crt
                      path: server-ca.pem
  - target:
      kind: DaemonSet
      name: atelet
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet
        namespace: ate-system
      spec:
        template:
          spec:
            initContainers:
              - name: objectstore-plugin
                env:
                  - name: ATE_STORAGE_BACKEND
                    value: s3
                  - name: AWS_REGION
                    value: garage
                  - name: AWS_ENDPOINT_URL
                    value: http://garage.ate-system.svc:3900
                  - name: AWS_S3_USE_PATH_STYLE
                    value: "true"
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: garage-s3-key
                        key: access-key-id
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: garage-s3-key
                        key: secret-access-key
            containers:
              - name: atelet
                # The upstream args minus --image-credential-provider-*: Talos nodes have no credential provider plugin (GKE's is at
                # /home/kubernetes/bin), so the host mounts for it go as well.
                args:
                  - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
                  - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
                  - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
                  - --drain-delay=0s
                  - --drain-timeout=5m
                  - --objectstore-plugin-socket=/run/objectstore-plugin/node.sock
                  - --preview=PerTemplateSnapshotLocation,GoldenEgressPolicy
                volumeMounts:
                  - mountPath: /run/image-credential-provider/bin
                    $patch: delete
                  - mountPath: /run/image-credential-provider/config.yaml
                    $patch: delete
            volumes:
              - name: image-credential-provider-bin
                $patch: delete
              - name: image-credential-provider-config
                $patch: delete
  # ate-api-server exits at startup without a bootstrap owner (docs/guides/authorization.md), and `ate-setup` adds this flag itself. Two, as kagent's
  # installer sets them: kagent's controller, by its pod certificate identity (it must create atespaces), and the shared ate-client service account
  # (rendered/ate-controller.yaml), which is what `kubectl ate` acts as without --token-file: anyone who can create a token for it in ate-system, in
  # practice a cluster admin, is a global owner. Replace it with your own principals once access policies exist.
  - target:
      kind: Deployment
      name: ate-api-server
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: ate-api-server
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --authz-bootstrap-owners=spiffe://cluster.local/ns/kagent/sa/kagent-controller,system:serviceaccount:ate-system:ate-client
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --preview=PerTemplateSnapshotLocation,GoldenEgressPolicy
  # kagent 1.0 configures snapshot storage per Harness and bootstraps its runtimes with a golden egress policy; Substrate v1.0.0 needs these two preview
  # gates for that, on the API server, the controller and atelet (docs/guides/preview-gates.md). kagent's installer enables both.
  - target:
      kind: Deployment
      name: ate-controller
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: ate-controller
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --preview=PerTemplateSnapshotLocation,GoldenEgressPolicy
  # The credential provider hands out the Secrets an atespace may read, and nothing by default. kagent keeps its model API keys in the kagent namespace
  # and its agents run in the atespace of the same name, which is what its installer grants.
  - target:
      kind: ConfigMap
      name: k8s-credential-provider-namespace-policy
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: k8s-credential-provider-namespace-policy
        namespace: ate-system
      data:
        namespace-policy.yaml: |
          policies:
            - atespace: kagent
              allowedNamespaces:
                - kagent
  # Who may call actors through the router: kagent's controller, and `kubectl ate proxy` (its client certificate identity). Upstream carries none, and the
  # router then serves nothing.
  - target:
      kind: Deployment
      name: atenet-router
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: atenet-router
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --ingress-allowed-spiffe-ids=spiffe://cluster.local/ns/kagent/sa/kagent-controller,spiffe://cluster.local/ns/ate-system/sa/atenet-client
  # The issuer of the actors' JWTs: the in-cluster URL of the idp Service, which is what `ate-setup` defaults to.
  - target:
      kind: Deployment
      name: ate-idp-server
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: ate-idp-server
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --issuer=https://idp.ate-system.svc
