# The CRDs of Agent Substrate (WorkerPool, SandboxConfig, CSIDriverConfig), a chart of their own so they exist before anything that uses them.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
  namespace: ate-system
spec:
  interval: 30m
  releaseName: substrate-crds
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: substrate-crds
