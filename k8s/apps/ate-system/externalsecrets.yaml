# Everything generated in the cluster store (k8s/infra/secret-store/) that Agent Substrate needs, copied into ate-system. No value is in Git.
# The CA and JWT key pools are not here: Substrate writes them in its own format, so they are SOPS files (see README.md).
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-key
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-s3-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: ate-garage-s3-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: ate-garage-secrets
---
# The two login roles, in the form CloudNativePG wants (postgres-cluster.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-db-owner
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: substrate-db-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: substrate_owner_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ate-postgres-owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-db-readwrite
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: substrate-db-readwrite
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: substrate_readwrite_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ate-postgres-readwrite
        property: password
---
# What ate-api-server reads through envFrom (ate-api-server.yaml). The DSNs hold the passwords, so they are a Secret; the roles and the
# schema are in config.yaml. verify-full checks the CloudNativePG server certificate against the cluster CA, mounted from
# substrate-db-ca (see the patch in kustomization.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ate-api-server-secret-envvars
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: ate-api-server-secret-envvars
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        ATE_API_POSTGRES_SCHEMA: substrate
        ATE_API_POSTGRES_OWNER_CONNECTION_STRING: "postgresql://substrate_owner_user:{{ .owner }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=verify-full&sslrootcert=/run/postgres-server-ca/server-ca.pem"
        ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING: "postgresql://substrate_readwrite_user:{{ .readwrite }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=verify-full&sslrootcert=/run/postgres-server-ca/server-ca.pem"
  data:
    - secretKey: owner
      remoteRef:
        key: ate-postgres-owner
        property: password
    - secretKey: readwrite
      remoteRef:
        key: ate-postgres-readwrite
        property: password
