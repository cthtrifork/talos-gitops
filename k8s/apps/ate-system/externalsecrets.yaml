# Everything generated in the cluster store (k8s/infra/secret-store/) that Agent Substrate needs, copied into ate-system. No value is in Git.
# The CA and JWT key pools are not here: Substrate writes them in its own format, so they are SOPS files (see README.md).
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-key
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-s3-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: ate-garage-s3-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: ate-garage-secrets
---
# The two login roles, in the form CloudNativePG wants (postgres-cluster.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-db-owner
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: substrate-db-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: substrate_owner_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ate-postgres-owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-db-readwrite
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: substrate-db-readwrite
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: substrate_readwrite_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ate-postgres-readwrite
        property: password
---
# The connection strings the substrate chart reads from Secrets (postgres.*ConnectionStringSecretRef, at their default names and keys). The roles and the
# schema are the chart's defaults, which postgres-cluster.yaml creates. sslmode=require encrypts the connection without verifying the CloudNativePG server
# certificate: the chart has no place to mount a CA for verify-full (the bundled-database setup uses certificate logins instead).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-readwrite
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: substrate-postgres-readwrite
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        readWriteConnectionString: "postgresql://substrate_readwrite_user:{{ .password }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: ate-postgres-readwrite
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-owner
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: substrate-postgres-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        ownerConnectionString: "postgresql://substrate_owner_user:{{ .password }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: ate-postgres-owner
        property: password
---
# The Garage key under the variable names of the AWS SDK, which the object-store plugins read (atelet through objectStore.credentialsSecret, ate-api-server
# through objectStorePlugin.extraEnv). garage-s3-key above has it under the names the Garage chart uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-aws-credentials
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-aws-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .keyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret }}"
  data:
    - secretKey: keyId
      remoteRef:
        key: ate-garage-s3-key
        property: access-key-id
    - secretKey: secret
      remoteRef:
        key: ate-garage-s3-key
        property: secret-access-key
