# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/prometheusrule_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shelly-mqtt
  namespace: kube-prometheus-stack-system
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: shelly-mqtt
      rules:
        # readings expire from the exporter after 3h, so a silent sensor makes its series disappear
        - alert: ShellyHtNoReadings
          expr: absent(shelly_temperature_celsius{sensor="ht-1"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: No temperature reading from the room sensor (H&T) for 3 hours
            description: The H&T reports every 5 minutes on USB power. Check its Wi-Fi (IoT network), the broker in shelly-mqtt and the client certificate (k8s/apps/shelly-mqtt/README.md).
        - alert: ShellyPillNoReadings
          expr: absent(shelly_temperature_celsius{sensor="pill-1"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: No temperature reading from the rack sensor (Pill) for 3 hours
            description: The Pill publishes only when the temperature changes, so a very stable rack can trigger this; check the probe in its 3.5 mm jack, the IoT Wi-Fi, the broker and the client certificate (k8s/apps/shelly-mqtt/README.md).
