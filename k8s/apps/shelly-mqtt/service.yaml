---
# In-cluster address for the exporter.
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: shelly-mqtt
spec:
  selector:
    app: mosquitto
  ports:
    - port: 8883
      targetPort: mqtts
      name: mqtts
---
# LAN address for the Shelly, set on the device as 192.168.1.241:8883.
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-lb
  namespace: shelly-mqtt
  annotations:
    metallb.io/loadBalancerIPs: "192.168.1.241"
    lbipam.cilium.io/ips: "192.168.1.241"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: mosquitto
  ports:
    - port: 8883
      targetPort: mqtts
      name: mqtts
