# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: shelly-mqtt
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mosquitto
          image: mirror.gcr.io/library/eclipse-mosquitto:2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
          ports:
            - name: mqtts
              containerPort: 8883
          readinessProbe:
            tcpSocket:
              port: mqtts
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: mqtts
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            limits:
              memory: 64Mi
            requests:
              memory: 64Mi
              cpu: 10m
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true # persistence is off, logs go to stderr
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: certs
          secret:
            secretName: mosquitto-server
