---
# Talos-in-Docker e2e for cthtrifork/talos-gitops (public repo): the workflow must only run here for pushes, manual
# runs and PRs from the repo's own branches, never forks. Needs the runner GitHub App installed on talos-gitops.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-talos-gitops-e2e
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-talos-gitops-e2e
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  values:
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/talos-gitops
    runnerScaleSetName: arc-e2e-talos-gitops

    maxRunners: 2 # a Talos-in-Docker cluster with Cilium and Flux takes about 4 GiB
    minRunners: 0

    githubConfigSecret: github-auth
    containerMode: {}
    template:
      metadata:
        annotations:
          # Internal + public CAs (jobs reach the allowlisted internet).
          trust.portableinfo.cloud/public: "true"
      spec:
        # Same node as the cache server (node-local volume); cross-node transfer is too slow.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                namespaces:
                  - gha-cache-system
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: github-actions-cache-server
        initContainers:
          - name: init-dind-externals
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261123.33@sha256:23beaea4d501a868353503220de45c38ccdc1e629530d56adfbbec6d9f1c89f2
            imagePullPolicy: IfNotPresent
            command:
              - "cp"
              - "-r"
              - "/home/runner/externals/."
              - "/home/runner/tmpDir/"
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          - name: dind
            # renovate: datasource=docker depName=mirror.gcr.io/library/docker versioning=docker
            image: mirror.gcr.io/library/docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
            imagePullPolicy: IfNotPresent
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            resources:
              # The Talos nodes run inside this container
              requests:
                cpu: 500m
                memory: 6Gi
              limits:
                memory: 10Gi
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: docker-lib
                mountPath: /var/lib/docker
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261123.33@sha256:23beaea4d501a868353503220de45c38ccdc1e629530d56adfbbec6d9f1c89f2
            imagePullPolicy: IfNotPresent
            # patches the runner to keep ACTIONS_RESULTS_URL; fails the pod when it cannot
            command:
              - "/usr/local/bin/use-cache-server"
              - "/home/runner/run.sh"
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              # The trailing slash is required.
              - name: ACTIONS_RESULTS_URL
                value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        imagePullSecrets:
          - name: github-auth
        automountServiceAccountToken: false
        securityContext:
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 10Gi
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir:
              sizeLimit: 2Gi
          - name: docker-lib
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 20Gi
    listenerTemplate:
      metadata:
        labels:
          prometheus-scrape: "true"
        annotations:
          # talks to github.com
          trust.portableinfo.cloud/public: "true"
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            # the exporter enabled by the controller's metrics.listenerAddr is the listener's only HTTP server
            livenessProbe:
              httpGet:
                path: /metrics
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 10
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
