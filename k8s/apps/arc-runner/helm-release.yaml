---
# The homeserver-bootc runners (buildah and podman only, no Docker-in-Docker), and the only set behind the label arc-ubuntu.
# Builds run in parallel and two builds on one containers storage corrupt it, so every pod gets its own ephemeral
# volumes: every build starts cold, softened by pulls going through the zot caches (ConfigMap podman-registries) and by the
# layer cache in zot that the build workflow of homeserver-bootc uses.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-homeserver-bootc-podman
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-podman
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
    runnerScaleSetName: arc-ubuntu-podman
    # arc-ubuntu matches both scale sets; arc-ubuntu-podman selects this one
    scaleSetLabels:
      - arc-ubuntu
      - arc-ubuntu-podman

    maxRunners: 4 # CPU and lvm-fast capacity allow about 3 to 4 builds; the two sets this replaces had 4 together
    minRunners: 0

    githubConfigSecret: github-auth
    containerMode: {} # no dind, no kubernetes mode
    template:
      metadata:
        annotations:
          # Internal + public CAs (jobs reach the allowlisted internet).
          trust.portableinfo.cloud/public: "true"
      spec:
        # No runner is tied to a node (the cache server is not either): spread over the nodes when there is room
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: arc-ubuntu-podman
        initContainers:
          # Initialize volume permissions without recursively modifying
          # Podman/Buildah image-layer ownership or permissions.
          - name: volume-perms
            image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            imagePullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -ec
              - |
                chown 0:0 /tmp /var/tmp /volumes/rootful
                chmod 1777 /tmp /var/tmp
                chmod 0700 /volumes/rootful

                chown 1001:1001 \
                  /volumes/rootless \
                  /volumes/work \
                  /volumes/dnf-cache \
                  /volumes/cross-run-cache \
                  /volumes/xdg-runtime

                chmod 0700 /volumes/rootless /volumes/xdg-runtime
                chmod 0755 /volumes/work \
                  /volumes/dnf-cache \
                  /volumes/cross-run-cache
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - FOWNER
                  - DAC_OVERRIDE
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 32Mi
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: var-tmp
                mountPath: /var/tmp
              - name: container-storage-rootful
                mountPath: /volumes/rootful
              - name: container-rootless-storage
                mountPath: /volumes/rootless
              - name: work
                mountPath: /volumes/work
              - name: dnf-cache
                mountPath: /volumes/dnf-cache
              - name: cross-run-cache
                mountPath: /volumes/cross-run-cache
              - name: xdg-runtime
                mountPath: /volumes/xdg-runtime
          # The cross-run cache is shared by every runner: drop what has not been touched for 14 days
          - name: data-retention
            image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -e
                find /volumes/cross-run-cache -type f -mtime +14 -print -delete
                find /volumes/cross-run-cache -type d -empty -mtime +14 -print -delete || true
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 128Mi
            volumeMounts:
              - name: cross-run-cache
                mountPath: /volumes/cross-run-cache
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261126.41@sha256:bc132de2ece52acbc8eba892135d7db79163975955c353cdb51bf4ad32afd563
            imagePullPolicy: IfNotPresent
            # Podman rejects an XDG_RUNTIME_DIR not owned by its user, and a fresh emptyDir is root-owned.
            command:
              - /bin/bash
              - -c
              - install -d -m 700 "$XDG_RUNTIME_DIR" && exec /usr/local/bin/use-cache-server /home/runner/run.sh

            resources:
              requests:
                cpu: 500m
                memory: 2Gi # median job 1.4Gi, p90 4Gi
              limits:
                memory: 12Gi # observed peak over 14 days on arc-ubuntu: 6Gi. No CPU limit: dnf, buildah and rechunk burst

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              # /run/user/1001 does not exist and /run is root-owned, hence a memory-backed volume.
              - name: XDG_RUNTIME_DIR
                value: /tmp/xdg/runtime
              - name: STORAGE_DRIVER
                value: overlay

              - name: BUILDAH_ISOLATION
                value: chroot

              - name: BUILDAH_LAYERS
                value: "true"

              # Caches saved by GitHub-hosted jobs are not visible here. The trailing slash is required.
              - name: ACTIONS_RESULTS_URL
                value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/
              # optional: the runner starts before the first sync.
              - name: FILESERVER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: fileserver-upload-token
                    key: current
                    optional: true
              - name: FILESERVER_URL
                value: http://fileserver-upload.fileserver-system.svc:8082

            volumeMounts:
              - name: container-storage-rootful
                mountPath: /var/lib/containers/storage
              - name: work
                mountPath: /home/runner/_work
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              - name: dnf-cache
                mountPath: /var/cache/dnf
              - name: dnf-cache
                mountPath: /home/runner/.cache/dnf
              - name: cross-run-cache
                mountPath: /home/runner/.cache/tmp
              - name: tmp
                mountPath: /tmp

              - name: var-tmp
                mountPath: /var/tmp
              - name: registries
                mountPath: /etc/containers/registries.conf.d/zot-mirror.conf
                subPath: zot-mirror.conf
                readOnly: true

              - name: xdg-runtime
                mountPath: /tmp/xdg

              - name: host-udev
                mountPath: /run/udev
                readOnly: true

              - name: host-dev
                mountPath: /host-dev
        imagePullSecrets:
          - name: github-auth
        securityContext:
          #fsGroup: 1001
          # Do not set fsGroup. Recursive volume permission changes can
          # corrupt POSIX metadata in Podman/Buildah image storage.
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: registries
            configMap:
              name: podman-registries
          - name: xdg-runtime
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi # counts against the pod's memory
          - name: host-udev
            hostPath:
              path: /run/udev
              type: Directory
          - name: host-dev
            hostPath:
              path: /dev
              type: Directory
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 16Gi
          - name: tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 16Gi
          - name: var-tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 24Gi
          - name: container-storage-rootful
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 32Gi
          - name: container-rootless-storage
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 28Gi
          - name: dnf-cache
            persistentVolumeClaim:
              claimName: dnf-cache-jfs
          - name: cross-run-cache
            persistentVolumeClaim:
              claimName: cross-run-cache-jfs
    listenerTemplate:
      metadata:
        labels:
          prometheus-scrape: "true"
        annotations:
          # talks to github.com
          trust.portableinfo.cloud/public: "true"
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            # the exporter enabled by the controller's metrics.listenerAddr is the listener's only HTTP server
            livenessProbe:
              httpGet:
                path: /metrics
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 10
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
