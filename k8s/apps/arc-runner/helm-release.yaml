---
# https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/troubleshoot
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-homeserver-bootc
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      # this SA is created by the controller chart, in arc-systems
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    # name of the runner scale set -> what you use in `runs-on: arc-ubuntu`
    githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
    runnerScaleSetName: arc-ubuntu
    # runs-on: arc-ubuntu matches both scale sets; arc-ubuntu-docker selects this one (it has the Docker-in-Docker sidecar).
    scaleSetLabels:
      - arc-ubuntu
      - arc-ubuntu-docker

    maxRunners: 1 # only 1 runner due to pvc design
    minRunners: 1 # always ready

    #nodeSelector:
    #  kubernetes.io/hostname: talos-ska-6at

    # point to the secret we created with SOPS
    githubConfigSecret: github-auth
    containerMode: {} # we use custom
    template:
      spec:
        # Same node as the cache server: a pod-to-pod transfer between two nodes runs at 3 to 5 MB/s in this cluster and a cache
        # upload stalled (see helm-release-talos-gitops-e2e.yaml). The server's volume is node-local, so it never moves.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                namespaces:
                  - gha-cache-system
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: github-actions-cache-server
        initContainers:
          - name: data-retention
            image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -e
                find /tmp/arc-cache -type f -mtime +14 -print -delete
                find /tmp/arc-cache -type d -empty -mtime +14 -print -delete || true
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              privileged: true
              allowPrivilegeEscalation: true
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 128Mi
            volumeMounts:
              - name: cross-run-cache
                mountPath: /tmp/arc-cache

          - name: init-dind-externals
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261121.18@sha256:4b8914adb35f05531e8341a48abeef0a214f1141a479defc24da77198db42dc6
            imagePullPolicy: IfNotPresent
            command:
              - "cp"
              - "-r"
              - "/home/runner/externals/."
              - "/home/runner/tmpDir/"
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          - name: dind
            # renovate: datasource=docker depName=mirror.gcr.io/library/docker versioning=docker
            image: mirror.gcr.io/library/docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
            imagePullPolicy: IfNotPresent
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi # containers started through dind count against this; observed peak over 14 days: 190Mi
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              # Shared runner/DinD workspace, but local to this pod.
              - name: work
                mountPath: /home/runner/_work
              # Docker Unix socket.
              - name: dind-sock
                mountPath: /var/run
              # Runner externals copied by init container.
              - name: dind-externals
                mountPath: /home/runner/externals
              # Transient Docker image/layer storage.
              - name: docker-lib
                mountPath: /var/lib/docker
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261121.18@sha256:4b8914adb35f05531e8341a48abeef0a214f1141a479defc24da77198db42dc6
            imagePullPolicy: IfNotPresent
            # patches the runner so it keeps ACTIONS_RESULTS_URL (images/github-actions-runner/use-cache-server); fails the pod when it cannot
            command:
              - "/usr/local/bin/use-cache-server"
              - "/home/runner/run.sh"

            resources:
              requests:
                cpu: 500m
                memory: 2Gi # median job 1.4Gi, p90 4Gi
              limits:
                memory: 12Gi # observed peak over 14 days: 6Gi

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock

              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"

              - name: STORAGE_DRIVER
                value: overlay

              - name: BUILDAH_ISOLATION
                value: chroot

              - name: BUILDAH_LAYERS
                value: "true"

              # The in-cluster cache server (k8s/apps/gha-cache): actions/cache and the tool caches stay in the cluster. Caches
              # saved by GitHub-hosted jobs are not visible here. The trailing slash is required.
              - name: ACTIONS_RESULTS_URL
                value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/
              - name: RUNNER_UPDATE_CA_CERTS
                value: "1"
              # The fileserver upload token, rotated every 30 days by External Secrets (k8s/infra/secret-store/; an
              # ExternalSecret in k8s/apps/fileserver copies it here). Read at pod start: the runners are ephemeral, so
              # every job gets the current token. optional: the runner starts before the first sync. A job echoing it
              # into its log leaks it: use ::add-mask::.
              - name: FILESERVER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: fileserver-upload-token
                    key: current
                    optional: true
              - name: FILESERVER_URL
                value: http://fileserver-upload.fileserver-system.svc:8082

              #- name: HTTP_PROXY
              #  value: "http://192.168.1.135:3128"
              #- name: HTTPS_PROXY
              #  value: "http://192.168.1.135:3128"
              #- name: NO_PROXY
              #  value: "localhost,127.0.0.1"

            volumeMounts:
              - name: ca-certs
                mountPath: /usr/local/share/ca-certificates/private-ca.crt
                subPath: ca.crt
              # Persistent rootful Podman/Buildah storage.
              - name: container-storage-rootful
                mountPath: /var/lib/containers/storage
              # Job workspace: fast node-local ephemeral storage.
              - name: work
                mountPath: /home/runner/_work
              # Docker socket shared with DinD.
              - name: dind-sock
                mountPath: /var/run
              # Persistent rootless container storage.
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              # Persistent additional image store.
              - name: container-shared-storage
                mountPath: /var/lib/shared
              # Same transient Docker storage as DinD.
              - name: docker-lib
                mountPath: /var/lib/docker
              # Persistent DNF caches.
              - name: dnf-cache
                mountPath: /var/cache/dnf
              - name: dnf-cache
                mountPath: /home/runner/.cache/dnf
              # Existing persistent temporary/cache area.
              - name: cross-run-cache
                mountPath: /home/runner/.cache/tmp
              # RAM-backed scratch space.
              - name: tmp-memory
                mountPath: /tmp
              - name: podman-tmp
                mountPath: /var/tmp
              # Host udev database, bind-mounted into `bootc install` containers (read-only).
              - name: host-udev
                mountPath: /run/udev
                readOnly: true
              # Live host devtmpfs. A privileged pod only gets a static snapshot of /dev, so the
              # partition nodes `bootc install --via-loopback` creates (/dev/loopXpN) would never
              # appear. Mounted at /host-dev (not /dev) so the runner's own /dev is untouched; the
              # e2e job bind-mounts it as /dev into the bootc container.
              - name: host-dev
                mountPath: /host-dev
        imagePullSecrets:
          - name: github-auth
        securityContext:
          fsGroup: 1001
        volumes:
          - name: ca-certs
            # trust-manager keeps this in step with the root CA; the leaf's ca.crt goes stale when the CA is re-issued
            configMap:
              name: portableinfo-ca-bundle
              items:
                - key: ca-bundle.crt
                  path: ca.crt
          - name: host-udev
            hostPath:
              path: /run/udev
              type: Directory
          - name: host-dev
            hostPath:
              path: /dev
              type: Directory
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 32Gi
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir:
              sizeLimit: 2Gi
          # Docker-in-Docker transient image/layer storage.
          - name: docker-lib
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 32Gi
          - name: tmp-memory
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
          - name: container-storage-rootful
            persistentVolumeClaim:
              claimName: container-storage-rootful
          - name: container-rootless-storage
            persistentVolumeClaim:
              claimName: container-rootless-storage
          - name: podman-tmp
            persistentVolumeClaim:
              claimName: podman-tmp
          - name: dnf-cache
            persistentVolumeClaim:
              claimName: dnf-cache
            #hostPath:
              # talosctl --talosconfig ./talosconfig.yaml --nodes talos-wb5-z9x get volumestatus u-local-storage-cache
              # talosctl --talosconfig ./talosconfig.yaml --nodes talos-ska-6at get mountstatus u-local-storage-cache
            #  path: /var/tmp/local-storage-cache/gha-cache/dnf
            #  type: DirectoryOrCreate
          - name: container-shared-storage
            persistentVolumeClaim:
              claimName: container-shared-storage
          - name: cross-run-cache
            persistentVolumeClaim:
              claimName: cross-run-cache
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
