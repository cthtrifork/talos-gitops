---
# https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/troubleshoot
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-homeserver-bootc
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
    runnerScaleSetName: arc-ubuntu
    # arc-ubuntu matches both scale sets; arc-ubuntu-docker selects this one (has the DinD sidecar)
    scaleSetLabels:
      - arc-ubuntu
      - arc-ubuntu-docker

    maxRunners: 1 # only 1 runner due to pvc design
    minRunners: 1

    githubConfigSecret: github-auth
    containerMode: {}
    template:
      metadata:
        annotations:
          # Internal + public CAs (jobs reach the allowlisted internet).
          trust.portableinfo.cloud/public: "true"
      spec:
        # Same node as the cache server (node-local volume); cross-node transfer is too slow.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                namespaces:
                  - gha-cache-system
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: github-actions-cache-server
        initContainers:
          - name: data-retention
            image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -e
                find /tmp/arc-cache -type f -mtime +14 -print -delete
                find /tmp/arc-cache -type d -empty -mtime +14 -print -delete || true
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 128Mi
            volumeMounts:
              - name: cross-run-cache
                mountPath: /tmp/arc-cache

          # fsGroup makes /tmp root:1001 2775; apt (user _apt) needs it world-writable
          - name: tmp-perms
            image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            imagePullPolicy: IfNotPresent
            command:
              - chmod
              - "1777"
              - /tmp
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 32Mi
            volumeMounts:
              - name: tmp-memory
                mountPath: /tmp

          - name: init-dind-externals
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261123.33@sha256:23beaea4d501a868353503220de45c38ccdc1e629530d56adfbbec6d9f1c89f2
            imagePullPolicy: IfNotPresent
            command:
              - "cp"
              - "-r"
              - "/home/runner/externals/."
              - "/home/runner/tmpDir/"
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          - name: dind
            # renovate: datasource=docker depName=mirror.gcr.io/library/docker versioning=docker
            image: mirror.gcr.io/library/docker:29.10.1-dind@sha256:5d24ae532c4b32bea8fc5714ec34a7db838c9f668d18b6c772b2415196a2cd83
            imagePullPolicy: IfNotPresent
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi # containers started through dind count against this; observed peak over 14 days: 190Mi
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              # Shared runner/DinD workspace, but local to this pod.
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: docker-lib
                mountPath: /var/lib/docker
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261123.33@sha256:23beaea4d501a868353503220de45c38ccdc1e629530d56adfbbec6d9f1c89f2
            imagePullPolicy: IfNotPresent
            # patches the runner to keep ACTIONS_RESULTS_URL; fails the pod when it cannot
            command:
              - "/usr/local/bin/use-cache-server"
              - "/home/runner/run.sh"

            resources:
              requests:
                cpu: 500m
                memory: 2Gi # median job 1.4Gi, p90 4Gi
              limits:
                memory: 12Gi # observed peak over 14 days: 6Gi

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock

              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"

              - name: STORAGE_DRIVER
                value: overlay

              - name: BUILDAH_ISOLATION
                value: chroot

              - name: BUILDAH_LAYERS
                value: "true"

              # Caches saved by GitHub-hosted jobs are not visible here. The trailing slash is required.
              - name: ACTIONS_RESULTS_URL
                value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/

              # Fileserver upload token, rotated every 30 days by External Secrets and read at pod start. optional: the
              # runner starts before the first sync. A job echoing it into its log leaks it: use ::add-mask::.
              - name: FILESERVER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: fileserver-upload-token
                    key: current
                    optional: true
              - name: FILESERVER_URL
                value: http://fileserver-upload.fileserver-system.svc:8082

            volumeMounts:

              - name: container-storage-rootful
                mountPath: /var/lib/containers/storage
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              - name: container-shared-storage
                mountPath: /var/lib/shared
              - name: docker-lib
                mountPath: /var/lib/docker
              - name: dnf-cache
                mountPath: /var/cache/dnf
              - name: dnf-cache
                mountPath: /home/runner/.cache/dnf
              - name: cross-run-cache
                mountPath: /home/runner/.cache/tmp
              - name: tmp-memory
                mountPath: /tmp
              - name: podman-tmp
                mountPath: /var/tmp

              - name: host-udev
                mountPath: /run/udev
                readOnly: true
              # A privileged pod only gets a static /dev snapshot, so `bootc install --via-loopback` partition nodes
              # (/dev/loopXpN) never appear. Mounted at /host-dev so the runner's own /dev is untouched.
              - name: host-dev
                mountPath: /host-dev
        imagePullSecrets:
          - name: github-auth
        securityContext:
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        volumes:

          - name: host-udev
            hostPath:
              path: /run/udev
              type: Directory
          - name: host-dev
            hostPath:
              path: /dev
              type: Directory
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 32Gi
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir:
              sizeLimit: 2Gi
          - name: docker-lib
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 32Gi
          - name: tmp-memory
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 20Gi
          - name: container-storage-rootful
            persistentVolumeClaim:
              claimName: container-storage-rootful
          - name: container-rootless-storage
            persistentVolumeClaim:
              claimName: container-rootless-storage
          - name: podman-tmp
            persistentVolumeClaim:
              claimName: podman-tmp
          - name: dnf-cache
            persistentVolumeClaim:
              claimName: dnf-cache
          - name: container-shared-storage
            persistentVolumeClaim:
              claimName: container-shared-storage
          - name: cross-run-cache
            persistentVolumeClaim:
              claimName: cross-run-cache
    listenerTemplate:
      metadata:
        labels:
          prometheus-scrape: "true"
        annotations:
          # talks to github.com
          trust.portableinfo.cloud/public: "true"
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            # the exporter enabled by the controller's metrics.listenerAddr is the listener's only HTTP server
            livenessProbe:
              httpGet:
                path: /metrics
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 10
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
