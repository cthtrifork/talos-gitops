---
# Upload-only scale set: only the `upload` job runs here, so build steps and third-party actions never see FILESERVER_TOKEN.
# SECURITY: every job here can read the token and the repo is public: keep write access to yourself, require approval
# for outside collaborators' runs, and keep `environment: file-upload` on the job.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-bootc-files
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-bootc-files
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  values:
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/github-runner-bootc
    runnerScaleSetName: arc-files-bootc
    scaleSetLabels:
      - arc-files-bootc

    maxRunners: 1
    minRunners: 0


    githubConfigSecret: github-auth-bootc-files
    containerMode: {}
    template:
      spec:
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261122.21@sha256:9bfb04321a84c9bbb63869084f8c33956f9cacfbca12db8d6f77701617358e4e
            imagePullPolicy: IfNotPresent
            command:
              - "/home/runner/run.sh"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            # Not privileged: the job only runs curl and sha256sum on a downloaded file.
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            env:
              # optional: the runner starts before the first sync.
              - name: FILESERVER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: fileserver-upload-token
                    key: current
                    optional: true
              - name: FILESERVER_URL
                value: http://fileserver-upload.fileserver-system.svc:8082
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: tmp
                mountPath: /tmp
        imagePullSecrets:
          - name: github-auth
        securityContext:
          fsGroup: 1001
        volumes:
          # a disk image is too big for memory
          - name: work
            emptyDir:
              sizeLimit: 40Gi
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 128Mi
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
