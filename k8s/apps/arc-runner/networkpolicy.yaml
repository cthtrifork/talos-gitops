# Default deny, then a per-host egress allowlist. A job that fails to connect: find the host in the drop metrics
# (skill cilium-drops) and add it below.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-system-default-deny
  namespace: arc-runners-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-system-allow-egress
  namespace: arc-runners-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        # GitHub runner communication
        - matchName: github.com
        - matchPattern: "**.github.com"
        - matchPattern: "**.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: datreeio.github.io
        # flux-schema CRD catalogs (scripts/validate.sh, scripts/ci/build-flux-paths.sh)
        - matchName: schemas.fluxoperator.dev
        - matchName: github-cloud.s3.amazonaws.com
        - matchName: ghcr.io

        # Container registries
        - matchName: quay.io
        - matchPattern: "*.quay.io"
        - matchName: mirror.gcr.io
        - matchName: gcr.io
        - matchName: registry.k8s.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: mcr.microsoft.com
        - matchName: registry.access.redhat.com
        # Sigstore
        - matchName: fulcio.sigstore.dev
        - matchName: rekor.sigstore.dev
        - matchName: tuf-repo-cdn.sigstore.dev

        # Tool downloads
        - matchName: mise.jdx.dev
        - matchName: mise-versions.jdx.dev
        - matchName: get.helm.sh
        - matchName: dl.k8s.io
        - matchName: helm.cilium.io

        - matchName: charts.fairwinds.com
        - matchName: kubernetes-sigs.github.io
        - matchName: charts.redpanda.com
        - matchName: aka.ms
        - matchName: packages.microsoft.com
        - matchName: download.docker.com
        - matchName: json.schemastore.org
        - matchName: downloads.claude.ai
        - matchName: storage.googleapis.com

        - matchName: registry.npmjs.org
        - matchName: cdn.playwright.dev
        - matchName: playwright.download.prss.microsoft.com

        - matchName: zed.dev
        - matchName: cloud.zed.dev
        # VS Code extension marketplace (homeserver-gui e2e VM; its traffic leaves from the runner pod)
        - matchName: marketplace.visualstudio.com
        - matchPattern: "*.gallery.vsassets.io"
        - matchPattern: "*.gallerycdn.vsassets.io"

        - matchName: formulae.brew.sh
        # Fedora and RPM Fusion repos. The Containerfiles pin repos to these hosts, so metalink mirrors need no entry.
        - matchName: mirrors.dotsrc.org
        # claude-vm.containerfile pulls from Fedora's own host: mirrors.dotsrc.org refused connections during image builds
        - matchName: dl.fedoraproject.org
        - matchName: mirrors.fedoraproject.org
        - matchName: codecs.fedoraproject.org
        - matchName: download1.rpmfusion.org
        - matchName: download.copr.fedorainfracloud.org
        # COPR redirects to packages.redhat.com and its S3 bucket
        - matchName: packages.redhat.com
        - matchName: copr-pulp-prod.s3.amazonaws.com
        - matchName: repo.linrunner.de
        - matchName: repo.warpnine.de
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # apt
    - toFQDNs:
        - matchName: archive.ubuntu.com
        - matchName: security.ubuntu.com
        - matchName: ports.ubuntu.com
        - matchName: ppa.launchpadcontent.net
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Cisco's openh264 RPMs, plain HTTP only
    - toFQDNs:
        - matchName: ciscobinary.openh264.org
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # CRL/OCSP checks of VS Code extension signatures; dropped, each check waits 30 to 60 s
    - toFQDNs:
        - matchName: ocsp.digicert.com
        - matchName: crl3.digicert.com
        - matchName: crl.microsoft.com
        - matchName: www.microsoft.com
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # NetworkManager connectivity check in the homeserver-gui VM
    - toFQDNs:
        - matchName: fedoraproject.org
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # fileserver upload API
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: fileserver-system
            k8s:app: fileserver
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
    # gha-cache server
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gha-cache-system
            k8s:app.kubernetes.io/name: github-actions-cache-server
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # zot registry (the zot-lb address is translated to the pod)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: registry-system
            k8s:app.kubernetes.io/name: zot
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
