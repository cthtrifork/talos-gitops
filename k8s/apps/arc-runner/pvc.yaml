---
# Persistent runner volumes. They use the default (node-local) storage class, which does not enforce
# the requested size: all of them share the one node disk. The sizes below are only a scheduling hint, not a
# quota, so a runaway build can fill the node regardless. The homeserver-bootc workflows therefore check free
# space on /var/lib/containers/storage and prune old images (.github/actions/build-cleanup).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dnf-cache
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 25Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podman-tmp
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cross-run-cache
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Read-only additionalimagestores for rootless podman (/var/lib/shared). homeserver-bootc only creates the
  # directory and points storage.conf at it; nothing in its workflows populates it, so it is likely empty.
  name: container-shared-storage
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 24Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: container-storage-rootful
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Rootless podman storage. The image build itself is rootful (sudo buildah, container-storage-rootful), but the
  # "Run on PR" and "Trivy scan" jobs pull and scan PR images rootless, so this volume is still needed.
  name: container-rootless-storage
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 32Gi
