---
# lvm-fast is NVMe, lvm-bulk is a USB HDD. Only the cache volumes carry the Flux force annotation (recreated on a
# storageClass change), so every class is named explicitly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podman-tmp
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: lvm-fast
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Read-only additionalimagestores for rootless podman; likely empty, nothing in homeserver-bootc populates it.
  name: container-shared-storage
  namespace: arc-runners-system
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: lvm-bulk
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: container-storage-rootful
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm-fast
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Rootless storage: PR and Trivy jobs pull images rootless (the build itself uses container-storage-rootful).
  name: container-rootless-storage
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: lvm-fast
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # ISO builder cache: `containers` storage and bootc-image-builder's `bib` osbuild store (saves 11 of 19 minutes).
  # One pod at a time (maxRunners 1).
  name: bootc-iso-cache
  namespace: arc-runners-system
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: lvm-bulk
  resources:
    requests:
      storage: 80Gi
---
# The caches every runner shares, whichever node it lands on: JuiceFS, ReadWriteMany. Peak use over 3 days was 2.4 and 1.0 GiB.
# New names: the old claims were ReadWriteOnce on lvm-bulk and the warm runner holds them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dnf-cache-jfs
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cross-run-cache-jfs
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs
  resources:
    requests:
      storage: 2Gi
