---
# Persistent runner volumes. They use the default storage class (lvm-fast): a volume of exactly the requested size, expandable online (docs/storage-plan.md).
# The homeserver-bootc workflows still check free space on /var/lib/containers/storage and prune old images (.github/actions/build-cleanup), now before the volume is full.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dnf-cache
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podman-tmp
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cross-run-cache
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Read-only additionalimagestores for rootless podman (/var/lib/shared). homeserver-bootc only creates the
  # directory and points storage.conf at it; nothing in its workflows populates it, so it is likely empty.
  name: container-shared-storage
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: container-storage-rootful
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Rootless podman storage. The image build itself is rootful (sudo buildah, container-storage-rootful), but the
  # "Run on PR" and "Trivy scan" jobs pull and scan PR images rootless, so this volume is still needed.
  name: container-rootless-storage
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # The ISO builder (arc-iso-bootc, github-runner-bootc): its container storage (the OS image and bootc-image-builder) in
  # `containers`, and bootc-image-builder's osbuild store and RPM metadata (`bib`), so the installer RPMs are not
  # downloaded on every build (11 of 19 minutes). Only that scale set uses it (maxRunners 1: one pod at a time).
  name: bootc-iso-cache
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 80Gi
