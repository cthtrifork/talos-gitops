---
# Builds and container jobs (Docker, podman) of cthtrifork/talos-gitops (public repo): the default runner of its workflows.
# Docker (dind sidecar) and rootless podman; podman pulls go through the zot caches (ConfigMap podman-registries). Needs the
# runner GitHub App installed on talos-gitops. The workflows run fork PRs on GitHub-hosted runners (runs-on checks the head repository).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-talos-gitops-scan
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-talos-gitops-scan
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/talos-gitops
    runnerScaleSetName: arc-scan-talos-gitops

    maxRunners: 4 # builds in parallel; each runner needs 40Gi lvm-fast, the other jobs use arc-light-talos-gitops
    minRunners: 0

    githubConfigSecret: github-auth
    containerMode: {} # dind runs as a sidecar below, not through the chart
    template:
      metadata:
        annotations:
          # Internal + public CAs (jobs reach the allowlisted internet).
          trust.portableinfo.cloud/public: "true"
      spec:
        # No runner is tied to a node (the cache server is not either): spread over the nodes when there is room
        # tmp and var-tmp are on lvm-bulk, which talos-tba-msi does not have
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - talos-tba-msi
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: arc-scan-talos-gitops
        initContainers:
          # Initialize volume permissions without recursively modifying
          # Podman/Buildah image-layer ownership or permissions.
          - name: volume-perms
            image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            imagePullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -ec
              - |
                chown 0:0 /tmp /var/tmp
                chmod 1777 /tmp /var/tmp

                chown 1001:1001 \
                  /volumes/rootless \
                  /volumes/work \
                  /volumes/xdg-runtime

                chmod 0700 /volumes/rootless /volumes/xdg-runtime
                chmod 0755 /volumes/work
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - FOWNER
                  - DAC_OVERRIDE
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 32Mi
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: var-tmp
                mountPath: /var/tmp
              - name: container-rootless-storage
                mountPath: /volumes/rootless
              - name: work
                mountPath: /volumes/work
              - name: xdg-runtime
                mountPath: /volumes/xdg-runtime
          - name: init-dind-externals
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261128.77@sha256:60a227f92bf300495f1a3a9d00119d2296c92690bb2ec761480487c8df14a223
            imagePullPolicy: IfNotPresent
            command:
              - "cp"
              - "-r"
              - "/home/runner/externals/."
              - "/home/runner/tmpDir/"
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          - name: dind
            # renovate: datasource=docker depName=mirror.gcr.io/library/docker versioning=docker
            image: mirror.gcr.io/library/docker:29.10.1-dind@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0
            imagePullPolicy: IfNotPresent
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 6Gi
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: docker-lib
                mountPath: /var/lib/docker
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261128.77@sha256:60a227f92bf300495f1a3a9d00119d2296c92690bb2ec761480487c8df14a223
            imagePullPolicy: IfNotPresent
            # Podman rejects an XDG_RUNTIME_DIR not owned by its user, and a fresh emptyDir is root-owned.
            command:
              - /bin/bash
              - -c
              - install -d -m 700 "$XDG_RUNTIME_DIR" && exec /usr/local/bin/use-cache-server /home/runner/run.sh

            resources:
              requests:
                cpu: 250m
                memory: 768Mi
              limits:
                memory: 4Gi

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              # /run/user/1001 does not exist and /run is root-owned, hence a memory-backed volume.
              - name: XDG_RUNTIME_DIR
                value: /tmp/xdg/runtime
              - name: STORAGE_DRIVER
                value: overlay

              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              # The trailing slash is required.
              - name: ACTIONS_RESULTS_URL
                value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/

            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              - name: tmp
                mountPath: /tmp

              - name: var-tmp
                mountPath: /var/tmp
              - name: registries
                mountPath: /etc/containers/registries.conf.d/zot-mirror.conf
                subPath: zot-mirror.conf
                readOnly: true

              - name: xdg-runtime
                mountPath: /tmp/xdg
              - name: dind-sock
                mountPath: /var/run

        imagePullSecrets:
          - name: github-auth
        securityContext:
          #fsGroup: 1001
          # Do not set fsGroup. Recursive volume permission changes can
          # corrupt POSIX metadata in Podman/Buildah image storage.
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: registries
            configMap:
              name: podman-registries
          - name: xdg-runtime
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi # counts against the pod's memory
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir:
              sizeLimit: 2Gi
          - name: docker-lib
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 20Gi
          - name: var-tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-bulk
                  resources:
                    requests:
                      storage: 6Gi
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 8Gi
          - name: tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-bulk
                  resources:
                    requests:
                      storage: 4Gi
          - name: container-rootless-storage
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 12Gi
    listenerTemplate:
      metadata:
        labels:
          prometheus-scrape: "true"
        annotations:
          # talks to github.com
          trust.portableinfo.cloud/public: "true"
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            # the exporter enabled by the controller's metrics.listenerAddr is the listener's only HTTP server
            livenessProbe:
              httpGet:
                path: /metrics
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 10
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
