---
# Image scans and container jobs of cthtrifork/talos-gitops (public repo), selected by the repository variable PRIVATE_RUNNER.
# Podman only, pulls go through the zot caches (ConfigMap podman-registries). Needs the runner GitHub App installed on talos-gitops.
# Fork PRs fall back to GitHub-hosted runners in the workflows (runs-on checks the head repository).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-talos-gitops-scan
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-talos-gitops-scan
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/talos-gitops
    runnerScaleSetName: arc-scan-talos-gitops

    maxRunners: 4 # a scan matrix runs in parallel
    minRunners: 0

    githubConfigSecret: github-auth
    containerMode: {} # no dind, no kubernetes mode
    template:
      metadata:
        annotations:
          # Internal + public CAs (jobs reach the allowlisted internet).
          trust.portableinfo.cloud/public: "true"
      spec:
        # No runner is tied to a node (the cache server is not either): spread over the nodes when there is room
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: arc-scan-talos-gitops
        initContainers:
          # Initialize volume permissions without recursively modifying
          # Podman/Buildah image-layer ownership or permissions.
          - name: volume-perms
            image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            imagePullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -ec
              - |
                chown 0:0 /tmp /var/tmp
                chmod 1777 /tmp /var/tmp

                chown 1001:1001 \
                  /volumes/rootless \
                  /volumes/work \
                  /volumes/xdg-runtime

                chmod 0700 /volumes/rootless /volumes/xdg-runtime
                chmod 0755 /volumes/work
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - FOWNER
                  - DAC_OVERRIDE
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 32Mi
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: var-tmp
                mountPath: /var/tmp
              - name: container-rootless-storage
                mountPath: /volumes/rootless
              - name: work
                mountPath: /volumes/work
              - name: xdg-runtime
                mountPath: /volumes/xdg-runtime
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261126.41@sha256:bc132de2ece52acbc8eba892135d7db79163975955c353cdb51bf4ad32afd563
            imagePullPolicy: IfNotPresent
            # Podman rejects an XDG_RUNTIME_DIR not owned by its user, and a fresh emptyDir is root-owned.
            command:
              - /bin/bash
              - -c
              - install -d -m 700 "$XDG_RUNTIME_DIR" && exec /usr/local/bin/use-cache-server /home/runner/run.sh

            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 6Gi

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              # /run/user/1001 does not exist and /run is root-owned, hence a memory-backed volume.
              - name: XDG_RUNTIME_DIR
                value: /tmp/xdg/runtime
              - name: STORAGE_DRIVER
                value: overlay

              # The trailing slash is required.
              - name: ACTIONS_RESULTS_URL
                value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/

            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              - name: tmp
                mountPath: /tmp

              - name: var-tmp
                mountPath: /var/tmp
              - name: registries
                mountPath: /etc/containers/registries.conf.d/zot-mirror.conf
                subPath: zot-mirror.conf
                readOnly: true

              - name: xdg-runtime
                mountPath: /tmp/xdg

        imagePullSecrets:
          - name: github-auth
        securityContext:
          #fsGroup: 1001
          # Do not set fsGroup. Recursive volume permission changes can
          # corrupt POSIX metadata in Podman/Buildah image storage.
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: registries
            configMap:
              name: podman-registries
          - name: xdg-runtime
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi # counts against the pod's memory
          - name: var-tmp
            emptyDir:
              sizeLimit: 4Gi
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 8Gi
          - name: tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 8Gi
          - name: container-rootless-storage
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 20Gi
    listenerTemplate:
      metadata:
        labels:
          prometheus-scrape: "true"
        annotations:
          # talks to github.com
          trust.portableinfo.cloud/public: "true"
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            # the exporter enabled by the controller's metrics.listenerAddr is the listener's only HTTP server
            livenessProbe:
              httpGet:
                path: /metrics
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 10
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
