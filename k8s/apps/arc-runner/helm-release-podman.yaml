---
# Experimental second scale set for the homeserver-gui build: the same runner as helm-release.yaml, minus the
# Docker-in-Docker sidecar. The homeserver-bootc workflows use buildah and podman only, so this proves (or
# disproves) that nothing needs the Docker daemon, and frees the memory, the 32Gi docker-lib and the Docker
# wait at job start.
#
# Select it from homeserver-bootc with the repository variable ARC_RUNNER=arc-ubuntu-podman; unset it to fall
# back to arc-ubuntu. minRunners is 0, so it costs nothing while unused.
#
# Builds run in parallel, and two builds on one containers storage corrupt it, so nothing is shared: every pod gets
# its own generic ephemeral volumes (lvm-fast), deleted with the pod. Every build is
# therefore cold (empty dnf cache and image storage). To soften that, registries.conf sends ghcr.io, quay.io and
# gcr.io pulls through the in-cluster zot caches first (ConfigMap podman-registries) and falls back to the origin.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-homeserver-bootc-podman
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-podman
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
    runnerScaleSetName: arc-ubuntu-podman # runs-on: arc-ubuntu-podman
    # runs-on: arc-ubuntu matches both scale sets; arc-ubuntu-podman selects this one (no Docker daemon: use arc-ubuntu-docker for jobs that need one)
    scaleSetLabels:
      - arc-ubuntu
      - arc-ubuntu-podman

    maxRunners: 3 # CPU and the node's lvm-fast volume group allow about 3 to 4 builds at once (see the PR)
    minRunners: 0 # experimental, so no idle pod; the first job waits for the pod to start

    githubConfigSecret: github-auth
    containerMode: {} # no dind, no kubernetes mode
    template:
      spec:
        # Same node as the cache server: a pod-to-pod transfer between two nodes runs at 3 to 5 MB/s in this cluster and a cache
        # upload stalled (see helm-release-talos-gitops-e2e.yaml). The server's volume is node-local, so it never moves.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                namespaces:
                  - gha-cache-system
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: github-actions-cache-server
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261122.21@sha256:9bfb04321a84c9bbb63869084f8c33956f9cacfbca12db8d6f77701617358e4e
            imagePullPolicy: IfNotPresent
            # Podman rejects an XDG_RUNTIME_DIR that is not owned by its user, and a fresh emptyDir is root owned, so
            # create a 0700 subdirectory of the volume as the runner user before the runner starts (steps such as
            # `podman login` run before prepare-podman).
            command:
              - /bin/bash
              - -c
              - install -d -m 700 "$XDG_RUNTIME_DIR" && exec /usr/local/bin/use-cache-server /home/runner/run.sh

            resources:
              requests:
                cpu: 500m
                memory: 2Gi # median job 1.4Gi, p90 4Gi
              limits:
                memory: 12Gi # observed peak over 14 days on arc-ubuntu: 6Gi. No CPU limit: dnf, buildah and rechunk burst

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              # No DOCKER_HOST and no wait for a Docker daemon: there is none.
              # Rootless podman keeps its socket, auth file and run state in XDG_RUNTIME_DIR. The image's /run/user/1001
              # does not exist and /run is root owned here (the Docker-in-Docker pod gets a writable /run from its
              # /var/run socket volume), so point it at a memory-backed volume (mounted below), which also exists before the first step runs.
              - name: XDG_RUNTIME_DIR
                value: /tmp/xdg/runtime
              - name: STORAGE_DRIVER
                value: overlay

              - name: BUILDAH_ISOLATION
                value: chroot

              - name: BUILDAH_LAYERS
                value: "true"

              # The in-cluster cache server (k8s/apps/gha-cache): actions/cache and the tool caches stay in the cluster. Caches
              # saved by GitHub-hosted jobs are not visible here. The trailing slash is required.
              - name: ACTIONS_RESULTS_URL
                value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/
              - name: RUNNER_UPDATE_CA_CERTS
                value: "1"
              # The fileserver upload token, rotated every 30 days by External Secrets (k8s/infra/secret-store/; an
              # ExternalSecret in k8s/apps/fileserver copies it here). Read at pod start: the runners are ephemeral, so
              # every job gets the current token. optional: the runner starts before the first sync. A job echoing it
              # into its log leaks it: use ::add-mask::.
              - name: FILESERVER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: fileserver-upload-token
                    key: current
                    optional: true
              - name: FILESERVER_URL
                value: http://fileserver-upload.fileserver-system.svc:8082

            volumeMounts:
              - name: ca-certs
                mountPath: /usr/local/share/ca-certificates/private-ca.crt
                subPath: ca.crt
              # Persistent rootful Podman/Buildah storage (the image build).
              - name: container-storage-rootful
                mountPath: /var/lib/containers/storage
              # Job workspace: node-local ephemeral storage.
              - name: work
                mountPath: /home/runner/_work
              # Persistent rootless storage (Run on PR and Trivy pull and scan PR images rootless).
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              # Persistent DNF caches.
              - name: dnf-cache
                mountPath: /var/cache/dnf
              - name: dnf-cache
                mountPath: /home/runner/.cache/dnf
              # Downloaded release binaries and the like, shared between builds.
              - name: cross-run-cache
                mountPath: /home/runner/.cache/tmp
              # Scratch space. Not persistent, so leftovers cannot pile up between builds.
              - name: tmp
                mountPath: /tmp
              # buildah stages layers here while committing.
              - name: var-tmp
                mountPath: /var/tmp
              # Pulls go through zot first.
              - name: registries
                mountPath: /etc/containers/registries.conf.d/zot-mirror.conf
                subPath: zot-mirror.conf
                readOnly: true
              # XDG_RUNTIME_DIR for rootless podman: socket, auth file and runroot bookkeeping, a few MB at most.
              - name: xdg-runtime
                mountPath: /tmp/xdg
              # Host udev database, bind-mounted into `bootc install` containers (read-only).
              - name: host-udev
                mountPath: /run/udev
                readOnly: true
              # Live host devtmpfs for `bootc install --via-loopback` (the e2e job); see helm-release.yaml.
              - name: host-dev
                mountPath: /host-dev
        imagePullSecrets:
          - name: github-auth
        securityContext:
          fsGroup: 1001
        volumes:
          - name: ca-certs
            configMap:
              name: portableinfo-ca-bundle
              items:
                - key: ca-bundle.crt
                  path: ca.crt
          - name: registries
            configMap:
              name: podman-registries
          - name: xdg-runtime
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi # counts against the pod's memory; real use is a few MB
          - name: host-udev
            hostPath:
              path: /run/udev
              type: Directory
          - name: host-dev
            hostPath:
              path: /dev
              type: Directory
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 32Gi
          - name: tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 20Gi
          - name: var-tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 30Gi
          - name: container-storage-rootful
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 32Gi
          - name: container-rootless-storage
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-fast
                  resources:
                    requests:
                      storage: 32Gi
          - name: dnf-cache
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-bulk
                  resources:
                    requests:
                      storage: 25Gi
          - name: cross-run-cache
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: lvm-bulk
                  resources:
                    requests:
                      storage: 5Gi
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
