---
# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: arc-ubuntu-podman
  namespace: arc-runners-system
  labels:
    app.kubernetes.io/component: "autoscaling-runner-set"
    helm.sh/chart: gha-rs-0.15.1
    app.kubernetes.io/name: arc-ubuntu-podman
    app.kubernetes.io/instance: arc-ubuntu-podman
    app.kubernetes.io/version: "0.15.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: arc-ubuntu-podman
    actions.github.com/scale-set-namespace: arc-runners-system
  annotations:
    actions.github.com/values-hash: c2bef0a7399216b2295195e8a59d71fa6ac6bdc5e90efe060eac54a18935f76
    actions.github.com/cleanup-manager-role-binding: arc-ubuntu-podman-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: arc-ubuntu-podman-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: arc-ubuntu-podman-gha-rs-no-permission
spec:
  githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
  githubConfigSecret: github-auth
  runnerScaleSetName: arc-ubuntu-podman
  runnerScaleSetLabels:
    - arc-ubuntu
    - arc-ubuntu-podman
  maxRunners: 4
  minRunners: 0
  listenerTemplate:
    metadata:
      labels:
        prometheus-scrape: "true"
      annotations:
        trust.portableinfo.cloud/public: "true"
    spec:
      containers:
        - livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          name: listener
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 15m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
  listenerConfig:
    scaler:
      burst: 100
      qps: 50
  ephemeralRunnerMetadata:
    annotations:
      kubernetes.io/egress-bandwidth: 300M
      kubernetes.io/ingress-bandwidth: 300M
  template:
    metadata:
      annotations:
        trust.portableinfo.cloud/public: "true"
    spec:
      imagePullSecrets:
        - name: github-auth
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              actions.github.com/scale-set-name: arc-ubuntu-podman
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      restartPolicy: Never
      serviceAccountName: arc-ubuntu-podman-gha-rs-no-permission
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              chown 0:0 /tmp /var/tmp /volumes/rootful
              chmod 1777 /tmp /var/tmp
              chmod 0700 /volumes/rootful

              chown 1001:1001 \
                /volumes/rootless \
                /volumes/work \
                /volumes/dnf-cache \
                /volumes/cross-run-cache \
                /volumes/xdg-runtime

              chmod 0700 /volumes/rootless /volumes/xdg-runtime
              chmod 0755 /volumes/work \
                /volumes/dnf-cache \
                /volumes/cross-run-cache
          image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          name: volume-perms
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/tmp
              name: var-tmp
            - mountPath: /volumes/rootful
              name: container-storage-rootful
            - mountPath: /volumes/rootless
              name: container-rootless-storage
            - mountPath: /volumes/work
              name: work
            - mountPath: /volumes/dnf-cache
              name: dnf-cache
            - mountPath: /volumes/cross-run-cache
              name: cross-run-cache
            - mountPath: /volumes/xdg-runtime
              name: xdg-runtime
        - command:
            - sh
            - -c
            - |
              set -e
              find /volumes/cross-run-cache -type f -mtime +14 -print -delete
              find /volumes/cross-run-cache -type d -empty -mtime +14 -print -delete || true
          image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          name: data-retention
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - mountPath: /volumes/cross-run-cache
              name: cross-run-cache
      containers:
        - name: runner
          command:
            - /bin/bash
            - -c
            - install -d -m 700 "$XDG_RUNTIME_DIR" && exec /usr/local/bin/use-cache-server /home/runner/run.sh
          image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261126.39@sha256:fa8a4a97f03b12aebc1ff9645ed07aafb3964fc965dedb024a36bb16218af214
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 12Gi
            requests:
              cpu: 500m
              memory: 2Gi
          securityContext:
            privileged: true
            runAsGroup: 1001
            runAsUser: 1001
            seLinuxOptions:
              type: container_file_t
          env:
            - name: XDG_RUNTIME_DIR
              value: /tmp/xdg/runtime
            - name: STORAGE_DRIVER
              value: overlay
            - name: BUILDAH_ISOLATION
              value: chroot
            - name: BUILDAH_LAYERS
              value: "true"
            - name: ACTIONS_RESULTS_URL
              value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/
            - name: FILESERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: current
                  name: fileserver-upload-token
                  optional: true
            - name: FILESERVER_URL
              value: http://fileserver-upload.fileserver-system.svc:8082
          volumeMounts:
            - mountPath: /var/lib/containers/storage
              name: container-storage-rootful
            - mountPath: /home/runner/_work
              name: work
            - mountPath: /home/runner/.local/share/containers/storage
              name: container-rootless-storage
            - mountPath: /var/cache/dnf
              name: dnf-cache
            - mountPath: /home/runner/.cache/dnf
              name: dnf-cache
            - mountPath: /home/runner/.cache/tmp
              name: cross-run-cache
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/tmp
              name: var-tmp
            - mountPath: /etc/containers/registries.conf.d/zot-mirror.conf
              name: registries
              readOnly: true
              subPath: zot-mirror.conf
            - mountPath: /tmp/xdg
              name: xdg-runtime
            - mountPath: /run/udev
              name: host-udev
              readOnly: true
            - mountPath: /host-dev
              name: host-dev
      volumes:
        - configMap:
            name: podman-registries
          name: registries
        - emptyDir:
            medium: Memory
            sizeLimit: 256Mi
          name: xdg-runtime
        - hostPath:
            path: /run/udev
            type: Directory
          name: host-udev
        - hostPath:
            path: /dev
            type: Directory
          name: host-dev
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 16Gi
                storageClassName: lvm-fast
          name: work
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 16Gi
                storageClassName: lvm-fast
          name: tmp
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 24Gi
                storageClassName: lvm-fast
          name: var-tmp
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 32Gi
                storageClassName: lvm-fast
          name: container-storage-rootful
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 28Gi
                storageClassName: lvm-fast
          name: container-rootless-storage
        - name: dnf-cache
          persistentVolumeClaim:
            claimName: dnf-cache-jfs
        - name: cross-run-cache
          persistentVolumeClaim:
            claimName: cross-run-cache-jfs
