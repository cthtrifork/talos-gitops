---
# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: arc-ubuntu
  namespace: arc-runners-system
  labels:
    app.kubernetes.io/component: "autoscaling-runner-set"
    helm.sh/chart: gha-rs-0.15.1
    app.kubernetes.io/name: arc-ubuntu
    app.kubernetes.io/instance: arc-ubuntu
    app.kubernetes.io/version: "0.15.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: arc-ubuntu
    actions.github.com/scale-set-namespace: arc-runners-system
  annotations:
    actions.github.com/values-hash: 0f75fc90cb5c2c34baf2128cda46b02c2056c0b73ca33b1a9e11aa44c68d8e3
    actions.github.com/cleanup-manager-role-binding: arc-ubuntu-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: arc-ubuntu-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: arc-ubuntu-gha-rs-no-permission
spec:
  githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
  githubConfigSecret: github-auth
  runnerScaleSetName: arc-ubuntu
  runnerScaleSetLabels:
    - arc-ubuntu
    - arc-ubuntu-docker
  maxRunners: 1
  minRunners: 1
  listenerTemplate:
    metadata:
      labels:
        prometheus-scrape: "true"
      annotations:
        trust.portableinfo.cloud/public: "true"
    spec:
      containers:
        - livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          name: listener
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 15m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
  listenerConfig:
    scaler:
      burst: 100
      qps: 50
  ephemeralRunnerMetadata:
    annotations:
      kubernetes.io/egress-bandwidth: 300M
      kubernetes.io/ingress-bandwidth: 300M
  template:
    metadata:
      annotations:
        trust.portableinfo.cloud/public: "true"
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: github-actions-cache-server
              namespaces:
                - gha-cache-system
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: github-auth
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      serviceAccountName: arc-ubuntu-gha-rs-no-permission
      initContainers:
        - command:
            - sh
            - -c
            - |
              set -e
              find /tmp/arc-cache -type f -mtime +14 -print -delete
              find /tmp/arc-cache -type d -empty -mtime +14 -print -delete || true
          image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          name: data-retention
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - mountPath: /tmp/arc-cache
              name: cross-run-cache
        - command:
            - chmod
            - "1777"
            - /tmp
          image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          name: tmp-perms
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /tmp
              name: tmp-memory
        - command:
            - cp
            - -r
            - /home/runner/externals/.
            - /home/runner/tmpDir/
          image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261123.33@sha256:23beaea4d501a868353503220de45c38ccdc1e629530d56adfbbec6d9f1c89f2
          imagePullPolicy: IfNotPresent
          name: init-dind-externals
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 25m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - mountPath: /home/runner/tmpDir
              name: dind-externals
        - args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          image: mirror.gcr.io/library/docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
          imagePullPolicy: IfNotPresent
          name: dind
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 512Mi
          restartPolicy: Always
          securityContext:
            privileged: true
          startupProbe:
            exec:
              command:
                - docker
                - info
            failureThreshold: 24
            initialDelaySeconds: 0
            periodSeconds: 5
          volumeMounts:
            - mountPath: /home/runner/_work
              name: work
            - mountPath: /var/run
              name: dind-sock
            - mountPath: /home/runner/externals
              name: dind-externals
            - mountPath: /var/lib/docker
              name: docker-lib
      containers:
        - name: runner
          command:
            - /usr/local/bin/use-cache-server
            - /home/runner/run.sh
          image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261123.33@sha256:23beaea4d501a868353503220de45c38ccdc1e629530d56adfbbec6d9f1c89f2
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 12Gi
            requests:
              cpu: 500m
              memory: 2Gi
          securityContext:
            privileged: true
            runAsGroup: 1001
            runAsUser: 1001
            seLinuxOptions:
              type: container_file_t
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
            - name: STORAGE_DRIVER
              value: overlay
            - name: BUILDAH_ISOLATION
              value: chroot
            - name: BUILDAH_LAYERS
              value: "true"
            - name: ACTIONS_RESULTS_URL
              value: http://gha-cache.gha-cache-system.svc.cluster.local:3000/
            - name: FILESERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: current
                  name: fileserver-upload-token
                  optional: true
            - name: FILESERVER_URL
              value: http://fileserver-upload.fileserver-system.svc:8082
          volumeMounts:
            - mountPath: /var/lib/containers/storage
              name: container-storage-rootful
            - mountPath: /home/runner/_work
              name: work
            - mountPath: /var/run
              name: dind-sock
            - mountPath: /home/runner/.local/share/containers/storage
              name: container-rootless-storage
            - mountPath: /var/lib/shared
              name: container-shared-storage
            - mountPath: /var/lib/docker
              name: docker-lib
            - mountPath: /var/cache/dnf
              name: dnf-cache
            - mountPath: /home/runner/.cache/dnf
              name: dnf-cache
            - mountPath: /home/runner/.cache/tmp
              name: cross-run-cache
            - mountPath: /tmp
              name: tmp-memory
            - mountPath: /var/tmp
              name: podman-tmp
            - mountPath: /run/udev
              name: host-udev
              readOnly: true
            - mountPath: /host-dev
              name: host-dev
      volumes:
        - hostPath:
            path: /run/udev
            type: Directory
          name: host-udev
        - hostPath:
            path: /dev
            type: Directory
          name: host-dev
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 32Gi
                storageClassName: lvm-fast
          name: work
        - emptyDir: {}
          name: dind-sock
        - emptyDir:
            sizeLimit: 2Gi
          name: dind-externals
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 32Gi
                storageClassName: lvm-fast
          name: docker-lib
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 20Gi
                storageClassName: lvm-fast
          name: tmp-memory
        - name: container-storage-rootful
          persistentVolumeClaim:
            claimName: container-storage-rootful
        - name: container-rootless-storage
          persistentVolumeClaim:
            claimName: container-rootless-storage
        - name: podman-tmp
          persistentVolumeClaim:
            claimName: podman-tmp
        - name: dnf-cache
          persistentVolumeClaim:
            claimName: dnf-cache
        - name: container-shared-storage
          persistentVolumeClaim:
            claimName: container-shared-storage
        - name: cross-run-cache
          persistentVolumeClaim:
            claimName: cross-run-cache
