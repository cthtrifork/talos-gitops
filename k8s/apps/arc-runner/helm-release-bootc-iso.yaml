---
# SECURITY: every job here is privileged (root on the node) and can read FILESERVER_TOKEN, and the repo is public.
# Keep write access to yourself, require approval for outside collaborators' runs, and gate uploads on main with
# `environment: file-upload`.
# github-runner.containerfile pins the Fedora repos to mirrors.dotsrc.org (FEDORA_MIRROR); keep in step with the egress policy.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-bootc-iso
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-bootc-iso
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    remediation:
      retries: 3
    createNamespace: false

  upgrade:
    remediation:
      retries: 3
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/github-runner-bootc
    runnerScaleSetName: arc-iso-bootc
    scaleSetLabels:
      - arc-iso-bootc

    maxRunners: 1
    minRunners: 0

    githubConfigSecret: github-auth-bootc-files
    containerMode: {} # no dind, no kubernetes mode
    template:
      metadata:
        annotations:
          # Internal + public CAs (jobs reach the allowlisted internet).
          trust.portableinfo.cloud/public: "true"
      spec:
        # Same node as the fileserver: cross-node upload ran at 3 to 5 MB/s vs 87 MB/s on one node. Jobs wait if the node is full.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                namespaces:
                  - fileserver-system
                labelSelector:
                  matchLabels:
                    app: fileserver
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/github-actions-runner versioning=semver
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:2.338.2-20261123.33@sha256:23beaea4d501a868353503220de45c38ccdc1e629530d56adfbbec6d9f1c89f2
            imagePullPolicy: IfNotPresent
            # Podman rejects an XDG_RUNTIME_DIR not owned by its user, and a fresh emptyDir is root-owned.
            command:
              - /bin/bash
              - -c
              - install -d -m 700 "$XDG_RUNTIME_DIR" && exec /home/runner/run.sh

            resources:
              requests:
                cpu: 500m
                memory: 2Gi # median job 1.4Gi, p90 4Gi
              limits:
                memory: 12Gi # observed peak over 14 days on arc-ubuntu: 6Gi. No CPU limit: dnf, buildah and rechunk burst

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              # /run/user/1001 does not exist and /run is root-owned, hence a memory-backed volume.
              - name: XDG_RUNTIME_DIR
                value: /tmp/xdg/runtime
              - name: STORAGE_DRIVER
                value: overlay

              - name: BUILDAH_ISOLATION
                value: chroot

              - name: BUILDAH_LAYERS
                value: "true"

              # optional: the runner starts before the first sync.
              - name: FILESERVER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: fileserver-upload-token
                    key: current
                    optional: true
              - name: FILESERVER_URL
                value: http://fileserver-upload.fileserver-system.svc:8082

            volumeMounts:
              - name: bootc-iso-cache
                mountPath: /var/lib/containers/storage
                subPath: containers
              # osbuild store and RPM metadata; the workflow wipes it when it grows past a limit.
              - name: bootc-iso-cache
                mountPath: /var/cache/bib
                subPath: bib
              - name: work
                mountPath: /home/runner/_work

              - name: tmp
                mountPath: /tmp

              - name: var-tmp
                mountPath: /var/tmp

              - name: registries
                mountPath: /etc/containers/registries.conf.d/zot-mirror.conf
                subPath: zot-mirror.conf
                readOnly: true

              - name: xdg-runtime
                mountPath: /tmp/xdg

              - name: host-udev
                mountPath: /run/udev
                readOnly: true

              - name: host-dev
                mountPath: /host-dev
        imagePullSecrets:
          - name: github-auth
        securityContext:
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: registries
            configMap:
              name: podman-registries
          - name: xdg-runtime
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi # counts against the pod's memory
          - name: host-udev
            hostPath:
              path: /run/udev
              type: Directory
          - name: host-dev
            hostPath:
              path: /dev
              type: Directory
          # ISOs reach about 10 GiB
          - name: work
            emptyDir:
              sizeLimit: 16Gi
          - name: tmp
            emptyDir:
              sizeLimit: 10Gi
          - name: var-tmp
            emptyDir:
              sizeLimit: 20Gi
          - name: bootc-iso-cache
            persistentVolumeClaim:
              claimName: bootc-iso-cache
    listenerTemplate:
      metadata:
        labels:
          prometheus-scrape: "true"
        annotations:
          # talks to github.com
          trust.portableinfo.cloud/public: "true"
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            # the exporter enabled by the controller's metrics.listenerAddr is the listener's only HTTP server
            livenessProbe:
              httpGet:
                path: /metrics
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 10
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
