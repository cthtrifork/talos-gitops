---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-deployment
  namespace: adguard-system
  annotations:
    reloader.stakater.com/auto: "true"
    configmap.reloader.stakater.com/reload: portableinfo-ca-bundle # the bundle is injected by Kyverno, invisible to auto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
      annotations:
        trust.portableinfo.cloud/public: "true" # DoH upstreams and the filter lists
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - adguard-home
                topologyKey: "kubernetes.io/hostname"

      initContainers:
        - name: copy-config
          image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp -vf /tmp/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
          volumeMounts:
            - name: adguard-config
              mountPath: /opt/adguardhome/conf
            - name: initial-config
              mountPath: /tmp/AdGuardHome.yaml
              subPath: AdGuardHome.yaml
          securityContext:
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: adguard-home
          image: adguard/adguardhome:v1.0.0@sha256:f00a586f0d1caa74f149340bfb225014960310488ffa838406b89256900a96c2
          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
            - containerPort: 853
              name: dns-tls
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: adguard-data
              mountPath: /opt/adguardhome/work/
            - name: adguard-config
              mountPath: /opt/adguardhome/conf/
            - name: adguard-tls-cert
              mountPath: /opt/adguardhome/conf/tls/
          # The binary has file capability cap_net_bind_service=+eip to bind 53/443/853 as non-root. That needs the
          # capability in the bounding set and no_new_privs off, so allowPrivilegeEscalation must stay true or exec fails.
          securityContext:
            allowPrivilegeEscalation: true
            privileged: false

            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: initial-config
          configMap:
            name: adguard-initial-config
        - name: adguard-tls-cert
          secret:
            secretName: adguard-tls-cert
        - name: adguard-data
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: lvm-fast
                resources:
                  requests:
                    storage: 10Gi
        - name: adguard-config
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: lvm-fast
                resources:
                  requests:
                    storage: 1Gi
