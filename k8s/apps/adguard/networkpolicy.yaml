# AdGuard is the LAN's DNS server (192.168.1.253), so ingress admits world as well as the cluster.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: adguard-system-default-deny
  namespace: adguard-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: adguard-system-allow-dns-apiserver
  namespace: adguard-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: adguard-home
  namespace: adguard-system
spec:
  endpointSelector:
    matchLabels:
      app: adguard-home
  ingress:
    # DNS, DoT, DoH
    - fromEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
            - port: "853"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Web UI: Omni service exposer (host network) and the exporter
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: adguard-exporter
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS proxy on, so Cilium learns the addresses behind the hosts below
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # DNS-over-HTTPS upstreams and the blocklists
    - toFQDNs:
        - matchName: dns.cloudflare.com
        - matchName: cloudflare-dns.com
        - matchName: dns.google
        - matchName: adguardteam.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # DoH upstream IPs: AdGuard resolves them via the bootstrap resolvers, not kube-dns, so toFQDNs never learns them
    - toCIDRSet:
        - cidr: 162.159.61.8/32
        - cidr: 172.64.41.8/32
        - cidr: 8.8.4.4/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # bootstrap and fallback resolvers
    - toCIDRSet:
        - cidr: 1.1.1.1/32
        - cidr: 8.8.8.8/32
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
            - port: "443"
              protocol: TCP
    # the LAN (reverse lookups)
    - toCIDRSet:
        - cidr: 192.168.1.0/24
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: adguard-exporter
  namespace: adguard-system
spec:
  endpointSelector:
    matchLabels:
      app: adguard-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9618"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app: adguard-home
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
