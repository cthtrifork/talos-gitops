# Copies ghcr-pull into homeserver-vm; only that namespace may use this store.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: homeserver-vm-source
spec:
  conditions:
    - namespaces:
        - homeserver-vm
  provider:
    kubernetes:
      remoteNamespace: claude-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: claude-system
          key: ca.crt
      auth:
        serviceAccount:
          name: homeserver-vm-source
          namespace: claude-system
