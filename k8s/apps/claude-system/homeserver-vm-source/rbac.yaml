# The service account the ClusterSecretStore homeserver-vm-source uses to copy the read:packages token (ghcr-pull, for the
# CDI import) into the homeserver-vm namespace. It may read that Secret and nothing else.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeserver-vm-source
  namespace: claude-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homeserver-vm-source
  namespace: claude-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - ghcr-pull
    verbs:
      - get
  # the store checks its own permissions when it is created
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homeserver-vm-source
  namespace: claude-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homeserver-vm-source
subjects:
  - kind: ServiceAccount
    name: homeserver-vm-source
    namespace: claude-system
