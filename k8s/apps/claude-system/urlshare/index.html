<style>
  :root {
    color-scheme: light dark;
    --page: #f4f4f1; --card: #ffffff; --ink: #141413; --ink-2: #4a4843; --line: #e3e2da;
    --accent: #1f63b5; --on-accent: #ffffff; --ok: #1a7f4b; --warn: #8a5a00; --bad: #b3261e; --on-bad: #ffffff;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Shared with the cockpit: the type scale is small (labels, metadata), medium (body), large (titles), extra large (page title, headline numbers). */
    --fs-sm: 12px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --card: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --line: #2c2c2a;
      --accent: #3987e5; --ok: #3cc58a; --warn: #f2d98a; --bad: #ff8a80; --on-bad: #0d0d0d;
    }
  }
  * { box-sizing: border-box; }
  /* Phone and Home Screen: no text zoom after a rotation, no tap flash or double-tap zoom delay, the page colour behind the rubber band. */
  html { -webkit-text-size-adjust: 100%; background: var(--page); }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body { margin: 0; background: var(--page); color: var(--ink); font: var(--fs-lg)/1.5 var(--font);
         padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, calc(env(safe-area-inset-bottom) + 24px)) max(16px, env(safe-area-inset-left)); display: flex; justify-content: center; }
  main { width: 100%; max-width: 760px; }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 2px; color: var(--accent); font-size: var(--fs-md); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  h1 { font-size: var(--fs-xl); margin: 0 0 2px; }
  h2 { font-size: var(--fs-lg); margin: 22px 0 10px; }
  .sub { margin: 0 0 16px; color: var(--ink-2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card.waiting { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .card .err { margin: 10px 0 0; font-size: var(--fs-md); color: var(--bad); }
  .card .err:empty { display: none; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stamp { color: var(--ink-2); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stamp:empty { display: none; }
  .host { font-weight: 700; font-size: var(--fs-lg); overflow-wrap: anywhere; }
  .url { font-family: var(--mono); font-size: var(--fs-md); color: var(--ink-2); overflow-wrap: anywhere; margin: 4px 0 8px; }
  .meta { font-size: var(--fs-md); color: var(--ink-2); }
  .meta.bad { color: var(--bad); }
  .tag { display: inline-block; font-size: var(--fs-sm); font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); margin-right: 6px; }
  .tag.approved { color: var(--ok); } .tag.rejected, .tag.failed { color: var(--bad); } .tag.pending, .tag.fetching { color: var(--warn); }
  .row { display: flex; gap: 12px; margin-top: 12px; }
  button { font: inherit; font-weight: 600; flex: 1; min-height: 44px; padding: 10px 16px; border: 0; border-radius: 10px;
           background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button.no { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:active { filter: brightness(0.9); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  .hint { margin: 10px 0 0; font-size: var(--fs-md); color: var(--warn); min-height: 1.5em; }
  .empty { color: var(--ink-2); }
  /* Destructive actions: outlined red at rest; the confirm step is solid red so it cannot be mistaken for the harmless Cancel next to it. */
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button.danger.solid { background: var(--bad); color: var(--on-bad); }
  .cache { margin-top: 24px; }
  .cache h2 { margin-top: 0; }
  .cache .row:empty { display: none; }
  .cache .note:empty { display: none; }
  .cache .stat { margin: 0; font-size: var(--fs-md); color: var(--ink-2); }
  .cache .stat strong { color: var(--ink); }
  .cache .ask { margin: 12px 0 0; font-size: var(--fs-md); color: var(--ink-2); }
  .note { margin: 10px 0 0; font-size: var(--fs-md); color: var(--ok); min-height: 1.5em; }
</style>
</head>

<main>
  <div class="topline"><a class="back" href="https://claudecockpit-portableinfo.workload.eu-central-1.omni.siderolabs.io/">← Cockpit</a><span id="updated" class="stamp" role="status"></span></div>
  <h1>Share URLs</h1>
  <p class="sub">Claude asked for these pages. Approving fetches exactly the address shown, once, and keeps the page for 24 hours.</p>
  <h2>Waiting for you</h2>
  <div id="pending"><p class="empty">Loading…</p></div>
  <h2>Answered</h2>
  <div id="done"><p class="empty">Loading…</p></div>
  <section class="card cache" aria-labelledby="cache-h">
    <h2 id="cache-h">Cache</h2>
    <p class="stat" id="cache-stat">Loading…</p>
    <p class="ask" id="cache-ask" hidden>Deletes every stored page and the list of requests. Claude has to ask again.</p>
    <div class="row" id="cache-row"></div>
    <p id="cache-note" class="note" role="status"></p>
  </section>
  <p id="error" class="hint" role="status"></p>
</main>

<script>
(function () {
  var busy = {};   // id -> true while a click is in flight
  var lastFailure = {};   // id -> why the last click on that request was refused, shown in its card

  function ago(t, now) {
    var s = Math.max(0, now - t);
    return s < 90 ? s + ' s ago' : s < 5400 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago';
  }

  function act(r, action, card) {
    var failure = '';
    busy[r.id] = true;
    card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    fetch('api/v1/requests/' + r.id + '/' + action, { method: 'POST', headers: { 'X-Requested-With': 'urlshare-approval' } })
      .then(function (res) { return res.json().then(function (b) { return { ok: res.ok, body: b }; }); })
      .then(function (x) { failure = x.ok ? '' : (x.body.error || 'The fetch failed.'); })
      .catch(function () { failure = 'Could not reach the page.'; })
      .then(function () {
        delete busy[r.id];
        // the list is rebuilt on refresh, so the reason goes into the card that replaces this one
        if (failure) lastFailure[r.id] = failure; else delete lastFailure[r.id];
        document.getElementById('error').textContent = '';
        refresh();
      });
  }

  function card(r, now) {
    var el = document.createElement('section'), host = '', u = r.url;
    el.className = r.status === 'pending' ? 'card waiting' : 'card';
    try { host = new URL(u).host; } catch (e) { host = ''; }
    var h = document.createElement('div'); h.className = 'host'; h.textContent = host; el.appendChild(h);
    var p = document.createElement('div'); p.className = 'url'; p.textContent = u; el.appendChild(p);
    var m = document.createElement('div'); m.className = 'meta';
    var tag = document.createElement('span'); tag.className = 'tag ' + r.status; tag.textContent = r.status; m.appendChild(tag);
    var t = document.createElement('span');
    t.textContent = 'asked ' + ago(r.requested_at, now) + (r.status === 'approved' ? ', ' + Math.round((r.size || 0) / 1024) + ' KiB ' + (r.content_type || '') : '');
    m.appendChild(t); el.appendChild(m);
    if (r.status === 'failed' && r.error) {
      var e = document.createElement('div'); e.className = 'meta bad'; e.textContent = r.error; el.appendChild(e);
    }
    var cardErr = document.createElement('div'); cardErr.className = 'err'; cardErr.setAttribute('role', 'alert'); cardErr.textContent = lastFailure[r.id] || ''; el.appendChild(cardErr);
    if (r.status !== 'approved' && r.status !== 'fetching') {
      var row = document.createElement('div'); row.className = 'row';
      var yes = document.createElement('button'); yes.type = 'button';
      yes.textContent = r.status === 'pending' ? 'Approve and fetch' : 'Approve and fetch again';
      var no = document.createElement('button'); no.type = 'button'; no.className = 'no'; no.textContent = 'Reject';
      yes.disabled = no.disabled = !!busy[r.id];
      yes.addEventListener('click', function () { act(r, 'approve', el); });
      no.addEventListener('click', function () { act(r, 'reject', el); });
      if (r.status === 'rejected') row.appendChild(yes); else { row.appendChild(yes); row.appendChild(no); }
      el.appendChild(row);
    }
    return el;
  }

  function fill(id, list, now, empty) {
    var box = document.getElementById(id);
    box.textContent = '';
    if (!list.length) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = empty; box.appendChild(p); return; }
    list.forEach(function (r) { box.appendChild(card(r, now)); });
  }

  var cache = { requests: 0, pages: 0, bytes: 0 };   // what the last refresh saw
  var stage = 'idle';                                // idle -> confirm -> clearing -> idle
  var confirmTimer = null, noteTimer = null;

  function kib(bytes) { return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MiB' : Math.max(1, Math.round(bytes / 1024)) + ' KiB'; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function button(label, cls, onclick) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = label; if (cls) b.className = cls;
    b.addEventListener('click', onclick);
    return b;
  }

  // The cache card. The row is only rebuilt when the stage or the emptiness changes, so a poll never swaps a button under a finger.
  var rowKey = '';
  function renderCache() {
    var empty = cache.requests === 0;
    document.getElementById('cache-stat').textContent = empty ? 'Empty. No pages are stored.' :
      plural(cache.pages, 'page', 'pages') + ' stored (' + kib(cache.bytes) + '), ' + plural(cache.requests, 'request', 'requests') + ' on the list.';
    document.getElementById('cache-ask').hidden = stage !== 'confirm';
    var key = stage + (empty ? ':empty' : '');
    if (key === rowKey) return;
    rowKey = key;
    var row = document.getElementById('cache-row');
    row.textContent = '';
    if (stage === 'confirm') {
      row.appendChild(button('Cancel', 'no', cancelClear));
      row.appendChild(button('Yes, delete ' + plural(cache.requests, 'request', 'requests'), 'danger solid', clearCache));
    } else {
      var b = button(stage === 'clearing' ? 'Clearing…' : 'Clear cache', 'danger', askClear);
      b.disabled = stage === 'clearing' || empty;
      row.appendChild(b);
    }
  }

  function setNote(text) {
    var n = document.getElementById('cache-note');
    n.textContent = text;
    clearTimeout(noteTimer);
    if (text) noteTimer = setTimeout(function () { n.textContent = ''; }, 6000);
  }

  // Two steps on the page instead of a browser dialog (which a Home Screen app shows poorly): the second step goes back by itself.
  function askClear() {
    stage = 'confirm'; busy.clear = true; setNote('');
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(cancelClear, 8000);
    renderCache();
  }
  function cancelClear() {
    clearTimeout(confirmTimer);
    stage = 'idle'; delete busy.clear;
    renderCache();
  }

  function refresh() {
    fetch('api/v1/requests', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var waiting = d.requests.filter(function (r) { return r.status === 'pending'; });
      var rest = d.requests.filter(function (r) { return r.status !== 'pending'; });
      var stored = d.requests.filter(function (r) { return r.status === 'approved'; });
      cache = { requests: d.requests.length, pages: stored.length, bytes: stored.reduce(function (n, r) { return n + (r.size || 0); }, 0) };
      document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.title = waiting.length ? 'Share URLs (' + waiting.length + ' waiting)' : 'Share URLs';
      fill('pending', waiting, d.now, 'Nothing is waiting.');
      fill('done', rest, d.now, 'Nothing yet.');
      renderCache();
    }).catch(function () { document.getElementById('error').textContent = 'The list is unavailable.'; });
  }

  function clearCache() {
    var msg = document.getElementById('error');
    clearTimeout(confirmTimer);
    stage = 'clearing'; busy.clear = true; msg.textContent = ''; setNote('');
    renderCache();
    fetch('api/v1/cache/clear', { method: 'POST', headers: { 'X-Requested-With': 'urlshare-approval' } })
      .then(function (res) { return res.json().then(function (x) { return { ok: res.ok, body: x }; }); })
      .then(function (x) {
        if (x.ok) setNote('Cache cleared: ' + plural(x.body.cleared, 'request', 'requests') + ' removed.');
        else msg.textContent = x.body.error || 'Could not clear the cache.';
      })
      .catch(function () { msg.textContent = 'Could not reach the page.'; })
      .then(function () { stage = 'idle'; delete busy.clear; refresh(); });
  }

  refresh();
  setInterval(function () { if (!document.hidden && !Object.keys(busy).length) refresh(); }, 5000);
  // A Home Screen app suspended in the background does not poll; coming back (also restored from memory) refreshes at once.
  function resume() { if (!document.hidden && !Object.keys(busy).length) refresh(); }
  document.addEventListener('visibilitychange', resume);
  window.addEventListener('pageshow', resume);
})();
</script>
</body>
</html>
