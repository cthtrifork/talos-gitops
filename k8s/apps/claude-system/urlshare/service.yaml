---
apiVersion: v1
kind: Service
metadata:
  name: claude-urlshare
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/icon: 
    omni-kube-service-exposer.sidero.dev/label: "Share URLs"
    omni-kube-service-exposer.sidero.dev/port: "50096"
    omni-kube-service-exposer.sidero.dev/prefix: claudeurlshare
spec:
  type: ClusterIP
  selector:
    app: claude-urlshare
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
---
# urlshare.portableinfo.cloud (README). externalTrafficPolicy Local keeps the client address for the LAN rule.
apiVersion: v1
kind: Service
metadata:
  name: claude-urlshare-lb
  namespace: claude-system
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.245
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: claude-urlshare
  ports:
    - name: api
      port: 80
      targetPort: api
      protocol: TCP
