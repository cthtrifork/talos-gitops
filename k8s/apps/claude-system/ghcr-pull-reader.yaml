# Lets External Secrets copy the read:packages token (Secret ghcr-pull) into the claude-vm namespace for CDI, through the
# ClusterSecretStore claude-vm-ghcr below. The store may only read this one Secret, and only for the claude-vm namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-pull-reader
  namespace: claude-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-pull-reader
  namespace: claude-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - ghcr-pull
    verbs:
      - get
  # the store checks its own permissions when it is created
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-pull-reader
  namespace: claude-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ghcr-pull-reader
subjects:
  - kind: ServiceAccount
    name: ghcr-pull-reader
    namespace: claude-system
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: claude-vm-ghcr
spec:
  conditions:
    - namespaces:
        - claude-vm
  provider:
    kubernetes:
      remoteNamespace: claude-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: claude-system
          key: ca.crt
      auth:
        serviceAccount:
          name: ghcr-pull-reader
          namespace: claude-system
