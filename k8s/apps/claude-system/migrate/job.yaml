# Copies the old volumes to the LVM ones over the network (the old ones are on talos-11a-esj, the new ones are placed by the scheduler where lvm-fast has room). First
# pass while claude-rc keeps running; it can be repeated (rename the Job, rsync only sends what changed). The final pass at the cutover is the init container of the
# Deployment. Retries on network errors; 23 and 24 (a file vanished or could not be read while claude-rc was writing) end the pass.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-data-seed-1
  namespace: claude-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: claude-data-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rsync
          image: mirror.gcr.io/instrumentisto/rsync-ssh:alpine3.23-r3@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a # renovate: datasource=docker depName=docker.io/instrumentisto/rsync-ssh versioning=docker
          command:
            - /bin/sh
            - -c
            - |
              for m in home workspace; do
                while true; do
                  echo "$(date -u +%T) copying $m"
                  rsync -aH --numeric-ids --delete --partial --info=stats1,progress2 "rsync://claude-data-source:8873/$m/" "/dst/$m/"
                  rc=$?
                  case $rc in
                    0|23|24) echo "$m done (rsync exit $rc)"; break ;;
                    *) echo "$m: rsync exit $rc, retrying in 30 seconds"; sleep 30 ;;
                  esac
                done
              done
              echo all done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /dst/home
            - name: workspace
              mountPath: /dst/workspace
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-home-lvm
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-workspace-lvm
