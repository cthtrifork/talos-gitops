# The rsync daemon serves the old claude login: only the claude-rc pod (the final sync of its init container) may reach it, on 8873.
# The namespace is default deny, so each side opens its own direction (the egress side is in ../networkpolicy.yaml).
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-data-source
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-data-source
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: claude-rc
      toPorts:
        - ports:
            - port: "8873"
              protocol: TCP
