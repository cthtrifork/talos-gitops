---
# Holds no data: every request becomes PromQL against Prometheus. No query parameters.
# trivy-operator can run twice during a rollout, so every query takes max or count per image digest first.
# ${PROM_URL:default} is Redpanda Connect's own interpolation, not a Flux variable.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

input:
  http_server:
    address: 0.0.0.0:8080
    path: /
    allowed_verbs:
      - GET
    sync_response:
      status: '${! @status.or("200") }'
      headers:
        Content-Type: '${! @content_type.or("application/json") }'
        Cache-Control: no-store

pipeline:
  processors:
    - switch:
        - check: '@http_server_request_path == "/" || @http_server_request_path == "/index.html"'
          processors:
            - mapping: |
                meta content_type = "text/html; charset=utf-8"
                root = file("/etc/connect/index.html")

        - check: '@http_server_request_path == "/healthz"'
          processors:
            - mapping: |
                meta content_type = "text/plain"
                root = "ok"

        # Findings per severity for each image, and when it was last scanned
        - check: '@http_server_request_path == "/api/v1/images"'
          processors:
            - try:
                - branch:
                    request_map: |
                      meta promql = "max by (namespace, image_repository, image_tag, image_digest, severity) (trivy_image_vulnerabilities)"
                      root = ""
                    processors:
                      - http:
                          url: '${PROM_URL:http://kube-prom-prometheus.kube-prometheus-stack-system.svc:9090}/api/v1/query?query=${! @promql.escape_url_query() }'
                          verb: GET
                          timeout: 10s
                    result_map: 'root.counts = this.data.result'
                # The operator recreates a VulnerabilityReport on every rescan, so its creation time is the scan time (kube-state-metrics custom resource state)
                - branch:
                    request_map: |
                      meta promql = "max by (namespace, image_repository, image_tag, image_digest) ((time() - kube_customresource_vulnerabilityreport_created) * on (namespace, name) group_left (image_repository, image_tag, image_digest) group by (namespace, name, image_repository, image_tag, image_digest) (trivy_image_vulnerabilities))"
                      root = ""
                    processors:
                      - http:
                          url: '${PROM_URL:http://kube-prom-prometheus.kube-prometheus-stack-system.svc:9090}/api/v1/query?query=${! @promql.escape_url_query() }'
                          verb: GET
                          timeout: 10s
                    result_map: 'root.ages = this.data.result'
                # Flat rows: the page pivots them per image
                - mapping: |
                    root.generated = now().ts_format("2006-01-02T15:04:05Z", "UTC")
                    root.counts = this.counts.map_each(x -> {
                      "namespace": x.metric.namespace,
                      "image": x.metric.image_repository + ":" + x.metric.image_tag,
                      "digest": x.metric.image_digest,
                      "severity": x.metric.severity.lowercase(),
                      "count": x.value.index(1).number().round()
                    })
                    root.scans = this.ages.map_each(x -> {
                      "namespace": x.metric.namespace,
                      "digest": x.metric.image_digest,
                      "age_s": x.value.index(1).number().round()
                    })

        # Every critical and high vulnerability: title and score per group, and the distinct images per id and severity
        - check: '@http_server_request_path == "/api/v1/vulnerabilities"'
          processors:
            - try:
                - branch:
                    request_map: |
                      meta promql = "group by (vuln_id, severity, vuln_title, vuln_score) (trivy_vulnerability_id{severity=~\"Critical|High\"})"
                      root = ""
                    processors:
                      - http:
                          url: '${PROM_URL:http://kube-prom-prometheus.kube-prometheus-stack-system.svc:9090}/api/v1/query?query=${! @promql.escape_url_query() }'
                          verb: GET
                          timeout: 10s
                    result_map: 'root.prom = this.data.result'
                # Distinct images per id and severity, counted before the title and score split so no image is lost or counted twice
                - branch:
                    request_map: |
                      meta promql = "count by (vuln_id, severity) (count by (vuln_id, severity, image_digest) (trivy_vulnerability_id{severity=~\"Critical|High\"}))"
                      root = ""
                    processors:
                      - http:
                          url: '${PROM_URL:http://kube-prom-prometheus.kube-prometheus-stack-system.svc:9090}/api/v1/query?query=${! @promql.escape_url_query() }'
                          verb: GET
                          timeout: 10s
                    result_map: 'root.image_counts = this.data.result'
                # One CVE can carry a different title or score per package: the page keeps one row per id and severity
                - mapping: |
                    root.generated = now().ts_format("2006-01-02T15:04:05Z", "UTC")
                    root.vulnerabilities = this.prom.map_each(x -> {
                      "id": x.metric.vuln_id,
                      "severity": x.metric.severity.lowercase(),
                      "score": x.metric.vuln_score.number().catch(0),
                      "title": x.metric.vuln_title.or("")
                    })
                    root.images = this.image_counts.map_each(x -> {
                      "id": x.metric.vuln_id,
                      "severity": x.metric.severity.lowercase(),
                      "count": x.value.index(1).number().round()
                    })

        - processors:
            - mapping: |
                meta status = "404"
                root = {"error": "not found"}

    - catch:
        - mapping: |
            meta status = "502"
            meta content_type = "application/json"
            root = {"error": "prometheus unavailable"}

output:
  sync_response: {}
