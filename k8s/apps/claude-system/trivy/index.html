<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivy vulnerabilities</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23c4623f'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 4l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V7z'/%3E%3Cpath d='M12 9v4M12 16v.01'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1;
    --surface: #ffffff;
    --ink: #141413;
    --ink-2: #4a4843;
    --muted: #6b6963;
    --grid: #e3e2da;
    --axis: #c3c2b7;
    --ring: rgba(11, 11, 11, 0.10);
    --env-rc: #2a78d6;
    --accent: #c4623f;
    --bar-neutral: #b9b7ae;
    /* Severity colours, the same slots as the cockpit's Trivy panel. */
    --sev-critical: #b3261e; --sev-high: #8a5a00; --sev-medium: #c4623f; --sev-low: #77756f; --sev-unknown: #6d28d9;
    --ok: #1a7f4b;
    --warn-bg: #fff4d6; --warn-ink: #5b4300;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Shared with the cockpit: the type scale is small (labels, metadata), medium (body), large (titles), extra large (page title, headline numbers). */
    --fs-sm: 12px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
      --env-rc: #3987e5; --bar-neutral: #4a4945;
      --sev-critical: #ff8a80; --sev-high: #f2d98a; --sev-medium: #e08a66; --sev-low: #8d8b85; --sev-unknown: #b388ff; --ok: #3cc58a;
      --warn-bg: #3a2f10; --warn-ink: #f2d98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
    --env-rc: #3987e5; --bar-neutral: #4a4945;
    --sev-critical: #ff8a80; --sev-high: #f2d98a; --sev-medium: #e08a66; --sev-low: #8d8b85; --sev-unknown: #b388ff; --ok: #3cc58a;
    --warn-bg: #3a2f10; --warn-ink: #f2d98a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink); font: var(--fs-md)/1.45 var(--font);
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 68rem; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: var(--fs-xl); margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: var(--fs-md); margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: var(--fs-sm); }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 2px; color: var(--env-rc); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 2px solid var(--env-rc); outline-offset: 2px; border-radius: 3px; }
  code, .src { font-family: var(--mono); font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; border: 1px solid var(--ring); border-radius: 8px; padding: 2px; }
  .seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 6px; color: var(--ink-2); font-size: var(--fs-md); white-space: nowrap; flex: none; }
  .seg button[aria-pressed="true"] { background: var(--page); color: var(--ink); font-weight: 600; }
  .seg button:focus-visible { outline: 2px solid var(--env-rc); outline-offset: 1px; }
  select, input[type="search"] {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; min-height: 34px; max-width: 100%;
  }
  select:focus-visible, input:focus-visible { outline: 2px solid var(--env-rc); outline-offset: 1px; }

  .panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .cols { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
  @media (min-width: 60rem) { .cols { grid-template-columns: 4fr 5fr; } }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .tile .k { color: var(--ink-2); font-size: var(--fs-sm); }
  .tile .v { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; margin: 2px 0; }
  .tile .s { color: var(--muted); font-size: var(--fs-sm); }
  .tile .src { display: block; margin-top: 6px; font-size: 11px; }
  .tile.sev { border-left: 4px solid var(--c); }
  .tile.sev .v { color: var(--c); }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--ink-2); margin-top: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .row { display: grid; grid-template-columns: 11rem 1fr 4.5rem; gap: 10px; align-items: center; padding: 6px 0; }
  .row .name { font-size: var(--fs-md); overflow-wrap: anywhere; }
  .row .name small { display: block; color: var(--muted); font-size: var(--fs-sm); }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; }
  .track { height: 22px; display: flex; gap: 2px; }
  .track .seg-b { height: 100%; border-radius: 4px; min-width: 3px; }

  .scroll, .seg {
    background-color: var(--surface);
    background-image: linear-gradient(to right, var(--surface) 30%, transparent), linear-gradient(to left, var(--surface) 30%, transparent), linear-gradient(to right, var(--axis), transparent), linear-gradient(to left, var(--axis), transparent);
    background-position: 0 0, 100% 0, 0 0, 100% 0;
    background-size: 32px 100%, 32px 100%, 12px 100%, 12px 100%;
    background-repeat: no-repeat;
    background-attachment: local, local, scroll, scroll;
  }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  th { color: var(--muted); font-weight: 500; font-size: var(--fs-sm); }
  td.l, th.l { text-align: left; }
  td small { display: block; color: var(--muted); font-size: var(--fs-sm); }
  td.t { white-space: normal; min-width: 14rem; max-width: 26rem; text-align: left; }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--env-rc); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; color: var(--c); border: 1px solid var(--c); }
  .pill.ok { --c: var(--ok); }
  .stale { color: var(--sev-high); font-weight: 600; }
  a.ext { color: var(--env-rc); text-decoration: none; }
  a.ext:hover { text-decoration: underline; }
  .chip { all: unset; cursor: pointer; margin-left: 6px; padding: 0 8px; min-width: 2.6rem; text-align: center; box-sizing: border-box; border: 1px solid var(--ring); border-radius: 999px; font-size: 11px; line-height: 18px; color: var(--ink-2); vertical-align: 1px; }
  .chip:hover { background: var(--page); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--env-rc); outline-offset: 1px; }
  @media (pointer: coarse) { .chip { padding: 6px 10px; line-height: 16px; } }
  a.cve { color: var(--env-rc); text-decoration: none; font-family: var(--mono); font-size: var(--fs-sm); }
  a.cve:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px 0; }
  .more { all: unset; cursor: pointer; color: var(--env-rc); margin-top: 10px; display: inline-block; min-height: 32px; }
  .more:focus-visible { outline: 2px solid var(--env-rc); }
  #error { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 12px; font-size: var(--fs-sm); }
  ul.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ul.rows li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
  ul.rows li:first-child { border-top: 0; padding-top: 0; }
  ul.rows li:last-child { padding-bottom: 0; }
  ul.rows .l { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; }
  .num { font-variant-numeric: tabular-nums; }
  .sevbar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; display: flex; margin: 6px 0 4px; }
  .sevbar i { display: block; height: 100%; min-width: 4px; }
  ul.rows li.img { display: block; }
  .img .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
  h3 { font-size: var(--fs-sm); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 4px; }
  h3:first-of-type { margin-top: 0; }
  details.fold > summary { display: block; margin-top: 12px; }
  details.fold > summary::before { content: "▸ "; color: var(--muted); }
  details.fold[open] > summary::before { content: "▾ "; }
  table.grafana th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  table.grafana td.title { max-width: 12rem; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tools input { flex: 1 1 14rem; }

  .fold > summary { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; cursor: pointer; list-style: none; }
  .fold[open] > summary { margin-bottom: 12px; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary h2::before { content: "▸"; display: inline-block; width: 1.2em; color: var(--muted); }
  .fold[open] > summary h2::before { content: "▾"; }

  @media (pointer: coarse) { .seg button { display: inline-flex; align-items: center; min-height: 40px; } }
  @media (max-width: 40rem) {
    table.grafana th:first-child, table.grafana td.title { display: none; }
    table.grafana th, table.grafana td { padding: 6px 5px; }
    .bar { display: contents; }
    .group { position: sticky; top: 0; z-index: 4; background: var(--page); padding: 8px 0; margin: -8px 0; box-shadow: 0 1px 0 var(--grid); }
    .tile .src { display: none; }
    .row { grid-template-columns: 1fr 4rem; }
    .row .track { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<trivy-app></trivy-app>
<!-- Lit comes from jsDelivr as plain ES modules, every package pinned to an exact version. Bump the versions here. -->
<script type="importmap">
{
  "imports": {
    "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/index.js",
    "lit-element/": "https://cdn.jsdelivr.net/npm/lit-element@4.2.2/",
    "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/lit-html.js",
    "lit-html/": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/",
    "@lit/reactive-element": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/reactive-element.js",
    "@lit/reactive-element/": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/"
  }
}
</script>
<script type="module">
import { LitElement, html, nothing } from "lit";

// The operator rescans after scannerReportTTL (12h here); older than that plus slack means scanning has stalled.
const REPORT_TTL_H = 12, STALE_H = 14;
const ageText = (h) => (h < 1 ? "under 1h" : h < 48 ? Math.round(h) + "h" : Math.round(h / 24) + "d") + " ago";

const SEVERITIES = [["critical", "Critical"], ["high", "High"], ["medium", "Medium"], ["low", "Low"], ["unknown", "Unknown"]];
const sevVar = (s) => `var(--sev-${s})`;
const RANK = Object.fromEntries(SEVERITIES.map(([k], i) => [k, i]));
const REFRESH_MS = 60000;
const COCKPIT = "https://claudecockpit-portableinfo.workload.eu-central-1.omni.siderolabs.io/#p-trivy-vulnerabilities";

// ---- Helpers ----

const sum = (a) => a.reduce((x, y) => x + y, 0);
const shortImage = (i) => i.replace(/^(oci|library)\//, "");
const idLink = (id) => (id.startsWith("CVE-") ? "https://avd.aquasec.com/nvd/" + id.toLowerCase() : "https://github.com/advisories/" + id);
const SevPill = (s) => html`<span class="pill" style="--c: ${sevVar(s)}">${s}</span>`;

// ---- Data shaping ----

// One row per image and namespace: findings per severity. Worst first: most critical, then high, medium, low, unknown.
// /api/v1/images: counts from trivy_image_vulnerabilities, scans from kube_customresource_vulnerabilityreport_created
const imageRows = (d) => {
  const age = {};
  for (const x of d.scans) { const k = x.namespace + "|" + x.digest; age[k] = Math.max(age[k] ?? 0, x.age_s / 3600); }
  const rows = {};
  for (const x of d.counts) {
    const k = x.namespace + "|" + x.digest;
    rows[k] ??= { image: x.image, ns: x.namespace, age: age[k] ?? null, c: Object.fromEntries(SEVERITIES.map(([s]) => [s, 0])) };
    if (x.severity in rows[k].c) rows[k].c[x.severity] = Math.max(rows[k].c[x.severity], x.count); // aliases of one digest (:latest and a tag) are the same findings
  }
  return Object.values(rows).sort((a, b) => SEVERITIES.reduce((n, [k]) => n || b.c[k] - a.c[k], 0) || a.image.localeCompare(b.image));
};

// One row per CVE and severity. Worst severity first, then the most images.
// /api/v1/vulnerabilities: title and score rows, and the distinct image count per id and severity; a CVE with several titles or scores becomes one row
const cveRows = (d) => {
  const n = {};
  for (const x of d.images) n[x.id + "|" + x.severity] = x.count;
  const rows = {};
  for (const x of d.vulnerabilities) {
    const k = x.id + "|" + x.severity;
    const r = rows[k] ??= { id: x.id, sev: x.severity, score: 0, title: x.title, images: n[k] ?? 0 };
    r.score = Math.max(r.score, x.score);
    r.title ||= x.title;
  }
  return Object.values(rows).sort((a, b) => RANK[a.sev] - RANK[b.sev] || b.images - a.images || b.score - a.score);
};

// ---- Building blocks ----

const Bar = (c, max) => html`<div class="sevbar" role="img" aria-label=${SEVERITIES.map(([k, n]) => `${c[k]} ${n.toLowerCase()}`).join(", ")}>${SEVERITIES.filter(([k]) => c[k]).map(([k]) => html`<i style="width: ${(c[k] / max) * 100}%; background: ${sevVar(k)}"></i>`)}</div>`;

// Dependency-Track names a project "<namespace>/<repository>" (the version is the tag). Its project list reads ?searchText=, so the link needs no lookup.
// Only some images are tracked there; the search then shows no result.
const DTRACK = "https://dtrack.portableinfo.cloud/projects?searchText=";
const dtrackLink = (r) => DTRACK + encodeURIComponent(r.ns + "/" + r.image.replace(/:[^:/]+$/, "").replace(/^[^/]+\.[^/]+\//, ""));

const ImageList = (rows) => {
  const max = Math.max(...rows.map((r) => sum(Object.values(r.c))));
  return html`<section class="panel">
    <div class="panel-head"><h2>Images</h2><span class="src">trivy_image_vulnerabilities</span></div>
    <ul class="rows">${rows.map((r) => {
      const n = sum(Object.values(r.c));
      return html`<li class="img">
        <span class="top"><strong>${shortImage(r.image)}</strong><span class="num">${r.c.critical ? html`<b style="color: var(--sev-critical)">${r.c.critical} critical</b> · ` : nothing}${r.c.high ? html`<b style="color: var(--sev-high)">${r.c.high} high</b> · ` : nothing}<span class="muted">${n} total</span></span></span>
        ${Bar(r.c, max)}
        <span class="sub"><span class="muted">${r.ns} · </span>${r.age === null ? html`<span class="muted">scan time unknown</span>` : html`<span class=${r.age > STALE_H ? "stale" : "muted"} title=${"Scanned " + ageText(r.age) + "; the operator rescans after " + REPORT_TTL_H + "h"}>scanned ${ageText(r.age)}${r.age > STALE_H ? " · overdue" : ""}</span>`}<span class="muted"> · </span><a class="ext" href=${dtrackLink(r)} rel="noopener noreferrer" target="_blank">Dependency-Track ↗</a></span>
      </li>`;
    })}</ul>
  </section>`;
};

// Like the Grafana "Top vulnerabilities" table: title, linked id, severity as coloured text, count. Headers sort. Every critical and high one is listed; medium and below are left out.
const CVE_COLS = [["title", "Title", "l"], ["id", "Vulnerability", "l"], ["sev", "Severity", "l"], ["images", "Images", ""]];
const CVE_SORT = {
  title: (a, b) => a.title.localeCompare(b.title), id: (a, b) => a.id.localeCompare(b.id),
  sev: (a, b) => RANK[a.sev] - RANK[b.sev] || b.images - a.images, images: (a, b) => a.images - b.images || RANK[a.sev] - RANK[b.sev],
};

// A small chip that copies the id and says "Copied" for a moment. It changes its own label, so the page does not re-render.
const copy = async (ev, text) => {
  const b = ev.currentTarget;
  try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; } catch { b.textContent = "Failed"; }
  setTimeout(() => { b.textContent = "Copy"; }, 1500);
};
const CopyChip = (text) => html`<button class="chip" aria-label=${"Copy " + text} @click=${(ev) => copy(ev, text)}>Copy</button>`;

const CveTable = (ui, set, all) => {
  const rows = all
    .filter((r) => r.sev === "critical" || r.sev === "high")
    .sort((a, b) => (CVE_SORT[ui.sort](a, b)) * (ui.desc ? -1 : 1));
  const head = ([k, name, cls]) => html`<th class=${cls || nothing} aria-sort=${ui.sort === k ? (ui.desc ? "descending" : "ascending") : "none"}><button @click=${() => set(ui.sort === k ? { desc: !ui.desc } : { sort: k, desc: k === "images" })}>${name}${ui.sort === k ? (ui.desc ? " ↓" : " ↑") : ""}</button></th>`;
  return html`<section class="panel">
    <div class="panel-head"><h2>Vulnerabilities</h2><span class="src">trivy_vulnerability_id</span></div>
    <div class="scroll"><table class="grafana">
      <thead><tr>${CVE_COLS.map(head)}</tr></thead>
      <tbody>${rows.length ? rows.map((r) => html`<tr>
        <td class="l title" title=${r.title}>${r.title}</td>
        <td class="l"><a class="cve" href=${idLink(r.id)} rel="noopener noreferrer" target="_blank">${r.id}</a> ${CopyChip(r.id)}</td>
        <td class="l" style="color: ${sevVar(r.sev)}; font-weight: 600">${r.sev[0].toUpperCase() + r.sev.slice(1)}</td>
        <td><strong>${r.images}</strong></td>
      </tr>`) : html`<tr><td colspan="4" class="l muted">No vulnerabilities match.</td></tr>`}</tbody>
    </table></div>
    <div class="sub" style="margin-top:8px">Critical and high only · Images = number of images the vulnerability is found in</div>
  </section>`;
};

async function get(path) {
  const r = await fetch(path, { headers: { accept: "application/json" } });
  if (!r.ok) throw new Error(path + " answered " + r.status);
  return r.json();
}

class TrivyApp extends LitElement {
  static properties = { data: { state: true }, error: { state: true }, fetchedAt: { state: true }, ui: { state: true } };
  constructor() { super(); this.data = null; this.error = null; this.fetchedAt = null; this.ui = { sort: "sev", desc: false }; }
  set = (patch) => { this.ui = { ...this.ui, ...patch }; };
  createRenderRoot() { return this; }
  // A failed load keeps the last data and shows the error.
  connectedCallback() {
    super.connectedCallback();
    const load = async () => {
      try {
        const [images, vulns] = await Promise.all([get("api/v1/images"), get("api/v1/vulnerabilities")]);
        this.data = { images: imageRows(images), cves: cveRows(vulns) };
        this.error = null;
        this.fetchedAt = new Date();
      } catch (e) { this.error = e.message; }
    };
    load();
    this._t = setInterval(load, REFRESH_MS);
  }
  disconnectedCallback() { clearInterval(this._t); super.disconnectedCallback(); }
  render() {
    const { data, error } = this;
    const err = html`<p id="error" role="alert" ?hidden=${!error}>${error ? `Could not load Trivy data: ${error}.${data ? " Showing the last data received." : ""}` : nothing}</p>`;
    const back = html`<a class="back" href=${COCKPIT}>← Cockpit</a><h1>Trivy vulnerabilities</h1>`;
    if (!data) return html`<main>${err}<header>${back}<div class="sub">${error ? "" : "Loading…"}</div></header></main>`;
    const stamp = this.fetchedAt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const c = Object.fromEntries(SEVERITIES.map(([k]) => [k, data.cves.filter((r) => r.sev === k).length]));
    const ages = data.images.map((r) => r.age).filter((a) => a !== null);
    return html`<main>
      ${err}
      <header>
        ${back}
        <div class="sub">${SEVERITIES.filter(([k]) => c[k]).map(([k, n]) => html`<span class="dot" style="background: ${sevVar(k)}"></span>${c[k]} ${n.toLowerCase()} `)}${ages.length ? "· oldest scan " + ageText(Math.max(...ages)) + " " : ""}· from Prometheus · updated ${stamp}</div>
      </header>
      <div class="cols">
        ${ImageList(data.images)}
        ${CveTable(this.ui, this.set, data.cves)}
      </div>
      <p class="sub">Worst first: by severity, then by count. Counts are per image digest. Dependency-Track tracks only some images. Scan age is now minus the report's creation time (<code>kube_customresource_vulnerabilityreport_created</code>); the operator rescans every 12h.</p>
    </main>`;
  }
}
customElements.define("trivy-app", TrivyApp);
</script>
</body>
</html>
