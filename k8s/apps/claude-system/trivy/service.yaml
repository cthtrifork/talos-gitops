---
apiVersion: v1
kind: Service
metadata:
  name: claude-trivy
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/icon: 
    omni-kube-service-exposer.sidero.dev/label: "Trivy vulnerabilities"
    omni-kube-service-exposer.sidero.dev/port: "50099"
    omni-kube-service-exposer.sidero.dev/prefix: claudetrivy
spec:
  type: ClusterIP
  selector:
    app: claude-trivy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
