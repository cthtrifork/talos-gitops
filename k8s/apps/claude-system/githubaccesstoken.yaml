# Short-lived (1h) installation token refreshed every 30m. No repositories/permissions are set, so the token gets everything the App was
# granted: narrow it in the App's settings or with spec.repositories and spec.permissions.
# Mounted as a directory so the kubelet refreshes it in place; the Deployment deliberately avoids Reloader's `auto` mode.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: claude-github-token
  namespace: claude-system
spec:
  appIDRef:
    name: claude-github-app
    key: app-id
  installIDRef:
    name: claude-github-app
    key: installation-id
  auth:
    privateKey:
      secretRef:
        name: claude-github-app
        key: private-key.pem
