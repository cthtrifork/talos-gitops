---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - dependency-track/rbac.yaml
  - clusterrole-elevated.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
  - githubaccesstoken.yaml
  - externalsecret.yaml
  - claude-github-app.enc.yaml
  - ghcr-pull.enc.yaml
  - claude-vm-source/rbac.yaml
  - claude-vm-source/clustersecretstore.yaml
  - homeserver-vm-source/rbac.yaml
  - homeserver-vm-source/clustersecretstore.yaml
  - claude-cloudflare.enc.yaml
  - omni-service-account.enc.yaml
  - prometheusrule.yaml
  - usage/deployment.yaml
  - usage/service.yaml
  - usage/podmonitor.yaml
  - trivy/deployment.yaml
  - trivy/service.yaml
  - trivy/podmonitor.yaml
  - vm-upgrade/deployment.yaml
  - vm-upgrade/externalsecret.yaml
  - vm-upgrade/service.yaml
  - vm-upgrade/podmonitor.yaml
  - urlshare/deployment.yaml
  - urlshare/service.yaml
  - urlshare/podmonitor.yaml
  - elevate/rbac.yaml
  - elevate/configmap.yaml
  - elevate/validatingadmissionpolicy.yaml
  - elevate/validatingadmissionpolicybinding.yaml
  - elevate/deployment.yaml
  - elevate/service.yaml
  - elevate/podmonitor.yaml
  - jobs/rbac.yaml
  - jobs/validatingadmissionpolicy.yaml
  - jobs/validatingadmissionpolicybinding.yaml
  - jobs/deployment.yaml
  - jobs/service.yaml
  - jobs/podmonitor.yaml
  - cockpit/rbac.yaml
  - cockpit/githubaccesstoken.yaml
  - cockpit/externalsecret.yaml
  - cockpit/deployment.yaml
  - cockpit/pdb.yaml
  - cockpit/service.yaml
  - cockpit/service-ingest.yaml
  - cockpit/podmonitor.yaml
configMapGenerator:
  - name: claude-usage-connect-config
    namespace: claude-system
    options:
      annotations:
        # Redpanda Connect interpolations and a web page, not Flux variables: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - usage/redpanda-connect.yaml
      - usage/index.html
  - name: claude-trivy-connect-config
    namespace: claude-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - trivy/redpanda-connect.yaml
      - trivy/index.html
  - name: claude-vm-upgrade-connect-config
    namespace: claude-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - vm-upgrade/redpanda-connect.yaml
      - vm-upgrade/index.html
  - name: claude-urlshare-connect-config
    namespace: claude-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - urlshare/redpanda-connect.yaml
      - urlshare/index.html
  - name: claude-elevate-connect-config
    namespace: claude-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - elevate/redpanda-connect.yaml
      - elevate/index.html
  - name: claude-jobs-connect-config
    namespace: claude-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - jobs/redpanda-connect.yaml
      - jobs/index.html
  - name: claude-cockpit-connect-config
    namespace: claude-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - cockpit/redpanda-connect.yaml
      - cockpit/index.html
  - name: claude-md
    namespace: claude-system
    options:
      annotations:
        # Markdown, not a Flux template: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - claude-md/CLAUDE.md
  - name: claude-usage-poller
    namespace: claude-system
    options:
      annotations:
        # A shell script, not a Flux template: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - usage-poller/poll-usage
  - name: claude-skills
    namespace: claude-system
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - cluster-alerts.md=claude-md/skills/cluster-alerts/SKILL.md
      - cilium-drops.md=claude-md/skills/cilium-drops/SKILL.md
      - cluster-disk-usage.md=claude-md/skills/cluster-disk-usage/SKILL.md
      - polaris-report.md=claude-md/skills/polaris-report/SKILL.md
      - image-inspect.md=claude-md/skills/image-inspect/SKILL.md
      - bandwidth-test.md=claude-md/skills/bandwidth-test/SKILL.md
      - ci-k8s-reference.md=claude-md/skills/ci-k8s-reference/SKILL.md
      - urlshare.md=claude-md/skills/urlshare/SKILL.md
      - dependency-track.md=claude-md/skills/dependency-track/SKILL.md
      - govulncheck.md=claude-md/skills/govulncheck/SKILL.md
      - svg-to-png.md=claude-md/skills/svg-to-png/SKILL.md
