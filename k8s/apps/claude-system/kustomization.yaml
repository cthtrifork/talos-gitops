---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - rbac-elevated.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
  - external-secrets.yaml
  - claude-github-app.enc.yaml
  - ghcr-pull.enc.yaml
  - claude-cloudflare.enc.yaml
  - omni-service-account.enc.yaml
  - usage/usage.yaml
  - vm-upgrade/vm-upgrade.yaml
  - urlshare/urlshare.yaml
  - elevate/rbac.yaml
  - elevate/state.yaml
  - elevate/admission.yaml
  - elevate/deployment.yaml
  - elevate/service.yaml
configMapGenerator:
  - name: claude-usage-connect-config
    namespace: claude-system
    options:
      annotations:
        # Redpanda Connect interpolations and a web page, not Flux variables: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - usage/redpanda-connect.yaml
      - usage/index.html
  - name: claude-vm-upgrade-connect-config
    namespace: claude-system
    options:
      annotations:
        # Redpanda Connect interpolations and a web page, not Flux variables: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - vm-upgrade/redpanda-connect.yaml
      - vm-upgrade/index.html
  - name: claude-urlshare-connect-config
    namespace: claude-system
    options:
      annotations:
        # Redpanda Connect interpolations and a web page, not Flux variables: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - urlshare/redpanda-connect.yaml
      - urlshare/index.html
  - name: claude-elevate-connect-config
    namespace: claude-system
    options:
      annotations:
        # Redpanda Connect interpolations and a web page, not Flux variables: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - elevate/redpanda-connect.yaml
      - elevate/index.html
  - name: claude-md
    namespace: claude-system
    options:
      annotations:
        # Markdown, not a Flux template: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - claude-md/CLAUDE.md
  - name: claude-skills
    namespace: claude-system
    options:
      annotations:
        # Markdown, not a Flux template: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - cluster-alerts.md=claude-md/skills/cluster-alerts/SKILL.md
      - cilium-drops.md=claude-md/skills/cilium-drops/SKILL.md
      - cluster-disk-usage.md=claude-md/skills/cluster-disk-usage/SKILL.md
      - polaris-report.md=claude-md/skills/polaris-report/SKILL.md
      - image-inspect.md=claude-md/skills/image-inspect/SKILL.md
      - bandwidth-test.md=claude-md/skills/bandwidth-test/SKILL.md
      - ci-k8s-reference.md=claude-md/skills/ci-k8s-reference/SKILL.md
      - urlshare.md=claude-md/skills/urlshare/SKILL.md
