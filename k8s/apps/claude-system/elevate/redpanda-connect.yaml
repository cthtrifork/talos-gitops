---
# The elevate page: takes requests and shows the cluster state (read-only token). The sidecar (reconcile.sh) does the work via the shared /spool.
#
# GET  /                  the page
# GET  /api/v1/status     allowed namespaces and max minutes per tier, and the active grants, all read from the API server
# POST /api/v1/grants     {"tier": "<tier>", "minutes": <n>, "namespaces": ["adguard-system", ...]}
# POST /api/v1/revoke     {"all": true} or {"tier": "<tier>", "namespace": "<namespace>"}
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

# keys are file names in /spool: req-<nanoseconds>-<uuid> is a request (names sort by arrival); ui-token is a short-lived token of the
# read-only ServiceAccount claude-elevate-ui, which the sidecar renews
cache_resources:
  - label: spool
    file:
      directory: /spool

input:
  http_server:
    address: 0.0.0.0:8080
    path: /
    allowed_verbs:
      - GET
      - POST
    sync_response:
      status: '${! @status.or("200") }'
      headers:
        Content-Type: '${! @content_type.or("application/json") }'
        Cache-Control: no-store

pipeline:
  processors:
    - switch:
        - check: '@http_server_verb == "GET" && (@http_server_request_path == "/" || @http_server_request_path == "/index.html")'
          processors:
            - mapping: |
                meta content_type = "text/html; charset=utf-8"
                root = file("/etc/connect/index.html")

        - check: '@http_server_request_path == "/healthz"'
          processors:
            - mapping: |
                meta content_type = "text/plain"
                root = "ok"

        - check: '@http_server_verb == "GET" && @http_server_request_path == "/api/v1/status"'
          processors:
            - resource: status
            - catch:
                - mapping: |
                    meta status = "502"
                    root = {"error": "cannot read the cluster state"}

        # a cross-site form cannot set this header (no CORS preflight is ever answered)
        - check: '@http_server_verb == "POST" && metadata("X-Requested-With").or("") != "claude-elevate"'
          processors:
            - mapping: |
                meta status = "403"
                root = {"error": "missing X-Requested-With header"}

        - check: '@http_server_verb == "POST" && @http_server_request_path == "/api/v1/grants"'
          processors:
            - mapping: |
                let b = content().parse_json().catch({})
                let ok = (
                  $b.tier.type() == "string" && $b.tier.re_match("^[a-z]{1,16}$") &&
                  $b.minutes.type() == "number" && $b.minutes >= 1 &&
                  $b.namespaces.type() == "array" && $b.namespaces.length() >= 1 && $b.namespaces.length() <= 10 &&
                  $b.namespaces.all(n -> n.type() == "string" && n.re_match("^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"))
                ).catch(false)
                meta valid = $ok
                meta req_key = "req-" + timestamp_unix_nano().string() + "-" + uuid_v4()
                root = if $ok {
                  {"action": "grant", "tier": $b.tier, "minutes": $b.minutes.floor(), "namespaces": $b.namespaces}
                } else {
                  {"error": "bad request"}
                }
            - switch:
                - check: '@valid'
                  processors:
                    - cache:
                        resource: spool
                        operator: set
                        key: '${! @req_key }'
                        value: '${! content() }'
                    - switch:
                        - check: errored()
                          processors:
                            - mapping: |
                                meta status = "500"
                                root = {"error": "not queued"}
                        - processors:
                            - metric:
                                type: counter
                                name: elevate_requests
                                labels:
                                  action: '${! this.action }'
                                  tier: '${! this.tier.or("none") }'
                            - mapping: 'root = {"queued": true}'
                - processors:
                    - mapping: 'meta status = "400"'

        - check: '@http_server_verb == "POST" && @http_server_request_path == "/api/v1/revoke"'
          processors:
            - mapping: |
                let b = content().parse_json().catch({})
                let all = $b.all.or(false) == true
                let one = (
                  $b.tier.type() == "string" && $b.tier.re_match("^[a-z]{1,16}$") &&
                  $b.namespace.type() == "string" && $b.namespace.re_match("^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$")
                ).catch(false)
                meta valid = $all || $one
                meta req_key = "req-" + timestamp_unix_nano().string() + "-" + uuid_v4()
                root = if $all {
                  {"action": "revokeall"}
                } else if $one {
                  {"action": "revoke", "tier": $b.tier, "namespace": $b.namespace}
                } else {
                  {"error": "bad request"}
                }
            - switch:
                - check: '@valid'
                  processors:
                    - cache:
                        resource: spool
                        operator: set
                        key: '${! @req_key }'
                        value: '${! content() }'
                    - switch:
                        - check: errored()
                          processors:
                            - mapping: |
                                meta status = "500"
                                root = {"error": "not queued"}
                        - processors:
                            - metric:
                                type: counter
                                name: elevate_requests
                                labels:
                                  action: '${! this.action }'
                                  tier: '${! this.tier.or("none") }'
                            - mapping: 'root = {"queued": true}'
                - processors:
                    - mapping: 'meta status = "400"'

        - processors:
            - mapping: |
                meta status = "404"
                root = {"error": "not found"}

output:
  sync_response: {}

# GET /api/v1/status: the state comes from the API server (the limits ConfigMap, the namespaces and the grants' ServiceAccounts), read with
# the token the sidecar leaves in /spool.
processor_resources:
  - label: status
    try:
      - cache:
          resource: spool
          operator: get
          key: ui-token
      - mapping: |
          meta token = content().string().trim()
          root = ""
      - branch:
          request_map: 'root = ""'
          processors:
            - http:
                url: https://kubernetes.default.svc/api/v1/namespaces/claude-system/configmaps/claude-elevate-limits
                verb: GET
                headers:
                  Authorization: 'Bearer ${! @token }'
                tls:
                  root_cas_file: /etc/kube-ca/ca.crt
          result_map: 'meta limits = this.data'
      - branch:
          request_map: 'root = ""'
          processors:
            - http:
                url: https://kubernetes.default.svc/api/v1/namespaces
                verb: GET
                headers:
                  Authorization: 'Bearer ${! @token }'
                tls:
                  root_cas_file: /etc/kube-ca/ca.crt
          result_map: 'meta namespaces = this.items'
      - branch:
          request_map: 'root = ""'
          processors:
            - http:
                url: 'https://kubernetes.default.svc/api/v1/serviceaccounts?labelSelector=app.kubernetes.io/managed-by%3Dclaude-elevate'
                verb: GET
                headers:
                  Authorization: 'Bearer ${! @token }'
                tls:
                  root_cas_file: /etc/kube-ca/ca.crt
          result_map: 'meta serviceaccounts = this.items'
      - mapping: |
          root.max_minutes = @limits.map_each(kv -> kv.value.number())
          root.allowed_namespaces = @limits.map_each(kv -> @namespaces.filter(n -> n.metadata.labels.or({}).get("claude-elevate/" + kv.key) == "true").map_each(n -> n.metadata.name))
          root.grants = @serviceaccounts.map_each(s -> {
            "namespace": s.metadata.namespace,
            "tier": s.metadata.name.trim_prefix("claude-elevate-"),
            "expires_at": s.metadata.annotations.or({}).get("claude-elevate/expires-at")
          })
