---
# Omni exposer (Omni login). The NetworkPolicy lets in nothing else, claude-rc included.
apiVersion: v1
kind: Service
metadata:
  name: claude-elevate
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/label: "Elevate Claude"
    omni-kube-service-exposer.sidero.dev/port: "50094"
    omni-kube-service-exposer.sidero.dev/prefix: claudeelevate
spec:
  type: ClusterIP
  selector:
    app: claude-elevate
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: claude-elevate
  namespace: claude-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: claude-elevate
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
