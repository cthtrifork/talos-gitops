---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# A token for a tier's ServiceAccount may not outlive the tier's limit in claude-elevate-limits (a tier without a key is denied).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: claude-elevator-tokens
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - serviceaccounts/token
  matchConditions:
    - name: from-the-elevator
      expression: request.userInfo.username == "system:serviceaccount:claude-system:claude-elevator"
  validations:
    - expression: >-
        object.spec.expirationSeconds <= int(params.data[request.name.replace("claude-elevate-", "")]) * 60
      message: the token is longer than the tier's limit in the ConfigMap claude-elevate-limits
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# Only the ServiceAccount claude-elevate-<tier> of the same namespace may be bound, and only in a namespace labelled claude-elevate/<tier>.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: claude-elevator-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - rbac.authorization.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - rolebindings
  matchConditions:
    - name: from-the-elevator
      expression: request.userInfo.username == "system:serviceaccount:claude-system:claude-elevator"
  variables:
    - name: tier
      expression: 'object.roleRef.name.replace("claude-", "")'
  validations:
    - expression: >-
        has(object.subjects) && object.subjects.size() == 1 &&
        object.subjects[0].kind == "ServiceAccount" &&
        object.subjects[0].name == "claude-elevate-" + variables.tier &&
        object.subjects[0].namespace == object.metadata.namespace
      message: only the ServiceAccount claude-elevate-<tier> of the same namespace may be bound
    - expression: 'namespaceObject.metadata.?labels["claude-elevate/" + variables.tier].orValue("") == "true"'
      message: the namespace has not opted in to this tier (label claude-elevate/<tier>)
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# The flux tier may only ask Flux to reconcile: only the three reconcile.fluxcd.io annotations (set by `flux reconcile`) may change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: claude-flux-reconcile-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - helm.toolkit.fluxcd.io
        apiVersions:
          - "*"
        operations:
          - UPDATE
        resources:
          - helmreleases
      - apiGroups:
          - kustomize.toolkit.fluxcd.io
        apiVersions:
          - "*"
        operations:
          - UPDATE
        resources:
          - kustomizations
  matchConditions:
    - name: from-the-flux-tier
      expression: request.userInfo.username.startsWith("system:serviceaccount:") && request.userInfo.username.endsWith(":claude-elevate-flux")
  variables:
    - name: before
      expression: oldObject.metadata.?annotations.orValue({})
    - name: after
      expression: object.metadata.?annotations.orValue({})
    - name: allowed
      expression: '["reconcile.fluxcd.io/requestedAt", "reconcile.fluxcd.io/forceAt", "reconcile.fluxcd.io/resetAt"]'
  validations:
    - expression: object.spec == oldObject.spec
      message: the flux tier may not change the spec
    - expression: >-
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
        object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
        object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([])
      message: the flux tier may not change labels, finalizers or owner references
    - expression: >-
        variables.after.all(k, k in variables.allowed || (k in variables.before && variables.before[k] == variables.after[k])) &&
        variables.before.all(k, k in variables.allowed || k in variables.after)
      message: the flux tier may only set the annotations reconcile.fluxcd.io/requestedAt, forceAt and resetAt
