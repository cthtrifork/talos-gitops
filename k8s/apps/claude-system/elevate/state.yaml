---
# The longest token per tier in minutes. The admission policy claude-elevator-tokens enforces it and the page reads it for its time choices,
# so adding a tier is a key here, a role and the elevator's pinned names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-elevate-limits
  namespace: claude-system
data:
  ops: "60"
  debug: "15"
  storage: "15"
---
# What the page may read from the API: the namespaces' labels, the grants' ServiceAccounts and the limits. The sidecar hands the page a
# short-lived token of this account; it has no other use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-elevate-ui
  namespace: claude-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-elevate-ui
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - serviceaccounts
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-elevate-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-elevate-ui
subjects:
  - kind: ServiceAccount
    name: claude-elevate-ui
    namespace: claude-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-elevate-ui
  namespace: claude-system
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - claude-elevate-limits
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-elevate-ui
  namespace: claude-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-elevate-ui
subjects:
  - kind: ServiceAccount
    name: claude-elevate-ui
    namespace: claude-system
