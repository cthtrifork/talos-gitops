---
# Break-glass page (see elevate/redpanda-connect.yaml, elevate/reconcile.sh and the README). It adds a RoleBinding of the claude-ops, claude-debug or
# claude-storage ClusterRole for ServiceAccount claude-system/claude in the namespaces you pick, and removes it when the time is up.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-elevator
  namespace: claude-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
# `bind` is limited to the three break-glass roles by name, so this account cannot hand out anything else, and patch and delete to the three
# binding names it creates. What RBAC cannot say (who is bound, and in which namespaces) the admission policy below does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-elevator
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - create
  # RBAC can pin patch and delete to names, so the elevator can only change or remove its own bindings
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    resourceNames:
      - claude-elevate-ops
      - claude-elevate-debug
      - claude-elevate-storage
    verbs:
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - claude-ops
      - claude-debug
      - claude-storage
    verbs:
      - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-elevator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-elevator
subjects:
  - kind: ServiceAccount
    name: claude-elevator
    namespace: claude-system
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# The second lock, for what RBAC cannot express: whatever the page or the script does, claude-elevator can bind only ServiceAccount
# claude-system/claude, and only in a namespace labelled for that tier (claude-elevate/<tier>: "true" in the namespace's own manifest; the
# sidecar reads the same labels). Without it a bug or a compromise of the sidecar could bind any subject to the break-glass roles in any
# namespace, kube-system included. Which roles, and which bindings it may change or delete, are RBAC rules above.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: claude-elevator-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - rbac.authorization.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - rolebindings
  matchConditions:
    - name: from-the-elevator
      expression: request.userInfo.username == "system:serviceaccount:claude-system:claude-elevator"
  validations:
    - expression: >-
        has(object.subjects) && object.subjects.size() == 1 &&
        object.subjects[0].kind == "ServiceAccount" &&
        object.subjects[0].name == "claude" &&
        object.subjects[0].namespace == "claude-system"
      message: only ServiceAccount claude-system/claude may be bound
    - expression: 'namespaceObject.metadata.?labels["claude-elevate/" + object.roleRef.name.replace("claude-", "")].orValue("") == "true"'
      message: the namespace has not opted in to this tier (label claude-elevate/<tier>)
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: claude-elevator-rolebindings
spec:
  policyName: claude-elevator-rolebindings
  validationActions:
    - Deny
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-elevate
  namespace: claude-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-elevate
  template:
    metadata:
      labels:
        app: claude-elevate
        prometheus-scrape: "true"
    spec:
      serviceAccountName: claude-elevator
      # Only the sidecar gets the token (projected below); the page container has no Kubernetes credentials.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: mirror.gcr.io/redpandadata/connect:4.117.0@sha256:b6df7ca0c506578c8cc8b0cd223c117366bbeac84365f95944d339f0165b551c # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 4195
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spool
              mountPath: /spool
            - name: config
              mountPath: /etc/connect
              readOnly: true
        - name: reconcile
          image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
          command:
            - bash
            - /scripts/reconcile.sh
          env:
            - name: HOME
              value: /tmp
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /spool/.alive) )) -lt 60
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spool
              mountPath: /spool
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spool
          emptyDir: {}
        - name: config
          configMap:
            name: claude-elevate-connect-config
        - name: scripts
          configMap:
            name: claude-elevate-scripts
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
# The page, through the Omni service exposer (Omni login). The NetworkPolicy lets in nothing else, claude-rc included.
apiVersion: v1
kind: Service
metadata:
  name: claude-elevate
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/label: "Elevate Claude"
    omni-kube-service-exposer.sidero.dev/port: "50094"
    omni-kube-service-exposer.sidero.dev/prefix: claudeelevate
spec:
  type: ClusterIP
  selector:
    app: claude-elevate
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: claude-elevate
  namespace: claude-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: claude-elevate
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
