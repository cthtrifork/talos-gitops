---
# Break-glass page: gives Claude a short-lived token for a tier's ClusterRole in chosen namespaces (see the README).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-elevator
  namespace: claude-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
# bind, patch, delete and token are pinned by name; who is bound and where is the admission policy below
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-elevator
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - create
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - claude-elevate-ops
      - claude-elevate-debug
      - claude-elevate-storage
    verbs:
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - claude-elevate-ops
      - claude-elevate-debug
      - claude-elevate-storage
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    resourceNames:
      - claude-elevate-ops
      - claude-elevate-debug
      - claude-elevate-storage
    verbs:
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - claude-ops
      - claude-debug
      - claude-storage
    verbs:
      - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-elevator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-elevator
subjects:
  - kind: ServiceAccount
    name: claude-elevator
    namespace: claude-system
---
# The kubeconfigs of the active grants, one key per <tier>-<namespace>.kubeconfig, mounted by claude-rc at /etc/elevated. Created empty; the
# elevator fills it, so Flux only creates it. Not annotated for Reloader: a restart of claude-rc would end the session.
apiVersion: v1
kind: Secret
metadata:
  name: claude-elevated-kubeconfigs
  namespace: claude-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-elevator
  namespace: claude-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - claude-elevated-kubeconfigs
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-elevator
  namespace: claude-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-elevator
subjects:
  - kind: ServiceAccount
    name: claude-elevator
    namespace: claude-system
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# Only the ServiceAccount claude-elevate-<tier> of the same namespace may be bound, and only in a namespace labelled claude-elevate/<tier>.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: claude-elevator-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - rbac.authorization.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - rolebindings
  matchConditions:
    - name: from-the-elevator
      expression: request.userInfo.username == "system:serviceaccount:claude-system:claude-elevator"
  variables:
    - name: tier
      expression: 'object.roleRef.name.replace("claude-", "")'
  validations:
    - expression: >-
        has(object.subjects) && object.subjects.size() == 1 &&
        object.subjects[0].kind == "ServiceAccount" &&
        object.subjects[0].name == "claude-elevate-" + variables.tier &&
        object.subjects[0].namespace == object.metadata.namespace
      message: only the ServiceAccount claude-elevate-<tier> of the same namespace may be bound
    - expression: 'namespaceObject.metadata.?labels["claude-elevate/" + variables.tier].orValue("") == "true"'
      message: the namespace has not opted in to this tier (label claude-elevate/<tier>)
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: claude-elevator-rolebindings
spec:
  policyName: claude-elevator-rolebindings
  validationActions:
    - Deny
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-elevate
  namespace: claude-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-elevate
  template:
    metadata:
      labels:
        app: claude-elevate
    spec:
      serviceAccountName: claude-elevator
      # only the sidecar mounts a token (projected below)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: mirror.gcr.io/redpandadata/connect:4.117.0@sha256:b6df7ca0c506578c8cc8b0cd223c117366bbeac84365f95944d339f0165b551c # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 4195
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spool
              mountPath: /spool
            - name: config
              mountPath: /etc/connect
              readOnly: true
        - name: reconcile
          image: registry.gitlab.com/gitlab-ci-utils/curl-jq:5.0.3 # renovate: datasource=docker depName=registry.gitlab.com/gitlab-ci-utils/curl-jq versioning=docker
          command:
            - bash
            - /scripts/reconcile.sh
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /spool/.alive) )) -lt 60
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: reconcile-tmp
              mountPath: /tmp
            - name: spool
              mountPath: /spool
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: reconcile-tmp
          emptyDir: {}
        - name: spool
          emptyDir: {}
        - name: config
          configMap:
            name: claude-elevate-connect-config
        - name: scripts
          configMap:
            name: claude-elevate-scripts
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
# Omni exposer (Omni login). The NetworkPolicy lets in nothing else, claude-rc included.
apiVersion: v1
kind: Service
metadata:
  name: claude-elevate
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/label: "Elevate Claude"
    omni-kube-service-exposer.sidero.dev/port: "50094"
    omni-kube-service-exposer.sidero.dev/prefix: claudeelevate
spec:
  type: ClusterIP
  selector:
    app: claude-elevate
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: claude-elevate
  namespace: claude-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: claude-elevate
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
