# Default deny both ways, then an egress whitelist by DNS name. The cloud metadata address 169.254.169.254 stays blocked, as Anthropic requires.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-default-deny
  namespace: claude-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-egress-allowlist
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-rc
  egress:
    # DNS through kube-dns; the dns rule makes Cilium learn the addresses the FQDN rules below match
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Prometheus (read-only queries for disk and resource usage)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Polaris dashboard (service port 80 -> pod 8080)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-system
            k8s:app: polaris
            k8s:component: dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Redpanda Connect hook (GET /metrics; service port 80 -> pod 4195)
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - dependency-track-system
            - key: k8s:app.kubernetes.io/instance
              operator: In
              values:
                - sbom-hook
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
    # Dependency-Track API (query findings, record an analysis with the key of the claude-triage team)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dependency-track-system
            k8s:app.kubernetes.io/name: dependency-track-api-server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # URL sharing: only returns pages the owner approved
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-urlshare
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-usage
        - matchLabels:
            k8s:app: claude-trivy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubernetes API (read-only through the ServiceAccount's RBAC)
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        # Required hosts: https://code.claude.com/docs/en/self-hosted-environments-deploy ("Network requirements")
        # Claude Code / Remote Control
        - matchName: api.anthropic.com
        - matchName: anthropic.com

        # Source hosting and MCP
        - matchName: github.com
        - matchPattern: "*.github.com"
        - matchName: githubassets.com
        - matchName: githubcopilot.com

        # Docs: cluster components
        - matchName: cilium.io
        - matchPattern: "*.cilium.io"
        - matchName: kubevirt.io
        - matchName: docs.siderolabs.com
        - matchName: developers.cloudflare.com
        - matchName: polaris.docs.fairwinds.com
        - matchName: cloudnative-pg.io
        - matchName: garagehq.deuxfleurs.fr
        - matchName: juicefs.com

        # CVE and CWE references (NVD pages and API, Aqua vulnerability database, CWE definitions)
        - matchName: nvd.nist.gov
        - matchName: services.nvd.nist.gov
        - matchName: avd.aquasec.com
        - matchName: cwe.mitre.org

        # Docs: search and hosted sites
        - matchName: "context7.com"
        # GitHub Pages sites (docs, JSON schema catalogs)
        - matchPattern: "*.github.io"
        - matchPattern: "*.githubusercontent.com"

        # JSON schemas for yaml-language-server
        - matchName: schemas.fluxoperator.dev

        # Actions job logs (gh run view --log): the receiver and the results blob storage the logs redirect to
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"

        # Container registries (crane/skopeo); ghcr.io blob redirects are covered by *.githubusercontent.com
        - matchName: ghcr.io
        - matchName: quay.io
        - matchPattern: "*.quay.io"
        # Docker Hub is inspected as mirror.gcr.io/<name>: crane resolves docker.io names to a host that is not allowed
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: gcr.io
        - matchName: mirror.gcr.io
        - matchName: registry.k8s.io
        # registry.k8s.io redirects blobs to Artifact Registry (europe-west4-docker.pkg.dev, region may change)
        - matchPattern: "*.pkg.dev"
        # GitLab registry: token from gitlab.com, blobs redirect to the CDN
        - matchName: registry.gitlab.com
        - matchName: gitlab.com
        - matchName: cdn.registry.gitlab-static.net

        # Go vulnerability database (govulncheck)
        - matchName: vuln.go.dev

        # Bandwidth tests with curl (download __down, upload __up)
        - matchName: speed.cloudflare.com

        # Integrations
        - matchPattern: "*.portableinfo.cloud"

        # Cloudflare API MCP server: the server calls the API itself
        - matchName: mcp.cloudflare.com
        # Omni (Talos API proxy for talosctl, read-only service account)
        - matchName: portableinfo.eu-central-1.omni.siderolabs.io

        # Claude Code itself: plugin installs and metadata, documentation lookups
        - matchName: downloads.claude.ai
        - matchName: storage.googleapis.com
        - matchName: code.claude.com
        - matchName: claude.com
        # Sign-in (OAuth) and Remote Control
        - matchName: claude.ai
        - matchName: platform.claude.com
        - matchPattern: "*.claudeusercontent.com"
        # Only needed when sessions install plugins or run npx MCP servers
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The Omni service exposer arrives as host or remote-node.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-usage
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-usage
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-rc
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-trivy
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-trivy
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-rc
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Update-VMs buttons. The VMs poll 8081 and appear as their launcher pod or, across nodes, as host / remote-node, so ingress
# cannot tell them apart. The listener authenticates them by the X-Upgrade-Token each VM sends from its virtiofs-shared Secret.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-vm-upgrade
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # the cockpit page reads the status (what the VMs run)
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-vm
            k8s:kubevirt.io/vm: claude-vm
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homeserver-vm
            k8s:kubevirt.io/vm: homeserver-vm
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # the same polls after the SNAT to the node address (observed as drops from the nodes' IPs)
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          # lets Cilium learn the addresses behind ghcr.io for the FQDN rule below
          rules:
            dns:
              - matchPattern: "*"
    # the registry: the digest of the latest VM images (token and manifest only, no layers)
    - toFQDNs:
        - matchName: ghcr.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # replies to the VMs' polls (ephemeral client port); Cilium drops them when it loses the connection state
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-vm
            k8s:kubevirt.io/vm: claude-vm
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homeserver-vm
            k8s:kubevirt.io/vm: homeserver-vm
    - toEntities:
        - host
        - remote-node
---
# Elevate Claude. claude-rc has no ingress rule: it receives the rights the page grants, so it must not reach the page.
# The pod does not carry the prometheus-scrape label, whose cluster-wide rule would also open 8080.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-elevate
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-elevate
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The cockpit reads the active grants
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# Run jobs. claude-rc has no ingress rule: the page starts Jobs, so Claude must not reach it.
# The pod does not carry the prometheus-scrape label, whose cluster-wide rule would also open 8080.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-jobs
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-jobs
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The cockpit lists the jobs and their schedules
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# URL sharing. Egress is the real fetch filter: it checks the connected address, so it holds for DNS and redirects. Cluster pods and
# nodes are not CIDR identities, so 10/8, 172.16/12 and 192.168/16 are excepted explicitly too.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-urlshare
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-urlshare
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # the cockpit page lists the requests (read-only GET /api/v1/requests)
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-rc
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromCIDR:
        - 192.168.1.0/24
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-cockpit
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-cockpit
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          # lets Cilium learn the addresses behind the FQDN rule below
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Polaris dashboard; the service's port 80 maps to 8080 on the pod
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-system
            k8s:app: polaris
            k8s:component: dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # What the VMs run: the vm-upgrade pod's page listener
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-vm-upgrade
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Share URLs: GET /api/v1/requests
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-urlshare
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Elevate Claude: active grants (GET /api/v1/status)
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-elevate
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Run jobs: scheduled jobs (GET /api/v1/status)
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-jobs
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # GitHub (search for the open pull requests and issues) and the registry (digest of the latest VM images)
    - toFQDNs:
        - matchName: api.github.com
        - matchName: ghcr.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
