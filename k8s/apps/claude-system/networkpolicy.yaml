# Default deny both ways for everything in the namespace, then an egress whitelist by DNS name.
# Edit the toFQDNs list if the runner needs another host; anything not listed is dropped. The cloud
# metadata address 169.254.169.254 is not allowed, as the Anthropic docs require.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-default-deny
  namespace: claude-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-egress-allowlist
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-rc
  egress:
    # DNS through kube-dns; the dns rule makes Cilium learn the addresses the FQDN rules below match
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Prometheus (read-only queries for disk and resource usage)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Polaris dashboard (read-only fetch of /results.json); the service's port 80 maps to 8080 on the pod
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-system
            k8s:app: polaris
            k8s:component: dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Redpanda Connect hook (a read-only GET of /metrics to check it); the service's port 80 maps to 4195 on the pod
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - security-system
            - key: k8s:app.kubernetes.io/instance
              operator: In
              values:
                - sbom-hook
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
    # URL sharing (asking for a page: GET /?url=...); the pod behind urlshare.portableinfo.cloud, which only lists and returns what the owner approved
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-urlshare
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Usage API (the page and /api/v1)
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-usage
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubernetes API (read-only through the ServiceAccount's RBAC)
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        # The runner's required hosts (https://code.claude.com/docs/en/self-hosted-environments-deploy,
        # "Network requirements"): control plane and inference, then git.
        # Claude Code / Remote Control
        - matchName: api.anthropic.com
        - matchName: anthropic.com

        # Source hosting and MCP
        - matchName: github.com
        - matchPattern: "*.github.com"
        - matchName: githubassets.com
        - matchName: githubcopilot.com

        # Context and documentation
        - matchName: cilium.io
        - matchPattern: "*.cilium.io"
        - matchPattern: "*.githubusercontent.com"
        # GitHub Pages sites (docs, JSON schema catalogs)
        - matchPattern: "*.github.io"
        # Actions job logs (gh run view --log): the receiver and the results blob storage the logs redirect to
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: "context7.com"
        - matchName: developers.cloudflare.com

        # Container registries (read-only inspection of images and layers with crane/skopeo). The blob
        # redirects of ghcr.io go to pkg-containers.githubusercontent.com, covered by *.githubusercontent.com
        - matchName: ghcr.io
        - matchName: quay.io
        - matchPattern: "*.quay.io"
        # index.docker.io is the registry host crane uses for docker.io images; it answers with registry-1.docker.io
        - matchName: index.docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: gcr.io
        - matchName: mirror.gcr.io

        # Bandwidth tests with curl (download __down, upload __up)
        - matchName: speed.cloudflare.com

        # Integrations
        - matchPattern: "*.portableinfo.cloud"

        # Claude Code itself: plugin installs and metadata, documentation lookups
        # Cloudflare API MCP server (read-only token); the pod only talks to this host, the server calls the API itself
        - matchName: mcp.cloudflare.com
        # Omni (Talos API proxy for talosctl, read-only service account)
        - matchName: portableinfo.eu-central-1.omni.siderolabs.io
        - matchName: downloads.claude.ai
        - matchName: storage.googleapis.com
        - matchName: code.claude.com
        - matchName: claude.com
        # Sign-in (OAuth) and Remote Control
        - matchName: claude.ai
        - matchName: platform.claude.com
        - matchPattern: "*.claudeusercontent.com"
        # Only needed when sessions install plugins or run npx MCP servers
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The Omni service exposer runs on the host network: it arrives as host or remote-node.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-usage
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-usage
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-rc
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Update-VMs buttons. The page (8080) is reached by the Omni service exposer, which runs on the host network (host or remote-node).
# The VMs (192.168.1.138 claude-vm, 192.168.1.173 homeserver) poll 8081 through claude-vm-upgrade-lb; their addresses are the only
# authentication, so keep the /32s.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-vm-upgrade
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # the cockpit page reads the status (what the VMs run)
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromCIDR:
        - 192.168.1.138/32 # claude-vm
        - 192.168.1.173/32 # homeserver
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          # lets Cilium learn the addresses behind ghcr.io for the FQDN rule below
          rules:
            dns:
              - matchPattern: "*"
    # the registry: the digest of the latest VM images (token and manifest only, no layers)
    - toFQDNs:
        - matchName: ghcr.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Elevate Claude. The page (8080) is reached by the Omni service exposer, which runs on the host network (host or remote-node).
# claude-rc has no ingress rule here: it receives the rights the page grants, so it cannot reach the page. Prometheus reaches only the metrics port
# (the pod does not carry the prometheus-scrape label, whose cluster-wide rule also opens 8080). The sidecar talks to the API server only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-elevate
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-elevate
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# URL sharing. The page (8080) is reached by the Omni service exposer, which runs on the host network (host or remote-node); the API (8081) by
# claude-rc and the LAN (192.168.1.0/24, through claude-urlshare-lb). It can only record a request: the owner's approval happens on 8080.
# Egress decides which pages can be fetched, and it does so on the address that is really connected to, so it also holds after DNS
# resolution and for redirects (the app cannot check that): TCP 80 and 443 to addresses outside the private, loopback, link-local and other
# special-purpose ranges. Cluster pods and nodes are not CIDR identities and the whole of 10/8, 172.16/12 and 192.168/16 is excepted as well.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-urlshare
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-urlshare
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-rc
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromCIDR:
        - 192.168.1.0/24
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# Cockpit: the Omni exposer (host, remote-node) on 8080, Prometheus on the metrics port only, the Claude VM on 8081.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-cockpit
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-cockpit
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
    # the Claude VM status line, through claude-cockpit-lb; the address is the only check
    - fromCIDR:
        - 192.168.1.138/32 # claude-vm
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          # lets Cilium learn the addresses behind api.github.com for the FQDN rule below
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Polaris dashboard; the service's port 80 maps to 8080 on the pod
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-system
            k8s:app: polaris
            k8s:component: dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # What the VMs run: the vm-upgrade pod's page listener
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-vm-upgrade
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # GitHub (search for the open pull requests and issues) and the registry (digest of the latest VM images)
    - toFQDNs:
        - matchName: api.github.com
        - matchName: ghcr.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
