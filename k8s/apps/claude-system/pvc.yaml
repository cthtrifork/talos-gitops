# claude-home holds the Claude login (~/.claude) for the claude-rc Deployment. Delete it to sign out.
# claude-workspace is /workspace (clones, scratch): it survives restarts, unlike a per-pod volume.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-home
  namespace: claude-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-workspace
  namespace: claude-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
# The LVM volumes that replace the two above (docs/storage-plan.md, "Claude's own volumes"): copied from them by migrate/, then mounted by the Deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-home-lvm
  namespace: claude-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm-fast
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-workspace-lvm
  namespace: claude-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm-fast
  resources:
    requests:
      storage: 50Gi
