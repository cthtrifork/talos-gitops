---
# Ingest for claude-rc's usage poller. Separate from claude-cockpit, whose Omni exposer annotation would publish it.
apiVersion: v1
kind: Service
metadata:
  name: claude-cockpit-ingest
  namespace: claude-system
spec:
  type: ClusterIP
  selector:
    app: claude-cockpit
  ports:
    - name: ingest
      port: 8081
      targetPort: ingest
      protocol: TCP
