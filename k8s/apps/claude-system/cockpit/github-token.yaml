# The cockpit's own GitHub token, so it never shares the runner's. The GithubAccessToken generator (same App as githubaccesstoken.yaml) trades a signed
# JWT for a one-hour installation token, here narrowed to reading pull requests (the search and list calls need nothing else; both repositories are public)
# on the two repositories the page shows. External Secrets writes it into the Secret `claude-cockpit-github-token` every 30 minutes and the pod
# reads the file /etc/github/token on every request, so the kubelet's in-place refresh needs no restart.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: claude-cockpit-github-token
  namespace: claude-system
spec:
  appIDRef:
    name: claude-github-app
    key: app-id
  installIDRef:
    name: claude-github-app
    key: installation-id
  auth:
    privateKey:
      secretRef:
        name: claude-github-app
        key: private-key.pem
  permissions:
    pull_requests: read
    metadata: read
  repositories:
    - talos-gitops
    - homeserver-bootc
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-cockpit-github-token
  namespace: claude-system
spec:
  # GitHub tokens expire after 60 minutes: keep this well below
  refreshInterval: 30m
  target:
    name: claude-cockpit-github-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: claude-cockpit-github-token
