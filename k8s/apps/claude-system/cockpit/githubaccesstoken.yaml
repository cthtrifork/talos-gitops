# Read-only: pull requests and issues on every repository the App is installed on.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: claude-cockpit-github-token
  namespace: claude-system
spec:
  appIDRef:
    name: claude-github-app
    key: app-id
  installIDRef:
    name: claude-github-app
    key: installation-id
  auth:
    privateKey:
      secretRef:
        name: claude-github-app
        key: private-key.pem
  permissions:
    pull_requests: read
    issues: read
    metadata: read
