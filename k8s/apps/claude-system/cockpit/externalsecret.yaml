# Writes the cockpit's one-hour GitHub token (githubaccesstoken.yaml) into the Secret `claude-cockpit-github-token` every 30 minutes.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-cockpit-github-token
  namespace: claude-system
spec:
  # GitHub tokens expire after 60 minutes: keep this well below
  refreshInterval: 30m
  target:
    name: claude-cockpit-github-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: claude-cockpit-github-token
