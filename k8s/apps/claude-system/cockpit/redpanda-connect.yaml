---
# Cockpit page and read-only status API; architecture in the README.
# The ingest listener (:8081) has no authentication: the NetworkPolicy admits claude-rc only.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

cache_resources:
  - label: serviceaccount
    file:
      directory: /var/run/secrets/kubernetes.io/serviceaccount
  - label: githubtoken
    file:
      directory: /etc/github

  - label: registryauth
    file:
      directory: /etc/registry-auth

  - label: state
    memory:
      default_ttl: 24h
      compaction_interval: 5m

input:
  broker:
    inputs:
      - label: ui
        http_server:
          address: 0.0.0.0:8080
          path: /
          timeout: 30s
          allowed_verbs:
            - GET
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "ui"'

      - label: ingest
        http_server:
          address: 0.0.0.0:8081
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "ingest"'

pipeline:
  processors:
    - switch:
        - check: '@listener == "ingest"'
          processors:
            - resource: ingest_api

        - check: '@http_server_request_path == "/" || @http_server_request_path == "/index.html"'
          processors:
            - mapping: |
                meta content_type = "text/html; charset=utf-8"
                root = file("/etc/connect/index.html")

        - check: '@http_server_request_path == "/healthz"'
          processors:
            - mapping: |
                meta content_type = "text/plain"
                root = "ok"

        - check: '@http_server_request_path == "/api/v1/status"'
          processors:
            - resource: status

        - processors:
            - mapping: |
                meta status = "404"
                root = {"error": "not found"}

output:
  sync_response: {}

processor_resources:
  - label: ingest_api
    switch:
      - check: '@http_server_request_path == "/healthz"'
        processors:
          - mapping: |
              meta content_type = "text/plain"
              root = "ok"

      # Plan limits, posted by the usage-poller container of claude-rc.
      - check: '@http_server_verb == "POST" && @http_server_request_path == "/api/v1/usage"'
        processors:
          - mapping: |
              map pct {
                let n = this.number().catch(-1)
                root = if $n < 0 { null } else if $n > 100 { 100 } else { $n.round() }
              }
              map secs {
                let n = this.number().catch(0)
                root = if $n > 0 { $n.round() } else { null }
              }
              let b = content().parse_json().catch({})
              meta usage = {
                "five_hour": {"used_pct": $b.rate_limits.five_hour.used_percentage.apply("pct"), "resets_at": $b.rate_limits.five_hour.resets_at.apply("secs")},
                "seven_day": {"used_pct": $b.rate_limits.seven_day.used_percentage.apply("pct"), "resets_at": $b.rate_limits.seven_day.resets_at.apply("secs")},
                "received_at": now().ts_unix()
              }
          - branch:
              request_map: 'root = @usage'
              processors:
                - cache:
                    resource: state
                    operator: set
                    key: usage
                    value: '${! content() }'
          - mapping: 'root = {"ok": true}'

      - processors:
          - mapping: |
              meta status = "404"
              root = {"error": "not found"}

  - label: login
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: serviceaccount
            operator: get
            key: token
      result_map: 'meta token = content().string().trim()'

  - label: kube_get
    http:
      url: 'https://kubernetes.default.svc${! @path }'
      verb: GET
      headers:
        Authorization: 'Bearer ${! @token }'
      timeout: 10s
      tls:
        enabled: true
        root_cas_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

  - label: github_login
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: githubtoken
            operator: get
            key: token
      result_map: 'meta gh_token = content().string().trim()'

  - label: github_get
    http:
      url: 'https://api.github.com${! @path }'
      verb: GET
      headers:
        Authorization: 'Bearer ${! @gh_token }'
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
        User-Agent: claude-cockpit
      timeout: 10s

  # The pull token uses the read:packages credential of ghcr-pull because homeserver-bootc is private.
  - label: image_digest
    processors:
      - branch:
          request_map: 'root = ""'
          processors:
            - cache:
                resource: registryauth
                operator: get
                key: config.json
            - mapping: 'root = content().parse_json().auths."ghcr.io".auth'
          result_map: 'meta registry_auth = content().string()'
      - branch:
          request_map: 'root = ""'
          processors:
            - http:
                url: 'https://ghcr.io/token?service=ghcr.io&scope=repository:cthtrifork/homeserver-bootc/${! @image }:pull'
                verb: GET
                headers:
                  Authorization: 'Basic ${! @registry_auth }'
                timeout: 10s
          result_map: 'meta registry_token = this.token'
      - http:
          url: 'https://ghcr.io/v2/cthtrifork/homeserver-bootc/${! @image }/manifests/latest'
          verb: GET
          headers:
            Authorization: 'Bearer ${! @registry_token }'
            Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json
          timeout: 10s
      - mapping: 'root = {"digest": content().hash("sha256").encode("hex").slice(0, 12)}'

  - label: prom_get
    http:
      url: '${PROM_URL:http://kube-prom-prometheus.kube-prometheus-stack-system.svc:9090}${! @path }'
      verb: GET
      timeout: 10s

  # Same states as the Flux Operator web UI; DependencyNotReady counts as progressing, not failed.
  - label: flux_summary
    mapping: |
      map state {
        let c = this.status.conditions.or([]).filter(c -> c.type == "Ready").index(0).catch({})
        let s = $c.status.or("")
        let r = $c.reason.or("")
        root.message = $c.message.or("").slice(0, 160)
        root.state = if this.spec.suspend.or(false) || this.metadata.annotations."fluxcd.io/reconcile".or("") == "disabled" { "suspended" }
          else if $s == "True" { "ready" }
          else if $s == "False" { if $r == "DependencyNotReady" { "progressing" } else { "failed" } }
          else if $s == "Unknown" { if $r == "" || $r == "Progressing" || $r == "Reconciling" { "progressing" } else { "unknown" } }
          else { "unknown" }
      }
      let items = this.items.or([]).map_each(i -> i.apply("state").merge({"name": i.metadata.name, "namespace": i.metadata.namespace}))
      root.total = $items.length()
      root.ready = $items.filter(i -> i.state == "ready").length()
      root.progressing = $items.filter(i -> i.state == "progressing").length()
      root.suspended = $items.filter(i -> i.state == "suspended").length()
      root.failed = $items.filter(i -> i.state == "failed").length()
      root.unknown = $items.filter(i -> i.state == "unknown").length()
      root.problems = $items.filter(i -> i.state == "failed" || i.state == "unknown" || i.state == "progressing").sort_by(i -> (if i.state == "failed" { "0" } else if i.state == "unknown" { "1" } else { "2" }) + i.namespace + i.name).slice(0, 8).map_each(i -> {"namespace": i.namespace, "name": i.name, "state": i.state, "message": i.message})

  # a failed branch is left out and named in meta.workflow.failed
  - label: status
    processors:
      - mapping: |
          meta drops_window = if @drops == "15m" { "15m" } else { "1h" }
          meta hardware_window = if ["24h", "7d", "30d"].contains(@hardware) { @hardware } else { "24h" }
          root = {"generated_at": now().ts_unix(), "drops_window": @drops_window, "hardware_window": @hardware_window}
      - workflow:
          branches:
            drops_total:
              request_map: |
                meta path = "/api/v1/query?query=" + ("sum(increase(hubble_drop_total{reason=\"POLICY_DENIED\"}[" + @drops_window + "]))").escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: 'root.drops_total = this.data.result.index(0).value.index(1).number().round().catch(0)'

            drops_series:
              request_map: |
                let end = now().ts_unix()
                let short = @drops_window == "15m"
                let step = if $short { 60 } else { 300 }
                meta path = "/api/v1/query_range?query=" + ("sum(increase(hubble_drop_total{reason=\"POLICY_DENIED\"}[" + $step.string() + "s]))").escape_url_query() + "&start=" + ($end - (if $short { 900 } else { 3600 })).string() + "&end=" + $end.string() + "&step=" + $step.string()
                root = ""
              processors:
                - resource: prom_get
              result_map: 'root.drops_series = this.data.result.index(0).values.map_each(v -> v.index(1).number().round()).catch([])'

            drops_top:
              request_map: |
                meta path = "/api/v1/query?query=" + ("topk(3, (sum by (source_workload, destination, destination_namespace, destination_workload) (increase(hubble_drop_total{reason=\"POLICY_DENIED\",destination!=\"\"}[" + @drops_window + "])) or sum by (source_workload, destination_ip, destination_namespace, destination_workload) (increase(hubble_drop_total{reason=\"POLICY_DENIED\",destination=\"\"}[" + @drops_window + "]))) > 0)").escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.drops_top = this.data.result.map_each(r -> {
                  "source": r.metric.source_workload.or("unknown"),
                  "destination": if r.metric.destination_workload.or("") != "" { r.metric.destination_namespace.or("-") + "/" + r.metric.destination_workload } else { r.metric.destination.or(r.metric.destination_ip.or("unknown")) },
                  "count": r.value.index(1).number().round()
                })

            alerts:
              request_map: |
                meta path = "/api/v1/alerts"
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.alerts = this.data.alerts.filter(a -> a.state == "firing").map_each(a -> {
                  "name": a.labels.alertname.or("unknown"),
                  "severity": a.labels.severity.or("none"),
                  "summary": a.annotations.summary.or("").slice(0, 160),
                  "since": a.activeAt.or("")
                }).sort_by(a -> a.name)

            # kubelet_volume_stats_* exists only for mounted filesystem volumes
            pvcs:
              request_map: |
                meta path = "/api/v1/query?query=" + "topk(5, 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.pvcs = this.data.result.map_each(r -> {
                  "name": r.metric.namespace.or("-") + "/" + r.metric.persistentvolumeclaim.or("unknown"),
                  "used_pct": r.value.index(1).number().round()
                })

            pvc_sizes:
              request_map: |
                meta path = "/api/v1/query?query=" + "kubelet_volume_stats_capacity_bytes and on (namespace, persistentvolumeclaim) topk(5, 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.pvc_sizes = this.data.result.map_each(r -> {
                  "name": r.metric.namespace.or("-") + "/" + r.metric.persistentvolumeclaim.or("unknown"),
                  "bytes": r.value.index(1).number().round()
                })

            pvc_count:
              request_map: |
                meta path = "/api/v1/query?query=" + "count(kubelet_volume_stats_capacity_bytes)".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: 'root.pvc_count = this.data.result.index(0).value.index(1).number().round().catch(0)'

            pvc_total:
              request_map: |
                meta path = "/api/v1/query?query=" + "count(kube_persistentvolumeclaim_info)".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: 'root.pvc_total = this.data.result.index(0).value.index(1).number().round().catch(0)'

            # node-exporter's instance is the node IP, so it is joined to kube_node_info for the name
            # Extrema are calculated per sensor before grouping. Coverage uses the configured 1m scrape interval.
            hardware_temperatures:
              request_map: |
                let window = @hardware_window
                let samples = if $window == "30d" { 43200 } else if $window == "7d" { 10080 } else { 1440 }
                let sensors = "node_hwmon_temp_celsius"
                let range = "[" + $window + "]"
                let drivers = "node_hwmon_chip_names{chip_name=~\"coretemp|nvme|spd5118\"}"
                let current_chips = "max by (instance, chip, chip_name) (" + $drivers + ")"
                let historical_chips = "max by (instance, chip, chip_name) (present_over_time(" + $drivers + $range + "))"
                let classify = " * on (instance, chip) group_left (chip_name) "
                let nodes = "max by (instance, node) (label_replace(kube_node_info{internal_ip!=\"\"}, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\"))"
                let node_join = " * on (instance) group_left (node) " + $nodes
                let stats = [
                  {"name": "current", "aggregate": "max", "expr": $sensors + $classify + $current_chips},
                  {"name": "min", "aggregate": "min", "expr": "min_over_time(" + $sensors + $range + ")" + $classify + $historical_chips},
                  {"name": "max", "aggregate": "max", "expr": "max_over_time(" + $sensors + $range + ")" + $classify + $historical_chips},
                  {"name": "coverage", "aggregate": "min", "expr": "(count_over_time(" + $sensors + $range + ")" + $classify + $historical_chips + ") / " + $samples.string()}
                ].map_each(s -> "label_replace(" + s.aggregate + " by (node, chip_name) ((" + s.expr + ")" + $node_join + "), \"stat\", \"" + s.name + "\", \"node\", \".*\")")
                meta path = "/api/v1/query?query=" + ("group by (node) (kube_node_info) or " + $stats.join(" or ")).escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                let rows = this.data.result
                root.hardware_temperatures = $rows.filter(r -> !r.metric.exists("stat")).map_each(n -> {
                  "node": n.metric.node,
                  "sensors": $rows.filter(r -> r.metric.node == n.metric.node && r.metric.exists("stat")).map_each(r -> {
                    "component": r.metric.chip_name,
                    "stat": r.metric.stat,
                    "value": r.value.index(1).number().catch(null)
                  })
                }).sort_by(n -> n.node)

            compute:
              request_map: |
                let nodes = "group by (instance, node) (label_replace(kube_node_info{internal_ip!=\"\"}, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\"))"
                let node_join = " * on (instance) group_left (node) " + $nodes
                let cpu = "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))"
                let memory = "100 * (1 - node_memory_MemAvailable_bytes / (node_memory_MemTotal_bytes > 0))"
                let stats = [{"name": "cpu", "expr": $cpu}, {"name": "memory", "expr": $memory}].map_each(s -> "label_replace(clamp(max by (node) ((" + s.expr + ")" + $node_join + "), 0, 100), \"resource\", \"" + s.name + "\", \"node\", \".*\")")
                meta path = "/api/v1/query?query=" + ("group by (node) (kube_node_info) or " + $stats.join(" or ")).escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                let rows = this.data.result
                root.compute = $rows.filter(r -> !r.metric.exists("resource")).map_each(n -> {
                  "node": n.metric.node,
                  "cpu": $rows.filter(r -> r.metric.node == n.metric.node && r.metric.resource.or("") == "cpu").index(0).value.index(1).number().catch(null),
                  "memory": $rows.filter(r -> r.metric.node == n.metric.node && r.metric.resource.or("") == "memory").index(0).value.index(1).number().catch(null)
                }).sort_by(n -> n.node)

            temperature_trend:
              request_map: |
                let end = this.generated_at
                let window = @hardware_window
                let duration = if $window == "30d" { 2592000 } else if $window == "7d" { 604800 } else { 86400 }
                let step = if $window == "30d" { 28800 } else if $window == "7d" { 7200 } else { 900 }
                let query = """
                  max by (chip_name) (
                    node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name)
                    max by (instance, chip, chip_name) (node_hwmon_chip_names{chip_name=~"coretemp|nvme|spd5118"})
                  )
                """
                meta path = "/api/v1/query_range?query=" + $query.escape_url_query() + "&start=" + ($end - $duration).string() + "&end=" + $end.string() + "&step=" + $step.string()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.temperature_trend = this.data.result.map_each(r -> {
                  "key": r.metric.chip_name,
                  "points": r.values.map_each(v -> [v.index(0), v.index(1).number().catch(null)])
                })

            compute_trend:
              request_map: |
                let end = this.generated_at
                let query = """
                  label_replace(clamp(max(100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))), 0, 100), "resource", "cpu", "instance", ".*")
                  or
                  label_replace(clamp(max(100 * (1 - node_memory_MemAvailable_bytes / (node_memory_MemTotal_bytes > 0))), 0, 100), "resource", "memory", "instance", ".*")
                """
                meta path = "/api/v1/query_range?query=" + $query.escape_url_query() + "&start=" + ($end - 3600).string() + "&end=" + $end.string() + "&step=60"
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.compute_trend = this.data.result.map_each(r -> {
                  "key": r.metric.resource,
                  "points": r.values.map_each(v -> [v.index(0), v.index(1).number().catch(null)])
                })

            var_avail:
              request_map: |
                meta path = "/api/v1/query?query=" + "node_filesystem_avail_bytes{mountpoint=\"/var\"} * on (instance) group_left (node) label_replace(kube_node_info, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\")".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.var_avail = this.data.result.map_each(r -> {"node": r.metric.node.or("unknown"), "bytes": r.value.index(1).number().round()})

            var_size:
              request_map: |
                meta path = "/api/v1/query?query=" + "node_filesystem_size_bytes{mountpoint=\"/var\"} * on (instance) group_left (node) label_replace(kube_node_info, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\")".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.var_size = this.data.result.map_each(r -> {"node": r.metric.node.or("unknown"), "bytes": r.value.index(1).number().round()})

            vg_free:
              request_map: |
                meta path = "/api/v1/query?query=" + "lvm_vg_free_size_bytes * on (pod) group_left (node) kube_pod_info{namespace=\"openebs-system\"}".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.vg_free = this.data.result.map_each(r -> {"node": r.metric.node.or("unknown"), "name": r.metric.name.or(""), "bytes": r.value.index(1).number().round()})

            vg_total:
              request_map: |
                meta path = "/api/v1/query?query=" + "lvm_vg_total_size_bytes * on (pod) group_left (node) kube_pod_info{namespace=\"openebs-system\"}".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.vg_total = this.data.result.map_each(r -> {"node": r.metric.node.or("unknown"), "name": r.metric.name.or(""), "bytes": r.value.index(1).number().round()})

            polaris:
              request_map: 'root = ""'
              processors:
                - http:
                    url: '${POLARIS_URL:http://polaris-dashboard.policy-system.svc.cluster.local}/results.json'
                    verb: GET
                    timeout: 15s
                - mapping: |
                    let failing = this.Results.map_each(r -> [
                      r.Results.or({}).key_values(),
                      r.PodResult.Results.or({}).key_values(),
                      r.PodResult.ContainerResults.or([]).map_each(c -> c.Results.or({}).key_values()).flatten()
                    ].flatten().filter(x -> x.value.Success == false).map_each(x -> {
                      "workload": r.Namespace.or("cluster") + "/" + r.Name,
                      "check": x.key,
                      "severity": x.value.Severity,
                      "message": x.value.Message
                    })).flatten()
                    root.score = this.Score
                    root.audit_time = this.AuditTime
                    root.danger = $failing.filter(x -> x.severity == "danger").length()
                    root.warning = $failing.filter(x -> x.severity == "warning").length()
                    root.top = $failing.filter(x -> x.severity == "danger" || x.severity == "warning").sort_by(x -> (if x.severity == "danger" { "0" } else { "1" }) + x.workload + x.check).slice(0, 5)
              result_map: 'root.polaris = this'

            # trivy-operator exposes one series per container, so images shared by several containers (and pods) are counted once by digest
            trivy_severity:
              request_map: |
                meta path = "/api/v1/query?query=" + "sum by (severity) (max by (image_digest, severity) (trivy_image_vulnerabilities))".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.trivy_severity = this.data.result.map_each(r -> {"severity": r.metric.severity.lowercase(), "count": r.value.index(1).number().round()})

            trivy_images:
              request_map: |
                meta path = "/api/v1/query?query=" + "count(count by (image_digest) (trivy_image_vulnerabilities))".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: 'root.trivy_images = this.data.result.index(0).value.index(1).number().round().catch(0)'

            trivy_worst:
              request_map: |
                meta path = "/api/v1/query?query=" + "topk(5, sum by (image_registry, image_repository, image_tag) (max by (image_registry, image_repository, image_tag, image_digest) (trivy_image_vulnerabilities{severity=~\"Critical|High\"})))".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.trivy_worst = this.data.result.map_each(r -> {
                  "image": r.metric.image_repository.or("unknown") + ":" + r.metric.image_tag.or(""),
                  "count": r.value.index(1).number().round()
                })

            # one row per CVE and image (the package labels are dropped), worst score first
            trivy_critical:
              request_map: |
                meta path = "/api/v1/query?query=" + "count by (vuln_id, image_repository, image_tag, vuln_score, fixed_version, vuln_title) (trivy_vulnerability_id{severity=\"Critical\"})".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                let found = this.data.result.map_each(r -> {
                  "id": r.metric.vuln_id.or("unknown"),
                  "image": r.metric.image_repository.or("unknown") + ":" + r.metric.image_tag.or(""),
                  "score": r.metric.vuln_score.number().catch(0),
                  "fixed": r.metric.fixed_version.or(""),
                  "title": r.metric.vuln_title.or("").slice(0, 120)
                })
                root.trivy_critical = {"total": $found.length(), "items": $found.sort_by(f -> 0 - f.score).slice(0, 5)}

            flux_ks:
              request_map: |
                meta path = "/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations"
                root = ""
              processors:
                - resource: login
                - resource: kube_get
                - resource: flux_summary
              result_map: 'root.flux_ks = this'

            flux_hr:
              request_map: |
                meta path = "/apis/helm.toolkit.fluxcd.io/v2/helmreleases"
                root = ""
              processors:
                - resource: login
                - resource: kube_get
                - resource: flux_summary
              result_map: 'root.flux_hr = this'

            github:
              request_map: |
                let q = "is:open archived:false -draft:true user:cthtrifork"
                meta path = "/search/issues?q=" + $q.escape_url_query() + "&per_page=100&sort=updated&order=desc"
                root = ""
              processors:
                - resource: github_login
                - resource: github_get
                - mapping: |
                    let items = this.items.or([]).map_each(i -> {
                      "number": i.number,
                      "title": i.title.or("").slice(0, 120),
                      "author": i.user.login.or("unknown"),
                      "url": i.html_url.or(""),
                      "repo": i.repository_url.or("unknown").split("/").index(-1),
                      "updated": i.updated_at.or(""),
                      "pr": i.pull_request != null,
                      "renovate": i.user.login.or("") == "${RENOVATE_APP}[bot]"
                    })
                    let other = $items.filter(i -> i.pr && !i.renovate)
                    let renovate = $items.filter(i -> i.pr && i.renovate)
                    let issues = $items.filter(i -> !i.pr && i.title != "Dependency Dashboard")
                    root.truncated = this.total_count.or(0) > 100
                    root.renovate_app = "${RENOVATE_APP}"
                    root.other = {"count": $other.length(), "items": $other.slice(0, 5)}
                    root.renovate = {"count": $renovate.length(), "items": $renovate.slice(0, 5)}
                    root.issues = {"count": $issues.length(), "items": $issues.slice(0, 5)}
              result_map: 'root.github = this'

            vm_upgrade:
              request_map: 'root = ""'
              processors:
                - http:
                    url: '${VM_UPGRADE_URL:http://claude-vm-upgrade.claude-system.svc}/api/v1/status'
                    verb: GET
                    timeout: 10s
              result_map: 'root.vm_upgrade = this'

            urlshare:
              request_map: 'root = ""'
              processors:
                - http:
                    url: '${URLSHARE_URL:http://claude-urlshare.claude-system.svc}/api/v1/requests'
                    verb: GET
                    timeout: 10s
                - mapping: |
                    let reqs = this.requests.or([]).map_each(r -> {
                      "id": r.id,
                      "url": r.url.or("").slice(0, 200),
                      "status": r.status.or("unknown"),
                      "requested_at": r.requested_at.or(0),
                      "error": r.error.or("").slice(0, 120)
                    })
                    root.total = $reqs.length()
                    root.pending = $reqs.filter(r -> r.status == "pending").length()
                    root.approved = $reqs.filter(r -> r.status == "approved").length()
                    root.rejected = $reqs.filter(r -> r.status == "rejected").length()
                    root.failed = $reqs.filter(r -> r.status == "failed").length()
                    root.items = $reqs.sort_by(r -> (if r.status == "pending" { "0" } else { "1" }) + (9999999999 - r.requested_at.number()).string()).slice(0, 3)
              result_map: 'root.urlshare = this'

            # tier, namespace and expiry only: the status also carries the csrf value, which must not be copied
            elevate:
              request_map: 'root = ""'
              processors:
                - http:
                    url: '${ELEVATE_URL:http://claude-elevate.claude-system.svc}/api/v1/status'
                    verb: GET
                    timeout: 10s
                - mapping: |
                    root.grants = this.grants.or([]).map_each(g -> {
                      "tier": g.tier.or("").slice(0, 20),
                      "namespace": g.namespace.or("").slice(0, 63),
                      "expires_at": g.expires_at.or("")
                    })
              result_map: 'root.elevate = this'

            vm_image_claude_vm:
              request_map: |
                meta image = "claude-vm-bootc"
                root = ""
              processors:
                - resource: image_digest
              result_map: 'root.vm_images."claude-vm" = this'

            vm_image_homeserver:
              request_map: |
                meta image = "homeserver-bootc"
                root = ""
              processors:
                - resource: image_digest
              result_map: 'root.vm_images.homeserver = this'

            usage:
              request_map: 'root = ""'
              processors:
                - cache:
                    resource: state
                    operator: get
                    key: usage
                - catch:
                    - mapping: 'root = {}'
              result_map: 'root.usage = this'

            renovate:
              request_map: |
                meta path = "/apis/renovate-operator.mogenius.com/v1alpha1/renovateprojects"
                root = ""
              processors:
                - resource: login
                - resource: kube_get
                - mapping: |
                    root.projects = this.items.or([]).map_each(i -> {
                      "project": i.spec.project.or("unknown").split("/").index(-1),
                      "status": i.status.status.or("unknown"),
                      "result": i.status.renovateResultStatus.or(""),
                      "last_transition": i.status.lastTransition.or(""),
                      "duration": i.status.duration.or(""),
                      "needs_approval": i.status.prActivity.needsApproval.or(0),
                      "automerged": i.status.prActivity.automerged.or(0),
                      "created": i.status.prActivity.created.or(0),
                      "updated": i.status.prActivity.updated.or(0),
                      "unchanged": i.status.prActivity.unchanged.or(0)
                    }).sort_by(p -> p.project)
              result_map: 'root.renovate = this'

            renovate_jobs:
              request_map: |
                meta path = "/apis/renovate-operator.mogenius.com/v1alpha1/renovatejobs"
                root = ""
              processors:
                - resource: login
                - resource: kube_get
                - mapping: |
                    root.jobs = this.items.or([]).map_each(i -> {
                      "schedule": i.spec.schedule.or(""),
                      "suspend": i.spec.suspend.or(false)
                    })
              result_map: 'root.renovate_jobs = this.jobs'
      - catch:
          - log:
              level: WARN
              message: a status source failed
              fields_mapping: 'root.error = error()'
          - mapping: 'root = this'
