---
# Cockpit page and read-only status API; architecture in the README. Not a Flux template (configMapGenerator disables postBuild envsubst).
# The ingest listener (:8081) has no authentication: the NetworkPolicy lets in the Claude VM only, and a spoofed sender could only change what the page shows.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

cache_resources:
  - label: serviceaccount
    file:
      directory: /var/run/secrets/kubernetes.io/serviceaccount
  - label: githubtoken
    file:
      directory: /etc/github

  - label: state
    memory:
      default_ttl: 24h
      compaction_interval: 5m

input:
  broker:
    inputs:
      - label: ui
        http_server:
          address: 0.0.0.0:8080
          path: /
          allowed_verbs:
            - GET
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "ui"'

      - label: ingest
        http_server:
          address: 0.0.0.0:8081
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "ingest"'

pipeline:
  processors:
    - switch:
        - check: '@listener == "ingest"'
          processors:
            - resource: ingest_api

        - check: '@http_server_request_path == "/" || @http_server_request_path == "/index.html"'
          processors:
            - mapping: |
                meta content_type = "text/html; charset=utf-8"
                root = file("/etc/connect/index.html")

        - check: '@http_server_request_path == "/healthz"'
          processors:
            - mapping: |
                meta content_type = "text/plain"
                root = "ok"

        - check: '@http_server_request_path == "/api/v1/status"'
          processors:
            - resource: status

        - processors:
            - mapping: |
                meta status = "404"
                root = {"error": "not found"}

output:
  sync_response: {}

processor_resources:
  - label: ingest_api
    switch:
      - check: '@http_server_request_path == "/healthz"'
        processors:
          - mapping: |
              meta content_type = "text/plain"
              root = "ok"

      - check: '@http_server_verb == "POST" && ["claude-vm"].contains(@http_server_request_path.re_find_object("^/api/v1/sessions/(?P<vm>[a-z-]+)$").vm.or(""))'
        processors:
          - mapping: |
              map pct {
                let n = this.number().catch(-1)
                root = if $n < 0 { null } else if $n > 100 { 100 } else { $n.round() }
              }
              map secs {
                let n = this.number().catch(0)
                root = if $n > 0 { $n.round() } else { null }
              }
              map clean {
                root = this.string().catch("").re_replace_all("[^A-Za-z0-9._:/@+ -]", "").slice(0, 64).catch("")
              }
              let b = content().parse_json().catch({})
              meta vm = @http_server_request_path.re_find_object("^/api/v1/sessions/(?P<vm>[a-z-]+)$").vm
              meta session = {
                "five_hour": {"used_pct": $b.rate_limits.five_hour.used_percentage.apply("pct"), "resets_at": $b.rate_limits.five_hour.resets_at.apply("secs")},
                "seven_day": {"used_pct": $b.rate_limits.seven_day.used_percentage.apply("pct"), "resets_at": $b.rate_limits.seven_day.resets_at.apply("secs")},
                "context_pct": $b.context_window.used_percentage.apply("pct"),
                "model": $b.model.display_name.or("").apply("clean"),
                "version": $b.version.or("").apply("clean"),
                "received_at": now().ts_unix()
              }
          - branch:
              request_map: 'root = @session'
              processors:
                - cache:
                    resource: state
                    operator: set
                    key: 'session:${! @vm }'
                    value: '${! content() }'
          - mapping: 'root = {"ok": true}'

      - processors:
          - mapping: |
              meta status = "404"
              root = {"error": "not found"}

  - label: login
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: serviceaccount
            operator: get
            key: token
      result_map: 'meta token = content().string().trim()'

  - label: kube_get
    http:
      url: 'https://kubernetes.default.svc${! @path }'
      verb: GET
      headers:
        Authorization: 'Bearer ${! @token }'
      timeout: 10s
      tls:
        enabled: true
        root_cas_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

  - label: github_login
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: githubtoken
            operator: get
            key: token
      result_map: 'meta gh_token = content().string().trim()'

  - label: github_get
    http:
      url: 'https://api.github.com${! @path }'
      verb: GET
      headers:
        Authorization: 'Bearer ${! @gh_token }'
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
        User-Agent: claude-cockpit
      timeout: 10s

  - label: prom_get
    http:
      url: '${PROM_URL:http://kube-prom-prometheus.kube-prometheus-stack-system.svc:9090}${! @path }'
      verb: GET
      timeout: 10s

  - label: flux_summary
    mapping: |
      let items = this.items.or([]).map_each(i -> {
        "name": i.metadata.name,
        "namespace": i.metadata.namespace,
        "suspended": i.spec.suspend.or(false),
        "ready": i.status.conditions.or([]).filter(c -> c.type == "Ready").map_each(c -> c.status).index(0).catch("Unknown"),
        "reconciling": i.status.conditions.or([]).filter(c -> c.type == "Reconciling" && c.status == "True").length() > 0,
        "message": i.status.conditions.or([]).filter(c -> c.type == "Ready").map_each(c -> c.message).index(0).catch("").slice(0, 160)
      }).map_each(i -> i.merge({"state": if i.suspended { "suspended" } else if i.ready == "True" { "ready" } else if i.reconciling || i.ready == "Unknown" { "reconciling" } else { "failed" }}))
      root.total = $items.length()
      root.ready = $items.filter(i -> i.state == "ready").length()
      root.reconciling = $items.filter(i -> i.state == "reconciling").length()
      root.suspended = $items.filter(i -> i.state == "suspended").length()
      root.failed = $items.filter(i -> i.state == "failed").length()
      root.problems = $items.filter(i -> i.state == "failed" || i.state == "reconciling").sort_by(i -> i.state + i.namespace + i.name).slice(0, 8).map_each(i -> {"namespace": i.namespace, "name": i.name, "state": i.state, "message": i.message})

  # a failed branch is left out and named in meta.workflow.failed; the catch clears the error flag so the rest is still answered
  - label: status
    processors:
      - mapping: 'root = {"generated_at": now().ts_unix()}'
      - workflow:
          branches:
            drops_total:
              request_map: |
                meta path = "/api/v1/query?query=" + "sum(increase(hubble_drop_total{reason=\"POLICY_DENIED\"}[1h]))".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: 'root.drops_total = this.data.result.index(0).value.index(1).number().round().catch(0)'

            drops_series:
              request_map: |
                let end = now().ts_unix()
                meta path = "/api/v1/query_range?query=" + "sum(increase(hubble_drop_total{reason=\"POLICY_DENIED\"}[5m]))".escape_url_query() + "&start=" + ($end - 3600).string() + "&end=" + $end.string() + "&step=300"
                root = ""
              processors:
                - resource: prom_get
              result_map: 'root.drops_series = this.data.result.index(0).values.map_each(v -> v.index(1).number().round()).catch([])'

            drops_top:
              request_map: |
                meta path = "/api/v1/query?query=" + "topk(3, sum by (source_workload, destination_ip, destination_namespace, destination_workload) (increase(hubble_drop_total{reason=\"POLICY_DENIED\"}[1h])) > 0)".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.drops_top = this.data.result.map_each(r -> {
                  "source": r.metric.source_workload.or("unknown"),
                  "destination": if r.metric.destination_workload.or("") != "" { r.metric.destination_namespace.or("-") + "/" + r.metric.destination_workload } else { r.metric.destination_ip.or("unknown") },
                  "count": r.value.index(1).number().round()
                })

            alerts:
              request_map: |
                meta path = "/api/v1/alerts"
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.alerts = this.data.alerts.filter(a -> a.state == "firing").map_each(a -> {
                  "name": a.labels.alertname.or("unknown"),
                  "severity": a.labels.severity.or("none"),
                  "summary": a.annotations.summary.or("").slice(0, 160),
                  "since": a.activeAt.or("")
                }).sort_by(a -> a.name)

            disk:
              request_map: |
                meta path = "/api/v1/query?query=" + "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/var/mnt/local-path-provisioner\"} / node_filesystem_size_bytes{mountpoint=\"/var/mnt/local-path-provisioner\"}) * on(instance) group_left(nodename) node_uname_info".escape_url_query()
                root = ""
              processors:
                - resource: prom_get
              result_map: |
                root.disk = this.data.result.map_each(r -> {
                  "node": r.metric.nodename.or(r.metric.instance.or("unknown")),
                  "used_pct": r.value.index(1).number().round()
                }).sort_by(n -> n.node)

            polaris:
              request_map: 'root = ""'
              processors:
                - http:
                    url: '${POLARIS_URL:http://polaris-dashboard.policy-system.svc.cluster.local}/results.json'
                    verb: GET
                    timeout: 15s
                - mapping: |
                    let failing = this.Results.map_each(r -> [
                      r.Results.or({}).values(),
                      r.PodResult.Results.or({}).values(),
                      r.PodResult.ContainerResults.or([]).map_each(c -> c.Results.or({}).values()).flatten()
                    ].flatten()).flatten().filter(x -> x.Success == false)
                    root.score = this.Score
                    root.audit_time = this.AuditTime
                    root.danger = $failing.filter(x -> x.Severity == "danger").length()
                    root.warning = $failing.filter(x -> x.Severity == "warning").length()
              result_map: 'root.polaris = this'

            flux_ks:
              request_map: |
                meta path = "/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations"
                root = ""
              processors:
                - resource: login
                - resource: kube_get
                - resource: flux_summary
              result_map: 'root.flux_ks = this'

            flux_hr:
              request_map: |
                meta path = "/apis/helm.toolkit.fluxcd.io/v2/helmreleases"
                root = ""
              processors:
                - resource: login
                - resource: kube_get
                - resource: flux_summary
              result_map: 'root.flux_hr = this'

            github:
              request_map: |
                let q = "is:open repo:cthtrifork/talos-gitops repo:cthtrifork/homeserver-bootc"
                meta path = "/search/issues?q=" + $q.escape_url_query() + "&per_page=100&sort=updated&order=desc"
                root = ""
              processors:
                - resource: github_login
                - resource: github_get
                - mapping: |
                    let items = this.items.or([]).map_each(i -> {
                      "number": i.number,
                      "title": i.title.or("").slice(0, 120),
                      "author": i.user.login.or("unknown"),
                      "url": i.html_url.or(""),
                      "repo": i.repository_url.or("unknown").split("/").index(-1),
                      "updated": i.updated_at.or(""),
                      "pr": i.pull_request != null,
                      "renovate": i.user.login.or("").lowercase().contains("renovate")
                    })
                    let other = $items.filter(i -> i.pr && !i.renovate)
                    let renovate = $items.filter(i -> i.pr && i.renovate)
                    let issues = $items.filter(i -> !i.pr && i.title != "Dependency Dashboard")
                    root.truncated = this.total_count.or(0) > 100
                    root.other = {"count": $other.length(), "items": $other.slice(0, 5)}
                    root.renovate = {"count": $renovate.length(), "items": $renovate.slice(0, 5)}
                    root.issues = {"count": $issues.length(), "items": $issues.slice(0, 5)}
              result_map: 'root.github = this'

            vm_upgrade:
              request_map: 'root = ""'
              processors:
                - http:
                    url: '${VM_UPGRADE_URL:http://claude-vm-upgrade.claude-system.svc}/api/v1/status'
                    verb: GET
                    timeout: 10s
              result_map: 'root.vm_upgrade = this'

            sessions:
              request_map: 'root = ""'
              processors:
                - cache:
                    resource: state
                    operator: get
                    key: session:claude-vm
                - catch:
                    - mapping: 'root = {}'
              result_map: 'root.sessions = {"claude-vm": this}'

            renovate:
              request_map: |
                meta path = "/apis/renovate-operator.mogenius.com/v1alpha1/renovateprojects"
                root = ""
              processors:
                - resource: login
                - resource: kube_get
                - mapping: |
                    root.projects = this.items.or([]).map_each(i -> {
                      "project": i.spec.project.or("unknown").split("/").index(-1),
                      "status": i.status.status.or("unknown"),
                      "result": i.status.renovateResultStatus.or(""),
                      "last_transition": i.status.lastTransition.or(""),
                      "duration": i.status.duration.or(""),
                      "needs_approval": i.status.prActivity.needsApproval.or(0),
                      "automerged": i.status.prActivity.automerged.or(0),
                      "created": i.status.prActivity.created.or(0),
                      "updated": i.status.prActivity.updated.or(0),
                      "unchanged": i.status.prActivity.unchanged.or(0)
                    }).sort_by(p -> p.project)
              result_map: 'root.renovate = this'
      - catch:
          - log:
              level: WARN
              message: a status source failed
              fields_mapping: 'root.error = error()'
          - mapping: 'root = this'
