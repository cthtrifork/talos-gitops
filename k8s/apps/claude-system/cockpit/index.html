<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Cockpit</title>
<meta name="description" content="Read-only status of the homelab cluster: traffic, alerts, Flux, GitHub and Renovate.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f63b5'/%3E%3Cpath d='M7 21a9 9 0 0 1 18 0' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M16 21l5-7' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1; --surface: #ffffff; --ink: #141413; --ink-2: #4a4843; --muted: #6b6963;
    --grid: #e3e2da; --ring: rgba(11, 11, 11, 0.10); --accent: #1f63b5;
    --calm: #77756f; --ok: #1a7f4b; --warn: #8a5a00; --warn-bg: #fff4d6; --bad: #b3261e; --bad-bg: #fde4e1;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* The whole type scale: small (labels, metadata), body, panel title, large (page title and headline numbers). */
    --fs-sm: 12px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
      --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --accent: #3987e5;
      --calm: #8d8b85; --ok: #3cc58a; --warn: #f2d98a; --warn-bg: #3a2f10; --bad: #ff8a80; --bad-bg: #3d1713;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
    --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --accent: #3987e5;
    --calm: #8d8b85; --ok: #3cc58a; --warn: #f2d98a; --warn-bg: #3a2f10; --bad: #ff8a80; --bad-bg: #3d1713;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink); font: var(--fs-md)/1.45 var(--font);
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  h1 { font-size: var(--fs-xl); margin: 0; }
  h2 { font-size: var(--fs-sm); margin: 0 0 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h3 { font-size: var(--fs-lg); margin: 0; font-weight: 600; }
  a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  button { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--grid); border-radius: 10px; min-height: 40px; padding: 6px 16px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 2px 0; font-size: var(--fs-md); font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  /* Healthy and neutral look the same: colour is kept for what needs a look, so a problem stands out. */
  .ok { color: var(--ok); }
  .none { color: var(--ink-2); }
  /* Columns, not a grid or flex row: cards are packed top to bottom and the browser balances the columns, so a short card
     (no alerts, a score) never sits in a row next to a tall list and never gets stretched into a mostly empty box.
     Cards keep a fixed order. */
  .band { column-width: 300px; column-gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 12px; break-inside: avoid; margin-bottom: 12px; }
  .panel.compact { padding: 10px 16px; gap: 4px; }
  .panel:target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  a.pill:hover { text-decoration: underline; }
  a.pill:focus-visible { outline-offset: 1px; border-radius: 999px; }
  .hdr-r { display: flex; align-items: center; gap: 12px; }
  footer p { margin: 0 0 8px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .big { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; line-height: 1; }
  .big small { font-size: var(--fs-sm); font-weight: 500; color: var(--muted); letter-spacing: 0; }
  ul.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ul.rows li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
  ul.rows li:first-child { border-top: 0; padding-top: 0; }
  ul.rows li:last-child { padding-bottom: 0; }
  .big + ul.rows { margin-top: 14px; }
  .run-st { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: var(--fs-md); }
  ul.rows .l { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; }
  /* The right-hand value (time, count, version) keeps its natural width and drops below the text as a whole when the row is tight.
     It only wraps when it is wider than the row itself. */
  ul.rows li > :not(.l) { flex: none; width: max-content; max-width: 100%; margin-left: auto; text-align: right; overflow-wrap: anywhere; }
  .bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .spark { width: 100%; height: 44px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--ink-2); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .limit { display: flex; flex-direction: column; gap: 6px; }
  .limit-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: var(--fs-md); }
  .row-st { display: inline-flex; align-items: center; gap: 8px; }
  .row-st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .row-st[data-st="warn"]::before { background: var(--warn); }
  .row-st[data-st="bad"]::before { background: var(--bad); }
  .mono { font-family: var(--mono); font-size: var(--fs-sm); }
  a.open { font-size: var(--fs-sm); font-weight: 600; margin-top: auto; }
  .src { font-size: var(--fs-sm); color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
  /* Nothing below the header is shown until the first data arrives: content that appears after the fetch would
     push the footer down (a layout shift of about 0.8 on the default throttled load). */
  main:not(.ready) > nav, main:not(.ready) > section, main:not(.ready) > footer { display: none; }
  .banner.bad { background: var(--bad-bg); }
  .banner { padding: 12px 14px; border-radius: 10px; font-size: var(--fs-md); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// htm + Preact (templates) and Croner (cron schedules) come from jsDelivr, pinned to exact versions. Bump the versions here.
import { html, render, useState, useEffect, useRef } from "https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js";
import { Cron } from "https://cdn.jsdelivr.net/npm/croner@11.0.1/dist/croner.js";

const REFRESH_MS = 60000;
const STALE_AFTER = 150; // seconds without a poll before a VM counts as not responding (same as the Update VMs page)
const MAX_ROWS = 5; // longest list shown in any panel; the rest is a count
// The pages behind a panel, served by the Omni service exposer. A panel with an entry gets an "Open" link at its foot.
const OMNI = "https://%s-portableinfo.workload.eu-central-1.omni.siderolabs.io/";
const OPEN = {
  "p-running-versions": ["Open Update VMs", "claudevmupgrade"],
  "p-dropped-traffic-last-hour": ["Open Hubble", "hubble"],
  "p-flux-reconciliation": ["Open Flux", "flux"],
  "p-polaris-score": ["Open Polaris", "polaris"],
  "p-renovate-runs": ["Open Renovate", "renovate"],
};

// ---- Plain helpers: formatting, status levels and the data behind the panels ----

const slug = (t) => "p-" + t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const secondsSince = (ms) => Math.max(0, Math.round((Date.now() - ms) / 1000));
const compare = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const isCritical = (a) => a.severity === "critical";
const isFailed = (x) => /fail|error/i.test(`${x.status} ${x.result}`);

function ago(sec) {
  if (sec < 90) return sec + " s";
  if (sec < 5400) return Math.round(sec / 60) + " min";
  return Math.round(sec / 3600) + " h";
}
function until(sec) {
  if (sec < 90) return "less than a minute";
  if (sec < 5400) return Math.round(sec / 60) + " min";
  if (sec < 172800) return Math.round(sec / 360) / 10 + " h";
  return Math.round(sec / 86400) + " days";
}
// A used percentage as a status (and a bar colour): quiet below 75, warn from 75, bad from `bad`.
const usedState = (pct, bad) => (pct >= bad ? "bad" : pct >= 75 ? "warn" : "ok");
const usedColor = (pct, bad) => ({ bad: "var(--bad)", warn: "var(--warn)", ok: "var(--calm)" })[usedState(pct, bad)];
// Next time a cron expression (UTC, as the operator runs it) fires; null if it does not parse.
function cronNext(expr) {
  try {
    const t = new Cron(expr, { timezone: "UTC" }).nextRun();
    return t ? t.getTime() : null;
  } catch (e) {
    return null;
  }
}
// The same filter the cockpit uses, as a GitHub search, so "more on GitHub" opens the whole list.
function ghSearch(group, d) {
  const bot = d.github?.renovate?.items[0]?.author;
  const app = bot ? "author:app/" + bot.replace(/\[bot\]$/, "") : null;
  let q = "is:open archived:false user:cthtrifork";
  if (group === "issues") q += ' is:issue NOT "Dependency Dashboard" in:title';
  else q += " is:pr -is:draft" + (group === "renovate" ? (app ? " " + app : " renovate") : app ? " -" + app : "");
  return "https://github.com/search?type=issues&s=updated&o=desc&q=" + encodeURIComponent(q);
}
function openLink(id, d) {
  // The Renovate pull requests panel links to the pull requests on GitHub, not to the Renovate UI.
  if (id === "p-renovate-pull-requests") return { label: "Open pull requests", href: ghSearch("renovate", d) };
  const o = OPEN[id];
  return o && { label: o[0], href: OMNI.replace("%s", o[1]) };
}
function fluxTotals(d) {
  const parts = [d.flux_ks, d.flux_hr].filter(Boolean);
  const t = { total: 0, ready: 0, progressing: 0, suspended: 0, failed: 0, unknown: 0, problems: [], complete: parts.length === 2 };
  for (const x of parts) {
    for (const k of ["total", "ready", "progressing", "suspended", "failed", "unknown"]) t[k] += x[k];
    t.problems = t.problems.concat(x.problems || []);
  }
  return t;
}
// The usage the claude-rc pod reported in the last 24 hours, or nothing.
const usageSession = (d) => (d.usage?.received_at ? d.usage : null);
// The usage: both windows, and which of them is closer to its limit (that one gets a bar).
function usageBlock(s, now) {
  const age = now - s.received_at;
  const windows = [["5-hour window", s.five_hour], ["7-day window", s.seven_day]].map(([name, w]) => {
    const x = w || {};
    const over = Boolean(x.resets_at && x.resets_at < now);
    const used = x.used_pct === null || x.used_pct === undefined ? null : over ? 0 : x.used_pct;
    return { name, used, over, resets_at: x.resets_at };
  });
  const vals = windows.map((w) => (w.used === null ? -1 : w.used));
  return {
    age,
    stale: age > 6 * 3600,
    windows,
    main: vals.indexOf(Math.max(...vals)),
    worst: Math.max(0, ...windows.map((w) => w.used ?? 0)),
  };
}

// The chips of the strip: one per panel that has a verdict, worst first.
function stripChips(d) {
  const chips = [];
  const add = (state, text, panel) => chips.push({ state, text, href: panel });
  if (d.alerts) {
    const n = d.alerts.length;
    add(n ? (d.alerts.some(isCritical) ? "bad" : "warn") : "ok", n ? `${n} ${n === 1 ? "alert" : "alerts"} firing` : "No alerts firing", "p-firing-alerts");
  }
  if (d.flux_ks || d.flux_hr) {
    const t = fluxTotals(d);
    if (t.failed) add("bad", `Flux: ${t.failed} failed`, "p-flux-reconciliation");
    else if (t.unknown) add("warn", `Flux: ${t.unknown} unknown`, "p-flux-reconciliation");
    else if (t.progressing) add("none", `Flux: ${t.progressing} progressing`, "p-flux-reconciliation");
    else add("ok", "Flux ready", "p-flux-reconciliation");
  }
  if (d.polaris) add(polarisState(d.polaris.score), `Polaris ${d.polaris.score}/100`, "p-polaris-score");
  if (d.disk?.length) {
    const m = Math.max(0, ...d.disk.map((n) => n.used_pct));
    add(usedState(m, 85), `Disk ${m}%`, "p-disk-local-path-volumes");
  }
  if (d.drops_total !== undefined) add(d.drops_total > 0 ? "warn" : "ok", `${d.drops_total} packets denied`, "p-dropped-traffic-last-hour");
  if (d.github) {
    const o = d.github.other.count;
    add(o ? "warn" : "ok", o + (o === 1 ? " open PR" : " open PRs"), "p-pull-requests");
  }
  const failed = d.renovate?.projects.filter(isFailed).length;
  if (failed) add("bad", `Renovate: ${failed} failed`, "p-renovate-runs");
  // The 7-day usage, unless it is stale or past its reset.
  const now = Math.round(Date.now() / 1000);
  const u = usageSession(d);
  const w = u?.seven_day?.used_pct;
  if (u && now - u.received_at <= 6 * 3600 && w !== null && w !== undefined && !(u.seven_day.resets_at && u.seven_day.resets_at < now)) {
    add(usedState(w, 90), `Claude 7-day ${w}%`, "p-claude-usage");
  }
  const order = { bad: 0, warn: 1, none: 2, ok: 3 };
  return chips.sort((a, b) => order[a.state] - order[b.state]);
}
const polarisState = (score) => (score >= 90 ? "ok" : score >= 75 ? "warn" : "bad");

// ---- Building blocks. Text goes in as text, never as markup, so nothing in the data can inject HTML. ----

const Pill = ({ state, children }) => html`<span class=${"pill " + state}>${children}</span>`;

const Panel = ({ title, state, text, compact, d, children }) => {
  const id = slug(title);
  const open = openLink(id, d);
  return html`<div class=${compact ? "panel compact" : "panel"} id=${id}>
    <div class="panel-head" data-state=${state}>
      <h3>${title}</h3>
      ${state !== "ok" && html`<${Pill} state=${state}>${text}<//>`}
    </div>
    ${children}
    ${open && html`<a class="open" href=${open.href} rel="noopener noreferrer" target="_blank">${open.label} →</a>`}
  </div>`;
};
// A failed source keeps its own visible line, because there the name is what the reader needs.
const Unavailable = ({ title, source, d }) =>
  html`<${Panel} title=${title} state="none" text="unavailable" d=${d}><span class="src">No answer from ${source}</span><//>`;

const Muted = ({ children }) => html`<span class="muted">${children}</span>`;

const Bar = ({ label, parts }) => html`<div class="bar" role="img" aria-label=${label}>
  ${parts.filter((p) => p.pct).map((p) => html`<i style=${{ width: p.pct + "%", minWidth: "4px" /* a lone failure among many stays visible */, background: p.color }} />`)}
</div>`;

// Each item: { title, href?, state?, sub?, right? }. Only GitHub links are made clickable.
const Rows = ({ items }) => html`<ul class="rows">
  ${items.map((it, i) => html`<li key=${i}>
    <span class="l">
      ${it.href?.startsWith("https://github.com/")
        ? html`<a href=${it.href} rel="noopener noreferrer" target="_blank">${it.title}</a>`
        : html`<strong ...${it.state ? { class: "row-st", "data-st": it.state } : {}}>${it.title}</strong>`}
      ${it.sub && html`<br /><${Muted}>${it.sub}<//>`}
    </span>
    ${it.right}
  </li>`)}
</ul>`;

const Sparkline = ({ series }) => {
  const max = Math.max(...series, 1);
  const pts = series.map((v, i) => `${((i / (series.length - 1)) * 240).toFixed(1)} ${(40 - (v / max) * 34).toFixed(1)}`);
  const line = "M" + pts.join(" L");
  return html`<svg class="spark" viewBox="0 0 240 44" preserveAspectRatio="none" role="img" aria-label=${"Denied packets per 5 minutes over the last hour, highest " + max}>
    <line x1="0" y1="43" x2="240" y2="43" stroke="var(--grid)" />
    <path d=${line + " L240 43 L0 43 Z"} fill="var(--warn)" fill-opacity="0.15" />
    <path d=${line} fill="none" stroke="var(--warn)" stroke-width="1.5" vector-effect="non-scaling-stroke" />
  </svg>`;
};

// ---- Panels: each takes the status data `d` and renders one card ----

const DropsPanel = ({ d }) => {
  const title = "Dropped traffic, last hour";
  if (d.drops_total === undefined) return html`<${Unavailable} title=${title} source="Prometheus · hubble_drop_total · POLICY_DENIED" d=${d} />`;
  const total = d.drops_total;
  const series = d.drops_series || [];
  const top = d.drops_top || [];
  return html`<${Panel} title=${title} state=${total > 0 ? "warn" : "ok"} text=${total > 0 ? "denied" : "none"} compact=${total === 0} d=${d}>
    <div class="big num">${total}<small> packets denied</small></div>
    ${series.length > 1 && total !== 0 && html`<${Sparkline} series=${series} />`}
    ${top.length > 0 && html`<${Rows} items=${top.map((t) => ({ title: `${t.source} → ${t.destination}`, right: html`<span class="num muted">${t.count}</span>` }))} />`}
  <//>`;
};

const AlertsPanel = ({ d }) => {
  const title = "Firing alerts";
  if (!d.alerts) return html`<${Unavailable} title=${title} source="Prometheus · /api/v1/alerts" d=${d} />`;
  const n = d.alerts.length;
  // Critical first, then by name; a long incident list is capped so it cannot push every other panel off the screen.
  const sorted = [...d.alerts].sort((a, b) => Number(!isCritical(a)) - Number(!isCritical(b)) || compare(a.name, b.name));
  const hiddenCritical = sorted.slice(MAX_ROWS).filter(isCritical).length;
  return html`<${Panel} title=${title} state=${n === 0 ? "ok" : d.alerts.some(isCritical) ? "bad" : "warn"} text=${n === 0 ? "none" : String(n)} compact=${n === 0} d=${d}>
    ${n === 0
      ? html`<${Muted}>Nothing is firing.<//>`
      : html`<${Rows} items=${sorted.slice(0, MAX_ROWS).map((a) => ({ title: a.name, sub: a.summary, right: html`<${Pill} state=${isCritical(a) ? "bad" : "warn"}>${a.severity}<//>` }))} />`}
    ${n > MAX_ROWS && html`<${Muted}>and ${n - MAX_ROWS} more${hiddenCritical ? `, ${hiddenCritical} of them critical` : ""}<//>`}
  <//>`;
};

const FLUX_STATE_PILL = { failed: "bad", unknown: "warn", progressing: "none" };
const FLUX_ORDER = { failed: 0, unknown: 1, progressing: 2 };
const FluxPanel = ({ d }) => {
  const title = "Flux reconciliation";
  if (!d.flux_ks && !d.flux_hr) return html`<${Unavailable} title=${title} source="Kubernetes API · kustomizations, helmreleases" d=${d} />`;
  const t = fluxTotals(d);
  const state = t.failed ? "bad" : t.unknown ? "warn" : t.progressing ? "none" : "ok";
  const label = t.failed ? t.failed + " failed" : t.unknown ? t.unknown + " unknown" : t.progressing ? t.progressing + " progressing" : "all ready";
  const pct = (n) => (t.total ? (n / t.total) * 100 : 0);
  const segments = [
    ["var(--calm)", t.ready, "ready"], ["var(--accent)", t.progressing, "progressing"], ["var(--bad)", t.failed, "failed"],
    ["var(--warn)", t.unknown, "unknown"], ["var(--ink-2)", t.suspended, "suspended"],
  ];
  const problems = [...t.problems]
    .sort((a, b) => FLUX_ORDER[a.state] - FLUX_ORDER[b.state] || compare(`${a.namespace}/${a.name}`, `${b.namespace}/${b.name}`))
    .slice(0, MAX_ROWS);
  const hidden = t.failed + t.unknown + t.progressing - problems.length;
  return html`<${Panel} title=${title} state=${state} text=${label} d=${d}>
    <${Bar} label=${`${t.ready} of ${t.total} ready`} parts=${segments.map(([color, n]) => ({ pct: pct(n), color }))} />
    <div class="legend">${segments.map(([color, n, name]) => html`<span><span class="dot" style=${{ background: color }}></span>${n} ${name}</span>`)}</div>
    ${problems.length > 0 && html`<${Rows} items=${problems.map((x) => ({ title: `${x.namespace}/${x.name}`, sub: x.message, right: html`<${Pill} state=${FLUX_STATE_PILL[x.state] || "warn"}>${x.state}<//>` }))} />`}
    ${hidden > 0 && html`<${Muted}>and ${hidden} more not listed<//>`}
    ${!t.complete && html`<${Muted}>One of the two lists did not answer, so the counts are partial.<//>`}
  <//>`;
};

const PolarisPanel = ({ d }) => {
  const title = "Polaris score";
  const x = d.polaris;
  if (!x) return html`<${Unavailable} title=${title} source="polaris-dashboard · /results.json" d=${d} />`;
  return html`<${Panel} title=${title} state=${polarisState(x.score)} text=${x.danger ? x.danger + " danger" : "no danger"} compact d=${d}>
    <div class="num"><strong>${x.score} / 100</strong> · ${x.danger} danger · ${x.warning} warning</div>
    <${Muted}>Audited ${String(x.audit_time).replace("T", " ").replace("Z", " UTC")}<//>
  <//>`;
};

const DISK_SHOW = 60; // nodes under this percentage are only counted
const DiskPanel = ({ d }) => {
  const title = "Disk, local-path volumes";
  if (!d.disk) return html`<${Unavailable} title=${title} source="Prometheus · node_filesystem_*" d=${d} />`;
  const max = Math.max(0, ...d.disk.map((n) => n.used_pct));
  const hot = d.disk.filter((n) => n.used_pct >= DISK_SHOW).sort((a, b) => b.used_pct - a.used_pct);
  const rest = d.disk.length - hot.length;
  const nodes = (n) => n + (n === 1 ? " node" : " nodes");
  return html`<${Panel} title=${title} state=${usedState(max, 85)} text=${max >= 75 ? "node over " + (max >= 85 ? 85 : 75) + "%" : "ok"} compact=${!hot.length} d=${d}>
    ${!hot.length
      ? html`<${Muted}>${d.disk.length ? `All ${nodes(d.disk.length)} under ${DISK_SHOW}%, highest ${max}%` : "No nodes reported."}<//>`
      : html`<div class="limit">
          ${hot.map((n) => html`<div class="limit-row" key=${n.node}><span>${n.node}</span><span class="num"><strong>${n.used_pct}%</strong> used</span></div>
            <${Bar} label=${`${n.node}, ${n.used_pct} percent used`} parts=${[{ pct: n.used_pct, color: usedColor(n.used_pct, 85) }]} />`)}
        </div>
        ${rest > 0 && html`<${Muted}>${rest} ${rest === 1 ? "other node" : "other nodes"} under ${DISK_SHOW}%<//>`}`}
  <//>`;
};

const PrRows = ({ items }) =>
  html`<${Rows} items=${items.map((i) => ({ title: `${i.repo}#${i.number}`, href: i.url, sub: `${i.title} · ${i.author}`, right: html`<span class="muted num">${ago(secondsSince(Date.parse(i.updated)))}</span>` }))} />`;

const GitHubPanel = ({ title, group, d, empty, stateOf }) => {
  const g = d.github?.[group];
  if (!g) return html`<${Unavailable} title=${title} source="GitHub API · search/issues" d=${d} />`;
  return html`<${Panel} title=${title} state=${stateOf(g.count)} text=${g.count + " open"} compact=${g.count === 0} d=${d}>
    ${g.count === 0 ? html`<${Muted}>${empty}<//>` : html`<${PrRows} items=${g.items} />`}
    ${g.count > g.items.length && html`<a href=${ghSearch(group, d)} rel="noopener noreferrer" target="_blank">${g.count - g.items.length} more on GitHub</a>`}
    ${d.github.truncated && html`<${Muted}>More than 100 are open, so the counts are a lower bound.<//>`}
  <//>`;
};
const PrsPanel = ({ d }) => html`<${GitHubPanel} title="Pull requests" group="other" d=${d} empty="No open pull requests." stateOf=${(n) => (n ? "warn" : "ok")} />`;
const RenovatePrsPanel = ({ d }) => html`<${GitHubPanel} title="Renovate pull requests" group="renovate" d=${d} empty="No open Renovate pull requests." stateOf=${(n) => (n === 0 ? "ok" : n > 10 ? "warn" : "none")} />`;
const IssuesPanel = ({ d }) => html`<${GitHubPanel} title="Open issues" group="issues" d=${d} empty="No open issues." stateOf=${(n) => (n ? "warn" : "ok")} />`;

const RenovateRunsPanel = ({ d }) => {
  const title = "Renovate runs";
  if (!d.renovate) return html`<${Unavailable} title=${title} source="Kubernetes API · renovateprojects" d=${d} />`;
  const ps = d.renovate.projects;
  const approval = ps.reduce((n, x) => n + x.needs_approval, 0);
  const failed = ps.filter(isFailed).length;
  // Headline: time to the next scheduled run, like the other panels' big number.
  const jobs = d.renovate_jobs || [];
  const live = jobs.filter((j) => !j.suspend);
  const nexts = live.map((j) => cronNext(j.schedule)).filter(Boolean);
  const next = nexts.length ? Math.min(...nexts) : 0;
  const showHeadline = jobs.length > 0 && (next > 0 || live.length === 0);
  return html`<${Panel} title=${title} state=${failed ? "bad" : approval ? "warn" : "ok"} text=${failed ? failed + " failed" : approval ? approval + " need approval" : "all done"} d=${d}>
    ${showHeadline && html`<div class="big num" ...${next ? { title: "Schedule (UTC): " + live.map((j) => j.schedule).join(", ") } : {}}>
      ${next ? until(Math.round((next - Date.now()) / 1000)) : "suspended"}<small>${next ? " until the next run" : " no run is scheduled"}</small>
    </div>`}
    <ul class="rows">
      ${ps.map((x) => {
        const bits = [
          x.duration && "took " + x.duration,
          x.needs_approval && x.needs_approval + " need approval",
          x.automerged && x.automerged + " automerged",
          x.unchanged && x.unchanged + " unchanged",
        ].filter(Boolean);
        const lastRun = Date.parse(x.last_transition);
        // The Dependency Dashboard issue of the repo, found by search because the issue number is not in the data.
        const dashboard = "https://github.com/search?type=issues&q=" + encodeURIComponent(`repo:cthtrifork/${x.project} is:issue is:open "Dependency Dashboard" in:title`);
        return html`<li key=${x.project}>
          <span class="l"><a href=${dashboard} rel="noopener noreferrer" target="_blank">${x.project}</a><br /><${Muted}>${bits.join(" · ") || "no changes"}<//></span>
          <span class="run-st">
            <${Pill} state=${isFailed(x) ? "bad" : x.status === "completed" ? "ok" : "warn"}>${x.status}<//>
            ${lastRun > 0 && html`<span class="muted num">${ago(secondsSince(lastRun))} ago</span>`}
          </span>
        </li>`;
      })}
    </ul>
  <//>`;
};

const VM_NAMES = { "claude-vm": "Claude VM", homeserver: "Home server" };
const VersionsPanel = ({ d }) => {
  const title = "Running versions";
  const vms = d.vm_upgrade?.vms;
  if (!vms) return html`<${Unavailable} title=${title} source="claude-vm-upgrade · /api/v1/status" d=${d} />`;
  const now = d.vm_upgrade.now || Math.round(Date.now() / 1000);
  let worst = "ok";
  let label = "reporting";
  const items = ["claude-vm", "homeserver"].map((name) => {
    const x = vms[name] || {};
    const vm = x.vm || {};
    const age = x.last_poll_at ? now - x.last_poll_at : null;
    const latest = d.vm_images?.[name]?.digest;
    const behind = latest && vm.booted_digest && latest !== vm.booted_digest;
    const state = age === null || age > STALE_AFTER ? "bad" : vm.staged_version || behind ? "warn" : "ok";
    if (state === "bad") { worst = "bad"; label = "not responding"; }
    else if (state === "warn" && worst !== "bad") { worst = "warn"; label = vm.staged_version ? "Reboot pending" : "Update available"; }
    const bits = [];
    if (age === null) bits.push("has not reported");
    else if (age > STALE_AFTER) bits.push(`last poll ${ago(age)} ago`);
    if (vm.staged_version) bits.push("staged " + vm.staged_version);
    else if (behind) bits.push("newer image");
    else if (latest) bits.push("Up to date");
    const booted = vm.booted_version ? vm.booted_version + (vm.booted_digest ? " · " + vm.booted_digest.slice(0, 12) : "") : "unknown";
    return { title: VM_NAMES[name] || name, state, sub: bits.join(" · "), right: html`<span class="muted num mono">${booted}</span>` };
  });
  return html`<${Panel} title=${title} state=${worst} text=${label} d=${d}>
    <${Rows} items=${items} />
    ${!d.vm_images && html`<${Muted}>The registry did not answer, so newer images are not shown.<//>`}
  <//>`;
};

// The usage: a bar for the window closer to its limit, the other as a line.
const UsageBlock = ({ s, b, now }) => {
  const notes = [`Updated ${ago(b.age)} ago`];
  return html`<div class="limit">
      ${b.windows.map((w, i) => {
        const suffix = w.resets_at && !w.over ? " · resets in " + until(w.resets_at - now) : w.over ? " · window has reset" : "";
        return html`<div class=${i === b.main ? "limit-row" : "limit-row muted"} key=${w.name}>
            <span>${w.name}</span>
            <span class="num">${w.used === null ? "no data" : html`<strong>${w.used}%</strong>${" used" + suffix}`}</span>
          </div>
          ${i === b.main && html`<${Bar} label=${`${w.name}, ${w.used === null ? "no data" : w.used + " percent used"}`} parts=${w.used === null ? [] : [{ pct: w.used, color: usedColor(w.used, 90) }]} />`}`;
      })}
    </div>
    <${Muted}>${notes.join(" · ") + (b.stale ? ". Older than 6 hours, so the poller may be failing." : "")}<//>`;
};
const UsagePanel = ({ d }) => {
  const title = "Claude usage";
  if (!d.usage) return html`<${Unavailable} title=${title} source="usage-poller → cockpit" d=${d} />`;
  const s = usageSession(d);
  if (!s) {
    return html`<${Panel} title=${title} state="none" text="no data" d=${d}><${Muted}>Nothing received in the last 24 hours. The usage-poller container of claude-rc sends it every 5 minutes.<//><//>`;
  }
  const now = Math.round(Date.now() / 1000);
  const b = usageBlock(s, now);
  return html`<${Panel} title=${title} state=${b.stale ? "none" : usedState(b.worst, 90)} text=${b.stale ? "stale" : `peak ${b.worst}%`} d=${d}>
    <${UsageBlock} s=${s} b=${b} now=${now} />
  <//>`;
};

// ---- The page ----

const Chip = ({ state, text, href }) =>
  href ? html`<a class=${"pill " + state} href=${"#" + href}>${text}</a>` : html`<span class=${"pill " + state}>${text}</span>`;

const Strip = ({ d }) => {
  const all = stripChips(d);
  const shown = all.filter((c) => c.state !== "ok");
  const healthy = all.length - shown.length;
  return html`<nav class="strip" aria-label="Overall status, each item jumps to its panel">
    ${shown.map((c) => html`<${Chip} key=${c.text} ...${c} />`)}
    ${healthy > 0 && html`<${Chip} state="ok" text=${shown.length ? healthy + " healthy" : "All healthy"} />`}
  </nav>`;
};

const Section = ({ id, title, children }) => html`<section aria-labelledby=${"h-" + id}>
  <h2 id=${"h-" + id}>${title}</h2>
  <div class="band">${children}</div>
</section>`;

// One request at a time: a refresh while one is in flight, or one that hangs, replaces it instead of stacking up.
// A hidden tab does not poll; coming back refreshes at once if the data is older than the interval.
function useStatus() {
  const [state, setState] = useState({ d: null, loadedAt: 0, error: null });
  const load = useRef(() => {});
  useEffect(() => {
    let inflight = null;
    let loadedAt = 0;
    load.current = async () => {
      inflight?.abort();
      const ctl = (inflight = new AbortController());
      const timer = setTimeout(() => ctl.abort(), 20000);
      try {
        const r = await fetch("api/v1/status", { signal: ctl.signal });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        loadedAt = Date.now();
        setState({ d, loadedAt, error: null });
      } catch (e) {
        if (inflight === ctl) setState((s) => ({ ...s, error: e.name === "AbortError" ? "timed out" : e.message })); // not superseded by a newer request
      } finally {
        clearTimeout(timer);
        if (inflight === ctl) inflight = null;
      }
    };
    const onVisible = () => { if (!document.hidden && Date.now() - loadedAt >= REFRESH_MS) load.current(); };
    const poll = setInterval(() => { if (!document.hidden) load.current(); }, REFRESH_MS);
    document.addEventListener("visibilitychange", onVisible);
    load.current();
    return () => {
      clearInterval(poll);
      document.removeEventListener("visibilitychange", onVisible);
      inflight?.abort();
    };
  }, []);
  return { ...state, reload: () => load.current() };
}

const App = () => {
  const { d, loadedAt, error, reload } = useStatus();
  const failedSources = Object.keys(d?.meta?.workflow?.failed || {});
  const banner = error
    ? `The cockpit could not be reached (${error}). Showing the last data, if any.`
    : failedSources.length ? `Some sources did not answer: ${failedSources.join(", ")}.` : "";
  // The time shown is when the data was last good, so a failed refresh cannot look current.
  const updated = error
    ? html`<span class="pill warn" id="updated">${loadedAt ? "Stale, data from " + new Date(loadedAt).toLocaleTimeString() : "No data yet"}</span>`
    : html`<span class="muted" id="updated">${d ? "Updated " + new Date(loadedAt).toLocaleTimeString() : "Loading…"}</span>`;
  // Nothing below the header is shown until the first data arrives (see `main:not(.ready)`): content that appears after the fetch
  // would push the footer down.
  return html`<main class=${d ? "ready" : undefined}>
    <header>
      <h1>Cockpit</h1>
      <div class="hdr-r">${updated}<button type="button" id="refresh" onClick=${reload}>Refresh now</button></div>
    </header>
    <div id="banner" class="banner bad" role="alert" hidden=${!banner}>${banner}</div>
    ${d && html`<${Strip} d=${d} />
      <${Section} id="cluster" title="Cluster">
        <${DropsPanel} d=${d} /><${AlertsPanel} d=${d} /><${FluxPanel} d=${d} /><${PolarisPanel} d=${d} /><${DiskPanel} d=${d} />
      <//>
      <${Section} id="gh" title="GitHub">
        <${PrsPanel} d=${d} /><${RenovatePrsPanel} d=${d} /><${IssuesPanel} d=${d} /><${RenovateRunsPanel} d=${d} />
      <//>
      <${Section} id="home" title="Homelab">
        <${VersionsPanel} d=${d} /><${UsagePanel} d=${d} />
      <//>
      <footer class="muted"><p>Reads only, nothing on this page changes the cluster.</p></footer>`}
  </main>`;
};

render(html`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
