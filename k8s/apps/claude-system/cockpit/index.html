<meta name="claude:viewport-fit-sides" content="cover">
<!-- Added to the iPhone Home Screen the page opens full screen, without Safari's bars. The status bar stays "default" (dark text on a
     light bar, light text on a dark one, following the system), because "black-translucent" would put white text on the light page.
     There is no manifest on purpose: the page sits behind the Omni login, which a manifest request does not carry cookies for.
     The touch icon is inline for the same reason (a request for /apple-touch-icon.png would be sent to the login), a 180 px PNG, square
     because iOS rounds the corners itself. -->

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">

<title>Cockpit</title>
<meta name="description" content="Read-only status of the homelab cluster: traffic, alerts, Flux, GitHub and Renovate.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23c4623f'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 17a7.5 7.5 0 1 1 14 0'/%3E%3Cpath d='M12 17l3.5-5'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1; --surface: #ffffff; --ink: #141413; --ink-2: #4a4843; --muted: #6b6963;
    --grid: #e3e2da; --ring: rgba(11, 11, 11, 0.10); --accent: #1f63b5;
    --calm: #77756f; --suspend: #6d28d9; --ok: #1a7f4b; --warn: #8a5a00; --warn-bg: #fff4d6; --bad: #b3261e; --bad-bg: #fde4e1;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* The whole type scale: small (labels, metadata), body, panel title, large (page title and headline numbers). */
    --fs-sm: 12px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
      --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --accent: #3987e5;
      --calm: #8d8b85; --suspend: #b388ff; --ok: #3cc58a; --warn: #f2d98a; --warn-bg: #3a2f10; --bad: #ff8a80; --bad-bg: #3d1713;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
    --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --accent: #3987e5;
    --calm: #8d8b85; --suspend: #b388ff; --ok: #3cc58a; --warn: #f2d98a; --warn-bg: #3a2f10; --bad: #ff8a80; --bad-bg: #3d1713;
  }
  * { box-sizing: border-box; }
  /* Phone and Home Screen: no text zoom after a rotation, no grey flash or double-tap zoom delay on a tap, and the page colour
     behind the rubber band. The insets keep the content clear of the notch (landscape) and the home indicator (bottom). */
  html { -webkit-text-size-adjust: 100%; background: var(--page); }
  a, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    margin: 0; background: var(--page); color: var(--ink); font: var(--fs-md)/1.45 var(--font);
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(48px, calc(env(safe-area-inset-bottom, 0px) + 24px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 68rem; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  h1 { font-size: var(--fs-xl); margin: 0; }
  h2 { font-size: var(--fs-sm); margin: 0 0 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h3 { font-size: var(--fs-lg); margin: 0; font-weight: 600; }
  a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  @media (hover: hover) { a:hover { text-decoration: underline; } }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  button { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--grid); border-radius: 10px; min-height: 44px; padding: 6px 16px; cursor: pointer; }
  @media (hover: hover) { button:hover { border-color: var(--accent); } }
  button:active { border-color: var(--accent); }
  .seg { display: flex; gap: 6px; margin: 4px 0; }
  .seg button { min-height: 36px; padding: 2px 12px; font-size: var(--fs-md); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  .strip { display: flex; flex-wrap: wrap; gap: 0 16px; }
  /* The chips are links to a panel: 44 px tall, the minimum for a finger. */
  .strip .pill { min-height: 44px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 2px 0; font-size: var(--fs-md); font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  /* Healthy and neutral look the same: colour is kept for what needs a look, so a problem stands out. */
  .ok { color: var(--ok); }
  .none { color: var(--ink-2); }
  .info { color: var(--accent); }
  /* A grid with fixed tracks, cards in a fixed order and top aligned: a card only ever changes height, it never changes place.
     (CSS columns balance by height, so a refresh that lengthened one list made cards jump between columns.) */
  /* Each section is a few fixed columns, and every panel has its own column, chosen so the columns end at about the same height.
     A panel only ever changes height, never place. On a narrow screen the columns stack, left to right. */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  @media (min-width: 900px) { .cols { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); } }
  .panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 12px; }
  .panel.compact { padding: 10px 16px; gap: 4px; }
  .panel:target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  a.pill:focus-visible { outline-offset: 1px; border-radius: 999px; }
  .hdr-r { display: flex; align-items: center; gap: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .big { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; line-height: 1; }
  .big small { font-size: var(--fs-md); font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .big.score small { color: inherit; }
  ul.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ul.rows li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
  ul.rows li:first-child { border-top: 0; padding-top: 0; }
  ul.rows li:last-child { padding-bottom: 0; }
  .big + ul.rows { margin-top: 14px; }
  .run-st { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: var(--fs-md); }
  ul.rows .l { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; }
  /* The right-hand value (time, count, version) keeps its natural width and drops below the text as a whole when the row is tight.
     It only wraps when it is wider than the row itself. */
  ul.rows li > :not(.l) { flex: none; width: max-content; max-width: 100%; margin-left: auto; text-align: right; overflow-wrap: anywhere; }
  .hardware-band .panel-head { flex-wrap: wrap; }
  .hardware-band .panel-head .pill { white-space: normal; }
  .machine-rack { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--grid); border-radius: 14px; }
  .machine {
    display: grid; grid-template-columns: 44px minmax(0, 1fr);
    grid-template-areas: "slot name" "slot specs" "slot storage";
    align-items: start; gap: 2px 12px; padding: 10px 12px; overflow-wrap: anywhere;
  }
  .machine + .machine { border-top: 1px solid var(--grid); }
  .machine-slot { grid-area: slot; display: grid; justify-items: start; gap: 4px; padding-top: 2px; }
  .machine-name { grid-area: name; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .machine-specs { grid-area: specs; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .machine-storage { grid-area: storage; }
  .machine .mono, .machine-specs, .machine-storage { color: var(--ink-2); font-size: var(--fs-sm); }
  .machine-specs strong { color: var(--ink); }
  @media (min-width: 760px) {
    .machine {
      grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1.25fr);
      grid-template-areas: "slot name specs storage";
      align-items: center; gap: 16px; padding: 10px 16px;
    }
    .machine-name, .machine-specs { flex-direction: column; align-items: start; }
  }
  .machine-icon { position: relative; display: block; width: 36px; height: 19px; border: 1px solid var(--calm); border-radius: 5px; background: var(--page); }
  .machine-icon.thin { height: 15px; margin-top: 4px; width: 41px; }
  .machine-icon::before { content: ""; position: absolute; left: 5px; bottom: 5px; width: 4px; height: 2px; background: var(--calm); box-shadow: 6px 0 var(--calm); }
  .machine-icon::after { content: ""; position: absolute; right: 5px; bottom: 4px; width: 4px; height: 4px; border: 1px solid var(--calm); border-radius: 50%; }
  .hardware-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .hardware-table th, .hardware-table td { text-align: right; padding: 4px; white-space: nowrap; }

<cockpit-app></cockpit-app>
<!-- Lit comes from jsDelivr as plain ES modules, and Croner (cron schedules) from jsDelivr too, every package pinned to an exact version. Bump the versions here. -->
<script type="importmap">
{
  "imports": {
    "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/index.js",
    "lit-element/": "https://cdn.jsdelivr.net/npm/lit-element@4.2.2/",
    "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/lit-html.js",
    "lit-html/": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/",
    "@lit/reactive-element": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/reactive-element.js",
    "@lit/reactive-element/": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/",
    "croner": "https://cdn.jsdelivr.net/npm/croner@11.0.1/dist/croner.js",

</script>
<script type="module">
import { LitElement, html, nothing, svg } from "lit";
import { Cron } from "croner";
import * as cronstrueModule from "cronstrue";

const REFRESH_MS = 60000;
const STALE_AFTER = 150; // seconds without a poll before a VM counts as not responding (same as the Update VMs page)
const PULL_PX = 90; // how far a pull down from the top of the page has to go to refresh
const MAX_ROWS = 5; // longest list shown in any panel; the rest is a count
// The pages behind a panel, served by the Omni service exposer. A panel with an entry gets an "Open" link at its foot.
const OMNI = "https://%s-portableinfo.workload.eu-central-1.omni.siderolabs.io/";
const GITHUB_PANELS = { "p-pull-requests": ["other", "Open pull requests"], "p-renovate-pull-requests": ["renovate", "Open pull requests"], "p-open-issues": ["issues", "Open issues"] };
const OPEN = {
  "p-running-versions": ["Open Update VMs", "claudevmupgrade"],
  "p-dropped-traffic": ["Open Hubble", "hubble"],
  "p-flux-reconciliation": ["Open Flux", "flux"],
  "p-polaris-score": ["Open Polaris", "polaris"],
  "p-renovate-runs": ["Open Renovate", "renovate"],
  "p-share-urls": ["Open Share URLs", "claudeurlshare"],
  "p-claude-usage": ["Open Claude usage", "claudeusage"],
  "p-trivy-vulnerabilities": ["Open Trivy vulnerabilities", "claudetrivy"],
  "p-elevate-claude": ["Open Elevate Claude", "claudeelevate"],
  "p-scheduled-jobs": ["Open Run jobs", "claudejobs"],
};

// ---- Plain helpers: formatting, status levels and the data behind the panels ----

const slug = (t) => "p-" + t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const secondsSince = (ms) => Math.max(0, Math.round((Date.now() - ms) / 1000));
const compare = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const isCritical = (a) => a.severity === "critical";
const isFailed = (x) => /fail|error/i.test(`${x.status} ${x.result}`);

function ago(sec) {
  if (sec < 90) return sec + " s";
  if (sec < 5400) return Math.round(sec / 60) + " min";
  return Math.round(sec / 3600) + " h";
}
// "10 h 16 min", the same style as the Run jobs page.
function until(sec) {
  const m = Math.max(1, Math.round(sec / 60));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " h" + (m % 60 ? " " + (m % 60) + " min" : "");
  return Math.floor(h / 24) + " d" + (h % 24 ? " " + (h % 24) + " h" : "");
}
// A used percentage as a status (and a bar colour): quiet below 75, warn from 75, bad from `bad`.
const usedState = (pct, bad) => (pct >= bad ? "bad" : pct >= 75 ? "warn" : "ok");
const usedColor = (pct, bad) => ({ bad: "var(--bad)", warn: "var(--warn)", ok: "var(--calm)" })[usedState(pct, bad)];
// Next time a cron expression fires (UTC unless a time zone is given, as the operator runs it); null if it does not parse.
function cronNext(expr, timezone = "UTC") {

    return t ? t.getTime() : null;
  } catch (e) {
    return null;
  }
}
// A cron expression in words ("At 7 minutes past the hour"), from cronstrue; the expression as written if it does not parse.
// The package is CommonJS behind jsDelivr's +esm, so the function can sit on the namespace or on its default export.
const cronstrue = cronstrueModule.default ?? cronstrueModule;
function cronWords(expr) {

  } catch (e) {
    return expr;
  }
}
// The same filter the cockpit uses, as a GitHub search, so the "Open" link opens the whole list.
function ghSearch(group, d) {
  const app = "author:app/" + d.github.renovate_app; // the Renovate GitHub App, from RENOVATE_APP on the pod
  let q = "is:open archived:false user:cthtrifork";
  if (group === "issues") q += ' is:issue NOT "Dependency Dashboard" in:title';
  else q += " is:pr -is:draft" + (group === "renovate" ? " " + app : " -" + app);

}
function openLink(id, d) {

  const gh = GITHUB_PANELS[id];
  if (gh && d.github) {
    const g = d.github[gh[0]];
    const more = g.count > g.items.length ? ` (${g.count - g.items.length} more)` : "";
    return { label: gh[1] + more, href: ghSearch(gh[0], d) };
  }

}
function fluxTotals(d) {
  const parts = [d.flux_ks, d.flux_hr].filter(Boolean);
  const t = { total: 0, ready: 0, progressing: 0, suspended: 0, failed: 0, unknown: 0, problems: [], complete: parts.length === 2 };
  for (const x of parts) {
    for (const k of ["total", "ready", "progressing", "suspended", "failed", "unknown"]) t[k] += x[k];
    t.problems = t.problems.concat(x.problems || []);

}
// The usage the claude-rc pod reported in the last 24 hours, or nothing.
const usageSession = (d) => (d.usage?.received_at ? d.usage : null);
// The usage: both windows, and which of them is closer to its limit (that one gets a bar).
function usageBlock(s, now) {
  const age = now - s.received_at;
  const windows = [["5-hour window", s.five_hour], ["7-day window", s.seven_day]].map(([name, w]) => {
    const x = w || {};
    const over = Boolean(x.resets_at && x.resets_at < now);
    const used = x.used_pct === null || x.used_pct === undefined ? null : over ? 0 : x.used_pct;
    return { name, used, over, resets_at: x.resets_at };
  });
  const vals = windows.map((w) => (w.used === null ? -1 : w.used));
  return {
    age,
    stale: age > 6 * 3600,
    windows,
    main: vals.indexOf(Math.max(...vals)),
    worst: Math.max(0, ...windows.map((w) => w.used ?? 0)),
  };

// The chips of the strip: one per panel that has a verdict, worst first.
function stripChips(d, hardwareWarning, environmentWarning) {
  const chips = [];
  const add = (state, text, panel) => chips.push({ state, text, href: panel });
  if (d.alerts) {
    const n = d.alerts.length;
    add(n ? (d.alerts.some(isCritical) ? "bad" : "warn") : "ok", n ? `${n} ${n === 1 ? "alert" : "alerts"} firing` : "No alerts firing", "p-firing-alerts");
  }
  if (hardwareWarning) add(hardwareWarning.state, hardwareWarning.text, "p-node-temperatures");
  if (environmentWarning) add(environmentWarning.state, environmentWarning.text, "p-environment");
  if (d.flux_ks || d.flux_hr) {
    const t = fluxTotals(d);
    if (t.failed) add("bad", `Flux: ${t.failed} failed`, "p-flux-reconciliation");
    else if (t.unknown) add("warn", `Flux: ${t.unknown} unknown`, "p-flux-reconciliation");
    else if (t.progressing) add("none", `Flux: ${t.progressing} progressing`, "p-flux-reconciliation");
    else add("ok", "Flux ready", "p-flux-reconciliation");
  }
  if (d.polaris) add(polarisState(d.polaris.score), `Polaris ${d.polaris.score}/100`, "p-polaris-score");
  const tv = trivyCounts(d);
  if (tv) add(tv.critical ? "bad" : tv.high ? "none" : "ok", tv.critical ? `Trivy: ${tv.critical} critical` : tv.high ? `Trivy: ${tv.high} high` : "Trivy clean", "p-trivy-vulnerabilities");
  // The worst of the fullest volume and every node row (/var and the volume groups), linked to the panel it comes from.
  const vol = Math.max(0, ...(d.pvcs || []).map((n) => n.used_pct));
  const nodes = nodeRows(d);
  const hot = Math.max(0, ...(nodes || []).map((n) => n.max));
  if (d.pvcs?.length || nodes?.length) {
    const m = Math.round(Math.max(vol, hot));
    add(usedState(m, 85), `Storage ${m}%`, slug(hot > vol ? "Node disks" : "Volumes"));
  }
  if (d.drops_total !== undefined) add(d.drops_total > 0 ? "warn" : "ok", `${d.drops_total} packets denied`, "p-dropped-traffic");
  // Counts that are always there (high CVEs, open PRs) stay neutral: an amber chip is for something that needs a look today.
  if (d.github) {
    const o = d.github.other.count;
    add(o ? "none" : "ok", o + (o === 1 ? " open PR" : " open PRs"), "p-pull-requests");
  }
  const failed = d.renovate?.projects.filter(isFailed).length;
  if (failed) add("bad", `Renovate: ${failed} failed`, "p-renovate-runs");

  const now = Math.round(Date.now() / 1000);
  const u = usageSession(d);
  const w = u?.seven_day?.used_pct;
  if (u && now - u.received_at <= 6 * 3600 && w !== null && w !== undefined && !(u.seven_day.resets_at && u.seven_day.resets_at < now)) {
    add(usedState(w, 90), `Claude 7-day ${w}%`, "p-claude-usage");

// 100 is green, 90 to 99 amber, below 90 red.
const polarisState = (score) => (score >= 100 ? "ok" : score >= 90 ? "warn" : "bad");
// Trivy findings per severity (each image counted once), or null when the source did not answer.
const TRIVY_SEVERITIES = [["critical", "Critical", "var(--bad)"], ["high", "High", "var(--warn)"], ["medium", "Medium", "var(--accent)"], ["low", "Low", "var(--calm)"], ["unknown", "Unknown", "var(--suspend)"]];
function trivyCounts(d) {
  if (!d.trivy_severity) return null;
  const c = { critical: 0, high: 0, medium: 0, low: 0, unknown: 0 };
  for (const x of d.trivy_severity) if (x.severity in c) c[x.severity] = x.count;
  c.total = c.critical + c.high + c.medium + c.low + c.unknown;
  return c;
}
// Critical is red, high is amber; medium and below are counted but never raise the panel.
const trivyState = (c) => (c.critical ? "bad" : c.high ? "warn" : "ok");


// ---- Building blocks. Text goes in as text, never as markup, so nothing in the data can inject HTML. ----
// Components are plain functions that return a template. lit-html renders `nothing`, null and undefined as empty but prints `false`,
// so an optional part is written `cond ? html`...` : nothing`, never `cond && html`...``. The pieces inside an <svg> would need the
// svg tag; only the sparkline draws SVG and its whole tree is one static template.

const Pill = (state, children) => html`<span class=${"pill " + state}>${children}</span>`;

const Panel = ({ title, state, text, compact, d }, children) => {
  const id = slug(title);
  const open = openLink(id, d);
  return html`<div class=${compact ? "panel compact" : "panel"} id=${id}>
    <div class="panel-head" data-state=${state}>
      <h3>${title}</h3>
      ${state !== "ok" ? Pill(state, text) : nothing}
    </div>
    ${children}

  </div>`;

// A failed source keeps its own visible line, because there the name is what the reader needs.
const Unavailable = ({ title, source, d }) =>

const Muted = (children) => html`<span class="muted">${children}</span>`;

const Bar = ({ label, parts }) => html`<div class="bar" role="img" aria-label=${label}>${parts.filter((p) => p.pct).map((p) => html`<i style="width: ${p.pct}%; min-width: 4px; background: ${p.color}"></i>`)}</div>`;

const Rows = (items) => html`<ul class="rows">${items.map((it) => html`<li>
    <span class="l">${it.href?.startsWith("https://github.com/")
      ? html`<a href=${it.href} rel="noopener noreferrer" target="_blank">${it.title}</a>`
      : html`<strong class=${it.state ? "row-st" : nothing} data-st=${it.state ?? nothing}>${it.title}</strong>`}${it.sub ? html`<br />${Muted(it.sub)}` : nothing}</span>

const Sparkline = (series) => {
  const max = Math.max(...series, 1);
  const pts = series.map((v, i) => `${((i / (series.length - 1)) * 240).toFixed(1)} ${(40 - (v / max) * 34).toFixed(1)}`);

// ---- Panels: each takes the status data `d` and renders one card ----

// The window of the dropped-traffic panel: 15 minutes or 1 hour, kept on this device and sent to the status request.
const DROPS_WINDOWS = [["15m", "15 min"], ["1h", "1 hour"]];

    ${toggle}

  { driver: "nvme", name: "NVMe", warn: 65, critical: 75 },
  { driver: "spd5118", name: "RAM", warn: 70, critical: 85 },

const temperatureText = (value) => `${Number(value.toFixed(1))}°C`;
function temperatureViolation(value, stat, component) {
  if (!Number.isFinite(value)) return null;
  if (stat !== "max" && value < 5) return { state: "warn", text: "Low temperature", margin: 5 - value };
  if (stat !== "min" && value > component.critical) return { state: "bad", text: "Critical high temperature", margin: value - component.critical };
  if (stat !== "min" && value > component.warn) return { state: "warn", text: "High temperature", margin: value - component.warn };
  return null;
}
function hardwareRows(d) {
  return (d.hardware_temperatures || []).map(({ node, sensors }) => ({
    node,
    rows: HARDWARE_COMPONENTS.map((component) => {
      const stats = Object.fromEntries(sensors.filter((s) => s.component === component.driver).map((s) => [s.stat, s.value]));
      const cells = ["current", "min", "max"].map((stat) => ({
        stat, value: stats[stat], violation: temperatureViolation(stats[stat], stat, component),

function hardwareWarnings(nodes, window) {
  const violations = nodes.flatMap(({ node, rows }) => rows.flatMap(({ name, cells }) =>

  const worst = violations.sort((a, b) =>
    Number(b.violation.state === "bad") - Number(a.violation.state === "bad")
    || Number(b.stat === "current") - Number(a.stat === "current")
    || b.violation.margin - a.violation.margin)[0];
  if (!worst) return null;
  const value = temperatureText(worst.value);
  const text = worst.stat === "current"
    ? `${worst.name} at ${value} now`
    : `${worst.name} reached ${value} in ${window}`;
  return { state: worst.violation.state, text: `${text} · ${worst.node}` };

// Room (H&T) and rack (Pill) air and the room humidity from the shelly-mqtt exporter. Temperatures have no thresholds. Humidity warns

  if (!Number.isFinite(value)) return null;
  if (stat !== "max" && value < HUMIDITY.lowBad) return { state: "bad", text: "Critical low humidity", dir: "low", margin: HUMIDITY.lowBad - value };
  if (stat !== "max" && value < HUMIDITY.lowWarn) return { state: "warn", text: "Low humidity", dir: "low", margin: HUMIDITY.lowWarn - value };
  if (stat !== "min" && value > HUMIDITY.highBad) return { state: "bad", text: "Critical high humidity", dir: "high", margin: value - HUMIDITY.highBad };
  if (stat !== "min" && value > HUMIDITY.highWarn) return { state: "warn", text: "High humidity", dir: "high", margin: value - HUMIDITY.highWarn };
  return null;
}
const AMBIENT = [{ place: "room", name: "Room" }, { place: "rack", name: "Rack" }];
const AMBIENT_ROWS = [...AMBIENT, { place: "humidity", name: "Room humidity", format: humidityText, violation: humidityViolation }];
function ambientRows(d) {
  return AMBIENT_ROWS.map(({ place, name, format = temperatureText, violation }) => {
    const stats = Object.fromEntries((d.ambient_temperatures || []).filter((s) => s.place === place).map((s) => [s.stat, s.value]));
    return { name, cells: ["current", "min", "max"].map((stat) => ({ stat, value: stats[stat], format, violation: violation ? violation(stats[stat], stat) : null })) };
  }).filter(({ cells }) => cells.some(({ value }) => Number.isFinite(value)));
}
function environmentWarnings(rows, window) {
  const violations = rows.flatMap(({ name, cells }) => cells.filter((cell) => cell.violation).map((cell) => ({ name, ...cell })));
  const worst = violations.sort((a, b) =>
    Number(b.violation.state === "bad") - Number(a.violation.state === "bad")
    || Number(b.stat === "current") - Number(a.stat === "current")
    || b.violation.margin - a.violation.margin)[0];
  if (!worst) return null;
  const value = worst.format(worst.value);
  return { state: worst.violation.state, text: worst.stat === "current" ? `${worst.name} at ${value} now` : `${worst.name} reached ${value} in ${window}` };
}

const TEMPERATURE_RANGES = { "1h": [3600, 60], "24h": [86400, 900], "7d": [604800, 7200] };
const TREND_COLORS = ["var(--accent)", "var(--suspend)", "var(--ok)"];
const TREND_DASHES = ["none", "5 3", "2 3"];

function Trend({ title, data, labels, end, duration, step, unit, window }) {
  if (!data) return Muted("Trend unavailable");
  const start = end - duration;
  const series = labels.map(([key, name], i) => ({
    name, color: TREND_COLORS[i], dash: TREND_DASHES[i],
    points: (data.find((s) => s.key === key)?.points || []).filter(([t, v]) => t >= start && t <= end && Number.isFinite(v)),
  })).filter((s) => s.points.length);
  const values = series.flatMap((s) => s.points.map(([, value]) => value));
  if (!values.length) return Muted("No trend samples in this range");
  const percent = unit === "%";
  const low = percent ? 0 : Math.floor((Math.min(...values) - 1) / 5) * 5;
  const high = percent ? 100 : Math.ceil((Math.max(...values) + 1) / 5) * 5;
  const ticks = percent ? [100, 75, 50, 25, 0] : [high, (high + low) / 2, low];
  const x = (time) => 1 + 238 * (time - start) / duration;
  const y = (value) => 51 - 50 * (value - low) / (high - low);
  return html`<figure class="trend">
    <figcaption class="hardware-note">${title}</figcaption>
    <div class=${percent ? "trend-plot trend-percent" : "trend-plot"}>
      <div class="trend-scale" aria-hidden="true">${(percent ? ticks : [high, low]).map((tick) => html`<span>${tick}${unit}</span>`)}</div>
      <svg class="spark" viewBox=${percent ? "0 -5 240 62" : "0 0 240 52"} preserveAspectRatio="none" role="img"
        aria-label=${series.map(({ name, points }) => `${name} ${Math.min(...points.map(([, v]) => v)).toFixed(1)} to ${Math.max(...points.map(([, v]) => v)).toFixed(1)}${unit}`).join(", ")}>
        <path d=${ticks.map((tick) => `M0 ${y(tick)}H240`).join(" ")} stroke="var(--grid)" fill="none" />
        ${series.map(({ color, dash, points }) => {
          const path = points.map(([t, v], i) => `${i && t - points[i - 1][0] <= step * 1.5 ? "L" : "M"}${x(t).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
          return svg`<path d=${path} stroke=${color} stroke-dasharray=${dash} stroke-width="2" fill="none" vector-effect="non-scaling-stroke" />
            ${points.filter(([t], i) => t - (points[i - 1]?.[0] ?? -Infinity) > step * 1.5 && (points[i + 1]?.[0] ?? Infinity) - t > step * 1.5)
              .map(([t, v]) => svg`<circle cx=${x(t)} cy=${y(v)} r="1.5" fill=${color} />`)}`;
        })}
      </svg>
      <div class="trend-time"><span>${window} ago</span><span>Now</span></div>
    </div>
    <div class="legend">${series.map(({ name, color, dash }) => html`<span><svg width="16" height="8" aria-hidden="true"><path d="M0 4H16" stroke=${color} stroke-dasharray=${dash} stroke-width="2" /></svg> ${name}</span>`)}</div>
  </figure>`;
}

// The history window buttons: one control above both temperature panels, since they share one setting.
const WindowToggle = (d, pendingWindow, setWindow) => {

  <span class="hardware-note" role="status" ?hidden=${!pendingWindow}>${pendingWindow ? `Loading ${pendingWindow} · showing ${win}` : ""}</span>`;
};

const HardwarePanel = (d, nodes, warning, toggle) => {
  const title = "Node temperatures";
  if (!d.hardware_temperatures) return Unavailable({ title, source: "Prometheus · node hardware temperature metrics", d });
  const win = d.hardware_window || hardwareWindow();
  const [duration, step] = TEMPERATURE_RANGES[win] || TEMPERATURE_RANGES["24h"];
  const partial = nodes.some(({ rows }) => rows.some((row) => row.partial));
  return Panel({ title, state: warning?.state ?? "ok", text: warning?.text, d }, html`
    ${toggle ?? nothing}
    ${Trend({ title: "Hottest sensor at each sample, across nodes", data: d.temperature_trend, labels: HARDWARE_COMPONENTS.map(({ driver, name }) => [driver, name]), end: d.generated_at, duration, step, unit: "°C", window: win })}
    ${nodes.length ? html`
      <table class="hardware-table" aria-label="Temperatures by node and sensor">
        <thead><tr><th scope="col">Sensor</th><th scope="col" class="hardware-now">Current</th><th scope="col">Min</th><th scope="col">Max</th></tr></thead>
        ${nodes.map(({ node, rows }) => html`<tbody>
          <tr><th scope="rowgroup" colspan="4" class="mono hardware-node">${node}</th></tr>

            : html`
            <tr><th scope="row">${name}${partial ? html`<sup aria-label="Partial history">*</sup>` : nothing}</th>
            ${cells.map(({ stat, value, violation }) => Number.isFinite(value)
              ? html`<td class=${stat === "current" ? "hardware-now" : "hardware-history"}><span class=${"reading " + (violation?.state ?? "")} title=${violation?.text ?? nothing} aria-label=${violation ? `${value}°C, ${violation.text}` : nothing}>${violation ? html`<span aria-hidden="true">${violation.text.startsWith("Low") ? "↓" : "↑"}</span> ` : nothing}${temperatureText(value)}</span></td>`
              : html`<td class="muted" aria-label="Unavailable" title="Unavailable">—</td>`)}

  `);
};

const EnvironmentPanel = (d, rows, warning, toggle) => {

const AlertsPanel = (d) => {

  const sorted = [...d.alerts].sort((a, b) => Number(!isCritical(a)) - Number(!isCritical(b)) || compare(a.name, b.name));
  const hiddenCritical = sorted.slice(MAX_ROWS).filter(isCritical).length;
  return Panel({ title, state: n === 0 ? "ok" : d.alerts.some(isCritical) ? "bad" : "warn", text: n === 0 ? "none" : String(n), compact: n === 0, d }, html`
    ${n === 0
      ? Muted("Nothing is firing.")

const FLUX_STATE_PILL = { failed: "bad", unknown: "warn", progressing: "info" };
const FLUX_ORDER = { failed: 0, unknown: 1, progressing: 2 };
const FluxPanel = (d) => {
  const title = "Flux reconciliation";
  if (!d.flux_ks && !d.flux_hr) return Unavailable({ title, source: "Kubernetes API · kustomizations, helmreleases", d });
  const t = fluxTotals(d);
  const state = t.failed ? "bad" : t.unknown ? "warn" : t.progressing ? "none" : "ok";
  const label = t.failed ? t.failed + " failed" : t.unknown ? t.unknown + " unknown" : t.progressing ? t.progressing + " progressing" : "all ready";
  const pct = (n) => (t.total ? (n / t.total) * 100 : 0);
  const segments = [
    ["var(--ok)", t.ready, "ready"], ["var(--accent)", t.progressing, "progressing"], ["var(--bad)", t.failed, "failed"],
    ["var(--warn)", t.unknown, "unknown"], ["var(--suspend)", t.suspended, "suspended"],
  ];
  const problems = [...t.problems]
    .sort((a, b) => FLUX_ORDER[a.state] - FLUX_ORDER[b.state] || compare(`${a.namespace}/${a.name}`, `${b.namespace}/${b.name}`))
    .slice(0, MAX_ROWS);
  const hidden = t.failed + t.unknown + t.progressing - problems.length;
  return Panel({ title, state, text: label, d }, html`
    ${Bar({ label: `${t.ready} of ${t.total} ready`, parts: segments.map(([color, n]) => ({ pct: pct(n), color })) })}
    <div class="legend">${segments.map(([color, n, name]) => html`<span class=${n ? nothing : "muted"}><span class="dot" style="background: ${color}; opacity: ${n ? 1 : 0.35}"></span>${n} ${name}</span>`)}</div>
    ${problems.length > 0 ? Rows(problems.map((x) => ({ title: `${x.namespace}/${x.name}`, sub: x.message, right: Pill(FLUX_STATE_PILL[x.state] || "warn", x.state) }))) : nothing}
    ${hidden > 0 ? Muted(`and ${hidden} more not listed`) : nothing}
    ${!t.complete ? Muted("One of the two lists did not answer, so the counts are partial.") : nothing}`);
};

const PolarisPanel = (d) => {

const TrivyPanel = (d) => {

    <div class="legend">${TRIVY_SEVERITIES.map(([k, name, color]) => html`<span class=${c[k] ? nothing : "muted"}><span class="dot" style="background: ${color}; opacity: ${c[k] ? 1 : 0.35}"></span>${c[k]} ${name.toLowerCase()}</span>`)}</div>

const GIB = 2 ** 30;
const sizeText = (bytes) => (bytes >= 1024 * GIB ? (bytes / (1024 * GIB)).toFixed(1) + " TiB" : Math.round(bytes / GIB) + " GiB");
// A long name keeps its start and its end (the end tells volumes apart); the full name is the tooltip.
const middle = (text, max = 30) => (text.length > max ? text.slice(0, max - 13) + "…" + text.slice(-12) : text);
const UsedRow = (label, pct, detail) => html`<div class="limit-row"><span title=${label.length > 30 ? label : nothing}>${middle(label)}</span><span class="num"><strong>${Math.round(pct)}%</strong> ${detail}</span></div>${Bar({ label: `${label}, ${Math.round(pct)} percent`, parts: [{ pct, color: usedColor(pct, 85) }] })}`;

const VolumesPanel = (d) => {
  const title = "Volumes";
  if (!d.pvcs) return Unavailable({ title, source: "Prometheus · kubelet_volume_stats_*", d });
  const sizes = new Map((d.pvc_sizes || []).map((x) => [x.name, x.bytes]));
  const top = d.pvcs.slice().sort((a, b) => b.used_pct - a.used_pct || compare(a.name, b.name)).slice(0, 5);
  const max = top.length ? top[0].used_pct : 0;
  const mounted = d.pvc_count ?? top.length;
  const without = (d.pvc_total ?? mounted) - mounted;
  const state = usedState(max, 85);
  return Panel({ title, state, text: max >= 85 ? "volume over 85% full" : "volume over 75% full", compact: !top.length, d }, html`
    ${top.length ? html`<div class="limit">${top.map((n) => UsedRow(n.name, n.used_pct, sizes.has(n.name) ? html`<span class="muted">of ${sizeText(sizes.get(n.name))}</span>` : nothing))}</div>` : Muted("No volumes reported.")}
    ${Muted(`Fullest ${top.length} of ${mounted} mounted volumes${without > 0 ? `; ${without} more report no usage (not mounted now, or block-mode VM disks)` : ""}`)}`);
};

// Per node: /var (EPHEMERAL) and each LVM volume group, as used percentages with the free space. null when the sources did not answer.
function nodeRows(d) {
  if (!d.var_size || !d.var_avail || !d.vg_total || !d.vg_free) return null;
  const by = new Map();
  const row = (node, label, free, total) => {
    if (!(total > 0)) return;
    if (!by.has(node)) by.set(node, []);
    by.get(node).push({ label, pct: 100 * (1 - free / total), free, total });
  };
  const avail = new Map(d.var_avail.map((x) => [x.node, x.bytes]));
  for (const x of d.var_size) if (avail.has(x.node)) row(x.node, "Ephemeral /var", avail.get(x.node), x.bytes);
  const free = new Map(d.vg_free.map((x) => [x.node + "/" + x.name, x.bytes]));
  for (const x of d.vg_total) if (free.has(x.node + "/" + x.name)) row(x.node, x.name, free.get(x.node + "/" + x.name), x.bytes);
  return [...by].map(([node, rows]) => ({ node, rows, max: Math.max(...rows.map((r) => r.pct)) })).sort((a, b) => b.max - a.max || compare(a.node, b.node));
}

const NodesPanel = (d) => {
  const title = "Node disks";
  const nodes = nodeRows(d);
  if (!nodes) return Unavailable({ title, source: "Prometheus · node_filesystem_*, lvm_vg_*", d });
  const max = Math.max(0, ...nodes.map((n) => n.max));
  return Panel({ title, state: usedState(max, 85), text: max >= 85 ? "disk over 85% full" : "disk over 75% full", d }, html`
    ${nodes.map((n) => html`<div class="vm">
      <div class="vm-head"><strong class="row-st" data-st=${usedState(n.max, 85)}>${n.node}</strong></div>
      <div class="limit" style="margin-top: 8px">${n.rows.map((r) => UsedRow(r.label, r.pct, html`<span class="muted">· ${sizeText(r.free)} free${r.label === "Ephemeral /var" ? "" : " of " + sizeText(r.total)}</span>`))}</div>
    </div>`)}
    ${Muted("Volume groups show allocated space (the sum of the PVC sizes), not data written.")}`);
};

const RenovateRunsPanel = (d) => {
  const title = "Renovate runs";
  if (!d.renovate) return Unavailable({ title, source: "Kubernetes API · renovateprojects", d });
  const ps = d.renovate.projects;
  const approval = ps.reduce((n, x) => n + x.needs_approval, 0);
  const failed = ps.filter(isFailed).length;
  // Headline: time to the next scheduled run, like the other panels' big number.
  const jobs = d.renovate_jobs || [];
  const live = jobs.filter((j) => !j.suspend);
  const nexts = live.map((j) => cronNext(j.schedule)).filter(Boolean);
  const next = nexts.length ? Math.min(...nexts) : 0;
  const showHeadline = jobs.length > 0 && (next > 0 || live.length === 0);
  return Panel({ title, state: failed ? "bad" : approval ? "warn" : "ok", text: failed ? failed + " failed" : approval ? approval + " need approval" : "all done", d }, html`
    ${showHeadline ? html`<div class="num" style="margin-bottom: 10px" title=${next ? "Schedule (UTC): " + live.map((j) => j.schedule).join(", ") : nothing}>${next ? html`Next run in <strong>${until(Math.round((next - Date.now()) / 1000))}</strong>` : Muted("No run is scheduled")}</div>` : nothing}
    <ul class="rows">${ps.map((x) => {
      const bits = [
        x.duration && "took " + x.duration,
        x.needs_approval && x.needs_approval + " need approval",
        x.automerged && x.automerged + " automerged",
        x.unchanged && x.unchanged + " unchanged",
      ].filter(Boolean);
      const lastRun = Date.parse(x.last_transition);
      // The Dependency Dashboard issue of the repo, found by search because the issue number is not in the data.
      const repo = "https://github.com/cthtrifork/" + encodeURIComponent(x.project);
      return html`<li>
        <span class="l"><a href=${repo} rel="noopener noreferrer" target="_blank">${x.project}</a><br />${Muted(bits.join(" · ") || "no changes")}</span>
        <span class="run-st">${Pill(isFailed(x) ? "bad" : x.status === "completed" ? "ok" : "warn", x.status)}${lastRun > 0 ? html`<span class="muted num">${ago(secondsSince(lastRun))} ago</span>` : nothing}</span>
      </li>`;
    })}</ul>`);
};

const VM_NAMES = { "claude-vm": "Claude VM", homeserver: "Home server" };
// One VM as on the Update VMs page: a name with its health, then Running / Staged / Latest, each a value with its digest below.
const VmBlock = ({ name, state, health, running, digest, staged, latest }) => html`<div class="vm">
  <div class="vm-head"><strong class="row-st" data-st=${state}>${name}</strong>${Muted(health)}</div>
  <dl>
    <dt>Running</dt><dd>${running}${digest ? html` <span class="mono">${digest}</span>` : nothing}</dd>
    ${staged ? html`<dt>Staged</dt><dd>${staged}</dd>` : nothing}
    <dt>Latest</dt><dd class=${latest.cls ?? nothing}>${latest.text}</dd>
  </dl>
</div>`;
const VersionsPanel = (d) => {
  const title = "Running versions";
  const vms = d.vm_upgrade?.vms;
  if (!vms) return Unavailable({ title, source: "claude-vm-upgrade · /api/v1/status", d });
  const now = d.vm_upgrade.now || Math.round(Date.now() / 1000);
  let worst = "ok";
  let label = "reporting";
  const blocks = ["claude-vm", "homeserver"].map((name) => {
    const x = vms[name] || {};
    const vm = x.vm || {};
    const age = x.last_poll_at ? now - x.last_poll_at : null;
    const latest = d.vm_images?.[name]?.digest;
    const behind = latest && vm.booted_digest && latest !== vm.booted_digest && !vm.staged_version;
    const state = age === null || age > STALE_AFTER ? "bad" : vm.staged_version || behind ? "warn" : "ok";
    if (state === "bad") { worst = "bad"; label = "not responding"; }
    else if (state === "warn" && worst !== "bad") { worst = "warn"; label = vm.staged_version ? "Reboot pending" : "Update available"; }
    const health = age === null ? "has not reported" : age > STALE_AFTER ? `last poll ${ago(age)} ago` : `polled ${ago(age)} ago`;
    return {
      name: VM_NAMES[name] || name,
      state,
      health,
      running: vm.booted_version || "unknown",
      digest: vm.booted_digest?.slice(0, 12),
      staged: vm.staged_version,
      latest: !latest ? { text: "unknown" } : behind ? { text: "Newer image", cls: "warn" } : { text: "Up to date", cls: "ok" },
    };
  });
  return Panel({ title, state: worst, text: label, d }, html`
    ${blocks.map(VmBlock)}
    ${!d.vm_images ? Muted("The registry did not answer, so newer images are not shown.") : nothing}`);
};

// The usage: a bar for the window closer to its limit, the other as a line.
const UsageBlock = (b, now) => {
  const notes = [`Updated ${ago(b.age)} ago`];
  return html`<div class="limit">${b.windows.map((w, i) => {
      const suffix = w.resets_at && !w.over ? " · resets in " + until(w.resets_at - now) : w.over ? " · window has reset" : "";
      return html`<div class=${i === b.main ? "limit-row" : "limit-row muted"}>
          <span>${w.name}</span>
          <span class="num">${w.used === null ? "no data" : html`<strong>${w.used}%</strong>${" used" + suffix}`}</span>
        </div>${i === b.main ? Bar({ label: `${w.name}, ${w.used === null ? "no data" : w.used + " percent used"}`, parts: w.used === null ? [] : [{ pct: w.used, color: usedColor(w.used, 90) }] }) : nothing}`;
    })}</div>
    ${Muted(notes.join(" · ") + (b.stale ? ". Older than 6 hours, so the poller may be failing." : ""))}`;
};
const UsagePanel = (d) => {
  const title = "Claude usage";
  if (!d.usage) return Unavailable({ title, source: "usage-poller → cockpit", d });
  const s = usageSession(d);
  if (!s) {
    return Panel({ title, state: "none", text: "no data", d }, Muted("Nothing received in the last 24 hours. The usage-poller container of claude-rc sends it every 5 minutes."));
  }
  const now = Math.round(Date.now() / 1000);
  const b = usageBlock(s, now);
  return Panel({ title, state: b.stale ? "none" : usedState(b.worst, 90), text: b.stale ? "stale" : `peak ${b.worst}%`, d }, UsageBlock(b, now));
};

const SHARE_URL_MAX = 50; // longest URL shown in the panel; the approval page has the full one
const SHARE_STATE ={ pending: "warn", approved: "ok", rejected: "none", failed: "bad", fetching: "none" };
const SharePanel = (d) => {
  const title = "Share URLs";
  const x = d.urlshare;
  if (!x) return Unavailable({ title, source: "claude-urlshare · /api/v1/requests", d });
  const hidden = x.total - x.items.length;
  const summary = [x.approved && `${x.approved} approved`, x.rejected && `${x.rejected} rejected`, x.failed && `${x.failed} failed`].filter(Boolean).join(" · ");
  return Panel({ title, state: x.pending ? "warn" : "ok", text: `${x.pending} waiting`, compact: x.total === 0, d }, html`
    ${x.total === 0
      ? Muted("No requests in the last 24 hours.")
      : html`<div class="big num">${x.pending}<small> waiting for approval</small></div>
        ${Rows(x.items.map((r) => ({
          title: r.url.length > SHARE_URL_MAX ? r.url.slice(0, SHARE_URL_MAX - 1) + "…" : r.url,
          sub: r.error || undefined,
          right: Pill(SHARE_STATE[r.status] || "none", r.status),
        })))}
        ${hidden > 0 ? Muted(`and ${hidden} more not listed`) : nothing}
        ${summary ? Muted(summary + " in the last 24 hours") : nothing}`}`);
};

// Grants that have not expired yet. An expired one leaves its ServiceAccount behind until the next grant, but its token is dead.
const activeGrants = (d) => d.elevate?.grants.filter((g) => Date.parse(g.expires_at) > Date.now());
const ElevatePanel = (d) => {
  const title = "Elevate Claude";
  const live = activeGrants(d);
  if (!live) return Unavailable({ title, source: "claude-elevate · /api/v1/status", d });
  live.sort((a, b) => Date.parse(a.expires_at) - Date.parse(b.expires_at));
  const hidden = live.length - MAX_ROWS;
  return Panel({ title, state: live.length ? "warn" : "ok", text: live.length ? `${live.length} active` : "none active", compact: live.length === 0, d }, html`
    ${live.length === 0
      ? Muted("Claude has no extra rights.")
      : html`<div class="big num">${live.length}<small> ${live.length === 1 ? "elevation" : "elevations"} active</small></div>
        ${Rows(live.slice(0, MAX_ROWS).map((g) => ({
          title: `${g.tier} · ${g.namespace}`,
          sub: `expires in ${until(Math.round((Date.parse(g.expires_at) - Date.now()) / 1000))}`,
          right: Pill("warn", g.tier),
        })))}
        ${hidden > 0 ? Muted(`and ${hidden} more not listed`) : nothing}`}`);
};

// The CronJobs the Run jobs page lists, soonest next run first; suspended ones last. The pill says what is running, else when the next run is.
const JobsPanel = (d) => {
  const title = "Scheduled jobs";
  if (!d.jobs) return Unavailable({ title, source: "claude-jobs · /api/v1/status", d });
  const jobs = d.jobs.cronjobs
    .map((j) => ({ ...j, next: j.suspended ? null : cronNext(j.schedule, j.time_zone || "UTC") }))
    .sort((a, b) => (a.next ?? Infinity) - (b.next ?? Infinity) || compare(a.namespace + a.name, b.namespace + b.name));
  const hidden = jobs.length - MAX_ROWS;
  const running = jobs.filter((j) => j.running).length;
  const soonest = jobs.find((j) => j.next);
  const text = running ? `${running} running` : soonest ? `next in ${until((soonest.next - Date.now()) / 1000)}` : "none scheduled";
  return Panel({ title, state: running ? "warn" : "none", text, compact: jobs.length === 0, d }, jobs.length === 0
    ? Muted("No namespace allows running jobs.")
    : html`${Rows(jobs.slice(0, MAX_ROWS).map((j) => ({
        title: j.name,
        sub: [j.namespace, j.suspended ? "suspended" : j.next ? `next in ${until((j.next - Date.now()) / 1000)}` : null, cronWords(j.schedule)].filter(Boolean).join(" · "),
        right: j.running ? Pill("warn", "running") : nothing,
      })))}
      ${hidden > 0 ? Muted(`and ${hidden} more on the Run jobs page`) : nothing}`);
};

// ---- The page ----

const Chip = ({ state, text, href }) =>
  href ? html`<a class=${"pill " + state} href=${"#" + href}>${text}</a>` : html`<span class=${"pill " + state}>${text}</span>`;

const Strip = (d, hardwareWarning, environmentWarning) => {
  const shown = stripChips(d, hardwareWarning, environmentWarning).filter((c) => c.state !== "ok");
  // Healthy chips stay hidden; "All healthy" only keeps the strip from being empty when nothing needs a look.
  return html`<nav class="strip" aria-label="Overall status, each item jumps to its panel">${shown.length ? shown.map(Chip) : Chip({ state: "ok", text: "All healthy" })}</nav>`;
};

// `columns` is a list of lists of panels, one list per column.
const Section = ({ id, title, layout = "cols" }, columns) => html`<section aria-labelledby=${"h-" + id}>
  <h2 id=${"h-" + id}>${title}</h2>
  <div class=${layout} style=${"--n: " + columns.length}>${columns.map((panels) => html`<div class="col">${panels}</div>`)}</div>
</section>`;

// Rack positions and hardware are from the Talos patches and docs/hardware.md. RAM is shown as installed capacity.
const MACHINES = [
  {
    rack: "rack-0", node: "talos-11a-esj", nickname: "elaphant", model: "ASUS NUC15CRHC3",
    cpus: 8, ram: "64 GB", storage: "1 TB + 256 GB NVMe · 4 TB USB",
  },
  {
    rack: "rack-1", node: "talos-vt2-qp8", nickname: "hackyourfuture", model: "Intel NUC NUC11ATKC2",
    cpus: 2, ram: "32 GB", storage: "512 GB NVMe · 4 TB USB",
  },
  {
    rack: "rack-2", node: "talos-tba-msi", nickname: "nosticker", model: "Lenovo ThinkCentre M900x", thin: true,
    cpus: 4, ram: "16 GB", storage: "1 TB NVMe · 256 GB SATA",
  },
  {
    rack: "rack-3", node: "talos-2jc-qux", nickname: "chainguard", model: "Lenovo ThinkCentre M900x", thin: true,
    cpus: 4, ram: "32 GB", storage: "1 TB NVMe · 256 GB SATA",
  },
].sort((a, b) => compare(a.rack, b.rack));

const Machines = () => html`<section aria-labelledby="h-machines">
  <h2 id="h-machines">Machines</h2>
  <ol class="machine-rack" role="list">
    ${MACHINES.map(({ rack, node, nickname, model, thin, cpus, ram, storage }) => html`<li class="machine">
      <div class="machine-slot">
        <span class=${thin ? "machine-icon thin" : "machine-icon"} aria-hidden="true"></span>
        <span class="mono">${rack}</span>
      </div>
      <div class="machine-name"><strong>${nickname}</strong><span class="mono">${node}</span></div>
      <div class="machine-specs">
        <strong>${cpus} CPUs · ${ram} RAM</strong>
        <span>${model}</span>
      </div>
      <span class="machine-storage">${storage}</span>
    </li>`)}
  </ol>
</section>`;

// ---- The page: an element that renders into itself (no shadow root), so the page's stylesheet applies ----
// Assigning to d, loadedAt or error re-renders it; nothing calls a render by hand.

class CockpitApp extends LitElement {
  static properties = { d: { state: true }, loadedAt: { state: true }, error: { state: true }, pendingHardwareWindow: { state: true } };
  constructor() {
    super();
    this.d = null;
    this.loadedAt = 0;
    this.error = null;
    this._inflight = null;
    // A hidden tab does not poll; coming back refreshes at once if the data is older than the interval.
    this._onVisible = () => { if (!document.hidden && Date.now() - this.loadedAt >= REFRESH_MS) this.load(); };
    // One request at a time: a refresh while one is in flight, or one that hangs, replaces it instead of stacking up.
    this.load = async () => {
      this._inflight?.abort();
      const ctl = (this._inflight = new AbortController());
      const requestedWindow = hardwareWindow();
      this.pendingHardwareWindow = this.d && this.d.hardware_window !== requestedWindow ? requestedWindow : null;
      const timer = setTimeout(() => ctl.abort(), 20000);
      try {
        const r = await fetch("api/v1/status?drops=" + dropsWindow() + "&hardware=" + requestedWindow, { signal: ctl.signal });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        if (this._inflight !== ctl) return;
        this.d = d;
        this.loadedAt = Date.now();
        this.error = null;
      } catch (e) {
        if (this._inflight === ctl) this.error = e.name === "AbortError" ? "timed out" : e.message; // not superseded by a newer request
      } finally {
        clearTimeout(timer);
        if (this._inflight === ctl) {
          this._inflight = null;
          this.pendingHardwareWindow = null;
        }
      }
    };
    // A Home Screen app has no reload button, so a pull down from the top of the page refreshes (the browser's own gesture is not there).
    // The page itself does the rubber band; this only notices a long pull that started at the very top.
    let y0 = null;
    this._onTouchStart = (e) => { y0 = window.scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; };
    this._onTouchEnd = (e) => {
      if (y0 !== null && window.scrollY <= 0 && e.changedTouches[0].clientY - y0 > PULL_PX) this.load();
      y0 = null;
    };
  }
  createRenderRoot() { return this; }
  setDrops(v) { localStorage.setItem("cockpit.drops", v); this.load(); }
  setHardwareWindow(v) { localStorage.setItem("cockpit.hardware", v); this.load(); }
  connectedCallback() {
    super.connectedCallback();
    this._poll = setInterval(() => { if (!document.hidden) this.load(); }, REFRESH_MS);
    document.addEventListener("visibilitychange", this._onVisible);
    // Coming back to a Home Screen app from the app switcher can restore the page from memory without a visibilitychange.
    window.addEventListener("pageshow", this._onVisible);
    document.addEventListener("touchstart", this._onTouchStart, { passive: true });
    document.addEventListener("touchend", this._onTouchEnd, { passive: true });
    this.load();
  }
  disconnectedCallback() {
    clearInterval(this._poll);
    document.removeEventListener("visibilitychange", this._onVisible);
    window.removeEventListener("pageshow", this._onVisible);
    document.removeEventListener("touchstart", this._onTouchStart);
    document.removeEventListener("touchend", this._onTouchEnd);
    this._inflight?.abort();
    super.disconnectedCallback();
  }
  render() {
    const { d, loadedAt, error } = this;
    const hardware = d ? hardwareRows(d) : [];
    const hardwareWarning = hardwareWarnings(hardware, d?.hardware_window || "24h");
    const environment = d ? ambientRows(d) : [];
    const environmentWarning = environmentWarnings(environment, d?.hardware_window || "24h");
    // One history window for both temperature panels: its buttons sit at the top of the first of them that has data.
    const toggle = d ? WindowToggle(d, this.pendingHardwareWindow, (v) => this.setHardwareWindow(v)) : null;
    const failedSources = Object.keys(d?.meta?.workflow?.failed || {});
    const banner = error
      ? `The cockpit could not be reached (${error}). Showing the last data, if any.`
      : failedSources.length ? `Some sources did not answer: ${failedSources.join(", ")}.` : "";
    // The time shown is when the data was last good, so a failed refresh cannot look current.
    const updated = error
      ? html`<span class="pill warn" id="updated">${loadedAt ? "Stale, data from " + new Date(loadedAt).toLocaleTimeString([], { timeStyle: "short" }) : "No data yet"}</span>`
      : html`<span class="muted" id="updated">${d ? "Updated " + new Date(loadedAt).toLocaleTimeString([], { timeStyle: "short" }) : "Loading…"}</span>`;
    // Nothing below the header is shown until the first data arrives (see `main:not(.ready)`): content that appears after the fetch
    // would push the page down.
    return html`<main class=${d ? "ready" : nothing}>
      <header>
        <h1>Cockpit</h1>
        <div class="hdr-r">${updated}<button type="button" id="refresh" @click=${this.load}>Refresh</button></div>
      </header>
      <div id="banner" class="banner bad" role="alert" ?hidden=${!banner}>${banner}</div>
      ${d ? html`${Strip(d, hardwareWarning, environmentWarning)}
        ${Section({ id: "home", title: "Homelab" }, [
          [SharePanel(d)],
          [VersionsPanel(d), UsagePanel(d)],
          [JobsPanel(d), ElevatePanel(d)],
        ])}
        ${Section({ id: "cluster", title: "Cluster" }, [
          [AlertsPanel(d), FluxPanel(d), PolarisPanel(d)],
          [DropsPanel(d), VolumesPanel(d)],
          [TrivyPanel(d)],
        ])}
        ${Section({ id: "hardware", title: "Cluster hardware", layout: "cols hardware-band" }, [
          [ComputePanel(d), EnvironmentPanel(d, environment, environmentWarning, d.ambient_temperatures ? toggle : null)],
          [NodesPanel(d)],
          [HardwarePanel(d, hardware, hardwareWarning, d.ambient_temperatures ? null : toggle)],
        ])}
        ${Machines()}
        ${Section({ id: "gh", title: "GitHub" }, [
          [PrsPanel(d), RenovatePrsPanel(d)],
          [IssuesPanel(d), RenovateRunsPanel(d)],
        ])}` : nothing}
    </main>`;
  }
}
customElements.define("cockpit-app", CockpitApp);
</script>
</body>
</html>
