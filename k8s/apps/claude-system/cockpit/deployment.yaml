---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-cockpit
  namespace: claude-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-cockpit
  template:
    metadata:
      labels:
        app: claude-cockpit
    spec:
      serviceAccountName: claude-cockpit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: mirror.gcr.io/redpandadata/connect:4.118.0@sha256:2c6dd2fe757eaa588eeee90376ec2220a5d1731940d71a2005d8b249296dd2be # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          ports:
            - name: http
              containerPort: 8080
            - name: ingest
              containerPort: 8081
            - name: metrics
              containerPort: 4195
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          livenessProbe:
            httpGet:
              path: /ping
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/connect
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: github-token
              mountPath: /etc/github
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: claude-cockpit-connect-config
        - name: github-token
          secret:
            secretName: claude-cockpit-github-token # minted by externalsecret.yaml
            optional: true
            defaultMode: 0440
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
