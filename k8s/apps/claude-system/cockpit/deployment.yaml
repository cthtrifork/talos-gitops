---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-cockpit
  namespace: claude-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: claude-cockpit
  template:
    metadata:
      labels:
        app: claude-cockpit
      annotations:
        trust.portableinfo.cloud/public: "true" # api.github.com, ghcr.io
        configmap.reloader.stakater.com/reload: portableinfo-ca-bundle
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: claude-cockpit
      serviceAccountName: claude-cockpit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: mirror.gcr.io/redpandadata/connect:4.120.0@sha256:d67bef65bace98c1a1ac7ea693836f8d79a28062d2d892eb1417a92da66d6caf # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          env:
            # The GitHub App Renovate runs as; the page filters its pull requests by it (author:app/<name>).
            - name: RENOVATE_APP
              value: renovatebot-private
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 4195
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          livenessProbe:
            httpGet:
              path: /ping
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/connect
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: github-token
              mountPath: /etc/github
              readOnly: true
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: claude-cockpit-connect-config
        - name: registry-auth
          secret:
            secretName: ghcr-pull # the runner's read:packages token; homeserver-bootc is a private package
            optional: true
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: github-token
          secret:
            secretName: claude-cockpit-github-token # minted by externalsecret.yaml
            optional: true
            defaultMode: 0440
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
