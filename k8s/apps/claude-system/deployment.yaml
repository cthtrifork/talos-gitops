# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# Claude Code Remote Control, signed in as a person. The login lives on the home PVC; the pod idles until one exists (README.md).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-rc
  namespace: claude-system
  annotations:
    # only this Secret, not `auto`: the GitHub token Secret refreshes every 30 minutes and a restart ends the session
    secret.reloader.stakater.com/reload: dependency-track-claude-api-key
    # no configmap reload either: a restart ends the session, so a bundle change waits for a deliberate one (policy require-trust-bundle-reload)
    trust.portableinfo.cloud/reload: "false"
spec:
  replicas: 1
  strategy:
    type: Recreate # the PVC is ReadWriteOnce, and one login must not run twice
  selector:
    matchLabels:
      app: claude-rc
  template:
    metadata:
      labels:
        app: claude-rc
      annotations:
        # one-time roll so the pod reads dependency-track-claude-api-key, which the config CronJob created after the pod started
        dt-key-rev: "1"
        trust.portableinfo.cloud/public: "true" # api.anthropic.com, github.com, the package registries
    spec:
      serviceAccountName: claude
      terminationGracePeriodSeconds: 30
      dnsConfig:
        options:
          - name: ndots # external names (api.anthropic.com) otherwise try 4 cluster search suffixes through the FQDN DNS proxy first
            value: "1"
      hostname: claude-k8s-helper # stable device name in claude.ai/code instead of the generated pod name
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Claude refuses to bind its messaging socket under a shared directory, and an emptyDir is 0777 (emptyDir.mode is alpha until 1.37),
      # so /tmp is a 0700 subdirectory of the workspace PVC made by this init container.
      initContainers:
        - name: private-tmp
          # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/claude-runner versioning=semver
          image: ghcr.io/cthtrifork/talos-gitops/claude-runner:2.1.332-20261126.101@sha256:3e835be3e6458b6e65fbbaeda69ac3c042d5ec720ac53024c0dd97b5992ccb6e
          command:
            - "/bin/bash"
            - "-c"
            - "rm -rf /mnt/workspace/.tmp && mkdir -m 0700 /mnt/workspace/.tmp"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: workspace
              mountPath: /mnt/workspace
      containers:
        - name: claude
          # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/claude-runner versioning=semver
          image: ghcr.io/cthtrifork/talos-gitops/claude-runner:2.1.332-20261126.101@sha256:3e835be3e6458b6e65fbbaeda69ac3c042d5ec720ac53024c0dd97b5992ccb6e
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              # a symlink, not a subPath mount, which would create root-owned directories inside the PVC
              mkdir -p "$HOME/.claude" && ln -sfn /etc/claude-md/CLAUDE.md "$HOME/.claude/CLAUDE.md"
              # copied, not linked: Claude Code also writes to ~/.claude/skills. The */ glob skips the ConfigMap's ..data directories.
              mkdir -p "$HOME/.claude/skills"
              cp -rfL /etc/claude-skills/*/ "$HOME/.claude/skills/"
              until [ -s "$HOME/.claude/.credentials.json" ]; do
                echo "not logged in: kubectl -n claude-system exec -it deploy/claude-rc -- claude"
                sleep 30
              done
              # MCP servers are stored in ~/.claude.json on the PVC: remove first, `mcp add` fails if the name exists
              claude mcp remove --scope user flux >/dev/null 2>&1 || true
              claude mcp add --scope user flux -- flux-operator-mcp serve --read-only
              # The header stores the variable name (escaped for Flux postBuild), so the token stays out of ~/.claude.json
              claude mcp remove --scope user cloudflare >/dev/null 2>&1 || true
              if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
                claude mcp add --scope user --transport http cloudflare https://mcp.cloudflare.com/mcp \
                  --header 'Authorization: Bearer $${CLOUDFLARE_API_TOKEN}'
              fi
              if [ -n "$OMNI_SERVICE_ACCOUNT_KEY" ]; then
                mkdir -p "$(dirname "$TALOSCONFIG")"
                omnictl talosconfig --force "$TALOSCONFIG" \
                  || echo "omnictl talosconfig failed: talosctl is unavailable until the next start"
              fi
              exec claude remote-control --name homelab
          env:
            - name: DISABLE_AUTOUPDATER
              value: "1" # the binary is baked into the image
            - name: DISABLE_TELEMETRY
              value: "1" # no telemetry (Datadog) or error reporting: those hosts are not in the egress allowlist
            # OpenTelemetry metrics straight into Prometheus (README, "Usage telemetry")
            - name: CLAUDE_CODE_ENABLE_TELEMETRY
              value: "1"
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://kube-prom-prometheus.kube-prometheus-stack-system.svc:9090/api/v1/otlp
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: environment=claude-k8s-helper
            - name: OTEL_METRICS_INCLUDE_SESSION_ID
              value: "false" # a session_id label would start a new set of series per session
            - name: OTEL_METRICS_INCLUDE_ACCOUNT_UUID
              value: "false"
            - name: CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY
              value: "1" # no "How is Claude doing?" survey in a headless pod
            - name: CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL
              value: "1" # do not try to register the official plugin marketplace on start (host not in the egress allowlist)
            - name: DOCKER_CONFIG
              value: /etc/registry-auth # registry credentials for crane, from the optional Secret ghcr-pull
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-cloudflare # SOPS-encrypted (root readme.md), a Cloudflare API token with Read permissions only
                  key: CLOUDFLARE_API_TOKEN
                  optional: true
            - name: OMNI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: omni-service-account # SOPS-encrypted (root readme.md), an Omni service account with the Reader role
                  key: OMNI_ENDPOINT
                  optional: true
            - name: OMNI_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: omni-service-account
                  key: OMNI_SERVICE_ACCOUNT_KEY
                  optional: true
            - name: DT_URL
              value: http://dependency-track-api-server.dependency-track-system.svc:8080
            - name: DT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dependency-track-claude-api-key # created by the dependency-track-config CronJob (team claude-triage: view, read and write analysis; no BOM upload, no admin)
                  key: api-key
                  optional: true
            - name: TALOSCONFIG
              value: /home/claude/.talos/config
            - name: CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX
              value: claude-k8s-helper
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: home
              mountPath: /home/claude
            - name: github-token
              mountPath: /etc/github
              readOnly: true
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
            - name: claude-md
              mountPath: /etc/claude-md
              readOnly: true
            - name: claude-skills
              mountPath: /etc/claude-skills
              readOnly: true
            - name: elevated
              mountPath: /etc/elevated
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: workspace
              mountPath: /tmp
              subPath: .tmp # private-tmp init container
        # Feeds the cockpit's usage panel: `claude remote-control` never runs a statusLine, so this polls the undocumented usage endpoint
        - name: usage-poller
          # renovate: datasource=docker depName=ghcr.io/cthtrifork/talos-gitops/claude-runner versioning=semver
          image: ghcr.io/cthtrifork/talos-gitops/claude-runner:2.1.332-20261126.101@sha256:3e835be3e6458b6e65fbbaeda69ac3c042d5ec720ac53024c0dd97b5992ccb6e
          command:
            - "/etc/claude-usage-poller/poll-usage"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: home
              mountPath: /home/claude
              readOnly: true
            - name: claude-usage-poller
              mountPath: /etc/claude-usage-poller
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-home-lvm
        - name: github-token
          secret:
            secretName: claude-github-token # minted by externalsecret.yaml
            optional: true
            defaultMode: 0400
        - name: registry-auth
          secret:
            secretName: ghcr-pull # SOPS-encrypted (root readme.md), type kubernetes.io/dockerconfigjson, a token with only read:packages
            optional: true
            defaultMode: 0400
            items:
              - key: .dockerconfigjson
                path: config.json # the file crane, skopeo and docker read from $DOCKER_CONFIG
        - name: elevated
          secret:
            secretName: claude-elevated-kubeconfigs # filled by the elevate page; a volume (not env) so the files update without a restart
            defaultMode: 0444
            optional: true
        - name: claude-md
          configMap:
            name: claude-md # generated by kustomization.yaml; the name hash rolls the pod on change
        - name: claude-usage-poller
          configMap:
            name: claude-usage-poller # generated by kustomization.yaml; a script, so the mode must allow execution
            defaultMode: 0555
        - name: claude-skills
          configMap:
            name: claude-skills # generated by kustomization.yaml; keys cannot hold a slash, so items maps them to <name>/SKILL.md; a new skill goes in both lists
            items:
              - key: cluster-alerts.md
                path: cluster-alerts/SKILL.md
              - key: cilium-drops.md
                path: cilium-drops/SKILL.md
              - key: cluster-disk-usage.md
                path: cluster-disk-usage/SKILL.md
              - key: polaris-report.md
                path: polaris-report/SKILL.md
              - key: image-inspect.md
                path: image-inspect/SKILL.md
              - key: bandwidth-test.md
                path: bandwidth-test/SKILL.md
              - key: ci-k8s-reference.md
                path: ci-k8s-reference/SKILL.md
              - key: urlshare.md
                path: urlshare/SKILL.md
              - key: dependency-track.md
                path: dependency-track/SKILL.md
              - key: govulncheck.md
                path: govulncheck/SKILL.md
              - key: svg-to-png.md
                path: svg-to-png/SKILL.md
        # 50Gi lvm-fast, expandable online: clean up old clones
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-workspace-lvm
