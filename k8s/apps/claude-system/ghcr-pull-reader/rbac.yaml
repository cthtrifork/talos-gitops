# The service account the ClusterSecretStore claude-vm-ghcr uses to read the read:packages token (Secret ghcr-pull) for the claude-vm
# namespace. It may read that one Secret only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-pull-reader
  namespace: claude-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-pull-reader
  namespace: claude-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - ghcr-pull
    verbs:
      - get
  # the store checks its own permissions when it is created
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-pull-reader
  namespace: claude-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ghcr-pull-reader
subjects:
  - kind: ServiceAccount
    name: ghcr-pull-reader
    namespace: claude-system
