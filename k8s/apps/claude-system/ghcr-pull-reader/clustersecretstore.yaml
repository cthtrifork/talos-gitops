# Lets External Secrets copy the read:packages token (Secret ghcr-pull) into the claude-vm namespace for CDI: only that namespace may
# use this store, and the service account behind it (rbac.yaml) can read only that Secret.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: claude-vm-ghcr
spec:
  conditions:
    - namespaces:
        - claude-vm
  provider:
    kubernetes:
      remoteNamespace: claude-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: claude-system
          key: ca.crt
      auth:
        serviceAccount:
          name: ghcr-pull-reader
          namespace: claude-system
