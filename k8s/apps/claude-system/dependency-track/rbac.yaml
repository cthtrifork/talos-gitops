---
# The claude-triage key goes to the namespace of the pod that uses it: create once, check that it exists, never read it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dependency-track-config
  namespace: claude-system
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "dependency-track-claude-api-key"
    verbs:
      - "get"
      - "update"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dependency-track-config
  namespace: claude-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dependency-track-config
subjects:
  - kind: ServiceAccount
    name: dependency-track-config
    namespace: security-system
