# The poll tokens are generated in the cluster store (k8s/infra/secret-store/). Cilium reads them from cilium-secrets and
# injects them into each VM's requests; the listener reads the same values. A Cilium secret holds exactly one key.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-vm-upgrade-token
  namespace: cilium-secrets
  labels:
    app.kubernetes.io/part-of: claude-vm-upgrade
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: claude-vm-upgrade-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: claude-vm-upgrade-token
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeserver-vm-upgrade-token
  namespace: cilium-secrets
  labels:
    app.kubernetes.io/part-of: claude-vm-upgrade
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: homeserver-vm-upgrade-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: homeserver-vm-upgrade-token
        property: token
---
# the listener's copy, keyed by the VM name in the poll path
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vm-upgrade-tokens
  namespace: claude-system
  labels:
    app.kubernetes.io/part-of: claude-vm-upgrade
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: vm-upgrade-tokens
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: claude-vm
      remoteRef:
        key: claude-vm-upgrade-token
        property: token
    - secretKey: homeserver
      remoteRef:
        key: homeserver-vm-upgrade-token
        property: token
