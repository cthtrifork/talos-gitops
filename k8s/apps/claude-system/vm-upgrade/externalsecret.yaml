# The poll tokens are generated in the cluster store (k8s/infra/secret-store/). The listener reads them here; each VM gets
# its own token from an ExternalSecret in its namespace (k8s/virtualmachines/*/externalsecret.yaml), shared over virtiofs.
---
# the listener's copy, keyed by the VM name in the poll path
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vm-upgrade-tokens
  namespace: claude-system
  labels:
    app.kubernetes.io/part-of: claude-vm-upgrade
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: vm-upgrade-tokens
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: claude-vm
      remoteRef:
        key: claude-vm-upgrade-token
        property: token
    - secretKey: homeserver
      remoteRef:
        key: homeserver-vm-upgrade-token
        property: token
