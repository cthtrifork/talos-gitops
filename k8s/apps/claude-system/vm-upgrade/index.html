<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update VMs</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23c4623f'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='4' y='5' width='16' height='11' rx='2'/%3E%3Cpath d='M9 20h6M12 16v4'/%3E%3Cpath d='M12 13V8.5M10 10.5l2-2 2 2'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f4f1; --card: #ffffff; --ink: #141413; --ink-2: #4a4843; --line: #e3e2da;
    --accent: #1f63b5; --on-accent: #ffffff; --ok: #1a7f4b; --warn: #8a5a00; --bad: #b3261e;
    --warn-bg: #fff4d6; --danger: #c0392b;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Shared with the cockpit: the type scale is small (labels, metadata), medium (body), large (titles), extra large (page title, headline numbers). */
    --fs-sm: 12px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --card: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --line: #2c2c2a;
      --accent: #3987e5; --ok: #3cc58a; --warn: #f2d98a; --bad: #ff8a80; --warn-bg: #3a2f10; --danger: #ef6a5b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: var(--fs-lg)/1.5 var(--font);
         padding: 24px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: flex; justify-content: center; }
  main { width: 100%; max-width: 1000px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .head h2 { margin: 0; }
  .badge { font-size: var(--fs-md); font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--warn); background: var(--warn-bg); white-space: nowrap; }
  .banner { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: var(--fs-md); }
  .banner:empty { display: none; }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 2px; color: var(--accent); font-size: var(--fs-md); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  h1 { font-size: var(--fs-xl); margin: 0 0 2px; }
  h2 { font-size: var(--fs-lg); margin: 0 0 12px; }
  .sub { margin: 0 0 16px; color: var(--ink-2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .health { display: flex; align-items: center; gap: 10px; font-weight: 600; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-2); flex: none; }
  .health.ok .dot { background: var(--ok); }
  .health.stale .dot { background: var(--bad); }
  .health.behind .dot { background: var(--warn); }
  .health small { font-weight: 400; font-size: var(--fs-md); color: var(--ink-2); margin-left: auto; }
  dl { display: grid; grid-template-columns: 5.5em 1fr; gap: 14px 12px; margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
  dt { color: var(--ink-2); font-size: var(--fs-md); padding-top: 1px; }
  dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dd .mono { display: block; font-weight: 400; color: var(--ink-2); }
  dd.behind { color: var(--warn); }
  dd.current { color: var(--ok); }
  .mono { font-family: var(--mono); font-size: var(--fs-md); }
  .note { display: block; font-size: var(--fs-md); font-weight: 400; color: var(--warn); }
  .actions { margin-top: 18px; }
  button { font: inherit; font-weight: 600; width: 100%; min-height: 48px; padding: 12px 20px; border: 0; border-radius: 10px;
           background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  button.danger { background: var(--danger); }
  button.quiet { background: none; color: var(--accent); border: 1px solid var(--line); }
  button.quiet:hover { border-color: var(--accent); }
  .link { background: none; color: var(--ink-2); font-weight: 400; min-height: 40px; margin-top: 4px; text-decoration: underline; }
  .confirm { margin: 0 0 12px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); font-size: var(--fs-md); }
  .hint { margin: 0 0 12px; font-size: var(--fs-md); color: var(--ink-2); }
  .hint:empty { display: none; }
  .hint.warn { color: var(--warn); }
  .flow { margin-top: 24px; }
  .flow h2 { margin-bottom: 8px; }
  .flow svg { width: 100%; height: auto; display: block; }
  .flow .grid line { stroke: var(--line); stroke-width: 1; }
  .flow .lane text { fill: var(--ink); font: 600 15px var(--font); }
  .flow .d, .flow .t text { fill: var(--ink-2); font: 400 13px var(--font); }
  .flow .b { fill: var(--on-accent); font: 600 14px var(--font); }
  .flow .dot { fill: var(--accent); }
  .flow .hold { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 4; }
  .flow .seg.a { fill: var(--accent); }
  .flow .seg.w { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.5; }
  .flow .b.w { fill: var(--warn); }
  .flow .ar { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="back" href="https://claudecockpit-portableinfo.workload.eu-central-1.omni.siderolabs.io/">← Cockpit</a>
  <h1>Update VMs</h1>
  <p class="sub">Runs <code>bootc upgrade --apply</code> on a VM. A VM that finds no new image does not reboot.</p>
  <p id="error" class="banner" role="status"></p>
  <div id="cards"></div>

  <section class="card flow" aria-labelledby="flow-title">
    <h2 id="flow-title">How long an update takes</h2>
    <svg viewBox="0 0 900 310" role="img" aria-label="Timeline. You click. The page holds the click for up to 10 minutes. The VM polls within 1 minute, downloads the image, and reboots if the image is new. The card shows the VM offline during the reboot and catches up within 5 minutes.">
      <g class="grid">
        <line x1="10" y1="62" x2="890" y2="62"/><line x1="10" y1="122" x2="890" y2="122"/><line x1="10" y1="182" x2="890" y2="182"/>
      </g>
      <g class="lane">
        <text x="10" y="40">You</text><text x="10" y="100">Page</text><text x="10" y="160">VM</text><text x="10" y="220">Card</text>
      </g>
      <circle class="dot" cx="120" cy="34" r="8"/>
      <text class="d" x="138" y="39">click</text>

      <rect class="hold" x="120" y="82" width="420" height="26" rx="13"/>
      <text class="d" x="140" y="100">click held, expires after 10 min</text>

      <rect class="seg a" x="120" y="142" width="80" height="26" rx="13"/>
      <text class="b" x="160" y="160" text-anchor="middle">poll</text>
      <rect class="seg a" x="204" y="142" width="216" height="26" rx="13"/>
      <text class="b" x="312" y="160" text-anchor="middle">download</text>
      <rect class="seg w" x="424" y="142" width="116" height="26" rx="13"/>
      <text class="b w" x="482" y="160" text-anchor="middle">reboot</text>

      <path class="ar" d="M160 108v26m-5-6l5 6 5-6"/>

      <rect class="seg w" x="424" y="202" width="116" height="26" rx="13"/>
      <text class="b w" x="482" y="220" text-anchor="middle">offline</text>
      <rect class="seg a" x="544" y="202" width="236" height="26" rx="13"/>
      <text class="b" x="662" y="220" text-anchor="middle">catches up</text>

      <g class="t">
        <text x="160" y="190" text-anchor="middle">≤ 1 min</text>
        <text x="312" y="190" text-anchor="middle">size-dependent</text>
        <text x="482" y="190" text-anchor="middle">a few min</text>
        <text x="482" y="250" text-anchor="middle">2.5 min+ shows offline</text>
        <text x="662" y="250" text-anchor="middle">≤ 5 min (cached registry)</text>
      </g>
      <text class="d" x="10" y="274">No new image: the VM stops after the download and does not reboot.</text>
      <text class="d" x="10" y="296">Button: once per VM per hour. Auto: Claude VM 03:00, Home server every 10 min.</text>
    </svg>
  </section>
</main>

<template id="card">
  <section class="card">
    <div class="head"><h2></h2><span class="badge" hidden></span></div>
    <div class="health"><span class="dot" aria-hidden="true"></span><span class="health-text">Checking…</span><small class="health-ago"></small></div>
    <dl>
      <dt>Running</dt><dd class="booted">…</dd>
      <dt>Staged</dt><dd class="staged">…</dd>
      <dt>Latest</dt><dd class="latest">…</dd>
    </dl>
    <div class="actions">
      <p class="hint" role="status" aria-live="polite"></p>
      <p class="confirm" hidden></p>
      <button type="button" class="go" disabled>Update now</button>
      <button type="button" class="link cancel" hidden>Cancel</button>
    </div>
  </section>
</template>

<script>
(function () {
  var STALE_AFTER = 150;   // seconds without a poll before a VM counts as not responding (the timers run every 60 s)
  var LABELS = { 'claude-vm': 'Claude VM', 'homeserver': 'Home server' };
  var cards = {};          // vm name -> { el, pending, online, confirming }

  function ago(t, now) {
    if (!t) return 'never';
    var s = Math.max(0, now - t);
    return s < 90 ? s + ' s ago' : Math.round(s / 60) + ' min ago';
  }

  function card(name) {
    if (cards[name]) return cards[name];
    var el = document.getElementById('card').content.firstElementChild.cloneNode(true);
    el.querySelector('h2').textContent = LABELS[name] || name;
    var c = { name: name, el: el, needs: false, pending: false, online: false, confirming: false,
              go: el.querySelector('.go'), cancel: el.querySelector('.cancel'), confirmBox: el.querySelector('.confirm'), hint: el.querySelector('.hint') };
    c.confirmBox.textContent = (LABELS[name] || name) + ' reboots if a new image exists, and anything running on it ends.';
    c.go.addEventListener('click', function () {
      if (!c.confirming) { c.confirming = true; c.hint.textContent = ''; render(c); return; }
      c.go.disabled = true;
      fetch('api/v1/vms/' + encodeURIComponent(name) + '/upgrade', { method: 'POST', headers: { 'X-Requested-With': 'vm-upgrade-button' } })
        .then(function (r) {
          c.confirming = false;
          c.hint.className = r.ok ? 'hint' : 'hint warn';
          c.hint.textContent = r.ok ? 'Queued.' : 'Failed (' + r.status + ').';
          refresh();
        })
        .catch(function () { c.confirming = false; c.hint.className = 'hint warn'; c.hint.textContent = 'Failed: could not reach the page.'; render(c); });
    });
    c.cancel.addEventListener('click', function () { c.confirming = false; render(c); });
    document.getElementById('cards').appendChild(el);
    cards[name] = c;
    return c;
  }

  function render(c) {
    c.cancel.hidden = !c.confirming;
    c.confirmBox.hidden = !c.confirming;
    c.go.classList.toggle('danger', c.confirming);
    c.go.classList.toggle('quiet', !c.confirming && !c.needs);
    if (c.pending) {
      c.go.disabled = true; c.go.textContent = 'Queued, waiting for the VM';
      c.hint.className = 'hint'; c.hint.textContent = 'The VM checks every minute; the request expires after 10 minutes.';
      return;
    }
    c.go.disabled = false; c.go.textContent = c.confirming ? 'Confirm update' : 'Update now';
    if (c.confirming) return;
    if (!c.online) { c.hint.className = 'hint warn'; c.hint.textContent = 'The VM has not polled recently: a request may expire before it is picked up.'; }
    else if (!/^(Queued|Failed)/.test(c.hint.textContent)) { c.hint.className = 'hint'; c.hint.textContent = ''; }
  }

  function update(c, s, now) {
    var vm = s.vm || {}, known = !!vm.booted_version, el = c.el;
    c.pending = s.pending;
    c.online = s.last_poll_at > 0 && now - s.last_poll_at < STALE_AFTER;
    el.querySelector('.health').className = 'health ' + (c.online ? 'ok' : 'stale');
    el.querySelector('.health-text').textContent = c.online ? 'VM online' : (s.last_poll_at ? 'VM not responding' : 'VM has not reported yet');
    el.querySelector('.health-ago').textContent = s.last_poll_at ? 'polled ' + ago(s.last_poll_at, now) : '';
    var booted = el.querySelector('.booted'), staged = el.querySelector('.staged');
    booted.textContent = known ? vm.booted_version : 'unknown';
    if (known) {
      var digest = document.createElement('span');
      digest.className = 'mono'; digest.textContent = ' ' + (vm.booted_digest || '').slice(0, 12);
      booted.appendChild(digest);
    }
    staged.textContent = !known ? 'unknown' : (vm.staged_version || 'none');
    if (known && vm.staged_version) {
      var note = document.createElement('span');
      note.className = 'note'; note.textContent = 'applies on the next reboot';
      staged.appendChild(note);
    }
    // The registry's latest image: "" when the registry did not answer. Staged means it is already downloaded, so only the rest is news.
    var latest = s.latest_digest || '', lat = el.querySelector('.latest');
    var behind = known && !!latest && !!vm.booted_digest && latest.indexOf(vm.booted_digest.slice(0, 12)) !== 0 && !vm.staged_version;
    lat.textContent = !latest ? 'unknown' : (behind ? 'Newer image' : 'Up to date');
    lat.className = 'latest ' + (behind ? 'behind' : (latest ? 'current' : ''));
    if (latest) {
      var ld = document.createElement('span');
      ld.className = 'mono'; ld.textContent = ' ' + latest;
      lat.appendChild(ld);
    }
    // The online state stays in the health line; what needs doing is a badge next to the name.
    var badge = el.querySelector('.badge');
    c.needs = behind || !!vm.staged_version;
    badge.hidden = !c.needs;
    badge.textContent = vm.staged_version ? 'Reboot pending' : 'Update available';
    if (!c.pending && c.hint.textContent.indexOf('Queued') === 0) { c.hint.textContent = ''; }
    render(c);
  }

  function refresh() {
    fetch('api/v1/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('error').textContent = '';
      Object.keys(d.vms).forEach(function (name) { update(card(name), d.vms[name], d.now); });
    }).catch(function () { document.getElementById('error').textContent = 'Status unavailable: the cards show the last data received.'; });
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
