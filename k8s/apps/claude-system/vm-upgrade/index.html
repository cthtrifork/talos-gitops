<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Update VMs</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a7f4b'/%3E%3Cpath d='M16 24V9M9.5 15.5L16 9l6.5 6.5' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9 24h14' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Same tokens, type scale and card look as the cockpit page. */
  :root {
    color-scheme: light dark;
    --page: #f4f4f1; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6b6963;
    --grid: #e1e0d9; --ring: rgba(11, 11, 11, 0.10); --accent: #1f63b5; --on-accent: #ffffff;
    --ok: #1a7f4b; --warn: #8a5a00; --warn-bg: #fff4d6; --bad: #b3261e; --bad-bg: #fde4e1; --danger: #b3261e;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --accent: #3987e5; --ok: #3cc58a;
      --warn: #f2d98a; --warn-bg: #3a2f10; --bad: #ff8a80; --bad-bg: #3d1713; --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font);
         padding-block: 20px 48px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h3 { font-size: 13px; margin: 0; font-weight: 600; }
  code { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); margin: 4px 0 0; }
  .band { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .panel { background: var(--surface); box-shadow: 0 0 0 1px var(--ring); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  /* Healthy looks neutral and keeps no dot: colour is for what needs a look. */
  .pill.ok { color: var(--ink-2); background: var(--grid); }
  .pill.ok::before { display: none; }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .src { margin: 0; font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .src:empty { display: none; }
  dl { display: flex; flex-direction: column; margin: 0; }
  dl > div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; padding: 7px 0; border-top: 1px solid var(--grid); }
  dl > div:first-child { border-top: 0; }
  dt { color: var(--ink-2); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dd .mono { margin-left: 6px; color: var(--muted); }
  dd.behind { color: var(--warn); }
  dd.current { color: var(--ok); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .note { display: block; font-size: 12px; color: var(--warn); }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  button { font: inherit; width: 100%; min-height: 44px; padding: 8px 16px; border: 1px solid var(--accent); border-radius: 6px;
           background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  button.danger { background: var(--danger); border-color: var(--danger); }
  .link { background: none; border-color: var(--grid); color: var(--accent); }
  .confirm { margin: 0; padding: 8px 12px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
  .hint { margin: 0; font-size: 13px; color: var(--ink-2); }
  .hint:empty { display: none; }
  .hint.warn { color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Update VMs</h1>
    <p class="muted">Runs <code>bootc upgrade --apply</code> on a VM. A VM that finds no new image does not reboot.</p>
  </header>
  <div class="band" id="cards"></div>
  <p id="error" class="hint warn" role="status"></p>
</main>

<template id="card">
  <section class="panel">
    <div class="panel-head"><h3></h3><span class="pill ok health"><span class="health-text">Checking…</span></span></div>
    <p class="src health-ago"></p>
    <dl>
      <div><dt>Running</dt><dd class="booted">…</dd></div>
      <div><dt>Staged</dt><dd class="staged">…</dd></div>
      <div><dt>Latest</dt><dd class="latest">…</dd></div>
    </dl>
    <div class="actions">
      <p class="confirm" hidden></p>
      <button type="button" class="go" disabled>Update now</button>
      <button type="button" class="link cancel" hidden>Cancel</button>
      <p class="hint" role="status" aria-live="polite"></p>
    </div>
  </section>
</template>

<script>
(function () {
  var STALE_AFTER = 150;   // seconds without a poll before a VM counts as not responding (the timers run every 60 s)
  var LABELS = { 'claude-vm': 'Claude VM', 'homeserver': 'Home server' };
  var cards = {};          // vm name -> { el, pending, online, confirming }

  function ago(t, now) {
    if (!t) return 'never';
    var s = Math.max(0, now - t);
    return s < 90 ? s + ' s ago' : Math.round(s / 60) + ' min ago';
  }

  function card(name) {
    if (cards[name]) return cards[name];
    var el = document.getElementById('card').content.firstElementChild.cloneNode(true);
    el.querySelector('h3').textContent = LABELS[name] || name;
    var c = { name: name, el: el, pending: false, online: false, confirming: false,
              go: el.querySelector('.go'), cancel: el.querySelector('.cancel'), confirmBox: el.querySelector('.confirm'), hint: el.querySelector('.hint') };
    c.confirmBox.textContent = (LABELS[name] || name) + ' reboots if a new image exists, and anything running on it ends.';
    c.go.addEventListener('click', function () {
      if (!c.confirming) { c.confirming = true; c.hint.textContent = ''; render(c); return; }
      c.go.disabled = true;
      fetch('api/v1/vms/' + encodeURIComponent(name) + '/upgrade', { method: 'POST', headers: { 'X-Requested-With': 'vm-upgrade-button' } })
        .then(function (r) {
          c.confirming = false;
          c.hint.className = r.ok ? 'hint' : 'hint warn';
          c.hint.textContent = r.ok ? 'Queued.' : 'Failed (' + r.status + ').';
          refresh();
        })
        .catch(function () { c.confirming = false; c.hint.className = 'hint warn'; c.hint.textContent = 'Failed: could not reach the page.'; render(c); });
    });
    c.cancel.addEventListener('click', function () { c.confirming = false; render(c); });
    document.getElementById('cards').appendChild(el);
    cards[name] = c;
    return c;
  }

  function render(c) {
    c.cancel.hidden = !c.confirming;
    c.confirmBox.hidden = !c.confirming;
    c.go.classList.toggle('danger', c.confirming);
    if (c.pending) {
      c.go.disabled = true; c.go.textContent = 'Queued, waiting for the VM';
      c.hint.className = 'hint'; c.hint.textContent = 'The VM checks every minute; the request expires after 10 minutes.';
      return;
    }
    c.go.disabled = false; c.go.textContent = c.confirming ? 'Confirm update' : 'Update now';
    if (c.confirming) return;
    if (!c.online) { c.hint.className = 'hint warn'; c.hint.textContent = 'The VM has not polled recently: a request may expire before it is picked up.'; }
    else if (!/^(Queued|Failed)/.test(c.hint.textContent)) { c.hint.className = 'hint'; c.hint.textContent = ''; }
  }

  function update(c, s, now) {
    var vm = s.vm || {}, known = !!vm.booted_version, el = c.el;
    c.pending = s.pending;
    c.online = s.last_poll_at > 0 && now - s.last_poll_at < STALE_AFTER;
    el.querySelector('.health').className = 'pill health ' + (c.online ? 'ok' : 'bad');
    el.querySelector('.health-text').textContent = c.online ? 'online' : (s.last_poll_at ? 'not responding' : 'not reported');
    el.querySelector('.health-ago').textContent = s.last_poll_at ? 'polled ' + ago(s.last_poll_at, now) : '';
    var booted = el.querySelector('.booted'), staged = el.querySelector('.staged');
    booted.textContent = known ? vm.booted_version : 'unknown';
    if (known) {
      var digest = document.createElement('span');
      digest.className = 'mono'; digest.textContent = ' ' + (vm.booted_digest || '').slice(0, 12);
      booted.appendChild(digest);
    }
    staged.textContent = !known ? 'unknown' : (vm.staged_version || 'none');
    if (known && vm.staged_version) {
      var note = document.createElement('span');
      note.className = 'note'; note.textContent = 'applies on the next reboot';
      staged.appendChild(note);
    }
    // The registry's latest image: "" when the registry did not answer. Staged means it is already downloaded, so only the rest is news.
    var latest = s.latest_digest || '', lat = el.querySelector('.latest');
    var behind = known && !!latest && !!vm.booted_digest && latest.indexOf(vm.booted_digest.slice(0, 12)) !== 0 && !vm.staged_version;
    lat.textContent = !latest ? 'unknown' : (behind ? 'Newer image' : (vm.staged_version ? 'Staged, reboot to apply' : 'Up to date'));
    lat.className = 'latest ' + (behind ? 'behind' : (latest && !vm.staged_version ? 'current' : ''));
    if (latest) {
      var ld = document.createElement('span');
      ld.className = 'mono'; ld.textContent = ' ' + latest;
      lat.appendChild(ld);
    }
    if (behind && c.online) {
      el.querySelector('.health').className = 'pill health warn';
      el.querySelector('.health-text').textContent = 'Update available';
    }
    if (!c.pending && c.hint.textContent.indexOf('Queued') === 0) { c.hint.textContent = ''; }
    render(c);
  }

  function refresh() {
    fetch('api/v1/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('error').textContent = '';
      Object.keys(d.vms).forEach(function (name) { update(card(name), d.vms[name], d.now); });
    }).catch(function () { document.getElementById('error').textContent = 'Status unavailable.'; });
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
