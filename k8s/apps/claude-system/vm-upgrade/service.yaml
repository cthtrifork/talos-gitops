---
# The page and the button, through the Omni service exposer (Omni login).
apiVersion: v1
kind: Service
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/icon: 
    omni-kube-service-exposer.sidero.dev/label: "Update VMs"
    omni-kube-service-exposer.sidero.dev/port: "50092"
    omni-kube-service-exposer.sidero.dev/prefix: claudevmupgrade
spec:
  type: ClusterIP
  selector:
    app: claude-vm-upgrade
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
---
# The VMs' poll (POST /api/v1/vms/<vm>/report and /claim), plain HTTP on the LAN; the Cloudflare A record vm-upgrade.portableinfo.cloud
# points at it (added by hand, DNS only) and is the URL baked into both VM images. Not exposed through Omni: this listener cannot queue an upgrade.
# Only the VMs' addresses (192.168.1.138, 192.168.1.173) are let in, by the CiliumNetworkPolicy. externalTrafficPolicy Local keeps the client address:
# with Cluster, traffic that lands on another node is source-NATed to that node and the policy would see the node, not the VM.
# 192.168.1.244 is free in the MetalLB pool (192.168.1.221-254); the A record vm-upgrade.portableinfo.cloud points at it.
apiVersion: v1
kind: Service
metadata:
  name: claude-vm-upgrade-lb
  namespace: claude-system
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.244
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: claude-vm-upgrade
  ports:
    - name: poll
      port: 80
      targetPort: poll
      protocol: TCP
