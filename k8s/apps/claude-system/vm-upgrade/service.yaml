---
apiVersion: v1
kind: Service
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/icon: 
    omni-kube-service-exposer.sidero.dev/label: "Update VMs"
    omni-kube-service-exposer.sidero.dev/port: "50092"
    omni-kube-service-exposer.sidero.dev/prefix: claudevmupgrade
spec:
  type: ClusterIP
  selector:
    app: claude-vm-upgrade
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
---
# vm-upgrade.portableinfo.cloud is baked into both VM images (README). Not exposed through Omni.
# externalTrafficPolicy Cluster on purpose: with Local, a node without the pod has no backend for 192.168.1.244, so the
# reply to the VM's Envoy-proxied poll (VM on another node than the pod) is not translated back and the VM resets it.
apiVersion: v1
kind: Service
metadata:
  name: claude-vm-upgrade-lb
  namespace: claude-system
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.244
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: claude-vm-upgrade
  ports:
    - name: poll
      port: 80
      targetPort: poll
      protocol: TCP
