---
# The poll listener (:8081) requires the X-Upgrade-Token of the VM named in the path. Each VM sends the token it reads from the
# virtiofs share of its own Secret (k8s/virtualmachines/*/virtualmachine.yaml), so a VM can only act as itself.
# State is in memory; a click lives 10m and the first claim clears it.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

cache_resources:
  # Docker config of the Secret ghcr-pull (optional)
  - label: registryauth
    file:
      directory: /etc/registry-auth

  - label: state
    memory:
      default_ttl: 10m
      compaction_interval: 1m

input:
  broker:
    inputs:
      - label: ui
        http_server:
          address: 0.0.0.0:8080
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "ui"'

      - label: poll
        http_server:
          address: 0.0.0.0:8081
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "poll"'

pipeline:
  processors:
    - mapping: |
        let vm_names = ["claude-vm", "homeserver"]
        let tokens = {"claude-vm": env("VM_TOKEN_CLAUDE_VM").or(""), "homeserver": env("VM_TOKEN_HOMESERVER").or("")}
        let m = @http_server_request_path.re_find_object("^/api/v1/vms/(?P<vm>[a-z-]+)/(?P<action>[a-z]+)$")
        let vm = if $vm_names.contains($m.vm.or("")) { $m.vm } else { "" }
        let token = if $vm == "" { "" } else { $tokens.get($vm).or("") }
        meta vm = $vm
        meta action = $m.action.or("")
        meta authed = $token != "" && metadata("X-Upgrade-Token").or("") == $token
    - switch:
        - check: '@listener == "ui"'
          processors:
            - resource: ui_api
        - check: '@listener == "poll"'
          processors:
            - resource: poll_api

output:
  sync_response: {}

processor_resources:
  # Flag helpers: key in `flag`; `flag_at` is the unix time of the last set, 0 when unset or expired.
  - label: read_flag
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: state
            operator: get
            key: '${! @flag }'
        - catch:
            - mapping: 'root = {"at": 0}'
      result_map: 'meta flag_at = this.at'

  - label: set_flag
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: state
            operator: set
            key: '${! @flag }'
            value: '{"at": ${! now().ts_unix() }}'
            ttl: '${! @flag_ttl }'

  - label: clear_flag
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: state
            operator: delete
            key: '${! @flag }'
        - catch:
            - mapping: 'root = ""'

  - label: read_vm_status
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: state
            operator: get
            key: '${! @vm }:vm'
        - catch:
            - mapping: 'root = {}'
      result_map: 'meta vm_status = this'

  # Digest of the latest `image` (sha256 of the manifest, as on the cockpit page).
  - label: image_digest
    processors:
      - branch:
          request_map: 'root = ""'
          processors:
            - cache:
                resource: registryauth
                operator: get
                key: config.json
            - mapping: 'root = content().string().parse_json().catch({}).auths."ghcr.io".auth.or("")'
          result_map: 'meta registry_auth = content().string()'
      # Without ghcr-pull the token is anonymous: fine for claude-vm-bootc, a 401 for the private homeserver-bootc.
      - catch:
          - mapping: 'meta registry_auth = ""'
      - branch:
          request_map: 'root = ""'
          processors:
            - switch:
                - check: '@registry_auth != ""'
                  processors:
                    - http:
                        url: 'https://ghcr.io/token?service=ghcr.io&scope=repository:cthtrifork/homeserver-bootc/${! @image }:pull'
                        verb: GET
                        headers:
                          Authorization: 'Basic ${! @registry_auth }'
                        timeout: 10s
                - processors:
                    - http:
                        url: 'https://ghcr.io/token?service=ghcr.io&scope=repository:cthtrifork/homeserver-bootc/${! @image }:pull'
                        verb: GET
                        timeout: 10s
          result_map: 'meta registry_token = this.token'
      - http:
          url: 'https://ghcr.io/v2/cthtrifork/homeserver-bootc/${! @image }/manifests/latest'
          verb: GET
          headers:
            Authorization: 'Bearer ${! @registry_token }'
            Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json
          timeout: 10s
      - mapping: 'root = {"digest": content().hash("sha256").encode("hex").slice(0, 12)}'

  # A branch, because inside `catch` the message still counts as failed and `try` would skip it.
  - label: fetch_latest_digest
    branch:
      request_map: 'root = ""'
      processors:
        - try:
            - resource: image_digest
            - cache:
                resource: state
                operator: set
                key: '${! @vm }:latest'
                value: '${! content() }'
                ttl: 5m
        - catch:
            - mapping: 'root = {"digest": ""}'
            - cache:
                resource: state
                operator: set
                key: '${! @vm }:latest'
                value: '${! content() }'
                ttl: 1m
      result_map: 'root = this'

  - label: read_latest_digest
    branch:
      request_map: |
        meta image = @vm + "-bootc"
        root = ""
      processors:
        - cache:
            resource: state
            operator: get
            key: '${! @vm }:latest'
        - catch:
            - resource: fetch_latest_digest
      result_map: 'meta latest_digest = this.digest'

  - label: read_vm_state
    processors:
      - mapping: 'meta flag = @vm + ":pending"'
      - resource: read_flag
      - mapping: 'meta pending_at = @flag_at'
      - mapping: 'meta flag = @vm + ":last_poll"'
      - resource: read_flag
      - resource: read_vm_status
      - resource: read_latest_digest
      - mapping: |
          meta vm_state = {
            "pending": @pending_at > 0,
            "pending_at": @pending_at,
            "last_poll_at": @flag_at,
            "vm": @vm_status,
            "latest_digest": @latest_digest
          }

  - label: not_found
    mapping: |
      meta status = "404"
      root = {"error": "not found"}

  - label: ui_api
    switch:
      - check: '@http_server_verb == "GET" && (@http_server_request_path == "/" || @http_server_request_path == "/index.html")'
        processors:
          - mapping: |
              meta content_type = "text/html; charset=utf-8"
              root = file("/etc/connect/index.html")

      - check: '@http_server_request_path == "/healthz"'
        processors:
          - mapping: |
              meta content_type = "text/plain"
              root = "ok"

      - check: '@http_server_verb == "GET" && @http_server_request_path == "/api/v1/status"'
        processors:
          - mapping: 'meta vm = "claude-vm"'
          - resource: read_vm_state
          - mapping: 'meta state_claude_vm = @vm_state'
          - mapping: 'meta vm = "homeserver"'
          - resource: read_vm_state
          - mapping: |
              root.now = now().ts_unix()
              root.vms = {"claude-vm": @state_claude_vm, "homeserver": @vm_state}

      # A form on another site cannot add a custom header without a CORS preflight, which this server never answers.
      - check: '@http_server_verb == "POST" && @action == "upgrade" && metadata("X-Requested-With").or("") != "vm-upgrade-button"'
        processors:
          - mapping: |
              meta status = "403"
              root = {"error": "missing X-Requested-With header"}

      - check: '@http_server_verb == "POST" && @action == "upgrade" && @vm != ""'
        processors:
          - mapping: |
              meta flag = @vm + ":pending"
              meta flag_ttl = "10m"
          - resource: set_flag
          - mapping: 'root = {"queued": true}'

      - processors:
          - resource: not_found

  - label: poll_api
    switch:
      - check: '@http_server_request_path == "/healthz"'
        processors:
          - mapping: |
              meta content_type = "text/plain"
              root = "ok"

      - check: '@authed != true'
        processors:
          - mapping: |
              meta status = "401"
              root = {"error": "unauthorized"}

      - check: '@http_server_verb == "POST" && @action == "claim" && @vm != ""'
        processors:
          - mapping: 'meta flag = @vm + ":pending"'
          - resource: read_flag
          - mapping: 'meta upgrade = @flag_at > 0'
          - resource: clear_flag
          - mapping: 'root = {"upgrade": @upgrade}'

      # The body is whatever the VM sends: keep three known fields, only plain characters, short. The page shows them as text.
      - check: '@http_server_verb == "POST" && @action == "report" && @vm != ""'
        processors:
          - mapping: |
              map clean {
                root = this.string().catch("").re_replace_all("[^A-Za-z0-9._:/@+-]", "").slice(0, 64).catch("")
              }
              let b = content().parse_json().catch({})
              meta vm_status = {
                "booted_version": $b.booted_version.or("").apply("clean"),
                "booted_digest": $b.booted_digest.or("").apply("clean"),
                "staged_version": $b.staged_version.or("").apply("clean")
              }
          - branch:
              request_map: 'root = @vm_status'
              processors:
                - cache:
                    resource: state
                    operator: set
                    key: '${! @vm }:vm'
                    value: '${! content() }'
                    ttl: 24h
          - mapping: |
              meta flag = @vm + ":last_poll"
              meta flag_ttl = "24h"
          - resource: set_flag
          - mapping: 'root = {"ok": true}'

      - processors:
          - resource: not_found
