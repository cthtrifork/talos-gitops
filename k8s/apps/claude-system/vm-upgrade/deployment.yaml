---
# "Update VMs" buttons (see vm-upgrade/redpanda-connect.yaml and the README). The pod only holds a flag per VM; the VMs poll it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-vm-upgrade
  template:
    metadata:
      labels:
        app: claude-vm-upgrade
        prometheus-scrape: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001 # so the 0440 ghcr-pull file below is readable; without it the homeserver image lookup gets a 401
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: mirror.gcr.io/redpandadata/connect:4.118.0@sha256:2c6dd2fe757eaa588eeee90376ec2220a5d1731940d71a2005d8b249296dd2be # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          ports:
            - name: http
              containerPort: 8080
            - name: poll
              containerPort: 8081
            - name: metrics
              containerPort: 4195
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          livenessProbe:
            httpGet:
              path: /ping
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/connect
              readOnly: true
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: claude-vm-upgrade-connect-config
        - name: registry-auth
          secret:
            secretName: ghcr-pull # the runner's read:packages token; homeserver-bootc is a private package
            optional: true
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
