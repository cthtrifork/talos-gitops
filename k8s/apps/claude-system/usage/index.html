<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude usage</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1;
    --surface: #ffffff;
    --ink: #141413;
    --ink-2: #4a4843;
    --muted: #6b6963;
    --grid: #e3e2da;
    --axis: #c3c2b7;
    --ring: rgba(11, 11, 11, 0.10);
    --env-rc: #2a78d6;
    --env-vm: #eb6834;
    --tok-input: #1baf7a;
    --tok-output: #eda100;
    --tok-cread: #e87ba4;
    --tok-cwrite: #008300;
    --on-tok-input: #ffffff;
    --on-tok-output: #0b0b0b;
    --on-tok-cread: #ffffff;
    --on-tok-cwrite: #ffffff;
    --env-other: #898781;
    --bar-neutral: #b9b7ae;
    --warn-bg: #fff4d6;
    --warn-ink: #5b4300;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Shared with the cockpit: the type scale is small (labels, metadata), medium (body), large (titles), extra large (page title, headline numbers). */
    --fs-sm: 12px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
      --env-rc: #3987e5; --env-vm: #d95926;
      --tok-input: #199e70; --tok-output: #c98500; --tok-cread: #d55181; --tok-cwrite: #008300;
      --on-tok-output: #0b0b0b;
      --bar-neutral: #4a4945; --warn-bg: #3a2f10; --warn-ink: #f2d98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c9c7be; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
    --env-rc: #3987e5; --env-vm: #d95926;
    --tok-input: #199e70; --tok-output: #c98500; --tok-cread: #d55181; --tok-cwrite: #008300;
    --on-tok-output: #0b0b0b;
    --bar-neutral: #4a4945; --warn-bg: #3a2f10; --warn-ink: #f2d98a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink); font: var(--fs-md)/1.45 var(--font);
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 68rem; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: var(--fs-xl); margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: var(--fs-md); margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: var(--fs-sm); }
  code, .src { font-family: var(--mono); font-size: var(--fs-sm); color: var(--muted); }


  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 2px; }
  .seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 6px; color: var(--ink-2); font-size: var(--fs-md); }
  .seg button[aria-pressed="true"] { background: var(--page); color: var(--ink); font-weight: 600; }
  .seg button:focus-visible { outline: 2px solid var(--env-rc); outline-offset: 1px; }

  .panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 16px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; }
  .tile .k { color: var(--ink-2); font-size: var(--fs-sm); }
  .tile .v { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; margin: 2px 0; }
  .tile.hero .v { font-size: calc(var(--fs-xl) * 1.4); }
  .tile .s { color: var(--muted); font-size: var(--fs-sm); }
  .tile .src { display: block; margin-top: 6px; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--ink-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font: var(--fs-sm) var(--font); }
  svg .grid { stroke: var(--grid); }
  svg .axis { stroke: var(--axis); }
  svg rect.hit { fill: transparent; }
  svg g.col:hover .seg-fill { filter: brightness(1.08); }
  svg g.col:hover rect.hit { fill: var(--ring); }
  svg .seg-fill { stroke: var(--surface); stroke-width: 2; }
  svg text.inbar { font-weight: 600; }

  usage-app, usage-tooltip { display: block; }
  .tip { position: fixed; z-index: 5; pointer-events: none; background: var(--ink); color: var(--page); border-radius: 8px; padding: 8px 10px; font-size: var(--fs-sm); line-height: 1.5; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 16rem; }
  .tip b { display: block; margin-bottom: 2px; }
  .tip .r { display: flex; justify-content: space-between; gap: 16px; }
  .tip[hidden] { display: none; }

  .row { display: grid; grid-template-columns: 9.5rem 1fr 4.5rem; gap: 10px; align-items: center; padding: 6px 0; }
  .row .name { font-size: var(--fs-md); overflow-wrap: anywhere; }
  .row .name small { display: block; color: var(--muted); font-size: var(--fs-sm); }
  .row .val { text-align: right; }
  .track { height: 22px; display: flex; gap: 2px; }
  .track .seg-b { height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: var(--fs-sm); font-weight: 600; min-width: 0; overflow: hidden; }
  .track .neutral { background: var(--bar-neutral); justify-content: flex-start; }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  th { color: var(--muted); font-weight: 500; font-size: var(--fs-sm); }
  th:first-child, td:first-child { text-align: left; }
  td.l, th.l { text-align: left; }
  tfoot td { font-weight: 650; border-bottom: 0; }
  details summary { cursor: pointer; color: var(--ink-2); font-size: var(--fs-sm); margin-top: 10px; }
  details summary:focus-visible { outline: 2px solid var(--env-rc); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #error { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 12px; font-size: var(--fs-sm); }
  .empty { color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<usage-app></usage-app>
<usage-tooltip></usage-tooltip>
<!-- Lit comes from jsDelivr as plain ES modules, every package pinned to an exact version. Bump the versions here. -->
<script type="importmap">
{
  "imports": {
    "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/index.js",
    "lit-element/": "https://cdn.jsdelivr.net/npm/lit-element@4.2.2/",
    "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/lit-html.js",
    "lit-html/": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/",
    "@lit/reactive-element": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/reactive-element.js",
    "@lit/reactive-element/": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/"
  }
}
</script>
<script type="module">
import { LitElement, html, svg, nothing } from "lit";

const TOKENS = [
  { k: "input", label: "Input", v: "--tok-input", on: "--on-tok-input" },
  { k: "output", label: "Output", v: "--tok-output", on: "--on-tok-output" },
  { k: "cacheRead", label: "Cache read", v: "--tok-cread", on: "--on-tok-cread" },
  { k: "cacheCreation", label: "Cache write", v: "--tok-cwrite", on: "--on-tok-cwrite" },
];
const PERIOD_DAYS = { today: 1, "7d": 7, "30d": 30 };
const PERIODS = [["today", "Today"], ["7d", "7 days"], ["30d", "30 days"]];
const METRICS = [["cost", "Cost"], ["tokens", "Tokens"], ["sessions", "Sessions"], ["commits", "Commits"], ["pull_requests", "Pull requests"]];
const DAILY_SOURCE = {
  cost: "claude_code_cost_usage{environment}",
  tokens: "claude_code_token_usage{environment}",
  sessions: "claude_code_session_count{environment}",
  commits: "claude_code_commit_count{environment}",
  pull_requests: "claude_code_pull_request_count{environment}",
};
const REFRESH_MS = 60000;

// ---- Formatting and data helpers ----

const css = (v) => `var(${v})`;
const usd = (v) => "$" + (v >= 1000 ? Math.round(v).toLocaleString() : v >= 100 ? v.toFixed(0) : v.toFixed(2));
const compact = (v) => new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: v >= 1e7 ? 0 : 1 }).format(v);
const num = (v) => Math.round(v).toLocaleString("en");
const sum = (a) => a.reduce((x, y) => x + y, 0);
const cacheHit = (t) => t.cacheRead / Math.max(t.input + t.cacheRead + t.cacheCreation, 1);

async function get(path) {
  const r = await fetch(path, { headers: { accept: "application/json" } });
  if (!r.ok) throw new Error(path + " answered " + r.status);
  return r.json();
}

// What the page shows for the chosen environment and period, derived from the data.
function view(data, ui) {
  const { summary, daily, breakdown, decisions } = data;
  // Environments get the validated colour slots in sorted order; a third one falls back to grey.
  const envs = daily && summary ? [...new Set([...daily.environments, ...Object.keys(summary.windows["30d"].environments)])].sort() : [];
  const env = ui.env === "all" || envs.includes(ui.env) ? ui.env : "all";
  const period = data.period || ui.period;
  const win = summary?.windows[period];
  const envColor = (e) => ["--env-rc", "--env-vm"][envs.indexOf(e)] || "--env-other";
  const shownEnvs = env === "all" ? envs : envs.filter((e) => e === env);
  const inEnv = (r) => env === "all" || r.environment === env;
  const byModel = {};
  for (const r of (breakdown?.rows || []).filter(inEnv)) {
    const o = (byModel[r.model] ||= { cost: 0, tokens: { input: 0, output: 0, cacheRead: 0, cacheCreation: 0 } });
    o.cost += r.cost_usd;
    for (const k in o.tokens) o.tokens[k] += r.tokens[k];
  }
  return {
    envs, env, period, win, envColor, shownEnvs,
    totals: win ? (env === "all" ? win.total : win.environments[env] || null) : null,
    modelRows: (breakdown?.rows || []).filter(inEnv),
    decisionRows: (decisions?.rows || []).filter(inEnv),
    models: Object.entries(byModel).sort((a, b) => b[1].cost - a[1].cost),
  };
}

// ---- Tooltip: its own element, so moving over a chart does not re-render the page ----
// Charts announce what to show with a bubbling "usage-tip" event (detail null hides it); <usage-tooltip> listens on the document.

const tipEvent = (ev, detail) => ev.currentTarget.dispatchEvent(new CustomEvent("usage-tip", { bubbles: true, detail }));
const showTip = (ev, title, lines) => tipEvent(ev, { x: ev.clientX, y: ev.clientY, title, lines });
const hideTip = (ev) => tipEvent(ev, null);


// ---- Building blocks ----

const Empty = (children) => html`<div class="empty">${children}</div>`;
const Dot = (color) => html`<span class="dot" style="background: ${css(color)}"></span>`;

// A segmented control; each button carries its value in data-value.
const Segmented = ({ label, id, options, value, onPick }) => html`<div class="seg" role="group" aria-label=${label} id=${id}>${options.map(([v, text]) => html`<button data-value=${v} aria-pressed=${String(value === v)} @click=${() => onPick(v)}>${text}</button>`)}</div>`;

const Table = ({ id, head, rows, foot }) => html`<table id=${id}><thead><tr>${head}</tr></thead><tbody>${rows}</tbody>${foot ? html`<tfoot>${foot}</tfoot>` : nothing}</table>`;

// ---- Sections ----

const Tiles = (v) => {
  const t = v.totals;
  if (!t) return html`<section class="tiles" id="tiles" aria-label="Totals">${Empty("No data for this selection yet.")}</section>`;
  const days = PERIOD_DAYS[v.period];
  const tile = (k, value, sub, src, hero) => ({ k, value, sub, src, hero });
  const items = [
    tile("Cost", usd(t.cost_usd), v.period === "today" ? "since 00:00 UTC" : usd(t.cost_usd / days) + " per day", "cost_usage", true),
    tile("Tokens", compact(t.tokens.total), `out ${compact(t.tokens.output)} · in ${compact(t.tokens.input)}`, "token_usage"),
    tile("Cache hit", (cacheHit(t.tokens) * 100).toFixed(1) + "%", "derived from tokens by type", "token_usage{type}"),
    tile("Sessions", num(t.sessions), t.sessions ? usd(t.cost_usd / t.sessions) + " per session" : "no sessions", "session_count"),
    tile("Commits", num(t.commits), t.pull_requests ? num(t.pull_requests) + " pull request" + (t.pull_requests > 1 ? "s" : "") : "no pull requests", "commit_count"),
    tile("Cost per commit", t.commits ? usd(t.cost_usd / t.commits) : "–", t.pull_requests ? usd(t.cost_usd / t.pull_requests) + " per pull request" : "derived", "cost_usage ÷ commit_count"),
    tile("Lines changed", compact(t.lines.added + t.lines.removed), `+${compact(t.lines.added)} −${compact(t.lines.removed)}`, "lines_of_code_count{type}"),
    tile("Active time", t.active_hours.toFixed(1) + " h", "across all sessions", "active_time_total"),
  ];
  return html`<section class="tiles" id="tiles" aria-label="Totals">${items.map((i) => html`<div class=${i.hero ? "tile hero" : "tile"}><div class="k">${i.k}</div><div class="v">${i.value}</div><div class="s">${i.sub}</div><span class="src">${"claude_code_" + i.src}</span></div>`)}</section>`;
};

// Stacked columns per day, one segment per environment. The pieces inside the <svg> use the svg tag, so they get the SVG namespace.
const DailyChart = ({ days, v, metric }) => {
  const envs = v.shownEnvs;
  const key = metric === "cost" ? "cost_usd" : metric;
  const val = (d, e) => (d.environments[e] ? d.environments[e][key] : 0);
  const fmt = metric === "cost" ? usd : metric === "tokens" ? compact : num;
  const perDay = days.map((d) => sum(envs.map((e) => val(d, e))));
  const label = "Stacked columns per day by environment";
  if (!days.length || !envs.length || Math.max(0, ...perDay) === 0) {
    return html`<svg id="daily" viewBox="0 0 720 240" role="img" aria-label=${label}><text x="360" y="120" text-anchor="middle">No usage in this period yet</text></svg>`;
  }
  const max = Math.max(...perDay) * 1.08;
  const L = 44, R = 78, T = 8, B = 24, W = 720, H = 240;
  const pw = (W - L - R) / days.length;
  const ph = H - T - B;
  const last = days[days.length - 1];
  let stacked = 0;
  return html`<svg id="daily" viewBox="0 0 720 240" role="img" aria-label=${label}>
    ${[0, 0.5, 1].map((f) => {
      const y = T + ph * (1 - f);
      return svg`<line x1=${L} x2=${W - R} y1=${y} y2=${y} class=${f ? "grid" : "axis"} /><text x=${L - 6} y=${y + 4} text-anchor="end">${fmt(max * f)}</text>`;
    })}
    ${days.map((d, i) => {
      const x = L + i * pw + pw * 0.14;
      const w = pw * 0.72;
      let acc = 0;
      const lines = [...envs.map((e) => [v.envColor(e), e, fmt(val(d, e))]), ...(envs.length > 1 ? [[null, "Total", fmt(perDay[i])]] : [])];
      return svg`<g class="col" @pointermove=${(ev) => showTip(ev, d.date, lines)} @pointerleave=${hideTip}>
        <rect x=${L + i * pw} y=${T} width=${pw} height=${ph} class="hit" />
        ${envs.map((e) => {
          const value = val(d, e);
          const h = (value / max) * ph;
          const y = T + ph - (acc / max) * ph - h;
          acc += value;
          return h > 0 ? svg`<rect x=${x} y=${y} width=${w} height=${h} rx="3" fill=${css(v.envColor(e))} class="seg-fill" />` : nothing;
        })}
      </g>${days.length <= 8 || i % Math.ceil(days.length / 8) === 0 || i === days.length - 1 ? svg`<text x=${x + w / 2} y=${H - 6} text-anchor="middle">${d.date.slice(5)}</text>` : nothing}`;
    })}
    ${envs.map((e) => {
      const value = val(last, e);
      const mid = T + ph - ((stacked + value / 2) / max) * ph;
      stacked += value;
      return svg`<text x=${W - R + 8} y=${mid + 4}>${e}</text>`;
    })}
  </svg>`;
};

const PerDay = ({ data, v, metric, setMetric }) => {
  const all = data.daily ? data.daily.days : [];
  const days = all.slice(-(v.period === "30d" ? 30 : 7));
  const key = metric === "cost" ? "cost_usd" : metric;
  const fmt = metric === "cost" ? usd : metric === "tokens" ? compact : num;
  const val = (d, e) => (d.environments[e] ? d.environments[e][key] : 0);
  const envs = v.shownEnvs;
  const totalOf = (d) => sum(envs.map((e) => val(d, e)));
  return html`<section class="panel">
    <div class="panel-head">
      <h2>Per day</h2>
      ${Segmented({ label: "Metric", id: "metricSeg", options: METRICS, value: metric, onPick: setMetric })}
    </div>
    <div class="legend" id="envLegend">${envs.map((e) => html`<span><i style="background: ${css(v.envColor(e))}"></i>${e}</span>`)}</div>
    ${DailyChart({ days, v, metric })}
    <details><summary>View as table</summary><div class="scroll">
      ${Table({
        id: "dailyTable",
        head: html`<th>Day (UTC)</th>${envs.map((e) => html`<th>${e}</th>`)}${envs.length > 1 ? html`<th>Total</th>` : nothing}`,
        rows: [...days].reverse().map((d) => html`<tr><td>${d.date}</td>${envs.map((e) => html`<td>${fmt(val(d, e))}</td>`)}${envs.length > 1 ? html`<td>${fmt(totalOf(d))}</td>` : nothing}</tr>`),
      })}
    </div></details>
    <div class="src" id="dailySrc">${DAILY_SOURCE[metric]}</div>
  </section>`;
};

const ModelCost = (v) => {
  if (!v.models.length) return html`<div id="modelCost">${Empty("No model usage in this period yet.")}</div>`;
  const total = sum(v.models.map(([, m]) => m.cost));
  const max = Math.max(v.models[0][1].cost, 0.0001);
  return html`<div id="modelCost">${v.models.map(([name, m]) => html`<div class="row">
    <div class="name">${name}<small>${(total ? (m.cost / total) * 100 : 0).toFixed(0)}% of cost</small></div>
    <div class="track"><div class="seg-b neutral" style="width: ${Math.max((m.cost / max) * 100, 2)}%"></div></div>
    <div class="val">${usd(m.cost)}</div>
  </div>`)}</div>`;
};

const TokenMix = (v) => {
  if (!v.models.length) return html`<div class="legend" id="tokLegend"></div><div id="tokMix">${Empty("No model usage in this period yet.")}</div>`;
  return html`<div class="legend" id="tokLegend">${TOKENS.map((t) => html`<span><i style="background: ${css(t.v)}"></i>${t.label}</span>`)}</div>
    <div id="tokMix">${v.models.map(([name, m]) => {
      const total = Math.max(sum(Object.values(m.tokens)), 1);
      return html`<div class="row">
        <div class="name">${name}<small>${compact(total)} tokens</small></div>
        <div class="track">${TOKENS.map((t) => {
          const share = (m.tokens[t.k] / total) * 100;
          return html`<div class="seg-b" style="width: ${share}%; flex: 0 0 auto; background: ${css(t.v)}; color: ${css(t.on)}"
            @pointermove=${(ev) => showTip(ev, name, [[t.v, t.label, compact(m.tokens[t.k]) + " · " + share.toFixed(1) + "%"]])} @pointerleave=${hideTip}>${share >= 9 ? share.toFixed(0) + "%" : nothing}</div>`;
        })}</div>
        <div class="val">${(cacheHit(m.tokens) * 100).toFixed(0)}% hit</div>
      </div>`;
    })}</div>`;
};

const th = (text, cls) => html`<th class=${cls ?? nothing}>${text}</th>`;
const ModelTable = (v) => Table({
  id: "modelTable",
  head: html`<th>Environment</th><th class="l">Model</th>${["Cost", "Input", "Output", "Cache read", "Cache write", "Lines"].map((x) => html`<th>${x}</th>`)}`,
  rows: v.modelRows.map((o) => html`<tr>
    <td>${Dot(v.envColor(o.environment))}${o.environment || "–"}</td><td class="l">${o.model || "–"}</td><td>${usd(o.cost_usd)}</td>
    <td>${num(o.tokens.input)}</td><td>${num(o.tokens.output)}</td><td>${num(o.tokens.cacheRead)}</td><td>${num(o.tokens.cacheCreation)}</td>
    <td>${"+" + num(o.lines.added) + " −" + num(o.lines.removed)}</td>
  </tr>`),
});

const ActivityTable = (v) => {
  const row = (label, color, x) => html`<tr>
    <td>${color ? Dot(color) : nothing}${label}</td><td>${num(x.sessions)}</td><td>${x.active_hours.toFixed(1)} h</td>
    <td>${"+" + num(x.lines.added) + " −" + num(x.lines.removed)}</td><td>${num(x.commits)}</td><td>${num(x.pull_requests)}</td>
    <td>${x.commits ? usd(x.cost_usd / x.commits) : "–"}</td><td>${x.pull_requests ? usd(x.cost_usd / x.pull_requests) : "–"}</td>
  </tr>`;
  const envs = v.shownEnvs;
  return Table({
    id: "actTable",
    head: ["Environment", "Sessions", "Active", "Lines", "Commits", "Pull requests", "Cost per commit", "Cost per PR"].map((x) => html`<th>${x}</th>`),
    rows: envs.map((e) => (v.win?.environments[e] ? row(e, v.envColor(e), v.win.environments[e]) : nothing)),
    foot: envs.length > 1 && v.win ? row("Total", null, v.win.total) : null,
  });
};

const DecisionTable = (v) => Table({
  id: "editTable",
  head: ["Environment", "Tool", "Decision", "Language", "Source", "Count"].map((x, i) => th(x, i < 5 ? "l" : undefined)),
  rows: v.decisionRows.length
    ? v.decisionRows.map((r) => html`<tr><td class="l">${r.environment}</td><td class="l">${r.tool}</td><td class="l">${r.decision}</td><td class="l">${r.language}</td><td class="l">${r.source}</td><td>${num(r.count)}</td></tr>`)
    : html`<tr><td colspan="6">No edit decisions in this period yet</td></tr>`,
});

// ---- The page ----


// ---- The elements. Both render into themselves (no shadow root), so the page's stylesheet applies. ----

class UsageTooltip extends LitElement {
  static properties = { tip: { state: true } };
  constructor() {
    super();
    this.tip = null;
    this._on = (e) => { this.tip = e.detail; };
  }
  createRenderRoot() { return this; }
  connectedCallback() { super.connectedCallback(); document.addEventListener("usage-tip", this._on); }
  disconnectedCallback() { document.removeEventListener("usage-tip", this._on); super.disconnectedCallback(); }
  updated() {
    if (!this.tip) return;
    const el = this.querySelector("#tip");
    el.style.left = Math.min(this.tip.x + 14, innerWidth - el.offsetWidth - 8) + "px";
    el.style.top = Math.max(8, Math.min(this.tip.y - el.offsetHeight - 10, innerHeight - el.offsetHeight - 8)) + "px";
  }
  render() {
    const tip = this.tip;
    return html`<div class="tip" id="tip" ?hidden=${!tip}>${tip ? html`<b>${tip.title}</b>${tip.lines.map(([dot, name, val]) => html`<div class="r"><span>${dot ? html`<span class="dot" style="background: ${css(dot)}"></span>` : nothing}${name}</span><span>${val}</span></div>`)}` : nothing}</div>`;
  }
}

// The page. Assigning to ui, data or error re-renders it; nothing calls a render by hand.
class UsageApp extends LitElement {
  static properties = { ui: { state: true }, data: { state: true }, error: { state: true } };
  constructor() {
    super();
    this.ui = { env: "all", period: "7d", metric: "cost" };
    this.data = { summary: null, daily: null, breakdown: null, decisions: null, period: null };
    this.error = null;
    this._period = null;
    this._stop = () => {};
    this.pick = (key) => (value) => { this.ui = { ...this.ui, [key]: value }; };
  }
  createRenderRoot() { return this; }
  disconnectedCallback() { this._stop(); this._period = null; super.disconnectedCallback(); }
  // Polling follows the chosen period: a new period restarts it.
  willUpdate() {
    if (this.ui.period === this._period) return;
    this._period = this.ui.period;
    this._poll(this._period);
  }
  // The data of one period: the summary and the daily series cover 30 days, the breakdown and the decisions are per period.
  // A load that is overtaken by a newer one (a quick switch of period) is dropped. A failed load keeps the last data.
  _poll(period) {
    this._stop();
    let latest = 0;
    const load = async () => {
      const seq = ++latest;
      try {
        const [summary, daily, breakdown, decisions] = await Promise.all([
          get("api/v1/summary"), get("api/v1/daily?days=30"), get("api/v1/breakdown?window=" + period), get("api/v1/decisions?window=" + period),
        ]);
        if (seq !== latest) return;
        this.data = { summary, daily, breakdown, decisions, period };
        this.error = null;
      } catch (e) {
        if (seq === latest) this.error = e.message;
      }
    };
    load();
    const timer = setInterval(load, REFRESH_MS);
    this._stop = () => { latest = Infinity; clearInterval(timer); };
  }
  render() {
    const { ui, data, error } = this;
    const v = view(data, ui);
    const days = data.daily?.days;
    const range = days?.length
      ? `${days[Math.max(0, days.length - (v.period === "30d" ? 30 : 7))].date} to ${days[days.length - 1].date} · UTC days · from Prometheus`
      : "UTC days · from Prometheus";

    return html`<main>
      <p id="error" role="alert" ?hidden=${!error}>${error ? `Could not load usage: ${error}. Showing the last data received.` : nothing}</p>
      <header class="bar">
        <div><h1>Claude usage</h1><div class="sub" id="range">${range}</div></div>
        <div class="group">
          ${Segmented({ label: "Environment", id: "envSeg", options: ["all", ...v.envs].map((e) => [e, e === "all" ? "All" : e]), value: v.env, onPick: this.pick("env") })}
          ${Segmented({ label: "Period", id: "periodSeg", options: PERIODS, value: ui.period, onPick: this.pick("period") })}
        </div>
      </header>

      ${Tiles(v)}
      ${PerDay({ data, v, metric: ui.metric, setMetric: this.pick("metric") })}

      <div class="cols">
        <section class="panel">
          <div class="panel-head"><h2>Cost by model</h2><span class="src">claude_code_cost_usage{model}</span></div>
          ${ModelCost(v)}
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Token mix by model</h2><span class="src">claude_code_token_usage{model,type}</span></div>
          ${TokenMix(v)}
          <div class="sub" style="margin-top:8px">Cache hit = cache read ÷ (input + cache read + cache write).</div>
        </section>
      </div>

      <section class="panel">
        <div class="panel-head"><h2>By model and environment</h2><span class="src">tokens, cost and lines carry both labels</span></div>
        <div class="scroll">${ModelTable(v)}</div>
      </section>

      <div class="cols">
        <section class="panel">
          <div class="panel-head"><h2>Output by environment</h2><span class="src">commit_count and pull_request_count have no model label</span></div>
          <div class="scroll">${ActivityTable(v)}</div>
          <div class="sub" style="margin-top:8px">Cost per commit and per pull request divide the environment's whole cost by its commits or pull requests, so sessions that only read code count against them.</div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Edit tool decisions</h2><span class="src">claude_code_code_edit_tool_decision</span></div>
          <div class="scroll">${DecisionTable(v)}</div>
        </section>
      </div>

      <p class="sub" id="gen">Counts come from <code>increase()</code> of the collector's counters; the first export of a new model or environment is not counted.</p>
    </main>`;
  }
}
customElements.define("usage-tooltip", UsageTooltip);
customElements.define("usage-app", UsageApp);
</script>
</body>
</html>
