---
apiVersion: v1
kind: Service
metadata:
  name: claude-usage
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/icon: 
    omni-kube-service-exposer.sidero.dev/label: "Claude usage"
    omni-kube-service-exposer.sidero.dev/port: "50091"
    omni-kube-service-exposer.sidero.dev/prefix: claudeusage
spec:
  type: ClusterIP
  selector:
    app: claude-usage
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
