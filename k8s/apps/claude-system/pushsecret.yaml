# Copies claude-rc's GitHub installation token (the Secret externalsecret.yaml keeps fresh) into the cluster store, so the kagent agents can have the same credential injected by the
# Substrate egress gateway without holding it (k8s/apps/kagent/externalsecrets.yaml reads it from there). It is the full grant of the GitHub App on its repositories, not a narrower token,
# and it expires after 60 minutes: the three refresh intervals (the ExternalSecret's 30 minutes, this 5, the kagent ExternalSecret's 5) plus the credential provider's 5 minute cache keep a
# copy under 50 minutes old. The store lets this namespace in (k8s/infra/secret-store/clustersecretstore.yaml).
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: claude-github-token
  namespace: claude-system
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: Delete
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: claude-github-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: claude-github-token
          property: token
