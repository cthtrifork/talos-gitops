# The Secret dependency-track-kek (key `kek`) is generated once in the cluster store (k8s/infra/secret-store/) and copied
# here, so the key is not in Git. Changing it makes everything Dependency-Track stored encrypted in its database unreadable.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-kek
  namespace: security-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: dependency-track-kek
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: dependency-track-kek
