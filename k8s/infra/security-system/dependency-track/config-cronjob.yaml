# Configuration as code for Dependency-Track: what Helm values and env vars cannot set because it lives in the database.
# The desired state is data in the ConfigMap below (teams.json, properties.json, extensions.json); the script is a generic
# loop over it. A CronJob that is safe to run repeatedly (hourly, and Reloader runs it when the ConfigMap changes; it also bootstraps a fresh install and
# repairs drift):
#  1. Admin: the built-in admin/admin must change its password on first login. The password is generated once by External
#     Secrets (k8s/infra/secret-store/) and copied into the Secret dependency-track-admin (external-secret-admin.yaml), so
#     it exists before this Job first runs. The Job logs in with it, or sets it on a fresh install. To use your own
#     password, replace the key `password` in the Secret dependency-track-admin of the namespace secret-store.
#  2. Teams from teams.json (`sbom-uploader`: key in dependency-track-api-key, used by sbom-hook; `vex-exporter`: key in
#     dependency-track-vex-api-key, used by vex-export-cronjob.yaml; `claude-triage`: key in dependency-track-claude-api-key of the namespace claude-system,
#     used by the claude-rc pod to read findings and record analyses). Permissions are only added, never removed. A key is only
#     created if its Secret does not exist yet, or replaced if the stored key is no longer accepted (a recreated database), stored as `api-key` and never printed.
#  3. Config properties from properties.json (group, name, value as a string), only the declared ones; the rest stays
#     owned by the UI. An unknown property is a failure.
#  4. Extension settings (Trivy analyzer, KEV data sources) from extensions.json, merged over the current settings
#     through the v2 API. Add entries there for other vulnerability sources or analyzers (point/name/config; the config
#     schema is GET /api/v2/extension-points/<point>/extensions/<name>/config-schema).
# Every failure (API, Kubernetes, missing prerequisite) fails the Job. Not covered: notifications, policies, and the
# NVD/GitHub/OSV vulnerability data sources (they keep their defaults).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dependency-track-config
  namespace: security-system
  annotations:
    claude-elevate/description: Applies the Dependency-Track configuration (teams, API keys, properties, analyzers) and repairs drift. Safe to repeat.
    reloader.stakater.com/auto: "true" # Reloader starts a Job when the config ConfigMap changes
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dependency-track-config # selected by the network policy
        spec:
          restartPolicy: Never
          serviceAccountName: dependency-track-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: configure
              image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              command:
                - sh
                - -eu
                - -c
                - |
                  cd /work
                  json='Content-Type: application/json'
                  # Authenticated call: api METHOD PATH [curl args]
                  api() { m=$1; p=$2; shift 2; curl -sS -X "$m" "$DT_URL$p" -H "Authorization: Bearer $token" "$@"; }
                  login() {
                    curl -sS -o token.txt -w '%{http_code}' -X POST "$DT_URL/api/v1/user/login" \
                      --data-urlencode username=admin --data-urlencode "password=$1"
                  }

                  # the api-server may still be starting (a restart of it is the usual reason): wait up to two minutes
                  i=0
                  until curl -sf -o /dev/null "$DT_URL/api/version"; do
                    i=$((i + 1)); [ "$i" -lt 24 ] || { echo "api-server not reachable" >&2; exit 1; }
                    sleep 5
                  done

                  # 1. admin password, from the Secret External Secrets keeps in sync (it may not exist for a minute on a fresh install)
                  pw=$(kubectl get secret dependency-track-admin -o jsonpath='{.data.password}' | base64 -d)
                  [ -n "$pw" ] || { echo "Secret dependency-track-admin is not synced yet (kubectl -n security-system describe externalsecret dependency-track-admin)" >&2; exit 1; }
                  if [ "$(login "$pw")" != 200 ]; then
                    # first start: the built-in admin/admin must be changed to the seeded password
                    code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DT_URL/api/v1/user/forceChangePassword" \
                      --data-urlencode username=admin --data-urlencode password=admin \
                      --data-urlencode "newPassword=$pw" --data-urlencode "confirmPassword=$pw")
                    if [ "$code" != 200 ]; then
                      echo "cannot log in as admin and the default password is not accepted ($code): put the current admin password in the Secret dependency-track-admin of the namespace secret-store" >&2
                      exit 1
                    fi
                    [ "$(login "$pw")" = 200 ] || { echo "login as admin failed after the password change" >&2; exit 1; }
                  fi
                  token=$(cat token.txt)

                  # 2. teams, permissions, API keys: ensure_team TEAM SECRET NAMESPACE PERMISSION...
                  ensure_team() {
                    team=$1; secret=$2; ns=$3; shift 3
                    uuid=$(api GET /api/v1/team | jq -r --arg n "$team" '.[] | select(.name == $n) | .uuid')
                    if [ -z "$uuid" ]; then
                      uuid=$(api PUT /api/v1/team -H "$json" -d "$(jq -nc --arg n "$team" '{name: $n}')" | jq -r .uuid)
                    fi
                    [ -n "$uuid" ] && [ "$uuid" != null ] || { echo "cannot find or create team $team" >&2; exit 1; }
                    for perm in "$@"; do
                      code=$(api POST "/api/v1/permission/$perm/team/$uuid" -o /dev/null -w '%{http_code}')
                      case "$code" in 200|304) ;; *) echo "adding $perm to $team failed ($code)" >&2; exit 1;; esac
                    done
                    mode=create
                    if kubectl -n "$ns" get secret "$secret" >/dev/null 2>&1; then
                      # the key is checked with the team's own call, so a key from a database that was recreated is replaced
                      old=$(kubectl -n "$ns" get secret "$secret" -o jsonpath='{.data.api-key}' | base64 -d)
                      if [ -n "$old" ] && [ "$(curl -sS -o /dev/null -w '%{http_code}' -H "X-Api-Key: $old" "$DT_URL/api/v1/team/self")" = 200 ]; then
                        mode=keep
                      else
                        mode=replace
                      fi
                    fi
                    if [ "$mode" != keep ]; then
                      key=$(api PUT "/api/v1/team/$uuid/key" | jq -r .key)
                      [ -n "$key" ] && [ "$key" != null ] || { echo "cannot create an API key for $team" >&2; exit 1; }
                      kubectl -n "$ns" create secret generic "$secret" --from-literal=api-key="$key" --dry-run=client -o yaml \
                        | kubectl -n "$ns" "$( [ "$mode" = replace ] && echo replace || echo create )" -f - >/dev/null
                      echo "API key of team $team: $mode"
                    fi
                  }
                  jq -c '.[]' /config/teams.json > teams.jsonl
                  while read -r t; do
                    # shellcheck disable=SC2046
                    ensure_team "$(echo "$t" | jq -r .name)" "$(echo "$t" | jq -r .secret)" "$(echo "$t" | jq -r '.namespace // "security-system"')" $(echo "$t" | jq -r '.permissions[]')
                  done < teams.jsonl
                  failed=0

                  # 3. config properties: only the declared ones, values are strings, the type comes from the current property
                  [ "$(api GET /api/v1/configProperty -o props.json -w '%{http_code}')" = 200 ] || { echo "cannot list config properties" >&2; exit 1; }
                  jq -c '.[]' /config/properties.json > properties.jsonl
                  while read -r p; do
                    g=$(echo "$p" | jq -r .groupName); n=$(echo "$p" | jq -r .propertyName); v=$(echo "$p" | jq -r .propertyValue)
                    cur=$(jq -c --arg g "$g" --arg n "$n" '[.[] | select(.groupName == $g and .propertyName == $n)][0] // empty' props.json)
                    if [ -z "$cur" ]; then echo "unknown config property $g/$n" >&2; failed=$((failed+1)); continue; fi
                    if [ "$(echo "$cur" | jq -r '.propertyValue // ""')" = "$v" ]; then echo "unchanged $g/$n"; continue; fi
                    body=$(echo "$cur" | jq -c --arg v "$v" '{groupName, propertyName, propertyValue: $v, propertyType}')
                    code=$(api POST /api/v1/configProperty -H "$json" -d "$body" -o /dev/null -w '%{http_code}')
                    case "$code" in
                      200) echo "updated $g/$n" ;;
                      *) echo "failed $g/$n ($code)" >&2; failed=$((failed+1)) ;;
                    esac
                  done < properties.jsonl

                  # 4. extension settings, merged over the current ones
                  jq -c '.[]' /config/extensions.json > extensions.jsonl
                  while read -r e; do
                    point=$(echo "$e" | jq -r .point); name=$(echo "$e" | jq -r .name)
                    url="/api/v2/extension-points/$point/extensions/$name/config"
                    have='{}'
                    [ "$(api GET "$url" -o have.json -w '%{http_code}')" = 200 ] && have=$(jq -c '.config // {}' have.json)
                    body=$(jq -nc --argjson h "$have" --argjson w "$(echo "$e" | jq -c .config)" '{config: ($h * $w)}')
                    code=$(api PUT "$url" -H "$json" -d "$body" -o /dev/null -w '%{http_code}')
                    case "$code" in
                      204) echo "updated $point/$name" ;;
                      304) echo "unchanged $point/$name" ;;
                      *) echo "failed $point/$name ($code)" >&2; failed=$((failed+1)) ;;
                    esac
                  done < extensions.jsonl
                  [ "$failed" -eq 0 ]
              env:
                - name: HOME
                  value: /work
                - name: DT_URL
                  value: http://dependency-track-api-server.security-system.svc.cluster.local:8080
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 64Mi
            - name: config
              configMap:
                name: dependency-track-config
