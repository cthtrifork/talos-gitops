---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-track-config
  namespace: security-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dependency-track-config
  namespace: security-system
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "dependency-track-admin"
      - "dependency-track-api-key"
      - "dependency-track-vex-api-key"
    verbs:
      - "get"
      - "update" # replace a key the API no longer accepts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dependency-track-config
  namespace: security-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dependency-track-config
subjects:
  - kind: ServiceAccount
    name: dependency-track-config
    namespace: security-system
