---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: dependency-track-vex-github
  namespace: security-system
spec:
  appIDRef:
    name: dependency-track-vex-github-app
    key: app-id
  installIDRef:
    name: dependency-track-vex-github-app
    key: installation-id
  repositories:
    - talos-gitops
  permissions:
    contents: write
    pull_requests: write
  auth:
    privateKey:
      secretRef:
        name: dependency-track-vex-github-app
        key: private-key.pem
