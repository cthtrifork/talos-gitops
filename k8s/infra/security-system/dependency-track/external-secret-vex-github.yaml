# The installation token the VEX export pushes with: External Secrets signs a JWT with the App's private key
# (dependency-track-vex-github-app, SOPS-encrypted) and trades it for a one-hour token narrowed to this repository with
# Contents and Pull requests read/write. It is refreshed every 30 minutes, so the daily Job always finds a valid one.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-vex-github
  namespace: security-system
spec:
  # GitHub tokens expire after 60 minutes: keep this well below
  refreshInterval: 30m
  target:
    name: dependency-track-vex-github
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: dependency-track-vex-github
