# Default deny both ways for the namespace, then per workload what Hubble showed it needs. Reverse-direction flows in
# Hubble are replies on allowed connections and need no rule of their own.
# Fixed names used below: the Omni service exposer (host network: arrives as host or remote-node). Prometheus reaches the
# pods that carry the label prometheus-scrape through the cluster-wide policy in kube-prometheus-stack, not here.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: security-system-default-deny
  namespace: security-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: security-system-allow-dns-apiserver
  namespace: security-system
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API
    - toEntities:
        - kube-apiserver
---
# Dependency-Track API: the LAN clients (dependency-track-api-server-lb, 192.168.1.242 is world), Traefik (the UI's /api
# through the Cloudflare tunnel), sbom-hook. Needs the database, Trivy (trivy-system) and the
# internet (vulnerability feeds).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dependency-track-api-server
  namespace: security-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dependency-track-api-server
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: sbom-hook
        - matchLabels:
            app.kubernetes.io/name: dependency-track-config
        - matchLabels:
            app.kubernetes.io/name: dependency-track-vex-export
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            k8s:app.kubernetes.io/name: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-rc
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: dependency-track-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: trivy-system
            k8s:app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
    # DNS with the proxy on, so Cilium learns the addresses behind the hosts below
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # vulnerability feeds: the KEV lists in extensions.json, NVD, GitHub advisories and OSV, plus Go module metadata
    - toFQDNs:
        - matchName: www.cisa.gov
        - matchName: raw.githubusercontent.com
        - matchName: api.github.com
        - matchName: github.com
        - matchName: services.nvd.nist.gov
        - matchName: nvd.nist.gov
        - matchName: api.osv.dev
        - matchName: osv-vulnerabilities.storage.googleapis.com
        - matchName: proxy.golang.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Dependency-Track frontend: Traefik only (the Cloudflare tunnel, see post/security-system/dependency-track-ingressroute.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dependency-track-frontend
  namespace: security-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dependency-track-frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# Dependency-Track database (CloudNativePG): the API server, the operator in storage-system (status 8000 and SQL),
# and the instances of the same cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dependency-track-db
  namespace: security-system
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: dependency-track-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dependency-track-api-server
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage-system
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: dependency-track-db
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: dependency-track-db
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
---
# sbom-hook: receives the trivy-operator webhook from trivy-system (service port 80 to 4195) and uploads to Dependency-Track.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sbom-hook
  namespace: security-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: sbom-hook
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: trivy-system
            k8s:app.kubernetes.io/name: trivy-operator
      toPorts:
        - ports:
            - port: "4195"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dependency-track-api-server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# Config-as-code CronJob (dependency-track/config-cronjob.yaml): talks to the Dependency-Track API (the Kubernetes API comes
# from the default allow).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dependency-track-config
  namespace: security-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dependency-track-config
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dependency-track-api-server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# VEX export CronJob (dependency-track/vex-export-cronjob.yaml): reads the VEX documents from the Dependency-Track API, pushes
# a branch and opens a pull request on github.com / api.github.com (the Kubernetes API comes from the default allow).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dependency-track-vex-export
  namespace: security-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dependency-track-vex-export
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dependency-track-api-server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # DNS with the proxy on, so Cilium learns the addresses behind the hosts below
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
