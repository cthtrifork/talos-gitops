---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zot-edge-tls
  namespace: registry-system
spec:
  secretName: zot-edge-cert
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: certificate-cluster-issuer
  commonName: zot-edge.registry-system.svc
  dnsNames:
    - zot-edge.registry-system.svc
    - zot-edge.registry-system.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  isCA: false
