# With policyEnforcementMode: always the Cilium health endpoint is default-deny too, and the node-to-node health probes
# (cilium-health, from every node and from the local cilium_host address) were dropped as POLICY_DENIED. Allow them.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cilium-health
spec:
  endpointSelector:
    matchLabels:
      reserved:health: ""
  ingress:
    - fromEntities:
        - host
        - remote-node
  egress:
    - toEntities:
        - host
        - remote-node
