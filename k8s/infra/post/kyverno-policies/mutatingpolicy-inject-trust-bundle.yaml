# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/mutatingpolicy_v1.json
# Mounts the trust-manager CA bundle into every new Pod. Annotations, labels, cluster switch and exclusions: docs/security.md,
# "Trust bundle injection".
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-trust-bundle
spec:
  # an outage must not block pod admission
  failurePolicy: Ignore
  reinvocationPolicy: Never
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    # Circular: these would wait for a ConfigMap that only trust-manager (or a chart fetched by flux-system) delivers.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - flux-system
            - cert-manager-system
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  matchConditions:
    # Flux substitutes the variable; compared as a string so a typo turns the policy off.
    - name: cluster-switch
      expression: >-
        "${TRUST_INJECT:=false}" == "true"
    # not an annotation on the VM template: that would mark every running VM as needing a restart
    - name: not-virt-launcher
      expression: >-
        object.metadata.?labels["kubevirt.io"].orValue("") != "virt-launcher"
    - name: not-opted-out
      expression: >-
        object.metadata.?annotations["trust.portableinfo.cloud/inject"].orValue(object.metadata.?labels["trust.portableinfo.cloud/inject"].orValue("")) != "false"
  variables:
    - name: bundle
      expression: >-
        object.metadata.?annotations["trust.portableinfo.cloud/public"].orValue(object.metadata.?labels["trust.portableinfo.cloud/public"].orValue("")) == "true"
        ? "portableinfo-ca-bundle" : "portableinfo-internal-ca-bundle"
    - name: java
      expression: >-
        object.metadata.?annotations["trust.portableinfo.cloud/java"].orValue(object.metadata.?labels["trust.portableinfo.cloud/java"].orValue("")) == "true"
    - name: javaOpts
      expression: >-
        "-Djavax.net.ssl.trustStore=/etc/trust-bundle/ca-bundle.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"
  mutations:
    # Merge keys: volumes and env by name, volumeMounts by mountPath.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [
                Object.spec.volumes{
                  name: "portableinfo-trust-bundle",
                  configMap: Object.spec.volumes.configMap{
                    name: variables.bundle,
                    items: [
                      Object.spec.volumes.configMap.items{
                        key: "ca-bundle.crt",
                        path: "ca-bundle.crt"
                      }
                    ] + (variables.java ? [
                      Object.spec.volumes.configMap.items{
                        key: "ca-bundle.p12",
                        path: "ca-bundle.p12"
                      }
                    ] : [])
                  }
                }
              ],
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                volumeMounts: [
                  Object.spec.containers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/ssl/certs/ca-certificates.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  },
                  Object.spec.containers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/pki/tls/certs/ca-bundle.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  }
                ] + (variables.java ? [
                  Object.spec.containers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/trust-bundle/ca-bundle.p12",
                    subPath: "ca-bundle.p12",
                    readOnly: true
                  }
                ] : []),
                env: [
                  Object.spec.containers.env{
                    name: "SSL_CERT_FILE",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  },
                  Object.spec.containers.env{
                    name: "NODE_EXTRA_CA_CERTS",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  }
                ] + (variables.java ? [
                  Object.spec.containers.env{
                    name: "JAVA_TOOL_OPTIONS",
                    value: (c.?env.orValue([]).filter(e, e.name == "JAVA_TOOL_OPTIONS").map(e, e.?value.orValue("")).join(" ") + " " + variables.javaOpts).trim()
                  }
                ] : [])
              }),
              initContainers: object.spec.?initContainers.orValue([]).map(c, Object.spec.initContainers{
                name: c.name,
                volumeMounts: [
                  Object.spec.initContainers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/ssl/certs/ca-certificates.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  },
                  Object.spec.initContainers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/pki/tls/certs/ca-bundle.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  }
                ],
                env: [
                  Object.spec.initContainers.env{
                    name: "SSL_CERT_FILE",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  },
                  Object.spec.initContainers.env{
                    name: "NODE_EXTRA_CA_CERTS",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  }
                ]
              })
            }
          }
