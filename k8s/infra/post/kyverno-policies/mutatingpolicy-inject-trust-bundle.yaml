# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/mutatingpolicy_v1.json
# Mounts the trust-manager CA bundle into every container of a new Pod (docs/security.md, "Trust bundle injection").
#
# Pod annotations:
#   trust.portableinfo.cloud/inject: "false"  opts the pod out
#   trust.portableinfo.cloud/public: "true"   mounts portableinfo-ca-bundle (public + internal CAs) instead of
#                                             portableinfo-internal-ca-bundle (internal root CA only)
#
# Rollout: a MutatingPolicy has no audit action, so the first stage is opt-in. While TRUST_INJECT_ENFORCE (cluster-vars.env)
# is false only pods annotated trust.portableinfo.cloud/inject: "true" are mutated. Once the workloads that call the internet
# carry public: "true", set it to true and every pod outside the excluded namespaces is mutated.
#
# Pods only, no autogen: mutating the pod template of a Deployment would fight Flux drift detection.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-trust-bundle
spec:
  # an outage must not block pod admission
  failurePolicy: Ignore
  reinvocationPolicy: Never
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    # Bootstrap namespaces: a pod waiting for a ConfigMap that trust-manager creates (or for Kyverno itself) could deadlock
    # cluster startup. policy-system is Kyverno, cert-manager-system is cert-manager and trust-manager.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - flux-system
            - policy-system
            - cert-manager-system
            - openebs-system
            - metallb-system
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  matchConditions:
    - name: rollout-stage
      expression: >-
        ${TRUST_INJECT_ENFORCE:=false} ||
        (has(object.metadata.annotations) && "trust.portableinfo.cloud/inject" in object.metadata.annotations &&
          object.metadata.annotations["trust.portableinfo.cloud/inject"] == "true")
    - name: not-opted-out
      expression: >-
        !(has(object.metadata.annotations) && "trust.portableinfo.cloud/inject" in object.metadata.annotations &&
          object.metadata.annotations["trust.portableinfo.cloud/inject"] == "false")
  variables:
    - name: bundle
      expression: >-
        has(object.metadata.annotations) && "trust.portableinfo.cloud/public" in object.metadata.annotations &&
          object.metadata.annotations["trust.portableinfo.cloud/public"] == "true"
        ? "portableinfo-ca-bundle" : "portableinfo-internal-ca-bundle"
  mutations:
    # Merge keys: volumes and env by name, volumeMounts by mountPath. An env var or mount the pod already sets for the same
    # name/path is replaced.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [
                Object.spec.volumes{
                  name: "portableinfo-trust-bundle",
                  configMap: Object.spec.volumes.configMap{
                    name: variables.bundle,
                    items: [
                      Object.spec.volumes.configMap.items{
                        key: "ca-bundle.crt",
                        path: "ca-bundle.crt"
                      }
                    ]
                  }
                }
              ],
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                volumeMounts: [
                  Object.spec.containers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/ssl/certs/ca-certificates.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  },
                  Object.spec.containers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/pki/tls/certs/ca-bundle.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  }
                ],
                env: [
                  Object.spec.containers.env{
                    name: "SSL_CERT_FILE",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  },
                  Object.spec.containers.env{
                    name: "NODE_EXTRA_CA_CERTS",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  }
                ]
              }),
              initContainers: object.spec.?initContainers.orValue([]).map(c, Object.spec.initContainers{
                name: c.name,
                volumeMounts: [
                  Object.spec.initContainers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/ssl/certs/ca-certificates.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  },
                  Object.spec.initContainers.volumeMounts{
                    name: "portableinfo-trust-bundle",
                    mountPath: "/etc/pki/tls/certs/ca-bundle.crt",
                    subPath: "ca-bundle.crt",
                    readOnly: true
                  }
                ],
                env: [
                  Object.spec.initContainers.env{
                    name: "SSL_CERT_FILE",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  },
                  Object.spec.initContainers.env{
                    name: "NODE_EXTRA_CA_CERTS",
                    value: "/etc/ssl/certs/ca-certificates.crt"
                  }
                ]
              })
            }
          }
