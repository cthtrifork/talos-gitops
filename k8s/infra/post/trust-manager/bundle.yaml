# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/trust.cert-manager.io/bundle_v1alpha1.json
# Two ConfigMaps in every namespace, mounted into pods by the Kyverno policy inject-trust-bundle (docs/security.md, "Trust bundle injection").
# internal: root CA only (the default). public: public CAs plus the root CA. The p12 key is for Java; Modern2023 because the default
# LegacyRC2 profile is not readable by recent JDKs.
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: portableinfo-internal-ca-bundle
spec:
  sources:
    - secret:
        name: portableinfo-root-ca
        key: ca.crt
  target:
    configMap:
      key: ca-bundle.crt
    additionalFormats:
      pkcs12:
        key: ca-bundle.p12
        password: changeit
        profile: Modern2023
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: portableinfo-ca-bundle
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: portableinfo-root-ca
        key: ca.crt
  target:
    configMap:
      key: ca-bundle.crt
    additionalFormats:
      pkcs12:
        key: ca-bundle.p12
        password: changeit
        profile: Modern2023
