# Default deny both ways, then what each workload needs. Host-network components (node exporter, kubelet, Cilium, Hubble) are not covered.
# Scraping is opt-in: pods labelled `prometheus-scrape: "true"` are reachable from Prometheus via the cluster-wide policy.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-prometheus-stack-system-default-deny
  namespace: kube-prometheus-stack-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-prometheus-stack-system-allow-dns-apiserver
  namespace: kube-prometheus-stack-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# Prometheus: scrape egress to the cluster's metrics ports. Ingress from the Omni service exposer (host network: arrives as
# host or remote-node) and the LAN (the Claude VM pushes OTLP through prometheus-otlp-lb).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: kube-prometheus-stack-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromCIDR:
        - 192.168.1.0/24
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-rc
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-usage
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-trivy
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "4195"
              protocol: TCP
            - port: "3903"
              protocol: TCP
            - port: "5000"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "9000"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9102"
              protocol: TCP
            - port: "9103"
              protocol: TCP
            - port: "9104"
              protocol: TCP
            - port: "9121"
              protocol: TCP
            - port: "9153"
              protocol: TCP
            - port: "9187"
              protocol: TCP
            - port: "9402"
              protocol: TCP
            - port: "9500"
              protocol: TCP
            - port: "9618"
              protocol: TCP
            - port: "9641"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9965"
              protocol: TCP
            - port: "10250"
              protocol: TCP
---
# Operator: the API server calls the admission webhook (443 to 10250); the chart's own operator policy is disabled.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prom-operator
  namespace: kube-prometheus-stack-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prom-prometheus-operator
      app.kubernetes.io/component: prometheus-operator
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
