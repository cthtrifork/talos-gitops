# Nothing else reports a Job or CronJob that failed: the pod is gone or Completed, and no Deployment is short of replicas.
# kube-state-metrics gives the Job and CronJob state; a failed Job lingers in the history limit, so a CronJob alert looks only at runs newer than its last success.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: job-alerts
  namespace: kube-prometheus-stack-system
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: jobs
      rules:
        - alert: CronJobLastRunFailed
          # a failed Job of a CronJob that started after the CronJob's last success; a later success clears it
          expr: >-
            (
              (kube_job_status_start_time * on (namespace, job_name) group_left (owner_name) kube_job_owner{owner_kind="CronJob"})
              > on (namespace, owner_name) group_left ()
              label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.*)")
              or on (namespace, owner_name)
              (kube_job_status_start_time * on (namespace, job_name) group_left (owner_name) kube_job_owner{owner_kind="CronJob"})
              unless on (namespace, owner_name)
              label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.*)")
            )
            and on (namespace, job_name) (kube_job_failed{condition="true"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.owner_name }}: the Job {{ $labels.job_name }} failed and no run has succeeded since"
            description: "kubectl -n {{ $labels.namespace }} describe job {{ $labels.job_name }}; kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}"
        - alert: JobFailed
          # a Job without a CronJob (Flux, Helm hook, ResourceSet, scanner) failed in the last 7 days; it stays until the Job is deleted
          expr: >-
            (kube_job_failed{condition="true"} == 1)
            unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
            and on (namespace, job_name) (time() - kube_job_status_start_time < 7 * 86400)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.job_name }} failed"
            description: "kubectl -n {{ $labels.namespace }} describe job {{ $labels.job_name }}; kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}"
        - alert: JobRunningTooLong
          # a Job without activeDeadlineSeconds that hangs never fails
          expr: >-
            (kube_job_status_active > 0)
            and on (namespace, job_name) (time() - kube_job_status_start_time > 6 * 3600)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.job_name }} has been running for over 6h"
            description: "kubectl -n {{ $labels.namespace }} describe job {{ $labels.job_name }}; kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}"
        - alert: CronJobNotSucceeding
          # no success for more than two schedule intervals (next minus last schedule), or never; catches a missed schedule and a Job that was never created
          expr: >-
            (
              time() - kube_cronjob_status_last_successful_time
              > on (namespace, cronjob) 2 * (kube_cronjob_next_schedule_time - kube_cronjob_status_last_schedule_time) + 1800
            )
            or on (namespace, cronjob)
            (kube_cronjob_status_last_schedule_time unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded for more than two schedule intervals"
            description: "kubectl -n {{ $labels.namespace }} describe cronjob {{ $labels.cronjob }}; kubectl -n {{ $labels.namespace }} get jobs"
        - alert: CronJobSuspended
          expr: kube_cronjob_spec_suspend == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.cronjob }} has been suspended for 1h"
            description: "A suspended CronJob never runs: spec.suspend in Git, or kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }} -o yaml"
