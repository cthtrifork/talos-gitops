# Claude VM OTLP: its egress gateway forwards plain HTTP by Host on port 80 to this LB (192.168.1.243; Cloudflare A record otel.portableinfo.cloud).
# The Service reaches the whole Prometheus HTTP API (admin API off); OTLP is /api/v1/otlp/v1/metrics.
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-otlp-lb
  namespace: kube-prometheus-stack-system
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.243
spec:
  type: LoadBalancer
  ports:
    - name: http-web
      port: 80
      targetPort: http-web
      protocol: TCP
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kube-prom-prometheus
