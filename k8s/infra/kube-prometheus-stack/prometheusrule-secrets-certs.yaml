# cert-manager renews a third of the lifetime before expiry, so under 21 days left means the renewal is failing.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secrets-certs-alerts
  namespace: kube-prometheus-stack-system
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}
            description: cert-manager should have renewed it already. kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }} shows the failing request.
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready
            description: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }} shows why (issuer, ACME order or DNS-01 challenge).
    - name: external-secrets
      rules:
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not synced
            description: The target Secret is not being updated. kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }} shows the error (for example api.github.com blocked, see the cilium-drops skill).
        - alert: ExternalSecretSyncErrors
          expr: sum by (namespace, name) (increase(externalsecret_sync_calls_error[30m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has sync errors
            description: "{{ $value | humanize }} failed syncs in the last 30 minutes."
