---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vex-cache-refresh
  namespace: trivy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vex-cache-refresh
  namespace: trivy-system
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - trivy-ignorefile
      - trivy-ignorepolicy
      - vex-cache-state
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - vex-cache-state
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vex-cache-refresh
  namespace: trivy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vex-cache-refresh
subjects:
  - kind: ServiceAccount
    name: vex-cache-refresh
    namespace: trivy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vex-cache-refresh
rules:
  - apiGroups:
      - aquasecurity.github.io
    resources:
      - vulnerabilityreports
    verbs:
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vex-cache-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vex-cache-refresh
subjects:
  - kind: ServiceAccount
    name: vex-cache-refresh
    namespace: trivy-system
