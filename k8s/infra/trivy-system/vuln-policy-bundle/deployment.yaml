# Serves trivyignore.yaml as a Dependency-Track vulnerability policy bundle (README.md). Reloader restarts it when the file changes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-policy-bundle
  namespace: trivy-system
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vuln-policy-bundle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vuln-policy-bundle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: build
          image: ghcr.io/cthtrifork/talos-gitops/tools:1.37.2-20261126.3@sha256:8849a678b45ff8affc709870049f6a36af4b8f89b9f0b5010d357ece0647f124
          command:
            - /bin/sh
            - /build/build.sh
          volumeMounts:
            - name: build
              mountPath: /build
              readOnly: true
            - name: ignorefile
              mountPath: /etc/trivy/.trivyignore.yaml
              subPath: .trivyignore.yaml
              readOnly: true
            - name: srv
              mountPath: /srv
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: server
          image: mirror.gcr.io/nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /bundle.zip
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: srv
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: build
          configMap:
            name: vuln-policy-bundle-build
        - name: ignorefile
          configMap:
            name: trivy-ignorefile
        - name: srv
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
