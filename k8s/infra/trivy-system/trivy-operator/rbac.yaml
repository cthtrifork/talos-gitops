---
# Operator 0.36.1 watches PVs/PVCs, which the 0.32.1 chart's ClusterRole does not grant (the operator exits).
# Drop this file once the chart is bumped to one that grants them (0.38.1 does but is not published to the OCI registry).
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator-storage
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator-storage
subjects:
  - kind: ServiceAccount
    name: trivy-operator
    namespace: trivy-system
