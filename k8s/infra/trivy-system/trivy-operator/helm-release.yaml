---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  chartRef:
    kind: OCIRepository
    name: aqua
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    disableWait: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  # The server listens only after downloading the DBs (~1 GB) through zot, which outlasts the chart's ~100 s liveness probe:
  # a startup probe holds liveness back for up to 30 minutes.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: trivy-server
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    scheme: HTTP
                    path: /healthz
                    port: trivy-http
                  periodSeconds: 10
                  failureThreshold: 180
          # reloader restarts the server when its CA bundle or config change
          - target:
              kind: StatefulSet
              name: trivy-server
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: trivy-server
                annotations:
                  configmap.reloader.stakater.com/reload: portableinfo-internal-ca-bundle,trivy-operator-trivy-config
              spec:
                template:
                  metadata:
                    labels:
                      config-revision: "1" # bump to roll the server by hand
  # https://github.com/aquasecurity/trivy-operator/blob/main/deploy/helm/values.yaml
  values:
    image:
      registry: mirror.gcr.io
      # renovate: datasource=docker depName=mirror.gcr.io/aquasec/trivy-operator versioning=semver
      tag: 0.36.1@sha256:05191a514247ae644dd5cc71306a94f44faff0a6a3fa817235911b911ecebcb9
    excludeNamespaces: "arc-runners-system,arc-controller-system" # ephemeral CI runner pods are not worth scanning
    policiesBundle:
      registry: zot.registry-system.svc.cluster.local:5000/ghcr-cache
    trivy:
      debug: "false"
      slow: ${TRIVY_SLOW:=false} # true reduces load on the trivy server
      serverURL: "http://trivy-service.trivy-system.svc.cluster.local:4954"
      imageScanCacheDir: "/tmp/trivy/.cache"
      clientServerSkipUpdate: true
      skipJavaDBUpdate: false
      image:
        registry: ghcr.io
        repository: aquasecurity/trivy
        # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy versioning=semver
        tag: 0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      # DBs are pulled through zot's ghcr-cache: zot is the only thing that talks to the internet.
      dbRegistry: zot.registry-system.svc.cluster.local:5000/ghcr-cache
      dbRepository: aquasecurity/trivy-db
      javaDbRegistry: zot.registry-system.svc.cluster.local:5000/ghcr-cache
      javaDbRepository: aquasecurity/trivy-java-db
      registry:
        mirror:
          "ghcr.io": zot.registry-system.svc.cluster.local:5000/ghcr-cache
          "mirror.gcr.io": zot.registry-system.svc.cluster.local:5000/docker-hub-cache
          "registry-1.docker.io": zot.registry-system.svc.cluster.local:5000/docker-hub-cache
          "docker.io": zot.registry-system.svc.cluster.local:5000/docker-hub-cache
          "quay.io": zot.registry-system.svc.cluster.local:5000/quay-cache
          "registry.k8s.io": zot.registry-system.svc.cluster.local:5000/k8s-cache
      storageSize: "${TRIVY_STORAGE_SIZE:=10Gi}"
      ignoreFileName: /etc/trivy/.trivyignore.yaml
      configFile:

        ignorefile: /etc/trivy/.trivyignore.yaml
        ignore-policy: /etc/trivy/ignore-policy.rego
        vulnerability:
          severity-source:
            - redhat # more mature and trusted than NVD, which pulls from many volatile sources
            - auto # normal listing if redhat has no rating
          ignore-status:
            - will_not_fix
            - not_affected
          # read from the vex-cache volume, never updated
          vex:
            - repo
          skip-vex-repo-update: true
        scan:
          offline: true
          disable-telemetry: true
          skip-version-check: true
          show-suppressed: false
          scanners:
            - vuln
      server:
        replicas: 1 # more replicas need a redis cache backend
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
          fsGroup: 65534
          runAsGroup: 65534
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
            ephemeral-storage: "2Gi"
          limits:
            memory: 2Gi
        extraServerVolumes:
          volumeMounts:
            # trivy image docker.io/library/hello-world --vex repo --show-suppressed --format table --cache-dir=/home/scanner/.cache
            - name: configfile
              mountPath: /etc/trivy/trivy-config.yaml
              subPath: trivy.configFile
            - name: repository-config
              mountPath: /.trivy/vex/repository.yaml
              subPath: repository.yaml
            - name: ignore-file
              mountPath: /etc/trivy/.trivyignore.yaml
              subPath: .trivyignore.yaml
            - name: ignore-policy
              mountPath: /etc/trivy/ignore-policy.rego
              subPath: ignorePolicy
          volumes:
            - name: configfile
              configMap:
                name: trivy-operator-trivy-config
            - name: repository-config
              configMap:
                name: vex-repository-config
            - name: ignore-file
              configMap:
                name: trivy-ignorefile
            - name: ignore-policy
              configMap:
                name: trivy-ignorepolicy
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeralStorage: "100Mi"
        limits:
          memory: 4Gi
          ephemeralStorage: "2Gi"
    serviceMonitor:
      enabled: true
    operator:
      # the chart's checksum/config does not cover the scanJob.* keys
      annotations:
        configmap.reloader.stakater.com/reload: trivy-operator,trivy-operator-config,trivy-operator-trivy-config,portableinfo-internal-ca-bundle
      # Kyverno mounts the internal CA bundle (zot) into these pods and the scan jobs; they only talk to zot and each other,
      # so no public CAs
      podLabels:
        prometheus-scrape: "true"
        config-revision: "2" # bump to roll the operator after a scanJob.* change that reloader did not see
      replicas: 2
      scanJobsInSameNamespace: true
      # every report is POSTed here
      webhookBroadcastURL: http://sbom-hook.dependency-track-system.svc.cluster.local/sbom
      logDevMode: false
      builtInTrivyServer: true
      exposedSecretScannerEnabled: false
      scannerReportTTL: "${TRIVY_SCANNER_TTL:=12h}"
      scanJobTTL: "5m" # raise to keep finished jobs for troubleshooting
      scanJobsRetryDelay: "${TRIVY_SCAN_RETRY_DELAY:=5s}" # also the wait at the concurrent limit: a scan takes ~10 s, the default 30 s idled the slots
      # nodes are control-plane nodes with ~5 GB RAM; client-mode scans use far less than their 4Gi limit
      scanJobsConcurrentLimit: "${TRIVY_SCANNER_CONCURRENTLIMIT:=8}"
      sbomGenerationEnabled: true
      clusterComplianceEnabled: true
      infraAssessmentScannerEnabled: false # requires privileges that we do not like
      metricsVulnIdEnabled: true # adds the vulnerability ID to the metrics: high cardinality, but our dashboards use it
    resources:
      limits:
        ephemeral-storage: 2Gi
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
    trivyOperator:
      scanJobCustomVolumesMount:
        - name: trivy-cache
          mountPath: /tmp/trivy/.cache
        - name: repository-config
          mountPath: /.trivy/vex/repository.yaml
          subPath: repository.yaml
        # shared cache dir of the scan pod's containers: keeps them from downloading VEX repositories
        - name: vex-cache
          mountPath: /tmp/trivy/.cache/vex
          readOnly: true
        - name: ignore-file
          mountPath: /etc/trivy/.trivyignore.yaml
          subPath: .trivyignore.yaml
        - name: ignore-policy
          mountPath: /etc/trivy/ignore-policy.rego
          subPath: ignorePolicy
      scanJobCustomVolumes:
        - name: repository-config
          configMap:
            name: vex-repository-config

        - name: vex-cache
          image:
            reference: ghcr.io/cthtrifork/talos-gitops/vex-cache:latest
            pullPolicy: Always
        - name: ignore-file
          configMap:
            name: trivy-ignorefile
        - name: ignore-policy
          configMap:
            name: trivy-ignorepolicy
        - name: trivy-cache
          ephemeral: # not emptyDir, so big images do not fill the nodes
            volumeClaimTemplate:
              metadata:
                labels:
                  app: trivy-operator-scanjob-cache
              spec:
                storageClassName: lvm-fast
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: "${TRIVY_STORAGE_SIZE:=10Gi}" # some pods have several large images (timescaledb is 7 GiB)
      scanJobPodTemplatePodSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      scanJobCompressLogs: false
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    # Overriding these lists replaces the chart's defaults, so the /tmp mount is repeated.
    volumeMounts:
      - name: cache-policies
        mountPath: /tmp
        readOnly: false
    volumes:
      - name: cache-policies
        emptyDir:
          sizeLimit: 100Mi
    nodeCollector:
      registry: ghcr.io
      # renovate: datasource=docker depName=ghcr.io/aquasecurity/node-collector versioning=semver
      tag: 0.3.1@sha256:f4702ce4667388f0219d6248d623a7e816231c2d4561d6af01c3ae053e524025
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
