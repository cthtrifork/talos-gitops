# Only the namespaces listed below can use this store.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secret-store
spec:
  conditions:
    - namespaces:
        - secret-store
        - renovate-system
        - dependency-track-system
        - fileserver-system
        - arc-runners-system
        - claude-system
        - cilium-secrets
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: secret-store
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-store
          namespace: secret-store
