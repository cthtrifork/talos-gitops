# The cluster store: the Secrets in the namespace secret-store, readable from the namespaces below (an ExternalSecret
# anywhere else cannot use it). Generated Secrets are created there once (password.yaml, pushsecret.yaml) and copied into the
# namespaces that use them by an ExternalSecret that points at this store.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secret-store
spec:
  conditions:
    - namespaces:
        - secret-store
        - renovate-system
        - registry-system
        - security-system
        - fileserver-system
        - arc-runners-system
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: secret-store
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-store
          namespace: secret-store
