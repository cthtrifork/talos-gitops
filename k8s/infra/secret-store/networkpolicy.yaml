# Default deny both ways for the namespace. No pods run here today (only ClusterSecretStore, PushSecret and generated Secrets), so this closes the namespace before one does.
# DNS and the Kubernetes API are the only things allowed; add a policy per workload next to its manifests.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: secret-store-default-deny
  namespace: secret-store
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: secret-store-allow-dns-apiserver
  namespace: secret-store
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API
    - toEntities:
        - kube-apiserver
