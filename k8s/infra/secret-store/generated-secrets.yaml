# Generates the secrets that used to be created by Jobs with kubectl, so no value is in Git. A Password generator makes the
# value and a PushSecret writes it into the Secret of the same name in this namespace (the cluster store).
# updatePolicy IfNotExists: it is written once and never replaced, also not when a manifest here changes. To start over
# delete the key (or the Secret) in secret-store; the consumers follow within an hour. Only the fileserver token rotates.
# MIGRATION: an existing Secret must be copied here BEFORE this is applied (see the PR), or a new value is generated.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-access-key-id
  namespace: secret-store
spec:
  # Garage wants a key id of GK plus 24 hex characters: 12 characters, hex encoded
  length: 12
  encoding: hex
  prefix: GK
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-s3-key-id
  namespace: secret-store
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: garage-access-key-id
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: garage-s3-key
          property: access-key-id
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-secret-access-key
  namespace: secret-store
spec:
  # 64 hex characters: 32 characters, hex encoded
  length: 32
  encoding: hex
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-s3-key-secret
  namespace: secret-store
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: garage-secret-access-key
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: garage-s3-key
          property: secret-access-key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-secrets
  namespace: secret-store
spec:
  # Garage's RPC secret and admin token, 64 hex characters each
  length: 32
  encoding: hex
  noUpper: false
  allowRepeat: true
  secretKeys:
    - rpcSecret
    - adminToken
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-secrets
  namespace: secret-store
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: garage-secrets
  data:
    - match:
        secretKey: rpcSecret
        remoteRef:
          remoteKey: garage-secrets
          property: rpcSecret
    - match:
        secretKey: adminToken
        remoteRef:
          remoteKey: garage-secrets
          property: adminToken
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dependency-track-kek
  namespace: secret-store
spec:
  # the key encryption key of Dependency-Track: 32 characters, base64 encoded. Losing or changing it makes everything
  # Dependency-Track stored encrypted in its database unreadable.
  length: 32
  encoding: base64
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: dependency-track-kek
  namespace: secret-store
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: dependency-track-kek
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: dependency-track-kek
          property: kek
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: fileserver-upload-token
  namespace: secret-store
spec:
  # fs_ plus 64 hex characters
  length: 32
  encoding: hex
  prefix: fs_
  noUpper: false
  allowRepeat: true
  secretKeys:
    - current
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: fileserver-upload-token
  namespace: secret-store
spec:
  # The one Secret that rotates: a new token every 30 days (Replace). The fileserver reads current and rotated-at
  # (rotated-at feeds its fileserver_token_rotated_timestamp_seconds metric); Reloader restarts it on a change.
  refreshInterval: 720h
  updatePolicy: Replace
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: fileserver-upload-token
  template:
    engineVersion: v2
    mergePolicy: Merge
    data:
      rotated-at: '{{ dateInZone "2006-01-02T15:04:05Z" now "UTC" }}'
  data:
    - match:
        secretKey: current
        remoteRef:
          remoteKey: fileserver-upload-token
          property: current
    - match:
        secretKey: rotated-at
        remoteRef:
          remoteKey: fileserver-upload-token
          property: rotated-at
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dependency-track-admin
  namespace: secret-store
spec:
  # 32 letters and digits (no symbols: it is sent as a form value and typed into a login page)
  length: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: dependency-track-admin
  namespace: secret-store
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: dependency-track-admin
  template:
    engineVersion: v2
    mergePolicy: Merge
    data:
      username: admin
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: dependency-track-admin
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: dependency-track-admin
          property: password
