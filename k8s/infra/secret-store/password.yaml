# updatePolicy IfNotExists: written once, never replaced. To start over delete the key (or Secret) in secret-store.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-access-key-id
  namespace: secret-store
spec:
  # Garage key id: GK + 24 hex characters
  length: 12
  encoding: hex
  prefix: GK
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-secret-access-key
  namespace: secret-store
spec:
  length: 32
  encoding: hex
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-secrets
  namespace: secret-store
spec:
  length: 32
  encoding: hex
  noUpper: false
  allowRepeat: true
  secretKeys:
    - rpcSecret
    - adminToken
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dependency-track-kek
  namespace: secret-store
spec:
  # Losing or changing this Dependency-Track key encryption key makes its encrypted database content unreadable.
  length: 32
  encoding: base64
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: fileserver-upload-token
  namespace: secret-store
spec:
  length: 32
  encoding: hex
  prefix: fs_
  noUpper: false
  allowRepeat: true
  secretKeys:
    - current
---
# One poll token per VM; Cilium injects it into the VM's requests to the vm-upgrade listener (k8s/virtualmachines/*/networkpolicy.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: claude-vm-upgrade-token
  namespace: secret-store
spec:
  length: 32
  encoding: hex
  prefix: vmu_
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homeserver-vm-upgrade-token
  namespace: secret-store
spec:
  length: 32
  encoding: hex
  prefix: vmu_
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dependency-track-admin
  namespace: secret-store
spec:
  # no symbols: it is sent as a form value and typed into a login page
  length: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
