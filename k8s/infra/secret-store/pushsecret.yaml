---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: fileserver-upload-token
  namespace: secret-store
spec:
  # The one Secret that rotates: a new token every 30 days (Replace). The fileserver reads current and rotated-at
  # (rotated-at feeds its fileserver_token_rotated_timestamp_seconds metric); Reloader restarts it on a change.
  refreshInterval: 720h
  updatePolicy: Replace
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: fileserver-upload-token
  template:
    engineVersion: v2
    mergePolicy: Merge
    data:
      rotated-at: '{{ dateInZone "2006-01-02T15:04:05Z" now "UTC" }}'
  data:
    - match:
        secretKey: current
        remoteRef:
          remoteKey: fileserver-upload-token
          property: current
    - match:
        secretKey: rotated-at
        remoteRef:
          remoteKey: fileserver-upload-token
          property: rotated-at
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: dependency-track-admin
  namespace: secret-store
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: dependency-track-admin
  template:
    engineVersion: v2
    mergePolicy: Merge
    data:
      username: admin
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: dependency-track-admin
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: dependency-track-admin
          property: password
