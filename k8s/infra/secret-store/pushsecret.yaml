---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-s3-key-id
  namespace: secret-store
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: secret-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: garage-access-key-id
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: garage-s3-key
          property: access-key-id
