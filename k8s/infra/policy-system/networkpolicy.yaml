# Default deny both ways, then DNS and the Kubernetes API. Drops show as hubble_drop_total{reason="POLICY_DENIED"}.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-system-default-deny
  namespace: policy-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-system-allow-dns-apiserver
  namespace: policy-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# Polaris dashboard: the Omni service exposer runs on the host network, so its traffic arrives as host or remote-node.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-dashboard-ingress
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app: polaris
      component: dashboard
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-rc
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# The new pod audits on that first request
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-refresh
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: polaris-refresh
  egress:
    - toEndpoints:
        - matchLabels:
            app: polaris
            component: dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-dashboard-ingress-refresh
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app: polaris
      component: dashboard
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: polaris-refresh
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
