# Default deny both ways for the namespace, then DNS and the Kubernetes API for the controllers.
# Hubble reports anything dropped here as hubble_drop_total{reason="POLICY_DENIED"}.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-system-default-deny
  namespace: policy-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-system-allow-dns-apiserver
  namespace: policy-system
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API
    - toEntities:
        - kube-apiserver
---
# Polaris dashboard: read by the claude-rc pod and the cockpit (/results.json) and published by the Omni service exposer, which runs
# on the host network, so its traffic arrives as the host or remote-node entity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-dashboard-ingress
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app: polaris
      component: dashboard
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-rc
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-cockpit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# The Job asks the dashboard for /results.json (the new pod audits on that first request)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-refresh
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: polaris-refresh
  egress:
    - toEndpoints:
        - matchLabels:
            app: polaris
            component: dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-dashboard-ingress-refresh
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app: polaris
      component: dashboard
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: polaris-refresh
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# Kyverno admission controller: the API server calls the webhook (9443), and the controller reads image signatures from the
# registry and the Sigstore trust root and transparency log. Add a registry here when an ImageValidatingPolicy covers images from it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kyverno-admission-controller
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: admission-controller
      app.kubernetes.io/part-of: kyverno
  ingress:
    # the API server runs on the host network on Talos
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          # lets Cilium learn the addresses behind the hosts below
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        # registry of the images in ClusterImagePolicy (token, manifests, signature bundles)
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        # Sigstore trust root (TUF) and transparency log
        - matchName: tuf-repo-cdn.sigstore.dev
        - matchName: rekor.sigstore.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
