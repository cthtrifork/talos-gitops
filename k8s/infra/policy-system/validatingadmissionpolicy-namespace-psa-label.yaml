---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# A namespace must set the pod-security.kubernetes.io/enforce label. The namespaces Kubernetes and Flux create themselves are exempt.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-namespace-psa-enforce
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: not-a-system-namespace
      expression: >-
        !(object.metadata.name in ["default", "kube-system", "kube-public", "kube-node-lease", "flux-system"])
  validations:
    - expression: >-
        object.metadata.?labels["pod-security.kubernetes.io/enforce"].orValue("") in ["privileged", "baseline", "restricted"]
      message: the label pod-security.kubernetes.io/enforce must be privileged, baseline or restricted
