---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: policy-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: polaris
      version: 6.0.1
      sourceRef:
        name: fairwinds
        kind: HelmRepository
        namespace: policy-system
  driftDetection:
    mode: enabled
    ignore:
      # set by polaris-refresh's "kubectl rollout restart"
      - paths:
          - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        target:
          kind: Deployment
          name: polaris-dashboard
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # https://github.com/FairwindsOps/charts/blob/master/stable/polaris/values.yaml
  values:
    image:
      repository: quay.io/fairwinds/polaris
      pullPolicy: IfNotPresent
      # renovate: datasource=docker depName=quay.io/fairwinds/polaris versioning=docker
      tag: 10.1.8@sha256:7af688527df75c3825395ded8aeb3775fad2027228aa06c9959d39ae6c00e999
    rbac:
      enabled: true
    dashboard:
      replicas: 1
      pdb:
        # one replica: maxUnavailable 1 allows eviction anyway
        enable: false
      service:
        annotations:
          omni-kube-service-exposer.sidero.dev/icon: 
          omni-kube-service-exposer.sidero.dev/label: "Polaris"
          omni-kube-service-exposer.sidero.dev/port: "50088"
          omni-kube-service-exposer.sidero.dev/prefix: polaris
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 256Mi
      containerSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    mergeConfig: true
    config:
      checks:
        # reliability
        priorityClassNotSet: ignore
        # PDBs do not help at one replica per workload
        missingPodDisruptionBudget: ignore
        pullPolicyNotAlways: ignore
        # single-node-class home cluster: these fire on almost every controller
        deploymentMissingReplicas: ignore
        metadataAndInstanceMismatched: ignore
        topologySpreadConstraint: ignore

        # security
        linuxHardening: danger
        # most pods need the token; the ones that do not are not worth a per-pod exemption
        automountServiceAccountToken: ignore
        missingNetworkPolicy: ignore

        # efficiency
        cpuLimitsMissing: ignore
      exemptions:
        # the node plugin runs lvm against the host's /dev and mounts into the kubelet directory; the controller's sidecars run as root
        - namespace: openebs-system
          controllerNames:
            - openebs-lvm-node
            - openebs-lvm-controller
          rules:
            - runAsPrivileged
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - hostPathSet
        - namespace: kube-system
          controllerNames:
            - cilium
            - hubble-ui
            - hubble-relay
          rules: []
        # Talos static pods
        - namespace: kube-system
          containerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules: []
        - namespace: flux-system
          controllerNames:
            - helm-controller
            - kustomize-controller
            - notification-controller
            - source-controller
          rules: []
        # Cluster-admin by design: Flux reconciles everything
        - controllerNames:
            - cluster-reconciler-flux-system
            - flux-operator
            - flux-operator-cluster-admin
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
        # wildcard read includes pods/exec and pods/attach (get, list, watch only)
        - controllerNames:
            - flux-web-admin
            - flux-web-user
          rules:
            - clusterrolePodExecAttach
        # Break-glass debug tier: pods/exec is its purpose; nothing binds it until a person grants a short-lived token
        - controllerNames:
            - claude-debug
          rules:
            - clusterrolePodExecAttach
        # the operator execs into its database pods
        - controllerNames:
            - cloudnative-pg
          rules:
            - clusterrolebindingPodExecAttach
            - clusterrolePodExecAttach
        # need host network and host paths (certificates, config, audit log)
        - controllerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules:
            - hostNetworkSet
            - hostPathSet
        # reads host /proc, /sys and / over the host network and PID namespace
        - controllerNames:
            - kube-prometheus-stack-prometheus-node-exporter
          rules:
            - hostNetworkSet
            - hostPIDSet
            - hostPathSet
        # speaker: host network, adds NET_RAW
        - controllerNames:
            - metallb-speaker
          rules:
            - hostNetworkSet
            - insecureCapabilities
        # frr-k8s: host network, adds NET_ADMIN and SYS_ADMIN
        - controllerNames:
            - metallb-frr-k8s
          rules:
            - hostNetworkSet
            - dangerousCapabilities
            - insecureCapabilities
        # manifest generated by Omni
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - hostNetworkSet
            - insecureCapabilities
        # containerd socket, content store and registry hosts config
        - controllerNames:
            - spegel
          rules:
            - hostPathSet
        # Docker-in-Docker runner (privileged by design, own namespace) and the rootful podman runner for ISO builds
        - namespace: arc-runners-system
          controllerNames:
            - arc-ubuntu
            - arc-iso-bootc
          rules:
            - runAsPrivileged
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - hostPathSet
        # keyword false positives: names and file references, not credentials
        - controllerNames:
            - metallb-speaker
            - metallb-controller
            - zot
            - harper-pad-admin
            - traefik
            - dependency-track-api-server
            - adguard-deployment
          rules:
            - sensitiveContainerEnvVar
        # keyword false positives: no credentials
        - controllerNames:
            - talos-bootstrap-manifests-inventory
            - trivy-operator-config
          rules:
            - sensitiveConfigmapContent
        # chart has no probe values: no readiness probe for cert-manager, none at all for cainjector
        - controllerNames:
            - cert-manager
            - cert-manager-cainjector
          rules:
            - readinessProbeMissing
            - livenessProbeMissing
        # chart has only a readiness probe value
        - controllerNames:
            - trust-manager
          rules:
            - livenessProbeMissing
        # generated listener/runner pods: no probe values, runner needs a writable root fs
        - controllerNames:
            - arc-ubuntu
            - arc-files-bootc
            - arc-iso-bootc
          rules:
            - readinessProbeMissing
            - livenessProbeMissing
            - notReadOnlyRootFilesystem
        # coredns (Talos, no seccomp profile set) and the MetalLB speaker (raw sockets)
        - controllerNames:
            - coredns
            - metallb-speaker
          rules:
            - runAsRootAllowed
            - linuxHardening
        # runs as root to use the containerd socket
        - controllerNames:
            - spegel
          rules:
            - runAsRootAllowed
        # not hardened or probed (frr-k8s has several containers; Omni exposer manifest is generated)
        - controllerNames:
            - metallb-frr-k8s
            - omni-kube-service-exposer
          rules:
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - notReadOnlyRootFilesystem
            - livenessProbeMissing
            - readinessProbeMissing
        # manifest generated by Omni
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
        # no health endpoint to probe (the cloudflared sidecars are probed with `cloudflared tunnel ready`)
        - controllerNames:
            - claude-rc
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # app container only: listens on loopback with no shell or health command in the image
        - controllerNames:
            - harper-pad-admin
          containerNames:
            - admin
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # The next exemptions are for files the CI audit reads from k8s/ that are not running pods.
        # zot: the audited rendered/ lacks the securityContext of the second postRenderers entry (the render script applies only
        # the first); the running StatefulSet is hardened.
        - namespace: registry-system
          controllerNames:
            - zot
          rules:
            - privilegeEscalationAllowed
            - insecureCapabilities
            - notReadOnlyRootFilesystem
        # Helm hooks that land in rendered/ (helm template includes hooks); the charts set no resources or probes
        - namespace: registry-system
          controllerNames:
            - spegel-cleanup
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
            - livenessProbeMissing
            - readinessProbeMissing
        - namespace: renovate-system
          controllerNames:
            - garage-configure
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
        # the operator's ClusterRole execs into pods by design
        - controllerNames:
            - kubevirt-operator
          rules:
            - clusterrolePodExecAttach
            - clusterrolebindingPodExecAttach
        - controllerNames:
            - cdi-operator
            - virt-operator
          rules:
            - memoryLimitsMissing
            - notReadOnlyRootFilesystem
        # limits and probes are set via customizeComponents; the operator templates fix the writable root fs and
        # cdi-deployment's exec-only readiness probe (a liveness probe on its /tmp/ready file would cause restarts)
        - namespace: cdi
          controllerNames:
            - cdi-apiserver
            - cdi-deployment
            - cdi-uploadproxy
          rules:
            - notReadOnlyRootFilesystem
        - namespace: cdi
          controllerNames:
            - cdi-deployment
          rules:
            - livenessProbeMissing
        # runs the VMs: privileged, root, host PID and host paths (/dev/kvm, kubelet, device plugins)
        - namespace: kubevirt
          controllerNames:
            - virt-handler
          rules:
            - privilegeEscalationAllowed
            - runAsPrivileged
            - runAsRootAllowed
            - insecureCapabilities
            - hostPIDSet
            - hostPathSet
            - linuxHardening
            - notReadOnlyRootFilesystem
        # built-in roles (tokenreviews/subjectaccessreviews only) that the CI audit cannot resolve and reports as cluster-admin
        - namespace: kube-system
          controllerNames:
            - metrics-server:system:auth-delegator
            - metrics-server-auth-reader
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
            - rolebindingClusterAdminRole
            - rolebindingRolePodExecAttach
        # Elevate Claude tiers: RoleBindings per grant to narrow ClusterRoles (no cluster-admin, no wildcards); Polaris reports
        # leftover bindings as cluster-admin. Any claude-elevate/<tier> namespace can get a grant, so no namespace is set.
        - controllerNames:
            - claude-elevate-flux
            - claude-elevate-ops
            - claude-elevate-storage
          rules:
            - rolebindingClusterAdminRole
        # aggregated ClusterRole (no wildcards, no pods/exec) that the CI audit cannot resolve and reports as cluster-admin
        - namespace: policy-system
          controllerNames:
            - kyverno:admission-controller
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
            - clusterrolePodExecAttach
        # non-root with only NET_BIND_SERVICE, but the binary's file capability needs allowPrivilegeEscalation
        - controllerNames:
            - adguard-deployment
          rules:
            - privilegeEscalationAllowed
        # env vars named *_SECRET_NAME/*_SECRET_KEY hold names, not values
        - namespace: renovate-system
          controllerNames:
            - renovate-operator
          rules:
            - sensitiveContainerEnvVar
