---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: policy-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: polaris
  driftDetection:
    mode: enabled
    ignore:
      # set by polaris-refresh's "kubectl rollout restart"
      - paths:
          - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        target:
          kind: Deployment
          name: polaris-dashboard
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # https://github.com/FairwindsOps/charts/blob/master/stable/polaris/values.yaml
  values:
    image:
      repository: quay.io/fairwinds/polaris
      pullPolicy: IfNotPresent
      # renovate: datasource=docker depName=quay.io/fairwinds/polaris versioning=docker
      tag: 10.1.8@sha256:7af688527df75c3825395ded8aeb3775fad2027228aa06c9959d39ae6c00e999
    rbac:
      enabled: true
    dashboard:
      replicas: 2
      pdb:
        enable: true
      # nodes have no zone label, and the chart default only prefers separate hosts
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              component: dashboard
      service:
        annotations:
          omni-kube-service-exposer.sidero.dev/icon: 
          omni-kube-service-exposer.sidero.dev/label: "Polaris"
          omni-kube-service-exposer.sidero.dev/port: "50088"
          omni-kube-service-exposer.sidero.dev/prefix: polaris
      resources:
        requests:
          cpu: 25m
          memory: 192Mi
        limits:
          # the first-request audit spiked past 256Mi (OOMKilled)
          memory: 512Mi
      containerSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    mergeConfig: true
    config:
      checks:
        # reliability
        priorityClassNotSet: ignore
        helmReleaseRemediation: danger
        trustBundleReload: warning
        # PDBs do not help at one replica per workload
        missingPodDisruptionBudget: ignore
        pullPolicyNotAlways: ignore
        # single-node-class home cluster: these fire on almost every controller
        deploymentMissingReplicas: ignore
        metadataAndInstanceMismatched: ignore
        topologySpreadConstraint: ignore

        # security
        linuxHardening: danger
        imageDigest: danger
        worldEgressNetworkPolicy: danger
        worldEgressClusterwidePolicy: danger
        namespacePsaLabel: danger
        # most pods need the token; the ones that do not are not worth a per-pod exemption
        automountServiceAccountToken: ignore
        missingNetworkPolicy: ignore

        # efficiency
        cpuLimitsMissing: ignore
      # Same rules as the admission policies (docs/security.md), which cannot see what is already in the cluster; HelmRelease remediation has no admission policy
      customChecks:
        # docs/helmrelease-conventions.md
        helmReleaseRemediation:
          successMessage: HelmRelease retries a failed install and upgrade
          failureMessage: HelmRelease must set non-zero spec.upgrade.remediation.retries and spec.install.remediation.retries (or install.strategy RetryOnFailure)
          category: Reliability
          target: helm.toolkit.fluxcd.io/HelmRelease
          schema:
            $schema: https://json-schema.org/draft/2019-09/schema
            type: object
            required:
              - spec
            properties:
              spec:
                type: object
                required:
                  - upgrade
                  - install
                properties:
                  upgrade:
                    type: object
                    required:
                      - remediation
                    properties:
                      remediation:
                        type: object
                        required:
                          - retries
                        properties:
                          retries:
                            type: integer
                            not:
                              const: 0
                  install:
                    type: object
                    anyOf:
                      - type: object
                        required:
                          - remediation
                        properties:
                          remediation:
                            type: object
                            required:
                              - retries
                            properties:
                              retries:
                                type: integer
                                not:
                                  const: 0
                      - required:
                          - strategy
                        properties:
                          strategy:
                            type: object
                            required:
                              - name
                            properties:
                              name:
                                const: RetryOnFailure
        # require-image-digest; a container without an image is set by an operator
        imageDigest:
          successMessage: Image is pinned by digest
          failureMessage: Image must be pinned by digest (name@sha256:...)
          category: Security
          target: Container
          schema:
            $schema: https://json-schema.org/draft/2019-09/schema
            type: object
            properties:
              image:
                type: string
                pattern: '@sha256:[a-f0-9]{64}'
        # deny-world-egress; claude-vm and homeserver-vm are exempt
        worldEgressNetworkPolicy:
          successMessage: CiliumNetworkPolicy does not allow world egress
          failureMessage: egress must not allow toEntities world or all; allow named hosts (toFQDNs) or addresses (toCIDRSet) instead
          category: Security
          target: cilium.io/CiliumNetworkPolicy
          schema:
            $schema: https://json-schema.org/draft/2019-09/schema
            type: object
            properties:
              spec:
                type: object
                properties:
                  egress:
                    type: array
                    items:
                      type: object
                      properties:
                        toEntities:
                          type: array
                          items:
                            not:
                              enum:
                                - world
                                - world-ipv4
                                - world-ipv6
                                - all
              specs:
                type: array
                items:
                  type: object
                  properties:
                    egress:
                      type: array
                      items:
                        type: object
                        properties:
                          toEntities:
                            type: array
                            items:
                              not:
                                enum:
                                  - world
                                  - world-ipv4
                                  - world-ipv6
                                  - all
        # deny-world-egress
        worldEgressClusterwidePolicy:
          successMessage: CiliumClusterwideNetworkPolicy does not allow world egress
          failureMessage: egress must not allow toEntities world or all; allow named hosts (toFQDNs) or addresses (toCIDRSet) instead
          category: Security
          target: cilium.io/CiliumClusterwideNetworkPolicy
          schema:
            $schema: https://json-schema.org/draft/2019-09/schema
            type: object
            properties:
              spec:
                type: object
                properties:
                  egress:
                    type: array
                    items:
                      type: object
                      properties:
                        toEntities:
                          type: array
                          items:
                            not:
                              enum:
                                - world
                                - world-ipv4
                                - world-ipv6
                                - all
              specs:
                type: array
                items:
                  type: object
                  properties:
                    egress:
                      type: array
                      items:
                        type: object
                        properties:
                          toEntities:
                            type: array
                            items:
                              not:
                                enum:
                                  - world
                                  - world-ipv4
                                  - world-ipv6
                                  - all
        # require-namespace-psa-enforce
        namespacePsaLabel:
          successMessage: Namespace sets pod-security.kubernetes.io/enforce
          failureMessage: the label pod-security.kubernetes.io/enforce must be privileged, baseline or restricted
          category: Security
          target: Namespace
          schema:
            $schema: https://json-schema.org/draft/2019-09/schema
            type: object
            required:
              - metadata
            properties:
              metadata:
                type: object
                required:
                  - labels
                properties:
                  labels:
                    type: object
                    required:
                      - pod-security.kubernetes.io/enforce
                    properties:
                      pod-security.kubernetes.io/enforce:
                        enum:
                          - privileged
                          - baseline
                          - restricted
        # require-trust-bundle-reload
        trustBundleReload:
          successMessage: Workload reloads when the injected trust bundle changes
          failureMessage: 'pod template is injected with a trust bundle but the workload does not name it in configmap.reloader.stakater.com/reload; add it, or trust.portableinfo.cloud/reload: "false" if it restarts by hand'
          category: Reliability
          target: Controller
          controllers:
            include:
              - Deployment
              - StatefulSet
              - DaemonSet
          schema:
            $schema: https://json-schema.org/draft/2019-09/schema
            type: object
            allOf:
              - if:
                  allOf:
                    - anyOf:
                        - type: object
                          required:
                            - spec
                          properties:
                            spec:
                              type: object
                              required:
                                - template
                              properties:
                                template:
                                  type: object
                                  required:
                                    - metadata
                                  properties:
                                    metadata:
                                      type: object
                                      required:
                                        - annotations
                                      properties:
                                        annotations:
                                          type: object
                                          required:
                                            - trust.portableinfo.cloud/public
                                          properties:
                                            trust.portableinfo.cloud/public:
                                              const: 'true'
                        - type: object
                          required:
                            - spec
                          properties:
                            spec:
                              type: object
                              required:
                                - template
                              properties:
                                template:
                                  type: object
                                  required:
                                    - metadata
                                  properties:
                                    metadata:
                                      type: object
                                      required:
                                        - labels
                                      properties:
                                        labels:
                                          type: object
                                          required:
                                            - trust.portableinfo.cloud/public
                                          properties:
                                            trust.portableinfo.cloud/public:
                                              const: 'true'
                    - not:
                        anyOf:
                          - type: object
                            required:
                              - spec
                            properties:
                              spec:
                                type: object
                                required:
                                  - template
                                properties:
                                  template:
                                    type: object
                                    required:
                                      - metadata
                                    properties:
                                      metadata:
                                        type: object
                                        required:
                                          - annotations
                                        properties:
                                          annotations:
                                            type: object
                                            required:
                                              - trust.portableinfo.cloud/inject
                                            properties:
                                              trust.portableinfo.cloud/inject:
                                                const: 'false'
                          - type: object
                            required:
                              - spec
                            properties:
                              spec:
                                type: object
                                required:
                                  - template
                                properties:
                                  template:
                                    type: object
                                    required:
                                      - metadata
                                    properties:
                                      metadata:
                                        type: object
                                        required:
                                          - labels
                                        properties:
                                          labels:
                                            type: object
                                            required:
                                              - trust.portableinfo.cloud/inject
                                            properties:
                                              trust.portableinfo.cloud/inject:
                                                const: 'false'
                    - not:
                        type: object
                        required:
                          - metadata
                        properties:
                          metadata:
                            type: object
                            required:
                              - annotations
                            properties:
                              annotations:
                                type: object
                                required:
                                  - trust.portableinfo.cloud/reload
                                properties:
                                  trust.portableinfo.cloud/reload:
                                    const: 'false'
                then:
                  anyOf:
                    - type: object
                      required:
                        - metadata
                      properties:
                        metadata:
                          type: object
                          required:
                            - annotations
                          properties:
                            annotations:
                              type: object
                              required:
                                - configmap.reloader.stakater.com/reload
                              properties:
                                configmap.reloader.stakater.com/reload:
                                  type: string
                                  pattern: (^|,)\s*portableinfo-ca-bundle\s*(,|$)
                    - type: object
                      required:
                        - spec
                      properties:
                        spec:
                          type: object
                          required:
                            - template
                          properties:
                            template:
                              type: object
                              required:
                                - metadata
                              properties:
                                metadata:
                                  type: object
                                  required:
                                    - annotations
                                  properties:
                                    annotations:
                                      type: object
                                      required:
                                        - configmap.reloader.stakater.com/reload
                                      properties:
                                        configmap.reloader.stakater.com/reload:
                                          type: string
                                          pattern: (^|,)\s*portableinfo-ca-bundle\s*(,|$)
              - if:
                  allOf:
                    - anyOf:
                        - type: object
                          required:
                            - spec
                          properties:
                            spec:
                              type: object
                              required:
                                - template
                              properties:
                                template:
                                  type: object
                                  required:
                                    - metadata
                                  properties:
                                    metadata:
                                      type: object
                                      required:
                                        - annotations
                                      properties:
                                        annotations:
                                          type: object
                                          required:
                                            - trust.portableinfo.cloud/java
                                          properties:
                                            trust.portableinfo.cloud/java:
                                              const: 'true'
                        - type: object
                          required:
                            - spec
                          properties:
                            spec:
                              type: object
                              required:
                                - template
                              properties:
                                template:
                                  type: object
                                  required:
                                    - metadata
                                  properties:
                                    metadata:
                                      type: object
                                      required:
                                        - labels
                                      properties:
                                        labels:
                                          type: object
                                          required:
                                            - trust.portableinfo.cloud/java
                                          properties:
                                            trust.portableinfo.cloud/java:
                                              const: 'true'
                    - not:
                        anyOf:
                          - type: object
                            required:
                              - spec
                            properties:
                              spec:
                                type: object
                                required:
                                  - template
                                properties:
                                  template:
                                    type: object
                                    required:
                                      - metadata
                                    properties:
                                      metadata:
                                        type: object
                                        required:
                                          - annotations
                                        properties:
                                          annotations:
                                            type: object
                                            required:
                                              - trust.portableinfo.cloud/public
                                            properties:
                                              trust.portableinfo.cloud/public:
                                                const: 'true'
                          - type: object
                            required:
                              - spec
                            properties:
                              spec:
                                type: object
                                required:
                                  - template
                                properties:
                                  template:
                                    type: object
                                    required:
                                      - metadata
                                    properties:
                                      metadata:
                                        type: object
                                        required:
                                          - labels
                                        properties:
                                          labels:
                                            type: object
                                            required:
                                              - trust.portableinfo.cloud/public
                                            properties:
                                              trust.portableinfo.cloud/public:
                                                const: 'true'
                    - not:
                        anyOf:
                          - type: object
                            required:
                              - spec
                            properties:
                              spec:
                                type: object
                                required:
                                  - template
                                properties:
                                  template:
                                    type: object
                                    required:
                                      - metadata
                                    properties:
                                      metadata:
                                        type: object
                                        required:
                                          - annotations
                                        properties:
                                          annotations:
                                            type: object
                                            required:
                                              - trust.portableinfo.cloud/inject
                                            properties:
                                              trust.portableinfo.cloud/inject:
                                                const: 'false'
                          - type: object
                            required:
                              - spec
                            properties:
                              spec:
                                type: object
                                required:
                                  - template
                                properties:
                                  template:
                                    type: object
                                    required:
                                      - metadata
                                    properties:
                                      metadata:
                                        type: object
                                        required:
                                          - labels
                                        properties:
                                          labels:
                                            type: object
                                            required:
                                              - trust.portableinfo.cloud/inject
                                            properties:
                                              trust.portableinfo.cloud/inject:
                                                const: 'false'
                    - not:
                        type: object
                        required:
                          - metadata
                        properties:
                          metadata:
                            type: object
                            required:
                              - annotations
                            properties:
                              annotations:
                                type: object
                                required:
                                  - trust.portableinfo.cloud/reload
                                properties:
                                  trust.portableinfo.cloud/reload:
                                    const: 'false'
                then:
                  anyOf:
                    - type: object
                      required:
                        - metadata
                      properties:
                        metadata:
                          type: object
                          required:
                            - annotations
                          properties:
                            annotations:
                              type: object
                              required:
                                - configmap.reloader.stakater.com/reload
                              properties:
                                configmap.reloader.stakater.com/reload:
                                  type: string
                                  pattern: (^|,)\s*portableinfo-internal-ca-bundle\s*(,|$)
                    - type: object
                      required:
                        - spec
                      properties:
                        spec:
                          type: object
                          required:
                            - template
                          properties:
                            template:
                              type: object
                              required:
                                - metadata
                              properties:
                                metadata:
                                  type: object
                                  required:
                                    - annotations
                                  properties:
                                    annotations:
                                      type: object
                                      required:
                                        - configmap.reloader.stakater.com/reload
                                      properties:
                                        configmap.reloader.stakater.com/reload:
                                          type: string
                                          pattern: (^|,)\s*portableinfo-internal-ca-bundle\s*(,|$)
      exemptions:
        # Images the Talos and Omni machine config sets, without a digest (same list as require-image-digest)
        - controllerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
            - coredns
            - omni-kube-service-exposer
          rules:
            - imageDigest
        # Cilium policies in these namespaces may allow world egress: claude-vm has its own egress gateway, homeserver-vm has no fixed host list
        - namespace: claude-vm
          rules:
            - worldEgressNetworkPolicy
        - namespace: homeserver-vm
          rules:
            - worldEgressNetworkPolicy
        # The cdi namespace label comes from a kustomize patch in k8s/infra/kubevirt, which the audit does not apply
        - controllerNames:
            - cdi
          rules:
            - namespacePsaLabel
        # Namespaces Kubernetes and Flux create themselves
        - controllerNames:
            - default
            - kube-system
            - kube-public
            - kube-node-lease
            - flux-system
          rules:
            - namespacePsaLabel
        # the node plugin runs lvm against the host's /dev and mounts into the kubelet directory; the controller's sidecars run as root
        - namespace: openebs-system
          controllerNames:
            - openebs-lvm-node
            - openebs-lvm-controller
          rules:
            - runAsPrivileged
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - hostPathSet
        # chart has no probe values, and the controller's sidecars and driver serve nothing to probe (the node pods are probed in
        # openebs-system/helm-release.yaml)
        - namespace: openebs-system
          controllerNames:
            - openebs-lvm-controller
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # FUSE mounts into the kubelet directory: the plugin is privileged (the controller adds SYS_ADMIN) and the chart sets no securityContext
        # or probes on its sidecars, which serve nothing to probe
        - namespace: juicefs-system
          controllerNames:
            - juicefs-csi-node
            - juicefs-csi-controller
          rules:
            - runAsPrivileged
            - dangerousCapabilities
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - hostPathSet
            - livenessProbeMissing
            - readinessProbeMissing
        # Mount pods the CSI driver creates per volume and node (juicefs-<node>-pvc-...): privileged FUSE, no probes
        - namespace: juicefs-system
          controllerNames:
            - juicefs-talos-
          rules:
            - runAsPrivileged
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - hostPathSet
            - livenessProbeMissing
            - readinessProbeMissing
        - namespace: kube-system
          controllerNames:
            - cilium
          rules: []
        - namespace: kube-system
          controllerNames:
            - hubble-ui
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # Talos static pods
        - namespace: kube-system
          containerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules: []
        - namespace: flux-system
          controllerNames:
            - helm-controller
            - kustomize-controller
            - notification-controller
            - source-controller
          rules: []
        # Cluster-admin by design: Flux reconciles everything
        - controllerNames:
            - cluster-reconciler-flux-system
            - flux-operator
            - flux-operator-cluster-admin
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
        # wildcard read includes pods/exec and pods/attach (get, list, watch only)
        - controllerNames:
            - flux-web-admin
            - flux-web-user
          rules:
            - clusterrolePodExecAttach
        # Break-glass debug tier: pods/exec is its purpose; nothing binds it until a person grants a short-lived token
        - controllerNames:
            - claude-debug
          rules:
            - clusterrolePodExecAttach
        # the operator execs into its database pods
        - controllerNames:
            - cloudnative-pg
          rules:
            - clusterrolebindingPodExecAttach
            - clusterrolePodExecAttach
        # the node plugin execs into the mount pods it manages
        - controllerNames:
            - juicefs-csi-external-node-service-role
          rules:
            - clusterrolePodExecAttach
        - controllerNames:
            - juicefs-csi-node-service-binding
          rules:
            - clusterrolebindingPodExecAttach
        # need host network and host paths (certificates, config, audit log)
        - controllerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules:
            - hostNetworkSet
            - hostPathSet
        # reads host /proc, /sys and / over the host network and PID namespace
        - controllerNames:
            - kube-prometheus-stack-prometheus-node-exporter
          rules:
            - hostNetworkSet
            - hostPIDSet
            - hostPathSet
        # speaker: host network, adds NET_RAW
        - controllerNames:
            - metallb-speaker
          rules:
            - hostNetworkSet
            - insecureCapabilities
        # frr-k8s: host network, adds NET_ADMIN and SYS_ADMIN
        - controllerNames:
            - metallb-frr-k8s
          rules:
            - hostNetworkSet
            - dangerousCapabilities
            - insecureCapabilities
        # manifest generated by Omni
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - hostNetworkSet
            - insecureCapabilities
        # containerd socket, content store and registry hosts config
        - controllerNames:
            - spegel
          rules:
            - hostPathSet
        # ARC runner scale sets (own namespace): the runner and the dind sidecar are privileged by design; the e2e runner keeps
        # privilege escalation and default capabilities so workflows can use sudo
        - namespace: arc-runners-system
          controllerNames:
            - arc-ubuntu
            - arc-iso-bootc
            - arc-e2e-talos-gitops
          rules:
            - runAsPrivileged
            - privilegeEscalationAllowed
            - insecureCapabilities
        # dind runs as root; the tmp-perms init container chmods /tmp as root (arc-ubuntu also matches arc-ubuntu-podman)
        - namespace: arc-runners-system
          controllerNames:
            - arc-ubuntu
            - arc-e2e-talos-gitops
          rules:
            - runAsRootAllowed
        # host /dev and /run/udev for loopback partitions in bootc installs
        - namespace: arc-runners-system
          controllerNames:
            - arc-ubuntu
            - arc-iso-bootc
          rules:
            - hostPathSet
        # the runner image writes to /etc and patches Runner.Worker.dll; the chart has no probe values for runner pods
        - namespace: arc-runners-system
          controllerNames:
            - arc-ubuntu
            - arc-iso-bootc
            - arc-files-bootc
            - arc-e2e-talos-gitops
          rules:
            - notReadOnlyRootFilesystem
            - readinessProbeMissing
            - livenessProbeMissing
        # keyword false positives: names and file references, not credentials
        - controllerNames:
            - metallb-speaker
            - metallb-controller
            - zot
            - harper-pad-admin
            - traefik
            - dependency-track-api-server
            - adguard-deployment
          rules:
            - sensitiveContainerEnvVar
        # keyword false positives: no credentials
        - controllerNames:
            - talos-bootstrap-manifests-inventory
            - trivy-operator-config
          rules:
            - sensitiveConfigmapContent
        # chart has no probe values: no readiness probe for cert-manager, none at all for cainjector
        - controllerNames:
            - cert-manager
            - cert-manager-cainjector
          rules:
            - readinessProbeMissing
            - livenessProbeMissing
        # chart has only a readiness probe value
        - controllerNames:
            - trust-manager
          rules:
            - livenessProbeMissing
        # coredns (Talos, no seccomp profile set) and the MetalLB speaker (raw sockets)
        - controllerNames:
            - coredns
            - metallb-speaker
          rules:
            - runAsRootAllowed
            - linuxHardening
        # runs as root to use the containerd socket
        - controllerNames:
            - spegel
          rules:
            - runAsRootAllowed
        # not hardened or probed (frr-k8s has several containers; Omni exposer manifest is generated)
        - controllerNames:
            - metallb-frr-k8s
            - omni-kube-service-exposer
          rules:
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - notReadOnlyRootFilesystem
            - livenessProbeMissing
            - readinessProbeMissing
        # manifest generated by Omni
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
        # no health endpoint to probe (the cloudflared sidecars are probed with `cloudflared tunnel ready`)
        - controllerNames:
            - claude-rc
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # app container only: listens on loopback with no shell or health command in the image
        - controllerNames:
            - harper-pad-admin
          containerNames:
            - admin
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # The next exemptions are for files the CI audit reads from k8s/ that are not running pods.
        # zot: the audited rendered/ lacks the securityContext of the second postRenderers entry (the render script applies only
        # the first); the running StatefulSet is hardened.
        - namespace: registry-system
          controllerNames:
            - zot
          rules:
            - privilegeEscalationAllowed
            - insecureCapabilities
            - notReadOnlyRootFilesystem
        # Helm hooks that land in rendered/ (helm template includes hooks); the charts set no resources or probes
        - namespace: registry-system
          controllerNames:
            - spegel-cleanup
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
            - livenessProbeMissing
            - readinessProbeMissing
        - namespace: renovate-system
          controllerNames:
            - garage-configure
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
        # the operator's ClusterRole execs into pods by design
        - controllerNames:
            - kubevirt-operator
          rules:
            - clusterrolePodExecAttach
            - clusterrolebindingPodExecAttach
        - controllerNames:
            - cdi-operator
            - virt-operator
          rules:
            - memoryLimitsMissing
            - notReadOnlyRootFilesystem
        # limits and probes are set via customizeComponents; the operator templates fix the writable root fs and
        # cdi-deployment's exec-only readiness probe (a liveness probe on its /tmp/ready file would cause restarts)
        - namespace: cdi
          controllerNames:
            - cdi-apiserver
            - cdi-deployment
            - cdi-uploadproxy
          rules:
            - notReadOnlyRootFilesystem
        - namespace: cdi
          controllerNames:
            - cdi-deployment
          rules:
            - livenessProbeMissing
        # runs the VMs: privileged, root, host PID and host paths (/dev/kvm, kubelet, device plugins)
        - namespace: kubevirt
          controllerNames:
            - virt-handler
          rules:
            - privilegeEscalationAllowed
            - runAsPrivileged
            - runAsRootAllowed
            - insecureCapabilities
            - hostPIDSet
            - hostPathSet
            - linuxHardening
            - notReadOnlyRootFilesystem
        # built-in roles (tokenreviews/subjectaccessreviews only) that the CI audit cannot resolve and reports as cluster-admin
        - namespace: kube-system
          controllerNames:
            - metrics-server:system:auth-delegator
            - metrics-server-auth-reader
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
            - rolebindingClusterAdminRole
            - rolebindingRolePodExecAttach
        # Elevate Claude tiers: RoleBindings per grant to narrow ClusterRoles (no cluster-admin, no wildcards); Polaris reports
        # leftover bindings as cluster-admin. Any claude-elevate/<tier> namespace can get a grant, so no namespace is set.
        - controllerNames:
            - claude-elevate-flux
            - claude-elevate-ops
            - claude-elevate-storage
          rules:
            - rolebindingClusterAdminRole
        # aggregated ClusterRole (no wildcards, no pods/exec) that the CI audit cannot resolve and reports as cluster-admin
        - namespace: policy-system
          controllerNames:
            - kyverno:admission-controller
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
            - clusterrolePodExecAttach
        # non-root with only NET_BIND_SERVICE, but the binary's file capability needs allowPrivilegeEscalation
        - controllerNames:
            - adguard-deployment
          rules:
            - privilegeEscalationAllowed
        # env vars named *_SECRET_NAME/*_SECRET_KEY hold names, not values
        - namespace: renovate-system
          controllerNames:
            - renovate-operator
          rules:
            - sensitiveContainerEnvVar
  postRenderers:
    - kustomize:
        patches:
          # The chart sets app.kubernetes.io/version to .Chart.Version without sanitizing it.
          # Flux appends the OCI digest as build metadata (e.g. 6.0.1+b448b3d95feb), and '+' is
          # not allowed in label values, so the API server rejects every resource with the label.
          - target:
              labelSelector: "app.kubernetes.io/version"
            patch: |
              - op: remove
                path: /metadata/labels/app.kubernetes.io~1version
          - target:
              kind: Deployment
              name: polaris-dashboard
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: polaris-dashboard
                namespace: policy-system
              spec:
                strategy:
                  rollingUpdate:
                    maxSurge: 1
                    maxUnavailable: 0
                template:
                  spec:
                    containers:
                      - name: dashboard
                        # Ready only after the first-request audit, so the old pod serves until then
                        startupProbe:
                          httpGet:
                            path: /results.json
                            port: 8080
                          timeoutSeconds: 120
                          periodSeconds: 10
                          failureThreshold: 30
