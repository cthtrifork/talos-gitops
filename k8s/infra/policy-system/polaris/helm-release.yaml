---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: policy-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: polaris
      version: 6.0.1
      sourceRef:
        name: fairwinds
        kind: HelmRepository
        namespace: policy-system
  driftDetection:
    mode: enabled
    ignore:
      # polaris-refresh (k8s/infra/policy-system) restarts the dashboard with "kubectl rollout restart", which sets this annotation
      - paths:
          - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        target:
          kind: Deployment
          name: polaris-dashboard
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # https://github.com/FairwindsOps/charts/blob/master/stable/polaris/values.yaml
  values:
    image:
      repository: quay.io/fairwinds/polaris
      pullPolicy: IfNotPresent
      # renovate: datasource=docker depName=quay.io/fairwinds/polaris versioning=docker
      tag: 10.1.8@sha256:7af688527df75c3825395ded8aeb3775fad2027228aa06c9959d39ae6c00e999
    rbac:
      enabled: true
    dashboard:
      replicas: 1
      pdb:
        # one replica: maxUnavailable 1 allows evicting it, so the chart PDB protects nothing
        enable: false
      service:
        annotations:
          omni-kube-service-exposer.sidero.dev/icon: 
          omni-kube-service-exposer.sidero.dev/label: "Polaris"
          omni-kube-service-exposer.sidero.dev/port: "50088"
          omni-kube-service-exposer.sidero.dev/prefix: polaris
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 256Mi
      containerSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    mergeConfig: true
    config:
      # This config file is merged with the default config file provided by Polaris
      # You should only include the keys and values that you want to override
      checks:
        # reliability
        priorityClassNotSet: ignore
        # PDBs do not help at one replica per workload
        missingPodDisruptionBudget: ignore
        pullPolicyNotAlways: ignore
        # single-node-class home cluster: these fire on almost every controller
        deploymentMissingReplicas: ignore
        metadataAndInstanceMismatched: ignore
        topologySpreadConstraint: ignore

        # security
        linuxHardening: danger
        # most pods need the token; the ones that do not are not worth a per-pod exemption
        automountServiceAccountToken: ignore
        missingNetworkPolicy: ignore

        # efficiency
        cpuLimitsMissing: ignore
      exemptions:
        # Ignore checks for cilium and hubble
        - namespace: kube-system
          controllerNames:
            - cilium
            - hubble-ui
            - hubble-relay
          rules: []
        # ignore checks for kube-apiserver, kube-controller-manager, kube-scheduler in kube-system namespace (Talos static
        # pods; etcd runs outside Kubernetes on Talos)
        - namespace: kube-system
          containerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules: []
        # Ignore checks for flux
        - namespace: flux-system
          controllerNames:
            - helm-controller
            - kustomize-controller
            - notification-controller
            - source-controller
          rules: []
        # Cluster-admin by design: Flux reconciles everything, and the flux-operator manages the Flux controllers
        - controllerNames:
            - cluster-reconciler-flux-system
            - flux-operator
            - flux-operator-cluster-admin
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
        # The Flux web UI roles read every resource, which includes pods/exec and pods/attach by wildcard (get, list, watch only)
        - controllerNames:
            - flux-web-admin
            - flux-web-user
          rules:
            - clusterrolePodExecAttach
        # Break-glass role for the debug tier: pods/exec is its purpose, and nothing binds it until a person grants a short-lived token
        - controllerNames:
            - claude-debug
          rules:
            - clusterrolePodExecAttach
        # The CNPG operator execs into its database pods; its role is not cluster-admin
        - controllerNames:
            - cloudnative-pg
          rules:
            - clusterrolebindingPodExecAttach
            - clusterrolePodExecAttach
        # Host-level components: they need the host network and host paths (certificates, config, audit log) to do their job
        - controllerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules:
            - hostNetworkSet
            - hostPathSet
        # node-exporter reads the host's /proc, /sys and / over the host network and PID namespace; no capabilities
        - controllerNames:
            - kube-prometheus-stack-prometheus-node-exporter
          rules:
            - hostNetworkSet
            - hostPIDSet
            - hostPathSet
        # MetalLB speaker announces addresses from the host network; adds NET_RAW only
        - controllerNames:
            - metallb-speaker
          rules:
            - hostNetworkSet
            - insecureCapabilities
        # frr-k8s runs BGP on the host network; the frr container adds NET_ADMIN and SYS_ADMIN
        - controllerNames:
            - metallb-frr-k8s
          rules:
            - hostNetworkSet
            - dangerousCapabilities
            - insecureCapabilities
        # The Omni service exposer listens on the host network and does not drop capabilities (manifest generated by Omni)
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - hostNetworkSet
            - insecureCapabilities
        # spegel mounts the containerd socket, content store and registry hosts config from the node
        - controllerNames:
            - spegel
          rules:
            - hostPathSet
        # Docker-in-Docker CI runner: privileged and root by design, isolated to its own namespace. arc-ubuntu is also the
        # AutoscalingRunnerSet that the CI audit reads from k8s/apps/arc-runner/rendered; the pods it creates are arc-ubuntu-runner-*
        # arc-iso-bootc is the privileged rootful podman runner for the installer ISO builds (loop devices, /dev and /run/udev)
        - namespace: arc-runners-system
          controllerNames:
            - arc-ubuntu
            - arc-iso-bootc
          rules:
            - runAsPrivileged
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - hostPathSet
        # Keyword false positives: names and file paths such as METALLB_ML_SECRET_NAME, STAKATER_*_SECRET and
        # DT_DATASOURCE_PASSWORD with a file reference; the credentials themselves come from secretKeyRef or mounted files
        - controllerNames:
            - metallb-speaker
            - metallb-controller
            - zot
            - harper-pad-admin
            - traefik
            - dependency-track-api-server
            - adguard-deployment
          rules:
            - sensitiveContainerEnvVar
        # Keyword false positives: ConfigMaps whose keys or scripts mention "token" or "secret", but hold no credentials
        - controllerNames:
            - talos-bootstrap-manifests-inventory
            - trivy-operator-config
          rules:
            - sensitiveConfigmapContent
        # Controllers that serve no traffic, and pods generated by operators whose chart has no probe values (cert-manager
        # controller readiness, cainjector, ARC listener and runner pods)
        # cert-manager chart: the controller has no readiness probe value and cainjector has no probe values at all
        - controllerNames:
            - cert-manager
            - cert-manager-cainjector
          rules:
            - readinessProbeMissing
            - livenessProbeMissing
        # trust-manager chart: only a readiness probe value, no liveness probe
        - controllerNames:
            - trust-manager
          rules:
            - livenessProbeMissing
        # Generated ARC listener and runner pods: no probe values, and the runner needs a writable root filesystem
        - controllerNames:
            - arc-ubuntu
            - arc-files-bootc
            - arc-iso-bootc
          rules:
            - readinessProbeMissing
            - livenessProbeMissing
            - notReadOnlyRootFilesystem
        # Run as root by design or are managed outside this repo: coredns (Talos), spegel (containerd mirror),
        # MetalLB (speaker and frr-k8s need raw sockets and file ownership), the Omni service exposer (managed by Omni)
        # Root with no seccomp profile set (coredns is managed by Talos); the rest of their hardening is in place
        - controllerNames:
            - coredns
            - metallb-speaker
          rules:
            - runAsRootAllowed
            - linuxHardening
        # spegel is hardened (seccomp, read-only root, probes) but runs as root to use the containerd socket
        - controllerNames:
            - spegel
          rules:
            - runAsRootAllowed
        # frr-k8s (several containers) and the Omni exposer (manifest generated by Omni) are not hardened or probed
        - controllerNames:
            - metallb-frr-k8s
            - omni-kube-service-exposer
          rules:
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - notReadOnlyRootFilesystem
            - livenessProbeMissing
            - readinessProbeMissing
        # The Omni service exposer's manifest is generated by Omni, so its resources cannot be set from here
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
        # No health endpoint to probe: claude-rc has none, and the harper-pad-admin app listens on loopback only with no shell
        # or health command in its image (see its manifest). The cloudflared sidecars are probed with `cloudflared tunnel ready`.
        - controllerNames:
            - claude-rc
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # harper-pad-admin app container only (the cloudflared sidecar has probes)
        - controllerNames:
            - harper-pad-admin
          containerNames:
            - admin
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # Storage provisioners, deliberately not hardened yet: they create and chmod host directories for every PVC, directly
        # (openebs) or through the helper pods they launch (local-path), and a wrong security context would stop all
        # provisioning. Revisit once there is a way to test it on a throwaway PVC.
        - controllerNames:
            - local-path-provisioner
            - openebs-localpv-localpv-provisioner
          rules:
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
        # The pods local-path-provisioner starts per PVC (helper-pod-create-pvc-<uid>, helper-pod-delete-pvc-<uid>): an untagged
        # busybox from its helperPod template that mkdirs and chmods the host path, as root, without probes or resources.
        # They live for seconds, but a dashboard audit that lands on one (Trivy scans create a PVC each) fails on all of these.
        - namespace: local-path-storage
          controllerNames:
            - helper-pod-
          rules:
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - tagNotSpecified
            - hostPathSet
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
            - livenessProbeMissing
            - readinessProbeMissing
        # The next four exemptions are for objects that the CI audit (.github/workflows/validate.yaml) reads from files in k8s/ but
        # that are not running pods in the cluster, so they only matter there.
        # zot: the CI audit reads the chart output in zot/rendered, which lacks the container securityContext that the second
        # postRenderers entry in zot/helm-release.yaml adds (the render script applies only the first entry). The running
        # StatefulSet drops all capabilities, forbids privilege escalation and has a read-only root filesystem.
        - namespace: registry-system
          controllerNames:
            - zot
          rules:
            - privilegeEscalationAllowed
            - insecureCapabilities
            - notReadOnlyRootFilesystem
        # Helm hooks of the spegel and garage charts (spegel-cleanup runs only on uninstall, garage-configure is a Job with
        # ttlSecondsAfterFinished 300): they are in rendered/ because helm template includes hooks, and the charts set no resources or probes
        - namespace: registry-system
          controllerNames:
            - spegel-cleanup
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
            - livenessProbeMissing
            - readinessProbeMissing
        - namespace: renovate-system
          controllerNames:
            - garage-configure
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
        # The upstream KubeVirt operator ClusterRole execs into pods by design
        - controllerNames:
            - kubevirt-operator
          rules:
            - clusterrolePodExecAttach
            - clusterrolebindingPodExecAttach
        - controllerNames:
            - cdi-operator
            - virt-operator
          rules:
            - memoryLimitsMissing
            - notReadOnlyRootFilesystem
        # The pods the operators create: their limits and probes are set through customizeComponents in post/kubevirt/kubevirt.yaml and
        # cdi.yaml. What stays is what the operator's templates fix: the CDI pods run with a writable root filesystem, and
        # cdi-deployment has only an exec readiness probe (its /tmp/ready file, which a liveness probe would turn into restarts)
        - namespace: cdi
          controllerNames:
            - cdi-apiserver
            - cdi-deployment
            - cdi-uploadproxy
          rules:
            - notReadOnlyRootFilesystem
        - namespace: cdi
          controllerNames:
            - cdi-deployment
          rules:
            - livenessProbeMissing
        # virt-handler runs the VMs on the node: privileged, root, host PID and host paths (/dev/kvm, kubelet and device-plugin
        # directories, the seccomp profile)
        - namespace: kubevirt
          controllerNames:
            - virt-handler
          rules:
            - privilegeEscalationAllowed
            - runAsPrivileged
            - runAsRootAllowed
            - insecureCapabilities
            - hostPIDSet
            - hostPathSet
            - linuxHardening
            - notReadOnlyRootFilesystem
        # metrics-server binds the built-in roles system:auth-delegator (create tokenreviews and subjectaccessreviews, nothing
        # else) and extension-apiserver-authentication-reader. The CI audit does not have those roles and reports the bindings
        # as cluster-admin with pod exec.
        - namespace: kube-system
          controllerNames:
            - metrics-server:system:auth-delegator
            - metrics-server-auth-reader
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
            - rolebindingClusterAdminRole
            - rolebindingRolePodExecAttach
        # The "Elevate Claude" tiers: the elevate page creates these RoleBindings per grant (k8s/apps/claude-system/elevate/) and binds
        # a short-lived ServiceAccount to the narrow ClusterRoles claude-ops, claude-storage and claude-flux
        # (clusterrole-elevated.yaml). None is cluster-admin: no wildcards, and the flux tier is limited by an admission policy.
        # Polaris reports the leftover bindings as cluster-admin. Any namespace labelled claude-elevate/<tier> can get a grant,
        # so no namespace is set.
        - controllerNames:
            - claude-elevate-flux
            - claude-elevate-ops
            - claude-elevate-storage
          rules:
            - rolebindingClusterAdminRole
        # Kyverno admission controller: its ClusterRole is an aggregation (rbac.kyverno.io/aggregate-to-admission-controller) with no
        # wildcard rules and no pods/exec, and the :view binding is the built-in view role. The CI audit cannot resolve the
        # aggregation and reports the roles as cluster-admin with pod exec.
        - namespace: policy-system
          controllerNames:
            - kyverno:admission-controller
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
            - clusterrolePodExecAttach
        # adguard-home runs non-root with only NET_BIND_SERVICE, but its binary's file capability needs
        # allowPrivilegeEscalation (no_new_privs off) to take effect; see the comment in its Deployment
        - controllerNames:
            - adguard-deployment
          rules:
            - privilegeEscalationAllowed
        # The renovate-operator's inline env vars named *_SECRET_NAME, *_SECRET_KEY and IMAGE_PULL_SECRETS hold the names of
        # Secrets and keys, not secret values (the S3 credentials are valueFrom secret references): a keyword match on the name
        - namespace: renovate-system
          controllerNames:
            - renovate-operator
          rules:
            - sensitiveContainerEnvVar
