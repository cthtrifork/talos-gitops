apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: polaris
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: polaris
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: polaris
    app.kubernetes.io/part-of: polaris
    component: dashboard
    helm.sh/chart: polaris-6.0.1
  name: polaris-dashboard
  namespace: policy-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: polaris
      app.kubernetes.io/instance: polaris
      app.kubernetes.io/name: polaris
      component: dashboard
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: fcdf58c64cfa928b4fe38aabb79427da47011d05db34e6c7b504f29a98bdb7d4
      labels:
        app: polaris
        app.kubernetes.io/instance: polaris
        app.kubernetes.io/name: polaris
        component: dashboard
    spec:
      containers:
      - command:
        - polaris
        - dashboard
        - --config
        - /opt/app/config.yaml
        - --port
        - "8080"
        - --log-level
        - Info
        - --merge-config
        image: quay.io/fairwinds/polaris:10.1.8@sha256:7af688527df75c3825395ded8aeb3775fad2027228aa06c9959d39ae6c00e999
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 20
        name: dashboard
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 20
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 6
          httpGet:
            path: /results.json
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 120
        volumeMounts:
        - mountPath: /opt/app/config.yaml
          name: config
          readOnly: true
          subPath: config.yaml
      nodeSelector: null
      serviceAccountName: polaris
      tolerations: null
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            component: dashboard
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - configMap:
          name: polaris
        name: config
