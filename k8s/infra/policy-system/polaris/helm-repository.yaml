---
# Fairwinds publishes no OCI chart (https://github.com/FairwindsOps/charts/issues/1755): the chart is mirrored to
# ghcr.io/cthtrifork/talos-gitops/charts by .github/workflows/helm-chart-sync.yaml and pulled through zot.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: polaris
  namespace: policy-system
spec:
  interval: 12h
  url: oci://zot.registry-system.svc.cluster.local:5000/ghcr-cache/cthtrifork/talos-gitops/charts/polaris
  ref:
    tag: 6.0.1
    digest: sha256:6d715e4d7d9f183b01e283c3b708197dd2408f6312b273cf5c1590a818a92616
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
