# Polaris audits once on its first request and has no refresh option, so the score goes stale. A Job per main commit sha
# (a new name is how an immutable Job runs again) restarts the dashboard and requests /results.json to trigger the audit.
# dependsOn is not tied to the sha: right after a push the audit may see the cluster one commit behind; the next commit corrects it.
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: polaris-refresh
  namespace: policy-system
spec:
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: flux-system
      namespace: flux-system
      ready: true
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: gitops-infra-policy-system
      namespace: flux-system
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: polaris-refresh-main
  resources:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: polaris-refresh-<< inputs.sha >>
        namespace: policy-system
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              app.kubernetes.io/name: polaris-refresh # selected by the network policy
          spec:
            restartPolicy: Never
            serviceAccountName: polaris-refresh
            automountServiceAccountToken: true # the ServiceAccount default is false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: refresh
                image: ghcr.io/cthtrifork/talos-gitops/tools:1.37.2-20261126.3@sha256:8849a678b45ff8affc709870049f6a36af4b8f89b9f0b5010d357ece0647f124
                command:
                  - bash
                  - -eu
                  - -c
                  - |
                    # rolling: the old pod serves the stale report until the new one is Ready
                    kubectl rollout restart deployment/polaris-dashboard -n policy-system
                    kubectl rollout status deployment/polaris-dashboard -n policy-system --timeout=300s
                    # the new pod audits on its first request
                    curl -fsS -o /dev/null --max-time 120 --retry 10 --retry-all-errors --retry-delay 3 http://polaris-dashboard.policy-system.svc.cluster.local/results.json
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - "ALL"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
