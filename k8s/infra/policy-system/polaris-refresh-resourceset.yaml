# The Polaris dashboard audits the cluster once, on its first request, and then serves that result from memory; the chart has
# no refresh option (helm-release.yaml), so the score goes stale. The Flux Operator re-runs a Job for every new commit on
# main: the ResourceSetInputProvider exports the branch's sha, and the ResourceSet renders one Job per sha (a Job spec is
# immutable, so a new name is how it runs again; Flux prunes the old one). dependsOn holds the Job back until the Flux
# Kustomizations are Ready. That is not tied to the sha: right after a push they can still be Ready at the previous commit,
# so the audit may see the cluster a few minutes behind and the next commit corrects it. The Job deletes the dashboard pod and
# requests /results.json from the new one, which runs the audit. Deleting the pod, not "kubectl rollout restart", leaves the
# Deployment unchanged, so Helm drift detection has nothing to correct.
# https://fluxoperator.dev/docs/resourcesets/staged-jobs/
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: polaris-refresh
  namespace: policy-system
spec:
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: flux-system
      namespace: flux-system
      ready: true
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: gitops-infra-policy-system
      namespace: flux-system
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: polaris-refresh-main
  resources:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: polaris-refresh-<< inputs.sha >>
        namespace: policy-system
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              app.kubernetes.io/name: polaris-refresh # selected by the network policy
          spec:
            restartPolicy: Never
            serviceAccountName: polaris-refresh
            automountServiceAccountToken: true # the ServiceAccount default is false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: refresh
                image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
                command:
                  - bash
                  - -eu
                  - -c
                  - |
                    kubectl delete pod -n policy-system -l app=polaris,component=dashboard --wait=false
                    # the new pod audits on its first request; retry until it is up
                    curl -fsS -o /dev/null --max-time 120 --retry 30 --retry-all-errors --retry-delay 4 http://polaris-dashboard.policy-system.svc.cluster.local/results.json
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - "ALL"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
