---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Kyverno reduced to the admission controller, which is all that verifying image signatures with an ImageValidatingPolicy
# (k8s/infra/image-policies) needs. Everything else is off: the background, cleanup and reports controllers, policy reports,
# background scans, the generated ValidatingAdmissionPolicies and the hook jobs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: policy-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kyverno
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
  # https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml
  values:
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    webhooksCleanup:
      enabled: false
    upgrade:
      legacyPolicyCheck:
        # pre-install Job that looks for legacy kyverno.io policies; there are none (the render-time check still runs)
        enabled: false
    crds:
      migration:
        enabled: false
      groups:
        # The legacy kyverno.io policy types are no longer executed in Kyverno 1.20, so none of their CRDs are installed
        kyverno:
          cleanuppolicies: false
          clustercleanuppolicies: false
          clusterpolicies: false
          globalcontextentries: false
          policies: false
          policyexceptions: false
          updaterequests: false
        reports:
          clusterephemeralreports: false
          ephemeralreports: false
        wgpolicyk8s:
          clusterpolicyreports: false
          policyreports: false
    features:
      admissionReports:
        enabled: false
      aggregateReports:
        enabled: false
      policyReports:
        enabled: false
      validatingAdmissionPolicyReports:
        enabled: false
      backgroundScan:
        enabled: false
      generateValidatingAdmissionPolicy:
        enabled: false
