---
# Source: policy-controller/templates/webhook/deployment_webhook.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    helm.sh/chart: policy-controller-0.10.8
    app.kubernetes.io/name: policy-controller
    app.kubernetes.io/instance: policy-controller
    app.kubernetes.io/version: "0.13.1"
    app.kubernetes.io/managed-by: Helm
    control-plane: policy-controller-webhook
  name: policy-controller-webhook
  namespace: policy-system
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-controller
      app.kubernetes.io/instance: policy-controller
      control-plane: policy-controller-webhook
  template:
    metadata:
      labels:
        control-plane: policy-controller-webhook
        helm.sh/chart: policy-controller-0.10.8
        app.kubernetes.io/name: policy-controller
        app.kubernetes.io/instance: policy-controller
        app.kubernetes.io/version: "0.13.1"
        app.kubernetes.io/managed-by: Helm
    spec:
      nodeSelector: {}
      tolerations: []
      serviceAccountName: policy-controller-webhook
      automountServiceAccountToken: true
      # To avoid node becoming SPOF, spread our replicas to different nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    control-plane: policy-controller-webhook
                topologyKey: kubernetes.io/hostname
              weight: 100
      containers:
        - name: policy-controller-webhook
          image: "ghcr.io/sigstore/policy-controller/policy-controller@sha256:0492bb264fb1d9bdc8e3f343ef542cc85b7dd7c7fd8d9524b453c2bd31a1d128"
          imagePullPolicy: "IfNotPresent"
          env:
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_LOGGING_NAME
              value: policy-controller-webhook-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: policy-controller-webhook-observability
            - name: METRICS_DOMAIN
              value: sigstore.dev/policy
            - name: WEBHOOK_NAME
              value: webhook
            - name: HOME
              value: /home/nonroot
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 1
            httpGet:
              port: 8443
              scheme: HTTPS
              path: /healthz
              httpHeaders:
                - name: k-kubelet-probe
                  value: "webhook"
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 20
            periodSeconds: 1
            httpGet:
              port: 8443
              scheme: HTTPS
              path: /readyz
              httpHeaders:
                - name: k-kubelet-probe
                  value: "webhook"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 1000
          volumeMounts:
            # Failing to provide a writable $HOME can cause TUF client initialization to panic
            - mountPath: /home/nonroot
              name: writable-home-dir
      # Our webhook should gracefully terminate by lame ducking first, set this to a sufficiently
      # high value that we respect whatever value it has configured for the lame duck grace period.
      terminationGracePeriodSeconds: 300
      volumes:
        - emptyDir: {}
          name: writable-home-dir
