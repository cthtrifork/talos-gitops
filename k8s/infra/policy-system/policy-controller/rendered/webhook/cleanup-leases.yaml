---
# Source: policy-controller/templates/webhook/cleanup-leases.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: policy-controller-cleanup
  namespace: policy-system
  labels:
    helm.sh/chart: policy-controller-0.10.8
    app.kubernetes.io/name: policy-controller
    app.kubernetes.io/instance: policy-controller
    app.kubernetes.io/version: "0.13.1"
    app.kubernetes.io/managed-by: Helm
    control-plane: policy-controller-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
subjects:
  - kind: ServiceAccount
    name: policy-controller-webhook-cleanup
    namespace: policy-system
roleRef:
  kind: Role
  name: policy-controller-cleanup
  apiGroup: rbac.authorization.k8s.io
---
# Source: policy-controller/templates/webhook/cleanup-leases.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: leases-cleanup
  namespace: policy-system
  labels:
    helm.sh/chart: policy-controller-0.10.8
    app.kubernetes.io/name: policy-controller
    app.kubernetes.io/instance: policy-controller
    app.kubernetes.io/version: "0.13.1"
    app.kubernetes.io/managed-by: Helm
    control-plane: policy-controller-webhook
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: leases-cleanup
    spec:
      serviceAccountName: policy-controller-webhook-cleanup
      automountServiceAccountToken: true
      containers:
        - name: kubectl
          image: "cgr.dev/chainguard/kubectl:latest-dev"
          imagePullPolicy: "IfNotPresent"
          command:
            - /bin/sh
            - -c
            - kubectl delete leases --all --ignore-not-found -n policy-system
          resources:
            limits:
            requests:
      restartPolicy: OnFailure
