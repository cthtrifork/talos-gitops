# Service account and RBAC of the Polaris refresh Job (polaris-refresh-resourceset.yaml)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris-refresh
  namespace: policy-system
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-refresh
  namespace: policy-system
rules:
  # kubectl rollout status
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
  # kubectl rollout restart
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - polaris-dashboard
    verbs:
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-refresh
  namespace: policy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-refresh
subjects:
  - kind: ServiceAccount
    name: polaris-refresh
    namespace: policy-system
