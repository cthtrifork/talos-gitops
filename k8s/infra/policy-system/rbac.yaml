# Service account and RBAC of the Polaris refresh Job (polaris-refresh-resourceset.yaml)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris-refresh
  namespace: policy-system
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-refresh
  namespace: policy-system
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-refresh
  namespace: policy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-refresh
subjects:
  - kind: ServiceAccount
    name: polaris-refresh
    namespace: policy-system

---
# Read the Flux Kustomizations' status
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: polaris-refresh-flux-read
rules:
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: polaris-refresh-flux-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: polaris-refresh-flux-read
subjects:
  - kind: ServiceAccount
    name: polaris-refresh
    namespace: policy-system
