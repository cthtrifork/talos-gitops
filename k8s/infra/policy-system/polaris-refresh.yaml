# The Polaris dashboard audits the cluster once, on its first request, and then serves that result from memory; the chart has
# no refresh option (helm-release.yaml), so the score goes stale. The Flux Operator re-runs a Job for every new commit on
# main: the ResourceSetInputProvider exports the branch's sha, and the ResourceSet renders one Job per sha (a Job spec is
# immutable, so a new name is how it runs again; Flux prunes the old one). The Job waits until all Flux Kustomizations have applied that sha and
# are Ready, deletes the dashboard pod and requests /results.json from the new one, which runs the audit. Deleting the pod,
# not "kubectl rollout restart", leaves the Deployment unchanged, so Helm drift detection has nothing to correct.
# https://fluxoperator.dev/docs/resourcesets/staged-jobs/
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris-refresh
  namespace: policy-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-refresh
  namespace: policy-system
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-refresh
  namespace: policy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-refresh
subjects:
  - kind: ServiceAccount
    name: polaris-refresh
    namespace: policy-system
---
# Read the Flux Kustomizations' status
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: polaris-refresh-flux-read
rules:
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: polaris-refresh-flux-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: polaris-refresh-flux-read
subjects:
  - kind: ServiceAccount
    name: polaris-refresh
    namespace: policy-system
---
# The Job asks the dashboard for /results.json (the new pod audits on that first request)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-refresh
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: polaris-refresh
  egress:
    - toEndpoints:
        - matchLabels:
            app: polaris
            component: dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polaris-dashboard-ingress-refresh
  namespace: policy-system
spec:
  endpointSelector:
    matchLabels:
      app: polaris
      component: dashboard
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: polaris-refresh
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/fluxcd.controlplane.io/resourcesetinputprovider_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: polaris-refresh-main
  namespace: policy-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  type: GitHubBranch
  url: https://github.com/cthtrifork/talos-gitops
  filter:
    includeBranch: ^main$
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: polaris-refresh
  namespace: policy-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: polaris-refresh-main
  resources:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: polaris-refresh-<< inputs.sha >>
        namespace: policy-system
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              app.kubernetes.io/name: polaris-refresh # selected by the network policy
          spec:
            restartPolicy: Never
            serviceAccountName: polaris-refresh
            automountServiceAccountToken: true # the ServiceAccount default is false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: refresh
                image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
                env:
                  - name: SHA
                    value: << inputs.sha >>
                command:
                  - bash
                  - -eu
                  - -c
                  - |
                    # wait until every Kustomization has applied this commit and is Ready; a newer commit makes this Job time out and Flux replaces it
                    not_done='[.items[] | select(((.status.lastAppliedRevision // "") | endswith($sha) | not) or (any(.status.conditions[]?; .type == "Ready" and .status == "True") | not))] | length'
                    until [ "$(kubectl get kustomization -A -o json | jq --arg sha "$SHA" "$not_done")" = "0" ]; do
                      echo "waiting for Flux to apply $SHA"
                      sleep 10
                    done
                    echo "refreshing the Polaris dashboard for $SHA"
                    kubectl delete pod -n policy-system -l app=polaris,component=dashboard --wait=false
                    sleep 5
                    kubectl wait pod -n policy-system -l app=polaris,component=dashboard --for=condition=Ready --timeout=120s
                    # the first request runs the audit
                    curl -fsS -o /dev/null --max-time 120 http://polaris-dashboard.policy-system.svc.cluster.local/results.json
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - "ALL"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
