# The release label is how Prometheus selects rules. There is no Alertmanager: read the alerts from Prometheus.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyverno-alerts
  namespace: kube-prometheus-stack-system
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kyverno
      rules:
        - alert: KyvernoAdmissionControllerDown
          # the image policy fails closed: with no webhook, pods in the labelled namespaces are refused
          expr: kube_deployment_status_replicas_available{namespace="policy-system", deployment="kyverno-admission-controller"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The Kyverno admission controller is not available, so pods in the verify-images namespaces cannot start
            description: "kubectl -n policy-system get pods; revert failurePolicy to Ignore in k8s/infra/image-policies if it stays down"
        - alert: KyvernoMetricsDown
          expr: absent(up{namespace="policy-system", service="kyverno-svc-metrics"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Prometheus cannot scrape the Kyverno admission controller metrics
            description: "Check the ServiceMonitor, the prometheus-scrape label on the pod and port 8000 in the prometheus-scrape policy (cilium-drops skill)"
