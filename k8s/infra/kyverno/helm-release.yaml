---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Kyverno reduced to the admission controller, which is all that verifying image signatures with an ImageValidatingPolicy
# (k8s/infra/image-policies) needs. Everything else is off: the background, cleanup and reports controllers, policy reports,
# background scans, the generated ValidatingAdmissionPolicies and the hook jobs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: policy-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kyverno
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
  # https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml
  values:
    config:
      defaultRegistry: mirror.gcr.io
    global:
      image:
        # ghcr.io instead of reg.kyverno.io: zot mirrors ghcr.io, so Trivy can scan the images without reaching the internet
        registry: ghcr.io
    admissionController:
      initContainer:
        image:
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyvernopre versioning=docker
          tag: v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b
      container:
        image:
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno versioning=docker
          tag: v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d
      # two replicas (the chart adds a PodDisruptionBudget): the image policy fails closed, so a single pod would block pod
      # creation of pods with our images while it restarts
      replicas: 2
      # soft spread: one replica per node when possible, but never Pending because of it
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/part-of: kyverno
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      # Prometheus scrapes the metrics service (8000): admission review latency and policy results
      podLabels:
        prometheus-scrape: "true"
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    webhooksCleanup:
      enabled: false
    upgrade:
      legacyPolicyCheck:
        # pre-install Job that looks for legacy kyverno.io policies; there are none (the render-time check still runs)
        enabled: false
    crds:
      migration:
        enabled: false
      groups:
        # The legacy kyverno.io policy types are no longer executed in Kyverno 1.20, so their CRDs are not installed, except
        # updaterequests and globalcontextentries: the admission controller watches them at startup and exits with
        # "failed to wait for cache sync" when they are missing.
        kyverno:
          cleanuppolicies: false
          clustercleanuppolicies: false
          clusterpolicies: false
          globalcontextentries: true
          policies: false
          policyexceptions: false
          updaterequests: true
        reports:
          clusterephemeralreports: false
          ephemeralreports: false
        wgpolicyk8s:
          clusterpolicyreports: false
          policyreports: false
    features:
      admissionReports:
        enabled: false
      aggregateReports:
        enabled: false
      policyReports:
        enabled: false
      validatingAdmissionPolicyReports:
        enabled: false
      backgroundScan:
        enabled: false
      generateValidatingAdmissionPolicy:
        enabled: false
