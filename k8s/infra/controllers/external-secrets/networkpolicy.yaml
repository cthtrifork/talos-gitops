# Default deny both ways for the namespace, then DNS and the Kubernetes API. The controller also needs api.github.com:443
# for the GithubAccessToken generator (k8s/apps/claude-system/githubaccesstoken.yaml); the Kubernetes provider is only the
# API server. The webhook is called by the API server on the pod port 10250.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-default-deny
  namespace: external-secrets-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-allow-dns-apiserver
  namespace: external-secrets-system
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          # lets Cilium learn the addresses behind api.github.com for the FQDN rule below
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-controller-egress-github
  namespace: external-secrets-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-webhook-ingress
  namespace: external-secrets-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
