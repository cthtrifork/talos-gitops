---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Kubernetes provider only, no external secret manager: see k8s/infra/secret-store/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: external-secrets
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
    podLabels:
      prometheus-scrape: "true"
    # the controller calls api.github.com (the webhook and cert controller below stay internal)
    podAnnotations:
      # Reloader cannot see the volume that Kyverno injects, so name the bundle explicitly
      configmap.reloader.stakater.com/reload: portableinfo-ca-bundle
      trust.portableinfo.cloud/public: "true"
    serviceMonitor:
      enabled: true
    image:
      # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets versioning=docker
      tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    webhook:
      podLabels:
        prometheus-scrape: "true"
      image:
        # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets versioning=docker
        tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      livenessProbe:
        enabled: true
    certController:
      podLabels:
        prometheus-scrape: "true"
      image:
        # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets versioning=docker
        tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      livenessProbe:
        enabled: true
