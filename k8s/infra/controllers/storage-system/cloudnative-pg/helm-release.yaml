---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: storage-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: cnpg
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
  # https://github.com/cloudnative-pg/charts/blob/main/charts/cloudnative-pg/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/cloudnative-pg versioning=docker
      tag: 1.30.2@sha256:f96f6be3d81ec93819b443c665c575c609342fca840df90d4d87dae314a5b913
    replicaCount: 1
    priorityClassName: system-cluster-critical
    crds:
      create: true
    config:
      clusterWide: true
    monitoring:
      podMonitorEnabled: true
    podLabels:
      prometheus-scrape: "true"
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 30m
        memory: 48Mi
