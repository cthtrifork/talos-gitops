# Default deny and DNS/API server egress for this namespace come from the cert-manager networkpolicy.yaml.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trust-manager-webhook-ingress
  namespace: cert-manager-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trust-manager
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
