---
# Source: trust-manager/templates/metrics-servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trust-manager
  namespace: cert-manager-system
  labels:
    app: trust-manager
    app.kubernetes.io/instance: trust-manager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trust-manager
    app.kubernetes.io/version: v0.26.0
    helm.sh/chart: trust-manager-v0.26.0
    prometheus: default
spec:
  jobLabel: trust-manager
  selector:
    matchLabels:
      app: trust-manager
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - cert-manager-system
  endpoints:
    - targetPort: 9402
      path: "/metrics"
      interval: 30s
      scrapeTimeout: 5s
