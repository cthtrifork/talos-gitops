# Default deny, then the operator's allows. Prometheus scrapes it through the prometheus-scrape clusterwide policy.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-operator-system-default-deny
  namespace: valkey-operator-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-operator-system-allow-dns
  namespace: valkey-operator-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# The Valkey reconciler talks to the Kubernetes API and to individual cluster members in the watched namespaces (renovate-system, registry-system).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-operator
  namespace: valkey-operator-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-operator
      app.kubernetes.io/instance: valkey-operator
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: renovate-system
            valkey.io/cluster: renovate
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: registry-system
            valkey.io/cluster: zot
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
