---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: traefik
  driftDetection:
    mode: enabled
  install:
    # the tunnel token Secret may not exist yet; do not block gitops-infra-controllers on the pod
    disableWait: true
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
    disableWait: true
  values:
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    image:
      registry: mirror.gcr.io
      repository: library/traefik
      # renovate: datasource=docker depName=mirror.gcr.io/library/traefik versioning=docker
      tag: v3.8.0@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    deployment:
      replicas: 2
      annotations:
        reloader.stakater.com/auto: "true" # restart when the tunnel token Secret changes
      podAnnotations:
        configmap.reloader.stakater.com/reload: portableinfo-ca-bundle # the bundle is injected by Kyverno, invisible to auto
        trust.portableinfo.cloud/public: "true" # the cloudflared sidecar reaches the Cloudflare edge and api.cloudflare.com
      additionalContainers:
        # not a native sidecar: a missing token restarts only the tunnel, Traefik stays up
        - name: cloudflared
          image: mirror.gcr.io/cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
          args:
            - "tunnel"
            - "--no-autoupdate"
            - "--metrics"
            - "127.0.0.1:2000"
            - "run"
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          # exec: the kubelet cannot reach the loopback metrics port
          livenessProbe:
            exec:
              command:
                - "cloudflared"
                - "tunnel"
                - "--metrics"
                - "127.0.0.1:2000"
                - "ready"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - "cloudflared"
                - "tunnel"
                - "--metrics"
                - "127.0.0.1:2000"
                - "ready"
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - "ALL"
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # a drained node leaves its replica Pending until it is back; the PDB expects that
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik-system
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        nodeTaintsPolicy: Honor
        whenUnsatisfiable: DoNotSchedule
    service:
      spec:
        type: ClusterIP # reached through the tunnel only
    ports:
      web:
        port: 8000
        exposedPort: 80
        forwardedHeaders:
          # cloudflared connects from loopback
          trustedIPs:
            - 127.0.0.1/32
      websecure:
        expose:
          default: false # TLS ends at Cloudflare
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: false
      kubernetesIngress:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: false
    log:
      level: INFO
    accessLog:
      enabled: false # request bodies and queries stay out of logs
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 192Mi
