---
# The chart's flux-operator-web policy only admits pods (namespaceSelector: {}). The Omni service exposer runs on the
# host network, so its traffic arrives as the host or remote-node entity and is dropped without this.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-web-omni-exposer
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: flux-operator
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9080"
              protocol: TCP
---
# Default deny both ways, then what Hubble showed the Flux pods need (12h of flows). Replaces the NetworkPolicies of
# the namespace: allow-egress, allow-scraping and allow-webhooks (generated by the FluxInstance, now networkPolicy: false
# in k8s/clusters/homelab/flux-instance.yaml) and flux-operator-web (flux-operator chart, web.networkPolicy.create: false
# in k8s/infra/bootstrap/flux-system/helm-release.yaml). allow-egress allowed egress to anywhere, which made a default
# deny meaningless. Replies on allowed connections need no rule.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system-default-deny
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# Every Flux pod: DNS, the Kubernetes API (both ways: watches and webhooks) and each other (the controllers fetch
# artifacts from source-controller, notification-controller receives events, the operator reads their status).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system-allow-base
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - kube-apiserver
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - {}
---
# allow-scraping (metrics port 8080 of every pod, from any namespace).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system-allow-scraping
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# allow-webhooks (notification-controller receiver, from any namespace: Traefik carries the Cloudflare tunnel, see
# post/flux-system/ingressroute.yaml) and its calls out to Traefik.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system-allow-webhooks
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            k8s:app.kubernetes.io/name: traefik
---
# flux-operator-web (the Status web interface 9080 and metrics 8080, from any pod). The Omni exposer is the policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-web
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/instance: flux-operator
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9080"
              protocol: TCP
            - port: "8080"
              protocol: TCP
---
# Git, Helm and OCI repositories by name: the operator, source-controller
# and kustomize-controller. helm-controller only talks to source-controller and the API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system-egress-world-operator
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  egress:
    # DNS with the proxy on, so Cilium learns the addresses behind the hosts below
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Git, Helm and OCI repositories by name (GitHub, ghcr.io, quay.io, the chart hosts)
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchPattern: "*.githubusercontent.com"
        - matchName: ghcr.io
        - matchName: quay.io
        - matchPattern: "cdn*.quay.io"
        - matchPattern: "*.github.io"
        - matchName: charts.redpanda.com
        - matchName: charts.fairwinds.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system-egress-world-controllers
  namespace: flux-system
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - source-controller
          - kustomize-controller
  egress:
    # DNS with the proxy on, so Cilium learns the addresses behind the hosts below
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Git, Helm and OCI repositories by name (GitHub, ghcr.io, quay.io, the chart hosts)
    - toFQDNs:
        - matchName: github.com
        - matchPattern: "*.githubusercontent.com"
        - matchName: ghcr.io
        - matchName: quay.io
        - matchPattern: "cdn*.quay.io"
        - matchPattern: "*.github.io"
        - matchName: charts.redpanda.com
        - matchName: charts.fairwinds.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
