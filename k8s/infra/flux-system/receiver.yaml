# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/notification.toolkit.fluxcd.io/receiver_v1.json
# Reconciles the GitRepository flux-system right after a GitHub push instead of waiting for the poll.
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-receiver
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: flux-webhook-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
