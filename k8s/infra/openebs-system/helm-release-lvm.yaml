---
# OpenEBS LVM LocalPV (CSI driver local.csi.openebs.io): a PVC is a logical volume of exactly its size, carved from the volume groups that Talos
# builds (patches/14-lvm-2jc.yaml, docs/storage-plan.md). The node plugin is privileged (it runs lvm against the host's /dev), which this namespace
# allows for the hostpath helper pods too. No snapshots: the snapshot CRDs, the snapshot controller and the csi-snapshotter sidecar are off.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
  namespace: openebs-system
spec:
  chartRef:
    kind: OCIRepository
    name: openebs-lvm
  releaseName: openebs-lvm
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/openebs/lvm-localpv/blob/develop/deploy/helm/charts/values.yaml
  values:
    # names: openebs-lvm-controller and openebs-lvm-node
    fullnameOverride: openebs-lvm
    analytics:
      enabled: false
    crds:
      csi:
        volumeSnapshots:
          enabled: false
    # the scheduler places a pod where a volume group has room (CSIDriver storageCapacity)
    storageCapacity: true
    lvmController:
      snapshotController:
        enabled: false
      resizer:
        image:
          registry: registry.k8s.io/
          repository: sig-storage/csi-resizer
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-resizer versioning=docker
          tag: v2.0.0@sha256:4a95d94e57ad82f6977cd8d4fdcfcfc0b83f02d990e4e7715b688c20970a906d
      provisioner:
        image:
          registry: registry.k8s.io/
          repository: sig-storage/csi-provisioner
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner versioning=docker
          tag: v6.1.0@sha256:e5900dc98b0d02f317ea9572f3824983c47a2fb5d5fe2b160aedf1b99c14c9e4
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    lvmNode:
      driverRegistrar:
        image:
          registry: registry.k8s.io/
          repository: sig-storage/csi-node-driver-registrar
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-node-driver-registrar versioning=docker
          tag: v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
      # runs on every node, the tainted control plane node too
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # volume group, physical volume and logical volume metrics on 9500 (lvm_vg_free_size_bytes and others); the label opens the port
      # to Prometheus in the cluster-wide policy prometheus-scrape
      podLabels:
        prometheus-scrape: "true"
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    lvmPlugin:
      image:
        registry: mirror.gcr.io/
        repository: openebs/lvm-driver
        # renovate: datasource=docker depName=docker.io/openebs/lvm-driver versioning=docker
        tag: 1.10.1@sha256:41f73aba7f31eee4a033053d9c2f203e007a838c14823f3fd472c50651a98999
  # the chart always adds the csi-snapshotter sidecar, which needs the snapshot CRDs that are off
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: openebs-lvm-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-lvm-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-snapshotter
                        $patch: delete
