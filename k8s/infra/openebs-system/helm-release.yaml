---
# LVM LocalPV on the volume groups that Talos builds (patches/*-lvm-*.yaml). No snapshots.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
  namespace: openebs-system
spec:
  chartRef:
    kind: OCIRepository
    name: openebs-lvm
  releaseName: openebs-lvm
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/openebs/lvm-localpv/blob/develop/deploy/helm/charts/values.yaml
  values:
    fullnameOverride: openebs-lvm
    analytics:
      enabled: false
    crds:
      csi:
        volumeSnapshots:
          enabled: false
    storageCapacity: true
    lvmController:
      snapshotController:
        enabled: false
      resizer:
        image:
          registry: registry.k8s.io/
          repository: sig-storage/csi-resizer
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-resizer versioning=docker
          tag: v2.3.1@sha256:d5b040c2f6ffb25127169feeb845aaf1fa3279e510d71fbebe386b5becc625cc
      provisioner:
        image:
          registry: registry.k8s.io/
          repository: sig-storage/csi-provisioner
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner versioning=docker
          tag: v6.4.1@sha256:9e76a2c599ffd7a66f08feeb62ddec61e3545eaa442f8f8f6a495569c0b06829
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    lvmNode:
      driverRegistrar:
        image:
          registry: registry.k8s.io/
          repository: sig-storage/csi-node-driver-registrar
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-node-driver-registrar versioning=docker
          tag: v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # opens metrics port 9500 to Prometheus (cluster-wide policy prometheus-scrape)
      podLabels:
        prometheus-scrape: "true"
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    lvmPlugin:
      image:
        registry: mirror.gcr.io/
        repository: openebs/lvm-driver
        # renovate: datasource=docker depName=docker.io/openebs/lvm-driver versioning=docker
        tag: 1.10.1@sha256:41f73aba7f31eee4a033053d9c2f203e007a838c14823f3fd472c50651a98999
  # the chart always adds the csi-snapshotter sidecar, which needs the snapshot CRDs that are off
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: openebs-lvm-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-lvm-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-snapshotter
                        $patch: delete
          # The chart has no probe values. The node's containers are probed on what they already serve: the registrar's own check that
          # it registered with the kubelet, and a TCP check on the plugin's metrics port (a scrape runs lvm). The controller's sidecars
          # serve nothing to probe, so it is exempt in Polaris (policy-system/polaris).
          - target:
              kind: DaemonSet
              name: openebs-lvm-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: openebs-lvm-node
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-node-driver-registrar
                        livenessProbe:
                          exec:
                            command:
                              - /csi-node-driver-registrar
                              - --kubelet-registration-path=/var/lib/kubelet/plugins/lvm-localpv/csi.sock
                              - --mode=kubelet-registration-probe
                          initialDelaySeconds: 30
                          periodSeconds: 30
                          timeoutSeconds: 15
                        readinessProbe:
                          exec:
                            command:
                              - /csi-node-driver-registrar
                              - --kubelet-registration-path=/var/lib/kubelet/plugins/lvm-localpv/csi.sock
                              - --mode=kubelet-registration-probe
                          periodSeconds: 30
                          timeoutSeconds: 15
                      - name: openebs-lvm-plugin
                        livenessProbe:
                          tcpSocket:
                            port: 9500
                          initialDelaySeconds: 10
                          periodSeconds: 20
                        readinessProbe:
                          tcpSocket:
                            port: 9500
                          periodSeconds: 10
