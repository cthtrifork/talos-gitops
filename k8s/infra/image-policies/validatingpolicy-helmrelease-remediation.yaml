---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/validatingpolicy_v1.json
# Without retries a HelmRelease goes Stalled after one failure. Only admission is checked.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-helmrelease-remediation
spec:
  validationActions:
    - Deny
  # an outage must not block HelmRelease changes
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    resourceRules:
      - apiGroups:
          - helm.toolkit.fluxcd.io
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - helmreleases
  validations:
    - expression: >-
        has(object.spec.upgrade) && has(object.spec.upgrade.remediation) &&
        has(object.spec.upgrade.remediation.retries) && object.spec.upgrade.remediation.retries != 0
      message: spec.upgrade.remediation.retries must be set and non-zero (-1 retries forever)
    - expression: >-
        (has(object.spec.install) && has(object.spec.install.remediation) &&
          has(object.spec.install.remediation.retries) && object.spec.install.remediation.retries != 0) ||
        (has(object.spec.install) && has(object.spec.install.strategy) && object.spec.install.strategy.name == 'RetryOnFailure')
      message: spec.install.remediation.retries must be set and non-zero, or spec.install.strategy.name must be RetryOnFailure
