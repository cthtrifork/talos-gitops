---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/validatingpolicy_v1.json
# A HelmRelease without retries goes Stalled after one failed install or upgrade and stays down until someone resets it by hand.
# Upgrades need spec.upgrade.remediation.retries (non-zero, -1 retries forever); installs need spec.install.remediation.retries
# or spec.install.strategy.name RetryOnFailure. Only admission is checked, so a HelmRelease that already exists keeps working
# until it is next changed.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-helmrelease-remediation
spec:
  validationActions:
    - Deny
  # an outage of the Kyverno webhook must not block changes to HelmReleases
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    resourceRules:
      - apiGroups:
          - helm.toolkit.fluxcd.io
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - helmreleases
  validations:
    - expression: >-
        has(object.spec.upgrade) && has(object.spec.upgrade.remediation) &&
        has(object.spec.upgrade.remediation.retries) && object.spec.upgrade.remediation.retries != 0
      message: spec.upgrade.remediation.retries must be set and non-zero (-1 retries forever)
    - expression: >-
        (has(object.spec.install) && has(object.spec.install.remediation) &&
          has(object.spec.install.remediation.retries) && object.spec.install.remediation.retries != 0) ||
        (has(object.spec.install) && has(object.spec.install.strategy) && object.spec.install.strategy.name == 'RetryOnFailure')
      message: spec.install.remediation.retries must be set and non-zero, or spec.install.strategy.name must be RetryOnFailure
