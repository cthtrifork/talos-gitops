---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/imagevalidatingpolicy_v1.json
# Images built by this repo's workflows must carry a keyless cosign signature from a workflow in this repo, on main.
# validationActions Deny: a pod that fails the check is rejected. Only namespaces labelled gitops.homelab/verify-images=true
# are checked.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: cthtrifork-images
spec:
  validationActions:
    - Deny
  # an outage of the Kyverno webhook blocks pod creation in the labelled namespaces
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    namespaceSelector:
      matchLabels:
        gitops.homelab/verify-images: "true"
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: ghcr.io/cthtrifork/talos-gitops/**
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              # build-*.yaml are the callers and build-release-image.yaml the reusable workflow, whichever the certificate names
              subjectRegExp: ^https://github\.com/cthtrifork/talos-gitops/\.github/workflows/build-[a-z-]+\.yaml@refs/heads/main$
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: images.containers.map(image, verifyImageSignatures(image, [attestors.github])).all(e, e > 0)
      message: image is not signed by a build workflow of cthtrifork/talos-gitops
