---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/imagevalidatingpolicy_v1.json
# Our images must carry a keyless cosign signature from a workflow in this repo on main. No namespace is exempt.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: cthtrifork-images
spec:
  validationActions:
    - Deny
  # fails closed, but matchConditions limit the webhook to pods with our images
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 15
  matchConditions:
    - name: our-images
      expression: >-
        (object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
        .exists(c, c.image.startsWith('ghcr.io/cthtrifork/talos-gitops/') || c.image.startsWith('ghcr.io/cthtrifork/harper-pad-'))
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: ghcr.io/cthtrifork/talos-gitops/**
    - glob: ghcr.io/cthtrifork/harper-pad-*
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              # the certificate names either the caller or the reusable workflow
              subjectRegExp: ^https://github\.com/cthtrifork/talos-gitops/\.github/workflows/build-[a-z-]+\.yaml@refs/heads/main$
        ctlog:
          url: https://rekor.sigstore.dev
    - name: harperpad
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/cthtrifork/harper-pad/.github/workflows/release.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(image,
        verifyImageSignatures(image, [image.startsWith('ghcr.io/cthtrifork/harper-pad-') ? attestors.harperpad : attestors.github])).all(e, e > 0)
      message: image is not signed by its build workflow (cthtrifork/talos-gitops build-*.yaml, cthtrifork/harper-pad release.yml)
