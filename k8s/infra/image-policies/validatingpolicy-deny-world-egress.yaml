---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/validatingpolicy_v1.json
# No CiliumNetworkPolicy or CiliumClusterwideNetworkPolicy may allow egress to the entities world or all, in any namespace and
# without exceptions: name the hosts (toFQDNs) or the addresses (toCIDRSet) instead. Only admission is checked, so a policy
# that already exists keeps working until it is next changed. CIDR rules such as 0.0.0.0/0 are not covered.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-world-egress
spec:
  validationActions:
    - Deny
  # an outage of the Kyverno webhook must not block changes to network policies
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    resourceRules:
      - apiGroups:
          - cilium.io
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - ciliumnetworkpolicies
          - ciliumclusterwidenetworkpolicies
  variables:
    - name: denied
      expression: "['world', 'world-ipv4', 'world-ipv6', 'all']"
  validations:
    - expression: >-
        !(has(object.spec) && has(object.spec.egress) &&
          object.spec.egress.exists(r, has(r.toEntities) && r.toEntities.exists(e, e in variables.denied)))
      message: spec.egress must not allow toEntities world or all; allow named hosts (toFQDNs) or addresses (toCIDRSet) instead
    # the specs list is the other place a CiliumNetworkPolicy keeps rules
    - expression: >-
        !(has(object.specs) &&
          object.specs.exists(s, has(s.egress) &&
            s.egress.exists(r, has(r.toEntities) && r.toEntities.exists(e, e in variables.denied))))
      message: specs[].egress must not allow toEntities world or all; allow named hosts (toFQDNs) or addresses (toCIDRSet) instead
