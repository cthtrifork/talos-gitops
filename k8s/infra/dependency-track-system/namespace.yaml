---
apiVersion: v1
kind: Namespace
metadata:
  name: dependency-track-system
  labels:
    claude-elevate/ops: "true"
    claude-elevate/storage: "true"
    claude-elevate/flux: "true"
    claude-elevate/jobs: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
