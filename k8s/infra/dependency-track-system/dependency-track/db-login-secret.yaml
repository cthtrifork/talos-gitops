# The database login is a client certificate. The chart insists on a username and a password, so it mounts this Secret;
# the dtrack role has no password and the value is not a credential.
---
apiVersion: v1
kind: Secret
metadata:
  name: dependency-track-db-login
  namespace: dependency-track-system
type: Opaque
stringData:
  username: dtrack
  password: unused
