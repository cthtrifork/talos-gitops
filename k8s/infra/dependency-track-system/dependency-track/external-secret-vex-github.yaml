# One-hour GitHub App installation token (narrowed to this repository), minted from the SOPS-encrypted App key: no long-lived token.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-vex-github
  namespace: dependency-track-system
spec:
  # GitHub tokens expire after 60 minutes: keep this well below, so the daily Job always finds a valid one
  refreshInterval: 30m
  target:
    name: dependency-track-vex-github
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: dependency-track-vex-github
