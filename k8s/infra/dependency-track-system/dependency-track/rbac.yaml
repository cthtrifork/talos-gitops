---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-track-config
  namespace: dependency-track-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dependency-track-config
  namespace: dependency-track-system
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "dependency-track-admin"
      - "dependency-track-api-key"
      - "dependency-track-vex-api-key"
      - "dependency-track-retire-api-key"
    verbs:
      - "get"
      - "update" # replace a key the API no longer accepts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dependency-track-config
  namespace: dependency-track-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dependency-track-config
subjects:
  - kind: ServiceAccount
    name: dependency-track-config
    namespace: dependency-track-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-track-retire
  namespace: dependency-track-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-track-retire
rules:
  - apiGroups:
      - aquasecurity.github.io
    resources:
      - sbomreports
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-track-retire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-track-retire
subjects:
  - kind: ServiceAccount
    name: dependency-track-retire
    namespace: dependency-track-system
---
