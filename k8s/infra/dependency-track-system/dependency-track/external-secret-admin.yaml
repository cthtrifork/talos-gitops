# The Secret dependency-track-admin (username, password) is generated once in the cluster store (k8s/infra/secret-store/)
# and copied here. config-cronjob.yaml logs in with it and sets it on a fresh install.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-admin
  namespace: dependency-track-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: dependency-track-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: dependency-track-admin
