---
# Flux post-build substitution runs over this file, hence the $$ escapes.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

# trivy-operator ignores the answer, so the buffer acknowledges at once and the upload happens in the background.
input:
  http_server:
    path: /sbom
    allowed_verbs:
      - POST

buffer:
  sqlite:
    path: /queue/sbom.db # on disk: a restart keeps queued reports and a backlog does not use memory

pipeline:
  processors:
    - mapping: |
        if this.kind != "SbomReport" {
          root = deleted()
        } else {
          # one rolling project per workload container: each upload replaces the components and keeps the audit decisions
          let l = this.metadata.labels
          let res = $l."trivy-operator.resource.name".not_empty()
          # the workload behind a ReplicaSet or Job name; retire-projects.sh (retire-cronjob.yaml) derives the same name
          let workload = match $l."trivy-operator.resource.kind".not_empty() {
            "ReplicaSet" => $res.re_replace_all("-[^-]+$", "")
            "Job" => $res.re_replace_all("-[0-9a-f]{8,}$", "")
            _ => $res
          }
          let name = $l."trivy-operator.resource.namespace".not_empty() + "/" + $workload + "/" + $l."trivy-operator.container.name".not_empty()
          meta dedupe_key = $name + ":" + this.report.artifact.digest.or(this.report.artifact.tag)
          root = {
            "projectName": $name,
            "projectVersion": "current",
            "autoCreate": true,
            "isActive": true, # a workload that comes back after retirement is active again
            "projectTags": [{"name": "kubernetes"}],
            "bom": this.report.components.format_json().encode("base64")
          }
        }
    # rescans of an unchanged image
    - dedupe:
        cache: sbom_seen
        key: '$${!metadata("dedupe_key")}'

cache_resources:
  - label: sbom_seen
    memory:
      default_ttl: 24h

output:
  switch:
    cases:
      # dry run until the API key Secret exists
      - check: env("DT_API_KEY").or("") == ""
        output:
          processors:
            - mapping: 'root = "DRY RUN: would upload " + this.projectName + ":" + this.projectVersion'
          stdout: {}
      - output:
          http_client:
            url: http://dependency-track-api-server.dependency-track-system.svc.cluster.local:8080/api/v1/bom
            verb: PUT
            headers:
              Content-Type: application/json
              X-Api-Key: $${DT_API_KEY}
            timeout: 60s
            max_in_flight: 4 # each upload holds the report, its base64 copy and the body in memory
            retries: 3
            drop_on:
              - 400
              - 404
              - 409
              - 422
