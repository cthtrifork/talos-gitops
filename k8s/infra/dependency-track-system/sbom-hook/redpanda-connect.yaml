---
# Flux post-build substitution runs over this file, hence the $$ escapes.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

# trivy-operator ignores the answer, so the buffer acknowledges at once and the upload happens in the background.
input:
  http_server:
    path: /sbom
    allowed_verbs:
      - POST

buffer:
  sqlite:
    path: /queue/sbom.db # on disk: a restart keeps queued reports and a backlog does not use memory

pipeline:
  processors:
    - mapping: |
        if this.kind != "SbomReport" {
          root = deleted()
        } else {
          # one project per image in a namespace, one version per image tag; a tag that moves to a new digest updates its version in place.
          # retire-projects.sh (retire-cronjob.yaml) derives the same name and version.
          let name = this.metadata.labels."trivy-operator.resource.namespace".not_empty() + "/" + this.report.artifact.repository.not_empty()
          let tag = this.report.artifact.tag.or("").re_replace_all("^.*:", "")
          let version = if $tag != "" { $tag } else { this.report.artifact.digest.not_empty() }
          meta project_name = $name
          meta project_version = $version
          meta dedupe_key = $name + ":" + $version + ":" + this.report.artifact.digest.or("")
          root = {
            "projectName": $name,
            "projectVersion": $version,
            "autoCreate": true,
            "isActive": true, # a version that comes back after retirement is active again
            "projectTags": [{"name": "kubernetes"}],
            "bom": this.report.components.format_json().encode("base64")
          }
        }
    # rescans of an unchanged image
    - dedupe:
        cache: sbom_seen
        key: '$${!metadata("dedupe_key")}'
    # A tag seen for the first time starts as a clone of the newest version of its project, so the audit decisions carry over.
    # Errors do not stop the upload: it then creates an empty version.
    - switch:
        - check: env("DT_API_KEY").or("") != ""
          processors:
            - branch:
                request_map: 'root = ""'
                processors:
                  - http:
                      url: http://dependency-track-api-server.dependency-track-system.svc.cluster.local:8080/api/v1/project/lookup?name=$${! @project_name.escape_url_query() }&version=$${! @project_version.escape_url_query() }
                      verb: GET
                      headers:
                        X-Api-Key: $${DT_API_KEY}
                      successful_on:
                        - 404
                  - switch:
                      - check: '@http_status_code == 404'
                        processors:
                          - http:
                              url: http://dependency-track-api-server.dependency-track-system.svc.cluster.local:8080/api/v1/project?excludeInactive=false&pageSize=100&sortName=lastBomImport&sortOrder=desc&name=$${! @project_name.escape_url_query() }
                              verb: GET
                              headers:
                                X-Api-Key: $${DT_API_KEY}
                          - mapping: |
                              # the list comes newest first
                              let versions = this.filter(p -> p.name == @project_name)
                              meta source_uuid = if $versions.length() > 0 { $versions.index(0).uuid } else { "" }
                              root = {
                                "version": @project_version,
                                "version_is_latest": true,
                                "includes": ["COMPONENTS", "FINDINGS", "FINDINGS_AUDIT_HISTORY", "POLICY_VIOLATIONS", "POLICY_VIOLATIONS_AUDIT_HISTORY", "PROPERTIES", "TAGS"]
                              }
                          - switch:
                              - check: '@source_uuid.or("") != ""'
                                processors:
                                  - http:
                                      url: http://dependency-track-api-server.dependency-track-system.svc.cluster.local:8080/api/v2/projects/$${! @source_uuid }/clone
                                      verb: POST
                                      headers:
                                        Content-Type: application/json
                                        X-Api-Key: $${DT_API_KEY}
                                      successful_on:
                                        - 409 # another report of the same tag cloned it first

cache_resources:
  - label: sbom_seen
    memory:
      default_ttl: 24h

output:
  switch:
    cases:
      # dry run until the API key Secret exists
      - check: env("DT_API_KEY").or("") == ""
        output:
          processors:
            - mapping: 'root = "DRY RUN: would upload " + this.projectName + ":" + this.projectVersion'
          stdout: {}
      - output:
          http_client:
            url: http://dependency-track-api-server.dependency-track-system.svc.cluster.local:8080/api/v1/bom
            verb: PUT
            headers:
              Content-Type: application/json
              X-Api-Key: $${DT_API_KEY}
            timeout: 60s
            max_in_flight: 4 # each upload holds the report, its base64 copy and the body in memory
            retries: 3
            drop_on:
              - 400
              - 404
              - 409
              - 422
