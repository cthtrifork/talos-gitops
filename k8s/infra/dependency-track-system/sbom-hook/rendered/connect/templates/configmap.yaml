apiVersion: v1
data:
  redpanda-connect.yaml: |
    http:
      address: 0.0.0.0:4195
      cors:
        enabled: false
      debug_endpoints: false
      enabled: true
      root_path: /redpanda-connect
    input:
      label: "no_config_in"
      generate:
        mapping: root = "This Redpanda Connect instance is unconfigured!"
        interval: 1m
    output:
      label: "no_config_out"
      stdout:
        codec: lines
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: sbom-hook
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redpanda-connect
    app.kubernetes.io/version: 4.118.0
    helm.sh/chart: redpanda-connect-3.2.37
  name: sbom-hook-config
  namespace: dependency-track-system
