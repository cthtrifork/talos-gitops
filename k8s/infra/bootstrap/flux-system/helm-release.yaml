---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flux-operator
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # https://github.com/controlplaneio-fluxcd/charts/blob/main/charts/flux-operator/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/flux-operator versioning=docker
      tag: v0.64.0@sha256:7f60122c5f07c51972ba86635783c5bcc6d450dea5d6f8291362efb1d81463e8
    resources:
      requests:
        memory: 256Mi
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false # k8s/infra/flux-system/ciliumnetworkpolicy.yaml (flux-operator-web)
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
