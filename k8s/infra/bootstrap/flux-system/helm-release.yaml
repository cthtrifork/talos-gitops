---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flux-operator
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # https://github.com/controlplaneio-fluxcd/charts/blob/main/charts/flux-operator/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/flux-operator versioning=docker
      tag: v0.63.0@sha256:82a6a83711fcfb00af55b23684a5c5fbfbde36cf3a233b4b81b4d45180f99cb0
    resources:
      requests:
        memory: 256Mi
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false # k8s/infra/flux-system/ciliumnetworkpolicy.yaml (flux-operator-web)
    tolerations:
      # Tolerate the control plane taint
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
