---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flux-operator
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # https://github.com/controlplaneio-fluxcd/charts/blob/main/charts/flux-operator/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/flux-operator versioning=docker
      tag: v0.63.1@sha256:460cc140dba2958261b05466acca40dfbee3addd1a6c33b885c1cd4e4e5d0489
    resources:
      requests:
        memory: 256Mi
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false # k8s/infra/flux-system/ciliumnetworkpolicy.yaml (flux-operator-web)
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
