---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: kube-prometheus-stack-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: prometheus-community-crds
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
