    # pods of the namespace talk to each other
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cdi
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
