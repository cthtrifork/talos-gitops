---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# no namespace override: the operator manifests set their own
resources:
  - kubevirt-operator.yaml
  - cdi-operator.yaml
  - networkpolicy.yaml
# Digest pins for the images the operators start (upstream uses tags, which require-image-digest denies).
# Inline patches on purpose: Polaris would audit a partial Deployment file as a complete one.
patches:
  - target:
      kind: Deployment
      name: virt-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: virt-operator
        namespace: kubevirt
      spec:
        template:
          spec:
            containers:
              - name: virt-operator
                env:
                  - name: VIRT_OPERATOR_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-operator
                    value: quay.io/kubevirt/virt-operator:v1.10.0@sha256:37c1287ad094eed25c4c6cc78744c06dd9bf340f7301eb0d26bdf3c4c230b738
                  - name: VIRT_API_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-api
                    value: quay.io/kubevirt/virt-api:v1.10.0@sha256:876171a8625f7f20c337aba14d4ee4275923d612674c776fa25db5bf75901d5b
                  - name: VIRT_CONTROLLER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-controller
                    value: quay.io/kubevirt/virt-controller:v1.10.0@sha256:a3e588b9b88662153c29bc0c32f429b871880ff2a1aef6c01d83e69fc3d584ab
                  - name: VIRT_HANDLER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-handler
                    value: quay.io/kubevirt/virt-handler:v1.10.0@sha256:1cc169b352ea09ad25824f633b955b2692a5a284c15e9689bf393992b1c6d199
                  - name: VIRT_LAUNCHER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-launcher
                    value: quay.io/kubevirt/virt-launcher:v1.10.0@sha256:e8ac130526a7ca76c93127cbe005e0c9d155361dfe3a16eaf8d3bb6fc8d659d1
                  - name: VIRT_EXPORTPROXY_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-exportproxy
                    value: quay.io/kubevirt/virt-exportproxy:v1.10.0@sha256:ae0b9039f376cbb90445f20877a1a449b9dc5ffa7deeed3184a22e671e9c7fb2
                  - name: VIRT_EXPORTSERVER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-exportserver
                    value: quay.io/kubevirt/virt-exportserver:v1.10.0@sha256:394de63c4abc2c1ad894e6c9dce4685918aa0e7f1575242b2727750a9a395a6a
                  - name: VIRT_SYNCHRONIZATIONCONTROLLER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/virt-synchronization-controller
                    value: quay.io/kubevirt/virt-synchronization-controller:v1.10.0@sha256:db90aa35f2e056c1a39b7da7e42562dfa56e0661d3d131cf45460f9d32c33ed9
  - target:
      kind: Deployment
      name: cdi-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cdi-operator
        namespace: cdi
      spec:
        template:
          spec:
            containers:
              - name: cdi-operator
                env:
                  - name: CONTROLLER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/cdi-controller
                    value: quay.io/kubevirt/cdi-controller:v1.66.1@sha256:0cbf467d04febc5d63b7682524e87be7d775b488cb8b5963706d2ebc3465a72f
                  - name: IMPORTER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/cdi-importer
                    value: quay.io/kubevirt/cdi-importer:v1.66.1@sha256:e22b63872cd04da43c62ad8ebb73cac46958b6e759fcc347752ec2ace1df75f4
                  - name: CLONER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/cdi-cloner
                    value: quay.io/kubevirt/cdi-cloner:v1.66.1@sha256:febbe8b265bb6fcf7ab743b780069fbae4a0531119933026de59545ad1bfc7a3
                  - name: OVIRT_POPULATOR_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/cdi-importer
                    value: quay.io/kubevirt/cdi-importer:v1.66.1@sha256:e22b63872cd04da43c62ad8ebb73cac46958b6e759fcc347752ec2ace1df75f4
                  - name: APISERVER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/cdi-apiserver
                    value: quay.io/kubevirt/cdi-apiserver:v1.66.1@sha256:98b71040e0e8de9397b57b4998641d4d3ea248fc300253b23085838990c4d241
                  - name: UPLOAD_SERVER_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/cdi-uploadserver
                    value: quay.io/kubevirt/cdi-uploadserver:v1.66.1@sha256:d3a6b735efcc914a0c9679fa8f64ab3dda764f7997d53bcafa6e2944f123420a
                  - name: UPLOAD_PROXY_IMAGE
                    # renovate: datasource=docker depName=quay.io/kubevirt/cdi-uploadproxy
                    value: quay.io/kubevirt/cdi-uploadproxy:v1.66.1@sha256:f2493c0b33140167135110561ff415b8344f33dd53e20b9c8fbdb288e43326c9
