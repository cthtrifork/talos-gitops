---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Safe mode: upsert-only never deletes records, and only records with this instance's TXT ownership marker are updated.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: external-dns
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
  # https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=registry.k8s.io/external-dns/external-dns versioning=docker
      tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
    # zero until the Secret cloudflare-api-token exists (a missing one would fail the release); then remove this line
    replicaCount: 0
    provider:
      name: cloudflare
    sources:
      - service
    policy: upsert-only
    registry: txt
    txtOwnerId: talos-gitops
    domainFilters:
      - portableinfo.cloud
    interval: 1m
    triggerLoopOnEvent: true
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    serviceMonitor:
      enabled: false
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    podAnnotations:
      trust.portableinfo.cloud/public: "true" # api.cloudflare.com
