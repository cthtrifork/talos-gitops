# Image pulls depend on this namespace, so ingress admits the node entities (host, remote-node) as well as pods.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registry-system-default-deny
  namespace: registry-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registry-system-allow-dns-apiserver
  namespace: registry-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# The LAN reaches zot through zot-lb 192.168.1.240, which counts as world.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zot
  namespace: registry-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            # use zot as cache when pulling images and charts
            k8s:io.kubernetes.pod.namespace: arc-runners-system
        - matchLabels:
            # uses zot as cache for scanning image
            k8s:io.kubernetes.pod.namespace: trivy-system
        - matchLabels:
            # the other replicas of the scale-out cluster proxy a request to the replica that owns the repository
            k8s:app.kubernetes.io/name: zot
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # upstreams of the zot.json sync plus their blob redirect hosts: a new upstream needs its hosts here
    - toFQDNs:
        - matchName: docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: mirror.gcr.io
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: gcr.io
        - matchName: quay.io
        - matchPattern: "cdn*.quay.io"
        # cdn02.quay.io is served by CloudFront
        - matchPattern: "*.cloudfront.net"
        - matchName: registry.k8s.io
        - matchName: cdn.registry.k8s.io
        - matchPattern: "*.pkg.dev"
        - matchPattern: "prod-registry-k8s-io-*.s3.dualstack.*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: trivy-system
            k8s:app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
    # The Garage object store (S3)
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    # The other replicas (cluster proxying) and the Valkey cache
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: zot
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# Garage (the object store behind a clustered zot): S3 (3900) only from zot, the RPC (3901) and admin (3903) ports only
# between Garage's own pods, which include the layout Job. Prometheus scrapes the admin port. Garage finds its peers
# through the API server (allowed for the namespace above).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage
  namespace: registry-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: zot
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
            - port: "3901"
              protocol: TCP
            - port: "3903"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
            - port: "3901"
              protocol: TCP
            - port: "3903"
              protocol: TCP
---
# Valkey (the zot cluster's cache): only zot reaches it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey
  namespace: registry-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: zot
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# Spegel only serves what the nodes already hold; it has no internet egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spegel
  namespace: registry-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spegel
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: spegel
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEntities:
        - host
        - remote-node
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: spegel
