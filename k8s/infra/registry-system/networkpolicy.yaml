# Image pulls depend on this namespace, so ingress admits the node entities (host, remote-node) as well as pods.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registry-system-default-deny
  namespace: registry-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registry-system-allow-dns-apiserver
  namespace: registry-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# The LAN reaches zot through zot-lb 192.168.1.240, which counts as world.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zot
  namespace: registry-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arc-runners-system
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: trivy-system
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            k8s:app: source-controller
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # upstreams of the zot.json sync plus their blob redirect hosts: a new upstream needs its hosts here
    - toFQDNs:
        - matchName: docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: mirror.gcr.io
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: gcr.io
        - matchName: quay.io
        - matchPattern: "cdn*.quay.io"
        # cdn02.quay.io is served by CloudFront
        - matchPattern: "*.cloudfront.net"
        - matchName: registry.k8s.io
        - matchName: cdn.registry.k8s.io
        - matchPattern: "*.pkg.dev"
        - matchPattern: "prod-registry-k8s-io-*.s3.dualstack.*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: trivy-system
            k8s:app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
---
# Spegel only serves what the nodes already hold; it has no internet egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spegel
  namespace: registry-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spegel
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: spegel
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEntities:
        - host
        - remote-node
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: spegel
