# Every object lives on one node, so a drain makes a third of the objects unavailable for its duration: allow one node at a
# time. The layout Job shares the labels but not the component.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: garage
  namespace: registry-system
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: garage
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: garage
      app.kubernetes.io/component: garage
