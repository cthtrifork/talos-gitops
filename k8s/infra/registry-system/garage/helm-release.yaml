---
# The object store behind a clustered zot: 3 Garage nodes, one per node of the cluster, every object stored once
# (replicationFactor 1), so the data and the read and write load are spread over the three nodes and a node holds a third
# of the registry (about 15 GiB of today's 44 GiB). It is a cache and CI store: losing a node only loses the blobs on it,
# which zot pulls again on demand. Separate from Renovate's single Garage (k8s/apps/renovate/garage/). The S3 API and the
# admin API stay inside the cluster.
# The chart's configure job only knows a single node, so it is off and the layout comes from layout-job.yaml.
# Each node has room for about 20 GiB of data (talos-2ny-8tx has the least free space in /var); size it with the layout
# capacity in configure.sh and the data PVC below.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: registry-system
spec:
  interval: 30m
  releaseName: garage
  chartRef:
    kind: OCIRepository
    name: garage
  # https://github.com/datahub-local/garage-helm/blob/main/charts/garage/values.yaml
  values:
    deployment:
      replicaCount: 3
      # without a layout the nodes are not ready, so OrderedReady would never start the second one
      podManagementPolicy: Parallel
    # One Garage pod per node, so the data and the load are spread over the nodes
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
            topologyKey: kubernetes.io/hostname
    # All three nodes are control plane nodes
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Garage's admin API answers /health once the node is up and in the layout
    livenessProbe:
      httpGet:
        path: /health
        port: 3903
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: 3903
      initialDelaySeconds: 10
      periodSeconds: 15
    # Prometheus scrapes the admin port (3903, /metrics): S3 request counts and block and table metrics
    commonLabels:
      prometheus-scrape: "true"
    monitoring:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
    # The namespace enforces PodSecurity privileged, but keep the pods restricted like their neighbours
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
    image:
      repository: mirror.gcr.io/dxflrs/garage
      # renovate: datasource=docker depName=dxflrs/garage
      tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    garage:
      replicationFactor: "1"
      s3:
        api:
          region: garage
      # rpcSecret and adminToken, generated by External Secrets (k8s/infra/secret-store/), copied by external-secrets.yaml
      secret:
        create: false
        name: garage-secrets
    persistence:
      enabled: true
      meta:
        storageClass: local-path
        size: 2Gi
      data:
        storageClass: local-path
        # local-path does not enforce the size; keep it equal to CAPACITY in configure.sh
        size: 20Gi
    # Off: the chart's job assigns garage-0 only. layout-job.yaml assigns the three nodes and creates the bucket and key.
    clusterConfig:
      enabled: false
