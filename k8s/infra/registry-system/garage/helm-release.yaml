---
# The object store behind a clustered zot (k8s/infra/registry-system/zot/): 3 Garage nodes, one per node of the cluster,
# every object stored 3 times (replicationFactor 3, so each node holds a full copy). Separate from Renovate's single
# Garage (k8s/apps/renovate/garage/), whose data is disposable. The S3 API and the admin API stay inside the cluster.
# The chart's configure job only knows a single node, so it is off and the layout comes from layout-job.yaml.
# Each node needs room for a full copy of the registry (about 44 GiB today, the zot PVC is 60Gi): check the free space
# in /var of every node before zot moves to this store.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: registry-system
spec:
  interval: 30m
  releaseName: garage
  chartRef:
    kind: OCIRepository
    name: garage
  # https://github.com/datahub-local/garage-helm/blob/main/charts/garage/values.yaml
  values:
    deployment:
      replicaCount: 3
      # without a layout the nodes are not ready, so OrderedReady would never start the second one
      podManagementPolicy: Parallel
    # One Garage pod per node: with replicationFactor 3 every node must hold a copy
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
            topologyKey: kubernetes.io/hostname
    # All three nodes are control plane nodes
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Garage's admin API answers /health once the node is up and in the layout
    livenessProbe:
      httpGet:
        path: /health
        port: 3903
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: 3903
      initialDelaySeconds: 10
      periodSeconds: 15
    # Prometheus scrapes the admin port (3903, /metrics): S3 request counts and block and table metrics
    commonLabels:
      prometheus-scrape: "true"
    monitoring:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
    # The namespace enforces PodSecurity privileged, but keep the pods restricted like their neighbours
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
    image:
      repository: mirror.gcr.io/dxflrs/garage
      # renovate: datasource=docker depName=dxflrs/garage
      tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    garage:
      replicationFactor: "3"
      s3:
        api:
          region: garage
      # rpcSecret and adminToken, generated by External Secrets (k8s/infra/secret-store/), copied by external-secrets.yaml
      secret:
        create: false
        name: garage-secrets
    persistence:
      enabled: true
      meta:
        storageClass: local-path
        size: 2Gi
      data:
        storageClass: local-path
        # local-path does not enforce the size; it matches the zot PVC it replaces
        size: 60Gi
    # Off: the chart's job assigns garage-0 only. layout-job.yaml assigns the three nodes and creates the bucket and key.
    clusterConfig:
      enabled: false
