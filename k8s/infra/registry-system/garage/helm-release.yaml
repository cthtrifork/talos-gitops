---
# The object store behind the zot replicas: 3 Garage nodes, one per node of the cluster, every object stored on all
# three (replicationFactor 3). A read and a write each need two of the three, so one node can be drained or lost with
# no impact on zot (the PodDisruptionBudget in pdb.yaml keeps it to one). Every node holds a full copy of the registry
# (about 45 GiB today). Separate from Renovate's single Garage (k8s/apps/renovate/garage/). The S3 API and the admin
# API stay inside the cluster.
# The chart's configure job only knows a single node, so it is off and the layout comes from layout-job.yaml.
# Keep each data PVC and the layout capacity in configure.sh within the per-node lvm-fast capacity.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: registry-system
spec:
  interval: 30m
  releaseName: garage
  chartRef:
    kind: OCIRepository
    name: garage
  # https://github.com/datahub-local/garage-helm/blob/main/charts/garage/values.yaml
  values:
    deployment:
      replicaCount: 3
      # without a layout the nodes are not ready, so OrderedReady would never start the second one
      podManagementPolicy: Parallel
    # One Garage pod per node, so the data and the load are spread over the nodes
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
            topologyKey: kubernetes.io/hostname
    # All three nodes are control plane nodes
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Garage's admin API answers /health once the node is up and in the layout
    livenessProbe:
      httpGet:
        path: /health
        port: 3903
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: 3903
      initialDelaySeconds: 10
      periodSeconds: 15
    # Prometheus scrapes the admin port (3903, /metrics): S3 request counts and block and table metrics
    commonLabels:
      prometheus-scrape: "true"
    monitoring:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
    # The namespace enforces PodSecurity privileged, but keep the pods restricted like their neighbours
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
    image:
      repository: mirror.gcr.io/dxflrs/garage
      # renovate: datasource=docker depName=dxflrs/garage
      tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    garage:
      replicationFactor: "3"
      s3:
        api:
          region: garage
      # rpcSecret and adminToken, generated by External Secrets (k8s/infra/secret-store/), copied by external-secrets.yaml
      secret:
        create: false
        name: garage-secrets
    persistence:
      enabled: true
      meta:
        storageClass: lvm-fast
        size: 2Gi
      data:
        # lvm-bulk is not on every node (talos-tba-msi has only its system SATA disk)
        storageClass: lvm-fast
        # Keep this equal to CAPACITY in configure.sh.
        size: 100Gi
    # Off: the chart's job assigns garage-0 only. layout-job.yaml assigns the three nodes and creates the bucket and key.
    clusterConfig:
      enabled: false
