# Sets up the Garage layout (three nodes, one zone each), the zot bucket and the zot key. Safe to run twice; to run it again,
# delete the Job and let Flux recreate it.
# The Garage image has no shell, so its binary is copied into a busybox image through a static busybox, as the chart's job does.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-layout
  namespace: registry-system
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: garage
    app.kubernetes.io/component: layout
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        # joins the Garage network policy (RPC and admin ports between Garage's own pods)
        app.kubernetes.io/name: garage
        app.kubernetes.io/instance: garage
        app.kubernetes.io/component: layout
    spec:
      restartPolicy: OnFailure
      serviceAccountName: garage
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: get-busybox-tools
          image: mirror.gcr.io/library/busybox:1.38-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
          command:
            - /bin/sh
            - -c
            - cp /bin/busybox /tools/busybox && chmod +x /tools/busybox
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              memory: 50Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
        - name: get-garage-bin
          image: mirror.gcr.io/dxflrs/garage:v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
          command:
            - /tools/busybox
            - cp
            - /garage
            - /shared/garage
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 100Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: garage-bin
              mountPath: /shared
      containers:
        - name: configure
          image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - /bin/sh
            - /scripts/configure.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: rpcSecret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: adminToken
            - name: KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3-key
                  key: access-key-id
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-key
                  key: secret-access-key
          volumeMounts:
            - name: garage-bin
              mountPath: /shared
            - name: configure-script
              mountPath: /scripts
      volumes:
        - name: tools
          emptyDir: {}
        - name: garage-bin
          emptyDir: {}
        - name: configure-script
          configMap:
            name: garage-layout
