# Garage's RPC secret and admin token (garage-secrets) and the S3 key of zot (garage-s3-key), generated once in
# k8s/infra/secret-store/ and copied here.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: registry-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: zot-garage-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-key
  namespace: registry-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: garage-s3-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: zot-garage-s3-key
