---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - daemonset.yaml
  - service.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: zot-edge-config
    namespace: registry-system
    options:
      disableNameSuffixHash: true
    files:
      - config.json=zot-edge.json
