# Not named zot: Helm would delete it with the chart's own ServiceMonitor on upgrade.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zot-metrics
  namespace: registry-system
  labels:
    app.kubernetes.io/component: metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: zot
      app.kubernetes.io/name: zot
  namespaceSelector:
    matchNames:
      - registry-system
  endpoints:
    - port: zot
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        # the certificate has the registry's DNS names, not the pod IP
        insecureSkipVerify: true
