---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: registry-system
spec:
  chartRef:
    kind: OCIRepository
    name: zot
  releaseName: zot
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    disableWait: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/project-zot/helm-charts/blob/main/charts/zot/values.yaml
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    podLabels:
      prometheus-scrape: "true"
    mountConfig: true
    service:
      type: ClusterIP
      port: 5000
    # Scale-out cluster (https://zotregistry.dev/v2.1.23/articles/scaleout/): every replica shares the Garage object
    # store and the Valkey cache and owns the repositories its hash of the repo path maps to; a request that lands on
    # another replica is proxied to the owner. One replica per node; more only need a bigger "members" list in zot.json
    # and the same number here. Not self-healing: while a replica is down, the repositories it owns are unavailable.
    replicaCount: 3
    # headless Service zot-headless: the stable per-pod names used as cluster members
    serviceHeadless:
      enabled: true
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: zot
            app.kubernetes.io/instance: zot
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # todo: consider VPA
    image:
      repository: ghcr.io/project-zot/zot
      pullPolicy: IfNotPresent
      tag: "v2.1.23@sha256:9d3de83ac2099e6f4843045b4c9b65b7e8baf40f92d28f54906dee9d4d390fd7"
    # The images are in Garage; the volume only holds zot's local root directory. It stays (a StatefulSet cannot drop or
    # resize its volumeClaimTemplates), local-path only allocates what is written.
    persistence: true
    pvc:
      create: true
      accessModes:
        - "ReadWriteOnce"
      storage: 150Gi
      storageClassName: lvm-fast # a real 150Gi volume
    configFiles: ~
    # https://docs.giantswarm.io/tutorials/registry/zot/
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 2Gi
    env:
      - name: GOGC
        value: "50"
      - name: GOMEMLIMIT
        # ~80% of the memory limit
        value: 1600MiB
      - name: ZOT_CREDENTIALS_FILE
        value: "/run/secrets/github_auth"
      # the S3 key of the Garage store (garage-s3-key, k8s/infra/registry-system/garage/); the S3 driver reads the AWS variables
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: garage-s3-key
            key: access-key-id
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: garage-s3-key
            key: secret-access-key
    metrics:
      enabled: true
      # the chart's ServiceMonitor forces basicAuth and HTTP, but zot has no auth and serves TLS
      serviceMonitor:
        enabled: false
    externalSecrets:
      - secretName: zot-sync-creds
        mountPath: /etc/zot/sync
    extraVolumes:
      - name: tmp
        emptyDir: {}
      - name: zot-certs
        secret:
          secretName: zot-tls-cert
    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: zot-certs
        mountPath: /etc/zot/certs
        readOnly: true
    httpGet:
      scheme: HTTPS
      port: 5000
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: zot
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
          - target:
              kind: StatefulSet
              name: zot
            patch: |
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  # logs to stdout; all state is on the PVC at /var/lib/registry
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
