# The shared cache and metadata store of the zot cluster (storage.cacheDriver in zot/zot.json). One instance, no password:
# the namespace policy lets only zot reach it. A small volume keeps the metadata across restarts (AOF).
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: registry-system
  labels:
    app.kubernetes.io/name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
          imagePullPolicy: IfNotPresent
          command: ["valkey-server"]
          args: ["--dir", "/data", "--appendonly", "yes", "--protected-mode", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: tcp
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
