---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m # a rollout takes ~7m, over the 5m default
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  chartRef:
    kind: OCIRepository
    name: cilium
  driftDetection:
    mode: enabled
  # https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
  values:
    authentication:
      mutual:
        spire:
          install:
            initImage:
              repository: mirror.gcr.io/library/busybox
    cluster:
      name: ${CLUSTER_NAME:=default}
      id: ${CLUSTER_ID:=0}
    ipv4:
      enabled: true
    ipv6:
      enabled: false
    # holds only Secrets (the VM poll tokens); the label satisfies require-namespace-psa-enforce
    secretsNamespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    ipam:
      mode: kubernetes
    enableLBIPAM: false
    l2announcements:
      enabled: false
    updateStrategy:
      rollingUpdate:
        maxUnavailable: ${CILIUM_MAX_UNAVAILABLE:=2}
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: ${CILIUM_CPU_REQUEST:=100m}
        memory: ${CILIUM_MEMORY_REQUEST:=256Mi}

    rollOutCiliumPods: true
    bandwidthManager:
      enabled: true
      # runner uploads to ghcr.io ran at ~6 Mbit/s with the default CUBIC; needs kernel >= 5.18
      bbr: true
    envoy:
      updateStrategy:
        rollingUpdate:
          maxUnavailable: ${CILIUM_MAX_UNAVAILABLE:=2}
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 20m
          memory: 64Mi
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    hubble:
      metrics:
        enabled:
          - drop:destinationContext=dns|workload-name;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
          - tcp
          - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
        enableOpenMetrics: true
        serviceMonitor:
          enabled: true
          interval: 60s
      relay:
        enabled: true
        podDisruptionBudget:
          enabled: false
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 5m
            memory: 64Mi
        tls:
          server:
            enabled: true
            mtls: true
      ui:
        enabled: true
        backend:
          livenessProbe:
            enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        frontend:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
        service:
          annotations:
            omni-kube-service-exposer.sidero.dev/port: "50081"
            omni-kube-service-exposer.sidero.dev/icon: 
            omni-kube-service-exposer.sidero.dev/label: Hubble
            omni-kube-service-exposer.sidero.dev/prefix: hubble
      tls:
        auto:
          enabled: true
          method: certmanager
          certValidityDuration: 30 # days
          certManagerIssuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: certificate-cluster-issuer
    clustermesh:
      apiserver:
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
        tls:
          auto:
            enabled: true
            method: certmanager
            certValidityDuration: 30 # days
            certManagerIssuerRef:
              group: cert-manager.io
              kind: ClusterIssuer
              name: certificate-cluster-issuer
    operator:
      replicas: ${CILIUM_OPERATOR_REPLICAS:=2}
      updateStrategy:
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: ${CILIUM_MAX_UNAVAILABLE:=50%}
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 50%
      prometheus:
        metricsService: true
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 60s
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: ${CILIUM_OPERATOR_CPU_REQUEST:=100m}
          memory: ${CILIUM_OPERATOR_MEMORY_REQUEST:=256Mi}
    prometheus:
      metricsService: true
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
        interval: 60s
    dashboards:
      enabled: true
    kubeProxyReplacement: true
    # on despite costing 25 to 40% on 1 Gbit (#1144, #1153): off does not speed up the slow paths via talos-11a-esj
    encryption:
      enabled: true
      type: wireguard
    k8sServiceHost: localhost # Talos KubePrism (patches/05-kubeprism.yaml)
    k8sServicePort: 7445
    routingMode: "native"
    autoDirectNodeRoutes: true
    # physical NICs only: auto-detecting the siderolink tunnel (MTU 1280) would cap the pod MTU
    devices:
      - "en+"
      - "eth+"

    enableIPv4Masquerade: true
    ipMasqAgent:
      enabled: false
    ipv4NativeRoutingCIDR: "10.244.0.0/16"
    egressGateway:
      enabled: false
    bpf:
      masquerade: true
    # host-network pods are not endpoints, so this does not cover them
    policyEnforcementMode: always
    policyAuditMode: false # NEVER SET THIS TO TRUE IN PRODUCTION, as it will disable all network policies and allow all traffic
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
  # the chart exposes no value for the Hubble UI container security contexts
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hubble-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hubble-ui
                namespace: kube-system
              spec:
                template:
                  spec:
                    containers:
                      - name: frontend
                        securityContext:
                          readOnlyRootFilesystem: true
                      - name: backend
                        securityContext:
                          readOnlyRootFilesystem: true
