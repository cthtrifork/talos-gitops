apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hubble-ui-client-certs
  namespace: kube-system
spec:
  commonName: '*.hubble-ui.cilium.io'
  dnsNames:
  - '*.hubble-ui.cilium.io'
  duration: 2160h0m0s
  isCA: false
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: certificate-cluster-issuer
  privateKey:
    rotationPolicy: Always
  secretName: hubble-ui-client-certs
  usages:
  - signing
  - key encipherment
  - client auth
