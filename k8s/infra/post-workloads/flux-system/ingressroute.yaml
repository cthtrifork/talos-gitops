# Only /hook/ is routed; the path is a hash of the token and requests need a valid GitHub HMAC signature.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`flux-hook.portableinfo.cloud`) && PathPrefix(`/hook/`)
      middlewares:
        - name: flux-hook-ratelimit
        - name: flux-hook-bodylimit
      services:
        - name: webhook-receiver
          port: 80
