# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
# One instance, no backups. CNPG generates the credentials in the Secret dependency-track-db-app, which the release reads.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dependency-track-db
  namespace: security-system
spec:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=docker
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-system-trixie@sha256:789b58fff514c28a42844962951c0556cedecaa8d3f35678bc86162fddad9f18
  instances: 1
  # A single instance has nothing to fail over to, so the default PDB (minAvailable 1) only blocks node drains and Talos upgrades.
  enablePDB: false
  enableSuperuserAccess: false
  storage:
    size: 20Gi
    storageClass: lvm-fast
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: dtrack
      owner: dtrack
      encoding: UTF8
  inheritedMetadata:
    labels:
      prometheus-scrape: "true"
  monitoring:
    enablePodMonitor: true
