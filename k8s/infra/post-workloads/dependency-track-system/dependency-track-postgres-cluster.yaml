# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
# One instance, no backups. The release logs in with a client certificate (dependency-track-db-certificate.yaml); the
# dtrack role has no usable password. The CNPG Secret dependency-track-db-app still holds the old one, unused: the release
# gets a placeholder from its own values.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dependency-track-db
  namespace: dependency-track-system
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  instances: 1
  # A single instance has nothing to fail over to, so the default PDB (minAvailable 1) only blocks node drains and Talos upgrades.
  enablePDB: false
  enableSuperuserAccess: false
  storage:
    size: 20Gi
    storageClass: lvm-fast
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: dtrack
      owner: dtrack
      encoding: UTF8
  inheritedMetadata:
    labels:
      prometheus-scrape: "true"
  managed:
    roles:
      - name: dtrack
        ensure: present
        login: true
        disablePassword: true
  certificates:
    serverTLSSecret: dependency-track-db-server
    serverCASecret: dependency-track-db-ca
    clientCASecret: dependency-track-db-ca
    replicationTLSSecret: dependency-track-db-replication
  postgresql:
    pg_hba:
      # Before CNPG's default "host all all all scram-sha-256" rule; cert auth matches CN against the role name.
      - hostssl dtrack dtrack all cert
  monitoring:
    enablePodMonitor: true
