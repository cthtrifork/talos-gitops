# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
# One instance, no backups. The release logs in with the password in the Secret dependency-track-db-app (created by CNPG).
# The TLS certificates come from cert-manager (dependency-track-db-certificate.yaml); a client-certificate login is not in use.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dependency-track-db
  namespace: dependency-track-system
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  instances: 1
  # A single instance has nothing to fail over to, so the default PDB (minAvailable 1) only blocks node drains and Talos upgrades.
  enablePDB: false
  enableSuperuserAccess: false
  storage:
    size: 20Gi
    storageClass: lvm-fast
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: dtrack
      owner: dtrack
      encoding: UTF8
  inheritedMetadata:
    labels:
      prometheus-scrape: "true"
  managed:
    roles:
      - name: dtrack
        ensure: present
        login: true
        # Sets the password back from the Secret after the client-certificate attempt cleared it.
        passwordSecret:
          name: dependency-track-db-app
  certificates:
    serverTLSSecret: dependency-track-db-server
    serverCASecret: dependency-track-db-ca
    clientCASecret: dependency-track-db-ca
    replicationTLSSecret: dependency-track-db-replication
  monitoring:
    enablePodMonitor: true
