---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: reloader
  driftDetection:
    mode: enabled
  # https://github.com/stakater/Reloader/blob/master/deployments/kubernetes/chart/reloader/values.yaml
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/stakater/reloader versioning=docker
      tag: v1.4.25@sha256:db8b1818f5da373ab85c05b30220fcae80a9ac0532052e6d68a6a5999111f18f
    reloader:
      watchGlobally: true
      reloadOnCreate: true # the optional API key Secrets are created by a CronJob after the pods start
      # not env vars: STAKATER_<NAME>_SECRET trips Polaris' sensitiveContainerEnvVar
      reloadStrategy: annotations
      # the alert ReloaderReloadFailed needs the metrics; prometheus-scrape opens port 9090 to Prometheus (CiliumClusterwideNetworkPolicy)
      podMonitor:
        enabled: true
        interval: 30s
      deployment:
        labels:
          prometheus-scrape: "true"
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
