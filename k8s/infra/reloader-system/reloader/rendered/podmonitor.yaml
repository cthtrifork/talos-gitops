apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app: reloader-reloader
    release: "reloader"
    app.kubernetes.io/name: reloader
    app.kubernetes.io/instance: "reloader"
    helm.sh/chart: "reloader-2.2.21"
    chart: "reloader-2.2.21"
    heritage: "Helm"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "v1.4.25"
  name: reloader-reloader
  namespace: reloader-system
spec:
  podMetricsEndpoints:
    - port: http
      path: "/metrics"
      interval: 30s
      honorLabels: true
  jobLabel: reloader-reloader
  namespaceSelector:
    matchNames:
      - reloader-system
  selector:
    matchLabels:
      app: reloader-reloader
      release: "reloader"
