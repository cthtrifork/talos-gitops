# Same as claude-vm/externalsecret.yaml: CDI pull credentials derived from claude-system/ghcr-pull (the package is private).
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-cdi
  namespace: homeserver-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homeserver-vm-source
  target:
    name: ghcr-pull-cdi
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accessKeyId: >-
          {{ $a := index ((.dockerconfig | fromJson).auths) "ghcr.io" }}{{ if $a.username }}{{ $a.username }}{{ else }}{{ $a.auth | b64dec | splitList ":" | first }}{{ end }}
        secretKey: >-
          {{ $a := index ((.dockerconfig | fromJson).auths) "ghcr.io" }}{{ if $a.password }}{{ $a.password }}{{ else }}{{ $a.auth | b64dec | splitList ":" | rest | join ":" }}{{ end }}
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: ghcr-pull
        property: .dockerconfigjson
