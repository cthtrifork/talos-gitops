# World egress is open at the pod level on purpose: general-purpose box (bootc upgrade, pinggy, pulls, dnf).
# The namespace is exempt from deny-world-egress.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-default-deny
  namespace: homeserver-vm
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-egress
  namespace: homeserver-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: homeserver-vm
  egress:
    # Everything else, including vm-upgrade.portableinfo.cloud. The poll authenticates itself with the token from the virtiofs share.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
---
# CDI importer pod (pulls the containerDisk from ghcr.io; the CDI controller reads its progress)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-cdi-importer-egress
  namespace: homeserver-vm
spec:
  endpointSelector:
    matchLabels:
      app: containerized-data-importer
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cdi
            k8s:cdi.kubevirt.io: cdi-deployment
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
---
# SSH from the LAN only
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-ssh
  namespace: homeserver-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: homeserver-vm
  ingress:
    - fromCIDRSet:
        - cidr: 192.168.1.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
