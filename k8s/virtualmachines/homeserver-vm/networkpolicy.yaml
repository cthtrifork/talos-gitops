# World egress is open at the pod level on purpose: general-purpose box (bootc upgrade, pinggy, pulls, dnf).
# The namespace is exempt from deny-world-egress.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-default-deny
  namespace: homeserver-vm
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-egress
  namespace: homeserver-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: homeserver-vm
  egress:
    # vm-upgrade.portableinfo.cloud (LAN LoadBalancer address): Envoy sets X-Upgrade-Token from the Cilium secret,
    # so the VM never holds the token and cannot send another VM's
    - toCIDRSet:
        - cidr: 192.168.1.244/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - headerMatches:
                  - name: X-Upgrade-Token
                    mismatch: REPLACE
                    secret:
                      namespace: cilium-secrets
                      name: homeserver-vm-upgrade-token
    # The same poll through the ClusterIP (10.102.95.157): Cilium translates a ClusterIP before the L7 redirect, so Envoy
    # sees the pod and its reply comes back through the proxy, which a LoadBalancer address does not (see the service).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-vm-upgrade
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
          rules:
            http:
              - headerMatches:
                  - name: X-Upgrade-Token
                    mismatch: REPLACE
                    secret:
                      namespace: cilium-secrets
                      name: homeserver-vm-upgrade-token
    # Everything else. Not toEntities world: it would also select the vm-upgrade address and add an unrestricted rule
    # for the L7 rule above.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 192.168.1.244/32
---
# CDI importer pod (pulls the containerDisk from ghcr.io; the CDI controller reads its progress)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-cdi-importer-egress
  namespace: homeserver-vm
spec:
  endpointSelector:
    matchLabels:
      app: containerized-data-importer
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cdi
            k8s:cdi.kubevirt.io: cdi-deployment
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
---
# SSH from the LAN only
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-ssh
  namespace: homeserver-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: homeserver-vm
  ingress:
    - fromCIDRSet:
        - cidr: 192.168.1.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
---
# Replies of the vm-upgrade pod to the VM's polls. The L7 rule for 192.168.1.244:80 sends them through Cilium's Envoy, so the
# reply has no connection state on this endpoint and the default-deny ingress drops it (SYN-ACK to the ephemeral client port).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeserver-vm-upgrade-replies
  namespace: homeserver-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: homeserver-vm
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-vm-upgrade
