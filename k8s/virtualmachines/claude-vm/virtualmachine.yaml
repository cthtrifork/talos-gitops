# claude-vm-bootc as a KubeVirt VM (https://github.com/cthtrifork/homeserver-bootc, docs/claude-vm).
# The disk is imported once; after that the VM updates itself with `bootc upgrade`, so changing the DataVolume source
# does not touch the running disk. Claude login and signing key are set up by hand over SSH on first boot.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: claude-vm
  namespace: claude-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: claude-vm
    spec:
      # Only nodes with /dev/kvm (virt-handler labels them schedulable)
      nodeSelector:
        kubevirt.io/schedulable: "true"
      # The guest cannot reach kube-dns, so DHCP hands it the LAN router.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 192.168.1.1
      domain:
        cpu:
          cores: 2
        memory:
          guest: 8Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false # the bootc image is not signed for Secure Boot
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            # shows up as /dev/disk/by-id/virtio-workspace (mounted by externalsecret.yaml)
            - name: workspace
              disk:
                bus: virtio
              serial: workspace
            - name: cloudinitdisk
              disk:
                bus: virtio
          # Poll token, updated live (virtiofs), so rotating it needs no restart
          filesystems:
            - name: upgrade-token
              virtiofs: {}
          interfaces:
            - name: default
              masquerade: {}
              # without a ports list masquerade forwards every port; only sshd should be reachable
              ports:
                - port: 22
                  protocol: TCP
        resources:
          requests:
            memory: 8Gi
          limits:
            memory: 9Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: upgrade-token
          secret:
            secretName: vm-upgrade-token
        - name: rootdisk
          dataVolume:
            name: claude-vm-rootdisk
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-vm-workspace-disk
        # cloud-init user data from Secret claude-vm-cloud-init (externalsecret.yaml); the pod waits in ContainerCreating until it exists.
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: claude-vm-cloud-init
  dataVolumeTemplates:
    - metadata:
        name: claude-vm-rootdisk
      spec:
        source:
          registry:
            # Default pull method on purpose: "node" would start a pod with this tag-only image, which the
            # require-image-digest policy denies.
            url: docker://ghcr.io/cthtrifork/homeserver-bootc/claude-vm-containerdisk:latest
            secretRef: ghcr-pull-cdi # the package is public today; this keeps the import working if it goes private
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: lvm-fast
          resources:
            requests:
              storage: 60Gi # keep in step with config-claude-vm.toml in homeserver-bootc
