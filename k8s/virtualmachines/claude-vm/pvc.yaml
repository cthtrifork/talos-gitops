# The workspace of the claude user (~/workspace), like /workspace of the claude-rc pod (k8s/apps/claude-system/pvc.yaml): clones and scratch that survive a restart
# and a re-import of the rootdisk, 50Gi on lvm-fast. A raw block volume the guest sees as a blank virtio disk (the cloud-init script in externalsecret.yaml formats it).
# A plain PVC, not a CDI DataVolume: a local volume lives on one node, and CDI placed blank disks wherever its importer pods ran, away from the rootdisk. A PVC waits
# for its first consumer (lvm-fast is WaitForFirstConsumer), so the scheduler puts it on the node the rootdisk pins the pod to.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-vm-workspace-disk
  namespace: claude-vm
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: lvm-fast
  resources:
    requests:
      storage: 50Gi
