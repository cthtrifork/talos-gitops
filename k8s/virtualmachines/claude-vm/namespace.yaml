---
apiVersion: v1
kind: Namespace
metadata:
  name: claude-vm
  labels:
    # virt-launcher needs more than "restricted" allows (NET_BIND_SERVICE, /dev/kvm device)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    # Elevate page: delete the virt-launcher pod to restart the VM, and the storage tier to re-import the rootdisk (delete the DataVolume and its PVC: the disk is
    # replaced by a fresh import, so this loses the VM's state). No debug.
    claude-elevate/ops: "true"
    claude-elevate/storage: "true"
