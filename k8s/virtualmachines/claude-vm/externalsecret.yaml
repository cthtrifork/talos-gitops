# CDI reads registry credentials from a Secret with the keys accessKeyId and secretKey. This builds it from the Docker config
# in claude-system/ghcr-pull (a read:packages token, see the root readme.md), so no second copy of the token lives in Git.
# Works for a config with username/password and for one with only the base64 "auth" (user:token) field.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-cdi
  namespace: claude-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: claude-vm-source
  target:
    name: ghcr-pull-cdi
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accessKeyId: >-
          {{ $a := index ((.dockerconfig | fromJson).auths) "ghcr.io" }}{{ if $a.username }}{{ $a.username }}{{ else }}{{ $a.auth | b64dec | splitList ":" | first }}{{ end }}
        secretKey: >-
          {{ $a := index ((.dockerconfig | fromJson).auths) "ghcr.io" }}{{ if $a.password }}{{ $a.password }}{{ else }}{{ $a.auth | b64dec | splitList ":" | rest | join ":" }}{{ end }}
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: ghcr-pull
        property: .dockerconfigjson
---
# The VM acts as the same GitHub App as the claude pod: claude-system/claude-github-app (app-id, installation-id, private-key.pem). This
# builds the cloud-init user data that runs claude-vm-seed-github-app on first boot (homeserver-bootc docs/claude-vm, "Seeding with
# cloud-init"). The key is base64 in the user data so its line breaks survive the YAML. cloud-init runs it once per instance.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-vm-cloud-init
  namespace: claude-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: claude-vm-source
  target:
    name: claude-vm-cloud-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        userdata: |
          #cloud-config
          write_files:
            - path: /run/claude-vm-seed.pem
              permissions: "0600"
              encoding: b64
              content: {{ .privatekey | b64enc }}
          runcmd:
            - [claude-vm-seed-github-app, claude, "{{ .appid | trim }}", "{{ .installid | trim }}", /run/claude-vm-seed.pem]
            - [rm, -f, /run/claude-vm-seed.pem]
  data:
    - secretKey: appid
      remoteRef:
        key: claude-github-app
        property: app-id
    - secretKey: installid
      remoteRef:
        key: claude-github-app
        property: installation-id
    - secretKey: privatekey
      remoteRef:
        key: claude-github-app
        property: private-key.pem
