# CDI wants accessKeyId/secretKey; this derives them from claude-system/ghcr-pull so no second copy of the token lives in
# Git. Handles both username/password and base64 "auth" configs.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-cdi
  namespace: claude-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: claude-vm-source
  target:
    name: ghcr-pull-cdi
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accessKeyId: >-
          {{ $a := index ((.dockerconfig | fromJson).auths) "ghcr.io" }}{{ if $a.username }}{{ $a.username }}{{ else }}{{ $a.auth | b64dec | splitList ":" | first }}{{ end }}
        secretKey: >-
          {{ $a := index ((.dockerconfig | fromJson).auths) "ghcr.io" }}{{ if $a.password }}{{ $a.password }}{{ else }}{{ $a.auth | b64dec | splitList ":" | rest | join ":" }}{{ end }}
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: ghcr-pull
        property: .dockerconfigjson
---
# Cloud-init user data that seeds the same GitHub App as the claude pod (claude-system/claude-github-app) on first boot.
# The key is base64 so its line breaks survive the YAML.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-vm-cloud-init
  namespace: claude-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: claude-vm-source
  target:
    name: claude-vm-cloud-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        userdata: |
          #cloud-config
          write_files:
            - path: /run/claude-vm-seed.pem
              permissions: "0600"
              encoding: b64
              content: {{ .privatekey | b64enc }}
            # ~/workspace of the claude user survives restarts and rootdisk re-imports; formatted on first boot.
            - path: /etc/fstab
              append: true
              content: |
                /dev/disk/by-id/virtio-workspace  /var/home/claude/workspace  xfs  defaults,nofail,x-systemd.growfs,x-systemd.device-timeout=10s  0 0
            - path: /var/lib/claude-vm-workspace.sh
              permissions: "0755"
              content: |
                #!/bin/sh
                set -eu
                ws=/dev/disk/by-id/virtio-workspace
                [ -b "$ws" ] || { echo "$ws is missing, skipped" >&2; exit 0; }
                blkid "$ws" >/dev/null 2>&1 || mkfs.xfs -q "$ws"
                systemctl daemon-reload
                mkdir -p /var/home/claude/workspace
                mount /var/home/claude/workspace
                chown 1100:1100 /var/home/claude/workspace
                restorecon -RF /var/home/claude/workspace || true
          runcmd:
            - [claude-vm-seed-github-app, claude, "{{ .appid | trim }}", "{{ .installid | trim }}", /run/claude-vm-seed.pem]
            - [/var/lib/claude-vm-workspace.sh]
            - [rm, -f, /run/claude-vm-seed.pem]
  data:
    - secretKey: appid
      remoteRef:
        key: claude-github-app
        property: app-id
    - secretKey: installid
      remoteRef:
        key: claude-github-app
        property: installation-id
    - secretKey: privatekey
      remoteRef:
        key: claude-github-app
        property: private-key.pem
