# World egress is open at the pod level on purpose: the VM's own gateway (nftables + nginx + dnsmasq) restricts the
# agent users to homeserver-bootc build_files/claude-vm/egress-allowlist.txt. The namespace is exempt from deny-world-egress.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-default-deny
  namespace: claude-vm
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-egress
  namespace: claude-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: claude-vm
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # otel.portableinfo.cloud (LAN LoadBalancer address)
    - toCIDRSet:
        - cidr: 192.168.1.243/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Everything else, including vm-upgrade.portableinfo.cloud (192.168.1.244:80); the VM's own gateway filters. No L7 rule
    # there: the poll carries the X-Upgrade-Token the VM reads from the virtiofs share of Secret vm-upgrade-token
    # (virtualmachine.yaml). An Envoy redirect to a LoadBalancer address backed by a pod made the pod's replies bypass Envoy,
    # so the VM reset them.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
---
# CDI importer pod (pulls the containerDisk from ghcr.io)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-cdi-importer-egress
  namespace: claude-vm
spec:
  endpointSelector:
    matchLabels:
      app: containerized-data-importer
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
---
# SSH from the LAN only
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-ssh
  namespace: claude-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: claude-vm
  ingress:
    - fromCIDRSet:
        - cidr: 192.168.1.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
