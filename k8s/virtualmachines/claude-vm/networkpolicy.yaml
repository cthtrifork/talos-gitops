# Default deny both ways, then what the VM needs. Egress to the world is open at the pod level on purpose: the VM runs its own
# egress gateway (nftables + nginx + dnsmasq) that only lets the agent users reach the hosts in homeserver-bootc
# build_files/claude-vm/egress-allowlist.txt. The claude-vm namespace is exempt from the deny-world-egress policy for this.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-default-deny
  namespace: claude-vm
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-egress
  namespace: claude-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: claude-vm
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Telemetry (otel.portableinfo.cloud) and the Update VMs poll (vm-upgrade.portableinfo.cloud): LoadBalancer addresses on the LAN
    - toCIDRSet:
        - cidr: 192.168.1.243/32
        - cidr: 192.168.1.244/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Everything else outside the cluster; the VM's own gateway does the filtering
    - toEntities:
        - world
---
# The CDI importer pod that fills the disk runs in this namespace too, and pulls the containerDisk from ghcr.io
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-cdi-importer-egress
  namespace: claude-vm
spec:
  endpointSelector:
    matchLabels:
      app: containerized-data-importer
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
---
# SSH from the LAN only (the Service is a MetalLB address with externalTrafficPolicy Local)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-vm-ssh
  namespace: claude-vm
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: claude-vm
  ingress:
    - fromCIDRSet:
        - cidr: 192.168.1.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
