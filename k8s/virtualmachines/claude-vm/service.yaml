---
apiVersion: v1
kind: Service
metadata:
  name: claude-vm-ssh
  namespace: claude-vm
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.246 # the pool does not auto-assign; free at the time of writing
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  selector:
    kubevirt.io/vm: claude-vm
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
