<text x="30" y="790" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Key facts</text>
<text x="30" y="810" font-size="12" fill="#475569" text-anchor="start">- The router accepts only clients whose certificate carries an allowed SPIFFE ID (kagent's controller, kubectl ate proxy). Actors reach the network only through atunnel and</text>
<text x="30" y="828" font-size="12" fill="#475569" text-anchor="start">  the egress gateway, which denies without a policy.</text>
<text x="30" y="850" font-size="12" fill="#475569" text-anchor="start">- kagent holds the Anthropic key at the gateway (credential provider grant for the kagent atespace), so the key never enters the actor. The charts are kagent's, so the data</text>
<text x="30" y="868" font-size="12" fill="#475569" text-anchor="start">  plane is agentgateway, as kagent expects. Renovate bumps the four charts as one pull request.</text>
<text x="30" y="890" font-size="12" fill="#475569" text-anchor="start">- Not built: the kagent release and namespace, a WorkerPool in kagent's namespace, an egress policy per actor, the microVM class, telemetry, backups.</text>
