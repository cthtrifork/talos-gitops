<text x="30" y="790" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Key facts</text>
<text x="30" y="810" font-size="12" fill="#475569" text-anchor="start">- Two ways to run Claude: the bare actor (scripts/ate-actor-test.sh, docs/substrate/claude-actor-runbook.md) and kagent (docs/substrate/kagent-claude-runbook.md). Overview and</text>
<text x="30" y="828" font-size="12" fill="#475569" text-anchor="start">  tradeoffs: docs/substrate/overview.md.</text>
<text x="30" y="850" font-size="12" fill="#475569" text-anchor="start">- Actors reach the network only through atunnel and atenet-egress, which denies without a policy. kagent's key is held at the gateway through the credential provider (grant:</text>
<text x="30" y="868" font-size="12" fill="#475569" text-anchor="start">  atespace kagent -> namespace kagent), so the actor never holds it.</text>
<text x="30" y="890" font-size="12" fill="#475569" text-anchor="start">- The router accepts only clients with an allowed SPIFFE ID (kagent's controller, kubectl ate proxy). Everything in the kagent namespace is privileged because the worker pool is</text>
<text x="30" y="908" font-size="12" fill="#475569" text-anchor="start">  there; its pods other than workers have default-deny Cilium policy.</text>
<text x="30" y="930" font-size="12" fill="#475569" text-anchor="start">- Not built: kagent's tools and UI authentication, a narrow policy for worker pods, the microVM class, telemetry, backups. Nothing here has run on the cluster.</text>
</svg>
