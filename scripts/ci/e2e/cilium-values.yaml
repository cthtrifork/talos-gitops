---
# What the e2e changes in the Cilium values of the real cluster (spec.values of k8s/infra/cilium/helm-release.yaml,
# which the workflow uses as the base). ${POD_IP} is filled in by envsubst.
# kind on the host network: the API server listens on the runner pod's IP, not on KubePrism
k8sServiceHost: "${POD_IP}"
k8sServicePort: 6443
# the pod CIDR of scripts/kind.yaml
ipv4NativeRoutingCIDR: "10.200.0.0/16"
operator:
  replicas: 1
  prometheus:
    serviceMonitor:
      enabled: false
# a fresh cluster has none of the allow policies of the real one
policyEnforcementMode: default
policyAuditMode: true
# the ServiceMonitor CRDs and cert-manager are not installed yet when Cilium is
prometheus:
  serviceMonitor:
    enabled: false
    trustCRDsExist: false
hubble:
  metrics:
    serviceMonitor:
      enabled: false
  tls:
    auto:
      method: helm
clustermesh:
  apiserver:
    tls:
      auto:
        method: helm
