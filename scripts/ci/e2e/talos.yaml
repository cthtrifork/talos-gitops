---
# Config patch of the e2e cluster (talosctl cluster create docker): the same networking as the real cluster minus the
# CNI, which the workflow installs. Image pulls go through zot with patches/11-zot-mirrors.yaml.
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/16
machine:
  network:
    extraHostEntries:
      # zot by name (the certificate is issued for it), reached through the relay on the Docker gateway of the runner pod
      - ip: 10.5.0.1
        aliases:
          - zot.registry-system.svc.cluster.local
