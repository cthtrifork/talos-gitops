---
# Config patch of the e2e cluster (talosctl cluster create docker): the same networking as the real cluster minus flannel
# and kube-proxy, which Cilium replaces (kubeProxyReplacement in the workflow). Image pulls go through zot with
# patches/11-zot-mirrors.yaml.
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.244.0.0/16
serviceSubnets:
  - 10.96.0.0/16
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
$patch: delete
