---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  disableDefaultCNI: true
  kubeProxyMode: "none" # Cilium replaces kube-proxy, as in the cluster
  apiServerPort: 6443
  # the node shares the runner pod's network namespace, so avoid the cluster's own ranges (10.244/16, 10.96/12) and the LAN
  serviceSubnet: "10.201.0.0/16"
  podSubnet: "10.200.0.0/16"
# kind finds no node IP on the host network ("invalid IP"), so the workflow envsubsts the runner pod's IP
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controlPlaneEndpoint: "${POD_IP}:6443"
  - |
    kind: InitConfiguration
    localAPIEndpoint:
      advertiseAddress: "${POD_IP}"
    nodeRegistration:
      kubeletExtraArgs:
        node-ip: "${POD_IP}"
nodes:
  - role: control-plane
    # Renovate tracks Docker Hub (no digests on mirror.gcr.io); the e2e pulls through zot and retags
    image: mirror.gcr.io/kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 # renovate: datasource=docker depName=docker.io/kindest/node versioning=docker
