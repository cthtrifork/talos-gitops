---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  disableDefaultCNI: true
  kubeProxyMode: "none" # Cilium replaces kube-proxy, as in the cluster
  apiServerPort: 6443
  # The node shares the network namespace of the runner pod (host network), which lives in the cluster's own ranges
  # (pods 10.244.0.0/16, services 10.96.0.0/12), so use ranges that do not overlap them (or the LAN, 192.168.1.0/24).
  serviceSubnet: "10.201.0.0/16"
  podSubnet: "10.200.0.0/16"
# On the host network kind finds no node IP ("invalid IP" for apiserver-advertise-address), so the workflow renders
# the runner pod's IP into this file (envsubst)
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controlPlaneEndpoint: "${POD_IP}:6443"
  - |
    kind: InitConfiguration
    localAPIEndpoint:
      advertiseAddress: "${POD_IP}"
    nodeRegistration:
      kubeletExtraArgs:
        node-ip: "${POD_IP}"
nodes:
  # A single node (control plane, schedulable) boots faster and needs less memory than control plane + worker.
  - role: control-plane
    # Renovate keeps the tag and digest current (Docker Hub: it cannot look up digests on mirror.gcr.io); the e2e pulls it through zot before kind starts
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
