# CLI tools the CI workflows and scripts use. One place for the versions; Renovate's mise manager keeps them current.
# Workflows install the subset they need with jdx/mise-action (install_args); locally, `mise install` gives the same set.
[tools]
yq = "4.54.3"
kubeconform = "0.8.0"
"github:fluxcd/flux-schema" = "0.18.0"
kustomize = "5.8.3"
helm = "4.3.2"
flux2 = "2.10.1"
"aqua:controlplaneio-fluxcd/flux-operator" = "0.64.0"
"aqua:cilium/cilium-cli" = "0.20.3"
actionlint = "1.7.12"
"pipx:yamllint" = "1.38.0"
talosctl = "1.14.7"
kind = "0.33.0"
kubectl = "1.37.0" # matches the kind node image in scripts/kind.yaml
