---
# Apply to the homelab control-plane machine set in Omni.
cluster:
  scheduler:
    config:
      apiVersion: kubescheduler.config.k8s.io/v1
      kind: KubeSchedulerConfiguration
      profiles:
        - schedulerName: default-scheduler
          pluginConfig:
            - name: NodeAffinity
              args:
                addedAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      preference:
                        matchExpressions:
                          - key: topology.homelab/rack
                            operator: In
                            # elaphant, hackyourfuture, and chainguard
                            values: [rack-0, rack-1, rack-3]
