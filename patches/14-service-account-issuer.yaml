---
# The service account issuer pods can reach. Talos sets it to the Omni endpoint of the cluster (https://[fdae:41e4:649b:9303::1]:10000), which only Omni's WireGuard
# network can reach, so a workload that verifies a service account token by fetching the issuer's discovery document (ate-api-server for kubectl-ate and other clients, see
# k8s/apps/ate-system/configmap.yaml) cannot. https://kubernetes.default.svc is the in-cluster API server, the issuer Substrate's own installer expects.
#
# - The first service-account-issuer signs new tokens; the second is still accepted, so tokens issued before the rollout keep verifying until they expire (an hour or less
#   for bound tokens, and kubelet refreshes them).
# - api-audiences is left alone: Talos sets it to the old URL, so the default audience of the tokens pods already use does not change.
# - jwks-uri points the discovery document at the in-cluster API server, not at the address of the node that answered.
# Applied through Omni like the other patches, one control plane node at a time (the API server restarts).
cluster:
  apiServer:
    extraArgs:
      service-account-issuer:
        - https://kubernetes.default.svc
        - https://[fdae:41e4:649b:9303::1]:10000
      service-account-jwks-uri: https://kubernetes.default.svc/openid/v1/jwks
