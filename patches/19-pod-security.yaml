# Default for namespaces without a pod-security.kubernetes.io/enforce label: kube-system (exempt), flux-system and empty system namespaces.
# Every namespace in k8s/ sets its own level, and the ValidatingAdmissionPolicy require-namespace-psa-enforce requires one.
# The API server restarts when this is applied.
---
cluster:
  apiServer:
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1alpha1
          kind: PodSecurityConfiguration
          defaults:
            enforce: baseline
            enforce-version: latest
            audit: restricted
            audit-version: latest
            warn: restricted
            warn-version: latest
          exemptions:
            namespaces:
              - kube-system
            runtimeClasses: []
            usernames: []
