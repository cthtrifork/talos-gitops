# Per machine, for talos-tba-msi only (docs/storage-plan.md, phase 1; the pilot is 14-lvm-2jc.yaml): replaces its local-path volume with the LVM volume group vg-fast
# for the OpenEBS LVM LocalPV driver. Order, data loss accepted: 1. apply in Omni; 2. reboot the node so the old volume unmounts; 3. merge the wipe Job
# (k8s/apps/disk-wipe, disk-wipe-talos-tba-msi-2); 4. Talos creates the raw partition and the group. Check with: talosctl -n 192.168.1.146 get pvs,vgs,lvmvalidationerrors.
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
$patch: delete
---
# The fast tier: the whole 1 TB NVMe once the old 200 GB partition is wiped (the 800 GB next to it is already free). The system disk is the SATA SSD.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-a
provisioning:
  diskSelector:
    match: disk.transport == 'nvme'
  minSize: 20GB
---
apiVersion: v1alpha1
kind: LVMVolumeGroupConfig
name: vg-fast
provisioning:
  volumeSelector:
    match: volume.partition_label.startsWith("r-lvm-fast")
