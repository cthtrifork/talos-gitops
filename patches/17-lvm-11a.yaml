---
# Fast tier: the unpartitioned 140 GB tail plus one volume per old partition (80, 80, 700 GB); one without a free region stays failed (harmless).
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-a
provisioning:
  diskSelector:
    match: disk.transport == 'nvme' && !system_disk
  minSize: 20GB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-b
provisioning:
  diskSelector:
    match: disk.transport == 'nvme' && !system_disk
  minSize: 20GB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-c
provisioning:
  diskSelector:
    match: disk.transport == 'nvme' && !system_disk
  minSize: 20GB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-d
provisioning:
  diskSelector:
    match: disk.transport == 'nvme' && !system_disk
  minSize: 20GB
---
# Bulk tier: the whole 4 TB USB disk
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-bulk-a
provisioning:
  diskSelector:
    match: disk.transport == 'usb'
  minSize: 20GB
---
apiVersion: v1alpha1
kind: LVMVolumeGroupConfig
name: vg-fast
provisioning:
  volumeSelector:
    match: volume.partition_label.startsWith("r-lvm-fast")
---
apiVersion: v1alpha1
kind: LVMVolumeGroupConfig
name: vg-bulk
provisioning:
  volumeSelector:
    match: volume.partition_label.startsWith("r-lvm-bulk")
