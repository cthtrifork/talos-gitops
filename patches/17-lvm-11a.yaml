# Per machine, for talos-11a-esj only (docs/storage-plan.md, phase 2; the pilot is 14-lvm-2jc.yaml): replaces its three local volumes (local-path 700 GB, local-storage 80 GB,
# local-storage-cache 80 GB, all on the data NVMe nvme1n1) with the LVM volume groups vg-fast (the data NVMe) and vg-bulk (the 4 TB USB disk) for the OpenEBS LVM LocalPV driver.
# Only while talos-tba-msi and talos-vt2-qp8 are Ready (11a is a control-plane node: one node at a time). Order, data loss accepted: 1. apply in Omni (the USB disk gets its
# raw partition at once, it is blank); 2. reboot the node so the old volumes unmount; 3. merge the wipe Job (k8s/apps/disk-wipe, disk-wipe-talos-11a-esj-2);
# 4. Talos creates the raw partitions in the freed space and builds the groups. Check with: talosctl -n 192.168.1.184 get pvs, then vgs, lvmvalidationerrors.
# What 11a holds is lost: zot (its image cache refills from upstream), the runner caches, gha-cache, Prometheus' data and others, until the PVC flips of phase 3.
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
$patch: delete
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-storage
$patch: delete
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-storage-cache
$patch: delete
---
# The fast tier: the data NVMe (not the system disk). Three raw volumes, one per old partition: if the wipe frees the three partitions one after the other each becomes
# one raw volume, and if the free space is one region the first takes it all and the other two stay failed (harmless).
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-a
provisioning:
  diskSelector:
    match: disk.transport == 'nvme' && !system_disk
  minSize: 20GB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-b
provisioning:
  diskSelector:
    match: disk.transport == 'nvme' && !system_disk
  minSize: 20GB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-fast-c
provisioning:
  diskSelector:
    match: disk.transport == 'nvme' && !system_disk
  minSize: 20GB
---
# The bulk tier: the whole 4 TB USB disk.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: lvm-bulk-a
provisioning:
  diskSelector:
    match: disk.transport == 'usb'
  minSize: 20GB
---
apiVersion: v1alpha1
kind: LVMVolumeGroupConfig
name: vg-fast
provisioning:
  volumeSelector:
    match: volume.partition_label.startsWith("r-lvm-fast")
---
apiVersion: v1alpha1
kind: LVMVolumeGroupConfig
name: vg-bulk
provisioning:
  volumeSelector:
    match: volume.partition_label.startsWith("r-lvm-bulk")
